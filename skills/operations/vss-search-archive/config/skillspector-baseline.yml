version: 2

# SkillSpector suppression baseline for skills/operations/vss-search-archive.
# Entries are scoped to one file and one matched-text pattern; line numbers are
# not used, so doc edits do not invalidate them.

rules:
  # --- Reviewed scanner false positives (temporary) -------------------------
  - id: "TM1"
    path: "evals/search.json"
    message: "DELETE /api/v1/*"
    reason: >-
      Reviewed false positive (temporary until the SkillSpector TM1 fix ships).
      The eval names Agent REST routes (DELETE /api/v1/videos/<id>) only to
      require that the agent not use them. It is not a file deletion command.

fingerprints: []
