services:
  main:
    depends_on:
      mock-vss-backend:
        condition: service_healthy
    environment:
      LVS_BACKEND_URL: http://localhost:38111
      VIDEO_SUMMARIZATION_URL: http://localhost:38111
      VLM_NAME: nim_nvidia_cosmos-reason2-8b_hf-1208
    network_mode: service:mock-vss-backend

  mock-vss-backend:
    build:
      context: ./mock-vss-backend
    expose:
      - "38111"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:38111/v1/ready', timeout=2)"
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s
