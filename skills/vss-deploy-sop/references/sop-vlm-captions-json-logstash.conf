# SOP JSON → Elasticsearch Logstash pipeline for DS-SOP.
#
# WHY: build-vision-agent's default ELK (integrate-elk.md → mdx-lvs-logstash.conf)
# decodes Kafka topic `mdx-vlm-captions` as NvSchema nv.VisionLLM PROTOBUF (tuned for
# RT-VLM). DS-SOP publishes FLAT JSON (SOP_MESSAGING_SCHEMA=JSON), which the protobuf
# codec cannot decode -> 0 docs in Elasticsearch. This pipeline consumes the same topic
# as JSON and indexes the records into mdx-vlm-captions-* with the flat field names the
# SOP Kibana dashboard expects (response.keyword, sensor_id.keyword, @timestamp).
#
# INSTALL: mount this file into the Logstash container and register it as its OWN
# pipeline-id in pipelines.yml (do NOT drop it into the same dir as mdx-lvs-logstash.conf
# — confs in one pipeline dir merge, and the protobuf filter would corrupt this JSON path):
#
#   # pipelines.yml (the kafka pipelines dir mounts FLAT to /usr/share/logstash/pipelines/ —
#   # no sub-dir; drop this .conf directly in the patched pipelines/kafka/ dir)
#   - pipeline.id: sop-vlm-captions-json
#     path.config: "/usr/share/logstash/pipelines/sop-vlm-captions-json-logstash.conf"
#
# The protobuf `mdx-lvs` pipeline keeps running in parallel on a different consumer group;
# in a SOP-only profile it simply finds no protobuf messages (harmless).
#
# NOTE: after install + `docker restart logstash`, this pipeline indexes mdx-vlm-captions-*
# with the flat fields (response, sensor_id, chunk_idx, @timestamp). The producer JSON carries
# `req_id` and `first_timestamp` (both used below) — easy to omit from a quick schema sketch,
# but required: req_id -> document_id (idempotent upsert), first_timestamp -> @timestamp.

input {
  kafka {
    topics                   => ["mdx-vlm-captions"]
    codec                    => "json"
    group_id                 => "logstash-sop-json"
    consumer_threads         => 4
    auto_offset_reset        => "earliest"
    decorate_events          => true
    key_deserializer_class   => "org.apache.kafka.common.serialization.StringDeserializer"
    bootstrap_servers        => "${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}"
  }
}

filter {
  # DS-SOP emits flat JSON. Anything that is not valid JSON on this topic (e.g. a stray
  # RT-VLM protobuf message if both producers ever share the topic) fails the json codec
  # and is dropped rather than indexed as garbage.
  if "_jsonparsefailure" in [tags] {
    drop {}
  }

  # Build @timestamp from the chunk's absolute end time (epoch seconds = first_timestamp +
  # end_time). Falls back to ingest time if the fields are absent.
  ruby {
    code => '
      ft = event.get("first_timestamp").to_f
      et = event.get("end_time").to_f
      if ft > 0
        event.set("event_time_ms", ((ft + et) * 1000.0).to_i)
      end
    '
  }
  if [event_time_ms] {
    date {
      match    => ["event_time_ms", "UNIX_MS"]
      target   => "@timestamp"
      timezone => "UTC"
    }
    mutate { remove_field => ["event_time_ms"] }
  }

  # checker_result arrives as a nested object; keep it but also surface a flat compliance
  # flag the dashboard can filter on.
  if [checker_result] {
    if [checker_result][cycle_completed] {
      mutate { add_field => { "sop_cycle_completed" => "%{[checker_result][cycle_completed]}" } }
    }
  }
}

output {
  elasticsearch {
    hosts        => ["http://${VSS_ES_HOST:localhost}:${VSS_ES_PORT:9200}"]
    index        => "mdx-vlm-captions-%{+YYYY.MM.dd}"
    # req_id is unique per chunk (e.g. "0001-<uuid>") -> idempotent upsert on Kafka redelivery.
    document_id  => "%{req_id}"
    action       => "index"
    retry_max_interval => 10
    timeout      => 60
  }
}
