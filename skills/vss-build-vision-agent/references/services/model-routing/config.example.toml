#
# Minimal two-tier Switchyard config, verified against v0.2.0:
#   switchyard-server --config config.toml --port 4000
#
# The schema belongs to Switchyard and moves with its releases. Check it against
# the version you build; v0.1.0 used a different, YAML-based form.
#
# VSS points LLM_NAME at a route id below, not at a model. See ./configure-vss.md.

schema_version = 1

[llm_clients.inference_hub]
format = "openai_chat"
base_url = "https://inference-api.nvidia.com/v1"
# The router holds the upstream credential, not VSS. Supply it to the router's
# environment. In CI use the key the deployment already has; do not introduce a
# new one for routing.
api_key_env = "NVIDIA_API_KEY"

[targets.capable]
id = "openai/openai/gpt-5.6-sol"
llm_client = "inference_hub"

[targets.efficient]
id = "openai/openai/gpt-5.6-luna"
llm_client = "inference_hub"

# Random split. Useful first: it proves routing works and gives a cost baseline
# before any classifier is involved.
[routes.random]
id = "switchyard/random"
type = "random"
targets = ["capable", "efficient"]

# All-weak control. Run the same work through this and through a split route;
# the difference is what routing bought.
[routes.control]
id = "switchyard/control"
type = "passthrough"
target = "efficient"
