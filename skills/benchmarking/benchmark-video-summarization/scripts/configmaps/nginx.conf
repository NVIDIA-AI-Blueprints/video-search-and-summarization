server {
    listen 80;
    # autoindex means a request for a directory without its trailing slash gets
    # nginx's directory-slash redirect, and nginx would absolutise that Location
    # using this listener's port rather than the Service port the caller used.
    # Relative resolves against the request URL and is right either way.
    absolute_redirect off;
    location /videos/ {
        root /usr/share/nginx/html;
        autoindex on;
        autoindex_format json;
    }
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
