name: vss
label: NVIDIA VSS
version: 0.2.0
# `backend` auto-loads across any HERMES_HOME without `hermes plugins enable`.
kind: backend
description: >
  Expose the `vss` CLI as a harness-neutral `vss_cli` agent tool matching the
  OpenClaw plugin contract ({args, cwd, timeoutSec}).
author: NVIDIA
requires_env: []
optional_env:
  - name: VSS_BIN
    description: "Path to the vss CLI binary."
    prompt: "vss CLI path (default /usr/local/bin/vss)"
    password: false
  - name: VSS_CLI_DEFAULT_TIMEOUT_SEC
    description: "Default timeout in seconds for a vss CLI call when the tool call does not set one."
    prompt: "Default vss CLI timeout seconds (default 600)"
    password: false
