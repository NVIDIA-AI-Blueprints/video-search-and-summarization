name: vss
label: NVIDIA VSS
version: 0.1.0
description: >
  Drive a live Video Search and Summarization deployment: the vss CLI as an
  agent tool. Mirrors the OpenClaw vss_cli tool (../../.openclaw/plugin) —
  same name, same {args, cwd, timeoutSec} schema, same no-shell subprocess
  exec, same {command, exitCode, signal, timedOut, stdout, stderr, truncated}
  result shape — so a skill written against "the vss_cli tool" is
  harness-neutral.
author: NVIDIA
requires_env: []
optional_env:
  - name: VSS_BIN
    description: "Path to the vss CLI binary."
    prompt: "vss CLI path (default /usr/local/bin/vss)"
    password: false
  - name: VSS_CLI_DEFAULT_TIMEOUT_SEC
    description: "Default timeout in seconds for a vss CLI call when the tool call does not set one."
    prompt: "Default vss CLI timeout seconds (default 600)"
    password: false
