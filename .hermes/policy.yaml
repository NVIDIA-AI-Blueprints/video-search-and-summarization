# The Hermes harness policy: the package hosts the agent installs from, and the
# VSS deployment the `vss` CLI reaches. The model host is authorized by the
# inference provider's profile, not here.
#
# Notes:
#   - The sections before `network_policies` are identical to boundary.yaml by
#     requirement, not by convention: the prover compares them verbatim.
#   - `binaries` names /usr/bin/python3.13, the interpreter. Every `hermes`
#     entry point in the image is a Python script, so no process ever carries
#     one of those paths.
#   - Every REST endpoint is `protocol: rest` with `rules:`. That alone makes
#     the proxy decrypt the HTTPS and check each method and path; leave `tls:`
#     out. A plain TCP grant is `protocol: tcp` and nothing else — no `access:`
#     or `rules:` — in a named policy of its own.

version: 1

filesystem_policy:
  read_only: [/usr, /bin, /sbin, /lib, /lib64, /etc, /opt, /proc]
  read_write: [/sandbox, /tmp, /dev/null, /dev/urandom]

landlock: {compatibility: best_effort}

# 998:999 is `sandbox` in the harness image. Root is not an option: the
# gateway rejects run_as_user "0" outright.
process: {run_as_user: "998", run_as_group: "999"}

network_policies:
  # The deployment, as the sandbox addresses it.
  vss-backend:
    name: vss-backend-readwrite
    endpoints:
      - {host: host.openshell.internal, port: 7777, protocol: tcp}
    binaries: [{path: /usr/bin/python3.13}]

  # The image ships no NGC CLI, so this never matches today; it is here for the
  # one operation skill that shells out to `ngc`.
  ngc:
    name: ngc
    endpoints:
      - {host: authn.nvidia.com, port: 443, protocol: tcp}
      - {host: api.ngc.nvidia.com, port: 443, protocol: tcp}
      - {host: xfiles.ngc.nvidia.com, port: 443, protocol: tcp}
    binaries: [{path: /usr/local/lib/ngc-cli/ngc}]

  pypi:
    name: pypi
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce        # audit-mode REST is `unsupported`, not a pass
        rules:
          - allow: {method: GET, path: "/**"}
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/**"}
      - host: pypi.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/**"}
    binaries: [{path: /usr/bin/python3.13}]

  github:
    name: github
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/**"}
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/**"}
    binaries: [{path: /usr/bin/python3.13}]
