# The Hermes harness policy: the agent's own model endpoint and the package
# hosts it installs from, and nothing else.
#
# Notes:
#   - `binaries` names /usr/bin/python3.13, the interpreter. Every `hermes`
#     entry point in the image is a Python script, so no process ever carries
#     one of those paths.
#   - Every endpoint is `protocol: rest` with `rules:`. That alone makes the
#     proxy decrypt the HTTPS and check each method and path; leave `tls:` out.

version: 1

filesystem_policy:
  read_only:  [/usr, /bin, /sbin, /lib, /lib64, /etc, /opt, /proc]
  read_write: [/sandbox, /tmp, /dev/null, /dev/urandom]

landlock: { compatibility: best_effort }

# 998:999 is `sandbox` in the harness image. Root is not an option: the
# gateway rejects run_as_user "0" outright.
process:  { run_as_user: "998", run_as_group: "999" }

network_policies:
  anthropic:
    name: anthropic
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce        # audit-mode REST is `unsupported`, not a pass
        rules:
          - allow: { method: POST, path: "/v1/**" }
    binaries: [{ path: /usr/bin/python3.13 }]

  pypi:
    name: pypi
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      - host: pypi.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
    binaries: [{ path: /usr/bin/python3.13 }]

  github:
    name: github
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
    binaries: [{ path: /usr/bin/python3.13 }]
