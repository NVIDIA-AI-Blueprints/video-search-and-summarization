# The ceiling a Hermes harness sandbox may be granted, written once by hand.
# Same filesystem paths, same process identity and the same exact binary paths
# as the candidate — the prover returns `unsupported` rather than a pass
# when either side generalises, because an image symlink could redirect it.
#
# Deliberately wider than the candidate where it matters: POST on each host as
# well as the candidate's GET.

version: 1

filesystem_policy:
  read_only: [/usr, /bin, /sbin, /lib, /lib64, /etc, /opt, /proc]
  read_write: [/sandbox, /tmp, /dev/null, /dev/urandom]

landlock: {compatibility: best_effort}

process: {run_as_user: "998", run_as_group: "999"}   # `sandbox` in the image

network_policies:
  harness-rest-max:
    name: harness-rest-max
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/**"}
          - allow: {method: POST, path: "/**"}
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/**"}
          - allow: {method: POST, path: "/**"}
      - host: pypi.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/**"}
          - allow: {method: POST, path: "/**"}
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/**"}
          - allow: {method: POST, path: "/**"}
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/**"}
          - allow: {method: POST, path: "/**"}
    binaries: [{path: /usr/bin/python3.13}]
