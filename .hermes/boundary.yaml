# Ceiling policy for openshell-prover check .hermes/policy.yaml --boundary .hermes/boundary.yaml.

version: 1

filesystem_policy:
  read_only: [/usr, /bin, /sbin, /lib, /lib64, /etc, /opt, /proc]
  read_write: [/sandbox, /tmp, /dev/null, /dev/urandom,
               /task, /output, /logs, /tests, /solution]

landlock: {compatibility: best_effort}

process: {run_as_user: "998", run_as_group: "999"}

network_policies:
  vss-backend-max:
    name: vss-backend-max
    endpoints:
      - {host: host.openshell.internal, port: 7777, protocol: tcp}
    binaries: [{path: /usr/bin/python3.13}, {path: /usr/bin/curl}]

  harness-rest-max:
    name: harness-rest-max
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/**"}
          - allow: {method: POST, path: "/**"}
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/**"}
          - allow: {method: POST, path: "/**"}
      - host: pypi.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/**"}
          - allow: {method: POST, path: "/**"}
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/**"}
          - allow: {method: POST, path: "/**"}
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/**"}
          - allow: {method: POST, path: "/**"}
    binaries: [{path: /usr/bin/python3.13}]
