# The ceiling VSS is willing to grant a Hermes harness sandbox, written once by
# hand. Same filesystem paths, same process identity and the same exact binary
# paths as the candidate — the prover returns `unsupported` rather than a pass
# when either side generalises, because an image symlink could redirect it.
#
# Deliberately wider than the candidate where it matters: every method on each
# host, rather than the candidate's per-path grants.
#
# L4 and REST endpoints must sit in separate named policies, and a plain TCP
# grant is `protocol: tcp` rather than `access: full` — `access` is an L7
# preset. Either mistake makes the prover report "mixes REST controls into L4
# authority" instead of a pass.

version: 1

filesystem_policy:
  read_only:  [/usr, /bin, /sbin, /lib, /lib64, /etc, /opt, /proc]
  read_write: [/sandbox, /tmp, /dev/null, /dev/urandom]

landlock: { compatibility: best_effort }

process:  { run_as_user: "998", run_as_group: "999" }   # `sandbox` in .hermes

network_policies:
  vss-backend-max:
    name: vss-backend-max
    endpoints:
      - { host: host.openshell.internal, port: 7777, protocol: tcp }
    binaries: [{ path: /usr/bin/python3.13 }]

  harness-rest-max:
    name: harness-rest-max
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: nousresearch.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: pypi.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/**" }
          - allow: { method: POST, path: "/**" }
    binaries: [{ path: /usr/bin/python3.13 }]

  ngc-max:
    name: ngc-max
    endpoints:
      - { host: authn.nvidia.com,      port: 443, protocol: tcp }
      - { host: api.ngc.nvidia.com,    port: 443, protocol: tcp }
      - { host: xfiles.ngc.nvidia.com, port: 443, protocol: tcp }
    binaries: [{ path: /usr/local/lib/ngc-cli/ngc }]
