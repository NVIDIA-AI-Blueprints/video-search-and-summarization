{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vllm.fullname" . }}
  labels:
    {{- include "vllm.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 2
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "vllm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.requestPolicy.enabled .Values.podAnnotations }}
      annotations:
        {{- if .Values.requestPolicy.enabled }}
        checksum/request-policy: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "vllm.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "vllm.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- $global := .Values.global | default dict }}
      {{- $imagePullSecrets := .Values.imagePullSecrets | default (index $global "imagePullSecrets") }}
      {{- with $imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: vllm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --model
            - {{ .Values.vllm.model | quote }}
            - --host
            - "0.0.0.0"
            - --port
            - {{ .Values.vllm.port | quote }}
            - --tensor-parallel-size
            - {{ .Values.vllm.tensorParallelSize | quote }}
            - --dtype
            - {{ .Values.vllm.dtype | quote }}
            - --gpu-memory-utilization
            - {{ .Values.vllm.gpuMemoryUtilization | quote }}
            {{- if ne .Values.vllm.maxModelLen nil }}
            - --max-model-len
            - {{ .Values.vllm.maxModelLen | quote }}
            {{- end }}
            {{- if ne .Values.vllm.maxNumSeqs nil }}
            - --max-num-seqs
            - {{ .Values.vllm.maxNumSeqs | quote }}
            {{- end }}
            {{- if ne .Values.vllm.mmProcessorCacheGiB nil }}
            - --mm-processor-cache-gb
            - {{ .Values.vllm.mmProcessorCacheGiB | quote }}
            {{- end }}
            {{- if ne .Values.vllm.seed nil }}
            - --seed
            - {{ .Values.vllm.seed | quote }}
            {{- end }}
            {{- with .Values.vllm.mmProcessorKwargs }}
            - --mm-processor-kwargs
            - {{ . | toJson | quote }}
            {{- end }}
            {{- with .Values.vllm.mediaIoKwargs }}
            - --media-io-kwargs
            - {{ . | toJson | quote }}
            {{- end }}
            {{- with .Values.vllm.overrideGenerationConfig }}
            - --override-generation-config
            - {{ . | toJson | quote }}
            {{- end }}
            {{- with .Values.vllm.defaultChatTemplateKwargs }}
            - --default-chat-template-kwargs
            - {{ . | toJson | quote }}
            {{- end }}
            {{- if .Values.vllm.servedModelName }}
            - --served-model-name
            - {{ .Values.vllm.servedModelName | quote }}
            {{- end }}
            {{- if .Values.vllm.enableChunkedPrefill }}
            - --enable-chunked-prefill
            {{- end }}
            {{- if .Values.vllm.skipMmProfiling }}
            - --skip-mm-profiling
            {{- end }}
            {{- if .Values.requestPolicy.enabled }}
            - --middleware
            - request_policy.RequestPolicy
            {{- end }}
            {{- range .Values.vllm.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.vllm.port }}
              protocol: TCP
          env:
            - name: HF_HOME
              value: {{ printf "%s/huggingface" .Values.persistence.mountPath | quote }}
            - name: VLLM_WORKER_MULTIPROC_METHOD
              value: spawn
            {{- if .Values.requestPolicy.enabled }}
            - name: PYTHONPATH
              value: /opt/vllm-policy
            - name: VLLM_REQUEST_POLICY_MAX_BODY_BYTES
              value: {{ .Values.requestPolicy.maxBodyBytes | int | quote }}
            {{- end }}
            {{- if .Values.huggingFace.existingSecret }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.huggingFace.existingSecret }}
                  key: {{ .Values.huggingFace.tokenKey }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
            {{- if .Values.persistence.enabled }}
            - name: cache
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if .Values.requestPolicy.enabled }}
            - name: request-policy
              mountPath: /opt/vllm-policy
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.startupProbe.enabled }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: {{ .Values.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.startupProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.readinessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          {{- end }}
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.shm.sizeLimit }}
        {{- if .Values.persistence.enabled }}
        - name: cache
          persistentVolumeClaim:
            claimName: {{ include "vllm.pvcName" . }}
        {{- end }}
        {{- if .Values.requestPolicy.enabled }}
        - name: request-policy
          configMap:
            name: {{ include "vllm.fullname" . }}-policy
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
