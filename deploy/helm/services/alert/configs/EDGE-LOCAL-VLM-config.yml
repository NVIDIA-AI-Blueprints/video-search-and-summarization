{{- $g := .Values.global | default dict }}
{{- $pfx := default false (coalesce .Values.useReleaseNamePrefix (index $g "useReleaseNamePrefix")) }}
{{- $kafkaHost := ternary (printf "%s-kafka-kafka" .Release.Name) "kafka-kafka" $pfx }}
{{- $esHost := ternary (printf "%s-elasticsearch" .Release.Name) "elasticsearch" $pfx }}
{{- $redisDef := ternary (printf "%s-redis" .Release.Name) "redis" $pfx }}
{{- $redis := .Values.redis | default dict }}
{{- $redisHost := $redis.host | default $redisDef }}
{{- $cosmosHost := ternary (printf "%s-nvidia-cosmos3-reasoner" .Release.Name) "nvidia-cosmos3-reasoner" $pfx }}
{{- $vstIngHost := ternary (printf "%s-vss-vios-ingress:30888" .Release.Name) "vss-vios-ingress:30888" $pfx }}
{{- $rawSubVlm := .Values.vlmBaseUrl | default "" | toString }}
{{- $rawGlobVlm := index $g "vlmBaseUrl" | default "" | toString }}
{{- $rawVlmPick := $rawSubVlm }}
{{- if eq (trim $rawSubVlm) "" }}
{{- $rawVlmPick = $rawGlobVlm }}
{{- end }}
{{- $vlmUrl := trim (tpl $rawVlmPick .) }}
{{- $subVn := trim (default "" .Values.vlmName) }}
{{- $globVn := trim (default "" (index $g "vlmName")) }}
{{- $vlmNameStr := $subVn | default $globVn | default "nvidia/cosmos3-nano-reasoner" }}
{{- $rtviVlmBase := printf "http://%s:8000" (ternary (printf "%s-vss-rtvi-vlm" .Release.Name) "vss-rtvi-vlm" $pfx) }}
{{- $internalVst := printf "http://%s" $vstIngHost }}
{{- /* vstBaseUrl: optional explicit override via tpl; when empty, always use in-cluster VST (Docker parity: ${VST_INTERNAL_URL}). */}}
{{- $rawVst := .Values.vstBaseUrl | default "" | toString }}
{{- $subVst := trim (tpl $rawVst .) }}
{{- $vstBase := $subVst | default $internalVst }}
# Helm-templated EDGE-LOCAL-VLM config (DGX-SPARK, IGX-THOR, AGX-THOR with local VLM)
# Base directory for media used during alert review (optional)
ALERT_REVIEW_MEDIA_BASE_DIR: {{ .Values.alertReviewMediaBaseDir | default "" | quote }}

# VST Configuration
vst_config:
  recording_check_max_attempts: 3
  base_url: "{{ $vstBase }}"
  sensor_list_endpoint: "/vst/api/v1/sensor/streams"
  add_overlay: {{ .Values.addOverlay | default false }}
  segment_anchor: "end"
  segment_duration_seconds: 10
  storage:
    base_url: "{{ $vstBase }}"
    media_file_path_by_id_endpoint: "/api/v1/storage/file/path"

kafka:
  bootstrap_servers: "{{ .Values.kafkaBootstrapServers | default (printf "%s:9092" $kafkaHost) }}"
  group_id: 'kafka-incidents-dumper'
  max_poll_records: 10
  auto_offset_reset: 'latest'
  enable_auto_commit: false
  max_poll_interval_ms: 600000
  session_timeout_ms: 45000
  heartbeat_interval_ms: 15000
  poll_timeout: 5
  message_type: "Incident"
  enhanced_anomaly_topic: "alert-bridge-enhanced-alerts"
  incidents_topic: "alert-bridge-incidents"

# Connection shared by every Redis Streams component. Only read when a
# redisStream transport is selected, so it is inert in the default Kafka
# deployment.
redis:
  host: "{{ $redisHost }}"
  port: {{ $redis.port | default 6379 }}
  db: {{ $redis.db | default 0 }}
  password: "{{ $redis.password | default "" }}"
  maxlen: {{ $redis.maxlen | default 10000 }}

vlm:
  base_url: "{{ $vlmUrl | default (printf "http://%s:8000" $cosmosHost) }}/v1"
  model: "{{ $vlmNameStr }}"
  max_tokens: 4096
  min_pixels: 1568
  max_pixels: 8388608
  enable_sampling: true
  sampling_fps: 4
  request_timeout: 60
  use_vlm_media_defaults: true

# Source and sink transports are selected independently via eventSourceType /
# eventSinkType. Both default to kafka. This sink carries validation-error
# responses — VLM-enhanced results go to the vlm_enhanced_sink below.
event_bridge:
  sourceType: "{{ .Values.eventSourceType | default "kafka" }}"
  sinkType: "{{ .Values.eventSinkType | default "kafka" }}"
  kafka_source:
    group_id: 'alert-bridge-vlm-group'
    topics:
      incident: 'mdx-incidents'

  redis_source:
    streams:
      incident: 'mdx-incidents'
    consumer_group: "{{ $redis.consumerGroup | default "alert-bridge-vlm-group" }}"
    consumer_config:
      count: 10
      block_time: 100
      start_id: '$'

  redis_sink:
    streams:
      enhanced_anomaly: 'alert-bridge-enhanced-alerts'
      incidents: 'alert-bridge-incidents'

prompt:
  prefer_payload_prompt: false
  override_prompts_on_start: true

alert_type_config_file: "alert_type_config.json"

alert_agent:
  num_workers: 10
  max_allowed_stream_size: 2
  default_stream_interval: 1
  vst_pass_through_mode: false
  include_latency_info: false
  # In-process event filtering / dedup tuning (no external store).
  event_filters:
    dedup_ttl_seconds: 5
    protect_confirmed_verdicts:
      enabled: true
      ttl_seconds: 600
      # Verdict-ES retry cooldown + hourly throttled expired-marker reaper.
      es_retry_backoff_seconds: 30
      retention_interval_seconds: 3600
      retention_requests_per_second: 50
    end_time_delta_filter:
      enabled: true
      threshold_seconds: 3
      ttl_seconds: 3600
    end_time_in_dedup_key_categories: []

  # Pipeline mode: sync | thread_bridge | event_loop (invalid value fails startup).
  # For A/B perf arms flip only this key; thread_bridge reproduces the legacy
  # async path, sync is the reference arm. See services/alert/README.md
  # "Pipeline modes & concurrency sizing".
  pipeline_mode: event_loop
  async_dispatch_max_in_flight: 16    # Global in-flight bound, 2-4x max_vlm_concurrent
  async_io:
    enabled: true                     # Ignored when pipeline_mode is set; kept for config-only rollback
    vst_enabled: true
    elastic_enabled: true
    dedup_enabled: true
    external_timeout_seconds: 30
    sink_warn_in_flight: 20
    # event_loop per-service caps. max_vlm_concurrent MUST be set explicitly
    # (default falls back to async_dispatch_workers) and MUST stay at or below
    # the benchmarked VLM backend ceiling.
    max_vlm_concurrent: 4
    max_vst_concurrent: 8

# RTVI VLM Configuration - Real-time VLM alert management
rtvi_vlm:
  base_url: "{{ $rtviVlmBase }}/v1"
  timeout: 10
  default_model: "{{ $vlmNameStr }}"
  rules_collection: "alert-realtime-rules"
  pending_ttl_seconds: 300
  health_check_interval_seconds: 30
  enable_realtime_persistence: true
  # Realtime alert consolidation — group repeated VLM positives from the same
  # camera and alert type into a single event. Controlled per request via the
  # `consolidate` query param on GET /api/v1/realtime/incidents.
  consolidation:
    max_inter_alert_gap_seconds: 60
    max_event_duration_seconds: 300
    representative: "latest"

elastic:
  enabled: true
  hosts:
    - {{ .Values.elasticHosts | default (printf "http://%s:9200" $esHost) | quote }}

# Transport for VLM-enhanced results, selected via vlmSinkType. The per-kind
# blocks for every transport are listed together; only the selected one is read.
vlm_enhanced_sink:
  type: "{{ .Values.vlmSinkType | default "elastic" }}"
  incident:
    type: "elastic"
    elastic:
      index: "mdx-vlm-incidents"
    redisStream:
      stream: "mdx-vlm-incidents"
      message_type: "incident"
  alert:
    type: "elastic"
    elastic:
      index: "mdx-vlm-alerts"
    redisStream:
      stream: "mdx-vlm-alerts"
      message_type: "alert"

logging:
  level: "INFO"
  format: "%(asctime)s - %(threadName)s - %(name)s - %(levelname)s - %(message)s"
  third_party_level: "WARNING"
