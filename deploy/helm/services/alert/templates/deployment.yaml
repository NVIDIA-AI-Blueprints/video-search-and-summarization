{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vss-alert-bridge.fullname" . }}
  labels:
    app.kubernetes.io/name: vss-alert-bridge
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  {{- /* A Redis consumer group hands each entry to whichever consumer asks
         first, so it does not keep one sensor's events on one replica. Dedup,
         the end-time delta filter and the VLM rate limit are all process-local
         and assume it does: split a sensor's cohort across replicas and
         duplicates reach the VLM with nothing raised anywhere. Kafka has no
         such problem — partition ownership is the affinity — so this is
         checked only for the Redis source. Rendering fails rather than warns
         because the symptom is duplicate VLM spend in production, and a
         warning at install time is not where anyone would look for it.
         Set allowMultiReplicaRedisSource: true once each replica has its own
         consumerGroup over disjoint streams, or once
         alert_agent.event_filters.protect_confirmed_verdicts is enabled. */}}
  {{- $srcType := include "vss-alert-bridge.transport" (.Values.eventSourceType | default "kafka") }}
  {{- if and (eq $srcType "redisstream") (gt (int .Values.replicas) 1) }}
  {{- if not .Values.allowMultiReplicaRedisSource }}
  {{- fail (printf "vss-alert-bridge: replicas=%v with eventSourceType=redisStream. A Redis consumer group gives no per-sensor affinity, so process-local dedup, the end-time delta filter and the rate limit will let duplicates through. Use replicas=1, or give each replica its own redis.consumerGroup over disjoint streams and set allowMultiReplicaRedisSource=true." .Values.replicas) }}
  {{- end }}
  {{- end }}
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: vss-alert-bridge
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vss-alert-bridge
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ tpl (.Files.Get "configs/config.yml") . | sha256sum }}
    spec:
      # At alert_agent.processes: 1, the shipped default, there is no
      # supervisor: up to 10s to terminate and join the API child, up to 15s
      # of drain, up to 5s to close the event-loop clients, up to 15s to stop
      # the runtime. 45s bounded.
      # Kubernetes' own 30s default does not cover that, and a cluster-wide
      # change to it would cut the drain short silently.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 60 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.waitForDependencies.enabled }}
      {{- $g := .Values.global | default dict }}
      {{- $pfx := default false (coalesce .Values.useReleaseNamePrefix (index $g "useReleaseNamePrefix")) }}
      {{- $kafkaDef := ternary (printf "%s-kafka-kafka" .Release.Name) "kafka-kafka" $pfx }}
      {{- $esDef := ternary (printf "%s-elasticsearch" .Release.Name) "elasticsearch" $pfx }}
      {{- $redis := .Values.redis | default dict }}
      {{- $kafkaH := .Values.waitForDependencies.kafkaHost | default $kafkaDef }}
      {{- $esH := .Values.waitForDependencies.elasticsearchHost | default $esDef }}
      {{- /* Same resolution as the config, so the endpoint waited on cannot
             differ from the one connected to. */}}
      {{- $redisH := .Values.waitForDependencies.redisHost | default (include "vss-alert-bridge.redisHost" .) }}
      {{- $redisP := .Values.waitForDependencies.redisPort | default $redis.port | default 6379 }}
      {{- /* Only wait on the brokers the selected transports actually use, so a
             Redis-only deployment does not block on an absent Kafka. */}}
      {{- $sourceType := include "vss-alert-bridge.transport" (.Values.eventSourceType | default "kafka") }}
      {{- $sinkType := include "vss-alert-bridge.transport" (.Values.eventSinkType | default "kafka") }}
      {{- $vlmSink := include "vss-alert-bridge.transport" (.Values.vlmSinkType | default "elastic") }}
      {{- $usesRedis := or (eq $sourceType "redisstream") (eq $sinkType "redisstream") (eq $vlmSink "redisstream") }}
      {{- $usesKafka := or (eq $sourceType "kafka") (eq $sinkType "kafka") (eq $vlmSink "kafka") }}
      {{- $endpoints := list (printf "%s:%v" $esH .Values.waitForDependencies.elasticsearchPort) }}
      {{- if $usesKafka }}
      {{- $endpoints = append $endpoints (printf "%s:%v" $kafkaH .Values.waitForDependencies.kafkaPort) }}
      {{- end }}
      {{- if $usesRedis }}
      {{- $endpoints = append $endpoints (printf "%s:%v" $redisH $redisP) }}
      {{- end }}
      initContainers:
        - name: wait-for-dependencies
          image: {{ .Values.waitForDependencies.image.repository }}:{{ .Values.waitForDependencies.image.tag }}
          imagePullPolicy: {{ .Values.waitForDependencies.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              ENDPOINTS="{{ join " " $endpoints }}"
              echo "Waiting for: $ENDPOINTS"
              for i in $(seq 1 {{ .Values.waitForDependencies.maxRetries }}); do
                PENDING=""
                for endpoint in $ENDPOINTS; do
                  host=$(echo "$endpoint" | cut -d: -f1)
                  port=$(echo "$endpoint" | cut -d: -f2)
                  nc -z "$host" "$port" 2>/dev/null || PENDING="$PENDING $endpoint"
                done
                if [ -z "$PENDING" ]; then
                  echo "All dependencies are accepting connections"
                  exit 0
                fi
                echo "Attempt $i: still waiting for$PENDING"
                sleep {{ .Values.waitForDependencies.retryInterval }}
              done
              echo "Timeout waiting for$PENDING"
              exit 1
      {{- end }}
      containers:
        - name: vss-alert-bridge
          image: {{ include "vss-alert-bridge.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/bin/python
            - enhance_alert_with_vlm.py
            - --config
            - /app/runtime/config.yml
          env:
            {{- $g := .Values.global | default dict }}
            {{- $pfx := default false (coalesce .Values.useReleaseNamePrefix (index $g "useReleaseNamePrefix")) }}
            {{- /* Same merge as vss-agent: subchart vlmBaseUrl overrides global.vlmBaseUrl. tpl() supports optional {{…}} templates; "" and plain URLs are unchanged (tpl("") is ""; tpl("http://host:8000") is identical). Empty after tpl → VLM_BASE_URL uses $vlmDef below. */}}
            {{- $rawVlmSub := .Values.vlmBaseUrl | default "" | toString }}
            {{- $rawVlmGlob := index $g "vlmBaseUrl" | default "" | toString }}
            {{- $rawVlmMerged := $rawVlmSub }}
            {{- if eq (trim $rawVlmSub) "" }}
            {{- $rawVlmMerged = $rawVlmGlob }}
            {{- end }}
            {{- $vlmUrl := trim (tpl $rawVlmMerged .) }}
            {{- $globVlmUrl := trim (default "" (index $g "vlmBaseUrl")) }}
            {{- $vstIngHost := ternary (printf "%s-vss-vios-ingress:30888" .Release.Name) "vss-vios-ingress:30888" $pfx }}
            {{- $subVn := trim (default "" .Values.vlmName) }}
            {{- $globVn := trim (default "" (index $g "vlmName")) }}
            {{- $vlmNameStr := $subVn | default $globVn | default "nvidia/cosmos3-nano-reasoner" }}
            {{- $vlmDef := ternary (printf "http://%s-nvidia-cosmos3-reasoner:8000" .Release.Name) "http://nvidia-cosmos3-reasoner:8000" $pfx }}
            - name: EXTERNAL_IP
              value: {{ .Values.externalIp | default (index (.Values.global | default dict) "externalHost" | default "" | trim) | default "127.0.0.1" | quote }}
            - name: INTERNAL_IP
              value: {{ .Values.internalIp | default $vstIngHost | quote }}
            - name: VLM_BASE_URL
              value: {{ $vlmUrl | default $vlmDef | quote }}
            - name: VLM_MODE
              value: {{ ternary "remote" "local" (ne $globVlmUrl "") | quote }}
            - name: VLM_NAME
              value: {{ $vlmNameStr | quote }}
            - name: RTVI_VLM_MODEL_TO_USE
              value: {{ .Values.rtviVlmModelToUse | default $vlmNameStr | quote }}
            - name: ALWAYS_ON_RULES_CONFIG
              value: "/app/configs/realtime-config.yml"
          volumeMounts:
            - name: runtime-config
              mountPath: /app/runtime
              readOnly: true
            - name: alert-type-config
              mountPath: /app/alert_type_config.json
              subPath: alert_type_config.json
              readOnly: true
            - name: realtime-config
              mountPath: /app/configs/realtime-config.yml
              subPath: realtime-config.yml
              readOnly: true
            {{- /* Redis credentials and CA come from Secrets rather than the
                   ConfigMap the rest of the config lives in, so a
                   customer-managed authenticated TLS endpoint does not require
                   putting its password in non-secret configuration. */}}
            {{- $r := .Values.redis | default dict }}
            {{- $rTls := $r.tls | default dict }}
            {{- if and $r.passwordSecret $r.passwordSecret.name $r.passwordSecret.key }}
            - name: redis-auth
              mountPath: /etc/alert-bridge/redis-auth
              readOnly: true
            {{- end }}
            {{- if and $rTls.enabled $rTls.caCertSecret $rTls.caCertSecret.name $rTls.caCertSecret.key }}
            - name: redis-ca
              mountPath: /etc/alert-bridge/redis-ca
              readOnly: true
            {{- end }}
            {{- if and $rTls.enabled $rTls.clientCertSecret $rTls.clientCertSecret.name }}
            - name: redis-client-cert
              mountPath: /etc/alert-bridge/redis-client
              readOnly: true
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: runtime-config
          configMap:
            name: {{ include "vss-alert-bridge.fullname" . }}-config
            items:
              - key: config.yml
                path: config.yml
        - name: alert-type-config
          configMap:
            name: {{ include "vss-alert-bridge.fullname" . }}-config
            items:
              - key: alert_type_config.json
                path: alert_type_config.json
        - name: realtime-config
          configMap:
            name: {{ include "vss-alert-bridge.fullname" . }}-config
            items:
              - key: realtime-config.yml
                path: realtime-config.yml
        {{- $rv := .Values.redis | default dict }}
        {{- $rvTls := $rv.tls | default dict }}
        {{- if and $rv.passwordSecret $rv.passwordSecret.name $rv.passwordSecret.key }}
        - name: redis-auth
          secret:
            secretName: {{ $rv.passwordSecret.name }}
            items:
              - key: {{ $rv.passwordSecret.key }}
                path: {{ $rv.passwordSecret.key }}
        {{- end }}
        {{- if and $rvTls.enabled $rvTls.caCertSecret $rvTls.caCertSecret.name $rvTls.caCertSecret.key }}
        - name: redis-ca
          secret:
            secretName: {{ $rvTls.caCertSecret.name }}
            items:
              - key: {{ $rvTls.caCertSecret.key }}
                path: {{ $rvTls.caCertSecret.key }}
        {{- end }}
        {{- if and $rvTls.enabled $rvTls.clientCertSecret $rvTls.clientCertSecret.name }}
        {{- $certKey := $rvTls.clientCertSecret.certKey | default "tls.crt" }}
        {{- $keyKey := $rvTls.clientCertSecret.keyKey | default "tls.key" }}
        - name: redis-client-cert
          secret:
            secretName: {{ $rvTls.clientCertSecret.name }}
            # The private key is readable only by the container's user; a
            # client key mounted 0644 is a finding in its own right.
            defaultMode: 0400
            items:
              - key: {{ $certKey }}
                path: {{ $certKey }}
              - key: {{ $keyKey }}
                path: {{ $keyKey }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
