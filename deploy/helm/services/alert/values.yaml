# vss-alert-bridge: VLM alert verification. Compose: vss-alert-verification, entrypoint env-substitute + command enhance_alert_with_vlm.py
enabled: false
global: {}

image:
  repository: ghcr.io/nvidia-ai-blueprints/vss/vss-alert-ms
  tag: develop-latest
  pullPolicy: IfNotPresent
replicas: 1

# Parameterized from parent / profile. In K8s use service names. Leave "" for release-based defaults.
# Redis has been removed from Alert MS: dedup/filter state is in-process
# and durable state (verdict protection, alert configs) lives in Elasticsearch.
kafkaBootstrapServers: ""
elasticHosts: ""
vlmBaseUrl: ""
vlmName: "nvidia/cosmos3-nano-reasoner"
# VST base for Alert Bridge media lookup (vst_config.base_url). Default: in-cluster
# vss-vios-ingress service (Docker parity: always ${VST_INTERNAL_URL}). Public URLs
# for remote VLM are rewritten via url_transform + EXTERNAL_IP/INTERNAL_IP, not by
# flipping vst_config to global.externalHost.
vstBaseUrl: ""

externalIp: ""
# Host:port for url_transform internal side (default: in-cluster vss-vios-ingress:30888).
internalIp: ""

# RTVI_VLM_MODEL_TO_USE passed to the container (default: vlmName)
rtviVlmModelToUse: ""
# Inline YAML content for realtime-config.yml (always-on VLM alert rules). Leave "" for empty default.
realtimeConfig: ""

# Base directory for media used during alert review (optional). Leave "" if not set.
alertReviewMediaBaseDir: ""

# Config variant: "" (default) or "edge-local-vlm" (DGX-SPARK, IGX-THOR, AGX-THOR with local VLM)
# When "edge-local-vlm", uses EDGE-LOCAL-VLM-config.yml content (adds request_timeout, use_vlm_media_defaults).
configVariant: ""

# App listens on 9080 (see logs: "Uvicorn running on http://0.0.0.0:9080")
service:
  port: 9080
  type: ClusterIP

# Seconds the pod gets to shut down. Must stay above the shutdown budget: at
# alert_agent.processes: 1 that is up to 10s for the API child, up to 15s of
# drain, up to 5s to close the event-loop clients and up to 15s to stop the
# runtime -- 45s bounded. Lowering it cuts in-flight work instead of draining.
terminationGracePeriodSeconds: 60

resources: {}
nodeSelector: {}
tolerations: []

# Block the main container until Kafka and Elasticsearch accept TCP (avoids
# startup crashes when alert-bridge runs before infra stack services are listening).
# Redis is no longer a dependency of Alert MS.
waitForDependencies:
  enabled: false
  image:
    repository: docker.io/library/busybox
    tag: "1.37.0"
    pullPolicy: IfNotPresent
  kafkaHost: ""
  kafkaPort: "9092"
  elasticsearchHost: ""
  elasticsearchPort: "9200"
  maxRetries: "90"
  retryInterval: "2"
