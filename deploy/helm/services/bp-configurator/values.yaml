global:
  imagePullSecrets: []
  useReleaseNamePrefix: false

enabled: false

nameOverride: ""
fullnameOverride: ""
name: ""
useReleaseNamePrefix: null

replicas: 1

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

init:
  enabled: true
  streamType: kafka
  kafkaHost: kafka-kafka
  kafkaPort: "9092"
  redisHost: redis
  redisPort: "6379"
  maxRetries: 60
  retryIntervalSeconds: 2
  image:
    repository: busybox
    tag: "1.37.0"
    pullPolicy: IfNotPresent

command: []
args: []

port: 5001
serviceType: ClusterIP
service:
  type: ""

env: []

readinessPath: /readyz
readinessInitialDelaySeconds: 20

configMounts: []

data:
  enabled: false
  existingClaim: ""
  mountPath: /opt/data
  seedConfigMapName: ""
  seedOptional: false

resources: {}
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
