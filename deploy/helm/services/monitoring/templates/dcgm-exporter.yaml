# Only for clusters without the GPU operator, which ships its own exporter.
{{- if and .Values.enabled .Values.dcgmExporter.enabled }}
{{- $name := include "monitoring.componentName" (dict "ctx" . "component" "dcgm-exporter") }}
{{- $d := .Values.dcgmExporter }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "monitoring.labels" (dict "ctx" . "component" "dcgm-exporter") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "monitoring.selectorLabels" (dict "ctx" . "component" "dcgm-exporter") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "monitoring.selectorLabels" (dict "ctx" . "component" "dcgm-exporter") | nindent 8 }}
      annotations:
        {{- include "monitoring.scrapeAnnotations" (dict "port" $d.port) | nindent 8 }}
    spec:
      {{- with (.Values.global).imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dcgm-exporter
          image: "{{ $d.image.repository }}:{{ $d.image.tag }}"
          imagePullPolicy: {{ $d.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: DCGM_EXPORTER_LISTEN
              value: ":{{ $d.port }}"
            - name: DCGM_EXPORTER_KUBERNETES
              value: "true"
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            capabilities:
              add: ["SYS_ADMIN"]
          ports:
            - name: metrics
              containerPort: {{ $d.port }}
              protocol: TCP
          resources:
            {{- toYaml $d.resources | nindent 12 }}
          volumeMounts:
            - name: pod-gpu-resources
              mountPath: /var/lib/kubelet/pod-resources
              readOnly: true
      volumes:
        - name: pod-gpu-resources
          hostPath:
            path: /var/lib/kubelet/pod-resources
      {{- with $d.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $d.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "monitoring.labels" (dict "ctx" . "component" "dcgm-exporter") | nindent 4 }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: metrics
      port: {{ $d.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "monitoring.selectorLabels" (dict "ctx" . "component" "dcgm-exporter") | nindent 4 }}
{{- end }}
