{{- if and .Values.enabled .Values.prometheus.enabled .Values.prometheus.serviceAccount.create }}
{{- $clusterRole := include "monitoring.prometheus.clusterRoleName" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "monitoring.prometheus.serviceAccountName" . }}
  labels:
    {{- include "monitoring.labels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
---
# Cluster-scoped for cross-namespace discovery (the GPU operator's exporter).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterRole }}
  labels:
    {{- include "monitoring.labels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/metrics
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  {{- if .Values.prometheus.kubelet.enabled }}
  # Reaches the kubelet cAdvisor endpoint via the API server proxy.
  - apiGroups: [""]
    resources:
      - nodes/proxy
    verbs: ["get"]
  {{- end }}
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterRole }}
  labels:
    {{- include "monitoring.labels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterRole }}
subjects:
  - kind: ServiceAccount
    name: {{ include "monitoring.prometheus.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
