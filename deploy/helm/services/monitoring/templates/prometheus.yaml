{{- if and .Values.enabled .Values.prometheus.enabled }}
{{- $name := include "monitoring.componentName" (dict "ctx" . "component" "prometheus") }}
{{- $p := .Values.prometheus }}
{{- if $p.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  labels:
    {{- include "monitoring.labels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- $sc := $p.persistence.storageClass | default (.Values.global).storageClass }}
  {{- if $sc }}
  storageClassName: {{ $sc }}
  {{- end }}
  resources:
    requests:
      storage: {{ $p.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "monitoring.labels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
spec:
  replicas: {{ $p.replicas | default 1 }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "monitoring.selectorLabels" (dict "ctx" . "component" "prometheus") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "monitoring.selectorLabels" (dict "ctx" . "component" "prometheus") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/prometheus-config.yaml") . | sha256sum }}
        {{- include "monitoring.scrapeAnnotations" (dict "port" $p.port) | nindent 8 }}
    spec:
      {{- with (.Values.global).imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "monitoring.prometheus.serviceAccountName" . }}
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: "{{ $p.image.repository }}:{{ $p.image.tag }}"
          imagePullPolicy: {{ $p.image.pullPolicy | default "IfNotPresent" }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ $p.retention }}
            - --web.enable-lifecycle
            {{- with $p.routePrefix }}
            - --web.route-prefix={{ . }}
            - --web.external-url={{ $p.externalUrl | default (printf "http://localhost:9090%s" .) }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $p.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: {{ $p.routePrefix | default "" }}/-/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: {{ $p.routePrefix | default "" }}/-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml $p.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
      volumes:
        - name: config
          configMap:
            name: {{ $name }}-config
        - name: data
        {{- if $p.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}-data
        {{- else }}
          emptyDir: {}
        {{- end }}
      {{- with $p.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $p.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "monitoring.labels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
spec:
  type: {{ $p.service.type | default "ClusterIP" }}
  ports:
    - name: http
      port: {{ $p.port }}
      targetPort: http
      protocol: TCP
      {{- if and (eq ($p.service.type | default "ClusterIP") "NodePort") $p.service.nodePort }}
      nodePort: {{ $p.service.nodePort }}
      {{- end }}
  selector:
    {{- include "monitoring.selectorLabels" (dict "ctx" . "component" "prometheus") | nindent 4 }}
{{- end }}
