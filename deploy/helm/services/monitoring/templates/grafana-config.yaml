{{- if and .Values.enabled .Values.grafana.enabled }}
{{- $name := include "monitoring.componentName" (dict "ctx" . "component" "grafana") }}
{{- $promName := include "monitoring.componentName" (dict "ctx" . "component" "prometheus") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-provisioning
  labels:
    {{- include "monitoring.labels" (dict "ctx" . "component" "grafana") | nindent 4 }}
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        orgId: 1
        url: http://{{ $promName }}:{{ .Values.prometheus.port }}
        isDefault: true
        version: 1
        editable: true
  dashboard.yml: |
    apiVersion: 1
    providers:
      - name: 'default'
        folder: 'Imported'
        type: file
        disableDeletion: false
        editable: true
        options:
          # One subdirectory per dashboard ConfigMap; the provider recurses.
          path: /etc/grafana/dashboards
{{- if .Values.grafana.dashboards.enabled }}
{{- range $path, $_ := .Files.Glob "files/grafana-dashboards/*.json" }}
{{- $file := base $path }}
{{- $key := trimSuffix ".json" $file }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-dashboard-{{ $key }}
  labels:
    {{- include "monitoring.labels" (dict "ctx" $ "component" "grafana") | nindent 4 }}
    grafana_dashboard: "1"
data:
  {{ $file }}: |-
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
{{- end }}
