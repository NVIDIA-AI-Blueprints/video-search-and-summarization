global:
  imagePullSecrets: []
  useReleaseNamePrefix: false

enabled: false

nameOverride: ""
fullnameOverride: ""
name: ""
useReleaseNamePrefix: null

image:
  repository: alpine
  tag: "3.23.4"
  pullPolicy: IfNotPresent

apiUrl: http://vss-video-analytics-api:8081
calibrationFile: /opt/vss/calibration.json
imagesDir: /opt/vss/images
maxRetries: 120
sleepSeconds: 2

existingClaim: ""
mountPath: /opt/vss

ttlSecondsAfterFinished: null
backoffLimit: 5
restartPolicy: OnFailure

resources: {}
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
