{{- if .Values.enabled }}
{{- $image := .Values.image | default dict }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "calibration-import.fullname" . }}
  labels:
    {{- include "calibration-import.labels" . | nindent 4 }}
spec:
  {{- with .Values.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  backoffLimit: {{ .Values.backoffLimit | default 5 }}
  template:
    metadata:
      labels:
        {{- include "calibration-import.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      restartPolicy: {{ .Values.restartPolicy | default "OnFailure" }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: calibration-import
          image: "{{ $image.repository | default "alpine" }}:{{ $image.tag | default "3.23.4" }}"
          imagePullPolicy: {{ $image.pullPolicy | default "IfNotPresent" }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              apk add --no-cache bash curl jq >/dev/null
              api_url={{ .Values.apiUrl | default "http://vss-video-analytics-api:8081" | quote }}
              calibration_file={{ .Values.calibrationFile | default "/opt/vss/calibration.json" | quote }}
              images_dir={{ .Values.imagesDir | default "/opt/vss/images" | quote }}
              max_retries={{ .Values.maxRetries | default 120 }}
              sleep_seconds={{ .Values.sleepSeconds | default 2 }}
              i=0
              until [ "$(curl -o /dev/null --silent --head --write-out '%{http_code}' "${api_url}/livez" || true)" = "200" ]; do
                i=$((i + 1))
                if [ "${i}" -ge "${max_retries}" ]; then
                  echo "Timed out waiting for ${api_url}/livez"
                  exit 1
                fi
                sleep "${sleep_seconds}"
              done
              if [ -f "${calibration_file}" ]; then
                curl --fail --show-error -X POST "${api_url}/config/upload-file/calibration" --form configFiles=@"${calibration_file}"
              else
                echo "Skipping calibration JSON import; ${calibration_file} not found"
              fi
              metadata_file="${images_dir}/imageMetadata.json"
              if [ -f "${metadata_file}" ]; then
                form_args=""
                for file_name in $(jq -r '.images[].fileName' "${metadata_file}"); do
                  if [ -f "${images_dir}/${file_name}" ]; then
                    form_args="${form_args} --form images=@${images_dir}/${file_name}"
                  fi
                done
                if [ -n "${form_args}" ]; then
                  sh -c "curl --fail --show-error -X POST ${api_url}/config/calibration/images ${form_args} --form imageMetadata=@${metadata_file}"
                fi
              else
                echo "Skipping calibration image import; ${metadata_file} not found"
              fi
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: calibration-data
              mountPath: {{ .Values.mountPath | default "/opt/vss" }}
              readOnly: true
      volumes:
        - name: calibration-data
          persistentVolumeClaim:
            claimName: {{ required "calibration-import.existingClaim is required when enabled" .Values.existingClaim }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
