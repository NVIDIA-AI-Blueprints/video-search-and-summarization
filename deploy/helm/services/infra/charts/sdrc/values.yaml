enabled: false
global: {}

image:
  repository: ghcr.io/nvidia-ai-blueprints/vss/sdr-mw-l
  tag: develop-latest
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicas: 1

service:
  controller:
    type: ClusterIP
    port: 5003
    # nodePort: 30010
  sdrcDirectListener:
    type: ClusterIP
    port: 8011
  envoyAdmin:
    type: ClusterIP
    port: 9902
  # Compose parity: services/infra/sdrc/docker-compose.yaml exposes
  # SDRC_PROXY_HOST_PORT (default 10000) -> 10000. VIOS uses this as
  # STREAM_PROCESSOR_MODULE_ENDPOINT (see services/vios/vst.env).
  envoyProxy:
    port: 10000
  # Extra Envoy listener ports generated from workload config
  # WDM_MS_LISTENER_PORT values. Use this for workload-specific lifecycle
  # facades, for example RTVI-CV HTTP-header lifecycle on 10001. Keep this
  # list in sync with the ports declared in the SDRC workload config.
  workloadListeners: []
  # - name: rtvi-cv-http
  #   port: 10001
  #   targetPort: 10001
  #   nodePort: 31001

config:
  configMapName: sdrc-config
  key: config.yml
  mountPath: /config.yml
  rolloutVersion: ""

runtimeEnv:
  WDM_WL_REDIS_SERVER: redis
  WDM_WL_REDIS_PORT: "6379"
  OTEL_SDK_DISABLED: "true"
  KUBERNETES_HOST: kubernetes.default.svc
  KUBERNETES_PORT: "443"
  WDM_CONTROLLER_HOST: "127.0.0.1"
  HOST_IP: "127.0.0.1" # TODO
  WDM_CLUSTER_TYPE: "k8s"
  WDM_XDS_GRPC_ADS_ENABLED: "true"

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

nodeSelector: {}
tolerations: []
