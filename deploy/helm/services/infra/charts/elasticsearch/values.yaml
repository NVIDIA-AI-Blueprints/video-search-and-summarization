enabled: false
global: {}

image:
  repository: docker.elastic.co/elasticsearch/elasticsearch
  tag: "9.4.4"
  pullPolicy: IfNotPresent

replicas: 1

env:
  ES_JAVA_OPTS: "-Xmx1024m -Xms256m"
  discovery.type: "single-node"

# Extra container env (e.g. embedding dims for index templates / RTVI).
extraEnv: {}

service:
  port: 9200
  type: ClusterIP

# Edge guard for the public /elasticsearch ingress mount, rendered as a
# backend-config-snippet on this Service. Mirrors the Docker edge exactly, which
# means it is NOT a read-only endpoint: it denies PUT/DELETE, cluster-admin
# paths and the two-segment mutating operations, and allows a PUT to a
# unified-memory document path, but POST is allowed — so _bulk, _reindex and
# /<index>/_doc still reach Elasticsearch. Disable only where an entirely
# unguarded Elasticsearch on the public origin is acceptable.
ingressGuard:
  enabled: true
  # Interpolated into an HAProxy path_reg; a value carrying regex metacharacters
  # changes what the exception matches.
  memoryIndex: vss-memory

persistence:
  storageClass: ""
  data:
    size: 10Gi
  logs:
    size: 5Gi

volumeInit:
  image: docker.io/library/busybox
  tag: "1.37.0"

gpu:
  enabled: false

resources: {}
nodeSelector: {}
tolerations: []

startupProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 10
  failureThreshold: 60

init:
  enabled: false
  # Empty: inherits elasticsearch.nodeSelector from the Job template coalesce.
  nodeSelector: {}
  image:
    repository: docker.io/library/alpine
    tag: "3.24.1"
    pullPolicy: IfNotPresent
  backoffLimit: 10
  ttlSecondsAfterFinished: null
  elasticsearchUrl: ""
  env:
    ELASTICSEARCH_ILM_MIN_AGE: "4h"
    ELASTICSEARCH_ENABLE_EMBEDDINGS: "false"
    ELASTICSEARCH_RTVI_CV_EMBEDDINGS_DIM: "1536"
    ELASTICSEARCH_VISION_LLM_EMBEDDINGS_DIM: "768"

exporter:
  enabled: false
