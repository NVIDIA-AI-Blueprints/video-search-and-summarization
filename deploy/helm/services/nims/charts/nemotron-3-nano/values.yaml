image:
  repository: nvcr.io/nim/nvidia/nemotron-3-nano
  tag: "2.0.3"
  pullPolicy: IfNotPresent

modelPrecision: "fp8"

replicas: 1

resources:
  limits:
    nvidia.com/gpu: "1"
  requests:
    nvidia.com/gpu: "1"

storage:
  pvc:
    storageClass: ""
    size: "50Gi"

metrics:
  enabled: false

service:
  type: ClusterIP
  port: 8000

nodeSelector: {}

tolerations:
  - key: "nvidia.com/gpu"
    operator: "Exists"
    effect: "NoSchedule"

global:
  pullSecretName: "ngc-nim-docker-reg-secret"
  authSecretName: "ngc-nim-api-key-secret"
  storageClass: ""
