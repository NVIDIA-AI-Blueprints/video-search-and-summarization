enabled: true

global:
  imagePullSecrets: []
  useReleaseNamePrefix: false

# Overrides global.useReleaseNamePrefix when set to true or false.
useReleaseNamePrefix: null

replicaCount: 1

image:
  repository: vllm/vllm-openai
  tag: v0.28.0
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

# The official image provides the `vllm serve` entrypoint. Override command only
# when using an image with a different entrypoint.
command: []

vllm:
  model: Qwen/Qwen3.8-27B
  servedModelName: ""
  port: 8022
  tensorParallelSize: 1
  dtype: bfloat16
  gpuMemoryUtilization: 0.75
  maxModelLen: 262144
  maxNumSeqs: 8
  enableChunkedPrefill: true
  skipMmProfiling: true
  mmProcessorCacheGiB: 16
  seed: 1
  mmProcessorKwargs:
    size:
      shortest_edge: 4096
      longest_edge: 469762048
  mediaIoKwargs:
    video:
      video_backend: qwen3_vl
      backend: torchcodec
      seek_mode: exact
      num_frames: -1
      fps: 2
      max_frames: 768
  overrideGenerationConfig:
    temperature: 0
    max_new_tokens: 8192
  defaultChatTemplateKwargs:
    enable_thinking: false
  extraArgs: []

# This middleware replaces conflicting per-request values so every OpenAI chat
# request uses the configured deterministic generation policy.
requestPolicy:
  enabled: true
  payload:
    temperature: 0
    max_tokens: 8192
    seed: 1
    chat_template_kwargs:
      enable_thinking: false
    mm_processor_kwargs:
      size:
        shortest_edge: 4096
        longest_edge: 469762048

huggingFace:
  # Reference an existing Secret only when the model or registry requires it.
  existingSecret: ""
  tokenKey: HF_TOKEN

service:
  type: ClusterIP
  port: 8022
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: qwen-vllm.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  existingClaim: ""
  mountPath: /root/.cache
  accessModes:
    - ReadWriteOnce
  size: 200Gi
  storageClass: ""
  annotations: {}

shm:
  sizeLimit: 32Gi

resources:
  requests:
    cpu: "16"
    memory: 128Gi
    nvidia.com/gpu: 1
  limits:
    cpu: "16"
    memory: 128Gi
    nvidia.com/gpu: 1

startupProbe:
  enabled: true
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 180

readinessProbe:
  enabled: true
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

livenessProbe:
  enabled: true
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

terminationGracePeriodSeconds: 120
strategy:
  type: Recreate

runtimeClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

extraEnv: []
extraVolumes: []
extraVolumeMounts: []
