{{- if and .Values.enabled (eq .Values.profileMode "standalone-mc-tracking") .Values.standaloneWarehouse.mcTracking.fusion.enabled }}
{{- $sw := .Values.standaloneWarehouse }}
{{- $mcTracking := $sw.mcTracking | default dict }}
{{- $fusion := $mcTracking.fusion | default dict }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vss-rtvi-cv.fullname" . }}-mc-tracking-fusion
  labels:
    app.kubernetes.io/name: vss-rtvi-cv-mc-tracking-fusion
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vss-rtvi-cv-mc-tracking-fusion
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vss-rtvi-cv-mc-tracking-fusion
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $ips := .Values.imagePullSecrets | default .Values.global.imagePullSecrets }}
      {{- with $ips }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mc-tracking-fusion
          image: {{ include "vss-rtvi-cv.fusionImage" . }}
          imagePullPolicy: {{ $fusion.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: BROKER_TYPE
              value: {{ $sw.streamType | default "kafka" | quote }}
            - name: KAFKA_BOOTSTRAP
              value: {{ include "vss-rtvi-cv.kafkaBootstrap" . | quote }}
            - name: REDIS_HOST
              value: {{ include "vss-rtvi-cv.mcTrackingRedisHost" . | quote }}
            - name: REDIS_PORT
              value: {{ $mcTracking.redisPort | default "6379" | quote }}
            - name: RAW_TOPIC
              value: {{ $fusion.rawTopic | default "mdx-raw" | quote }}
            - name: FUSED_TOPIC
              value: {{ $fusion.fusedTopic | default "mdx-bev" | quote }}
            - name: SENSOR_TIMEOUT_MS
              value: {{ $fusion.sensorTimeoutMs | default "100" | quote }}
            - name: MAX_EXPECTED_SENSORS
              value: {{ $fusion.maxExpectedSensors | default $mcTracking.maxBatchSize | default "4" | quote }}
            - name: BUFFER_DURATION_S
              value: {{ $fusion.bufferDurationS | default "2.0" | quote }}
            - name: OTEL_SDK_DISABLED
              value: {{ $.Values.otelSdkDisabled | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://localhost:4318"
          readinessProbe:
            exec:
              command:
                - python3
                - -c
                - import os, sys; sys.exit(0 if os.path.exists("/tmp/fusion_ready") else 1)
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - import os, sys; sys.exit(0 if os.path.exists("/tmp/fusion_ready") else 1)
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 5
          {{- with $fusion.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
