# DeepStream configs for profileMode standalone-mc-tracking (RT-DETR + mc-tracking + BEV fusion).

{{- if and .Values.enabled (eq .Values.profileMode "standalone-mc-tracking") }}
{{- $bundle := "/opt/nvidia/deepstream/deepstream/sources/apps/sample_apps/metropolis_perception_app/configs" }}
{{- $mcTracking := .Values.standaloneWarehouse.mcTracking | default dict }}
{{- $fusion := $mcTracking.fusion | default dict }}
{{- $rawTopic := $fusion.rawTopic | default "mdx-raw" }}
{{- $kafkaBootstrap := include "vss-rtvi-cv.kafkaBootstrap" . }}
{{- $kafkaParts := splitList ":" $kafkaBootstrap }}
{{- $kafkaHost := first $kafkaParts }}
{{- $kafkaPort := "9092" }}
{{- if gt (len $kafkaParts) 1 }}
{{- $kafkaPort = last $kafkaParts }}
{{- end }}
{{- $kafkaConn := printf "%s;%s;%s" $kafkaHost $kafkaPort $rawTopic }}
{{- $redisHost := include "vss-rtvi-cv.mcTrackingRedisHost" . }}
{{- $redisPort := $mcTracking.redisPort | default "6379" }}
{{- $mqttEndpoint := printf "%s:%s" (include "vss-rtvi-cv.mcTrackingMqttHost" .) ($mcTracking.mqttPort | default "1883") }}
{{- $dynamicCam := ($mcTracking.dynamicCameraConfig | default dict).enabled }}
{{- $trackerCfg := ternary "/tmp/generated/ds-mc-tracking-tracker-config.yml" (printf "%s/ds-mc-tracking-tracker-config.yml" $bundle) (default false $dynamicCam) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vss-rtvi-cv.fullname" . }}-warehouse-standalone-mc-tracking
  labels:
    {{- include "vss-rtvi-cv.labels" . | nindent 4 }}
    vss-rtvi-cv.profileMode: standalone-mc-tracking
data:
{{- range $path, $_ := .Files.Glob "files/warehouse-standalone-mc-tracking/deepstream/configs/*" }}
{{- $base := base $path }}
{{- $content := $.Files.Get $path }}
{{- if eq $base "ds-main-config-mc-tracking.txt" }}
  {{ $base }}: |
{{- $c := replace "msg-broker-conn-str=localhost;9092;mdx-raw" (printf "msg-broker-conn-str=%s" $kafkaConn) $content }}
{{- $c = replace "topic=mdx-raw" (printf "topic=%s" $rawTopic) $c }}
{{- $c = replace "msg-broker-config=ds-kafka-config.txt" (printf "msg-broker-config=%s/ds-kafka-config.txt" $bundle) $c }}
{{- $c = replace "config-file=ds-pgie-config.yml" (printf "config-file=%s/ds-pgie-config.yml" $bundle) $c }}
{{- $c = replace "ll-config-file=ds-mc-tracking-tracker-config.yml" (printf "ll-config-file=%s" $trackerCfg) $c }}
{{- $c = replace "http-port=9000" (printf "http-port=%v" $.Values.httpPort) $c }}
{{- $c = regexReplaceAll "(?m)^max-batch-size=4$" $c (printf "max-batch-size=%s" ($mcTracking.maxBatchSize | default "4")) }}
{{- $c = regexReplaceAll "(?m)^batch-size=4$" $c (printf "batch-size=%s" ($mcTracking.batchSize | default "4")) }}
{{ $c | nindent 4 }}
{{- else if eq $base "ds-main-redis-config-mc-tracking.txt" }}
  {{ $base }}: |
{{- $c := replace "msg-broker-conn-str=localhost;6379;" (printf "msg-broker-conn-str=%s;%s;" $redisHost $redisPort) $content }}
{{- $c = replace "topic=mdx-raw" (printf "topic=%s" $rawTopic) $c }}
{{- $c = replace "msg-broker-config=ds-redis-config.txt" (printf "msg-broker-config=%s/ds-redis-config.txt" $bundle) $c }}
{{- $c = replace "config-file=ds-pgie-config.yml" (printf "config-file=%s/ds-pgie-config.yml" $bundle) $c }}
{{- $c = replace "ll-config-file=ds-mc-tracking-tracker-config.yml" (printf "ll-config-file=%s" $trackerCfg) $c }}
{{- $c = replace "http-port=9000" (printf "http-port=%v" $.Values.httpPort) $c }}
{{- $c = regexReplaceAll "(?m)^max-batch-size=4$" $c (printf "max-batch-size=%s" ($mcTracking.maxBatchSize | default "4")) }}
{{- $c = regexReplaceAll "(?m)^batch-size=4$" $c (printf "batch-size=%s" ($mcTracking.batchSize | default "4")) }}
{{ $c | nindent 4 }}
{{- else if eq $base "ds-redis-config.txt" }}
  {{ $base }}: |
{{- $c := replace "hostname=localhost" (printf "hostname=%s" $redisHost) $content }}
{{- $c = replace "port=6379" (printf "port=%s" $redisPort) $c }}
{{ $c | nindent 4 }}
{{- else if eq $base "ds-pgie-config.yml" }}
  {{ $base }}: |
{{- $c := replace "labelfile-path: ds-detector-labels.txt" (printf "labelfile-path: %s/ds-detector-labels.txt" $bundle) $content }}
{{ $c | nindent 4 }}
{{- else if eq $base "pub_sub_info_config.yml" }}
  {{ $base }}: |
{{ replace "localhost:1883" $mqttEndpoint $content | nindent 4 }}
{{- else }}
  {{ $base }}: |
{{ $content | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
