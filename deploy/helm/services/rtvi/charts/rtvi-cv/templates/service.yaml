{{- if and .Values.enabled (or (eq .Values.profileMode "alerts") .Values.httpPort) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vss-rtvi-cv.fullname" . }}
  labels:
    app.kubernetes.io/name: vss-rtvi-cv
    app.kubernetes.io/instance: {{ .Release.Name }}
  {{- if or .Values.streamAffinity.enabled .Values.ingressTimeoutServer }}
  annotations:
  {{- if .Values.streamAffinity.enabled }}
    # Stick-table stream affinity: the first request for a hashHeader value is
    # balanced normally (controller default round-robin) and the chosen server
    # is recorded in the table; every later request carrying the same value is
    # routed to that server until the entry idles out. Requests without the
    # header are balanced without sticking — no uuid fallback is needed (under
    # the former hdr-hash balancing, header-less requests all hashed to one
    # replica; under stick-tables they simply round-robin).
    haproxy.org/backend-config-snippet: |
      stick-table type string len 64 size {{ .Values.streamAffinity.tableSize }} expire {{ .Values.streamAffinity.tableExpire }}
      stick on req.hdr({{ .Values.streamAffinity.hashHeader }}) if { req.hdr({{ .Values.streamAffinity.hashHeader }}) -m found }
  {{- end }}
  {{- with .Values.ingressTimeoutServer }}
    # Server-side timeout for this backend. Set here rather than on the Ingress
    # so a long embedding call does not raise the ceiling for every other route
    # sharing the origin.
    haproxy.org/timeout-server: {{ . | quote }}
  {{- end }}
  {{- end }}
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ ternary .Values.service.port .Values.httpPort (eq .Values.profileMode "alerts") }}
      targetPort: {{ ternary .Values.service.port .Values.httpPort (eq .Values.profileMode "alerts") }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: vss-rtvi-cv
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
