{{- if and .Values.enabled (eq .Values.profileMode "standalone-mv3dt") .Values.standaloneWarehouse.mv3dt.mosquitto.enabled }}
{{- $mqtt := .Values.standaloneWarehouse.mv3dt.mosquitto }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vss-rtvi-cv.fullname" . }}-mosquitto
  labels:
    app.kubernetes.io/name: vss-rtvi-cv-mosquitto
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vss-rtvi-cv-mosquitto
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vss-rtvi-cv-mosquitto
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mosquitto
          image: {{ $mqtt.image.repository }}:{{ $mqtt.image.tag }}
          imagePullPolicy: {{ $mqtt.image.pullPolicy | default "IfNotPresent" }}
          ports:
            - name: mqtt
              containerPort: {{ $mqtt.service.port | default 1883 }}
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 5
          {{- with $mqtt.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: mosquitto-config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
              readOnly: true
      volumes:
        - name: mosquitto-config
          configMap:
            name: {{ include "vss-rtvi-cv.fullname" . }}-warehouse-standalone-mv3dt-mosquitto
            defaultMode: 420
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vss-rtvi-cv.fullname" . }}-mosquitto
  labels:
    app.kubernetes.io/name: vss-rtvi-cv-mosquitto
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: {{ $mqtt.service.type | default "ClusterIP" }}
  ports:
    - name: mqtt
      port: {{ $mqtt.service.port | default 1883 }}
      targetPort: mqtt
      protocol: TCP
  selector:
    app.kubernetes.io/name: vss-rtvi-cv-mosquitto
    app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
