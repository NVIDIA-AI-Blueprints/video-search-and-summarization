{{- if and .Values.enabled (eq .Values.profileMode "alerts") }}
{{- $engineCache := .Values.engineCache | default dict }}
{{- $engineCacheEnabled := $engineCache.enabled | default false }}
{{- $engineCacheSubPath := $engineCache.subPath | default "engines" }}
{{- $waitForKafkaConfig := .Values.waitForKafka | default dict }}
{{- $waitForKafka := $waitForKafkaConfig.enabled | default false }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.statefulSetName | quote }}
  labels:
    app.kubernetes.io/name: vss-rtvi-cv
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  serviceName: {{ include "vss-rtvi-cv.headlessServiceName" . }}
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: vss-rtvi-cv
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vss-rtvi-cv
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- if .Values.runtimeClassName }}
      runtimeClassName: {{ .Values.runtimeClassName | quote }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- if $engineCacheEnabled }}
        - name: prepare-engine-cache
          image: docker.io/library/busybox:1.37.0
          command:
            - sh
            - -c
            - |
              ENGINE_CACHE_ROOT="/models-data/{{ $engineCacheSubPath }}"
              mkdir -p "${ENGINE_CACHE_ROOT}/gdino" "${ENGINE_CACHE_ROOT}/rtdetr-its"
              chmod -R a+rwX "${ENGINE_CACHE_ROOT}"
              chmod -R a+rwX /models-data/rtdetr-its /models-data/gdino 2>/dev/null || true
          volumeMounts:
            - name: models
              mountPath: /models-data
        {{- end }}
        {{- if $waitForKafka }}
        - name: wait-for-kafka
          image: docker.io/library/busybox:1.37.0
          command:
            - sh
            - -c
            - |
              echo "Waiting for Kafka to be ready..."
              until nc -z {{ include "vss-rtvi-cv.kafkaBootstrap" . | replace ":9092" "" }} 9092; do
                echo "Kafka not ready yet, waiting..."
                sleep 5
              done
              echo "Kafka is ready!"
        {{- end }}
      containers:
        - name: vss-rtvi-cv
          image: {{ include "vss-rtvi-cv.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsUser: 0
          workingDir: {{ .Values.workingDir | quote }}
          command:
            - bash
            - /startup-script/ds-start.sh
          env:
            - name: DS_MODEL_FAMILY
              value: {{ .Values.env.DS_MODEL_FAMILY | quote }}
            - name: DS_CONFIG_FILE
              value: {{ .Values.env.DS_CONFIG_FILE | default "" | quote }}
            - name: DS_VISION_ENCODER
              value: {{ .Values.env.DS_VISION_ENCODER | default "false" | quote }}
            - name: DS_TRACKER_REID
              value: {{ .Values.env.DS_TRACKER_REID | default "false" | quote }}
            - name: DS_SHOW_SENSOR_ID
              value: {{ .Values.env.DS_SHOW_SENSOR_ID | default "false" | quote }}
            - name: MODEL_NAME_2D
              value: {{ .Values.env.MODEL_NAME_2D | quote }}
            - name: NUM_SENSORS
              value: {{ .Values.env.NUM_SENSORS | quote }}
            - name: STREAM_TYPE
              value: {{ .Values.env.STREAM_TYPE | quote }}
            - name: HARDWARE_PROFILE
              value: {{ .Values.env.HARDWARE_PROFILE | default "" | quote }}
            - name: DS_MODE_FLAG
              value: {{ .Values.env.DS_MODE_FLAG | default "1" | quote }}
            - name: DS_MESSAGE_RATE
              value: {{ .Values.env.DS_MESSAGE_RATE | default "1" | quote }}
            {{- if .Values.downloadModelsFromNgc }}
            - name: NGC_CLI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ngcApiKeySecretName | quote }}
                  key: {{ .Values.ngcApiKeySecretKey | quote }}
            - name: MODELS_MANIFEST_PATH
              value: "/startup-script/models-download.json"
            - name: MODELS_DEST_ROOT
              value: "/opt/storage"
            - name: STORAGE_UID
              value: {{ (.Values.ngcDownload.storageUid | default 1001) | quote }}
            - name: STORAGE_GID
              value: {{ (.Values.ngcDownload.storageGid | default 1001) | quote }}
            - name: DS_MODEL_DOWNLOAD
              value: "auto"
            - name: DOWNLOAD_MODELS_SCRIPT
              value: "/startup-script/download-models.sh"
            {{- else }}
            - name: DS_MODEL_DOWNLOAD
              value: "never"
            {{- end }}
          volumeMounts:
            - name: startup-script
              mountPath: /startup-script
              readOnly: true
            - name: models
              mountPath: /opt/storage
            {{- if $engineCacheEnabled }}
            - name: models
              mountPath: /opt/engines
              subPath: {{ $engineCacheSubPath | quote }}
            {{- end }}
            {{- $wd := .Values.workingDir }}
            - name: profile-configs
              mountPath: {{ $wd }}/mounted-configs
              readOnly: true
            - name: runtime-configs
              mountPath: {{ $wd }}/configs
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: startup-script
          configMap:
            name: {{ include "vss-rtvi-cv.fullname" . }}-ds-start
            defaultMode: 493
        - name: profile-configs
          configMap:
            name: {{ include "vss-rtvi-cv.scriptsConfigMapName" . }}
            defaultMode: 420
        - name: runtime-configs
          emptyDir: {}
        - name: models
          {{- if .Values.modelsVolume }}
          {{- toYaml .Values.modelsVolume | nindent 10 }}
          {{- else if .Values.downloadModelsFromNgc }}
          persistentVolumeClaim:
            claimName: {{ include "vss-rtvi-cv.fullname" . }}-models
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- if and .Values.enabled (eq .Values.profileMode "search") }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "vss-rtvi-cv.fullname" . }}
  labels:
    {{- include "vss-rtvi-cv.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "vss-rtvi-cv.headlessServiceName" . }}
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "vss-rtvi-cv.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vss-rtvi-cv.selectorLabels" . | nindent 8 }}
      annotations:
        scripts-configmap: {{ include "vss-rtvi-cv.scriptsConfigMapName" . | quote }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $ips := .Values.imagePullSecrets | default .Values.global.imagePullSecrets }}
      {{- with $ips }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-kafka
          image: docker.io/library/busybox:1.37.0
          command:
            - sh
            - -c
            - |
              echo "Waiting for Kafka to be ready..."
              until nc -z {{ include "vss-rtvi-cv.kafkaBootstrap" . | replace ":9092" "" }} 9092; do
                echo "Kafka not ready yet, waiting..."
                sleep 5
              done
              echo "Kafka is ready!"
      containers:
        - name: vss-rtvi-cv
          image: {{ include "vss-rtvi-cv.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsUser: 0
          workingDir: /opt/nvidia/deepstream/deepstream/sources/apps/sample_apps/metropolis_perception_app
          command:
            - bash
            - /startup-script/ds-start.sh
          {{- if .Values.httpPort }}
          ports:
            - name: http
              containerPort: {{ .Values.httpPort }}
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: {{ .Values.httpPort }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: {{ .Values.httpPort }}
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: {{ .Values.httpPort }}
            periodSeconds: 30
            failureThreshold: 5
            timeoutSeconds: 5
          {{- end }}
          env:
            - name: DS_MODEL_FAMILY
              value: {{ .Values.env.DS_MODEL_FAMILY | quote }}
            - name: DS_CONFIG_FILE
              value: {{ .Values.env.DS_CONFIG_FILE | default "" | quote }}
            - name: MODEL_NAME_2D
              value: {{ .Values.env.MODEL_NAME_2D | quote }}
            - name: DS_TRACKER_REID
              value: {{ .Values.env.DS_TRACKER_REID | default "false" | quote }}
            - name: DS_SHOW_SENSOR_ID
              value: {{ .Values.env.DS_SHOW_SENSOR_ID | default "false" | quote }}
            - name: NUM_SENSORS
              value: {{ .Values.env.NUM_SENSORS | quote }}
            - name: DS_VISION_ENCODER
              value: {{ .Values.env.DS_VISION_ENCODER | default "false" | quote }}
            - name: VISION_ENCODER_MODEL
              value: {{ .Values.env.VISION_ENCODER_MODEL | default "" | quote }}
            - name: VISION_ENCODER_VERSION
              value: {{ .Values.env.VISION_ENCODER_VERSION | default "" | quote }}
            - name: STREAM_TYPE
              value: {{ .Values.env.STREAM_TYPE | default .Values.streamType | quote }}
            - name: HARDWARE_PROFILE
              value: {{ .Values.env.HARDWARE_PROFILE | default "" | quote }}
            - name: DS_MODE_FLAG
              value: {{ .Values.env.DS_MODE_FLAG | default "1" | quote }}
            - name: DS_MESSAGE_RATE
              value: {{ .Values.env.DS_MESSAGE_RATE | default "1" | quote }}
            - name: DEEPSTREAM_ENABLE_SENSOR_ID_EXTRACTION
              value: {{ .Values.deepstreamEnableSensorIdExtraction | quote }}
            - name: GST_ENABLE_CUSTOM_PARSER_MODIFICATIONS
              value: {{ .Values.gstEnableCustomParserModifications | quote }}
            - name: GST_PLUGIN_PATH
              value: "/opt/nvidia/deepstream/deepstream/sources/gst-plugins/gst-nvdstextembedder"
            - name: HF_HUB_OFFLINE
              value: {{ .Values.hfHubOffline | quote }}
            - name: TRANSFORMERS_OFFLINE
              value: {{ .Values.transformersOffline | quote }}
            - name: OTEL_SDK_DISABLED
              value: {{ .Values.otelSdkDisabled | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otelServiceName | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://localhost:4318"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: MDX_KAFKA_BOOTSTRAP_SERVERS
              value: {{ include "vss-rtvi-cv.kafkaBootstrap" . | quote }}
            {{- if .Values.downloadModelsFromNgc }}
            - name: NGC_CLI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ngcApiKeySecretName | quote }}
                  key: {{ .Values.ngcApiKeySecretKey | quote }}
            - name: MODELS_MANIFEST_PATH
              value: "/startup-script/models-download.json"
            - name: MODELS_DEST_ROOT
              value: "/opt/storage"
            - name: STORAGE_UID
              value: {{ (.Values.ngcDownload.storageUid | default 1001) | quote }}
            - name: STORAGE_GID
              value: {{ (.Values.ngcDownload.storageGid | default 1001) | quote }}
            - name: DS_MODEL_DOWNLOAD
              value: "auto"
            - name: DOWNLOAD_MODELS_SCRIPT
              value: "/startup-script/download-models.sh"
            {{- else }}
            - name: DS_MODEL_DOWNLOAD
              value: "never"
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: models
              mountPath: /opt/storage
            - name: startup-script
              mountPath: /startup-script
              readOnly: true
            - name: profile-configs
              mountPath: /opt/nvidia/deepstream/deepstream/sources/apps/sample_apps/metropolis_perception_app/mounted-configs
              readOnly: true
            - name: runtime-configs
              mountPath: /opt/nvidia/deepstream/deepstream/sources/apps/sample_apps/metropolis_perception_app/configs
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "vss-rtvi-cv.fullname" . }}-models
        - name: startup-script
          configMap:
            name: {{ include "vss-rtvi-cv.fullname" . }}-ds-start
            defaultMode: 493
        - name: profile-configs
          configMap:
            name: {{ include "vss-rtvi-cv.scriptsConfigMapName" . }}
            defaultMode: 420
        - name: runtime-configs
          emptyDir: {}
{{- end }}
