# DeepStream configs for profileMode standalone-3d (warehouse 3D + SDRC-provisioned live sources).

{{- if and .Values.enabled (eq .Values.profileMode "standalone-3d") }}
{{- $bundle := "/opt/nvidia/deepstream/deepstream/sources/apps/sample_apps/metropolis_perception_app/configs" }}
{{- $warehouse := .Values.standaloneWarehouse | default dict }}
{{- $kafka := $warehouse.kafka | default dict }}
{{- $rawTopic := $kafka.rawTopic | default "mdx-raw" }}
{{- $kafkaBootstrap := include "vss-rtvi-cv.kafkaBootstrap" . }}
{{- $kafkaParts := splitList ":" $kafkaBootstrap }}
{{- $kafkaHost := first $kafkaParts }}
{{- $kafkaPort := "9092" }}
{{- if gt (len $kafkaParts) 1 }}
{{- $kafkaPort = last $kafkaParts }}
{{- end }}
{{- $kafkaConn := printf "%s;%s;%s" $kafkaHost $kafkaPort $rawTopic }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vss-rtvi-cv.fullname" . }}-warehouse-standalone-3d
  labels:
    {{- include "vss-rtvi-cv.labels" . | nindent 4 }}
    vss-rtvi-cv.profileMode: standalone-3d
data:
{{- range $path, $_ := .Files.Glob "files/warehouse-standalone-3d/deepstream/configs/*" }}
{{- $base := base $path }}
{{- $content := $.Files.Get $path }}
  {{ $base }}: |
{{- if eq $base "config.yaml" }}
{{ tpl $content $ | nindent 4 }}
{{- else if eq $base "ds-main-config.txt" }}
{{- $c := replace "msg-broker-config=ds-kafka-config.txt" (printf "msg-broker-config=%s/ds-kafka-config.txt" $bundle) $content }}
{{- $c = replace "msg-broker-conn-str=localhost;9092;mdx-bev" (printf "msg-broker-conn-str=%s" $kafkaConn) $c }}
{{- $c = replace "topic=mdx-bev" (printf "topic=%s" $rawTopic) $c }}
{{ $c | nindent 4 }}
{{- else }}
{{ $content | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
