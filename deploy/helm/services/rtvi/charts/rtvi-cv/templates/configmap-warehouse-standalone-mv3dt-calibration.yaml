#
# Camera geometry for the fusion service, mirroring the standalone-3d profile.
# Unlike that profile, mv3dt derives camInfo at runtime from
# dynamicCameraConfig.calibrationApiUrl and ships no calibration of its own, so
# this renders only once the file is supplied. Until then the fusion methods
# that need geometry (rays, closest) lose it, which is the intended
# failure: they cannot be correct without it.
{{- if and .Values.enabled (eq .Values.profileMode "standalone-mv3dt") .Values.standaloneWarehouse.mv3dt.fusion.enabled }}
{{- $calibration := .Files.Get "files/warehouse-standalone-mv3dt/calibration/calibration.json" }}
{{- if $calibration }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vss-rtvi-cv.fullname" . }}-warehouse-standalone-mv3dt-calibration
  labels:
    {{- include "vss-rtvi-cv.labels" . | nindent 4 }}
data:
  calibration.json: |
{{ $calibration | nindent 4 }}
{{- end }}
{{- end }}
