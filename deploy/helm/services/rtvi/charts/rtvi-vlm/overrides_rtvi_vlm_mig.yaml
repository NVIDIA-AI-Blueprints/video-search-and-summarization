#
# Example override for an RTVI-VLM pod on one MIG slice. Apply this together
# with overrides_rtvi_vlm.yaml, changing the resource name to one advertised
# by the NVIDIA Kubernetes device plugin on the target cluster:
#
#   helm upgrade --install vss-rtvi-vlm . -n <ns> \
#     -f overrides_rtvi_vlm.yaml -f overrides_rtvi_vlm_mig.yaml
#
# This chart deliberately does not set NVIDIA_VISIBLE_DEVICES. The Kubernetes
# NVIDIA device plugin injects the allocated full GPU or MIG device. RTVI-VLM
# then uses it as logical CUDA device 0.

gpuResourceName: "nvidia.com/mig-3g.40gb"
