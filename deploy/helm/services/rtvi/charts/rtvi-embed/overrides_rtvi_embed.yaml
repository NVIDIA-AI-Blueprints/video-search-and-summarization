#
# Standalone install example for rtvi-embed.
# This override is intended for environments where you run only the embed chart
# and provide dependency endpoints/secrets explicitly.
#
# Usage:
#   helm upgrade --install vss-rtvi-embed . -n <ns> -f overrides_rtvi_embed.yaml
#
# Prerequisites in target namespace:
#   - secret with HF token      (example: hf-token-secret, key HF_TOKEN)
#   - if using private NGC model source, set ngcApiKey or adapt to secret flow
#

imagePullSecrets: []

# Shared managed-image channel. Set global.container_prefix and
# global.container_tag when installing a promoted or alternate build.
# For SBSA/DGX-Spark, retain the repository and set image.tag to
# develop-latest-sbsa (or set global.container_tag when appropriate).
image:
  repository: ghcr.io/nvidia-ai-blueprints/vss/vss-rt-embed
  tag: develop-latest
  pullPolicy: IfNotPresent

# Model source and implementation paths
modelPath: "git:https://huggingface.co/nvidia/Cosmos-Embed1-448p"
modelImplementationPath: "/opt/nvidia/rtvi/rtvi/models/custom/samples/cosmos-embed1"
modelRepositoryScriptPath: "/opt/nvidia/rtvi/rtvi/models/custom/samples/cosmos-embed1/create_triton_model_repo.py"
remoteEmbedEndpoint: ""
remoteEmbedEndpointModelName: "nvidia/cosmos-embed1"
remoteEmbedEndpointApiKey: ""
remoteEmbedEndpointApiKeySecret:
  name: ""
  key: "REMOTE_EMBED_ENDPOINT_API_KEY"
remoteEmbedEndpointTimeoutSec: "300"
remoteEmbedEndpointBatchSize: "64"

# Standalone dependency endpoints (chart does not deploy kafka/redis itself)
kafkaBootstrapServers: "127.0.0.1:9092"
messageBus: ""
messageBusTopic: "mdx-embed"
errorBus: ""
waitForKafka:
  enabled: false
redisHost: "127.0.0.1"
redisPort: "6379"

# Secret-based HF token injection (preferred)
hfTokenSecret:
  name: hf-token-secret
  key: HF_TOKEN

# Fallback plain value path (unused when hfTokenSecret.name is set)
hfToken: ""

# Optional runtime tuning
logLevel: "INFO"
enableOtelMonitoring: false
enableRedisErrorMessages: false
enableRequestProfiling: false
installProprietaryCodes: false

numGpus: ""
numVlmProcs: ""
vlmBatchSize: "8"

rtspTimeout: ""
rtspLatency: ""
rtspReconnectionInterval: "5"
rtspReconnectionMaxAttempts: "10"
rtspReconnectionWindow: "60"
assetDownloadConnectTimeout: "10"
assetDownloadTotalTimeout: "300"
assetDownloadMaxFileSizeGb: 8
assetDownloadSslSkipVerifyDomains: ""
assetDownloadMaxRedirects: "0"
assetDownloadAuthTokens: ""
assetDownloadAuthTokensSecret:
  name: ""
  key: "ASSET_DOWNLOAD_AUTH_TOKENS"
fileUrlAllowedDirs: ""
maxAssetStorageSizeGb: ""
assetMaxAgeHours: "0"

resources:
  limits:
    nvidia.com/gpu: 1
