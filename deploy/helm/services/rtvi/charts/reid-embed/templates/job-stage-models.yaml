#
# One-shot staging of the ReID assets, mirroring Compose's
# vss-reid-embed-init-mv3dt: the SigLIP2 secondary embedding model from NGC and
# the CLIP-ReID tracker ONNX. Both land on the RT-CV models claim under
# <mountPath>/<subDir> so the DeepStream tracker and this chart's service read
# the same files.

{{- if and .Values.enabled .Values.init.enabled }}
{{- $reidDir := include "vss-reid-embed.reidDir" . }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vss-reid-embed.initFullname" . }}
  labels:
    {{- include "vss-reid-embed.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.init.backoffLimit }}
  {{- with .Values.init.ttlSecondsAfterFinished }}
  ttlSecondsAfterFinished: {{ . }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "vss-reid-embed.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $ips := .Values.imagePullSecrets | default (index (.Values.global | default dict) "imagePullSecrets") }}
      {{- with $ips }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.runtimeClassName }}
      runtimeClassName: {{ .Values.runtimeClassName | quote }}
      {{- end }}
      initContainers:
        # workingDir cannot create its own path, and the script writes relative
        # to $(pwd), so the target has to exist before the main container runs.
        - name: ensure-reid-dir
          image: docker.io/library/busybox:1.37.0
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p {{ $reidDir | quote }}
              chmod 0777 {{ $reidDir | quote }}
              echo "[INFO] ReID staging directory ready."
          volumeMounts:
            - name: models
              mountPath: {{ .Values.models.mountPath }}
      containers:
        - name: stage-reid-models
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          workingDir: {{ $reidDir | quote }}
          env:
            - name: NGC_CLI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "vss-reid-embed.ngcSecretName" . }}
                  key: {{ include "vss-reid-embed.ngcSecretKey" . }}
            # The perception container drops to this UID/GID, so staged files
            # are handed over rather than left owned by root.
            - name: STORAGE_UID
              value: {{ .Values.models.storageUid | quote }}
            - name: STORAGE_GID
              value: {{ .Values.models.storageGid | quote }}
          command:
            - bash
            - -c
            - |
              set -euo pipefail
              bash /opt/scripts/download-embedding-models.sh --secondary --clipreid
              touch {{ include "vss-reid-embed.readyMarker" . | quote }}
              echo "[INFO] ReID model staging complete."
          {{- with .Values.init.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: models
              mountPath: {{ .Values.models.mountPath }}
            - name: scripts
              mountPath: /opt/scripts
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ include "vss-reid-embed.modelsClaim" . }}
        - name: scripts
          configMap:
            name: {{ include "vss-reid-embed.scriptsConfigMapName" . }}
            defaultMode: 493
{{- end }}
