#
# Milvus metadata store for the ReID gallery. Storage is an emptyDir on
# purpose: the gallery is rebuilt from the live stream, so nothing here
# outlives the pod.

{{- if .Values.enabled }}
{{- $name := include "vss-reid-embed.etcdFullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "vss-reid-embed.etcdLabels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "vss-reid-embed.etcdSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vss-reid-embed.etcdSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $ips := .Values.imagePullSecrets | default (index (.Values.global | default dict) "imagePullSecrets") }}
      {{- with $ips }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: etcd
          image: "{{ .Values.etcd.image.repository }}:{{ .Values.etcd.image.tag }}"
          imagePullPolicy: {{ .Values.etcd.image.pullPolicy }}
          env:
            - name: ETCD_AUTO_COMPACTION_MODE
              value: {{ .Values.etcd.autoCompactionMode | quote }}
            - name: ETCD_AUTO_COMPACTION_RETENTION
              value: {{ .Values.etcd.autoCompactionRetention | quote }}
            - name: ETCD_QUOTA_BACKEND_BYTES
              value: {{ .Values.etcd.quotaBackendBytes | quote }}
            - name: ETCD_SNAPSHOT_COUNT
              value: {{ .Values.etcd.snapshotCount | quote }}
          command:
            - etcd
            - -advertise-client-urls=http://{{ $name }}:{{ .Values.etcd.port }}
            - -listen-client-urls
            - http://0.0.0.0:{{ .Values.etcd.port }}
            - --data-dir
            - /etcd
          ports:
            - name: client
              containerPort: {{ .Values.etcd.port }}
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - etcdctl
                - endpoint
                - health
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 5
          livenessProbe:
            exec:
              command:
                - etcdctl
                - endpoint
                - health
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          {{- with .Values.etcd.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /etcd
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "vss-reid-embed.etcdLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: client
      port: {{ .Values.etcd.port }}
      targetPort: client
      protocol: TCP
  selector:
    {{- include "vss-reid-embed.etcdSelectorLabels" . | nindent 4 }}
{{- end }}
