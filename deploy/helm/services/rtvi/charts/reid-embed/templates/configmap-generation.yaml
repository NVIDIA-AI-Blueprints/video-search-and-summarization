#
# The staging Job writes this revision into .reid-models-ready. Waiters (this
# chart and rtvi-cv) require a match, so a leftover marker from an earlier
# successful run cannot look like the current generation is ready.

{{- if and .Values.enabled .Values.init.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vss-reid-embed.generationConfigMapName" . }}
  labels:
    {{- include "vss-reid-embed.labels" . | nindent 4 }}
data:
  revision: {{ include "vss-reid-embed.initJobRevision" . | quote }}
{{- end }}
