#
# Compose bind-mounts services/rtvi/reid-embed at /opt/scripts; Helm has no
# host path to bind, so the same two files ship in the chart and are mounted
# from this ConfigMap. download-embedding-models.sh looks for the converter
# next to itself, so both must land in one directory.
#
# ../files/ holds verbatim copies of the canonical scripts in
# deploy/docker/services/rtvi/reid-embed/. Helm cannot package files from
# outside the chart directory, so the copies are unavoidable -- update both
# when either changes.

{{- if and .Values.enabled .Values.init.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "vss-reid-embed.scriptsConfigMapName" . }}
  labels:
    {{- include "vss-reid-embed.labels" . | nindent 4 }}
data:
  download-embedding-models.sh: |
{{ .Files.Get "files/download-embedding-models.sh" | nindent 4 }}
  convert_clipreid_to_onnx.py: |
{{ .Files.Get "files/convert_clipreid_to_onnx.py" | nindent 4 }}
{{- end }}
