enabled: false
global: {}

image:
  repository: ghcr.io/nvidia-ai-blueprints/vss/vss-vios-nvstreamer
  tag: "develop-latest"
  pullPolicy: IfNotPresent
replicas: 1

# K8s service addresses (default: release-based). Override if services are in another namespace.
kafkaServerAddress: ""   # default: kafka-kafka:9092 (<release>-kafka-kafka:9092 if global.useReleaseNamePrefix)
redisServerAddress: ""   # default: <release>-redis:6379 (host:port for redis_server_env_var or direct address)
videoMetadataServerUrl: ""   # default: http://<release>-elasticsearch:9200/mdx-raw*

# nv_streamer_sync_file_count. Compose gets this from the blueprint configurator
# (final_stream_count); set it to the stream count or nvstreamer serves no media.
syncFileCount: 0

env:
  ADAPTOR: "streamer"
  HTTP_PORT: "31000"
  # Public UI/API path. A non-empty value requires the upstream proxy to strip it.
  NVSTREAMER_UI_BASE_PATH: ""
  NVSTREAMER_INSTALL_ADDITIONAL_PACKAGES: "true"
  # Point APT at an internal/nearby mirror. Empty uses the public archive.
  VST_APT_MIRROR: ""
  # Where the shared APT cache is mounted. user_additional_install.sh reads this
  # env var; a non-empty value is only meaningful when sharedAptCache.enabled=true
  # (the volume is otherwise absent and the script falls back to a network install).
  VST_APT_CACHE_DIR: "/opt/apt-cache"

# Shared APT package cache -- helm mirror of the vios-apt-cache-init service and
# the vios_apt_cache named volume added in deploy/docker for PR #1675.
#
# Docker compose stands up a one-shot init container that populates a named
# volume that every nvstreamer / streamprocessing pod then mounts read-only.
# k8s has no compose-style depends_on across releases and no compose-style
# named volumes; the analogue is a RWX PVC + a Helm pre-install/pre-upgrade Job
# that runs the same populate step. That works only where the cluster has a
# RWX-capable storageClass. This is default-off; enable per install after
# confirming your cluster supports the PVC.
#
# WARNING: this block was generated by helm-sync-bot at low confidence (2/5).
# Review carefully before enabling. The docker-side compose changes will work
# without this: user_additional_install.sh falls back to a normal network
# install when the cache directory is missing.
sharedAptCache:
  enabled: false
  size: 1Gi
  storageClass: ""     # requires a RWX-capable storageClass; empty = cluster default
  accessMode: ReadWriteMany
  # Explicit PVC name to reuse a cache populated by another chart. When empty,
  # this chart creates its own PVC.
  existingClaim: ""

service:
  port: 31000
  type: ClusterIP
  # Set when type is NodePort (e.g. 31000) for installs without an ingress controller.
  nodePort: null

# Run as root (0:0) to match Compose user
securityContext:
  runAsUser: 0
  runAsGroup: 0

# streamer_videos backing store. Same shape as vios-streamprocessing.persistence.
# hostPath is the path for customer videos already staged on the node; it wins
# over the PVC when set, and pins the pod to that node.
persistence:
  streamerVideos:
    enabled: false
    existingClaim: ""
    hostPath: ""
    hostPathType: DirectoryOrCreate

# Sample videos from the NGC warehouse app-data bundle. Skipped if videos exist.
# fromExistingClaim reuses the bundle the rtvi-cv job pulled, so no second
# download. RWO claims pin both to one node, so that path is single-node only.
# Multi-node: use RWX storage, or clear fromExistingClaim and set resourceVersion.
ngcVideoSeed:
  enabled: false
  # Dataset directory under vss-warehouse-app-data/videos. Empty copies them all.
  dataset: ""
  fromExistingClaim: ""
  # How long to wait for fromExistingClaim to be populated by the NGC job.
  waitSeconds: 3600
  resourceVersion: ""
  org: nvidia
  apiKeySecretName: ngc-api
  apiKeySecretKey: NGC_CLI_API_KEY
  image:
    repository: docker.io/library/ubuntu
    tag: "22.04"
    pullPolicy: IfNotPresent

# vst_data stays on emptyDir
resources: {}
nodeSelector: {}
tolerations: []