{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vss-vios-nvstreamer.fullname" . }}
  labels:
    app.kubernetes.io/name: vss-vios-nvstreamer
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: vss-vios-nvstreamer
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vss-vios-nvstreamer
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/config: {{ list (.Files.Get "configs/vst-config.json") (.Files.Get "configs/notification-config.json") (.Files.Get "configs/vst-storage.json") | join "" | sha256sum }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $seed := .Values.ngcVideoSeed | default dict }}
      {{- $sac := .Values.sharedAptCache | default dict }}
      {{- if or $seed.enabled $sac.enabled }}
      initContainers:
        {{- if $sac.enabled }}
        # Populate the shared APT package cache in-pod. Mirrors the
        # vios-apt-cache-init compose service (PR #1675). Best-effort: on
        # failure the main container's user_additional_install.sh falls back
        # to a normal networked install.
        - name: vios-apt-cache-init
          image: {{ include "vss-vios-nvstreamer.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "-c"]
          args:
            - |
              if [ "${VST_INSTALL_ADDITIONAL_PACKAGES:-}" = "true" ]; then
                /home/vst/vst_release/tools/user_additional_install.sh \
                  || echo 'cache populate failed (best-effort); consumers will download'
              else
                echo 'additional packages disabled; nothing to cache'
              fi
          env:
            - name: VST_INSTALL_ADDITIONAL_PACKAGES
              value: {{ .Values.env.NVSTREAMER_INSTALL_ADDITIONAL_PACKAGES | quote }}
            - name: VST_APT_CACHE_POPULATE
              value: "true"
            - name: VST_APT_CACHE_DIR
              value: {{ .Values.env.VST_APT_CACHE_DIR | default "/opt/apt-cache" | quote }}
            - name: VST_APT_MIRROR
              value: {{ .Values.env.VST_APT_MIRROR | default "" | quote }}
          volumeMounts:
            - name: user-install-script
              mountPath: /home/vst/vst_release/tools/user_additional_install.sh
              subPath: user_additional_install.sh
            - name: vios-apt-cache
              mountPath: {{ .Values.env.VST_APT_CACHE_DIR | default "/opt/apt-cache" | quote }}
        {{- end }}
        {{- if $seed.enabled }}
        - name: prepare-streamer-videos
          {{- if $seed.fromExistingClaim }}
          image: "busybox:1.37.0"
          {{- else }}
          image: "{{ $seed.image.repository }}:{{ $seed.image.tag }}"
          imagePullPolicy: {{ $seed.image.pullPolicy | default "IfNotPresent" }}
          env:
            - name: NGC_CLI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $seed.apiKeySecretName | default "ngc-api" }}
                  key: {{ $seed.apiKeySecretKey | default "NGC_CLI_API_KEY" }}
          {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              set -e
              DEST=/streamer-videos
              DATASET={{ $seed.dataset | default "" | quote }}
              if [ -n "$(find "${DEST}" -name '*.mp4' -print -quit 2>/dev/null)" ]; then
                echo "[prepare-streamer-videos] videos already present, skipping"
                exit 0
              fi
              {{- if $seed.fromExistingClaim }}
              SRC=/ngc-bundle/vss-warehouse-app-data/videos
              # The rtvi-cv NGC job extracts into this claim in parallel on a fresh
              # install. Wait for its .ngc-extracted marker, not just the videos
              # directory, which tar creates before the files are fully written.
              MARKER=/ngc-bundle/vss-warehouse-app-data/.ngc-extracted
              WAIT={{ $seed.waitSeconds | default 3600 }}
              i=0
              while [ ! -f "${MARKER}" ] && [ "${i}" -lt "${WAIT}" ]; do
                [ $((i % 30)) -eq 0 ] && echo "[prepare-streamer-videos] waiting for the NGC bundle (${i}s)"
                sleep 5; i=$((i + 5))
              done
              if [ ! -f "${MARKER}" ]; then
                echo "[prepare-streamer-videos] ${MARKER} still missing after ${WAIT}s; check the NGC app-data job" >&2
                exit 1
              fi
              {{- end }}
              {{- if not $seed.fromExistingClaim }}
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq && apt-get install -y -qq wget unzip > /dev/null
              cd /tmp
              wget -q https://ngc.nvidia.com/downloads/ngccli_linux.zip -O ngccli_linux.zip
              unzip -q ngccli_linux.zip && chmod +x ngc-cli/ngc
              export PATH="/tmp/ngc-cli:$PATH"
              rm -rf /tmp/ngc-dl && mkdir -p /tmp/ngc-dl
              ngc registry resource download-version {{ required "ngcVideoSeed.resourceVersion is required when fromExistingClaim is unset" $seed.resourceVersion | quote }} \
                --dest /tmp/ngc-dl --org {{ $seed.org | default "nvidia" | quote }}
              TAR="$(find /tmp/ngc-dl -name '*.tar.gz' -type f | head -1)"
              if [ -z "${TAR}" ]; then
                echo "[prepare-streamer-videos] no tarball in the NGC download" >&2
                exit 1
              fi
              mkdir -p /tmp/ngc-x && tar -xzf "${TAR}" -C /tmp/ngc-x
              SRC=/tmp/ngc-x/vss-warehouse-app-data/videos
              {{- end }}
              if [ -n "${DATASET}" ]; then
                SRC="${SRC}/${DATASET}"
              fi
              if [ ! -d "${SRC}" ]; then
                echo "[prepare-streamer-videos] dataset directory ${SRC} not found" >&2
                ls -1 "$(dirname "${SRC}")" 2>/dev/null || true
                exit 1
              fi
              echo "[prepare-streamer-videos] copying videos from ${SRC}"
              find "${SRC}" -name '*.mp4' -exec cp -a {} "${DEST}/" \;
              chmod -R a+rwX "${DEST}" || true
              echo "[prepare-streamer-videos] $(find "${DEST}" -name '*.mp4' | wc -l) video(s) staged"
          volumeMounts:
            - name: streamer-videos
              mountPath: /streamer-videos
            {{- if $seed.fromExistingClaim }}
            - name: ngc-bundle
              mountPath: /ngc-bundle
              readOnly: true
            {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: vss-vios-nvstreamer
          image: {{ include "vss-vios-nvstreamer.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/bash", "-c", "if [ \"$$NVSTREAMER_INSTALL_ADDITIONAL_PACKAGES\" = \"true\" ]; then /home/vst/vst_release/tools/user_additional_install.sh; fi && /home/vst/vst_release/tools/configure_nvstreamer_ui.sh && exec /home/vst/vst_release/launch_vst"]
          env:
            - name: ADAPTOR
              value: {{ .Values.env.ADAPTOR | quote }}
            - name: HTTP_PORT
              value: {{ .Values.env.HTTP_PORT | quote }}
            - name: NVSTREAMER_UI_BASE_PATH
              value: {{ .Values.env.NVSTREAMER_UI_BASE_PATH | quote }}
            - name: NVSTREAMER_INSTALL_ADDITIONAL_PACKAGES
              value: {{ .Values.env.NVSTREAMER_INSTALL_ADDITIONAL_PACKAGES | quote }}
            - name: VST_APT_MIRROR
              value: {{ .Values.env.VST_APT_MIRROR | default "" | quote }}
            {{- if $sac.enabled }}
            - name: VST_APT_CACHE_DIR
              value: {{ .Values.env.VST_APT_CACHE_DIR | default "/opt/apt-cache" | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          volumeMounts:
            - name: config
              mountPath: /home/vst/vst_release/configs/vst_config.json
              subPath: vst_config.json
            - name: config
              mountPath: /home/vst/vst_release/configs/notification_config.json
              subPath: notification_config.json
            - name: config
              mountPath: /home/vst/vst_release/configs/vst_storage.json
              subPath: vst_storage.json
            - name: streamer-videos
              mountPath: /home/vst/vst_release/streamer_videos
            - name: vst-data
              mountPath: /home/vst/vst_release/vst_data
            - name: user-install-script
              mountPath: /home/vst/vst_release/tools/user_additional_install.sh
              subPath: user_additional_install.sh
            {{- if $sac.enabled }}
            - name: vios-apt-cache
              mountPath: {{ .Values.env.VST_APT_CACHE_DIR | default "/opt/apt-cache" | quote }}
              readOnly: true
            {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "vss-vios-nvstreamer.fullname" . }}-config
        - name: user-install-script
          configMap:
            name: {{ include "vss-vios-nvstreamer.fullname" . }}-user-install-script
            defaultMode: 493
        {{- if $sac.enabled }}
        - name: vios-apt-cache
          persistentVolumeClaim:
            claimName: {{ include "vss-vios-nvstreamer.aptCacheClaim" . }}
        {{- end }}
        - name: streamer-videos
          {{- $sv := (.Values.persistence | default dict).streamerVideos | default dict }}
          {{- if $sv.hostPath }}
          hostPath:
            path: {{ $sv.hostPath }}
            type: {{ $sv.hostPathType | default "DirectoryOrCreate" }}
          {{- else if $sv.enabled }}
          persistentVolumeClaim:
            claimName: {{ $sv.existingClaim | default (include "vss-vios-nvstreamer.sharedVstClaimStreamerVideos" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: vst-data
          emptyDir: {}
        {{- if (.Values.ngcVideoSeed | default dict).enabled }}
        {{- if .Values.ngcVideoSeed.fromExistingClaim }}
        - name: ngc-bundle
          persistentVolumeClaim:
            claimName: {{ .Values.ngcVideoSeed.fromExistingClaim }}
            readOnly: true
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
