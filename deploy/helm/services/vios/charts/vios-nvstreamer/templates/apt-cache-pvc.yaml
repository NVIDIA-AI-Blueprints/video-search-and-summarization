# Shared APT package cache -- helm-side mirror of the vios_apt_cache named
# volume added in deploy/docker for PR #1675. Default-off; enable by setting
# sharedAptCache.enabled=true, and confirm your cluster has a RWX-capable
# storageClass first.
{{- if .Values.enabled }}
{{- $sac := .Values.sharedAptCache | default dict }}
{{- if and $sac.enabled (not $sac.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vss-vios-nvstreamer.aptCacheClaim" . }}
  labels:
    app.kubernetes.io/name: vss-vios-nvstreamer
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  accessModes:
    - {{ $sac.accessMode | default "ReadWriteMany" }}
  resources:
    requests:
      storage: {{ $sac.size | default "1Gi" }}
  {{- $sc := $sac.storageClass | default (index (.Values.global | default dict) "storageClass") }}
  {{- if $sc }}
  storageClassName: {{ $sc }}
  {{- end }}
{{- end }}
{{- end }}
