# VSS parent chart — alerts profile (see README). Default install matches verification mode (2d_cv).
# Usage: helm install vss-alerts . -f values-verification.yaml -n vss-alerts --create-namespace
# Smaller / LVS stacks: override enabled flags or use profile-specific values files.

profile: alerts
mode: verification

# NGC: when using nvcr.io images, set ngc.createSecrets and ngc.apiKey (or use -f values-ngc-secrets.yaml).
ngc:
  createSecrets: true
  apiKey: ""
  # apiKeySecretName: "ngc-api"
  # dockerSecretName: "ngc-secret"

# Deployments/Services use the subchart name by default (e.g. redis, vss-agent), not <release>-<chart>.
# To restore release-prefixed names, set global.useReleaseNamePrefix: true (or per-subchart useReleaseNamePrefix: true).
# Set global.imagePullSecrets for private registry. Set global.storageClass for PVCs in values file.
# When subchart URL/host fields are empty, vss-agent-ui / vss-agent / vss-vios-ingress / vss-alert-bridge use global.external* (scheme defaults to http).
# global.kibanaPublicUrl: optional override for public Kibana URL (no path suffix). When empty and global.externalHost is set, vss-agent-ui / kibana derive http(s)://kibana.<externalHost> (matches vssIngress kibana host rule when enabled).
# global.llmBaseUrl / vlmBaseUrl: remote NIM endpoints (optional). Passed through to vss-agent for LLM_BASE_URL / VLM_BASE_URL and RTVI_VLM_BASE_URL
# (verification: RTVI tracks VLM; real-time: RTVI uses remote VLM URL when set, else vss-rtvi-vlm). Override per-agent with agent.vss-agent.llmBaseUrl / vlmBaseUrl.
# global.llmName / vlmName: shared defaults for vss-agent (override with agent.vss-agent.llmName, etc. when needed).
global:
  useReleaseNamePrefix: false
  postgresServiceHost: ""
  imagePullSecrets:
    - name: ngc-secret
  ngcApiSecret:
    name: ngc-api
    key: NGC_API_KEY
  externalScheme: ""
  externalHost: ""
  externalPort: ""
  kibanaPublicUrl: ""
  llmBaseUrl: ""
  vlmBaseUrl: ""
  llmName: "nvidia/nemotron-3.5-lightning-30b-a3b"
  vlmName: "nim_nvidia_cosmos3-nano-reasoner_bf16-final"
  # When true (default), vss-vios-sensor uses the same PVC base name as vss-vios-streamprocessing for vst-data / vst-video. Keep aligned with vios.vstStorage.createSharedPvcs.
  createSharedVstPvcs: true
  numSensors: ""
  # VIOS-only SDRC mode. true -> the VIOS pods get SDRC enabled.
  # Keep true; SDRC provides scalable stream placement in Kubernetes. See the
  # rationale in the infra.sdrc block below.
  vios:
    useSdrc: true
    maxDevicesSupported: 100

# External access: set global.externalScheme / externalHost / externalPort in your values file (no separate externalAccess.baseUrl).

# Verification stack enabled by default. Image repository/tag/replicas: charts/<name>/values.yaml (override when needed).
# Redis is the shared StatefulSet from helm/services/infra (vanilla redis:8.10.3-alpine),
# used by the CV / streamprocessing (sdrc) pipeline. Alert MS no longer uses Redis
# (dedup/filter state is in-process; verdict protection + alert configs are in Elasticsearch).
infra:
  enabled: true
  phoenix:
    enabled: true
    # Serve Phoenix behind ingress path prefix (http://<host>/phoenix).
    # Required so Phoenix emits asset URLs with /phoenix prefix.
    env:
      - name: PHOENIX_HOST_ROOT_PATH
        value: "/phoenix"
  redis:
    enabled: true
    # Shared Redis for the CV / streamprocessing (sdrc) pipeline. The
    # RedisJSON/Search/Bloom/TimeSeries modules below were originally loaded
    # for alert-bridge's JSON.SET prompt bootstrap; Alert MS no longer uses
    # Redis, so they can be dropped once no other consumer needs them.
    command: ["redis-server"]
    args:
      - "--loadmodule"
      - "/usr/local/lib/redis/modules/rejson.so"
      - "--loadmodule"
      - "/usr/local/lib/redis/modules/redisearch.so"
      - "--loadmodule"
      - "/usr/local/lib/redis/modules/redisbloom.so"
      - "--loadmodule"
      - "/usr/local/lib/redis/modules/redistimeseries.so"
      - "/config/redis.conf"
  # SDRC — KEEP ENABLED. Kubernetes needs SDRC for scaling. It places each
  # stream on one of N
  # vss-vios-streamprocessing / vss-rtvi-cv replicas, keeps the stream-to-pod
  # ownership map in Redis, routes client traffic to the owning pod by
  # stream-ID header through its Envoy, and re-places streams when a pod dies.
  # A webhook can only POST to one fixed Service address, so every add would
  # land on whichever replica kube-proxy picked, with nothing tracking which
  # pod owns a stream, no stream-affinity routing for clients, and no recovery
  # on pod restart.
  #
  # VIOS webhooks are not a substitute for SDRC in this chart. Leave
  # infra.sdrc, global.vios.useSdrc, and
  # vios.vss-vios-sensor.streamProcessorService enabled.
  sdrc:
    enabled: true
    configFilePath: configs/sdrc/config-verification.yml
    streamprocessingWlThreshold: ""
    config:
      configMapName: sdrc-config
      key: config.yml
      mountPath: /config.yml
  elasticsearch:
    enabled: true
    persistence:
      data:
        size: 10Gi
      logs:
        size: 5Gi
      storageClass: ''
    init:
      enabled: true
      env:
        ELASTICSEARCH_ILM_MIN_AGE: 4h
        ELASTICSEARCH_ENABLE_EMBEDDINGS: "false"
        ELASTICSEARCH_RTVI_CV_EMBEDDINGS_DIM: '1536'
        ELASTICSEARCH_VISION_LLM_EMBEDDINGS_DIM: '768'
  kibana:
    enabled: true
    init:
      enabled: true
      objectsBundle: alerts
  kafka:
    enabled: true
    topicJob:
      enabled: true
    heapOpts: -Xmx6G -Xms6G
    persistence:
      size: 10Gi
      storageClass: ''
    resources:
      requests:
        memory: 6Gi
        cpu: '1'
      limits:
        memory: 8Gi
        cpu: '2'
    topics:
      - name: mdx-raw
      - name: mdx-bev
      - name: mdx-space-utilization
      - name: mdx-alerts
      - name: mdx-behavior
        retention_ms: '14400000'
        segment_ms: '3600000'
        replication_factor: '1'
      - name: mdx-behavior-plus
      - name: mdx-frames
      - name: mdx-mtmc
      - name: mdx-rtls
      - name: mdx-rtls-region-1
      - name: mdx-amr
      - name: mdx-vlm-alerts
      - name: mdx-notification
        partitions: '1'
      - name: mdx-events
      - name: mdx-incidents
      - name: mdx-vlm-incidents
      - name: mdx-vlm-captions
      - name: mdx-embed
      - name: mdx-embed-filtered
      - name: vision-llm-events-incidents
      - name: mdx-vlm-errors
  logstash:
    enabled: true
  vss-broker-health-check:
    enabled: true
    kafkaHost: ""
    kafkaPort: "9092"
    redisHost: ""
    redisPort: "6379"

# VIOS umbrella (../../services/vios). Required: vios.enabled — parent Chart.yaml condition: vios.enabled. If missing/false, no VIOS workloads are installed.
vios:
  enabled: true
  vstStorage:
    createSharedPvcs: true
    accessMode: ReadWriteOnce
    vstData:
      size: 10Gi
      storageClass: ""
    vstVideo:
      size: 20Gi
      storageClass: ""
    streamerVideos:
      size: 20Gi
      storageClass: ""
  vss-vios-postgres:
    enabled: true

  vss-vios-sensor:
    enabled: true
    # Sensor registers streams through sdrc-controller:10000. Keep as sdrc;
    # direct streamprocessing or VIOS webhook provisioning does not provide
    # Kubernetes stream placement (see infra.sdrc above).
    streamProcessorService: sdrc
    persistence:
      vstData: { enabled: true, create: false, existingClaim: "" }
      vstVideo: { enabled: true, create: false, existingClaim: "" }

  vss-vios-streamprocessing:
    enabled: true
    useSdrEnvoyStyleHeadless: false
    headlessServiceName: ""
    persistence:
      vstData: { enabled: true, create: false, existingClaim: "" }
      vstVideo: { enabled: true, create: false, existingClaim: "" }
      streamerVideos: { enabled: true, create: false, existingClaim: "" }

  vss-vios-ingress:
    enabled: true
    externallyAccessibleIp: ""

  vss-vios-nvstreamer:
    enabled: true

vss-agent-ui:
  enabled: true
  # Aligned with met-blueprints dev-profile-alerts: appSubtitle + minimal envOverrides; rest from deploy/helm/services/ui/values.yaml `env`.
  appSubtitle: "Vision (Alerts - CV)"
  enableDashboardTab: "false"
  fillAlertBridgeUrlFromGlobal: true
  agentApiUrlBase: ""
  viosApiUrl: ""
  chatCompletionUrl: ""
  websocketChatUrl: ""
  alertsApiUrl: ""
  envOverrides:
    - name: NEXT_PUBLIC_ENABLE_CHAT_TAB
      value: "false"
    - name: NEXT_PUBLIC_SIDEBAR_CHAT_WORKFLOW
      value: "VSS Agent"
    - name: NEXT_PUBLIC_SIDEBAR_CHAT_CHAT_API_CUSTOM_AGENT_PARAMS_JSON
      value: '{"params":[{"name":"llm_reasoning","label":"LLM Reasoning","type":"boolean","default-value":true,"changeable":true,"tooltip-info":"Improves tool-call planning and QA accuracy; adds latency on multi-turn conversations. Turn off for fastest multi-turn replies."},{"name":"vlm_reasoning","label":"VLM Reasoning","type":"boolean","default-value":false,"changeable":true,"tooltip-info":""}]}'
    # No in-profile agent backs the chat sidebar; set "true" only when pointing the UI at an external harness.
    - name: NEXT_PUBLIC_ENABLE_CHAT_SIDEBAR
      value: "false"
    - name: NEXT_PUBLIC_ENABLE_ALERTS_TAB
      value: "true"
    - name: NEXT_PUBLIC_SIDEBAR_CHAT_CHAT_UPLOAD_FILE_ENABLE
      value: "false"
    - name: NEXT_PUBLIC_VIDEO_MANAGEMENT_VIDEO_UPLOAD_ENABLE
      value: "false"
    - name: NEXT_PUBLIC_VIDEO_MANAGEMENT_TAB_ADD_RTSP_ENABLE
      value: "true"
    - name: NEXT_PUBLIC_WEB_SOCKET_DEFAULT_ON
      value: "false"
    - name: NEXT_PUBLIC_ALERTS_TAB_VERIFIED_FLAG_DEFAULT
      value: "true"
vss-alert-bridge:
  enabled: true
  kafkaBootstrapServers: ""
  # Redis removed: Alert MS keeps dedup/filter state in-process and durable
  # state (verdict protection, alert configs) in Elasticsearch.
  elasticHosts: ""
  vlmBaseUrl: '{{- if (trim (.Values.rtviVlmBaseUrl | default "")) }}{{ trim .Values.rtviVlmBaseUrl }}{{- else }}{{- $g := .Values.global | default dict }}{{- $pfx := default false (coalesce .Values.useReleaseNamePrefix ((index $g "useReleaseNamePrefix") | default false)) }}{{- $svc := trim (.Values.rtviVlmServiceName | default "vss-rtvi-vlm") }}{{- printf "http://%s:8000" (ternary (printf "%s-%s" .Release.Name $svc) $svc $pfx) -}}{{- end }}'
  vlmName: "nim_nvidia_cosmos3-nano-reasoner_bf16-final"
  vstBaseUrl: ""
  alertReviewMediaBaseDir: ""
  configVariant: ""
  waitForDependencies:
    enabled: true

analytics:
  enabled: true
  vss-behavior-analytics:
    enabled: true
    command:
      - python3
      - apps/search_and_alerts/main_search_and_alerts_app.py
      - --config
      - /resources/vss-behavior-analytics-config.json
    config:
      kafkaConfigJson: |
        {
          "kafka": {
            "brokers": "kafka-kafka:9092",
            "topics": [
              {"name": "raw", "value": "mdx-raw"},
              {"name": "notification", "value": "mdx-notification"},
              {"name": "incidents", "value": "mdx-incidents"},
              {"name": "frames", "value": "mdx-frames"}
            ],
            "consumer": {
              "autoOffsetReset": "latest",
              "enableAutoCommit": false,
              "maxPollIntervalMs": 900000,
              "maxPartitionFetchBytes": 10485760,
              "fetchMaxBytes": 104857600,
              "maxPollRecords": 10000,
              "timeout": 0.01
            },
            "producer": {
              "lingerMs": 0
            },
            "group": "mdx-spatial-analytics-2d-app"
          },
          "sensors": [],
          "app": [
            {"name": "playbackLoop", "value": "10000"},
            {"name": "playbackFilterEmptyObjects", "value": "true"},
            {"name": "playbackStartUpDelaySec", "value": "90"},
            {"name": "sourceType", "value": "kafka"},
            {"name": "sinkType", "value": "kafka"},
            {"name": "numWorkersForIncidentGeneration", "value": "2"},
            {"name": "behaviorEmitOnce", "value": "false"},
            {"name": "numWorkersForBehaviorCreation", "value": "0"},
            {"name": "numWorkersForEmbedFiltering", "value": "0"},
            {"name": "fovCountViolationIncidentEnable", "value": "true"},
            {"name": "fovCountViolationIncidentObjectThreshold", "value": "1"},
            {"name": "fovCountViolationIncidentThreshold", "value": "2"},
            {"name": "fovCountViolationIncidentExpirationWindow", "value": "0.5"},
            {"name": "fovCountViolationIncidentObjectType", "value": "person"}
          ]
        }
  
  vss-video-analytics-api:
    enabled: true
    kafkaBrokers: ""
    elasticsearchNode: ""
    storage:
      size: 5Gi
      storageClass: ""
    waitForDependencies:
      enabled: true
  
rtvi:
  enabled: true
  vss-rtvi-cv:
    enabled: true
    profileMode: alerts
    # Profile-specific ConfigMap data is staged by the shared chart-owned ds-start.sh.
    env:
      DS_MODEL_FAMILY: rtdetr-gdino
      DS_CONFIG_FILE: run_config-api-rtdetr-protobuf.txt
      DS_VISION_ENCODER: "false"
      DS_TRACKER_REID: "false"
      DS_SHOW_SENSOR_ID: "true"
      MODEL_NAME_2D: GDINO
      NUM_SENSORS: "1"
      STREAM_TYPE: kafka
    downloadModelsFromNgc: true
    downloadModelsFromNgcWaitSeconds: 900
    waitForKafka:
      enabled: true
    ngcApiKeySecretName: ngc-api
    ngcApiKeySecretKey: NGC_CLI_API_KEY
    ngcOrg: nvidia
    ngcModelsToDownload:
      - model: nvidia/tao/trafficcamnet_transformer_lite:deployable_resnet50_v2.0
        org: nvidia
        sourcePath: trafficcamnet_transformer_lite_vdeployable_resnet50_v2.0/resnet50_trafficcamnet_rtdetr.fp16.onnx
        destPath: rtdetr-its/model_epoch_035.fp16.onnx
      - model: nvidia/tao/mask_grounding_dino:mask_grounding_dino_swin_tiny_commercial_deployable_v2.1_wo_mask_arm
        org: nvidia
        sourcePath: mask_grounding_dino_vmask_grounding_dino_swin_tiny_commercial_deployable_v2.1_wo_mask_arm/mgdino_mask_head_pruned_dynamic_batch.onnx
        destPath: gdino/mgdino_mask_head_pruned_dynamic_batch.onnx
      # NvDCF_accuracy ReID model. The NGC rt-cv image bundles this under
      # DS_APP_DIR/models; GHCR-built images ship no models, so it has to be
      # downloaded. ds-start.sh prefers this copy and falls back to the
      # in-image one, so the entry is harmless on either image.
      - model: nvidia/tao/reidentificationnet:deployable_v1.0
        org: nvidia
        sourcePath: reidentificationnet_vdeployable_v1.0/resnet50_market1501.etlt
        destPath: rtdetr-its/resnet50_market1501.etlt
    engineCache:
      enabled: true
      subPath: engines
  vss-rtvi-vlm:
    enabled: false
    useSharedNim: false
    kafkaBootstrapServers: ""
    redisHost: ""

# The version this deployment reports at GET /api/v1/version, answered by the
# HAProxy ingress. Stamped by .github/scripts/stamp_versions.py from the nearest
# v* git tag, never by hand. See .github/version-convention.md.
vssVersion: "3.3.0-rc0"

# Helm-managed Ingress (ingressClassName from vssIngress.ingressClassName). Install a cluster ingress controller separately (e.g. HAProxy Kubernetes Ingress). Annotations use haproxy.org/path-rewrite for video-analytics-api, alert-bridge, and va-mcp strip prefixes.
vssIngress:
  enabled: true
  ingressClassName: haproxy
  # Additional controller annotations, e.g. a Traefik routing middleware. They
  # win over the profile's own; setting haproxy.org/path-rewrite replaces the
  # generated rewrite table instead of merging into it.
  annotations: {}
  host: ""
  # Backend ports for the canonical route table (deploy/helm/services/common).
  # Every service is mounted at its own name — /va-mcp, /alert-bridge,
  # /elasticsearch, /rtvi-cv — which are the paths the Docker edge publishes
  # and `vss configure` records. A service this profile does not deploy is
  # simply not mounted.
  vssUiPort: 3000
  vstIngressPort: 30888
  videoAnalyticsApiPort: 8081
  behaviorAnalyticsPort: 8080
  alertBridgePort: 9080
  # /elasticsearch is mounted whenever infra.elasticsearch is deployed. The edge
  # guard is on the Elasticsearch Service (infra.elasticsearch.ingressGuard),
  # not here, so it binds to that one backend. It denies PUT/DELETE,
  # cluster-admin paths and the two-segment mutating operations, and allows a
  # PUT to a unified-memory document path — but POST is allowed, so _bulk,
  # _reindex and /<index>/_doc still reach Elasticsearch, exactly as on the
  # Docker edge. This is not a read-only endpoint.
  elasticsearchPort: 9200
  # RT-CV's Service port in this profile is service.port (9010), not the
  # httpPort (9000) the search profile publishes — rtvi-cv switches on
  # profileMode. Keep this in step with rtvi.vss-rtvi-cv.
  rtviCvPort: 9010
  rtviEmbedPort: 8000
  rtviVlmPort: 8000
  kibanaHost: ""
  # Default Phoenix exposure is path-based on main host: http://<host>/phoenix
  # Keep empty for path-only mode. Set phoenixHost (for example, phoenix.<host>)
  # only if you also want a separate dedicated Phoenix host rule.
  phoenixHost: ""
  kibanaPort: 5601
  phoenixPort: 6006
  # Optional; default streamer.<global.externalHost or vssIngress.host>.
  streamerHost: ""
  streamerPort: 31000

nims:
  enabled: true
  gpuType: H100
  global:
    pullSecretName: ngc-secret
    authSecretName: ngc-api
    storageClass: ""
  nemotron35:
    enabled: true
    image:
      repository: nvcr.io/nim/nvidia/nemotron-3.5-lightning-30b-a3b
      tag: "2.0.9-variant"
      pullPolicy: IfNotPresent
    replicas: 1
    resources:
      limits:
        nvidia.com/gpu: "1"
      requests:
        nvidia.com/gpu: "1"
    storage:
      pvc:
        storageClass: ""
        size: 120Gi
    service:
      type: ClusterIP
      port: 8000
    nodeSelector: {}
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
  cosmos3:
    enabled: false
    image:
      repository: nvcr.io/nim/nvidia/cosmos3-reasoner
      tag: "1.7"
      pullPolicy: IfNotPresent
    replicas: 1
    resources:
      limits:
        nvidia.com/gpu: "1"
      requests:
        nvidia.com/gpu: "1"
    storage:
      pvc:
        storageClass: ""
        size: 200Gi
      sharedMemorySizeLimit: 32Gi
    service:
      type: ClusterIP
      port: 8000
    nodeSelector: {}
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    nimModelSize: "nano"
    # Empty so the NIM uses its built-in manifest; BF16 pinned via nimModelProfile.
    nimModelName: ""
    nimModelProfile: "e55fdb44f41441032f546360d0dcf61caa8b39fa2852d31124c03953d01e1cb3"
