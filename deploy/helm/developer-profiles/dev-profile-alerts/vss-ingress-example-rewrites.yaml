# Manual equivalent of what this chart's templates/vss-ingress.yaml renders, for a
# cluster where you apply the Ingress yourself. Regenerate after changing routes:
#
#   helm template <RELEASE_NAME> ./dev-profile-alerts --set global.externalHost=<HOST> \
#     --set global.useReleaseNamePrefix=true --show-only templates/vss-ingress.yaml
#
# Mounts come from the canonical route table in deploy/helm/services/common; keep
# them in step with it and with the Docker edge (haproxy.cfg.template).
#
# Routes whose prefix is stripped before the backend sees it. The rest are in
# vss-ingress-example.yaml — apply both.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: <RELEASE_NAME>-vss-ingress-rewrites
  namespace: <NAMESPACE>
  annotations:
    haproxy.org/path-rewrite: |
      ^/storage/(.*) /vst/storage/\1
      ^/storage$ /vst/storage
      ^/va-mcp/(.*) /\1
      ^/va-mcp$ /
      ^/alert-bridge/(.*) /\1
      ^/alert-bridge$ /
      ^/video-analytics-api/(.*) /\1
      ^/video-analytics-api$ /
      ^/elasticsearch/(.*) /\1
      ^/elasticsearch$ /
      ^/rtvi-cv/(.*) /\1
      ^/rtvi-cv$ /
      ^/phoenix/(.*) /\1
      ^/phoenix$ /
spec:
  ingressClassName: haproxy
  rules:
  - host: vss.<EXTERNAL_HOST>.nip.io
    http:
      paths:
      - path: /storage
        pathType: Prefix
        backend:
          service:
            name: <RELEASE_NAME>-vss-vios-ingress
            port:
              number: 30888
      - path: /va-mcp
        pathType: Prefix
        backend:
          service:
            name: <RELEASE_NAME>-vss-va-mcp
            port:
              number: 9901
      - path: /alert-bridge
        pathType: Prefix
        backend:
          service:
            name: <RELEASE_NAME>-vss-alert-bridge
            port:
              number: 9080
      - path: /video-analytics-api
        pathType: Prefix
        backend:
          service:
            name: <RELEASE_NAME>-vss-video-analytics-api
            port:
              number: 8081
      - path: /elasticsearch
        pathType: Prefix
        backend:
          service:
            name: <RELEASE_NAME>-elasticsearch
            port:
              number: 9200
      - path: /rtvi-cv
        pathType: Prefix
        backend:
          service:
            name: <RELEASE_NAME>-vss-rtvi-cv
            port:
              number: 9010
      - path: /phoenix
        pathType: Prefix
        backend:
          service:
            name: <RELEASE_NAME>-phoenix
            port:
              number: 6006
