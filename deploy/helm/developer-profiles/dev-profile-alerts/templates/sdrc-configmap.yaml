{{- /* Renders the SDRC workload config for the alerts profile.
       KEEP THIS TEMPLATE. The docker compose alerts profile removed SDRC and
       provisions vss-rtvi-cv from VIOS webhooks instead; Helm keeps SDRC
       because it is what distributes streams across streamprocessing /
       vss-rtvi-cv replicas and recovers them on pod loss. Webhooks target one
       fixed Service address and cannot do that. See infra.sdrc in
       values.yaml for the full rationale before changing this for compose
       parity. */}}
{{- $infra := index .Values "infra" | default dict }}
{{- $sdrc := index $infra "sdrc" | default dict }}
{{- $config := index $sdrc "config" | default dict }}
{{- $infraEnabled := index $infra "enabled" | default false }}
{{- $sdrcEnabled := index $sdrc "enabled" | default false }}
{{- if and $infraEnabled $sdrcEnabled }}
{{- $configPath := get $sdrc "configFilePath" | default "configs/sdrc/config.yml" }}
apiVersion: v1
kind: ConfigMap
metadata:
  {{- $cmName := required "infra.sdrc.config.configMapName is required" (get $config "configMapName") }}
  {{- $global := .Values.global | default dict }}
  {{- $usePrefix := false }}
  {{- if and (hasKey $sdrc "useReleaseNamePrefix") (kindIs "bool" (get $sdrc "useReleaseNamePrefix")) }}
  {{- $usePrefix = get $sdrc "useReleaseNamePrefix" }}
  {{- else if and (hasKey $global "useReleaseNamePrefix") (kindIs "bool" (index $global "useReleaseNamePrefix")) }}
  {{- $usePrefix = index $global "useReleaseNamePrefix" }}
  {{- end }}
  name: {{ ternary (printf "%s-%s" .Release.Name $cmName | trunc 63 | trimSuffix "-") $cmName $usePrefix }}
  labels:
    app.kubernetes.io/name: sdrc
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  {{ get $config "key" | default "config.yml" }}: |
{{ required (printf "%s is required when infra.sdrc.enabled=true" $configPath) (tpl (.Files.Get $configPath) .) | nindent 4 }}
{{- end }}
