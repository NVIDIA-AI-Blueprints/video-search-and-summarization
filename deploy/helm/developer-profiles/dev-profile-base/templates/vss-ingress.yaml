{{- if .Values.vssIngress.enabled }}
{{- $vi := .Values.vssIngress }}
{{- $host := default .Values.global.externalHost $vi.host }}
{{- $phoenixHost := $vi.phoenixHost | default "" | trim }}
{{- $infra := .Values.infra | default dict }}
{{- $fp := index $infra "phoenix" | default dict }}
{{- $fes := index $infra "elasticsearch" | default dict }}
{{- $vios := .Values.vios | default dict }}
{{- $viosIngress := index $vios "vss-vios-ingress" | default dict }}
{{- $agentRoot := .Values.agent | default dict }}
{{- $agent := index $agentRoot "vss-agent" | default dict }}
{{- $vaMcp := index $agentRoot "vss-va-mcp" | default dict }}
{{- $ui := index .Values "vss-agent-ui" | default dict }}
{{- $rtvi := .Values.rtvi | default dict }}
{{- $vlm := index $rtvi "vss-rtvi-vlm" | default dict }}
{{- /* Enablement is read with vss.ingress.enabled, not `default true`: sprig
       treats an explicit `false` as empty and would hand back the default,
       mounting a route at a Service that was never created. */}}
{{- $en := "vss.ingress.enabled" }}
{{- $infraOn := include $en (dict "vals" $infra "default" true) }}
{{- $agentUmbrellaOn := include $en (dict "vals" $agentRoot "default" true) }}
{{- $rtviOn := include $en (dict "vals" $rtvi "default" true) }}
{{- /* Base serves the VLM via rtvi.vss-rtvi-vlm (vlmNameSlug=none). Do not use
       vlmNameSlug as a Service name -- with vlmNameSlug=none it resolves to a
       Service that does not exist. `vssIngress.vlm.*` is the former name of
       these keys and still wins where set. */}}
{{- $vlmLegacy := $vi.vlm | default dict }}
{{- $vlmOn := and $rtviOn (include $en (dict "vals" $vlm "default" false)) (include $en (dict "vals" $vlmLegacy "default" true)) }}
{{- $vlmChartName := coalesce ($vlmLegacy.serviceName | default "" | trim) ($vi.rtviVlmServiceName | default "" | trim) ((index $agent "rtviVlmServiceName") | default "" | trim) "vss-rtvi-vlm" }}
{{- /* Which of the canonical routes this profile can serve. The mounts
       themselves live in the shared table (services/common); this only says
       which backends are here and on what port. */}}
{{- $b := dict }}
{{- if include $en (dict "vals" $ui "default" true) }}
{{- $_ := set $b "ui" (dict "service" (include "vss.subchartFullname" (dict "Values" .Values "Release" .Release "depKey" "vss-agent-ui" "chartName" "vss-agent-ui")) "port" $vi.vssUiPort) }}
{{- end }}
{{- if and $agentUmbrellaOn (include $en (dict "vals" $agent "default" true)) }}
{{- $_ := set $b "agent" (dict "service" (include "vss.subchartFullname" (dict "Values" .Values "Release" .Release "depKey" "vss-agent" "chartName" "vss-agent")) "port" $vi.vssAgentPort) }}
{{- end }}
{{- if and (include $en (dict "vals" $vios "default" true)) (include $en (dict "vals" $viosIngress "default" true)) }}
{{- $_ := set $b "vst" (dict "service" (include "vss.subchartFullname" (dict "Values" .Values "Release" .Release "depKey" "vss-vios-ingress" "chartName" "vss-vios-ingress")) "port" $vi.vstIngressPort) }}
{{- end }}
{{- if and $agentUmbrellaOn (include $en (dict "vals" $vaMcp "default" false)) }}
{{- $_ := set $b "va-mcp" (dict "service" (include "vss.subchartFullname" (dict "Values" .Values "Release" .Release "depKey" "vss-va-mcp" "chartName" "vss-va-mcp" "subchartValues" $vaMcp)) "port" $vi.vaMcpPort) }}
{{- end }}
{{- if $vlmOn }}
{{- $_ := set $b "rtvi-vlm" (dict "service" (include "vss.subchartFullname" (dict "Values" .Values "Release" .Release "depKey" "vss-rtvi-vlm" "chartName" $vlmChartName "subchartValues" $vlm)) "port" (coalesce $vlmLegacy.servicePort $vi.rtviVlmPort)) }}
{{- end }}
{{- if and $infraOn (include $en (dict "vals" $fes "default" false)) }}
{{- $_ := set $b "elasticsearch" (dict "service" (include "vss.subchartFullname" (dict "Values" .Values "Release" .Release "depKey" "elasticsearch" "chartName" "elasticsearch" "subchartValues" $fes)) "port" $vi.elasticsearchPort) }}
{{- end }}
{{- if and $infraOn (include $en (dict "vals" $fp "default" true)) }}
{{- $_ := set $b "phoenix" (dict "service" (include "vss.subchartFullname" (dict "Values" .Values "Release" .Release "depKey" "phoenix" "chartName" "phoenix" "subchartValues" $fp)) "port" $vi.phoenixPort) }}
{{- end }}
{{- /* The text LLM, mounted only when this profile runs the local NIM. A
       profile pointed at a remote LLM has no Service to mount, so it declares
       no backend and the shared table leaves /llm unmounted. */}}
{{- $nims := .Values.nims | default dict }}
{{- $llmNim := index $nims "nemotron35" | default dict }}
{{- if and (include $en (dict "vals" $nims "default" true)) (include $en (dict "vals" $llmNim "default" true)) }}
{{- $_ := set $b "llm" (dict "service" (include "vss.subchartFullname" (dict "Values" .Values "Release" .Release "depKey" "nemotron35" "chartName" $vi.llmServiceName "subchartValues" $llmNim)) "port" $vi.llmPort) }}
{{- end }}
{{- include "vss.ingress.assertBackends" (dict "backends" $b) }}
{{- if $host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ (default "vss-ingress" $vi.resourceName) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: vss
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  {{- if include "vss.ingress.hasPathRewrites" (dict "backends" $b) }}
  annotations:
    haproxy.org/path-rewrite: |
      {{- include "vss.ingress.pathRewrites" (dict "backends" $b) | nindent 6 }}
  {{- end }}
spec:
  ingressClassName: {{ default "haproxy" $vi.ingressClassName | quote }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- include "vss.ingress.paths" (dict "backends" $b) | nindent 10 }}
{{- if and (index $b "phoenix") (ne $phoenixHost "") }}
    - host: {{ $phoenixHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ (index $b "phoenix").service }}
                port:
                  number: {{ (index $b "phoenix").port }}
{{- end }}
{{- end }}
{{- end }}
