# Manual equivalent of what this chart's templates/vss-ingress.yaml renders, for a
# cluster where you apply the Ingress yourself. Regenerate after changing routes:
#
#   helm template <RELEASE_NAME> ./dev-profile-base --set global.externalHost=<HOST> \
#     --set global.useReleaseNamePrefix=true --show-only templates/vss-ingress.yaml
#
# Mounts come from the canonical route table in deploy/helm/services/common; keep
# them in step with it and with the Docker edge (haproxy.cfg.template).
#
# Routes whose prefix is stripped before the backend sees it. The rest are in
# vss-ingress-example.yaml — apply both.

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: <RELEASE_NAME>-vss-ingress-rewrites
  namespace: <NAMESPACE>
  annotations:
    haproxy.org/path-rewrite: |
      /vios/(.*) /vst/\1
      ^/vios$ /vst
      /storage/(.*) /vst/storage/\1
      ^/storage$ /vst/storage
      /vios/storage/(.*) /vst/storage/\1
      ^/vios/storage$ /vst/storage
      /rtvi-vlm/(.*) /\1
      ^/rtvi-vlm$ /
      /phoenix/(.*) /\1
      ^/phoenix$ /
spec:
  ingressClassName: haproxy
  rules:
  - host: vss.<EXTERNAL_HOST>.nip.io
    http:
      paths:
      - path: /vios
        pathType: Prefix
        backend:
          service:
            name: <RELEASE_NAME>-vss-vios-ingress
            port:
              number: 30888
      - path: /storage
        pathType: Prefix
        backend:
          service:
            name: <RELEASE_NAME>-vss-vios-ingress
            port:
              number: 30888
      - path: /vios/storage
        pathType: Prefix
        backend:
          service:
            name: <RELEASE_NAME>-vss-vios-ingress
            port:
              number: 30888
      - path: /rtvi-vlm
        pathType: Prefix
        backend:
          service:
            name: <RELEASE_NAME>-vss-rtvi-vlm
            port:
              number: 8000
      - path: /phoenix
        pathType: Prefix
        backend:
          service:
            name: phoenix
            port:
              number: 6006
