global:
  # Bare node IP, or full main hostname (e.g. vss-search.<ip>.nip.io) for install --set global.externalHost=…
  externalHost: ''
  ngcApiKey: ''
  imagePullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ngc-docker-reg-secret
  storageClass: ''
  useReleaseNamePrefix: false
  ingress:
    enabled: true
    mainHost: ''
    streamerHost: ''
  # VIOS-only SDRC mode. true -> the VIOS pods get SDRC enabled.
  vios:
    useSdrc: true

  ngcApiSecret:
    name: ngc-api-key-secret
    key: NGC_API_KEY

  # rtviInternalIngress lives under `global` so the agent sub-chart's env-var
  # templates (rendered via `tpl` in the agent context) can read it — only
  # `global.*` propagates across sub-charts. When enabled, this drives:
  # (a) templates/rtvi-internal-ingress.yaml renders the Ingress object;
  # (b) RTVI_*_BASE_URL / COSMOS_EMBED_ENDPOINT env vars below get rewritten
  # to go through the controller Service instead of the rtvi ClusterIPs.
  #
  # PREREQUISITE — the HAProxy Technologies kubernetes-ingress controller
  # must already be installed in the cluster. The IngressClass `haproxy` is
  # a cluster-scoped resource, so VSS does NOT bundle the controller —
  # bundling collides with any existing HAProxy install (Nam Nguyen hit
  # this when the controller was already installed via a separate release).
  #
  # Install command is in this profile's README ("Step 2: Install Ingress
  # Controller (HAProxy)"). It uses DaemonSet + hostPort for external
  # traffic; enabling THIS option additionally requires the controller's
  # ClusterIP Service (`--set controller.service.type=ClusterIP`), which is
  # what makes `controllerService` below addressable. With rtviInternalIngress
  # disabled (the default) the ClusterIP Service is not needed.
  #
  # The defaults `haproxy-kubernetes-ingress.haproxy-controller:80` match
  # the README's install. Override only if you used a different release
  # name or namespace.
  rtviInternalIngress:
    enabled: false
    className: haproxy
    host: ''
    hashHeader: x-stream-id
    rtviCvPath: /rtvi-cv
    rtviEmbedPath: /rtvi-embed
    # In-cluster DNS short name of the HAProxy ingress controller Service:
    # `<svc-name>.<namespace>` — resolved to the FQDN via the pod search
    # domain (haproxy-kubernetes-ingress.haproxy-controller.svc.cluster.local).
    controllerService: "haproxy-kubernetes-ingress.haproxy-controller"
    controllerPort: 80
    annotations: {}
    tls: []
ingress:
  enabled: true
  className: haproxy
  annotations: {}
  # Service port numbers for vss-agent-ui / vss-agent (same pattern as dev-profile-alerts vssIngress).
  vssUiPort: 3000
  vssAgentPort: 8000
  videoAnalyticsApiPort: 8081
  hosts:
    main: ''
    streamer: ''
    kibana: ''
    phoenix: ''
  tls: []
  # Edge routes `vss configure` probes, mirroring the four the Docker edge
  # exposes (deploy/docker/services/infra/haproxy/haproxy.cfg.template) so the
  # same paths resolve on Compose and Kubernetes. Each mount carries whatever
  # the service itself serves: /elasticsearch/_cat/..., /rtvi-embed/v1/...,
  # /rtvi-cv/api/v1/..., /rtvi-vlm/v1/... .
  #
  # Off by default. Enabling this publishes Elasticsearch on the public origin
  # with no per-path guard, because an Ingress annotation cannot express one.
  # The Docker edge is not a read-only baseline either: its deny rules stop
  # PUT/DELETE, cluster-admin paths and the two-segment mutating operations, but
  # POST is allowed, so /_bulk, /_reindex and /<index>/_doc still reach ES
  # there. Enable only where a writable Elasticsearch is acceptable, or front it
  # with your own guard.
  #
  # /rtvi-embed and /rtvi-cv are skipped while global.rtviInternalIngress is
  # enabled -- that Ingress already publishes both paths. /rtvi-vlm is not one
  # of them, so it follows cliRoutes.enabled alone.
  cliRoutes:
    enabled: false
    elasticsearchPort: 9200
    rtviEmbedPort: 8000
    rtviCvPort: 9000
    # RT-VLM's cluster Service port. Not 8018 -- that is the Compose
    # host-published port and has no meaning in Kubernetes.
    rtviVlmPort: 8000

sharedStorage:
  streamerVideos:
    # Disabled: same role as vios.vstStorage + streamprocessing persistence.streamerVideos (matches dev-profile-alerts; avoids a second PVC).
    enabled: false
    storageClass: ''
    size: 50Gi
# VIOS umbrella (../../services/vios). Same override pattern as dev-profile-alerts: shared vst PVCs + subchart defaults for images/resources/ports.
# Required: vios.enabled — parent Chart.yaml condition: vios.enabled. If missing/false, no VIOS workloads are installed.
vios:
  enabled: true
  vstStorage:
    createSharedPvcs: true
    accessMode: ReadWriteOnce
    vstData:
      size: 10Gi
      storageClass: ""
    vstVideo:
      size: 20Gi
      storageClass: ""
    streamerVideos:
      size: 20Gi
      storageClass: ""
  vss-vios-postgres:
    enabled: true

  vss-vios-sensor:
    enabled: true
    # Sensor talks to SDRC — same pattern as dev-profile-alerts.
    streamProcessorService: sdrc
    persistence:
      vstData: { enabled: true, create: false, existingClaim: "" }
      vstVideo: { enabled: true, create: false, existingClaim: "" }

  vss-vios-streamprocessing:
    enabled: true
    useSdrEnvoyStyleHeadless: false
    headlessServiceName: ""
    persistence:
      vstData: { enabled: true, create: false, existingClaim: "" }
      vstVideo: { enabled: true, create: false, existingClaim: "" }
      streamerVideos: { enabled: true, create: false, existingClaim: "" }

  vss-vios-ingress:
    enabled: true
    # Nginx bind on loopback; public address is only EXTERNALLY_ACCESSIBLE_IP (from global.externalHost). vss-agent HOST_IP/EXTERNAL_IP are configured under agent.vss-agent.
    hostIp: "127.0.0.1"
    hostIpFollowsExternallyAccessibleIp: false
    externallyAccessibleIp: ""

  vss-vios-nvstreamer:
    enabled: true

# Infra: umbrella defaults disable most subcharts — enable each component here.
infra:
  enabled: true
  redis:
    enabled: true
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m
  #SDRC Config file is rendered into the `sdrc-config` ConfigMap by templates/sdrc-configmap.yaml.
  sdrc:
    enabled: true
    configFilePath: configs/sdrc/config-search.yml
    config:
      configMapName: sdrc-config
      key: config.yml
      mountPath: /config.yml
  phoenix:
    enabled: true
    # Serve Phoenix behind ingress path prefix (http://<host>/phoenix).
    env:
      - name: PHOENIX_HOST_ROOT_PATH
        value: "/phoenix"
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 2Gi
        cpu: '1'
  elasticsearch:
    enabled: true
    extraEnv:
      ELASTICSEARCH_RTVI_CV_EMBEDDINGS_DIM: '1152'
      ELASTICSEARCH_VISION_LLM_EMBEDDINGS_DIM: '768'
    persistence:
      data:
        size: 100Gi
      logs:
        size: 20Gi
    resources:
      requests:
        memory: 2Gi
        cpu: '1'
      limits:
        memory: 4Gi
        cpu: '2'
    init:
      enabled: true
      backoffLimit: 5
      env:
        ELASTICSEARCH_ILM_MIN_AGE: 48h
        ELASTICSEARCH_ENABLE_EMBEDDINGS: "true"
        ELASTICSEARCH_RTVI_CV_EMBEDDINGS_DIM: '1152'
        ELASTICSEARCH_VISION_LLM_EMBEDDINGS_DIM: '768'
  kibana:
    enabled: true
    init:
      enabled: true
      objectsBundle: search
      backoffLimit: 5
  kafka:
    enabled: true
  logstash:
    enabled: true
    javaOpts: -Xmx1024m -Xms256m
    resources:
      requests:
        memory: 2Gi
        cpu: 500m
      limits:
        memory: 4Gi
        cpu: '1'
rtvi:
  enabled: true
  vss-rtvi-cv:
    enabled: true
    # `search` mounts ds-main-config / ds-ppl-analytics from dev-profile-search vss-rtvi-cv-configmap (not the default `alerts` StatefulSet).
    profileMode: search
    replicas: 1
    # image: inherited from the rtvi-cv subchart's managed GHCR channel.
    # Pinning it here would override that default and silently keep this
    # profile on NGC, like the other managed images which are not pinned in
    # profile values.
    #
    # DGX-SPARK (SBSA) is a separate build -- different base image, same
    # linux/arm64 platform -- but it shares the GHCR repository under an
    # -sbsa tag suffix, so it needs a tag override only:
    #   tag: develop-latest-sbsa
    image:
      pullPolicy: IfNotPresent
    httpPort: 9000
    streamType: kafka
    env:
      DS_MODEL_FAMILY: rtdetr-warehouse
      DS_CONFIG_FILE: ds-main-config.txt
      DS_VISION_ENCODER: "true"
      DS_TRACKER_REID: "true"
      DS_SHOW_SENSOR_ID: "false"
      DS_MODE_FLAG: "1"
      DS_MESSAGE_RATE: "1"
      VISION_ENCODER_MODEL: siglip_v2
      VISION_ENCODER_VERSION: v1.1
      STREAM_TYPE: kafka
    otelSdkDisabled: 'true'
    otelServiceName: rtvi-cv
    downloadModelsFromNgc: true
    gpu:
      enabled: true
      count: 1
      deviceId: '0'
    kafka:
      bootstrapServers: ''
    ngcDownload:
      image:
        repository: docker.io/library/ubuntu
        tag: '22.04'
        pullPolicy: IfNotPresent
    ngcApiKeySecretName: ngc-api-key-secret
    ngcApiKeySecretKey: NGC_API_KEY
    ngcOrg: nvidia
    # Vision encoder download entries follow the convention below; update model/version
    # here to match models.visionEncoder.model / .version when swapping encoders.
    ngcModelsToDownload:
      - model: nvidia/tao/rtdetr_2d_warehouse:deployable_rn50_v1.0.2
        org: nvidia
        sourcePath: rtdetr_2d_warehouse_vdeployable_rn50_v1.0.2/rtdetr_warehouse_v1.0.2.fp16.onnx
        destPath: rtdetr_warehouse_v1.0.2.fp16.onnx
      - model: nvidia/tao/siglip_v2:deployable_v1.1
        org: nvidia
        sourcePath: siglip_v2_vdeployable_v1.1/siglip_v2_v1.1.onnx
        destPath: siglip_v2_v1.1.onnx
      - model: nvidia/tao/siglip_v2:deployable_v1.1
        org: nvidia
        sourcePath: siglip_v2_vdeployable_v1.1/siglip_v2_v1.1_weights.bin
        destPath: siglip_v2_v1.1_weights.bin
      - model: nvidia/tao/siglip_v2:deployable_v1.1
        org: nvidia
        sourcePath: siglip_v2_vdeployable_v1.1/siglip_v2_v1.1_tokenizer
        destPath: siglip_v2_v1.1_tokenizer
    models:
      authSecretName: ngc-api-key-secret
      authSecretKey: NGC_API_KEY
      ngcOrg: nvidia
      pgie:
        ngc:
          apiBaseUrl: https://api.ngc.nvidia.com
          org: nvidia
          team: tao
          model: rtdetr_2d_warehouse
          version: deployable_rn50_v1.0.2
        onnxFile: rtdetr_warehouse_v1.0.2.fp16.onnx
        inferDims: 3;640;640
      # Vision encoder: only model + version needed; all paths derived by convention.
      #   NGC model:  nvidia/tao/{model}:deployable_{version}
      #   ONNX:       {model}_{version}.onnx
      #   Weights:    {model}_{version}_weights.bin
      #   Tokenizer:  {model}_{version}_tokenizer
      #   DS name:    {model}-onnx
      visionEncoder:
        model: siglip_v2
        version: v1.1
    resources:
      limits:
        nvidia.com/gpu: 1
    nodeSelector: {}
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
  vss-rtvi-embed:
    enabled: true
    replicas: 1
    # Shared managed-image channel. Global container_prefix/container_tag values
    # select a promoted image without changing this profile.
    # SBSA/DGX-Spark shares the GHCR repository but needs its separate build
    # tag: set image.tag to develop-latest-sbsa unless global.container_tag is
    # already selecting that tag for the complete managed-image channel.
    image:
      repository: ghcr.io/nvidia-ai-blueprints/vss/vss-rt-embed
      tag: develop-latest
      pullPolicy: IfNotPresent
    port: 8000
    service:
      type: ClusterIP
    # Pin a specific GPU device id (e.g. "1") to set NVIDIA_VISIBLE_DEVICES on
    # the container. Leave empty to let the container see whatever GPUs the
    # pod's resource request exposed (runtime default).
    gpuDeviceId: ''
    dshm:
      enabled: true
      sizeLimit: 16Gi
    clearCachedEnginesOnStart: false
    kafkaBootstrapServers: ''
    redisHost: ''
    redisPort: '6379'
    modelImplementationPath: /opt/nvidia/rtvi/rtvi/models/custom/samples/cosmos-embed1
    modelPath: git:https://huggingface.co/nvidia/Cosmos-Embed1-448p-anomaly-detection
    modelRepositoryScriptPath: /opt/nvidia/rtvi/rtvi/models/custom/samples/cosmos-embed1/create_triton_model_repo.py
    logLevel: INFO
    enableOtelMonitoring: false
    enableRedisErrorMessages: false
    enableRequestProfiling: false
    otelTracesExporter: otlp
    otelExporterOtlpEndpoint: http://otel-collector:4318
    otelMetricExportInterval: '60000'
    otelResourceAttributes: ''
    forceSwAv1Decoder: ''
    numGpus: ''
    numVlmProcs: ''
    vlmBatchSize: '8'
    rtspTimeout: ''
    rtspLatency: ''
    installProprietaryCodes: false
    rtspReconnectionInterval: '5'
    rtspReconnectionMaxAttempts: '10'
    rtspReconnectionWindow: '60'
    startupProbe:
      initialDelaySeconds: 180
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 40
    livenessProbe:
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 3
    readinessProbe:
      periodSeconds: 30
      timeoutSeconds: 10
      failureThreshold: 3
    ngcApiKey: ''
    nvidiaApiKey: ''
    hfToken: ''
    resources:
      limits:
        nvidia.com/gpu: 1
    podSecurityContext:
      fsGroup: 1001
    securityContext:
      runAsUser: 1001
      runAsGroup: 1001
    persistence:
      storageClass: ''
      ngcModelCache:
        size: 50Gi
      hfCache:
        size: 50Gi
    clipStorage:
      enabled: false
      existingClaim: ''
      hostPath: ''
    nodeSelector: {}
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
  # VLM backend (rtvi-vlm): serves the Cosmos3 checkpoint in-pod, replacing the
  # cosmos3-reasoner NIM. Both the critic and video_understanding call it over HTTP via
  # the rtvi_vlm agent profile. Search does not publish VLM events, so Kafka is disabled
  # and there is no topic wait.
  vss-rtvi-vlm:
    enabled: true
    useSharedNim: false
    modelPath: "ngc:nim/nvidia/cosmos3-nano-reasoner:modelopt-fp8-final_format_fix"
    sharedNimPort: "8000"
    waitForKafka:
      enabled: false
    # Docker parity: shape from services/rtvi/charts/rtvi-vlm/values.yaml.
    # Full list is required because the subchart replaces `env` rather than merging.
    env:
      - name: OPENAI_API_KEY
        value: "NOAPIKEYSET"
      - name: OPENAI_API_VERSION
        value: ""
      - name: NVIDIA_API_KEY
        value: "NOAPIKEYSET"
      - name: NVIDIA_VISIBLE_DEVICES
        value: "all"
      - name: VLM_MODEL_TO_USE
        value: "cosmos-reason3"
      # Search critic is request/response over HTTP; no VLM event publishing.
      - name: KAFKA_ENABLED
        value: "false"
      - name: ERROR_MESSAGE_TOPIC
        value: "vision-llm-errors"
      # Generated-output and error buses (compose defaults from rtvi-vlm-docker-compose.yml).
      - name: MESSAGE_BUS
        value: "kafka"
      - name: MESSAGE_BUS_TOPIC
        value: "mdx-vlm-captions"
      - name: ERROR_BUS
        value: "kafka"
      - name: RTVI_ENABLE_CUDA_OOM_RECOVERY
        value: "true"
      # Optional EVS++ session controls.
      - name: VIA_EVS_DECISION_LAG
        value: ""
      - name: VIA_EVS_SESSION
        value: ""
      - name: VLLM_EVS_SIMILARITY_THRESHOLD
        value: ""
      - name: VLLM_NUM_PREPROCESS_WORKERS
        value: "16"
      - name: VIA_EVS_TOKEN_BUDGET
        value: ""
      - name: VIA_EVS_MAX_SESSIONS
        value: ""
      - name: VIA_EVS_MIN_CLIPS
        value: ""
      - name: VIA_EVS_EVENT_ONLY
        value: ""
      - name: VIA_EVS_EMA_MEMORY_S
        value: ""
      - name: VIA_EVS_SPIKE_STD_K
        value: ""
      - name: VIA_EVS_SETTLING_STD_K
        value: ""
      - name: VIA_EVS_STD_FLOOR_RATIO
        value: ""
      - name: VIA_EVS_DOWNWARD_BASELINE_MIN
        value: ""
      - name: VIA_EVS_STREAMING_PREFILL
        value: ""
      - name: VIA_PD_SERVER_URL
        value: ""
      - name: VIA_PD_SERVER_TIMEOUT_S
        value: ""
      - name: VLLM_USE_AOT_COMPILE
        value: "0"
      - name: VLLM_DISABLE_COMPILE_CACHE
        value: "1"
      - name: VLLM_LOGGING_LEVEL
        value: "INFO"
      - name: LOG_LEVEL
        value: "INFO"
      - name: ENABLE_OTEL_MONITORING
        value: "false"
      - name: ENABLE_REDIS_ERROR_MESSAGES
        value: "false"
      - name: OTEL_EXPORTER_OTLP_ENDPOINT
        value: "http://otel-collector:4318"
      - name: OTEL_METRIC_EXPORT_INTERVAL
        value: "60000"
      - name: OTEL_RESOURCE_ATTRIBUTES
        value: ""
      - name: OTEL_TRACES_EXPORTER
        value: "otlp"
      - name: NUM_GPUS
        value: "1"
      - name: NUM_VLM_PROCS
        value: ""
      - name: MODEL_IMPLEMENTATION_PATH
        value: ""
      - name: HF_TOKEN
        value: ""
      - name: INSTALL_PROPRIETARY_CODECS
        value: "false"
      - name: FORCE_SW_AV1_DECODER
        value: ""
      - name: RTVI_ADD_TIMESTAMP_TO_VLM_PROMPT
        value: ""
      - name: RTVI_VIDEO_METADATA_ABSOLUTE_TIMESTAMPS
        value: "true"
      - name: RTVI_EXTRA_ARGS
        value: ""
      - name: RTVI_RTSP_LATENCY
        value: ""
      - name: RTVI_RTSP_TIMEOUT
        value: ""
      - name: RTVI_RTSP_RECONNECTION_INTERVAL
        value: "5"
      - name: RTVI_RTSP_RECONNECTION_WINDOW
        value: "60"
      - name: RTVI_RTSP_RECONNECTION_MAX_ATTEMPTS
        value: "10"
      # Intentionally empty: under K8s each rtvi-vlm pod holds a dedicated GPU
      # (nvidia.com/gpu: 1 in services/rtvi/charts/rtvi-vlm), so vLLM's own
      # default applies. Docker's 0.4 compensates for sharing device 0 with
      # RT-CV in local_shared mode, which has no Kubernetes equivalent.
      - name: VLLM_GPU_MEMORY_UTILIZATION
        value: ""
      - name: VLM_BATCH_SIZE
        value: ""
      - name: VLM_DEFAULT_NUM_FRAMES_PER_SECOND_OR_FIXED_FRAMES_CHUNK
        value: "1"
      - name: VLM_INPUT_WIDTH
        value: ""
      - name: VLM_INPUT_HEIGHT
        value: ""
      - name: VLM_SYSTEM_PROMPT
        value: ""
      - name: VSS_NUM_GPUS_PER_VLM_PROC
        value: ""
      - name: VSS_SKIP_INPUT_MEDIA_VERIFICATION
        value: ""
      - name: VLM_MODEL_SUPPORTS_AUDIO
        value: "false"
      - name: VLM_TRUST_REMOTE_CODE
        value: "false"
      - name: VLM_VIDEO_PRUNING_RATE
        value: "0.0"
# Analytics umbrella: Search uses search_and_alerts behavior analytics (incident generation disabled) + video-analytics-api (REST API for raw/analytics data).
analytics:
  enabled: true
  vss-video-analytics-api:
    enabled: true
    kafkaBrokers: ""
    elasticsearchNode: ""
    storage:
      size: 5Gi
      storageClass: ""
    waitForDependencies:
      enabled: true
  vss-behavior-analytics:
    enabled: true
    replicas: 1
    port: 8080
    service:
      type: ClusterIP
    command:
      - python3
      - apps/search_and_alerts/main_search_and_alerts_app.py
      - --config
      - /resources/vss-behavior-analytics-config.json
    config:
      kafkaConfigJson: |
        {
          "kafka": {
            "brokers": "kafka-kafka:9092",
            "group": "vss-behavior-analytics",
            "consumer": {
              "autoOffsetReset": "latest",
              "enableAutoCommit": false,
              "maxPollIntervalMs": 900000,
              "maxPartitionFetchBytes": 10485760,
              "fetchMaxBytes": 104857600,
              "maxPollRecords": 10000,
              "timeout": 0.01
            },
            "producer": {
              "lingerMs": 0
            },
            "topics": [
              {"name": "raw", "value": "mdx-raw"},
              {"name": "behavior", "value": "mdx-behavior"},
              {"name": "embed", "value": "mdx-embed"},
              {"name": "embedFiltered", "value": "mdx-embed-filtered"},
              {"name": "notification", "value": "mdx-notification"}
            ]
          },
          "sensors": [],
          "app": [
            {"name": "behaviorEmitOnce", "value": "false"},
            {"name": "behaviorWatermarkSec", "value": "30"},
            {"name": "behaviorMaxPoints", "value": "100"},
            {"name": "objectConfidenceThreshold", "value": "0.5"},
            {"name": "embedEnableDownsampling", "value": "false"},
            {"name": "embedDownsamplerType", "value": "window"},
            {"name": "embedSensorTTLSec", "value": "3600"},
            {"name": "embedDownsampleToleranceMode", "value": "cosine"},
            {"name": "embedDownsampleSimilarityThreshold", "value": "0.90"},
            {"name": "embedDownsampleMaxIntervalSec", "value": "300"},
            {"name": "embedDownsampleWindowSize", "value": "60"},
            {"name": "embedDownsampleMinNeighbours", "value": "3"},
            {"name": "sourceType", "value": "kafka"},
            {"name": "sinkType", "value": "kafka"},
            {"name": "numWorkersForBehaviorCreation", "value": "2"},
            {"name": "numWorkersForEmbedFiltering", "value": "1"},
            {"name": "numWorkersForIncidentGeneration", "value": "0"},
            {"name": "inSimulationMode", "value": "true"},
            {"name": "stateManagementFilter", "value": "[\"Person\"]"}
          ]
        }
    imagePullSecrets:
      - name: ngc-docker-reg-secret
    resources:
      requests:
        memory: 512Mi
        cpu: 250m
      limits:
        memory: 1Gi
        cpu: 500m
    nodeSelector: {}
    tolerations: []
rtviEmbedModel: "cosmos-embed1-448p-anomaly-detection"
agent:
  enabled: true
  vss-agent:
    enabled: true
    # externalHost / useReleaseNamePrefix: inherit chart `global.*` (set at install with `--set global.externalHost=…`).
    global:
      imagePullPolicy: IfNotPresent
    profile: search
    replicas: 1
    rtviEmbedModelName: cosmos-embed1-448p-anomaly-detection
    llmName: nvidia/nvidia-nemotron-nano-9b-v2
    # The VLM is served by rtvi-vlm (see rtvi.vss-rtvi-vlm) for both the critic and
    # video_understanding. Model id must match the rtvi-vlm /v1/models advertisement,
    # not the cosmos3-reasoner NIM id.
    vlmName: nim_nvidia_cosmos3-nano-reasoner_modelopt-fp8-final_format_fix
    # Search routes VLM calls (critic and video_understanding) through vss-rtvi-vlm.
    # rtviVlmServiceName feeds the RTVI_VLM_BASE_URL env below; leave rtviVlmBaseUrl empty
    # to use the in-cluster service.
    rtviVlmEnabled: true
    rtviVlmServiceName: "vss-rtvi-vlm"
    rtviVlmBaseUrl: ''
    llmBaseUrl: ''
    vlmBaseUrl: ''
    evalLlmJudgeName: nvidia/nvidia-nemotron-nano-9b-v2
    evalLlmJudgeBaseUrl: ''
    phoenixEndpoint: ''
    vstExternalUrl: ''
    # VST_BASE_URL env: leave empty in Search unless you need an explicit VST public base. Otherwise set this (or vstExternalUrl) only.
    vstBaseUrl: ''
    # Optional override for both EXTERNAL_IP and HOST_IP in this pod (else global.externalHost).
    externalIp: ''
    # In-cluster VST; empty → http://vss-vios-ingress:30888 (short name, same namespace). Set to override.
    vstInternalUrl: ''
    rtviEmbedBaseUrl: ''
    cosmosEmbedEndpoint: ''
    elasticsearchUrl: ''
    elasticsearchIndex: mdx-embed-filtered-2025-01-01
    # Search profile does not install vss-va-mcp; leave empty (default env still resolves vss-va-mcp:9901) or set to an external MCP URL if needed.
    videoAnalysisMcpUrl: ''
    template:
      name: ''
    vssAgentVersion: 3.3.0-65576357eb80
    # Copied from rtvi.* defaults (vss-agent subchart env tpl only sees agent.vss-agent; keep in sync with rtvi.vss-rtvi-embed.port / vss-rtvi-cv.httpPort).
    rtviEmbedPort: '8000'
    rtviCvPort: '9000'
    # When true: public URL env vars use http://<mainHost> where mainHost matches templates/ingress.yaml (default: vss-search.<global.externalHost|.nip.io). Override hostname here when you set ingress.hosts.main — must stay in sync.
    vstPublicBaseUseNipIo: true
    # Hostname only (no scheme), same semantics as ingress.hosts.main; empty → printf "vss-search.%s.nip.io" $ip with $ip = global.externalHost | default "127.0.0.1" (see templates/ingress.yaml).
    vstPublicIngressHost: ''
    serviceAccount:
      create: true
      name: agents-sa
    imagePullSecrets:
      - name: ngc-docker-reg-secret
    resources:
      requests:
        memory: 4Gi
        cpu: '1'
      limits:
        memory: 8Gi
        cpu: '2'
    # vss-agent: full explicit container env for Search (Option A, local NIMs). URLs use Helm `tpl` against this chart's values + global.
    env:
      - name: VSS_AGENT_CONFIG_FILE
        value: '{{ .Values.configFilePath | default "/etc/vss-agent/config.yml" }}'
      - name: VSS_AGENT_HOST
        value: '0.0.0.0'
      - name: VSS_AGENT_PORT
        value: '8000'
      # Nemotron Nano Omni: set to "true" with Omni model + HF_TOKEN.
      - name: ENABLE_AUDIO
        value: '{{ .Values.enableAudio | default "false" }}'
      - name: LLM_MODE
        value: '{{- $g := .Values.global | default dict }}{{- $llm := ((coalesce (.Values.llmBaseUrl | default "") ((index $g "llmBaseUrl") | default "") "") | default "" | toString | trim) }}{{- if $llm }}remote{{- else }}local{{- end }}'
      - name: VLM_MODE
        value: '{{- $g := .Values.global | default dict }}{{- $vlm := ((coalesce (.Values.vlmBaseUrl | default "") ((index $g "vlmBaseUrl") | default "") "") | default "" | toString | trim) }}{{- if $vlm }}remote{{- else }}local{{- end }}'
      - name: LLM_MODEL_TYPE
        value: nim
      # rtvi routes the VLM through vss-rtvi-vlm; set `nim` to hit a NIM VLM directly.
      - name: VLM_MODEL_TYPE
        value: rtvi
      - name: VSS_AGENT_OBJECT_STORE_TYPE
        value: local_object_store
      - name: EXTERNAL_IP
        value: '{{- $g := .Values.global | default dict }}{{- $eh := index $g "externalHost" | default "" | trim }}{{- $ipRaw := coalesce .Values.externalIp $eh "127.0.0.1" }}{{- $ip := $ipRaw }}{{- if and (hasPrefix "vss-search." $ipRaw) (hasSuffix "nip.io" $ipRaw) }}{{- $ip = $ipRaw | trimPrefix "vss-search." | trimSuffix ".nip.io" }}{{- end }}{{ $ip }}'
      # In-cluster VST (nginx) host:port — not the public hostname.
      - name: INTERNAL_IP
        value: '{{- $g := .Values.global | default dict }}{{- $pfx := default false (coalesce .Values.useReleaseNamePrefix ((index $g "useReleaseNamePrefix") | default false)) }}{{- $viosIng := ternary (printf "%s-vss-vios-ingress:30888" .Release.Name) "vss-vios-ingress:30888" $pfx }}{{ coalesce .Values.vstInternalIp $viosIng }}'
      # Same as EXTERNAL_IP (search profile: public / browser-reachable address).
      - name: HOST_IP
        value: '{{- $g := .Values.global | default dict }}{{- $eh := index $g "externalHost" | default "" | trim }}{{- $ipRaw := coalesce .Values.externalIp $eh "127.0.0.1" }}{{- $ip := $ipRaw }}{{- if and (hasPrefix "vss-search." $ipRaw) (hasSuffix "nip.io" $ipRaw) }}{{- $ip = $ipRaw | trimPrefix "vss-search." | trimSuffix ".nip.io" }}{{- end }}{{ $ip }}'
