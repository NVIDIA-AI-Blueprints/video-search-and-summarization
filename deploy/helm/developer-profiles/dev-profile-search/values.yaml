nims:
  enabled: true
  gpuType: H100
  # Cap cosmos3 at 0.75 of the VLM GPU (device 1, co-hosted with other GPU
  # services in this profile) — overrides the umbrella H100 profile's 0.9.
  # Merged per-key into the rendered <cosmos3-fullname>-nim-env ConfigMap.
  gpuProfiles:
    H100:
      cosmos3:
        NIM_GPU_MEMORY_UTILIZATION: '0.75'
  global:
    # Must differ from chart root docker pull Secret name (`global.imagePullSecrets` → ngc-docker-reg-secret from templates/secrets.yaml).
    # Reusing ngc-docker-reg-secret here duplicates the same Secret in the nims subchart and breaks installs/upgrades (Helm SSA / original object errors).
    pullSecretName: ngc-nim-docker-reg-secret
    authSecretName: ngc-api
    storageClass: ""
  nemotron:
    enabled: true
    image:
      repository: nvcr.io/nim/nvidia/nvidia-nemotron-nano-9b-v2
      tag: '1'
      pullPolicy: IfNotPresent
    replicas: 1
    resources:
      limits:
        nvidia.com/gpu: '1'
      requests:
        nvidia.com/gpu: '1'
    storage:
      pvc:
        storageClass: ''
        size: 50Gi
    service:
      type: ClusterIP
      port: 8000
    nodeSelector: {}
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    env:
      CUDA_VISIBLE_DEVICES: '0'
  cosmos3:
    # Disabled: the VLM (used by the critic and video_understanding) is served by
    # rtvi.vss-rtvi-vlm (in-pod Cosmos3 checkpoint). Set true only to bypass RTVI and
    # serve the VLM as a standalone NIM (also flip agent VLM_MODEL_TYPE back to `nim`).
    enabled: false
    image:
      repository: nvcr.io/nim/nvidia/cosmos3-reasoner
      tag: '1.7'
      pullPolicy: IfNotPresent
    replicas: 1
    nimModelSize: 'nano'
    # Empty so the NIM uses its built-in manifest; BF16 pinned via nimModelProfile.
    # This standalone path stays BF16 while rtvi.vss-rtvi-vlm defaults to the FP8 checkpoint.
    nimModelName: ''
    nimModelProfile: 'e55fdb44f41441032f546360d0dcf61caa8b39fa2852d31124c03953d01e1cb3'
    resources:
      limits:
        nvidia.com/gpu: '1'
      requests:
        nvidia.com/gpu: '1'
    storage:
      pvc:
        storageClass: ''
        size: 200Gi
      sharedMemorySizeLimit: 32Gi
    service:
      type: ClusterIP
      port: 8000
    nodeSelector: {}
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    # The cosmos3-reasoner subchart does not consume this env map — runtime env
    # comes from the gpuProfiles.<gpuType>.cosmos3 ConfigMap (see the
    # nims.gpuProfiles.H100.cosmos3 override above).
    env:
      CUDA_VISIBLE_DEVICES: '1'
