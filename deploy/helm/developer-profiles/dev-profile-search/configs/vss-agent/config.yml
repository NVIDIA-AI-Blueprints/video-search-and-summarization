general:
  use_uvloop: false
  front_end:
    _type: vss_fastapi
    object_store: ${VSS_AGENT_OBJECT_STORE_TYPE}
    runner_class: vss_agents.api.custom_fastapi_worker.CustomFastApiFrontEndWorker
    streaming_ingest:
      vst_internal_url: ${VST_INTERNAL_URL}
      vst_external_url: ${VST_EXTERNAL_URL}
      # storage in place when an RTSP stream is removed.
      delete_vst_storage_on_stream_remove: false
      rtvi_embed_base_url: ${RTVI_EMBED_BASE_URL}
      rtvi_embed_model: {{ .Values.rtviEmbedModel | default "cosmos-embed1-448p-anomaly-detection" }}
      rtvi_embed_chunk_duration: 5
      rtvi_cv_base_url: ${RTVI_CV_BASE_URL}
      elasticsearch_url: ${ELASTIC_SEARCH_ENDPOINT}
      rtvi_embed_es_index: ${ELASTIC_SEARCH_INDEX}
      vlm_tagging_base_url: ${RTVI_VLM_BASE_URL}
      vlm_tagging_model: ${VLM_NAME}
      vlm_tagging_chunk_duration: 5
      # Nemotron Nano Omni: set ENABLE_AUDIO=true so VST keeps the audio track during upload transcoding.
      enable_audio: ${ENABLE_AUDIO:-false}
    endpoints:
    - path: /api/v1/search
      method: POST
      description: "Search for a video by query"
      function_name: search
    - path: /api/v1/attribute_search
      method: POST
      description: "Search for objects by visual attributes"
      function_name: attribute_search
    - path: /api/v1/embed_search
      method: POST
      description: "Direct embedding search (bypasses agent)"
      function_name: embed_search
    - path: /api/v1/critic
      method: POST
      description: "Score video clips with critic agent"
      function_name: critic_agent
    cors:
      allow_origins: ['*']
      allow_methods: ['*']
      allow_headers: ['*']
      allow_credentials: false

  telemetry:
    tracing:
      phoenix:
        _type: phoenix
        endpoint: ${PHOENIX_ENDPOINT}/v1/traces
        project: DEV-SEARCH-vss-agent-${VSS_AGENT_VERSION}

object_stores:
  local_object_store:
    _type: in_memory

functions:
  search:
    _type: search
    embed_search_tool: embed_search
    attribute_search_tool: attribute_search
    tag_search_tool: tag_search
    agent_mode_llm: ${LLM_MODEL_TYPE:-nim}_llm
    use_attribute_search: true
    critic_agent: critic_agent
    search_max_iterations: 1
    default_max_results: 10
    vst_internal_url: ${VST_INTERNAL_URL}
    vst_external_url: ${VST_EXTERNAL_URL}
    embed_confidence_threshold: 0.1
    behavior_es_endpoint: ${ELASTIC_SEARCH_ENDPOINT}
    fusion_method: weighted_rrf
    w_tag: 0.45

  search_agent:
    _type: search_agent
    embed_search_tool: embed_search
    attribute_search_tool: attribute_search
    tag_search_tool: tag_search
    agent_mode_llm: ${LLM_MODEL_TYPE:-nim}_llm
    use_attribute_search: true
    vst_internal_url: ${VST_INTERNAL_URL}
    vst_external_url: ${VST_EXTERNAL_URL}
    embed_confidence_threshold: 0.1
    critic_agent: critic_agent
    search_max_iterations: 1
    default_max_results: 10
    behavior_es_endpoint: ${ELASTIC_SEARCH_ENDPOINT}
    fusion_method: weighted_rrf
    w_tag: 0.45

  vst_video_clip:
    _type: vst.video_clip
    vst_internal_url: ${VST_INTERNAL_URL}
    vst_external_url: ${VST_EXTERNAL_URL}
    time_format: offset
    # Nemotron Nano Omni: set ENABLE_AUDIO=true so VST passes disableAudio=false on clip URLs.
    enable_audio: ${ENABLE_AUDIO:-false}

  embed_search:
    _type: embed_search
    cosmos_embed_endpoint: ${COSMOS_EMBED_ENDPOINT}
    es_endpoint: ${ELASTIC_SEARCH_ENDPOINT}
    es_index: ${ELASTIC_SEARCH_INDEX}
    vst_external_url: ${VST_EXTERNAL_URL}
    vst_internal_url: ${VST_INTERNAL_URL}
    default_max_results: 100

  tag_search:
    _type: tag_search
    es_endpoint: ${ELASTIC_SEARCH_ENDPOINT}
    tag_index: default_*
    vst_external_url: ${VST_EXTERNAL_URL}
    vst_internal_url: ${VST_INTERNAL_URL}
    default_max_results: 100

  attribute_search:
    _type: attribute_search
    rtvi_cv_endpoint: ${RTVI_CV_BASE_URL}
    es_endpoint: ${ELASTIC_SEARCH_ENDPOINT}
    behavior_index: mdx-behavior-2025-01-01
    frames_index: mdx-raw-2025-01-01
    enable_frame_lookup: false
    vst_external_url: ${VST_EXTERNAL_URL}
    vst_internal_url: ${VST_INTERNAL_URL}

  critic_agent:
    _type: critic_agent
    max_concurrent_verifications: 5
    num_videos_to_evaluate: 5
    video_analysis_tool: video_understanding
    time_format: offset

  video_understanding:
    _type: video_understanding
    vlm_name: ${VLM_MODEL_TYPE:-nim}_vlm
    max_frames: 60
    max_fps: 2
    min_pixels: 3136
    max_pixels: 12845056
    reasoning: false
    video_url_tool: vst_video_clip
    time_format: offset
    # Search always talks to the local vss-rtvi-vlm proxy (rtvi_vlm profile,
    # base_url=RTVI_VLM_BASE_URL), even when VLM_MODE=remote. Keep the agent on the
    # plain video_url path (send the internal VST URL, not an inlined base64 MP4/frames)
    # so RT-VLM fetches the clip and forwards it to the remote NIM. VLM_MODE stays
    # 'remote' at the host level for COMPOSE_PROFILES / RT-VLM's own remote-NIM config;
    # only the agent's media framing must be local here.
    vlm_mode: local_shared
    vst_internal_url: ${VST_INTERNAL_URL}

llms:
  # --- LLM profiles (selected by LLM_MODEL_TYPE) ---
  nim_llm:
    _type: nim
    model_name: ${LLM_NAME}
    base_url: ${LLM_BASE_URL}/v1
    max_tokens: 4096
    temperature: 0.0

  openai_llm:
    _type: openai
    model_name: ${LLM_NAME}
    base_url: ${LLM_BASE_URL}/v1
    max_tokens: 4096
    temperature: 0.0

  # --- VLM profiles (selected by VLM_MODEL_TYPE) ---
  nim_vlm:
    _type: nim
    model_name: ${VLM_NAME}
    base_url: ${VLM_BASE_URL}/v1
    temperature: 0.0
    max_tokens: 4096

  openai_vlm:
    _type: openai
    model_name: ${VLM_NAME}
    base_url: ${VLM_BASE_URL}/v1
    temperature: 0.0
    max_tokens: 4096

  vllm_vlm:
    _type: openai
    model_name: ${VLM_NAME}
    base_url: ${VLM_BASE_URL}/v1
    temperature: 0.0
    max_tokens: 4096

  # VLM served locally by rtvi-vlm (FastAPI-wrapped vLLM); used by both the critic and
  # video_understanding. Selected when VLM_MODEL_TYPE=rtvi. Must be _type: openai — the
  # langchain-nvidia NIM client leaks verify_ssl into the request body, which rtvi-vlm
  # rejects with 422.
  rtvi_vlm:
    _type: openai
    model_name: ${VLM_NAME}
    base_url: ${RTVI_VLM_BASE_URL}/v1
    temperature: 0.0
    model_kwargs:
      extra_body:
        num_frames_per_second_or_fixed_frames_chunk: 2
        use_fps_for_chunking: true
        vlm_input_width: 800
        vlm_input_height: 448

workflow:
  _type: top_agent
  llm_name: ${LLM_MODEL_TYPE:-nim}_llm
  llm_reasoning: false
  max_iterations: 20
  max_history: 10
  tool_names:
  - video_understanding
  subagent_names:
  - search_agent
  prompt: |
    You are a video search assistant. Use the search_agent to find videos matching user queries.
    The search_agent can handle questions related to events, actions, objects and videos.
    It supports both natural language video search and object ID based search.

    The search_agent decomposes the user's query and automatically selects the best search strategy:
    - Attribute-only search: when the query describes visual attributes without
      an action (e.g., "red car", "person", "blue jacket")
    - Embed-only search: when no specific visual attributes can be extracted
      (e.g., "traffic scene")
    - Fusion search: when the query contains both an action and visual
      attributes (e.g., "person wearing red jacket running"), combining
      embedding similarity with attribute matching
    - Object ID search: when object IDs are mentioned in the query
      (e.g., "find objects similar to ID 5" or "search for object ids 10, 20"),
      this bypasses embed/attribute search and performs direct object embedding lookup.

    When a user asks to search, call the search_agent with:
    Required:
    - query: The user's search query (pass it as-is, including any object IDs or video/stream names mentioned).
      The search_agent's query decomposition automatically extracts video source names
      and stream names from the query text — do not filter these out.
    - agent_mode: always set to true (enables query decomposition)
    - use_attribute_search: always set to true (enables fusion reranking)
    - use_critic: use the current request option value (verify results with VLM critic agent)
    Optional:
    - max_results: Final number of results to return. Set this only when the user asks for a specific
      count (for example, "top 5", "only 5", "limit to 5"); otherwise omit it.
    - start_time: Leave as None unless the user provides explicit timestamps or time references.
      The search_agent's query decomposition handles time extraction from natural language
      (e.g., "between 1pm and 2pm"), so include time references in the query text instead.
      Uses absolute timestamps in ISO format with 2025-01-01 as the base date.
    - end_time: Leave as None unless the user provides explicit timestamps or time references.

    Directly return the entire search result to user, no filtering or summarization.

    Runtime request options:
    - request_options is passed automatically to search_agent; do not fill it manually.
    - On follow-up turns, the system prompt may include current_request_options and previous_request_options.
    - For search requests and search follow-ups, treat search_source_type as the current media source selection
      and use_critic as the current critic selection.
    - If search_source_type or use_critic differs from previous_request_options, call search_agent again for
      the relevant search query instead of answering from previous search results.

    Conversation history guidelines:
    On a follow-up, classify the request against the most recent results in
    history and pick ONE path:
    - Path A — answer from history, do NOT call search_agent: the request is fully
      satisfied by items already shown (ordinals like "the third one"/"the last
      one", a subset of shown rows, or meta questions like timestamps/scores/count).
    - Path B — ask a clarifying question, do NOT call search_agent: the reference
      can't be resolved (ordinal out of range -> say how many exist; no prior
      results to refer to).
    - Path C — re-run search_agent with an inherited query: the user narrows,
      filters, expands, or adds/changes a constraint, so matches may exist outside
      the shown results. Merge the previous query plus the new constraint into ONE
      self-contained query (e.g. prior "person assaulting" + "wearing a white shirt"
      -> "person assaulting wearing a white shirt"; + "camera 5" -> "...on camera 5";
      + "night shifts" -> "...during night shifts"). Never pass the bare follow-up
      phrase (e.g. query="camera 5") alone.

    Important: When unsure whether a needed item is in the previous results, prefer Path C.
    Also use Path C when search_source_type or use_critic differs from
    previous_request_options.

    Path D — visual follow-up: if the user asks something answerable only by LOOKING at a
    clip (appearance, clothing, counts, background, what someone/something is doing), OR the
    message has a "[Context: [...]]" block, use video_understanding (NOT search_agent).

    Pick the clip(s): use the [Context] entries if present; else the result the user names
    (resolve against the most recent results JSON/table); else, if the message names a video,
    use that video (whole video if no time given); else default to the top prior result and
    tell the user which video you used. If none of these identify a video, ask which video to
    look at.

    Call video_understanding per clip: sensor_id = sensorName / the result's sensor_id / the
    named video; start_timestamp/end_timestamp = the startOffset/endOffset from the [Context]
    entry, or the start_offset/end_offset from the prior result JSON (the table's Start/End show
    these same offset seconds), or omit for the whole video; user_prompt = the user's question
    verbatim. One call per clip; answer per clip, labeled by video name.
