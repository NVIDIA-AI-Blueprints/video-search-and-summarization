{{- $g := .Values.global | default dict }}
{{- $vios := index $g "vios" | default dict }}
{{- $cm := include "dev-profile-search.viosNotificationConfigMapName" . }}
{{- $file := index $vios "notificationConfigFile" | default "" }}
{{- $inline := index $vios "notificationConfig" | default "" }}
{{- if and $cm (or $inline $file) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $cm }}
  labels:
    app.kubernetes.io/name: vios-notification
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  notification_config.json: |
{{ include "dev-profile-search.viosNotificationConfig" . | nindent 4 }}
{{- end }}
