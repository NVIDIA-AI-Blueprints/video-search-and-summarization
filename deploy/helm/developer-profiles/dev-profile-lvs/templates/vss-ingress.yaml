{{- if .Values.vssIngress.enabled }}
{{- $vi := .Values.vssIngress }}
{{- $host := default .Values.global.externalHost $vi.host }}
{{- $kibanaHost := default (printf "kibana.%s" $host) $vi.kibanaHost }}
{{- $phoenixHost := $vi.phoenixHost | default "" | trim }}
{{- $infra := .Values.infra | default dict }}
{{- $fk := index $infra "kibana" | default dict }}
{{- $fp := index $infra "phoenix" | default dict }}
{{- $fes := index $infra "elasticsearch" | default dict }}
{{- $vios := .Values.vios | default dict }}
{{- $viosIngress := index $vios "vss-vios-ingress" | default dict }}
{{- $agentRoot := .Values.agent | default dict }}
{{- $agent := index $agentRoot "vss-agent" | default dict }}
{{- $vaMcp := index $agentRoot "vss-va-mcp" | default dict }}
{{- $ui := index .Values "vss-agent-ui" | default dict }}
{{- $rtvi := .Values.rtvi | default dict }}
{{- $vlm := index $rtvi "vss-rtvi-vlm" | default dict }}
{{- $summ := index .Values "vss-summarization" | default dict }}
{{- /* Enablement is read with vss.ingress.enabled, not `default true`: sprig
       treats an explicit `false` as empty and would hand back the default,
       mounting a route at a Service that was never created. */}}
{{- $en := "vss.ingress.enabled" }}
{{- $infraOn := include $en (dict "vals" $infra "default" true) }}
{{- $agentUmbrellaOn := include $en (dict "vals" $agentRoot "default" true) }}
{{- $rtviOn := include $en (dict "vals" $rtvi "default" true) }}
{{- $kibanaOn := and $infraOn (include $en (dict "vals" $fk "default" true)) }}
{{- /*
  Which of the canonical routes this profile serves. The mounts are the shared
  table in services/common: LVS answers at /lvs (/lvs/v1/summarize,
  /lvs/v1/ready) and RT-VLM at /rtvi-vlm (/rtvi-vlm/v1/models), the same places
  every other profile and the Docker edge put them. Neither owns the origin
  root any more, so a caller no longer has to know it is talking to LVS to
  guess which /v1 it will get.

  Server timeouts are per backend now, on the Services that need them
  (vss-summarization, vss-rtvi-vlm, vss-agent) rather than as one ingress-wide
  ceiling over every route here.
*/}}
{{- $b := dict }}
{{- if include $en (dict "vals" $ui "default" true) }}
{{- $_ := set $b "ui" (dict "service" (include "vss.lvs.serviceShort" (dict "root" . "short" "vss-agent-ui")) "port" $vi.vssUiPort) }}
{{- end }}
{{- if and $agentUmbrellaOn (include $en (dict "vals" $agent "default" true)) }}
{{- $_ := set $b "agent" (dict "service" (include "vss.lvs.serviceShort" (dict "root" . "short" "vss-agent")) "port" $vi.vssAgentPort) }}
{{- end }}
{{- if and (include $en (dict "vals" $vios "default" true)) (include $en (dict "vals" $viosIngress "default" true)) }}
{{- $_ := set $b "vst" (dict "service" (include "vss.lvs.serviceShort" (dict "root" . "short" "vss-vios-ingress")) "port" $vi.vstIngressPort) }}
{{- end }}
{{- if include $en (dict "vals" $summ "default" true) }}
{{- $_ := set $b "lvs" (dict "service" (include "vss.lvs.serviceShort" (dict "root" . "short" "vss-summarization")) "port" $vi.lvsBackendPort) }}
{{- end }}
{{- if and $rtviOn (include $en (dict "vals" $vlm "default" false)) }}
{{- $_ := set $b "rtvi-vlm" (dict "service" (include "vss.lvs.serviceShort" (dict "root" . "short" "vss-rtvi-vlm")) "port" $vi.rtviVlmPort) }}
{{- end }}
{{- if and $infraOn (include $en (dict "vals" $fes "default" false)) }}
{{- $_ := set $b "elasticsearch" (dict "service" (include "vss.lvs.serviceShort" (dict "root" . "short" "elasticsearch")) "port" $vi.elasticsearchPort) }}
{{- end }}
{{- if and $agentUmbrellaOn (include $en (dict "vals" $vaMcp "default" false)) }}
{{- $_ := set $b "va-mcp" (dict "service" (include "vss.lvs.serviceShort" (dict "root" . "short" "vss-va-mcp")) "port" $vi.vaMcpPort) }}
{{- end }}
{{- if and $infraOn (include $en (dict "vals" $fp "default" true)) }}
{{- $_ := set $b "phoenix" (dict "service" (include "vss.lvs.serviceShort" (dict "root" . "short" "phoenix")) "port" $vi.phoenixPort) }}
{{- end }}
{{- /* The text LLM, mounted only when this profile runs the local NIM. A
       profile pointed at a remote LLM has no Service to mount, so it declares
       no backend and the shared table leaves /llm unmounted. */}}
{{- $nims := .Values.nims | default dict }}
{{- $llmNim := index $nims "nemotron35" | default dict }}
{{- if and (include $en (dict "vals" $nims "default" true)) (include $en (dict "vals" $llmNim "default" true)) }}
{{- $_ := set $b "llm" (dict "service" (include "vss.subchartFullname" (dict "Values" .Values "Release" .Release "depKey" "nemotron35" "chartName" $vi.llmServiceName "subchartValues" $llmNim)) "port" $vi.llmPort) }}
{{- end }}
{{- include "vss.ingress.assertBackends" (dict "backends" $b) }}
{{- if $host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ printf "%s-vss-ingress" .Release.Name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: vss
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # Kept for continuity with earlier releases, but inert: the controller reads
    # timeout-client only from its own ConfigMap, not from an Ingress annotation
    # (haproxytech/kubernetes-ingress documentation/annotations.md). A
    # summarization run that outlasts the controller default still has its
    # client side closed; fixing that means setting timeout-client on the
    # controller ConfigMap, which is cluster-wide and outside this chart.
    haproxy.org/timeout-client: {{ $vi.timeoutClient | default "3600s" | quote }}
    {{- with $vi.timeoutServer }}
    haproxy.org/timeout-server: {{ . | quote }}
    {{- end }}
    {{- if include "vss.ingress.hasPathRewrites" (dict "backends" $b) }}
    haproxy.org/path-rewrite: |
      {{- include "vss.ingress.pathRewrites" (dict "backends" $b) | nindent 6 }}
    {{- end }}
spec:
  ingressClassName: {{ default "haproxy" $vi.ingressClassName | quote }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- include "vss.ingress.paths" (dict "backends" $b) | nindent 10 }}
{{- if and $kibanaOn $kibanaHost }}
    - host: {{ $kibanaHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "vss.lvs.serviceShort" (dict "root" . "short" "kibana") }}
                port:
                  number: {{ $vi.kibanaPort | default 5601 }}
{{- end }}
{{- if and (index $b "phoenix") (ne $phoenixHost "") }}
    - host: {{ $phoenixHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ (index $b "phoenix").service }}
                port:
                  number: {{ (index $b "phoenix").port }}
{{- end }}
{{- end }}
{{- end }}
