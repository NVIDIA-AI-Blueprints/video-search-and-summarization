apiVersion: v2
name: vss-warehouse-3d-app
description: NVIDIA Metropolis warehouse operations 3D app profile
type: application
version: 3.3.0
appVersion: "3.3.0"
keywords:
  - metropolis
  - warehouse
  - rtvi
  - 3d
maintainers:
  - name: NVIDIA
dependencies:
- name: vios
  version: 3.3.0
  repository: file://../../../services/vios
  condition: vios.enabled
- name: infra
  version: 3.3.0
  repository: file://../../../services/infra
  condition: infra.enabled
- name: bp-configurator
  version: 3.3.0
  repository: file://../../../services/bp-configurator
  condition: bp-configurator.enabled
- name: calibration-import
  version: 3.3.0
  repository: file://../../../services/calibration-import
  condition: calibration-import.enabled
- name: rtvi
  version: 3.3.0
  repository: file://../../../services/rtvi
  condition: rtvi.enabled
- name: analytics
  version: 3.3.0
  repository: file://../../../services/analytics
  condition: analytics.enabled
- name: monitoring
  version: 3.3.0
  repository: file://../../../services/monitoring
  condition: monitoring.enabled
