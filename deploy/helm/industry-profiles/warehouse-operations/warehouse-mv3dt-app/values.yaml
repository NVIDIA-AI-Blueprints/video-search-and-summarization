global:
  imagePullSecrets:
    - name: ngc-docker-reg-secret
  storageClass: ""
  useReleaseNamePrefix: false

infra:
  enabled: true
  phoenix:
    enabled: false
  redis:
    enabled: true
    persistence:
      storageClass: ""
      size: 5Gi
  sdrc:
    enabled: false
  elasticsearch:
    enabled: false
  kibana:
    enabled: false
  kafka:
    enabled: true
    persistence:
      storageClass: ""
      size: 50Gi
  logstash:
    enabled: false
  vss-broker-health-check:
    enabled: false

rtvi:
  enabled: true
  vss-rtvi-cv:
    enabled: true
    profileMode: standalone-mv3dt
    replicas: 1
    image:
      repository: nvcr.io/nvstaging/vss-core/vss-rt-cv
      tag: "3.2.0-26.05.1"
      pullPolicy: IfNotPresent
    httpPort: 9000
    streamType: kafka
    deepstreamEnableSensorIdExtraction: "0"
    downloadNgcAppData: true
    downloadModelsFromNgc: false
    ngcApiKeySecretName: ngc-api
    ngcApiKeySecretKey: NGC_CLI_API_KEY
    ngcAppDataOrg: nvstaging
    ngcAppDataResourceVersion: "<vss-warehouse-app-data-resource>"
    kafka:
      bootstrapServers: ""
    standaloneWarehouse:
      streamType: kafka
      mv3dt:
        instanceId: "0"
        batchSize: "4"
        maxBatchSize: "4"
        mqttPort: "1883"
        redisPort: "6379"
        fusion:
          enabled: true
          image:
            repository: nvcr.io/nvstaging/vss-core/vss-rt-cv-mv3dt-bev-fusion
            tag: "3.2.0-26.05.3"
            pullPolicy: IfNotPresent
          rawTopic: mdx-raw
          fusedTopic: mdx-bev
          sensorTimeoutMs: "100"
          maxExpectedSensors: "4"
          bufferDurationS: "2.0"
        mosquitto:
          enabled: true
          image:
            repository: eclipse-mosquitto
            tag: "2"
            pullPolicy: IfNotPresent
          service:
            type: ClusterIP
            port: 1883
    persistence:
      storageClass: ""
      models:
        size: 100Gi
    resources:
      limits:
        nvidia.com/gpu: 1
      requests:
        nvidia.com/gpu: 1
