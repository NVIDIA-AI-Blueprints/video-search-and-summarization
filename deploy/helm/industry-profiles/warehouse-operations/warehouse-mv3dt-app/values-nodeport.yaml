# values-nodeport.yaml
# Exposes the UIs on node ports instead of the HAProxy Ingress. No ingress
# controller required.
#
#   helm install wh ./warehouse-mv3dt-app -n <namespace> \
#     -f warehouse-mv3dt-app/values-nodeport.yaml
#
# Then, with <NODE_IP> being any cluster node:
#   VST         http://<NODE_IP>:30888/vst/
#   NVStreamer  http://<NODE_IP>:30900/
#   Kibana      http://<NODE_IP>:31560/
#   Grafana     http://<NODE_IP>:30300/
#   Prometheus  http://<NODE_IP>:30909/
#
# Ports sit in the default 30000-32767 NodePort range.

global:
  vssIngress:
    enabled: false

vssIngress:
  enabled: false

vios:
  vss-vios-ingress:
    service:
      type: NodePort
      nodePort: 30888
  vss-vios-nvstreamer:
    service:
      type: NodePort
      nodePort: 30900

infra:
  kibana:
    # Served from the root of its own node port, so no path prefix.
    basePath: ""
    service:
      type: NodePort
      nodePort: 31560

monitoring:
  grafana:
    rootUrl: ""
    service:
      type: NodePort
      nodePort: 30300
  prometheus:
    routePrefix: ""
    service:
      type: NodePort
      nodePort: 30909
