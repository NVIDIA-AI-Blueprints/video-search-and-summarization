global:
  # Enable vssIngress for HAProxy path-based routing. Use values-nodeport.yaml for
  # direct node access (VST on NodePort 30888).
  vssIngress:
    enabled: false
  # VIOS-only SDRC mode. Mirrors docker warehouse-operations/.env VST_USE_SDRC=true.
  vios:
    useSdrc: true
    messageBrokerConsumer: kafka
    messageBrokerTopicConsumer: mdx-raw
    messageBrokerMetadataTopic: mdx-raw
  ngcApiSecret:
    name: ngc-api
    key: NGC_CLI_API_KEY
  imagePullSecrets:
    - name: ngc-docker-reg-secret
  storageClass: ""
  useReleaseNamePrefix: false
  externalHost: ""
  externalPort: ""
  # Branch/tag for calibration-import source URLs. Empty falls back to "develop".
  gitRef: ""
  # Dataset dir under calibration/sample-data/, shared by calibration-import's source URLs.
  sampleVideoDataset: warehouse-4cams-20mx20m-synthetic
  # Comma-separated static TURN URLs (username:password@host:port). See
  # deploy/helm/industry-profiles/warehouse-operations/TURN-SERVER.md.
  turnServerUrl: ""
  # Live RTSP cameras. Global so bp-configurator's chart (services/bp-configurator)
  # can read enabled too and flip SENSOR_INFO_SOURCE to "file".
  # Large fleet: --set-file global.cameraInfo.sensorsFile=camera_info.json
  cameraInfo:
    enabled: false
    configMapName: warehouse-camera-info
    sensorsFile: ""
    sensors: []
      # - camera_name: <camera_name_1>
      #   rtsp_url: <rtsp_url_1>
      #   group_id: <group_id_1>
      #   region: <region_1>

bp-configurator:
  enabled: true
  name: bp-configurator-2d
  image:
    repository: ghcr.io/nvidia-ai-blueprints/vss/vss-configurator
    tag: develop-latest
    pullPolicy: IfNotPresent
  init:
    enabled: true
    streamType: kafka
    kafkaHost: kafka-kafka
    kafkaPort: "9092"
    redisHost: redis
    redisPort: "6379"
  env:
    - name: SENSOR_INFO_SOURCE
      value: nvstreamer
    - name: SENSOR_FILE_PATH
      value: /opt/camera-configs/camera_info.json
    - name: ENABLE_PROFILE_CONFIGURATOR
      value: "false"
    - name: ENABLE_SENSOR_CONFIGURATOR
      value: "true"
    - name: ENABLE_CALIBRATION_PROCESS
      value: "false"
    - name: ENABLE_REDIS_DUPLICATOR_THREAD
      value: "false"
    - name: SEND_CONFIG_TO_SDR
      value: "false"
    - name: CALL_SENSOR_ADD_API
      value: "true"
    - name: NUM_STREAMS
      value: "4"
    - name: MODE
      value: 2d
    - name: LOG_LEVEL
      value: INFO
    - name: NVSTREAMER_STREAMS_ENDPOINT
      value: http://vss-vios-nvstreamer:31000/api/v1/sensor/streams
    - name: NVSTREAMER_SENSOR_STATUS_ENDPOINT
      value: http://vss-vios-nvstreamer:31000/api/v1/sensor/status
    - name: VST_CAMERA_ADD_ENDPOINT
      value: http://vss-vios-ingress:30888/vst/api/v1/sensor/add
    - name: CALIBRATION_MODE
      value: mount
    - name: CALIBRATION_DIR_MOUNT_PATH
      value: /opt/data
    - name: CALIBRATION_FILE_NAME
      value: calibration.json
    - name: PORT
      value: "5001"
    - name: DS_CONFIG_DIR
      value: /opt/warehouse/deepstream/configs
    - name: NVSTREAMER_CONFIG_DIR
      value: /opt/warehouse/nvstreamer/configs
    - name: MESSAGE_BROKER_TYPE
      value: kafka
    - name: WDM_REDIS_HOST
      value: redis
    - name: WDM_REDIS_PORT
      value: "6379"
    - name: WDM_REDIS_STREAM_NAME
      value: vst.event
    - name: WDM_REDIS_MSG_KEY
      value: value
    - name: WDM_KFK_MSG_KEY
      value: vst.event
    - name: WDM_KFK_BOOTSTRAP_URL
      value: kafka-kafka:9092
    - name: WDM_KFK_TOPIC
      value: mdx-notification
    - name: WDM_WL_ID_FIELD
      value: camera_id
    - name: WDM_WL_EVENT_FIELD
      value: event
    - name: VST_ADAPTOR
      value: vst_rtsp
    - name: CHECK_SENSOR_IN_CALIBRATION_FILE
      value: "false"
    - name: RECOMPUTE_BEV_CENTERS_ENABLED
      value: "false"

  # camera_info.json for SENSOR_FILE_PATH. optional so the pod still starts when
  # cameraInfo.enabled is false.
  configMounts:
    - name: camera-configs
      mountPath: /opt/camera-configs
      configMapName: warehouse-camera-info
      optional: true

calibration-import:
  enabled: true
  name: import-calibration-output-2d
  restartPolicy: OnFailure
  backoffLimit: 5
  apiUrl: http://vss-video-analytics-api:8081
  calibrationFileSource: https://github.com/NVIDIA-AI-Blueprints/video-search-and-summarization/blob/{{ .Values.global.gitRef | default "develop" }}/deploy/docker/industry-profiles/warehouse-operations/warehouse-2d-app/calibration/sample-data/{{ .Values.global.sampleVideoDataset }}/calibration.json
  imageMetadataFileSource: https://github.com/NVIDIA-AI-Blueprints/video-search-and-summarization/blob/{{ .Values.global.gitRef | default "develop" }}/deploy/docker/industry-profiles/warehouse-operations/warehouse-2d-app/calibration/sample-data/{{ .Values.global.sampleVideoDataset }}/images/imageMetadata.json
  imageBaseSource: https://github.com/NVIDIA-AI-Blueprints/video-search-and-summarization/blob/{{ .Values.global.gitRef | default "develop" }}/deploy/docker/industry-profiles/warehouse-operations/warehouse-2d-app/calibration/sample-data/{{ .Values.global.sampleVideoDataset }}/images
  requireCalibration: true
  requireImages: true

warehouse:
  mode: 2d
  behaviorAnalytics:
    calibrationFile: files/behavior-analytics/calibration.json

vios:
  enabled: true
  vstStorage:
    createSharedPvcs: true
    accessMode: ReadWriteOnce
    vstData:
      size: 10Gi
      storageClass: ""
    vstVideo:
      size: 20Gi
      storageClass: ""
    streamerVideos:
      size: 20Gi
      storageClass: ""
  vss-vios-postgres:
    enabled: true
  vss-vios-envoy-proxy:
    enabled: false
  vss-vios-sdr:
    enabled: false
  vss-vios-sensor:
    enabled: true
    # Preserve subchart defaults; extraction publishes Redis payloads under value.
    env:
    - name: HOST_IP
      value: 0.0.0.0
    - name: ADAPTOR
      value: vst_rtsp
    - name: ADAPTOR_IP
      value: ''
    - name: ADAPTOR_USER
      value: ''
    - name: ADAPTOR_PASSWORD
      value: ''
    - name: ADAPTOR_PORT
      value: ''
    - name: NEED_RECORDING
      value: 'false'
    - name: NEED_RTSPSERVER
      value: 'false'
    - name: NEED_STORAGE
      value: 'false'
    - name: NEED_STREAM_MONITORING
      value: 'true'
    - name: HTTP_PORT
      value: '30000'
    - name: CENTRALIZE_DB_NAME
      value: nvcentralizedb
    - name: CENTRALIZE_DB_USERNAME
      value: vst
    - name: DEEPSTREAM_ENABLE_SENSOR_ID_EXTRACTION
      value: '1'
    streamProcessorService: sdrc
    persistence:
      vstData: { enabled: true, create: false, existingClaim: "" }
      vstVideo: { enabled: true, create: false, existingClaim: "" }
  vss-vios-streamprocessing:
    enabled: true
    # Preserve subchart defaults; extraction publishes Redis payloads under value.
    env:
    - name: HOST_IP
      value: 0.0.0.0
    - name: VST_INSTALL_ADDITIONAL_PACKAGES
      value: 'true'
    - name: VST_APT_MIRROR
      value: ''
    - name: CONTAINER_NAME
      value: vss-vios-streamprocessing
    - name: ADAPTOR
      value: vst_rtsp
    - name: HTTP_PORT
      value: '30001'
    - name: RTSP_SERVER_PORT
      value: '30554'
    - name: CENTRALIZE_DB_NAME
      value: nvcentralizedb
    - name: CENTRALIZE_DB_USERNAME
      value: vst
    - name: ENABLE_AGING_POLICY
      value: 'true'
    - name: VST_VIDEO_STORAGE_SIZE_MB
      value: '100000'
    - name: DEEPSTREAM_ENABLE_SENSOR_ID_EXTRACTION
      value: '1'
    useSdrEnvoyStyleHeadless: false
    headlessServiceName: ""
    # No bind-mounts in Helm: download overlay assets from video-analytics-api.
    calibrationFileEndpoint: "http://vss-video-analytics-api:8081/config/calibration"
    floormapImageEndpoint: "http://vss-video-analytics-api:8081/config/calibration/image?place=building=Warehouse/room=Room-1&view=plan-view"
    persistence:
      vstData: { enabled: true, create: false, existingClaim: "" }
      vstVideo: { enabled: true, create: false, existingClaim: "" }
      streamerVideos: { enabled: true, create: false, existingClaim: "" }
    # GPU for hardware-accelerated encode/decode. For software mode (lower throughput),
    # add this nested YAML to your profile override file:
    # vios:
    #   vss-vios-streamprocessing:
    #     useSoftwarePath: true
    #     resources:
    #       limits:
    #         nvidia.com/gpu: 0
    #       requests:
    #         nvidia.com/gpu: 0
    # Use explicit 0 values; null restores dependency defaults during Helm coalescing.
    # VST overlay and video wall do not work properly without GPU allocation.
    useSoftwarePath: false
    resources:
      limits:
        nvidia.com/gpu: 1
      requests:
        nvidia.com/gpu: 1
  vss-vios-ingress:
    enabled: true
    # useSdrc is on, so /vst/api/v1/, /vst/storage/ and the replay-picture route
    # go through SDRC's Envoy listener instead of hitting VST directly. Matches
    # nginx-vst-sdrc.conf in the compose profiles. Sensor stays on
    # vss-vios-sensor:30000 either way.
    streamprocessingUpstream: "sdrc-controller:10000"
    service:
      type: ClusterIP
  vss-vios-nvstreamer:
    enabled: true
    # Keep in step with bp-configurator NUM_STREAMS.
    syncFileCount: 4
    persistence:
      streamerVideos:
        enabled: true
        # hostPath: /opt/vss/customer-videos   # node-local customer videos
    ngcVideoSeed:
      enabled: true
      # dataset unset: falls back to global.sampleVideoDataset.
      # Reuses the bundle the rtvi-cv NGC job already extracted, so it is not
      # downloaded twice. Needs nvstreamer and rtvi-cv on the same node (RWO).
      # Clear this and set resourceVersion to download independently.
      fromExistingClaim: vss-rtvi-cv-models
      resourceVersion: nvstaging/vss-warehouse/vss-warehouse-app-data:v3.3.0-09152026
      # Must match resourceVersion's org (nvstaging) — chart default is nvidia.
      org: nvstaging

infra:
  enabled: true
  phoenix:
    enabled: true
    env:
      - name: PHOENIX_HOST_ROOT_PATH
        value: "/phoenix"
  redis:
    enabled: true
    persistence:
      storageClass: ""
      size: 5Gi
  sdrc:
    enabled: true
    configFilePath: configs/sdrc/config.yml
    config:
      configMapName: sdrc-config
      key: config.yml
      mountPath: /config.yml
  elasticsearch:
    enabled: true
    persistence:
      data:
        size: 10Gi
      logs:
        size: 5Gi
      storageClass: ""
    init:
      enabled: true
      env:
        ELASTICSEARCH_ILM_MIN_AGE: 4h
        ELASTICSEARCH_RTVI_CV_EMBEDDINGS_DIM: "1536"
        ELASTICSEARCH_VISION_LLM_EMBEDDINGS_DIM: "768"
  kibana:
    enabled: true
    # Matches the /kibana/ ingress path.
    basePath: /kibana
    init:
      enabled: true
      objectsBundle: warehouse-2d
  kafka:
    enabled: true
    topicJob:
      enabled: true
    persistence:
      storageClass: ""
      size: 50Gi
  logstash:
    enabled: true
  vss-broker-health-check:
    enabled: true
    kafkaHost: ""
    kafkaPort: "9092"
    redisHost: ""
    redisPort: "6379"

analytics:
  enabled: true
  vss-video-analytics-api:
    enabled: true
    kafkaBrokers: ""
    elasticsearchNode: ""
    storage:
      size: 5Gi
      storageClass: ""
    waitForDependencies:
      enabled: true
  vss-behavior-analytics:
    enabled: true
    fullnameOverride: vss-behavior-analytics
    waitForKafka:
      enabled: true
      host: kafka-kafka
      topic: mdx-raw
    replicas: 1
    command:
      - python3
      - apps/analytics/main_analytics_2d_app.py
      - --config
      - /resources/vss-behavior-analytics-config.json
      - --calibration
      - /resources/calibration.json
    resourceFiles:
      calibration:
        enabled: true
        mountPath: /resources/calibration.json
        apiUrl: "http://vss-video-analytics-api:8081/config/calibration"
    config:
      kafkaConfigJson: |
        {
          "kafka": {
            "brokers": "kafka-kafka:9092",
            "topics": [
              {"name": "raw", "value": "mdx-raw"},
              {"name": "behavior", "value": "mdx-behavior"},
              {"name": "frames", "value": "mdx-frames"},
              {"name": "notification", "value": "mdx-notification"},
              {"name": "events", "value": "mdx-events"},
              {"name": "incidents", "value": "mdx-incidents"}
            ],
            "consumer": {
              "autoOffsetReset": "latest",
              "enableAutoCommit": false,
              "maxPollIntervalMs": 900000,
              "maxPartitionFetchBytes": 10485760,
              "fetchMaxBytes": 104857600,
              "maxPollRecords": 10000,
              "timeout": 0.01
            },
            "producer": {"lingerMs": 0},
            "group": "mdx-spatial-analytics-2d-app"
          },
          "redisStream": {
            "host": "redis",
            "port": 6379,
            "streams": [
              {"name": "raw", "value": "mdx-raw"},
              {"name": "frames", "value": "mdx-frames"},
              {"name": "behavior", "value": "mdx-behavior"},
              {"name": "notification", "value": "mdx-notification"},
              {"name": "events", "value": "mdx-events"},
              {"name": "incidents", "value": "mdx-incidents"}
            ],
            "consumer": {"readCount": 200, "readBlockMs": 100},
            "producer": {"maxLen": 10000},
            "group": "mdx-spatial-analytics-2d-app"
          },
          "sensors": [
            {
              "id": "default",
              "configs": [
                {"name": "proximityDetectionEnable", "value": "true"},
                {"name": "proximityDetectionThreshold", "value": "4"},
                {"name": "proximityDetectionCenterClasses", "value": "[\"Forklift\"]"},
                {"name": "proximityDetectionSurroundingClasses", "value": "[\"Person\"]"},
                {"name": "tripwireMinPoints", "value": "4"}
              ]
            }
          ],
          "app": [
            {"name": "behaviorEmitOnce", "value": "false"},
            {"name": "behaviorWatermarkSec", "value": "30"},
            {"name": "behaviorMaxPoints", "value": "200"},
            {"name": "playbackLoop", "value": "10000"},
            {"name": "playbackFilterEmptyObjects", "value": "true"},
            {"name": "playbackStartUpDelaySec", "value": "90"},
            {"name": "sourceType", "value": "kafka"},
            {"name": "sinkType", "value": "kafka"},
            {"name": "numWorkersForBehaviorCreation", "value": "2"},
            {"name": "numWorkersForFrameEnhancement", "value": "2"},
            {"name": "stateManagementFilter", "value": "[\"Person\",\"Forklift\"]"},
            {"name": "restrictedAreaViolationIncidentEnable", "value": "true"},
            {"name": "confinedAreaViolationIncidentEnable", "value": "true"},
            {"name": "proximityViolationIncidentEnable", "value": "true"},
            {"name": "restrictedAreaViolationIncidentThreshold", "value": "2"},
            {"name": "confinedAreaViolationIncidentThreshold", "value": "2"},
            {"name": "proximityViolationIncidentThreshold", "value": "2"}
          ]
        }
    imagePullSecrets:
      - name: ngc-docker-reg-secret

rtvi:
  enabled: true
  vss-rtvi-cv:
    enabled: true
    profileMode: standalone-2d
    replicas: 1
    # image: inherited from the rtvi-cv subchart's managed GHCR channel.
    # Pinning it here would override that default and silently keep this
    # profile on NGC, exactly like the other managed images which are not
    # pinned in profile values. Override globally with
    # global.container_prefix / global.container_tag instead.
    image:
      pullPolicy: IfNotPresent
    httpPort: 9000
    streamType: kafka
    downloadNgcAppData: true
    downloadModelsFromNgc: true
    ngcApiKeySecretName: ngc-api
    ngcApiKeySecretKey: NGC_CLI_API_KEY
    ngcAppDataOrg: nvstaging
    ngcAppDataResourceVersion: nvstaging/vss-warehouse/vss-warehouse-app-data:v3.3.0-09152026
    ngcModelsToDownload:
      - model: nvidia/tao/rtdetr_2d_warehouse:deployable_rn50_v1.0.2
        org: nvidia
        sourcePath: rtdetr_2d_warehouse_vdeployable_rn50_v1.0.2/rtdetr_warehouse_v1.0.2.fp16.onnx
        destPath: rtdetr_warehouse_v1.0.2.fp16.onnx
    kafka:
      bootstrapServers: ""
    standaloneWarehouse:
      streamType: kafka
      kafka:
        rawTopic: mdx-raw
    persistence:
      storageClass: ""
      models:
        size: 80Gi
    resources:
      limits:
        nvidia.com/gpu: 1
      requests:
        nvidia.com/gpu: 1
  vss-rtvi-vlm:
    envOverrides:
      VLM_MODEL_TO_USE: cosmos-reason3
      VLLM_GPU_MEMORY_UTILIZATION: "0.8"

# Alerts stack, off by default. Enable vss-alert-bridge, agent, and
# rtvi.vss-rtvi-vlm together to run alerts.
vss-alert-bridge:
  enabled: false
  vlmResponseFormat: json
  # Four cameras x four live checks share this model with CV verification.
  vlmRequestTimeout: 120
  kafkaBootstrapServers: ""
  elasticHosts: ""
  vlmBaseUrl: "http://vss-rtvi-vlm:8000"
  # Start the always_on_rules from realtimeConfig below. This profile wires the
  # VIOS webhook in configs/sdrc/config.yml (WDM_WL_ADD_URL:
  # /api/v1/realtime/always-on -> vss-alert-bridge), so the rules have a trigger.
  alwaysOn: true
  vlmName: "nim_nvidia_cosmos3-nano-reasoner_bf16-final"
  # Verification prompts, from deploy/docker/industry-profiles/warehouse-operations/
  # vlm-as-verifier/configs/alert_type_config.json. alert_type is matched after
  # normalize_alert_type() lowercases+strips, so lowercase keys here match the
  # incident "category" field (e.g. "Proximity Violation").
  alertTypeConfigJson: |
    {
      "version": "1.0",
      "alerts": [
        {
          "alert_type": "proximity violation",
          "output_category": "Near Miss Violation",
          "prompts": {
            "system": "You are an expert Industrial Safety Inspector monitoring a warehouse or manufacturing facility.\nYour goal is to classify the video into EXACTLY ONE of the 2 near miss classes defined in the user prompt.\n\nThe video is raw surveillance footage with NO bounding box overlays. You must visually identify:\n  - Pedestrians / workers on foot (people walking, standing, or working — NOT riding a forklift)\n  - Forklifts (powered industrial trucks used for lifting and transporting materials)\nFocus ONLY on interactions between pedestrians and forklifts. Ignore other objects and vehicles.\n\nSCENE SCANNING (do this carefully before any analysis):\n  - Scan the ENTIRE frame for people — check foreground, background, edges, and partially occluded areas.\n  - A person walking, standing, or working on foot is a pedestrian even if they are small in the frame.\n  - Distinguish between forklift OPERATORS (seated on/riding the forklift) and PEDESTRIANS (on foot, separate from the forklift). Only pedestrians count for near-miss analysis.\n  - Watch the ENTIRE video before concluding a forklift is stationary. A forklift that moves even slowly or briefly is NOT stationary.\n\nBEFORE classifying, verify these conditions. If ANY apply, classify as No Near Miss (ID 1):\n\n1. NO PEDESTRIAN:\n   - If the only person visible is riding, seated on, or operating a forklift,\n     there is NO pedestrian and therefore NO near miss.\n   - A near miss requires a SEPARATE person walking freely on foot.\n   - CAUTION: Look carefully — a pedestrian may be partially hidden behind shelving,\n     in the background, or at the edge of the frame. Do not dismiss a pedestrian too quickly.\n2. STATIONARY FORKLIFT:\n   - If the forklift does not move at all throughout the ENTIRE video, this is NOT a near miss.\n   - CAUTION: A forklift that moves slowly, moves briefly, or moves and then stops is NOT stationary.\n     Only classify as stationary if there is truly zero movement during the entire clip.\n3. NO FORKLIFT OR NO PERSON:\n   - If no forklift or no pedestrian is visible, this is NOT a near miss.\n4. FAR APART:\n   - If the pedestrian and forklift are clearly far apart (>3 meters) at ALL times\n     and never approach each other, this is NOT a near miss.\n5. SAME DIRECTION / NO CONVERGENCE:\n   - If the pedestrian and forklift move in the same direction without converging,\n     and the pedestrian is never in the forklift's travel lane, this is NOT a near miss.\n6. SINGLE OUTPUT:\n   - Output EXACTLY one class from the classification table. Do not invent new labels.\n\nTHE CORE NEAR-MISS TEST — PATH INTERSECTION (THE FREEZE TEST):\nThe critical question is NOT whether the forklift driver intended to hit the pedestrian.\nIt is whether the forklift's travel path and the pedestrian's position would result in\na collision if no one took action.\n\nApply this counterfactual:\n  \"If the pedestrian had FROZEN in place and NOT moved at all, would the forklift have\n   driven into them or passed within ~1 meter of their body?\"\n  - If YES → the pedestrian was in the forklift's path. This is a potential near miss.\n  - If NO → the pedestrian had clearance. This is routine, even if the pedestrian chose to move.\n\nCOMMON NEAR-MISS SCENARIOS (watch carefully for these — they are often wrongly dismissed):\n  a) HEAD-ON IN NARROW AISLE: Forklift and pedestrian approach each other from opposite\n     directions. The aisle is narrow enough that the forklift's travel lane overlaps the\n     pedestrian's position. The pedestrian must step to the side to let the forklift pass.\n     Even if the pedestrian moves calmly, this IS a near miss — the forklift's path went\n     through their position.\n  b) FROM BEHIND: Forklift approaches a pedestrian who is walking ahead in the same lane.\n     The pedestrian is directly in the forklift's path. The forklift would reach the\n     pedestrian's position if neither party changed course.\n  c) CROSSING PATH: Pedestrian walks across an aisle while a forklift is traveling through it.\n     Their paths intersect at a point where a collision could occur.\n  d) TURNING INTO: Forklift turns into an aisle or area where a pedestrian is present in\n     the travel path.\n  e) CLOSE PASS: The forklift passes the pedestrian with very little clearance (<1-2 meters),\n     and the pedestrian had to shift their position to create that clearance.\n\nWHAT IS NOT A NEAR MISS (routine encounters):\n  - The pedestrian is on one side of a wide aisle and the forklift passes on the other side\n    with comfortable clearance (>2 meters), without the pedestrian needing to move.\n  - The pedestrian preemptively steps aside while the forklift is still far away (>3 meters),\n    and the forklift would have had a clear lane to pass regardless of whether they moved.\n  - The forklift and pedestrian are in different aisles or areas and never converge.\n  - The pedestrian is not in the forklift's travel lane at any point during the encounter.\n  - Proximity exists but the forklift's path does not go through the pedestrian's position\n    (e.g., they are side by side moving in the same direction with lateral separation).\n\nKEY DISTINCTION — FORCED vs VOLUNTARY MOVEMENT:\n  - FORCED: The pedestrian was in the forklift's travel lane. If the pedestrian had stood\n    still, the forklift would have reached their position. The pedestrian HAD to move (or\n    the forklift HAD to brake/swerve) to avoid a collision. This is a near miss even if\n    the movement was calm, early, or unhurried.\n  - VOLUNTARY: The pedestrian saw the forklift from a distance and stepped aside as a\n    precaution, but the forklift had a clear lane and would have passed with several meters\n    of clearance even if the pedestrian had stayed put. This is NOT a near miss.\n  The test is simple: if the pedestrian had NOT moved, would the forklift have reached\n  their position? YES = forced. NO = voluntary.\n\nIMPORTANT — NEAR MISSES CAN LOOK CALM:\nDo not require panic, running, or dramatic swerving to classify as a near miss.\nA pedestrian calmly stepping out of the path of an approaching forklift is still a near\nmiss if the forklift's path went through their position. Workers are trained to yield —\ntheir calm reaction does not reduce the danger. The danger is in the geometry of the\nsituation (path intersection), not in the pedestrian's emotional response.\n\nMANDATORY SELF-AUDIT — DO THIS BEFORE OUTPUTTING:\nAfter writing your video_description, answer these questions honestly:\nQ1: Was the pedestrian in the forklift's travel lane? If the pedestrian had frozen in place,\n    would the forklift have driven into or within ~1 meter of them?\nQ2: Did someone (pedestrian or operator) HAVE to adjust because the forklift's path went\n    through the pedestrian's space?\nQ3: Am I dismissing a genuine near miss just because the pedestrian reacted calmly, because\n    it happened in a shared aisle, or because I described it using words like \"routine\"?\n    Near misses DO happen in shared aisles, and calm reactions do not make them safe.\nQ4: Am I calling this a near miss based on SPECIFIC geometric evidence (the forklift's path\n    went through the pedestrian's position), or only a vague feeling of danger?\n- If Q1=YES and Q2=YES → Near Miss (ID 0).\n- If Q1=NO or Q2=NO → No Near Miss (ID 1).\n- If Q3 reveals you dismissed a genuine path intersection → reconsider as Near Miss (ID 0).\n- If Q4 reveals no specific geometric evidence → No Near Miss (ID 1).\n\nDESCRIPTION-CLASSIFICATION CONSISTENCY (CRITICAL):\nYour video_description MUST support your classification. Check for contradictions:\n- If your description says the pedestrian was in the forklift's path and had to move\n  → you MUST classify as Near Miss (ID 0).\n- If your description says \"safe distance,\" \"plenty of clearance,\" \"not in the path,\"\n  \"far apart,\" or \"no need to move\" → you MUST classify as No Near Miss (ID 1).\n- If you classify as Near Miss (ID 0), your description MUST state that the forklift's\n  path went through the pedestrian's position and that action was needed to prevent collision.\n- If there is ANY contradiction between description and classification, FIX THE CLASSIFICATION\n  to match what you actually observed. Do not fabricate danger to justify Near Miss, and do\n  not dismiss real path intersections as \"routine.\"\n\nANSWER CONSISTENCY RULE:\n- If you classify as ID 0 (Near Miss), prediction_answer MUST be \"Yes\".\n- If you classify as ID 1 (No Near Miss), prediction_answer MUST be \"No\".\n- These three fields must ALWAYS agree. Double-check before outputting.",
            "user": "The video is raw surveillance footage from a warehouse camera (NO bounding box overlays).\nVisually identify any pedestrians (workers on foot) and forklifts in the scene.\nAnalyze ONLY pedestrian-forklift interactions.\n\nAnalyze the video and output a JSON object. You MUST select the class ID and Label EXACTLY from the table below.\n\nSTRICT CLASSIFICATION TABLE (Use these exact IDs and Labels):\n\n| ID | Label | Definition | Hazard Status |\n| :--- | :--- | :--- | :--- |\n| 0 | Near Miss | The forklift's travel path goes through or within ~1-2 meters of the pedestrian's position, requiring the pedestrian or forklift operator to take action (move, brake, or swerve) to prevent a collision. This includes: head-on approach in a narrow aisle where the pedestrian must step aside; forklift approaching from behind a pedestrian in the same lane; pedestrian crossing the forklift's travel path; forklift turning into the pedestrian's area. Applies even if the evasive action was calm — the criterion is path intersection, not panic level. | TRUE (Unsafe) |\n| 1 | No Near Miss | The pedestrian was NOT in the forklift's travel path, OR the forklift and pedestrian maintained safe clearance (>2 meters) without anyone needing to adjust position. Also applies when: no pedestrian present (only forklift operator); forklift is stationary throughout the entire video; no forklift or pedestrian visible; pedestrian and forklift are far apart at all times; the pedestrian moved preemptively while the forklift was distant and would have passed with clearance regardless. | FALSE (Safe) |\n\nINSTRUCTIONS:\n1. SCAN THE SCENE CAREFULLY:\n   - Identify all pedestrians and forklifts by visual appearance.\n   - Pedestrians: people walking, standing, or working on foot (NOT operating a forklift).\n     Check the entire frame including background, edges, and partially occluded areas.\n   - Forklifts: powered industrial vehicles with lifting forks.\n2. Verify: Is there at least one pedestrian who is NOT riding/operating a forklift?\n   - If NO → classify as No Near Miss (ID 1).\n   - Look carefully — pedestrians may be small, partially hidden, or in the background.\n3. Verify: Does any forklift move at any point during the ENTIRE video?\n   - If NO (truly zero movement the entire clip) → classify as No Near Miss (ID 1).\n   - A forklift that moves slowly, moves briefly, or moves then stops is NOT stationary.\n4. PATH INTERSECTION TEST (the decisive criterion — apply the freeze test):\n   Ask: If the pedestrian had FROZEN in place and not moved at all, would the forklift\n   have driven into them or passed within ~1-2 meters of their body?\n   - If YES → the pedestrian was in the forklift's path. Proceed to step 5.\n   - If NO → the pedestrian had clearance → No Near Miss (ID 1).\n   Watch for these specific patterns that indicate path intersection:\n   - Head-on: Forklift and pedestrian approaching from opposite directions in a narrow aisle\n     where the forklift's lane overlaps the pedestrian's position.\n   - From behind: Forklift approaching a pedestrian walking in the same lane ahead.\n   - Crossing: Pedestrian walking across the forklift's travel path.\n   - Turning: Forklift turning into an aisle or area where the pedestrian is located.\n   - Close pass: Forklift passing close enough that the pedestrian must shift position.\n5. PROXIMITY CHECK: Do the forklift and pedestrian come within ~1-2 meters?\n   - If NO → No Near Miss (ID 1).\n6. ACTION REQUIRED: Did someone HAVE to adjust to avoid a collision?\n   - FORCED (near miss): The pedestrian was in the forklift's travel lane. If the pedestrian\n     had not moved, the forklift would have reached their position. Someone had to move, brake,\n     or swerve. This counts even if the action was calm, early, or unhurried — the geometry\n     is what matters, not the emotional response.\n   - VOLUNTARY (not near miss): The pedestrian moved as a precaution while the forklift\n     was still far away (>3 meters) and the forklift had a clear lane to pass with room\n     to spare even if the pedestrian had stayed put.\n   - If voluntary → No Near Miss (ID 1).\n7. ALL of conditions 2, 3, 4, 5, and 6 (forced) must be met for Near Miss (ID 0).\n   If ANY condition fails, classify as No Near Miss (ID 1).\n8. SELF-AUDIT (MANDATORY — do this before finalizing):\n   a. Re-read your video_description.\n   b. Apply the freeze test: If the pedestrian had frozen, would the forklift have reached\n      their position? If YES and you classified as No Near Miss, RECONSIDER.\n   c. If your description mentions the pedestrian stepping aside, yielding, or moving out\n      of the way — ask WHY they moved. Was it because the forklift's path went through\n      their position (= near miss), or just a general precaution while the forklift was\n      far away with a clear lane (= routine)?\n   d. Do NOT dismiss a near miss just because the pedestrian moved calmly. Calm evasion\n      of a forklift whose path goes through your position is still a near miss.\n   e. Do NOT call something a near miss without specific evidence that the forklift's path\n      went through the pedestrian's position. Vague phrases like \"could potentially hit\"\n      are not evidence.\n   f. If your description uses \"safe distance,\" \"plenty of clearance,\" \"far apart,\" or\n      \"no need to move\" → you MUST classify as No Near Miss (ID 1).\n   g. If there is any contradiction between your description and classification, fix it.\n9. Match to one row in the table above and output the exact \"ID\" and \"Label\". Do not invent new labels.\n\nCONSISTENCY CHECK (do this before outputting):\n- If prediction_class_id is 0, then prediction_label MUST be \"Near Miss\" and prediction_answer MUST be \"Yes\".\n- If prediction_class_id is 1, then prediction_label MUST be \"No Near Miss\" and prediction_answer MUST be \"No\".\n- Your video_description MUST support your classification.\n\nOUTPUT FORMAT (single JSON object; use these keys and value shapes exactly):\n- prediction_class_id: integer, either 0 or 1\n- prediction_label: string, exactly \"Near Miss\" or \"No Near Miss\"\n- prediction_answer: string, exactly \"Yes\" or \"No\"\n- video_description: string describing (1) how you identified pedestrians and forklifts, (2) the forklift's travel path relative to the pedestrian's position, (3) the freeze test — if the pedestrian had not moved would the forklift have reached them, (4) whether any action taken was forced or voluntary"
          }
        }
      ]
    }
  # Always-on rules, started by SDRC camera lifecycle callbacks when alerts are enabled.
  realtimeConfig: |
    # Sample configuration for the POST /api/v1/realtime/always-on endpoint.
    #
    # How it's used:
    #   - Each camera event delivered to /always-on triggers ONE RTVI alert per
    #     rule in `always_on_rules` below (N rules -> N RTVI calls).
    #   - `live_stream_url` is populated automatically from the incoming event's
    #     `camera_url` field — do NOT set it here.
    #
    # Resolution order for this file (first match wins):
    #   1. $ALWAYS_ON_RULES_CONFIG             (env var, explicit path)
    #   2. ./realtime-config.yaml              (project root, recommended)
    #   3. ./realtime-config-sample.yaml       (this file, for dev only)

    always_on_rules:
      # ── Rule 1 ──────────────────────────────────────────────────────────────
      - rule_id: ppe                                     # Required. Free-form label used in logs + response.
        description: "PPE"                               # Optional. Human-readable notes.
        alert_type: "PPE Violation"                      # Required. Passed to RTVI as `alert_category`.
        always_on_params:
          # ── Required ────────────────────────────────────────────────────────
          system_prompt: "You are a warehouse PPE inspector. Classify the video as PPE Violation (ID 0 / Yes) or No PPE Violation (ID 1 / No).\n\nREQUIRED PPE per worker (BOTH, on OUTER layer):\n  H. Rigid hard hat — hard shell, rounded dome/brim, any color (yellow/white/blue/red/green/orange/black). Soft caps, beanies, baseball caps, hair-covers are NOT hard hats.\n  V. High-vis garment — fluorescent color AND/OR reflective stripes (vest, jacket, coverall, jumpsuit). A high-vis coverall counts as V by itself.\n\nWORKERS = every adult on foot or operating equipment (incl. forklift/pallet-jack drivers), foreground AND background. Skip people behind glass walls or on monitors.\n\nVALID (do not flag):\n  - White or any-colored rigid hard hat.\n  - High-vis coverall/jumpsuit worn alone.\n  - Soft cap UNDER a hard hat; dark shirt UNDER a high-vis vest.\n\nCORE RULES:\n  1. SCAN EVERY WORKER, including background and partially visible figures. Count workers, then describe each one's head and torso individually — never lump groups (\"all workers wear...\").\n  2. CONSISTENCY: if your description names ANY worker without a rigid hard hat OR without a high-vis outer garment, you MUST output ID 0. Do not describe a missing item and then classify as compliant.\n  3. NO REVERSALS: do not flip an initial compliant read with \"however / briefly / appears to / may not be\". PPE does not vanish mid-clip.\n  4. NO SPECULATION: if a figure is too distant/blurred/occluded to see head AND torso clearly, treat as compliant — never invent a violation.\n\nDECISION:\n  - Any worker concretely observed with bare head, soft-only headwear, or plain non-reflective torso → ID 0.\n  - Otherwise (all clear workers compliant, or none assessable) → ID 1.\n\nMapping: 0 ↔ \"PPE Violation\" ↔ \"Yes\"; 1 ↔ \"No PPE Violation\" ↔ \"No\"."
          # Required. The detection prompt sent to the VLM.
          prompt: "Raw warehouse surveillance video. Identify EVERY clearly visible worker — foreground AND background, on foot AND on equipment — and check whether each wears BOTH a rigid hard hat AND a high-vis garment on their outer layer.\n\n| ID | Label | Definition |\n| :--- | :--- | :--- |\n| 0 | PPE Violation | At least one clearly visible worker concretely lacks a rigid hard hat OR a high-vis outer garment (bare head; soft cap/beanie/baseball cap as only headwear; plain non-reflective shirt/hoodie/jacket as only torso). |\n| 1 | No PPE Violation | Every clearly visible worker has BOTH items, OR no one is concretely assessable (occlusion/distance/no workers). |\n\nSTEPS:\n1. Count workers. Scan foreground AND background — do not stop at the most prominent figure.\n2. Describe each worker's head (rigid helmet vs soft vs bare) and torso (high-vis with stripes/fluorescent vs plain) individually. No group statements.\n3. White hats and high-vis coveralls/jumpsuits are valid.\n4. If your description names any worker without a hard hat OR without high-vis on the outer layer, classify as ID 0. Description and classification MUST agree.\n5. Do not speculate on distant/occluded figures and do not reverse an initial compliant read.\n\nOUTPUT one JSON object with these exact keys:\n  prediction_class_id: 0 or 1\n  prediction_label: \"PPE Violation\" or \"No PPE Violation\"\n  prediction_answer: \"Yes\" or \"No\"\n  video_description: worker count, each worker's head + torso, and (if ID 0) the specific missing item on the specific worker.\n\nConsistency: 0 ↔ \"PPE Violation\" ↔ \"Yes\"; 1 ↔ \"No PPE Violation\" ↔ \"No\". Description must not contradict the classification."
          model: "nim_nvidia_cosmos3-nano-reasoner_bf16-final"                   # default: "" (falls back to rtvi_vlm.default_model in config.yaml)
          chunk_duration: 6                              # default: 30   — seconds of video per VLM chunk
          chunk_overlap_duration: 0                      # default: 5    — seconds of overlap between chunks
          num_frames_per_second_or_fixed_frames_chunk: 1 # default: 10  — interpreted per `use_fps_for_chunking`
          use_fps_for_chunking: true                     # default: true — if false, the value above is a fixed frame count
          vlm_input_width: 854                           # default: 256  — ~480p 16:9 (854×480); lower than stream/calibration res is OK
          vlm_input_height: 480                          # default: 256  — ~480p 16:9 VLM input height (pixels)
          enable_reasoning: true                         # default: true — ask the VLM to emit reasoning alongside alerts
          max_tokens: 4096
          temperature: 0.0

      # ── Rule 2 ──────────────────────────────────────────────────────────────
      - rule_id: load_quality
        description: "Load Quality"
        alert_type: "Load Quality Violation"
        always_on_params:
          system_prompt: "Warehouse load-quality inspector. 0 = Load Quality Violation = Yes; 1 = No Load Quality Violation = No.\n\n  VIOLATION (0) — concrete evidence of one:\n    D. DAMAGED: visible tear, rip, crush, puncture, dent, soggy/stained box, contents exposed/spilling; lower-layer crushed under upper.\n    F. FALLEN: cargo mid-fall, tipping, or on the floor in a scatter pattern or traceable to a specific pallet/rack/fork.\n    S. SPILL: liquid/granular/items leaking from a container; wet floor traced to a leaking package.\n    U. UNSTABLE: stack past vertical, overhanging the pallet edge enough to fall, smaller crushed under larger, or actively teetering.\n\n  NOT A VIOLATION (1):\n    - Intact loads, even tall, dusty, untidy.\n    - Empty boxes, gaps, or odd arrangements — not damage/instability.\n    - Partially open or unsealed boxes with contents still inside.\n    - Floor items in staging/loading areas with no scatter, no motion, no traced source pallet/rack.\n    - Stray cardboard/wrap/trash with no source load.\n    - Plastic-wrapped loads — judge visible deformation under the wrap, not the wrap itself.\n    - Forklift/worker transport of intact cargo, even when tall or stacked.\n    - Person falls, near-misses, PPE, fights, theft, fire.\n\n  EVIDENCE:\n    - Inspect transported loads (forks, hand-trucks, worker hands) as carefully as static stacks — subtle damage (dent, sag, lean, torn corner, crushed bottom box) often hides there; don't be reassured by an \"organized\" overall look.\n    - Hedges (\"appears\", \"seems\", \"may\", \"could\", \"slightly\", \"potential\", \"risk\") are not evidence; drop the flag.\n    - Occluded/distant/blurred → compliant.\n    - For ID 0, name the specific load and the concrete defect."
          prompt: "Raw warehouse video. Inspect every visible load — pallets, racks, forks, hand-trucks, worker hands, drums — foreground and background.\n\n  | ID | Label | Definition |\n  | :-- | :-- | :-- |\n  | 0 | Load Quality Violation | A load is concretely damaged, falling/fallen with a traceable source, spilling, or visibly unstable. |\n  | 1 | No Load Quality Violation | All loads intact and stable, or none concretely assessable. |\n\n  Steps:\n  1. List loads, including transported ones. Check each box face, corner, seam; check stack tilt and overhang.\n  2. Floor items: flag fallen only if mid-motion, in scatter, or traced to a specific source — not staged placements.\n  3. Don't infer instability from height, gaps, or transport alone — need visible lean/overhang/teeter.\n  4. Hedges drop the flag. Distant/occluded/blurred → compliant.\n\n  Output one JSON object with EXACT keys:\n    prediction_class_id: 0 or 1\n    prediction_label: \"Load Quality Violation\" or \"No Load Quality Violation\"\n    prediction_answer: \"Yes\" or \"No\"\n    video_description: loads observed; for 0, the specific load and concrete defect.\n\n  Consistency: 0 ↔ \"Load Quality Violation\" ↔ \"Yes\"; 1 ↔ \"No Load Quality Violation\" ↔ \"No\"."
          model: "nim_nvidia_cosmos3-nano-reasoner_bf16-final"
          chunk_duration: 6                              # must match every other rule: RT-VLM allows one decode config per live stream
          chunk_overlap_duration: 0
          num_frames_per_second_or_fixed_frames_chunk: 1
          use_fps_for_chunking: true
          vlm_input_width: 854
          vlm_input_height: 480
          enable_reasoning: true
          max_tokens: 4096
          temperature: 0.0

      # ── Rule 3 ──────────────────────────────────────────────────────────────
      - rule_id: pathway_obstruction
        description: "Pathway Obstruction"
        alert_type: "Pathway Obstruction Violation"
        always_on_params:
          system_prompt: "Warehouse pathway-safety inspector. 0 = Unexpected Obstruction Violation = Yes; 1 = No Unexpected Obstruction Violation = No.\n\n  WHAT IS A PATHWAY: aisles, walkways between racks, forklift travel lanes, dock-door approaches, ramps — the open floor area where pedestrians AND/OR forklifts/pallet-jacks move. A pathway is the FLOOR you'd walk or drive on, not the rack shelves or designated staging zones at the side.\n\n  VIOLATION (0) — ANY discrete object/material is on the pathway floor that should not be there. **Presence on the active travel floor is enough — it does NOT need to be in motion or to fully block traffic.** The five buckets:\n\n    F. FALLEN / SPILLED LOAD — boxes, cargo, or items spilled across the floor (mid-fall, just fallen, or fallen earlier and not yet cleaned up).\n\n    D. DEBRIS / LOOSE MATERIAL — cardboard piles, packaging scraps, plastic wrap, broken pallet pieces, stray loose boxes in the aisle.\n\n    C. CABLES / CORDS / HOSES — power cords, extension cables, air hoses, or any line lying across the pathway floor. A cable on the travel floor IS a violation — do NOT downgrade because it is \"coiled\", \"near the edge\", or \"small\".\n\n    L. LIQUID SPILL — puddle, streak, or wet patch on the pathway floor.\n\n    E. MISPLACED EQUIPMENT — any of the following standing OR lying on the active pathway floor with no operator currently using it:\n        - Ladder, stepladder (standing upright or laid down across the aisle)\n        - Hand-truck, dolly, pallet jack (left unattended in the aisle)\n        - Empty wooden pallet, single or multiple, sitting in the aisle\n        - Trash bin / waste container / barrel positioned in the aisle\n        - Toolbox cart, scaffolding, sawhorse, or similar gear\n        - Forklift parked / abandoned in a travel lane (no operator inside, not being actively driven through)\n      Equipment counts as misplaced if it sits ON the travel floor — even if it is upright, intact, and a worker could walk around it. The rule is **\"is it on the path?\"**, not **\"does it fully block the path?\"**.\n\n  NOT A VIOLATION (1):\n    - Items on shelves/racks (not on the pathway floor).\n    - Loads in designated staging or loading zones — pallets clearly placed against a wall, in a marked staging bay, or under a rack at the very edge of the floor, OFF the travel lane.\n    - A worker walking, carrying, or operating equipment in the aisle. People are not obstructions; equipment currently being used by a visible worker is not \"abandoned\".\n    - A forklift being actively driven through the aisle with cargo on its forks.\n    - PPE violations, near-misses without an obstruction cause, person falls without a visible obstruction, climbing on racking, fights, theft, smoking, fire.\n    - Static clutter at the very edges of the floor that does not encroach on the travel lane.\n\n  EVIDENCE — read carefully:\n    - Inspect the floor of every visible aisle and walkway: foreground, background, intersection corners.\n    - \"Presence on the active travel floor\" IS the test. Do NOT add a movement-blocking requirement. A cable, ladder, pallet jack, or empty pallet on the aisle floor IS a violation even if you can step around it.\n    - For ID 0, name the specific obstruction (what it is) and where (which aisle / pathway position).\n    - Hedge words (\"appears\", \"seems\", \"may\", \"could\", \"slightly\", \"potential\", \"risk\", \"might\", \"does not obstruct movement\", \"near the edge\") are NOT a reason to drop a real obstruction. If the object is concretely on the travel floor, flag it.\n    - Truly occluded / distant / blurred floor → treat as compliant (do not infer).\n\n  DECISION:\n    - Any obstruction concretely visible ON a pathway floor → ID 0.\n    - Otherwise (all visible pathways clearly empty) → ID 1.\n\n  Mapping: 0 ↔ \"Unexpected Obstruction Violation\" ↔ \"Yes\"; 1 ↔ \"No Unexpected Obstruction Violation\" ↔ \"No\"."
          prompt: "Raw warehouse surveillance video. Inspect the floor of every visible aisle / walkway / forklift lane. Check for any unexpected object, material, or spill ON the travel floor.\n\n  | ID | Label | Definition |\n  | :-- | :-- | :-- |\n  | 0 | Unexpected Obstruction Violation | A concrete object is on a pathway floor: a fallen/spilled load, debris, cable/cord, liquid spill, or misplaced equipment (ladder, hand-truck, pallet jack, empty pallet, trash bin, toolbox cart, abandoned forklift, etc.). |\n  | 1 | No Unexpected Obstruction Violation | All visible pathway floors are clear, OR no pathway floor is concretely assessable. |\n\n  STEPS:\n  1. Identify the pathways (open aisle floor between racks, walkways, forklift lanes).\n  2. Scan each pathway floor. List anything resting ON the travel floor that is not a worker actively walking/operating: cables, ladders, empty pallets, hand-trucks, pallet jacks, trash bins, fallen boxes, debris, liquid spills, parked/abandoned forklifts.\n  3. Presence on the floor is the test. Don't require it to \"block movement\" — a step-around-able ladder or cable IS a violation.\n  4. Items on shelves, in clear staging zones, or being actively transported by a visible worker are NOT obstructions.\n  5. Hedge words must not drop a real obstruction. Distant/occluded → compliant.\n  6. If your description names any concrete object on a pathway floor, classify as ID 0.\n\n  OUTPUT one JSON object with these exact keys:\n    prediction_class_id: 0 or 1\n    prediction_label: \"Unexpected Obstruction Violation\" or \"No Unexpected Obstruction Violation\"\n    prediction_answer: \"Yes\" or \"No\"\n    video_description: pathways observed; for 0, the specific object and its position on the pathway.\n\n  Consistency: 0 ↔ \"Unexpected Obstruction Violation\" ↔ \"Yes\"; 1 ↔ \"No Unexpected Obstruction Violation\" ↔ \"No\". Description must not contradict the classification."
          model: "nim_nvidia_cosmos3-nano-reasoner_bf16-final"
          chunk_duration: 6                              # must match every other rule: RT-VLM allows one decode config per live stream
          chunk_overlap_duration: 0
          num_frames_per_second_or_fixed_frames_chunk: 1
          use_fps_for_chunking: true
          vlm_input_width: 854
          vlm_input_height: 480
          enable_reasoning: true
          max_tokens: 4096
          temperature: 0.0

      # ── Rule 4 ──────────────────────────────────────────────────────────────
      - rule_id: spillover
        description: "Spillover"
        alert_type: "Spillover Violation"
        always_on_params:
          system_prompt: "Warehouse spillover inspector. 0 = Spillover Violation = Yes; 1 = No Spillover Violation = No.\n\n  FLAG AS VIOLATION (0) when ANY spilled contents are visible on the floor with a plausible container source (the source may be obvious, partial, damaged, tipped, or simply the nearest pallet/box/drum/jug/sack/forklift load):\n    L. Liquid — puddle, streak, pool, drip trail, dark wet ring, or leak; source = drum, barrel, jug, jerrycan, bottle, IBC tote, or wet carton.\n    G. Granular/Powder — pellets, grain, powder, sand, fragments scattered; source = torn bag/sack/burst container.\n    I. Items-out-of-container — small parts, packets, cans, bottles, produce, or goods scattered/strewn on the floor outside their box, pallet, or bin.\n    F. Dropped/spilled load — cargo (boxes, drums, sacks, jugs) fallen or falling from forklift forks, hand-truck, pallet, or shelf, with contents on the floor or mid-air.\n    D. Leaking damaged package — torn/crushed/punctured box, drum, or sack with contents escaping.\n    Include subtle, small, or partial spills (a few items, a small puddle, a thin streak, a scatter near a tipped box). Do not require a dramatic mess.\n\n  NOT A VIOLATION (1):\n    - Damaged cardboard with NO contents escaping (packaging defect only).\n    - Wet patch with no plausible container anywhere in view.\n    - Intact, sealed, upright containers — even if stacked precariously.\n    - Loose packing material, empty pallets, plastic wrap (no product mixed in).\n    - Intact load being transported.\n    - PPE issues, falls without a spill, near-misses, fights, theft, fire.\n    - Reflections, shadows, floor coatings, dark concrete patches.\n\n  EVIDENCE: For ID 0, name the source AND the spilled material. Hedge words (\"appears\", \"might\", \"could be\") drop the flag. Distant/occluded/blurred → compliant.\n\n  DECISION: Any visible spilled contents + plausible source (even partial/subtle) → 0. Otherwise → 1.\n\n  Mapping: 0 ↔ \"Spillover Violation\" ↔ \"Yes\"; 1 ↔ \"No Spillover Violation\" ↔ \"No\"."
          prompt: "Raw warehouse surveillance video. Inspect the floor carefully for spilled contents — even small, partial, or subtle spills count: a few items strewn from a box, a thin liquid streak, a small powder scatter, cargo tipped off a pallet, a leaking carton. Trace each spill to its plausible source container (drum, barrel, box, jug, sack, pallet load, forklift fork, tote).\n\n  | ID | Label | Definition |\n  | :-- | :-- | :-- |\n  | 0 | Spillover Violation | Spilled contents visible on the floor with a plausible source container. Subtle/partial spills count. |\n  | 1 | No Spillover Violation | No spilled contents, OR wet patch with no source, OR floor not assessable. |\n\n  STEPS:\n  1. Scan the floor for liquid, granular scatter, or items outside their container — include small or partial spills.\n  2. Trace each candidate to a plausible source (tipped/torn/leaking container, dropped load, broken bag).\n  3. Damaged cardboard with no escaping contents = not a spill.\n  4. Wet patch with no source visible = compliant.\n  5. Reflections, shadows, floor coatings = not spills.\n  6. Hedge words drop the flag. Distant/occluded = compliant.\n\n  OUTPUT one JSON object with exact keys:\n    prediction_class_id: 0 or 1\n    prediction_label: \"Spillover Violation\" or \"No Spillover Violation\"\n    prediction_answer: \"Yes\" or \"No\"\n    video_description: spills observed; for 0, name source container AND spilled material.\n\n  Consistency: 0 ↔ \"Spillover Violation\" ↔ \"Yes\"; 1 ↔ \"No Spillover Violation\" ↔ \"No\"."
          model: "nim_nvidia_cosmos3-nano-reasoner_bf16-final"
          chunk_duration: 6                              # must match every other rule: RT-VLM allows one decode config per live stream
          chunk_overlap_duration: 0
          num_frames_per_second_or_fixed_frames_chunk: 1
          use_fps_for_chunking: true
          vlm_input_width: 854
          vlm_input_height: 480
          enable_reasoning: true
          max_tokens: 4096
          temperature: 0.0
  vstBaseUrl: ""
  alertReviewMediaBaseDir: ""
  configVariant: ""
  waitForDependencies:
    enabled: true
    # Match Compose: accept camera registrations only after RT-VLM is ready.
    vlmReadyUrl: '{{ trimSuffix "/" .Values.vlmBaseUrl }}/v1/health/ready'

agent:
  enabled: false
  # va-mcp is off in the agent chart by default; alerts needs it.
  vss-va-mcp:
    enabled: true
    vlmVerified: false
  vss-agent:
    # Report-templates mount is gated on profile == alerts in the agent chart.
    profile: alerts
    reportTemplates:
      enabled: true
    extraEnv:
      - name: VSS_AGENT_TEMPLATE_PATH
        value: '{{- $rt := .Values.reportTemplates | default dict }}{{- if ($rt.enabled | default false) }}/etc/vss-agent/report-templates{{- end }}'
      - name: VSS_AGENT_TEMPLATE_NAME
        value: '{{- $rt := .Values.reportTemplates | default dict }}{{- if ($rt.enabled | default false) }}{{ $rt.configMapKey | default "incident_report_template.md" }}{{- end }}'
    waitForDependencies:
      enabled: true
      waitForMcp: true

# Off by default; enable with the alerts stack. Warehouse 2D exposes both
# Real-time Alerts and CV Alerts Verification under Manage Alerts.
vss-agent-ui:
  enabled: false
  alertsRealtimeEnabled: true
  alertsCvVerificationEnabled: true
  # Overlay bbox on Alerts thumbnails/playback (VIOS cache is overlay-aware; nvbugs/6199659).
  envOverrides:
    - name: NEXT_PUBLIC_ALERTS_TAB_MEDIA_WITH_OBJECTS_BBOX
      value: "true"

# Prometheus + Grafana (K8s port of deploy/docker/services/monitoring).
# dcgmExporter stays off because the NVIDIA GPU operator already runs
# nvidia-dcgm-exporter, which Prometheus scrapes via prometheus.gpuOperator.
monitoring:
  enabled: true
  prometheus:
    enabled: true
    # Matches the /prometheus/ ingress path.
    routePrefix: /prometheus
  grafana:
    enabled: true
    # Matches the /grafana/ ingress path. Set the full external URL when the
    # ingress host or port differs.
    rootUrl: http://localhost:8080/grafana
  nodeExporter:
    enabled: true
  dcgmExporter:
    enabled: false

# HAProxy Ingress, mirroring the vss-haproxy-ingress compose service.
# The version this deployment reports at GET /api/v1/version, answered by the
# HAProxy ingress. Stamped by .github/scripts/stamp_versions.py from the nearest
# v* git tag, never by hand. See .github/version-convention.md.
vssVersion: "3.3.0-rc0"

# Optional HAProxy path-based ingress (requires a cluster-wide HAProxy ingress
# controller). Off by default. Use values-nodeport.yaml to expose VST on NodePort 30888.
# To enable: --set global.vssIngress.enabled=true --set global.externalHost=<HOST>
vssIngress:
  enabled: false
  resourceName: ""
  ingressClassName: haproxy
  host: ""
  vstPort: 30888
  videoAnalyticsApiPort: 8081
  behaviorAnalyticsPort: 8080
  kibanaPort: 5601
  nvstreamerPort: 31000
  grafanaPort: 3000
  prometheusPort: 9090
