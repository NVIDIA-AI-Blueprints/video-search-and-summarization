global:
  # Enable vssIngress for HAProxy path-based routing. Use values-nodeport.yaml for
  # direct node access (VST on NodePort 30888).
  vssIngress:
    enabled: false
  # VIOS-only SDRC mode. Mirrors docker warehouse-operations/.env VST_USE_SDRC=true.
  vios:
    useSdrc: true
  ngcApiSecret:
    name: ngc-api
    key: NGC_CLI_API_KEY
  imagePullSecrets:
    - name: ngc-docker-reg-secret
  storageClass: ""
  useReleaseNamePrefix: false
  externalHost: ""
  externalPort: ""
  # Comma-separated static TURN URLs (username:password@host:port). See
  # deploy/helm/industry-profiles/warehouse-operations/TURN-SERVER.md.
  turnServerUrl: ""

bp-configurator:
  enabled: true
  name: bp-configurator-2d
  image:
    repository: ghcr.io/nvidia-ai-blueprints/vss/vss-configurator
    tag: develop-latest
    pullPolicy: IfNotPresent
  init:
    enabled: true
    streamType: kafka
    kafkaHost: kafka-kafka
    kafkaPort: "9092"
    redisHost: redis
    redisPort: "6379"
  env:
    - name: SENSOR_INFO_SOURCE
      value: nvstreamer
    - name: SENSOR_FILE_PATH
      value: /opt/camera-configs/camera_info.json
    - name: ENABLE_PROFILE_CONFIGURATOR
      value: "false"
    - name: ENABLE_SENSOR_CONFIGURATOR
      value: "true"
    - name: ENABLE_CALIBRATION_PROCESS
      value: "false"
    - name: ENABLE_REDIS_DUPLICATOR_THREAD
      value: "false"
    - name: SEND_CONFIG_TO_SDR
      value: "false"
    - name: CALL_SENSOR_ADD_API
      value: "true"
    - name: NUM_STREAMS
      value: "3"
    - name: MODE
      value: 2d
    - name: LOG_LEVEL
      value: INFO
    - name: NVSTREAMER_STREAMS_ENDPOINT
      value: http://vss-vios-nvstreamer:31000/api/v1/sensor/streams
    - name: NVSTREAMER_SENSOR_STATUS_ENDPOINT
      value: http://vss-vios-nvstreamer:31000/api/v1/sensor/status
    - name: VST_CAMERA_ADD_ENDPOINT
      value: http://vss-vios-ingress:30888/vst/api/v1/sensor/add
    - name: CALIBRATION_MODE
      value: mount
    - name: CALIBRATION_DIR_MOUNT_PATH
      value: /opt/data
    - name: CALIBRATION_FILE_NAME
      value: calibration.json
    - name: PORT
      value: "5001"
    - name: DS_CONFIG_DIR
      value: /opt/warehouse/deepstream/configs
    - name: NVSTREAMER_CONFIG_DIR
      value: /opt/warehouse/nvstreamer/configs
    - name: MESSAGE_BROKER_TYPE
      value: kafka
    - name: WDM_REDIS_HOST
      value: redis
    - name: WDM_REDIS_PORT
      value: "6379"
    - name: WDM_REDIS_STREAM_NAME
      value: vst.event
    - name: WDM_REDIS_MSG_KEY
      value: value
    - name: WDM_KFK_MSG_KEY
      value: vst.event
    - name: WDM_KFK_BOOTSTRAP_URL
      value: kafka-kafka:9092
    - name: WDM_KFK_TOPIC
      value: mdx-notification
    - name: WDM_WL_ID_FIELD
      value: camera_id
    - name: WDM_WL_EVENT_FIELD
      value: event
    - name: VST_ADAPTOR
      value: vst_rtsp
    - name: CHECK_SENSOR_IN_CALIBRATION_FILE
      value: "false"
    - name: RECOMPUTE_BEV_CENTERS_ENABLED
      value: "false"

  # camera_info.json for SENSOR_FILE_PATH. optional so the pod still starts when
  # cameraInfo.enabled is false.
  configMounts:
    - name: camera-configs
      mountPath: /opt/camera-configs
      configMapName: warehouse-camera-info
      optional: true

calibration-import:
  enabled: true
  name: import-calibration-output-2d
  apiUrl: http://vss-video-analytics-api:8081
  calibrationFileSource: https://github.com/NVIDIA-AI-Blueprints/video-search-and-summarization/blob/main/deploy/docker/industry-profiles/warehouse-operations/warehouse-2d-app/calibration/sample-data/warehouse-loading-dock-3cams-synthetic/calibration.json
  imageMetadataFileSource: https://github.com/NVIDIA-AI-Blueprints/video-search-and-summarization/blob/main/deploy/docker/industry-profiles/warehouse-operations/warehouse-2d-app/calibration/sample-data/warehouse-loading-dock-3cams-synthetic/images/imageMetadata.json
  imageBaseSource: https://github.com/NVIDIA-AI-Blueprints/video-search-and-summarization/blob/main/deploy/docker/industry-profiles/warehouse-operations/warehouse-2d-app/calibration/sample-data/warehouse-loading-dock-3cams-synthetic/images
  requireCalibration: true
  requireImages: true

warehouse:
  mode: 2d
  behaviorAnalytics:
    calibrationFile: files/behavior-analytics/calibration.json

vios:
  enabled: true
  vstStorage:
    createSharedPvcs: true
    accessMode: ReadWriteOnce
    vstData:
      size: 10Gi
      storageClass: ""
    vstVideo:
      size: 20Gi
      storageClass: ""
    streamerVideos:
      size: 20Gi
      storageClass: ""
  vss-vios-postgres:
    enabled: true
  vss-vios-envoy-proxy:
    enabled: false
  vss-vios-sdr:
    enabled: false
  vss-vios-sensor:
    enabled: true
    streamProcessorService: sdrc
    persistence:
      vstData: { enabled: true, create: false, existingClaim: "" }
      vstVideo: { enabled: true, create: false, existingClaim: "" }
  vss-vios-streamprocessing:
    enabled: true
    useSdrEnvoyStyleHeadless: false
    headlessServiceName: ""
    # No bind-mounts in Helm: download overlay assets from video-analytics-api.
    calibrationFileEndpoint: "http://vss-video-analytics-api:8081/config/calibration"
    floormapImageEndpoint: "http://vss-video-analytics-api:8081/config/calibration/image?place=building%3DWarehouse%2Froom%3DRoom-1&view=plan-view"
    persistence:
      vstData: { enabled: true, create: false, existingClaim: "" }
      vstVideo: { enabled: true, create: false, existingClaim: "" }
      streamerVideos: { enabled: true, create: false, existingClaim: "" }
    # GPU for hardware-accelerated encode/decode. To run in software mode (lower
    # throughput, frees the GPU for other workloads), set both in your values override:
    #   vios.vss-vios-streamprocessing.useSoftwarePath: true
    #   vios.vss-vios-streamprocessing.resources: null
    useSoftwarePath: false
    resources:
      limits:
        nvidia.com/gpu: 1
      requests:
        nvidia.com/gpu: 1
  vss-vios-ingress:
    enabled: true
    # useSdrc is on, so /vst/api/v1/, /vst/storage/ and the replay-picture route
    # go through SDRC's Envoy listener instead of hitting VST directly. Matches
    # nginx-vst-sdrc.conf in the compose profiles. Sensor stays on
    # vss-vios-sensor:30000 either way.
    streamprocessingUpstream: "sdrc-controller:10000"
    service:
      type: ClusterIP
  vss-vios-nvstreamer:
    enabled: true
    # Keep in step with bp-configurator NUM_STREAMS.
    syncFileCount: 3
    persistence:
      streamerVideos:
        enabled: true
        # hostPath: /opt/vss/customer-videos   # node-local customer videos
    ngcVideoSeed:
      enabled: true
      dataset: warehouse-loading-dock-3cams-synthetic
      # Reuses the bundle the rtvi-cv NGC job already extracted, so it is not
      # downloaded twice. Needs nvstreamer and rtvi-cv on the same node (RWO).
      # Clear this and set resourceVersion to download independently.
      fromExistingClaim: vss-rtvi-cv-models
      resourceVersion: nvidia/vss-warehouse/vss-warehouse-app-data:3.2.0

infra:
  enabled: true
  phoenix:
    enabled: true
    env:
      - name: PHOENIX_HOST_ROOT_PATH
        value: "/phoenix"
  redis:
    enabled: true
    persistence:
      storageClass: ""
      size: 5Gi
  sdrc:
    enabled: true
    configFilePath: configs/sdrc/config.yml
    config:
      configMapName: sdrc-config
      key: config.yml
      mountPath: /config.yml
  elasticsearch:
    enabled: true
    persistence:
      data:
        size: 10Gi
      logs:
        size: 5Gi
      storageClass: ""
    init:
      enabled: true
      env:
        ELASTICSEARCH_ILM_MIN_AGE: 4h
        ELASTICSEARCH_RTVI_CV_EMBEDDINGS_DIM: "1536"
        ELASTICSEARCH_VISION_LLM_EMBEDDINGS_DIM: "768"
  kibana:
    enabled: true
    # Matches the /kibana/ ingress path.
    basePath: /kibana
    init:
      enabled: true
      objectsBundle: warehouse-2d
  kafka:
    enabled: true
    topicJob:
      enabled: true
    persistence:
      storageClass: ""
      size: 50Gi
  logstash:
    enabled: true
  vss-broker-health-check:
    enabled: true
    kafkaHost: ""
    kafkaPort: "9092"
    redisHost: ""
    redisPort: "6379"

analytics:
  enabled: true
  vss-video-analytics-api:
    enabled: true
    kafkaBrokers: ""
    elasticsearchNode: ""
    storage:
      size: 5Gi
      storageClass: ""
    waitForDependencies:
      enabled: true
  vss-behavior-analytics:
    enabled: true
    fullnameOverride: vss-behavior-analytics
    waitForKafka:
      enabled: true
      host: kafka-kafka
      topic: mdx-raw
    replicas: 1
    command:
      - python3
      - apps/analytics/main_analytics_2d_app.py
      - --config
      - /resources/vss-behavior-analytics-config.json
      - --calibration
      - /resources/calibration.json
    resourceFiles:
      calibration:
        enabled: true
        mountPath: /resources/calibration.json
    config:
      kafkaConfigJson: |
        {
          "kafka": {
            "brokers": "kafka-kafka:9092",
            "topics": [
              {"name": "raw", "value": "mdx-raw"},
              {"name": "behavior", "value": "mdx-behavior"},
              {"name": "frames", "value": "mdx-frames"},
              {"name": "notification", "value": "mdx-notification"},
              {"name": "events", "value": "mdx-events"},
              {"name": "incidents", "value": "mdx-incidents"}
            ],
            "consumer": {
              "autoOffsetReset": "latest",
              "enableAutoCommit": false,
              "maxPollIntervalMs": 900000,
              "maxPartitionFetchBytes": 10485760,
              "fetchMaxBytes": 104857600,
              "maxPollRecords": 10000,
              "timeout": 0.01
            },
            "producer": {"lingerMs": 0},
            "group": "mdx-spatial-analytics-2d-app"
          },
          "redisStream": {
            "host": "redis",
            "port": 6379,
            "streams": [
              {"name": "raw", "value": "mdx-raw"},
              {"name": "frames", "value": "mdx-frames"},
              {"name": "behavior", "value": "mdx-behavior"},
              {"name": "notification", "value": "mdx-notification"},
              {"name": "events", "value": "mdx-events"},
              {"name": "incidents", "value": "mdx-incidents"}
            ],
            "consumer": {"readCount": 200, "readBlockMs": 100},
            "producer": {"maxLen": 10000},
            "group": "mdx-spatial-analytics-2d-app"
          },
          "sensors": [
            {
              "id": "default",
              "configs": [
                {"name": "proximityDetectionEnable", "value": "true"},
                {"name": "proximityDetectionThreshold", "value": "4"},
                {"name": "proximityDetectionCenterClasses", "value": "[\"Forklift\"]"},
                {"name": "proximityDetectionSurroundingClasses", "value": "[\"Person\"]"},
                {"name": "tripwireMinPoints", "value": "4"}
              ]
            }
          ],
          "app": [
            {"name": "behaviorEmitOnce", "value": "false"},
            {"name": "behaviorWatermarkSec", "value": "30"},
            {"name": "behaviorMaxPoints", "value": "200"},
            {"name": "playbackLoop", "value": "10000"},
            {"name": "playbackFilterEmptyObjects", "value": "true"},
            {"name": "playbackStartUpDelaySec", "value": "90"},
            {"name": "sourceType", "value": "kafka"},
            {"name": "sinkType", "value": "kafka"},
            {"name": "numWorkersForBehaviorCreation", "value": "2"},
            {"name": "numWorkersForFrameEnhancement", "value": "2"},
            {"name": "stateManagementFilter", "value": "[\"Person\",\"Forklift\"]"},
            {"name": "restrictedAreaViolationIncidentEnable", "value": "true"},
            {"name": "confinedAreaViolationIncidentEnable", "value": "true"},
            {"name": "proximityViolationIncidentEnable", "value": "true"},
            {"name": "restrictedAreaViolationIncidentThreshold", "value": "2"},
            {"name": "confinedAreaViolationIncidentThreshold", "value": "2"},
            {"name": "proximityViolationIncidentThreshold", "value": "2"}
          ]
        }
    imagePullSecrets:
      - name: ngc-docker-reg-secret

rtvi:
  enabled: true
  vss-rtvi-cv:
    enabled: true
    profileMode: standalone-2d
    replicas: 1
    # image: inherited from the rtvi-cv subchart's managed GHCR channel.
    # Pinning it here would override that default and silently keep this
    # profile on NGC, exactly like the other managed images which are not
    # pinned in profile values. Override globally with
    # global.container_prefix / global.container_tag instead.
    image:
      pullPolicy: IfNotPresent
    httpPort: 9000
    streamType: kafka
    downloadNgcAppData: true
    downloadModelsFromNgc: true
    ngcApiKeySecretName: ngc-api
    ngcApiKeySecretKey: NGC_CLI_API_KEY
    ngcAppDataOrg: nvidia
    ngcAppDataResourceVersion: nvidia/vss-warehouse/vss-warehouse-app-data:3.2.0
    ngcModelsToDownload:
      - model: nvidia/tao/rtdetr_2d_warehouse:deployable_rn50_v1.0.2
        org: nvidia
        sourcePath: rtdetr_2d_warehouse_vdeployable_rn50_v1.0.2/rtdetr_warehouse_v1.0.2.fp16.onnx
        destPath: rtdetr_warehouse_v1.0.2.fp16.onnx
    kafka:
      bootstrapServers: ""
    standaloneWarehouse:
      streamType: kafka
      kafka:
        rawTopic: mdx-raw
    persistence:
      storageClass: ""
      models:
        size: 80Gi
    resources:
      limits:
        nvidia.com/gpu: 1
      requests:
        nvidia.com/gpu: 1

# Alerts stack, off by default. Enable vss-alert-bridge, agent, and
# rtvi.vss-rtvi-vlm together to run alerts.
vss-alert-bridge:
  enabled: false
  kafkaBootstrapServers: ""
  elasticHosts: ""
  vlmBaseUrl: ""
  vlmName: "nim_nvidia_cosmos3-nano-reasoner_bf16-final"
  vstBaseUrl: ""
  alertReviewMediaBaseDir: ""
  configVariant: ""
  waitForDependencies:
    enabled: true

agent:
  enabled: false
  # va-mcp is off in the agent chart by default; alerts needs it.
  vss-va-mcp:
    enabled: true
  vss-agent:
    waitForDependencies:
      enabled: true
      waitForMcp: true

# Off by default; enable with the alerts stack. Warehouse 2D exposes both
# Real-time Alerts and CV Alerts Verification under Manage Alerts.
vss-agent-ui:
  enabled: false
  alertsRealtimeEnabled: true
  alertsCvVerificationEnabled: true

# Prometheus + Grafana (K8s port of deploy/docker/services/monitoring).
# dcgmExporter stays off because the NVIDIA GPU operator already runs
# nvidia-dcgm-exporter, which Prometheus scrapes via prometheus.gpuOperator.
monitoring:
  enabled: true
  prometheus:
    enabled: true
    # Matches the /prometheus/ ingress path.
    routePrefix: /prometheus
  grafana:
    enabled: true
    # Matches the /grafana/ ingress path. Set the full external URL when the
    # ingress host or port differs.
    rootUrl: http://localhost:8080/grafana
  nodeExporter:
    enabled: true
  dcgmExporter:
    enabled: false

# Live RTSP cameras. Enable, list the sensors, then switch the bp-configurator
# env SENSOR_INFO_SOURCE to "file" so the configurator registers these with VST
# instead of discovering nvstreamer files.
cameraInfo:
  enabled: false
  configMapName: warehouse-camera-info
  sensors: []
    # - camera_name: cam-01
    #   rtsp_url: rtsp://10.0.0.10:554/stream
    #   group_id: dock
    #   region: north

# HAProxy Ingress, mirroring the vss-haproxy-ingress compose service.
# Optional HAProxy path-based ingress (requires a cluster-wide HAProxy ingress
# controller). Off by default. Use values-nodeport.yaml to expose VST on NodePort 30888.
# To enable: --set global.vssIngress.enabled=true --set global.externalHost=<HOST>
vssIngress:
  enabled: false
  resourceName: ""
  ingressClassName: haproxy
  host: ""
  vstPort: 30888
  videoAnalyticsApiPort: 8081
  behaviorAnalyticsPort: 8080
  kibanaPort: 5601
  nvstreamerPort: 31000
  grafanaPort: 3000
  prometheusPort: 9090
