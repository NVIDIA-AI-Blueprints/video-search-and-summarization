# Generated by blueprint_builder Docker Compose builder
# https://docs.docker.com/compose/compose-file/

services:
  deft-service-wait-for-backend-api:
    image: busybox:1.37.0
    entrypoint:
    - sh
    - -c
    - until nc -z backend-api 8000; do echo 'Waiting for backend-api to be ready...'; sleep 2; done; echo 'backend-api is
      ready!'
    networks:
    - app-network
    restart: 'no'
  deft-service:
    image: ${DEFT_SERVICE_IMAGE:-nvcr.io/0691049440816435/mdx/deft-service:v0.0.1}
    container_name: deft-service
    environment:
      DEFT_EXECUTION_MODE: real
      DEFT_BACKEND_TYPE: docker
      DEFT_RUNTIME_DIR: ${DEFT_RUNTIME_DIR:?Set DEFT_RUNTIME_DIR to an absolute host directory for DEFT runtime data}
      DEFT_MATERIALIZE_ROOT: ${DEFT_RUNTIME_DIR:?Set DEFT_RUNTIME_DIR to an absolute host directory for DEFT runtime data}/materialize
      DEFT_ALLOWED_WORKSPACE_ROOT: ${DEFT_RUNTIME_DIR:?Set DEFT_RUNTIME_DIR to an absolute host directory for DEFT runtime
        data}
      DEFT_STORAGE_ROOT: file://${DEFT_RUNTIME_DIR:?Set DEFT_RUNTIME_DIR to an absolute host directory for DEFT runtime data}/storage
      DEFT_DB_PATH: ${DEFT_RUNTIME_DIR:?Set DEFT_RUNTIME_DIR to an absolute host directory for DEFT runtime data}/deft_service.db
      DEFT_FIPS_ZERO_FILE: ${DEFT_RUNTIME_DIR:?Set DEFT_RUNTIME_DIR to an absolute host directory for DEFT runtime data}/deft_fips_zero
      DEFT_AUTH_MODE: static
      DEFT_API_KEYS: ${DEFT_API_KEY:?DEFT_API_KEY must be set}:data-flywheel
      HF_TOKEN: ${HF_TOKEN}
      DEFT_MAX_NUM_GPUS: ${DEFT_MAX_NUM_GPUS:-64}
      DEFT_GPU_SLOTS: ${DEFT_GPU_SLOTS:-1}
      DEFT_STAGE_TIMEOUT_S: ${DEFT_STAGE_TIMEOUT_S:-14400}
      DEFT_TAO_PYT_IMAGE: ${DEFT_TAO_PYT_IMAGE:-nvcr.io/nvidia/tao/tao-toolkit:6.26.3-pyt}
      DEFT_SIGLIP_MODEL: ${DEFT_SIGLIP_MODEL:-google/siglip-base-patch16-224}
      DEFT_BACKBONE_CACHE: ${DEFT_RUNTIME_DIR:?Set DEFT_RUNTIME_DIR to an absolute host directory for DEFT runtime data}/cache/c_radio_v2_b.safetensors
      DEFT_MATERIALIZE_PRESIGN_URL: http://backend-api:8000/v1/get_presigned_urls
      DEFT_MATERIALIZE_STORAGE_URL: http://backend-api:8000
      DEFT_PUBLISH_PRESIGN_URL: http://backend-api:8000/v1/get_presigned_post_url
    ports:
    - ${DEFT_SERVICE_PORT:-9150}:8000
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ${DEFT_RUNTIME_DIR:?Set DEFT_RUNTIME_DIR to an absolute host directory for DEFT runtime data}:${DEFT_RUNTIME_DIR:?Set
      DEFT_RUNTIME_DIR to an absolute host directory for DEFT runtime data}
    depends_on:
      backend-api:
        condition: service_started
      deft-service-wait-for-backend-api:
        condition: service_completed_successfully
    networks:
    - app-network
    restart: always
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/v1/health', timeout=4).status
        == 200 else 1)
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
networks:
  app-network:
    driver: bridge
    external: false
x-blueprint-builder:
  tool-version: 0.2.5
  blueprint: deft-aoi-deft-service
