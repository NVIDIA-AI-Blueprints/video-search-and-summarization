    - 'yes'
    environment: {}
    volumes:
    - data-flywheel-redis-data:/data
    networks:
    - app-network
    restart: always
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 15s
  mongodb:
    image: mongo:7.0.25
    command:
    - mongod
    - --quiet
    - --setParameter
    - diagnosticDataCollectionEnabled=false
    - --setParameter
    - 'logComponentVerbosity={ "network": { "verbosity": 0 }, "command": { "verbosity": 0 }, "control": { "verbosity": 0 }
      }'
    environment:
      MONGO_LOG_LEVEL: ${MONGO_LOG_LEVEL:-error}
    volumes:
    - mongodb-data:/data/db
    networks:
    - app-network
    restart: always
    healthcheck:
      test:
      - CMD
      - mongosh
      - --quiet
      - mongodb://localhost:27017/test
      - --eval
      - 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.6.0
    command:
    - mlflow
    - server
    - --host
    - 0.0.0.0
    - --port
    - '5000'
    - --backend-store-uri
    - sqlite:////mlruns/mlflow.db
    - --default-artifact-root
    - mlflow-artifacts:/
    - --serve-artifacts
    - --artifacts-destination
    - /mlruns/artifacts
    - --allowed-hosts
    - ${MLFLOW_ALLOWED_HOSTS:-mlflow:5000,mlflow-*:5000,localhost:*,127.0.0.1:*}
    environment:
      MLFLOW_ALLOWED_HOSTS: ${MLFLOW_ALLOWED_HOSTS:-mlflow:5000,mlflow-*:5000,localhost:*,127.0.0.1:*}
    ports:
    - ${MLFLOW_BIND_ADDRESS:-127.0.0.1}:${MLFLOW_HOST_PORT:-5500}:5000
    volumes:
    - mlflow-data:/mlruns
    networks:
    - app-network
    restart: always
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health', timeout=4).status
        == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
