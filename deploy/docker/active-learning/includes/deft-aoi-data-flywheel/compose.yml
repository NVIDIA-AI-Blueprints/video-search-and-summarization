      REDIS_URL: redis://redis:6379/0
      MONGODB_URL: mongodb://mongodb:27017
      DFW_MLFLOW_URL: http://mlflow:5000
      DFW_MODEL_MANAGER_URL: http://data-flywheel-model-manager:8090
      DFW_TRAINING_NO_PROGRESS_TIMEOUT_S: "${DFW_TRAINING_NO_PROGRESS_TIMEOUT_S:-86400}"
      DEFT_RUNTIME_WORKSPACE: "${DEFT_RUNTIME_DIR:-/home/horde/deft-aoi-workspace}/aoi-workspace"
    volumes:
    - data-flywheel-beat-data:/app/celerybeat-schedule
    - ./service-configs/data-flywheel-beat/configs/config.deft.yaml:/opt/data-flywheel/config/config.deft.yaml:ro
    - ./service-configs/data-flywheel-beat/render_config.py:/opt/data-flywheel/render_config.py:ro
    depends_on:
      deft-service:
        condition: service_healthy
      backend-api:
        condition: service_started
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      data-flywheel-model-manager:
        condition: service_healthy
      data-flywheel-beat-wait-for-redis:
        condition: service_completed_successfully
      data-flywheel-beat-wait-for-mongodb:
        condition: service_completed_successfully
      data-flywheel-beat-wait-for-mlflow:
        condition: service_completed_successfully
      data-flywheel-beat-wait-for-data-flywheel-model-manager:
        condition: service_completed_successfully
      data-flywheel-beat-wait-for-deft-service:
        condition: service_completed_successfully
      data-flywheel-beat-wait-for-backend-api:
        condition: service_completed_successfully
    networks:
    - app-network
    restart: always
  data-flywheel-model-manager-wait-for-aoi-inference:
    image: busybox:1.37.0
    entrypoint:
    - sh
    - -c
    - until nc -z aoi-inference 5000; do echo 'Waiting for aoi-inference to be ready...'; sleep 2; done; echo 'aoi-inference
      is ready!'
    networks:
    - app-network
    restart: 'no'
    group_add:
    - '2000'
  data-flywheel-model-manager:
    image: ${DFW_MODEL_MANAGER_IMAGE:-nvcr.io/0691049440816435/mdx/dfw-model-manager:v0.0.1}
    container_name: data-flywheel-model-manager
    environment:
      MODEL_MANAGER_CLIENT: ${MODEL_MANAGER_CLIENT:-aoi}
      MODEL_MANAGER_UNIFIED_ALLOW_UNLOAD: ${MODEL_MANAGER_UNIFIED_ALLOW_UNLOAD:-false}
      MODEL_MANAGER_MODEL_REPO_PATH: ${MODEL_MANAGER_MODEL_REPO_PATH:-/models}
      MODEL_MANAGER_ACTIVATION_MODE: ${MODEL_MANAGER_ACTIVATION_MODE:-explicit}
      MODEL_MANAGER_MODEL_NAME: ${MODEL_MANAGER_MODEL_NAME:-aoi-secondary-inspection}
      MODEL_MANAGER_REQUEST_TIMEOUT: ${MODEL_MANAGER_REQUEST_TIMEOUT:-30.0}
      MODEL_MANAGER_REQUEST_MAX_RETRIES: ${MODEL_MANAGER_REQUEST_MAX_RETRIES:-2}
      MODEL_MANAGER_REQUEST_BACKOFF_BASE: ${MODEL_MANAGER_REQUEST_BACKOFF_BASE:-0.5}
      MODEL_MANAGER_READINESS_MAX_CHECKS: ${MODEL_MANAGER_READINESS_MAX_CHECKS:-5}
      MODEL_MANAGER_READINESS_POLL_INTERVAL: ${MODEL_MANAGER_READINESS_POLL_INTERVAL:-2.0}
      MODEL_MANAGER_AOI_INFERENCE_URL: http://aoi-inference:5000
      MODEL_MANAGER_AOI_CLIENT_URL: http://aoi-inference:5000
      MODEL_MANAGER_UNIFIED_URL: http://aoi-inference:5000
    ports:
    - ${DFW_BIND_ADDRESS:-127.0.0.1}:${DFW_MODEL_MANAGER_PORT:-8090}:8090
    volumes:
    - aoi-inference-model-repository:/models
    depends_on:
      aoi-inference:
        condition: service_healthy
      data-flywheel-model-manager-wait-for-aoi-inference:
        condition: service_completed_successfully
    networks:
    - app-network
    restart: always
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8090/v1/health
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    user: 10001:10001
    group_add:
    - '2000'
  redis:
    image: redis:7.4.7-alpine
    container_name: redis
    command:
    - redis-server
    - --appendonly
    - 'yes'
    environment: {}
    volumes:
    - data-flywheel-redis-data:/data
    networks:
    - app-network
    restart: always
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 15s
  mongodb:
    image: mongo:7.0.25
    container_name: mongodb
    command:
    - mongod
    - --quiet
    - --setParameter
    - diagnosticDataCollectionEnabled=false
    - --setParameter
    - 'logComponentVerbosity={ "network": { "verbosity": 0 }, "command": { "verbosity": 0 }, "control": { "verbosity": 0 }
      }'
    environment:
      MONGO_LOG_LEVEL: ${MONGO_LOG_LEVEL:-error}
    volumes:
    - mongodb-data:/data/db
    networks:
    - app-network
    restart: always
    healthcheck:
      test:
      - CMD
      - mongosh
      - --quiet
      - mongodb://localhost:27017/test
      - --eval
      - 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.6.0
    container_name: mlflow
    command:
    - mlflow
    - server
    - --host
    - 0.0.0.0
    - --port
    - '5000'
    - --backend-store-uri
    - sqlite:////mlruns/mlflow.db
    - --default-artifact-root
    - mlflow-artifacts:/
    - --serve-artifacts
    - --artifacts-destination
    - /mlruns/artifacts
    - --allowed-hosts
    - ${MLFLOW_ALLOWED_HOSTS:-mlflow:5000,mlflow-*:5000,localhost:*,127.0.0.1:*}
    environment:
      MLFLOW_ALLOWED_HOSTS: ${MLFLOW_ALLOWED_HOSTS:-mlflow:5000,mlflow-*:5000,localhost:*,127.0.0.1:*}
    ports:
    - ${MLFLOW_BIND_ADDRESS:-127.0.0.1}:${MLFLOW_HOST_PORT:-5500}:5000
    volumes:
    - mlflow-data:/mlruns
    networks:
    - app-network
    restart: always
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health', timeout=4).status
        == 200 else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
volumes:
  aoi-inference-model-repository:
    driver: local
    external: false
  data-flywheel-beat-data:
    driver: local
    external: false
  data-flywheel-redis-data:
    driver: local
    external: false
  mlflow-data:
    driver: local
    external: false
  mongodb-data:
    driver: local
    external: false
networks:
  app-network:
    driver: bridge
    external: false
x-blueprint-builder:
  tool-version: 0.2.5
  blueprint: deft-aoi-data-flywheel
