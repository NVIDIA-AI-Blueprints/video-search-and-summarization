    environment:
      MODEL_MANAGER_CLIENT: ${MODEL_MANAGER_CLIENT:-unified}
      MODEL_MANAGER_UNIFIED_ALLOW_UNLOAD: ${MODEL_MANAGER_UNIFIED_ALLOW_UNLOAD:-false}
      MODEL_MANAGER_MODEL_REPO_PATH: ${MODEL_MANAGER_MODEL_REPO_PATH:-/models}
      MODEL_MANAGER_ACTIVATION_MODE: ${MODEL_MANAGER_ACTIVATION_MODE:-explicit}
      MODEL_MANAGER_MODEL_NAME: ${MODEL_MANAGER_MODEL_NAME:-aoi-secondary-inspection}
      MODEL_MANAGER_REQUEST_TIMEOUT: ${MODEL_MANAGER_REQUEST_TIMEOUT:-30.0}
      MODEL_MANAGER_REQUEST_MAX_RETRIES: ${MODEL_MANAGER_REQUEST_MAX_RETRIES:-2}
