services:
  data-flywheel-api-wait-for-backend-api:
    image: busybox:1.37.0
    entrypoint:
    - sh
    - -c
    - until nc -z backend-api 8000; do echo 'Waiting for backend-api to be ready...'; sleep 2; done; echo 'backend-api is
      ready!'
    networks:
    - app-network
    restart: 'no'
  data-flywheel-api:
    image: ${DFW_IMAGE:-nvcr.io/0691049440816435/mdx/foundational-flywheel-server-deft:v0.0.1}
    command:
    - uv
    - run
    - uvicorn
    - src.app:app
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    entrypoint:
    - uv
    - run
    - python
    - /opt/data-flywheel/render_config.py
    - --source
    - /opt/data-flywheel/config/config.deft.yaml
    - --output
    - ${DFW_CONFIG_PATH:-/tmp/data-flywheel/config.deft.yaml}
    - --
    environment:
      BACKEND: ${BACKEND:-deft}
      COMPOSE_PROFILES: deft
      DFW_CONFIG_PATH: ${DFW_CONFIG_PATH:-/tmp/data-flywheel/config.deft.yaml}
      DFW_OBJECT_STORE_URI: s3://aoi-samples
      DFW_BASELINE_MODEL_CHECKPOINT: ${DFW_BASELINE_MODEL_CHECKPOINT:-s3://aoi-samples/models/baseline/1.0.0/model.pth}
      DFW_MODEL_NAME: changenet_classify
      AOI_SELECTION_TAG: ${AOI_SELECTION_TAG:?AOI_SELECTION_TAG must be set}
      DFW_KPI_SET_URI: ${DFW_KPI_SET_URI:-null}
      DFW_HITL_CANARY: ${DFW_HITL_CANARY:-true}
      DFW_HITL_FULL: ${DFW_HITL_FULL:-true}
      DFW_STAGE_SHADOW: ${DFW_STAGE_SHADOW:-true}
      DFW_STAGE_CANARY: ${DFW_STAGE_CANARY:-true}
      MONGODB_DB: ${MONGODB_DB:-flywheel}
      DEFT_API_KEY: ${DEFT_API_KEY:?DEFT_API_KEY must be set}
      STORAGE_BACKEND_API_KEY: ${STORAGE_BACKEND_API_KEY:?STORAGE_BACKEND_API_KEY must be set}
      DFW_DEFT_BASE_URL: http://deft-service:8000
      DFW_STORAGE_BACKEND_URL: http://backend-api:8000
      REDIS_URL: redis://redis:6379/0
      MONGODB_URL: mongodb://mongodb:27017
      DFW_MLFLOW_URL: http://mlflow:5000
      DFW_MODEL_MANAGER_URL: http://data-flywheel-model-manager:8090
      DFW_TRAINING_NO_PROGRESS_TIMEOUT_S: ${DFW_TRAINING_NO_PROGRESS_TIMEOUT_S:-86400}
      DEFT_RUNTIME_WORKSPACE: ${DEFT_RUNTIME_DIR:?Set DEFT_RUNTIME_DIR to an absolute host directory for DEFT runtime data}/aoi-workspace
    ports:
    - ${DFW_BIND_ADDRESS:-127.0.0.1}:${DFW_API_PORT:-8020}:8000
    volumes:
    - ./service-configs/data-flywheel/config.deft.yaml:/opt/data-flywheel/config/config.deft.yaml:ro
    - ./service-configs/data-flywheel/render_config.py:/opt/data-flywheel/render_config.py:ro
    depends_on:
      deft-service:
        condition: service_healthy
      backend-api:
        condition: service_started
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      data-flywheel-model-manager:
        condition: service_healthy
      data-flywheel-api-wait-for-backend-api:
        condition: service_completed_successfully
    networks:
    - app-network
    restart: always
