# AOI ingest — Kafka → Elasticsearch (JSON wire format).
#
# Topic:  aoi-metadata
# Schema: AOI inspection JSON (version, machineInfo, aoiDefects, imageInfo, …)
#
# SPDX-FileCopyrightText: Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved.
# SPDX-License-Identifier: LicenseRef-NvidiaProprietary
#
# Writes documents into Elasticsearch in the shape that
# via-ctx-rag's ElasticsearchDBTool.add_summary produces:
#
#   {
#     "text":   <human-readable defect summary>,
#     "vector": <deterministic NullEmbedding vector>,
#     "metadata": {
#       "source": <objStorePath or "N/A">,
#       "content_metadata": {
#         machineId, location, jobType, defectCount,
#         objStorePath, imageType, version, description, timestamp,
#         uuid, doc_type, doc_i, chunkIdx
#         cropInfo[] — per-crop metadata from upload; WF2 BE later adds
#         cropInfo[].inference + content_metadata.inferenceSummary via upsert.
#       }
#     }
#   }
#
# Document _id = "<collection>:<uuid>:aoi_inspection:0"
# so Kafka redeliveries upsert (idempotent ingest).

input {
  kafka {
    bootstrap_servers        => "${KAFKA_BOOTSTRAP_SERVERS}"
    topics                   => ["aoi-metadata"]
    group_id                 => "logstash-aoi-es-writer"
    client_id                => "logstash-aoi-ingest-1"
    auto_offset_reset        => "earliest"
    enable_auto_commit       => true
    decorate_events          => "basic"
    key_deserializer_class   => "org.apache.kafka.common.serialization.StringDeserializer"
    value_deserializer_class => "org.apache.kafka.common.serialization.StringDeserializer"

    codec => json
  }
}

filter {
  ruby {
    init => '
      require "digest"

      # Deterministic non-zero pseudo-random vector seeded from SHA-256(text).
      # ES cosine similarity rejects zero-magnitude vectors with:
      #   document_parsing_exception: "The [cosine] similarity does not
      #   support vectors with zero magnitude"
      # SHA-256 (not Ruby String#hash) keeps the seed stable across restarts
      # and replicas (Ruby String#hash is salted per process).
      def null_embedding(text, dim, seed)
        digest_hex = Digest::SHA256.hexdigest(text.to_s)
        text_seed  = digest_hex[0, 16].to_i(16)
        rng        = Random.new(seed + text_seed)
        Array.new(dim) { rng.rand }
      end
    '
    code => '
      machine = event.get("machineInfo") || {}
      defects = event.get("aoiDefects")  || {}
      image   = event.get("imageInfo")   || {}
      path    = event.get("objStorePath").to_s

      # Build searchable text — defect summary used for kNN retrieval.
      defect_detail = (defects["details"] || []).map { |d|
        "#{d["count"]} #{d["defectType"]}"
      }.join(", ")
      text = "Machine #{machine["machineId"]} at #{machine["location"]} " \
             "(#{machine["jobType"]}): #{defects["count"] || 0} defect(s)" \
             "#{defect_detail.empty? ? "" : " [#{defect_detail}]"}. " \
             "Image: #{path}."
      event.set("text", text)

      # Restrict the machine-derived suffix to Elasticsearch-safe ASCII.
      safe_machine = (machine["machineId"] || "unknown").to_s.downcase
        .gsub(/[^a-z0-9._-]/, "_")
      coll = "aoi_#{safe_machine}"[0, 255]

      # Stable UUID from objStorePath so the same image always maps to the
      # same document. For legacy pathless events, hash the stable payload
      # fields so distinct inspections cannot overwrite one another.
      identity = path
      if identity.empty?
        identity = event.to_hash.reject { |key, _| key.start_with?("@") }
          .sort.to_h.to_s
      end
      uuid = Digest::SHA256.hexdigest(identity)[0, 32]

      cm = {
        "doc_type"    => "aoi_inspection",
        "uuid"        => uuid,
        "doc_i"       => 0,
        "chunkIdx"    => 0,
        "machineId"   => machine["machineId"],
        "location"    => machine["location"],
        "jobType"     => machine["jobType"],
        "defectCount" => defects["count"],
        "objStorePath"=> path,
        "imageType"   => image["imageType"],
        "imageSize"   => image["imageSize"],
        "cropInfo"    => image["cropInfo"],
        "version"     => event.get("version"),
        "description" => event.get("description"),
        "timestamp"   => event.get("timestamp"),
        "tag"         => event.get("tag"),
      }

      # Only present on KPI uploads. Guard against nil so a re-ingest message
      # that lacks golden-ref (e.g. a non-KPI ingest or WF2 inference re-ingest)
      # does not overwrite an already-stored goldenRef with null.
      golden = image["golden-ref"]
      cm["goldenRef"] = golden unless golden.nil?

      # WF2: only present on inference re-ingest. Add it only when non-nil so an
      # upload message never carries a null that a partial-update merge would use
      # to clobber an existing inferenceSummary. (cropInfo[].inference flows
      # through cm["cropInfo"] above.)
      inf = event.get("inferenceSummary")
      cm["inferenceSummary"] = inf unless inf.nil?

      cm.each_pair { |k, v| cm[k] = nil if v == "" }

      source = path.empty? ? "N/A" : path

      event.set("[metadata][source]", source)
      event.set("[metadata][content_metadata]", cm)
      event.set("[@metadata][collection]", coll)
      event.set("[@metadata][es_id]", "#{coll}:#{uuid}:aoi_inspection:0")

      event.set("vector", null_embedding(text, 1024, 42))
    '
  }

  # JSON numbers are already native types; only coerce fields that could arrive
  # as strings if a producer serializes them that way.
  mutate {
    convert => {
      "[metadata][content_metadata][defectCount]" => "integer"
      "[metadata][content_metadata][imageSize]"   => "integer"
      "[metadata][content_metadata][doc_i]"       => "integer"
      "[metadata][content_metadata][chunkIdx]"    => "integer"
    }
  }

  mutate {
    remove_field => ["machineInfo", "aoiDefects", "imageInfo",
                     "version", "description", "timestamp", "tag", "objStorePath",
                     "inferenceSummary", "@version", "@timestamp", "event"]
  }
}

output {
  elasticsearch {
    hosts           => ["${ES_URL}"]
    index           => "%{[@metadata][collection]}"
    document_id     => "%{[@metadata][es_id]}"
    action          => "update"
    doc_as_upsert   => true
    manage_template => false
  }
}
