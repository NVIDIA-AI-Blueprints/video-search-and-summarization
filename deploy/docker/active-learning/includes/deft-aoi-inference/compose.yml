services:
  aoi-inference-triton-seed-aoi-model-repository:
    image: ${AOI_INFERENCE_IMAGE:-nvcr.io/0691049440816435/mdx/deft-aoi-inference:v0.0.1}
    command:
    - /usr/local/bin/seed-model-repository.sh
    entrypoint:
    - /bin/bash
    environment:
      AOI_MODEL_REPOSITORY_GID: '2000'
    volumes:
    - aoi-inference-model-repository:/seed-target
    - ./scripts/seed-model-repository.sh:/usr/local/bin/seed-model-repository.sh:ro
    networks:
    - app-network
    restart: 'no'
    user: 0:0
    group_add:
    - '2000'
  aoi-inference-triton:
    image: ${AOI_INFERENCE_IMAGE:-nvcr.io/0691049440816435/mdx/deft-aoi-inference:v0.0.1}
    container_name: aoi-inference-triton
    environment:
      TRITON_MODEL: changenet_classify
      SKIP_BUILD: ${SKIP_BUILD:-false}
      PRECISION: ${PRECISION:-fp16}
      IMG_SIZE: ${IMG_SIZE:-224}
      MIN_BATCH: ${MIN_BATCH:-1}
      OPT_BATCH: ${OPT_BATCH:-8}
      MAX_BATCH: ${MAX_BATCH:-16}
      WORKSPACE_MB: ${WORKSPACE_MB:-8192}
      BUILD_STATE_PATH: ${BUILD_STATE_PATH:-/app/microservice/triton_model_repo/.engine-build.json}
      BUILD_STATE_MAX_AGE: ${BUILD_STATE_MAX_AGE:-3600}
      BUILD_LOCK_PATH: ${BUILD_LOCK_PATH:-/app/microservice/triton_model_repo/.engine-build.lock}
      STATE_DB_PATH: ${STATE_DB_PATH:-/app/state/service-state.sqlite3}
      JOB_WORKER_ENABLED: ${JOB_WORKER_ENABLED:-false}
      DEPLOYMENT_STATE_PATH: ${DEPLOYMENT_STATE_PATH:-/app/microservice/triton_model_repo/.deployment-state.json}
      DEPLOYMENT_STATE_TTL: ${DEPLOYMENT_STATE_TTL:-1.0}
      DEPLOYMENT_STATE_MAX_AGE: ${DEPLOYMENT_STATE_MAX_AGE:-0}
      BUILD_QUEUE_TIMEOUT_MULTIPLIER: ${BUILD_QUEUE_TIMEOUT_MULTIPLIER:-6}
      BUILD_DEGRADE_READINESS: ${BUILD_DEGRADE_READINESS:-false}
      BUILD_UNLOAD_DURING_BUILD: ${BUILD_UNLOAD_DURING_BUILD:-false}
      GPU_EXEC_SLOTS: ${GPU_EXEC_SLOTS:-3}
    volumes:
    - aoi-inference-model-repository:/app/microservice/triton_model_repo
    - aoi-inference-service-state:/app/state
    depends_on:
      aoi-inference-triton-seed-aoi-model-repository:
        condition: service_completed_successfully
    networks:
    - app-network
    restart: always
    deploy:
      resources:
        reservations:
          devices:
          - capabilities:
            - gpu
            driver: nvidia
            device_ids:
            - '0'
    healthcheck:
      test:
      - CMD
      - curl
      - -sf
      - http://localhost:8000/v2/health/ready
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    user: 1000:1000
    group_add:
    - '2000'
    shm_size: 8g
    init: true
  aoi-inference-api-wait-for-aoi-inference-triton:
    image: curlimages/curl:8.12.1
    entrypoint:
    - sh
    - -c
    - until curl -f http://aoi-inference-triton:8000/v2/health/ready; do echo 'Waiting for aoi-inference-triton to be ready...';
      sleep 2; done; echo 'aoi-inference-triton is ready!'
    networks:
    - app-network
    restart: 'no'
    group_add:
    - '2000'
  aoi-inference-api:
    image: ${AOI_INFERENCE_IMAGE:-nvcr.io/0691049440816435/mdx/deft-aoi-inference:v0.0.1}
    command:
    - --api-only
    environment:
      TRITON_MODEL: changenet_classify
      TRITON_PROTOCOL: ${TRITON_PROTOCOL:-grpc}
      SERVICE_HOST: ${SERVICE_HOST:-0.0.0.0}
      SERVICE_PORT: ${SERVICE_PORT:-5000}
      QUEUE_TIMEOUT: ${QUEUE_TIMEOUT:-5.0}
      PREPROCESS_WORKERS: ${PREPROCESS_WORKERS:-8}
      PREPROCESS_MAX_INFLIGHT: ${PREPROCESS_MAX_INFLIGHT:-16}
      API_MAX_INFLIGHT: ${API_MAX_INFLIGHT:-64}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-268435456}
      MAX_BATCH: ${MAX_BATCH:-16}
      SERVER_MAX_BATCH: ${SERVER_MAX_BATCH:-16}
      MAX_REQUEST_BATCH: ${MAX_REQUEST_BATCH:-64}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      STATE_DB_PATH: ${STATE_DB_PATH:-/app/state/service-state.sqlite3}
      MAX_JOB_PAIRS: ${MAX_JOB_PAIRS:-1024}
      MAX_QUEUED_JOBS: ${MAX_QUEUED_JOBS:-32}
      JOB_WORKER_ENABLED: ${JOB_WORKER_ENABLED:-true}
      JOB_ALLOWED_ROOTS: ${JOB_ALLOWED_ROOTS:-/app/data}
      TRITON_ONLINE_PRIORITY: ${TRITON_ONLINE_PRIORITY:-1}
      TRITON_BULK_PRIORITY: ${TRITON_BULK_PRIORITY:-2}
      REFERENCE_DIR: ${REFERENCE_DIR:-/app/references}
      BUILD_QUEUE_TIMEOUT_MULTIPLIER: ${BUILD_QUEUE_TIMEOUT_MULTIPLIER:-6}
      BUILD_DEGRADE_READINESS: ${BUILD_DEGRADE_READINESS:-true}
      BUILD_UNLOAD_DURING_BUILD: ${BUILD_UNLOAD_DURING_BUILD:-false}
      BUILD_STATE_PATH: ${BUILD_STATE_PATH:-/app/microservice/triton_model_repo/.engine-build.json}
      BUILD_STATE_MAX_AGE: ${BUILD_STATE_MAX_AGE:-3600}
      DEPLOYMENT_STATE_PATH: ${DEPLOYMENT_STATE_PATH:-/app/microservice/triton_model_repo/.deployment-state.json}
      DEPLOYMENT_STATE_TTL: ${DEPLOYMENT_STATE_TTL:-1.0}
      DEPLOYMENT_STATE_MAX_AGE: ${DEPLOYMENT_STATE_MAX_AGE:-0}
      TRITON_URL: aoi-inference-triton:8001
    volumes:
    - aoi-inference-model-repository:/app/microservice/triton_model_repo:ro
    - aoi-inference-references:/app/references
    - aoi-inference-service-state:/app/state
    - aoi-inference-job-data:/app/data
    depends_on:
      aoi-inference-triton:
        condition: service_healthy
      aoi-inference-api-wait-for-aoi-inference-triton:
        condition: service_completed_successfully
    networks:
    - app-network
    restart: always
    deploy:
      replicas: 8
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:5000/v1/health
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 150s
    user: 1000:1000
    group_add:
    - '2000'
    init: true
  aoi-inference:
    image: haproxy:3.0-alpine
    container_name: aoi-inference
    environment: {}
    ports:
    - ${AOI_INFERENCE_PORT:-5000}:5000
    depends_on:
      aoi-inference-api:
        condition: service_healthy
      aoi-inference-triton:
        condition: service_healthy
    networks:
    - app-network
    restart: always
    healthcheck:
      test:
      - CMD
      - sh
      - -c
      - kill -0 1
      interval: 10s
      timeout: 5s
      retries: 3
    configs:
    - source: bb-http-proxy-aoi-inference-5b925249-cfg
      target: /usr/local/etc/haproxy/haproxy.cfg
    init: true
volumes:
  aoi-inference-job-data:
    driver: local
    external: false
  aoi-inference-model-repository:
    driver: local
    external: false
  aoi-inference-references:
    driver: local
    external: false
  aoi-inference-service-state:
    driver: local
    external: false
networks:
  app-network:
    driver: bridge
    external: false
configs:
  bb-http-proxy-aoi-inference-5b925249-cfg:
    content: "global\n    log stdout format raw local0 info\n    maxconn 2048\n\ndefaults\n    mode http\n    log global\n\
      \    option httplog\n    option forwardfor\n    option redispatch\n    retries 3\n    timeout connect 5s\n    timeout\
      \ http-request 10s\n    timeout client 120s\n    timeout server 120s\n\nresolvers docker\n    nameserver dns 127.0.0.11:53\n\
      \    resolve_retries 3\n    timeout resolve 1s\n    timeout retry 1s\n    hold valid 10s\n\nfrontend fe_http\n    bind\
      \ :5000\n    maxconn 512\n    acl writes method POST PUT PATCH\n    acl chunked req.hdr(transfer-encoding) -m sub chunked\n\
      \    http-request return status 411 content-type \"text/plain\" string \"Length Required: chunked transfer-encoding\
      \ is not accepted for writes\\n\" if writes chunked\n    acl body_too_large req.hdr(content-length) -m int gt 268435456\n\
      \    http-request deny deny_status 413 if body_too_large\n    acl p_1_v1_model_routing path /v1/model-routing\n    acl\
      \ p_1_v1_model_routing path_beg /v1/model-routing/\n    use_backend bk_0_aoi_inference_triton if p_1_v1_model_routing\n\
      \    acl p_2_api_v1_model path /api/v1/model\n    acl p_2_api_v1_model path_beg /api/v1/model/\n    use_backend bk_0_aoi_inference_triton\
      \ if p_2_api_v1_model\n    acl p_0_v1_models path /v1/models\n    acl p_0_v1_models path_beg /v1/models/\n    use_backend\
      \ bk_0_aoi_inference_triton if p_0_v1_models\n    default_backend bk_1_aoi_inference_api\n\nbackend bk_0_aoi_inference_triton\n\
      \    balance roundrobin\n    option httpchk\n    http-check send meth GET uri /v1/ready\n    http-check expect status\
      \ 200\n    server aoi_inference_triton aoi-inference-triton:5000 check resolvers docker init-addr libc,none\n\nbackend\
      \ bk_1_aoi_inference_api\n    balance leastconn\n    option httpchk\n    http-check send meth GET uri /v1/health\n \
      \   http-check expect status 200\n    server-template aoi_inference_api 32 aoi-inference-api:5000 check maxconn 64 resolvers\
      \ docker init-addr libc,none\n"
