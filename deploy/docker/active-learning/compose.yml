# AOI active-learning stack: the four bundles under includes/ as one Compose
# project. The bundles do not run on their own (data-flywheel depends on
# backend-api, deft-service and aoi-inference from the other bundles), so bring
# them up through this file, from this directory:
#
#   docker compose --env-file .env.secrets up -d
#
# `include:` resolves each bundle's relative paths against that bundle's own
# directory, and its env_file supplies that bundle's defaults. Values from
# --env-file and the shell override those defaults. See README.md.

name: aoi-active-learning

include:
  - path: includes/deft-aoi-active-learning/compose.yml
    env_file: includes/deft-aoi-active-learning/.env.deft-aoi-active-learning
  - path: includes/deft-aoi-inference/compose.yml
    env_file: includes/deft-aoi-inference/.env.deft-aoi-inference
  - path: includes/deft-aoi-data-flywheel/compose.yml
    env_file: includes/deft-aoi-data-flywheel/.env.deft-aoi-data-flywheel
  - path: includes/deft-aoi-deft-service/compose.yml
    env_file: includes/deft-aoi-deft-service/.env.deft-aoi-deft-service
