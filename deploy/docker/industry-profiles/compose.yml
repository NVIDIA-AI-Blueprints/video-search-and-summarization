# Smart Cities keeps its environment overlay on the Alerts foundation, but its
# uniquely named services are included directly here. The launchable merges
# only the environment layers; it does not copy Compose or profile artifacts.
include:
  - path: ./warehouse-operations/compose.yml
  - path: ./smartcities/compose.yml
