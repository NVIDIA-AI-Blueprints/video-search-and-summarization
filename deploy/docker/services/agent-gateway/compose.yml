services:
  agent-gateway:
    image: ${VSS_AGENT_GATEWAY_IMAGE:-${VSS_CONTAINER_REGISTRY:-ghcr.io/nvidia-ai-blueprints/vss}/vss-agent-gateway}:${VSS_CONTAINER_TAG:-${VSS_AGENT_GATEWAY_TAG:-develop-latest}}
    build:
      context: ${VSS_AGENT_GATEWAY_BUILD_CONTEXT:-${VSS_APPS_DIR}/../../services/agent-gateway}
      dockerfile: ${VSS_AGENT_GATEWAY_DOCKERFILE:-Dockerfile}
    profiles: ["agent-gateway"]
    container_name: vss-agent-gateway
    restart: always
    # NemoClaw keeps its OpenClaw/Hermes API forward on host loopback. Host
    # networking lets this adapter reach that API without exposing the harness.
    # Bind the gateway itself to Docker's bridge gateway so only local
    # containers with the host-gateway mapping can dial it.
    network_mode: host
    environment:
      AGENT_GATEWAY_BIND_HOST: ${VSS_AGENT_GATEWAY_BIND_HOST:-127.0.0.1}
      AGENT_GATEWAY_PORT: ${VSS_AGENT_GATEWAY_PORT:-18090}
      AGENT_GATEWAY_TOKEN: ${VSS_AGENT_GATEWAY_TOKEN:-}
      AGENT_GATEWAY_ALLOW_INSECURE: ${VSS_AGENT_GATEWAY_ALLOW_INSECURE:-false}
      AGENT_BACKEND_PROTOCOL: ${VSS_AGENT_BACKEND_PROTOCOL:-responses}
      AGENT_BACKEND_URL: ${VSS_AGENT_BACKEND_URL:-}
      AGENT_BACKEND_PATH: ${VSS_AGENT_BACKEND_PATH:-}
      AGENT_BACKEND_TOKEN: ${VSS_AGENT_BACKEND_TOKEN:-}
      AGENT_BACKEND_MODEL: ${VSS_AGENT_BACKEND_MODEL:-agent}
      AGENT_BACKEND_SESSION_FIELD: ${VSS_AGENT_BACKEND_SESSION_FIELD:-user}
      AGENT_BACKEND_SESSION_HEADER: ${VSS_AGENT_BACKEND_SESSION_HEADER:-}
      AGENT_BACKEND_HEADERS_JSON: "${VSS_AGENT_BACKEND_HEADERS_JSON:-{}}"
      AGENT_BACKEND_TIMEOUT_SECONDS: ${VSS_AGENT_BACKEND_TIMEOUT_SECONDS:-900}
      AGENT_GATEWAY_RUN_RETENTION_SECONDS: ${VSS_AGENT_GATEWAY_RUN_RETENTION_SECONDS:-3600}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,os,urllib.request; h=os.environ.get('AGENT_GATEWAY_BIND_HOST','127.0.0.1'); h='127.0.0.1' if h in ('','0.0.0.0','::') else h; p=os.environ.get('AGENT_GATEWAY_PORT','18090'); assert json.load(urllib.request.urlopen(f'http://{h}:{p}/healthz', timeout=2))['status'] == 'ok'",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
