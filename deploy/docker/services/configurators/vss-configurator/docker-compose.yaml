# Centralized blueprint configurator (SDRC-style).
# Blueprint target paths (PROFILE_CONFIG_FILE, DS_CONFIG_DIR, NVSTREAMER_CONFIG_DIR,
# calibration) are injected via MODE-driven env vars from the active industry
# profile overrides.env; the tuning spec itself stays with the profile.
# Activate with COMPOSE_PROFILES including: bp-configurator-init,bp-configurator

services:
  bp-configurator-init:
    build:
      context: $VSS_APPS_DIR/services/infra
      dockerfile: Dockerfiles/${STREAM_TYPE}-health-check.Dockerfile
      network: host
    profiles: ["bp-configurator-init"]
    container_name: vss-configurator-init
    environment:
      BP_PROFILE: $BP_PROFILE
      STREAM_TYPE: $STREAM_TYPE
      MAX_RETRIES: 60
      RETRY_INTERVAL: 2
      BOOTSTRAP_HOST: ${STREAM_TYPE}
      KAFKA_PORT: 29092
      REDIS_PORT: 6379
      KAFKA_TOPICS: '[{"name": "mdx-raw"},
        {"name": "mdx-bev"},
        {"name": "mdx-space-utilization"},
        {"name": "mdx-alerts"},
        {"name": "mdx-behavior"},
        {"name": "mdx-behavior-plus"},
        {"name": "mdx-frames"},
        {"name": "mdx-mtmc"},
        {"name": "mdx-rtls"},
        {"name": "mdx-rtls-region-1"},
        {"name": "mdx-amr"},
        {"name": "mdx-vlm-alerts"},
        {"name": "mdx-notification"},
        {"name": "mdx-events"},
        {"name": "mdx-incidents"},
        {"name": "mdx-vlm-incidents"},
        {"name": "mdx-vlm"},
        {"name": "mdx-vlm-captions"},
        {"name": "mdx-structured-events-summary"},
        {"name": "mdx-embed"},
        {"name": "mdx-embed-filtered"}]'
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        if [ "$${BP_PROFILE}" = "bp_wh_auto_calib" ]; then
          echo "BP_PROFILE is bp_wh_auto_calib. Broker health check is not required"
        else
          exec /scripts/check-$${STREAM_TYPE}-health.sh
        fi

  bp-configurator:
    image: ${VSS_CONFIGURATOR_IMAGE:-nvcr.io/nvstaging/vss-core/vss-configurator}:${VSS_CONFIGURATOR_TAG:-3.3.0-2026.08.2-1}
    profiles: ["bp-configurator"]
    container_name: vss-configurator
    networks:
      default:
        aliases:
          - vss-configurator
    user: "0:0"
    environment:
      SENSOR_INFO_SOURCE: ${SENSOR_INFO_SOURCE:-nvstreamer}
      ENABLE_PROFILE_CONFIGURATOR: ${ENABLE_PROFILE_CONFIGURATOR:-true}
      ENABLE_SENSOR_CONFIGURATOR: ${ENABLE_SENSOR_CONFIGURATOR:-true}
      ENABLE_CALIBRATION_PROCESS: ${ENABLE_CALIBRATION_PROCESS:-false}
      ENABLE_REDIS_DUPLICATOR_THREAD: false
      CALL_SENSOR_ADD_API: true
      PROFILE_CONFIG_FILE: ${PROFILE_CONFIG_FILE}
      HARDWARE_PROFILE: $HARDWARE_PROFILE
      NUM_STREAMS: ${NUM_STREAMS:-4}
      MODE: $MODE
      LOG_LEVEL: INFO
      NVSTREAMER_STREAMS_ENDPOINT: http://${NVSTREAMER_IP}:${NVSTREAMER_HTTP_PORT}/api/v1/sensor/streams
      NVSTREAMER_SENSOR_STATUS_ENDPOINT: http://${NVSTREAMER_IP}:${NVSTREAMER_HTTP_PORT}/api/v1/sensor/status
      VST_CAMERA_ADD_ENDPOINT: http://${VST_IP}:${VST_PORT}/vst/api/v1/sensor/add
      CALIBRATION_MODE: mount
      CALIBRATION_DIR_MOUNT_PATH: /opt/data
      CALIBRATION_FILE_NAME: calibration.json
      PORT: 5001
      VSS_DATA_DIR: $VSS_DATA_DIR
      VSS_APPS_DIR: $VSS_APPS_DIR
      DS_CONFIG_DIR: ${DS_CONFIG_DIR}
      NVSTREAMER_CONFIG_DIR: ${NVSTREAMER_CONFIG_DIR}
      MESSAGE_BROKER_TYPE: $STREAM_TYPE
      WDM_REDIS_HOST: redis
      WDM_REDIS_PORT: 6379
      WDM_REDIS_STREAM_NAME: vst.event
      WDM_REDIS_MSG_KEY: value
      WDM_KFK_MSG_KEY: vst.event
      WDM_KFK_BOOTSTRAP_URL: kafka:29092
      WDM_KFK_TOPIC: mdx-notification
      WDM_WL_ID_FIELD: camera_id
      WDM_WL_EVENT_FIELD: event
      VST_ADAPTOR: ${VST_ADAPTOR:-vst_rtsp}
      ADAPTOR_IP: ${ADAPTOR_IP}
      ADAPTOR_USER: ${ADAPTOR_USER}
      ADAPTOR_PASSWORD: ${ADAPTOR_PASSWORD}
      RECOMPUTE_BEV_CENTERS_ENABLED: ${RECOMPUTE_BEV_CENTERS_ENABLED:-false}
      AI_BRIDGE_ENDPOINT: ${AI_BRIDGE_ENDPOINT}
      SENSOR_FILE_PATH: ${SENSOR_FILE_PATH}
      CHECK_SENSOR_IN_CALIBRATION_FILE: ${CHECK_SENSOR_IN_CALIBRATION_FILE:-false}
    env_file:
      - ${BP_CONFIGURATOR_BASE_ENV_FILE:-$VSS_APPS_DIR/industry-profiles/warehouse-operations/.env}
      - ${BP_CONFIGURATOR_ENV_FILE:-$VSS_APPS_DIR/industry-profiles/warehouse-operations/overrides.env}
    command:
      - python
      - -c
      - |
        import os
        import sys

        bp_profile = os.environ.get("BP_PROFILE", "")
        mode = os.environ.get("MODE", "2d")
        if bp_profile == "bp_wh_auto_calib" or mode == "2d":
            os.environ["SEND_CONFIG_TO_SDR"] = "false"
            os.environ["ENABLE_CALIBRATION_PROCESS"] = "false"
        else:
            os.environ["SEND_CONFIG_TO_SDR"] = "true"
            os.environ["ENABLE_CALIBRATION_PROCESS"] = "true"
        # Align mode-specific defaults (2d vs 3d/mv3dt).
        if mode == "2d":
            os.environ["RECOMPUTE_BEV_CENTERS_ENABLED"] = "false"
            os.environ["CHECK_SENSOR_IN_CALIBRATION_FILE"] = "false"
        else:
            os.environ["RECOMPUTE_BEV_CENTERS_ENABLED"] = "true"
            os.environ["CHECK_SENSOR_IN_CALIBRATION_FILE"] = "true"
        os.execvp(sys.executable, [sys.executable, "entrypoint.py"])
    volumes:
      - $VSS_APPS_DIR:$VSS_APPS_DIR:rw
      - $VSS_DATA_DIR:$VSS_DATA_DIR:rw
      # Default keeps non-warehouse compose resolution valid (same idea as
      # SDR_CONTROLLER_CONFIG_PATH:-"./configs"). Warehouse overrides.env always
      # sets BP_CALIBRATION_DATA_PATH before activating bp-configurator.
      - ${BP_CALIBRATION_DATA_PATH:-.}:/opt/data
    depends_on:
      bp-configurator-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:5001/readyz', timeout=3).getcode()==200 else sys.exit(1)"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
