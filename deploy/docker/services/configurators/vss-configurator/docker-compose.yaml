# Shared base for blueprint-specific vss-configurator services.
#
# Keep profile-specific names, networking aliases, warehouse paths, env_file,
# mode commands, calibration mounts, and depends_on in the extending service.
# Do not include this file directly; reference the *-base services with
# Compose `extends` (same pattern as services/vios/nvstreamer/compose.yml).

services:

  # Shared broker preflight used by the mode-specific warehouse configurators.
  # The generic auto-calibration configurator does not use this service.
  bp-configurator-init-base:
    build:
      context: $VSS_APPS_DIR/services/infra
      dockerfile: Dockerfiles/${STREAM_TYPE}-health-check.Dockerfile
      network: host
    environment:
      BP_PROFILE: $BP_PROFILE
      STREAM_TYPE: $STREAM_TYPE
      MAX_RETRIES: 60
      RETRY_INTERVAL: 2
      BOOTSTRAP_HOST: ${STREAM_TYPE}
      KAFKA_PORT: 29092
      REDIS_PORT: 6379
      KAFKA_TOPICS: '[{"name": "mdx-raw"},
        {"name": "mdx-bev"},
        {"name": "mdx-space-utilization"},
        {"name": "mdx-alerts"},
        {"name": "mdx-behavior"},
        {"name": "mdx-behavior-plus"},
        {"name": "mdx-frames"},
        {"name": "mdx-mtmc"},
        {"name": "mdx-rtls"},
        {"name": "mdx-rtls-region-1"},
        {"name": "mdx-amr"},
        {"name": "mdx-vlm-alerts"},
        {"name": "mdx-notification"},
        {"name": "mdx-events"},
        {"name": "mdx-incidents"},
        {"name": "mdx-vlm-incidents"},
        {"name": "mdx-vlm"},
        {"name": "mdx-vlm-captions"},
        {"name": "mdx-structured-events-summary"},
        {"name": "mdx-embed"},
        {"name": "mdx-embed-filtered"}]'
    entrypoint: ["/bin/bash", "-c"]
    command:
      - exec /scripts/check-$${STREAM_TYPE}-health.sh

  bp-configurator:
    image: ${VSS_CONFIGURATOR_IMAGE:-nvcr.io/nvstaging/vss-core/vss-configurator}:${VSS_CONFIGURATOR_TAG:-3.3.0-2026.08.2-1}
    user: "0:0"
    container_name: vss-configurator
    networks:
      default:
        aliases:
          - vss-configurator
    profiles: ["bp-configurator"]
    environment:
      SENSOR_INFO_SOURCE: ${SENSOR_INFO_SOURCE:-nvstreamer}
      # Calibration only registers NVStreamer streams with sensor-ms.
      ENABLE_PROFILE_CONFIGURATOR: "false"
      ENABLE_CALIBRATION_PROCESS: "false"
      SEND_CONFIG_TO_SDR: "false"
      CHECK_SENSOR_IN_CALIBRATION_FILE: "false"
      RECOMPUTE_BEV_CENTERS_ENABLED: "false"
      ENABLE_SENSOR_CONFIGURATOR: "true"
      ENABLE_REDIS_DUPLICATOR_THREAD: false
      CALL_SENSOR_ADD_API: true
      HARDWARE_PROFILE: $HARDWARE_PROFILE
      NUM_STREAMS: ${NUM_STREAMS:-4}
      MODE: $MODE
      LOG_LEVEL: INFO
      NVSTREAMER_STREAMS_ENDPOINT: http://${NVSTREAMER_IP}:${NVSTREAMER_HTTP_PORT}/api/v1/sensor/streams
      NVSTREAMER_SENSOR_STATUS_ENDPOINT: http://${NVSTREAMER_IP}:${NVSTREAMER_HTTP_PORT}/api/v1/sensor/status
      VST_CAMERA_ADD_ENDPOINT: http://${VST_IP}:${VST_PORT}/vst/api/v1/sensor/add
      PORT: 5001
      VSS_DATA_DIR: $VSS_DATA_DIR
      VSS_APPS_DIR: $VSS_APPS_DIR
    volumes:
      - $VSS_APPS_DIR:$VSS_APPS_DIR:rw
      - $VSS_DATA_DIR:$VSS_DATA_DIR:rw
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:5001/readyz', timeout=3).getcode()==200 else sys.exit(1)"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
