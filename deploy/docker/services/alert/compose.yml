services:
  alert-bridge:
    image: ${VSS_ALERT_IMAGE:-${VSS_CONTAINER_REGISTRY:-ghcr.io/nvidia-ai-blueprints/vss}/vss-alert-ms}:${VSS_CONTAINER_TAG:-${VSS_ALERT_TAG:-develop-latest}}
    container_name: vss-alert-bridge
    profiles: ["alert-bridge"]
    restart: unless-stopped
    # Shutdown is a chain of bounded waits, and Docker's 10s default cuts it
    # in the middle -- in-flight work is killed rather than finished.
    #
    # At the shipped alert_agent.processes: 1 there is no supervisor, and this
    # is the longer of the two paths:
    #   <=10s  terminate and join the API child
    #   <=15s  drain dispatch and sink work still in flight
    #    <=5s  close the event-loop HTTP and Elastic clients
    #   <=15s  stop the event-loop runtime (10s, then a 5s join)
    #     0    the revoke that leaving the group delivers -- it inherits the
    #          drain budget above rather than opening a second one
    # 45s bounded. Above one process the supervisor owns the timeline instead
    # -- drain T+15, terminate T+18, kill T+19, done T+20 -- and reaps the API
    # child inside it, so that path is shorter.
    #
    # 60s leaves margin. The webhook forwarder, the notifier pool and the sink
    # still close without a bound, and predate this, so no value is a promise.
    stop_grace_period: 60s
    ports:
      - ${ALERT_BRIDGE_HOST_PORT:-9080}:${ALERT_BRIDGE_PORT:-9080}
    environment:
      VLM_BASE_URL: ${VLM_BASE_URL:-http://rtvi-vlm:8000}
      VLM_NAME: ${VLM_NAME}
      # URL rewriting configuration
      EXTERNAL_IP: ${EXTERNAL_IP}
      INTERNAL_IP: ${HOST_IP}
      LLM_MODE: ${LLM_MODE} # remote / local / local_shared
      VLM_MODE: ${VLM_MODE} # remote / local / local_shared
      # Realtime REST API (restapi-realtime-alerts feature)
      RTVI_VLM_MODEL_TO_USE: ${RTVI_VLM_MODEL_TO_USE}
      RTVI_VLM_BASE_URL: ${RTVI_VLM_BASE_URL:-http://rtvi-vlm:8000}
      VST_INTERNAL_URL: ${VST_INTERNAL_URL:-http://vst-ingress:${VST_PORT:-30888}}
      ALERT_BRIDGE_PORT: ${ALERT_BRIDGE_PORT:-9080}
      CONFIG_PATH: /app/runtime/config.yml
      ALWAYS_ON_RULES_CONFIG: /app/configs/realtime-config.yml
      # Event bridge transports. Kafka is the default for both; set either to
      # redisStream to consume from / publish to a Redis instance you provide.
      # sinkType also accepts console for local debugging.
      ALERT_EVENT_SOURCE_TYPE: ${ALERT_EVENT_SOURCE_TYPE:-kafka}
      ALERT_EVENT_SINK_TYPE: ${ALERT_EVENT_SINK_TYPE:-kafka}
      # Transport for VLM-enhanced results: elastic (default) | kafka | redisStream | console
      ALERT_VLM_SINK_TYPE: ${ALERT_VLM_SINK_TYPE:-elastic}
      ALERT_REDIS_CONSUMER_GROUP: ${ALERT_REDIS_CONSUMER_GROUP:-alert-bridge-vlm-group}
      # Only read when a redisStream transport is selected above.
      #
      # REDIS_HOST has no default on purpose. It used to default to `redis`,
      # the bundled infra service, which meant selecting a redisStream
      # transport and forgetting to set the host silently attached a
      # deployment to this stack's own development Redis — a working pipeline
      # pointed at the wrong instance, which is worse than one that does not
      # start. Unset, the connection is refused at boot and the error names
      # the address it tried.
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      # Prefer REDIS_PASSWORD_FILE for anything but local use: it names a file
      # (a mounted secret) that is read at connect time, so the credential does
      # not have to live in the environment or the rendered config.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PASSWORD_FILE: ${REDIS_PASSWORD_FILE:-}
      # TLS for a customer-managed endpoint. Verification is on whenever TLS is
      # enabled; REDIS_SSL_CA_CERTS supplies a private CA, and leaving it unset
      # uses the image's system trust store.
      REDIS_SSL: ${REDIS_SSL:-}
      REDIS_SSL_CERT_REQS: ${REDIS_SSL_CERT_REQS:-required}
      REDIS_SSL_CA_CERTS: ${REDIS_SSL_CA_CERTS:-}
      # 0 means Alert MS never trims. The streams belong to your deployment,
      # and a MAXLEN on every publish makes ordinary output delete your own
      # older entries. Set a positive number to opt in.
      REDIS_STREAM_MAXLEN: ${REDIS_STREAM_MAXLEN:-0}
    volumes:
      - ${VLM_AS_VERIFIER_CONFIG_FILE_REALTIME:-/path/to/realtime-config.yml}:/app/configs/realtime-config.yml:ro
      - ${VLM_AS_VERIFIER_CONFIG_FILE:-/path/to/config.yml}:/app/configs/config.yml:ro
      - ${VLM_AS_VERIFIER_ALERT_TYPE_CONFIG_FILE:-/path/to/alert_type_config.json}:/app/alert_type_config.json:ro
      - $VSS_APPS_DIR/services/alert/scripts/env-substitute.py:/app/env-substitute.py:ro
    tmpfs:
      - /app/runtime:mode=1777,size=10M
    depends_on:
      # `required: false` only lifts alert-bridge's own hard dependency on the
      # kafka profiles, so this service can run against Redis alone. The
      # condition is untouched: when the kafka profile is active — which is the
      # default — startup is still gated on a healthy broker exactly as before.
      # Note this does not by itself make the whole Alerts profile Kafka-free;
      # peers such as perception-alerts still require kafka-topic-init-container.
      kafka:
        condition: service_healthy
        required: false
      elasticsearch:
        condition: service_healthy
      kafka-topic-init-container:
        condition: service_completed_successfully
        required: false
      redis:
        condition: service_started
        required: false
      nvstreamer-alerts:
        condition: service_started
        required: false
      cosmos-reason1-7b:
        condition: service_healthy
        required: false
      cosmos-reason1-7b-shared-gpu:
        condition: service_healthy
        required: false
      cosmos-reason2-8b:
        condition: service_healthy
        required: false
      cosmos-reason2-8b-shared-gpu:
        condition: service_healthy
        required: false
      cosmos3-reasoner:
        condition: service_healthy
        required: false
      cosmos3-reasoner-shared-gpu:
        condition: service_healthy
        required: false
      qwen3-vl-8b-instruct:
        condition: service_healthy
        required: false
      qwen3-vl-8b-instruct-shared-gpu:
        condition: service_healthy
        required: false
      rtvi-vlm:
        condition: service_healthy
        required: false
    entrypoint: 
      - /usr/local/bin/python
      - /app/env-substitute.py
      - --source
      - /app/configs/config.yml
      - --output
      - /app/runtime/config.yml
      - --
    command: ["/usr/local/bin/python", "enhance_alert_with_vlm.py", "--config", "/app/runtime/config.yml"]


