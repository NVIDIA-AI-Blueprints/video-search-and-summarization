services:
  alert-bridge:
    image: ${VSS_ALERT_IMAGE:-${VSS_CONTAINER_REGISTRY:-ghcr.io/nvidia-ai-blueprints/vss}/vss-alert-ms}:${VSS_CONTAINER_TAG:-${VSS_ALERT_TAG:-develop-latest}}
    container_name: vss-alert-bridge
    profiles: ["alert-bridge"]
    restart: unless-stopped
    # Shutdown is a chain of bounded waits, and Docker's 10s default cuts it
    # in the middle -- in-flight work is killed rather than finished.
    #
    # At the shipped alert_agent.processes: 1 there is no supervisor, and this
    # is the longer of the two paths:
    #   <=10s  terminate and join the API child
    #   <=15s  drain dispatch and sink work still in flight
    #    <=5s  close the event-loop HTTP and Elastic clients
    #   <=15s  stop the event-loop runtime (10s, then a 5s join)
    #     0    the revoke that leaving the group delivers -- it inherits the
    #          drain budget above rather than opening a second one
    # 45s bounded. Above one process the supervisor owns the timeline instead
    # -- drain T+15, terminate T+18, kill T+19, done T+20 -- and reaps the API
    # child inside it, so that path is shorter.
    #
    # 60s leaves margin. The webhook forwarder, the notifier pool and the sink
    # still close without a bound, and predate this, so no value is a promise.
    stop_grace_period: 60s
    ports:
      - ${ALERT_BRIDGE_HOST_PORT:-9080}:${ALERT_BRIDGE_PORT:-9080}
    environment:
      VLM_BASE_URL: ${VLM_BASE_URL:-http://rtvi-vlm:8000}
      VLM_NAME: ${VLM_NAME}
      # URL rewriting configuration
      EXTERNAL_IP: ${EXTERNAL_IP}
      INTERNAL_IP: ${HOST_IP}
      LLM_MODE: ${LLM_MODE} # remote / local / local_shared
      VLM_MODE: ${VLM_MODE} # remote / local / local_shared
      # Realtime REST API (restapi-realtime-alerts feature)
      RTVI_VLM_MODEL_TO_USE: ${RTVI_VLM_MODEL_TO_USE}
      RTVI_VLM_BASE_URL: ${RTVI_VLM_BASE_URL:-http://rtvi-vlm:8000}
      VST_INTERNAL_URL: ${VST_INTERNAL_URL:-http://vst-ingress:${VST_PORT:-30888}}
      ALERT_BRIDGE_PORT: ${ALERT_BRIDGE_PORT:-9080}
      CONFIG_PATH: /app/runtime/config.yml
      ALWAYS_ON_RULES_CONFIG: /app/configs/realtime-config.yml
      # OpenTelemetry tracing. Off unless explicitly enabled, so a
      # deployment that sets nothing behaves exactly as it does today - the
      # service never opens a connection to the endpoint below.
      #
      # OTEL_* variables have to be enumerated: Compose passes only what is
      # listed here, and this service has no env_file, so anything unlisted is
      # unreachable no matter what the operator exports. An earlier version of
      # this comment claimed the SDK's own auto-configuration would pick them
      # up - true of the SDK, false of the container it runs in.
      #
      # Enumerated are the ones the service actually reads. OTEL_METRICS_EXPORTER
      # in particular is the documented mitigation in src/tracing/meters.py for a
      # dead collector blocking ~7s at exit against docker stop's 10s grace; it
      # has to be reachable for that to be advice rather than trivia.
      #
      # Two are deliberately absent rather than forgotten: request-header capture
      # stays unset because arbitrary headers must not reach spans, and
      # OTEL_SEMCONV_STABILITY_OPT_IN is pinned by init_tracing() itself, with
      # setdefault, so the caller user-agent attribute keeps a stable name and
      # an operator who does set it still wins.
      ENABLE_OTEL_MONITORING: ${ALERT_ENABLE_OTEL_MONITORING:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${ALERT_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      OTEL_SERVICE_NAME: ${ALERT_OTEL_SERVICE_NAME:-vss-alert-ms}
      OTEL_RESOURCE_ATTRIBUTES: ${ALERT_OTEL_RESOURCE_ATTRIBUTES:-}
      OTEL_TRACES_EXPORTER: ${ALERT_OTEL_TRACES_EXPORTER:-otlp}
      # Falls back to the traces setting, mirroring the chain in
      # src/tracing/meters.py. Enumerating both with independent defaults
      # made OTEL_METRICS_EXPORTER always explicitly 'otlp', so the chain
      # could never fire and setting ALERT_OTEL_TRACES_EXPORTER=none --
      # the documented lever for a dead collector blocking shutdown --
      # silenced traces while metrics kept retrying OTLP. Not ':-' with an
      # empty default: Compose renders '' and meters.py reads '' as off.
      OTEL_METRICS_EXPORTER: ${ALERT_OTEL_METRICS_EXPORTER:-${ALERT_OTEL_TRACES_EXPORTER:-otlp}}
      OTEL_METRIC_EXPORT_INTERVAL: ${ALERT_OTEL_METRIC_EXPORT_INTERVAL:-60000}
      OTEL_METRIC_EXPORT_TIMEOUT: ${ALERT_OTEL_METRIC_EXPORT_TIMEOUT:-5000}
      # The SDK leaves this unlimited, and span attributes carry
      # producer-controlled fields; see src/tracing/attributes.py.
      OTEL_ATTRIBUTE_VALUE_LENGTH_LIMIT: ${ALERT_OTEL_ATTRIBUTE_VALUE_LENGTH_LIMIT:-4096}
    volumes:
      - ${VLM_AS_VERIFIER_CONFIG_FILE_REALTIME:-/path/to/realtime-config.yml}:/app/configs/realtime-config.yml:ro
      - ${VLM_AS_VERIFIER_CONFIG_FILE:-/path/to/config.yml}:/app/configs/config.yml:ro
      - ${VLM_AS_VERIFIER_ALERT_TYPE_CONFIG_FILE:-/path/to/alert_type_config.json}:/app/alert_type_config.json:ro
      - $VSS_APPS_DIR/services/alert/scripts/env-substitute.py:/app/env-substitute.py:ro
    tmpfs:
      - /app/runtime:mode=1777,size=10M
    depends_on:
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      kafka-topic-init-container:
        condition: service_completed_successfully
      nvstreamer-alerts:
        condition: service_started
        required: false
      cosmos-reason1-7b:
        condition: service_healthy
        required: false
      cosmos-reason1-7b-shared-gpu:
        condition: service_healthy
        required: false
      cosmos-reason2-8b:
        condition: service_healthy
        required: false
      cosmos-reason2-8b-shared-gpu:
        condition: service_healthy
        required: false
      cosmos3-reasoner:
        condition: service_healthy
        required: false
      cosmos3-reasoner-shared-gpu:
        condition: service_healthy
        required: false
      qwen3-vl-8b-instruct:
        condition: service_healthy
        required: false
      qwen3-vl-8b-instruct-shared-gpu:
        condition: service_healthy
        required: false
      rtvi-vlm:
        condition: service_healthy
        required: false
    entrypoint: 
      - /usr/local/bin/python
      - /app/env-substitute.py
      - --source
      - /app/configs/config.yml
      - --output
      - /app/runtime/config.yml
      - --
    command: ["/usr/local/bin/python", "enhance_alert_with_vlm.py", "--config", "/app/runtime/config.yml"]


