# Bridge-network edge proxy (same routing model as helm/developer-profiles/*/vss-ingress-example*.yaml).
# Included from deploy/docker/compose.yml; starts when a matching profile is active (dev profiles +
# warehouse / smart cities / public safety 2d blueprints).

services:
  vss-haproxy-ingress:
    image: docker.io/library/haproxy:3.4.2-alpine
    profiles: ["vss-haproxy-ingress"]
    container_name: vss-haproxy-ingress
    ports:
      - ${HAPROXY_HOST_PORT:-7777}:${HAPROXY_PORT:-7777}
    restart: always
    ulimits:
      nofile:
        soft: 131072
        hard: 262144
    environment:
      ELASTICSEARCH_SERVICE_HOST: ${ELASTICSEARCH_SERVICE_HOST:-elasticsearch}
      ELASTICSEARCH_SERVICE_PORT: ${ELASTICSEARCH_SERVICE_PORT:-9200}
      RTVI_EMBED_SERVICE_HOST: ${RTVI_EMBED_SERVICE_HOST:-rtvi-embed}
      RTVI_EMBED_SERVICE_PORT: ${RTVI_EMBED_SERVICE_PORT:-8000}
      RTVI_CV_SERVICE_HOST: ${RTVI_CV_SERVICE_HOST:-vss-rtvi-cv}
      RTVI_CV_SERVICE_PORT: ${RTVI_CV_PORT:-9000}
      # 8000 is rtvi-vlm's container port. RTVI_VLM_PORT is the host-published
      # one (8018) and must not be used here -- haproxy reaches the service over
      # the compose network, where the published port does not apply.
      RTVI_VLM_SERVICE_HOST: ${RTVI_VLM_SERVICE_HOST:-rtvi-vlm}
      RTVI_VLM_SERVICE_PORT: ${RTVI_VLM_SERVICE_PORT:-8000}
      # BACKEND_PORT is lvs-server's container port, not BACKEND_HOST_PORT.
      LVS_SERVICE_HOST: ${LVS_SERVICE_HOST:-lvs-server}
      LVS_SERVICE_PORT: ${BACKEND_PORT:-38111}
      HAPROXY_PORT: ${HAPROXY_PORT:-7777}
      HAPROXY_HOST_PORT: ${HAPROXY_HOST_PORT:-7777}
      HAPROXY_BIND_ADDR: ${HAPROXY_BIND_ADDR:-*}
      HOST_IP: ${HOST_IP}
      EXTERNAL_IP: ${EXTERNAL_IP}
      VSS_PUBLIC_HOST: ${VSS_PUBLIC_HOST}
      VSS_PUBLIC_PORT: ${VSS_PUBLIC_PORT}
      VSS_UI_SERVICE_HOST: ${VSS_UI_SERVICE_HOST:-vss-ui}
      VSS_UI_PORT: ${VSS_UI_PORT:-3000}
      VSS_AGENT_SERVICE_HOST: ${VSS_AGENT_SERVICE_HOST:-vss-agent}
      VSS_AGENT_PORT: ${VSS_AGENT_PORT:-8000}
      VST_INGRESS_SERVICE_HOST: ${VST_INGRESS_SERVICE_HOST:-vst-ingress}
      VST_PORT: ${VST_INGRESS_HTTP_PORT:-${VST_PORT:-30888}}
      BEHAVIOR_ANALYTICS_SERVICE_HOST: ${BEHAVIOR_ANALYTICS_SERVICE_HOST:-vss-behavior-analytics}
      BEHAVIOR_ANALYTICS_PORT: ${BEHAVIOR_ANALYTICS_PORT:-8080}
      PERCEPTION_SDR_SERVICE_HOST: ${PERCEPTION_SDR_SERVICE_HOST:-vss-rtvi-cv-sdr}
      PERCEPTION_SDR_PORT: ${PERCEPTION_SDR_PORT:-4001}
      VSS_VA_MCP_SERVICE_HOST: ${VSS_VA_MCP_SERVICE_HOST:-vss-va-mcp}
      VSS_VA_MCP_PORT: ${VSS_VA_MCP_PORT:-9901}
      VIDEO_ANALYTICS_API_SERVICE_HOST: ${VIDEO_ANALYTICS_API_SERVICE_HOST:-vss-video-analytics-api}
      ALERT_BRIDGE_SERVICE_HOST: ${ALERT_BRIDGE_SERVICE_HOST:-alert-bridge}
      ALERT_BRIDGE_PORT: ${ALERT_BRIDGE_PORT:-9080}
      NVSTREAMER_HTTP_PORT: ${NVSTREAMER_HTTP_PORT:-31000}
      KIBANA_SERVICE_HOST: ${KIBANA_SERVICE_HOST:-kibana}
      KIBANA_PORT: ${KIBANA_PORT:-5601}
      PHOENIX_SERVICE_HOST: ${PHOENIX_SERVICE_HOST:-phoenix}
      PHOENIX_PORT: ${PHOENIX_PORT:-6006}
    volumes:
      - ./haproxy.cfg.template:/usr/local/etc/haproxy/haproxy.cfg:ro
