include:
  - path: ./haproxy/compose.yml

services:
  phoenix:
    container_name: phoenix
    image: 'arizephoenix/phoenix:14.15.0'
    profiles: ["bp_developer_base_2d"]
    environment:
      PHOENIX_WORKING_DIR: '/.phoenix/'
      PHOENIX_HOST_ROOT_PATH: '/phoenix'
    volumes:
    - phoenix-data:/.phoenix
    ports:
    - 6006:6006

  elasticsearch:
    build:
      context: $VSS_APPS_DIR/services/infra
      dockerfile: Dockerfiles/elasticsearch.Dockerfile
      network: "host"
    image: elasticsearch
    network_mode: "host"
    environment:
      ES_JAVA_OPTS: "-Xmx1024m -Xms256m"
      discovery.type: single-node
    profiles: ["bp_developer_base_2d"]
    volumes:
      - $VSS_APPS_DIR/services/infra/elk/elasticsearch/configs/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
      - mdx-elastic-data:/tmp/elastic/data:rw
      - mdx-elastic-logs:/tmp/elastic/logs:rw
    container_name: elasticsearch
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?local=false&wait_for_status=yellow&wait_for_events=normal&timeout=5s' | grep -q '\"timed_out\"[[:space:]]*:[[:space:]]*false'"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s

  elasticsearch-init-container:
    build:
      context: $VSS_APPS_DIR/services/infra
      dockerfile: Dockerfiles/elastic-init.Dockerfile
      network: "host"
    profiles: ["bp_developer_base_2d"]
    network_mode: "host"
    container_name: vss-elasticsearch-init
    environment:
      - BP_PROFILE=${BP_PROFILE}
      - ELASTICSEARCH_CONNECTION_MAX_ATTEMPTS=${ELASTICSEARCH_CONNECTION_MAX_ATTEMPTS:-20}
      - ELASTICSEARCH_ILM_MIN_AGE=${ELASTICSEARCH_ILM_MIN_AGE:-4h}
      - ELASTICSEARCH_RTVI_CV_EMBEDDINGS_DIM=${ELASTICSEARCH_RTVI_CV_EMBEDDINGS_DIM:-1536}
      - ELASTICSEARCH_VISION_LLM_EMBEDDINGS_DIM=${ELASTICSEARCH_VISION_LLM_EMBEDDINGS_DIM:-768}
    command: bash -c "
      /opt/mdx/init-scripts/elasticsearch-ilm-policy-creation.sh &&
      /opt/mdx/init-scripts/elasticsearch-template-creation.sh &&
      /opt/mdx/init-scripts/elasticsearch-ingest-pipeline-creation.sh
      "
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "on-failure:5"

  kibana:
    image: docker.elastic.co/kibana/kibana:9.3.3
    network_mode: "host"
    profiles: ["bp_developer_base_2d"]
    volumes:
      - $VSS_APPS_DIR/services/infra/elk/kibana/configs/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    container_name: kibana
    restart: always
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/kibana/api/status"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s

volumes:
  phoenix-data:
  mdx-elastic-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: $VSS_DATA_DIR/data_log/elastic/data
  mdx-elastic-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: $VSS_DATA_DIR/data_log/elastic/logs
