# The runnable, generic NVStreamer service. The
# mode-specific warehouse streamers extend it and override their own mounts,
# profile, and startup dependencies.

services:

  nvstreamer-base:
    image: ${VSS_NVSTREAMER_IMAGE:-nvcr.io/nvstaging/vss-core/vss-vios-nvstreamer}:${NVSTREAMER_IMAGE_TAG}
    user: "0:0"
    container_name: vss-vios-nvstreamer
    networks:
      default:
        aliases:
          - vss-vios-nvstreamer
    runtime: nvidia
    profiles: ["nvstreamer"]
    ports:
      - ${NVSTREAMER_HTTP_HOST_PORT:-31000}:${NVSTREAMER_HTTP_PORT:-31000}
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              device_ids: ["${RT_CV_DEVICE_ID:-0}"]
    volumes:
      - ${VSS_APPS_DIR}/services/vios/nvstreamer/configs/vst-config.json:/home/vst/vst_release/configs/vst_config.json
      - ${VSS_APPS_DIR}/services/vios/nvstreamer/configs/notification-config.json:/home/vst/vst_release/configs/notification_config.json
      - ${VSS_APPS_DIR}/services/vios/nvstreamer/configs/vst-storage.json:/home/vst/vst_release/configs/vst_storage.json
      - ${VSS_DATA_DIR}/videos/${SAMPLE_VIDEO_DATASET}:/tmp/nv_streamer/videos
      - ${VSS_APPS_DIR}/services/vios/scripts/user_additional_install.sh:/home/vst/vst_release/tools/user_additional_install.sh
    entrypoint: ["/bin/bash", "-c", "if [ \"$$NVSTREAMER_INSTALL_ADDITIONAL_PACKAGES\" = \"true\" ]; then /home/vst/vst_release/tools/user_additional_install.sh; fi && /home/vst/vst_release/tools/configure_nvstreamer_ui.sh && exec /home/vst/vst_release/launch_vst"]
    environment:
      - NVSTREAMER_INSTALL_ADDITIONAL_PACKAGES=${NVSTREAMER_INSTALL_ADDITIONAL_PACKAGES}
      - ADAPTOR=streamer
      - HTTP_PORT=${NVSTREAMER_HTTP_PORT}
      - NVSTREAMER_UI_BASE_PATH=${NVSTREAMER_UI_BASE_PATH:-}
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 2
