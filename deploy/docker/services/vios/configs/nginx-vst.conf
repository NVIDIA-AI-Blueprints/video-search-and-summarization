# VST ingress nginx config — direct mode (no SDR/Envoy/SDRC in the data path).
# Routes /vst/api/v1/* directly to vss-vios-streamprocessing on :30001. Used by
# profiles in direct mode (dev-profile-base, dev-profile-lvs when toggled).
#
# Sibling: nginx-vst-sdrc.conf (the variant that proxies via sdr-controller's
# embedded Envoy on :10000). Selected by VST_NGINX_MODE in the profile .env:
#   VST_NGINX_MODE=vst       -> this file (direct mode)
#   VST_NGINX_MODE=vst-sdrc  -> nginx-vst-sdrc.conf (SDR/scaling mode)
#   VST_NGINX_MODE=mms       -> nginx-mms.conf (MMS variant with SDR)

worker_processes auto;

error_log  stderr info;
pid        /tmp/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/nginx/client-body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    # Concise log format with essential debugging info
    log_format detailed '$remote_addr [$time_local] "$request" '
                       '$status $body_bytes_sent '
                       'rt:$request_time ut:$upstream_response_time '
                       'up:$upstream_addr';

    access_log /dev/stdout detailed;

    # Concise proxy debug format
    log_format proxy_debug '$remote_addr [$time_local] "$request" '
                          '$status rt:$request_time ut:$upstream_response_time '
                          'up:$upstream_addr us:$upstream_status';

    client_max_body_size 25G;

    # Every redirect nginx generates here must be RELATIVE.
    #
    # nginx absolutises a Location beginning with "/" into scheme://host:port/,
    # and the port it substitutes is this listener's (30888) rather than the one
    # the client actually reached. So the `return 301 /vst/` below answers a
    # request that arrived on the gateway with http://<Host>:30888/vst/ -- off
    # the gateway origin and onto an internal service port, which defeats the
    # point of a single front door. Where TLS terminates outside the deployment
    # that header is also plain http from an https page, so a browser blocks it
    # as mixed content on top of being unable to reach it.
    #
    # A relative Location resolves against the request URL (RFC 7231 7.1.2) and
    # is therefore correct on every origin without this server being told the
    # external scheme, host or port. Set at http level because it governs
    # nginx's directory-slash redirect as well as the explicit return above.
    #
    # port_in_redirect and server_name_in_redirect are deliberately not set:
    # nginx consults them only while building an absolute Location, so they are
    # unreachable with this off, and port_in_redirect alone still leaks the
    # scheme.
    absolute_redirect off;

    # WebSocket proxy settings
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 30888;

        set $cache_control_cacheable "public, max-age=3600";

        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # Return 404 for any /vst/api/ path that is not matched by the specific
        # proxy blocks defined below. This prevents the UI fallback from
        # serving index.html for unknown API routes.
        location ^~ /vst/api/ {
            return 404;
        }

        # Redirect /vst → /vst/ for proper relative asset resolution
        location = /vst {
            return 301 /vst/;
        }

        # Serve hashed JS/CSS/other static assets under /vst/assets/
        location /vst/assets/ {
            alias /vst-ui/assets/;
            # The alias path takes care of mapping; rely on default 404 handling
        }

        # Serve favicons under /vst/favicon/
        location /vst/favicon/ {
            alias /vst-ui/favicon/;
        }

        location /vst/dash/ {
            rewrite ^/vst/dash/(.*) /dash/$1 break;
            proxy_pass http://vss-vios-streamprocessing:30001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

        location /vst/ {
            # Serve the built React UI from the "vst-ui" folder
            # Adjust the path below if you mount the build somewhere else in the container
            alias /vst-ui/;

            # Default document
            index index.html;

            # Support client-side routing (hash or path based)
            try_files $uri $uri/ /vst/index.html;
        }

        # Route sensor APIs to vss-vios-sensor:30000
        location /vst/api/v1/sensor/ {
            # Enable detailed logging for this specific endpoint
            access_log /dev/stdout proxy_debug;

            rewrite ^/vst/api/v1/sensor/(.*) /api/v1/sensor/$1 break;
            proxy_pass http://vss-vios-sensor:30000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
        }

        location ~ ^/vst/api/v1/replay/stream/[^/]+/picture$ {
            rewrite ^/vst/api/v1/replay/(.*) /api/v1/replay/$1 break;
            proxy_pass http://vss-vios-streamprocessing:30001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;

            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            add_header Cache-Control "public, max-age=3600";
        }

        # Route all other v1 APIs to vss-vios-streamprocessing:30001
        # This catch-all must come after the sensor location block
        location /vst/api/v1/ {
            rewrite ^/vst/api/v1/(.*) /api/v1/$1 break;
            proxy_pass http://vss-vios-streamprocessing:30001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;

            # WebSocket specific settings
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Timeout settings
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Buffer settings for large files
            proxy_buffering off;
            proxy_request_buffering off;

            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

        # Route storage endpoint to vss-vios-streamprocessing:30001
        location /vst/storage/ {
            rewrite ^/vst/storage/(.*) /storage/$1 break;
            proxy_pass http://vss-vios-streamprocessing:30001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;

            # Timeout settings for large file downloads
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # Buffer settings for large files
            proxy_buffering off;
            proxy_request_buffering off;

            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            add_header Cache-Control "public, max-age=3600";
        }
    }
}
