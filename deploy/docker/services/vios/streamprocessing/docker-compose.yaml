    entrypoint: ["/bin/bash", "-c", "if [ \"${VST_INSTALL_ADDITIONAL_PACKAGES}\" = \"true\" ]; then /home/vst/vst_release/tools/user_additional_install.sh; fi && bash /home/vst/vst_release/tools/apply_turn_config.sh && exec /home/vst/vst_release/launch_vst"]
    environment:
      - VST_APT_MIRROR=${VST_APT_MIRROR:-}
      - VST_INSTALL_ADDITIONAL_PACKAGES=${VST_INSTALL_ADDITIONAL_PACKAGES}
      - CONTAINER_NAME=vss-vios-streamprocessing
      - ADAPTOR=${VST_ADAPTOR:-vst_rtsp}
      - HTTP_PORT=${STREAM_PROCESSOR_HTTP_PORT:-30001}
      - RTSP_SERVER_PORT=${RTSP_SERVER_PORT}
      - CENTRALIZE_DB_NAME=${CENTRALIZE_DB_NAME}
      - CENTRALIZE_DB_USERNAME=${CENTRALIZE_DB_USERNAME}
      - SENSOR_MODULE_ENDPOINT=${SENSOR_MODULE_ENDPOINT}
      - VST_INGRESS_ENDPOINT=${VST_INGRESS_ENDPOINT:-${VST_INTERNAL_IP:-vst-ingress:${VST_PORT:-30888}}/vst}
      - ENABLE_AGING_POLICY=true
      - VST_ENABLE_NOTIFICATION=${VST_ENABLE_NOTIFICATION:-${VST_USE_SDRC:-false}}
      - VST_VIDEO_STORAGE_SIZE_MB=${VST_VIDEO_STORAGE_SIZE_MB}
      - DEEPSTREAM_ENABLE_SENSOR_ID_EXTRACTION=1
      - VST_STATIC_TURNURL_LIST=${VST_STATIC_TURNURL_LIST:-}
      - TURN_USERNAME=${TURN_USERNAME:-}
      - TURN_PASSWORD_FILE=/run/secrets/vss-turn/turn-password
      - TURN_PUBLIC_HOST=${TURN_PUBLIC_HOST:-}
      - TURN_HOST_PORT=${TURN_HOST_PORT:-3478}
    volumes:
      - ${VST_CONFIG_PATH:-${VSS_APPS_DIR}/services/vios/configs}:/home/vst/vst_release/configs
      - ${VSS_APPS_DIR}/industry-profiles/warehouse-operations/warehouse-2d-app/vst/configs/vst_config.json:/home/vst/vst_release/configs/vst_config.json
      - ${VSS_APPS_DIR}/industry-profiles/warehouse-operations/warehouse-2d-app/vst/configs/notification_config.json:/home/vst/vst_release/configs/notification_config.json
      - ${VSS_APPS_DIR}/industry-profiles/warehouse-operations/warehouse-2d-app/deepstream/configs/ds-detector-labels.txt:/home/vst/vst_release/configs/labels.txt
      - ${VST_DATA_PATH}:/home/vst/vst_release/vst_data
      - ${VST_VIDEO_STORAGE_PATH}:/home/vst/vst_release/vst_video
      - ${CLIP_STORAGE_PATH}:/home/vst/vst_release/streamer_videos
      - ${VST_TEMP_FILES_PATH}:/home/vst/vst_release/webroot/temp_files
      - ${VSS_APPS_DIR}/services/vios/scripts/user_additional_install.sh:/home/vst/vst_release/tools/user_additional_install.sh
      - vss-turn-password:/run/secrets/vss-turn:ro
      - ${VSS_APPS_DIR}/services/vios/scripts/apply_turn_config.sh:/home/vst/vst_release/tools/apply_turn_config.sh:ro
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    restart: unless-stopped
    deploy:
      restart_policy:
        condition: always
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/${HTTP_PORT:-30001}'"]
      interval: 20s
      timeout: 10s
      retries: 75
      start_period: 20s
    depends_on:
      turnserver-init:
        condition: service_completed_successfully
      centralizedb:
        condition: service_healthy
      redis:
        condition: service_started

