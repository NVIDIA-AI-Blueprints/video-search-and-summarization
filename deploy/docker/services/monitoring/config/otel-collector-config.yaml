# Collector for the alert-path traces, ported from
# services/rtvi/rt-embed/configs/otel-collector-config.yaml. Every OTEL_*
# default already in this repo names `otel-collector:4318`; until now nothing
# answered on it.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  # OTel-sourced metrics are scraped from here rather than from the alert
  # service. AB's own /metrics endpoint is untouched: metrics/__init__.py
  # auto-sets PROMETHEUS_MULTIPROC_DIR, so :9081 serves a MultiProcessCollector
  # registry assembled from on-disk shards, and an in-process OTel reader would
  # register into a registry that endpoint never reads.
  #
  # Nothing shipped scrapes this today, and that is stated rather than implied:
  # the profile that can enable tracing (dev-profile-alerts) ships no prometheus,
  # and the profile family that ships prometheus (warehouse-operations) does not
  # ship the collector. The endpoint is here so the pairing works when an
  # operator deploys both -- see the commented-out job in
  # services/monitoring/config/prometheus.yml. Traces do not depend on any of
  # this; they reach Jaeger and Phoenix regardless.
  prometheus:
    endpoint: "0.0.0.0:8889"

  # Traces fan out to two backends rather than one.
  #
  # Jaeger is the trace UI: waterfall view, span search, the operator-facing
  # answer to "where did this alert spend its time".
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Phoenix already runs in the alerts profile and already holds vss-agent's
  # spans. Sending AB's there too is what lets one query span both, instead of
  # an operator reading agent traces in one UI and alert traces in another.
  # Phoenix's OTLP HTTP receiver is on its main port; the exporter appends
  # /v1/traces itself.
  otlphttp/phoenix:
    endpoint: http://phoenix:6006
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, otlphttp/phoenix]

    # Restored now that a MeterProvider exists. It was removed for a revision
    # because nothing produced into it, and a configured pipeline with a
    # published port and nothing behind it reads as a supported feature.
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
