# Concrete NVStreamer services, included by the blueprints that use them and
# selected through COMPOSE_PROFILES. The shared definition lives in base.yml.
#
# The variants differ only in which configuration directory they mount and
# which configurator they wait for; everything else comes from nvstreamer-base.
# NVStreamer needs no GPU, so there is no runtime or device reservation here.
#
# Every `profiles` here carries `!override` because `extends` merges sequences:
# without it each variant would also inherit the nvstreamer-base guard profile,
# and selecting nvstreamer-base would start all of them at once.
services:
  nvstreamer-2d:
    extends:
      file: base.yml
      service: nvstreamer-base
    profiles: !override ["nvstreamer-2d"]
    volumes:
      - ${NVSTREAMER_CONFIG_DIR}/vst-config.json:/home/vst/vst_release/configs/vst_config.json
      - ${VSS_DATA_DIR}/videos/${SAMPLE_VIDEO_DATASET}:/home/vst/vst_release/vst_data
    depends_on:
      bp-configurator-2d:
        condition: service_healthy

  nvstreamer-3d:
    extends:
      file: base.yml
      service: nvstreamer-base
    profiles: !override ["nvstreamer-3d"]
    volumes:
      - ${NVSTREAMER_CONFIG_DIR}/vst-config.json:/home/vst/vst_release/configs/vst_config.json
      - ${VSS_DATA_DIR}/videos/${SAMPLE_VIDEO_DATASET}:/home/vst/vst_release/vst_data
    depends_on:
      bp-configurator-3d:
        condition: service_healthy

  nvstreamer-mv3dt:
    extends:
      file: base.yml
      service: nvstreamer-base
    profiles: !override ["nvstreamer-mv3dt"]
    container_name: vss-vios-nvstreamer-mv3dt
    volumes:
      - ${NVSTREAMER_CONFIG_DIR}/vst-config.json:/home/vst/vst_release/configs/vst_config.json
      - ${VSS_DATA_DIR}/videos/${SAMPLE_VIDEO_DATASET}:/home/vst/vst_release/vst_data
    depends_on:
      bp-configurator-mv3dt:
        condition: service_healthy

  # Developer / smartcity variants. These carry no blueprint configuration of
  # their own beyond vst-config.json, which base.yml mounts from
  # NVSTREAMER_CONFIG_DIR.
  nvstreamer-alerts:
    extends:
      file: base.yml
      service: nvstreamer-base
    profiles: !override ["nvstreamer-alerts"]
    volumes:
      - ${NVSTREAMER_ALERTS_VIDEO_DIR:-${NVSTREAMER_VIDEO_DIR:-${VSS_DATA_DIR}}/videos/dev-profile-alerts}:/home/vst/vst_release/streamer_videos
      - ${VSS_DATA_DIR}/data_log/nvstreamer/vst_data:/home/vst/vst_release/vst_data
    depends_on:
      broker-health-check:
        condition: service_completed_successfully

  nvstreamer-lvs:
    extends:
      file: base.yml
      service: nvstreamer-base
    profiles: !override ["nvstreamer-lvs"]
    container_name: vss-vios-nvstreamer-lvs
    volumes:
      - ${VSS_DATA_DIR}/videos/dev-profile-lvs:/home/vst/vst_release/streamer_videos
      - ${VSS_DATA_DIR}/data_log/nvstreamer/vst_data:/home/vst/vst_release/vst_data
    depends_on:
      broker-health-check:
        condition: service_completed_successfully

  nvstreamer-2d-fusion:
    extends:
      file: base.yml
      service: nvstreamer-base
    profiles: !override ["nvstreamer-2d-fusion"]
    volumes:
      - ${VSS_DATA_DIR}/data_log/nvstreamer/vst_data:/home/vst/vst_release/vst_data
    depends_on:
      broker-health-check:
        condition: service_completed_successfully
