# Template-only NVStreamer definition, referenced through `extends`. This file
# is deliberately never listed in an `include:` block, so the service never
# joins a compose project and needs no guard profile to stay stopped. Keeping
# it separate also matters because `extends` copies `profiles`, so a guard here
# would leak into every service that extends it.
services:
  nvstreamer-base:
    image: ${VSS_NVSTREAMER_IMAGE:-${VSS_CONTAINER_REGISTRY:-ghcr.io/nvidia-ai-blueprints/vss}/vss-vios-nvstreamer}:${VSS_NVSTREAMER_TAG:-${VSS_CONTAINER_TAG:-develop-latest}}
    container_name: vss-vios-nvstreamer
    user: "0:0"
    entrypoint: ["/bin/bash", "-c", "if [ \"$$NVSTREAMER_INSTALL_ADDITIONAL_PACKAGES\" = \"true\" ]; then /home/vst/vst_release/tools/user_additional_install.sh; fi && /home/vst/vst_release/tools/configure_nvstreamer_ui.sh && exec /home/vst/vst_release/launch_vst"]
    ports:
      - ${NVSTREAMER_HTTP_HOST_PORT:-31000}:${NVSTREAMER_HTTP_PORT:-31000}
    networks:
      default:
        aliases:
          - vss-vios-nvstreamer
    environment:
      - VST_APT_MIRROR=${VST_APT_MIRROR:-}
      - NVSTREAMER_INSTALL_ADDITIONAL_PACKAGES=${NVSTREAMER_INSTALL_ADDITIONAL_PACKAGES}
      # Install from the shared APT cache (populated by vios-apt-cache-init in
      # the streamprocessing compose) instead of downloading. The ro mount and
      # the dependency below are inherited by every nvstreamer variant via
      # `extends`; the volume and init service share this project via `include`.
      - VST_APT_CACHE_DIR=/opt/apt-cache
      - ADAPTOR=streamer
      - HTTP_PORT=${NVSTREAMER_HTTP_PORT}
      - NVSTREAMER_UI_BASE_PATH=${NVSTREAMER_UI_BASE_PATH:-}
    volumes:
      # All three configs default to services/nvstreamer/configs. A blueprint
      # that needs different NVStreamer tuning points NVSTREAMER_CONFIG_DIR at
      # its own directory; notification and storage are the same everywhere
      # because NVStreamer publishes no notifications and owns no storage
      # backend.
      - ${NVSTREAMER_CONFIG_DIR:-${VSS_APPS_DIR}/services/nvstreamer/configs}/vst-config.json:/home/vst/vst_release/configs/vst_config.json
      - ${VSS_APPS_DIR}/services/nvstreamer/configs/notification-config.json:/home/vst/vst_release/configs/notification_config.json
      - ${VSS_APPS_DIR}/services/nvstreamer/configs/vst-storage.json:/home/vst/vst_release/configs/vst_storage.json
      - ${VSS_APPS_DIR}/services/vios/scripts/user_additional_install.sh:/home/vst/vst_release/tools/user_additional_install.sh
      - vios_apt_cache:/opt/apt-cache:ro
    depends_on:
      vios-apt-cache-init:
        condition: service_completed_successfully
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 2
