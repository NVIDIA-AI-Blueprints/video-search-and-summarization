services:
  dt-based-calibration:
    image: ${VSS_DT_BASED_CALIBRATION_IMAGE:-ghcr.io/nvidia-ai-blueprints/vss/dt-based-calibration}:${VSS_DT_BASED_CALIBRATION_TAG:-develop-latest}
    container_name: dt-based-calibration
    profiles: ["dt-based-calibration"]
    environment:
      - CARLA_HOST=${CARLA_HOST:-carla-server}
      - CARLA_PORT=${CARLA_PORT:-2000}
      - API_PORT=${API_PORT:-7865}
      - ACCURACY_PORT=${ACCURACY_PORT:-8000}
      - GRADIO_DEMO_SERVER_PORT=${GRADIO_FILE_UPLOAD_SERVER_PORT:-7860}
      - GRADIO_MANUAL_SERVER_PORT=${GRADIO_MANUAL_ASSITED_SERVER_PORT:-7861}
      - PYTHONUNBUFFERED=1
      - PGM_PATH=${PGM_PATH:-/opt/geoids/egm96-15.pgm}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
    ports:
      - "${DT_CALIBRATION_API_HOST_PORT:-7865}:7865"
      - "${DT_CALIBRATION_ACCURACY_HOST_PORT:-8000}:8000"
      - "${DT_CALIBRATION_FILE_UPLOAD_HOST_PORT:-7860}:7860"
      - "${DT_CALIBRATION_MANUAL_ASSITED_HOST_PORT:-7861}:7861"
      - "${DT_CALIBRATION_ROI_HOST_PORT:-8080}:8080"
    volumes:
      - ${VSS_DATA_DIR:-./output}/dt-based-calibration:/app/output
    restart: unless-stopped
