# VSS Orchestrator MCP Server
#
# Exposes nine tools:
#   vss_orchestrator__profiles - list all supported deployment profiles
#   vss_orchestrator__prereqs - run Docker/GPU prerequisite checks
#   vss_orchestrator__docker_generate - resolve env + compose YAML artifacts
#   vss_orchestrator__docker_read - fetch generated env/yaml by docker_compose_id
#   vss_orchestrator__docker_list - list docker container names
#   vss_orchestrator__docker_logs - fetch docker logs by container name
#   vss_orchestrator__docker_up - docker compose up -d --build --quiet-pull
#   vss_orchestrator__docker_down - docker compose down -v --remove-orphans
#   vss_orchestrator__docker_status - poll docker operation status/logs
#
# Start with:
#   nat mcp serve --config_file deploy/docker/scripts/vss_orchestrator_mcp_config.yml --port 9988
#
# Server listens at: http://localhost:9988/mcp, or https://... when
# ORCHESTRATOR_ENABLE_HTTPS=true (see the runner_class note below).

general:
  front_end:
    _type: mcp
    # TLS-capable worker. With ORCHESTRATOR_ENABLE_HTTPS=false (the default) it
    # behaves exactly like the stock NAT worker; with true it serves HTTPS using
    # ORCHESTRATOR_CERTFILE / ORCHESTRATOR_KEYFILE. Lives here rather than as a
    # --runner_class CLI flag so every launcher gets the toggle.
    runner_class: vss_agents.orchestrator.mcp_ssl_worker.SSLMCPWorker

function_groups:
  vss_orchestrator:
    mdx_data_dir: "~/video-search-and-summarization/.mdx_data"
    # Required output directory for docker_generate artifacts.
    output_dir: "~/video-search-and-summarization/.orchestrator-artifacts"
    # ----------------------------------------------------------------------------------------------------------------------------------------------------------------
    _type: vss_orchestrator
    # Absolute path to the deploy/docker root. Set HOST_IP separately via env
    # overrides in the docker_generate tool call, or pre-populate the selected profile .env.
    deployments_dir: "~/video-search-and-summarization/deploy/docker"
    # Absolute source compose yaml path.
    source_compose_yaml: "~/video-search-and-summarization/deploy/docker/compose.yml"
    # Absolute source profile env path. Supports {profile}.
    source_env: "~/video-search-and-summarization/deploy/docker/developer-profiles/dev-profile-{profile}/.env"
    # VSS_DATA_DIR base directory used by orchestrator (profile .env VSS_DATA_DIR is ignored).
    mdx_data_directories:
    - data_log/analytics_cache
    - data_log/calibration_toolkit
    - data_log/elastic/data
    - data_log/elastic/logs
    - data_log/kafka
    - data_log/redis/data
    - data_log/redis/log
    - data_log/vss_video_analytics_api
    - agent_eval/dataset
    - agent_eval/results
    - videos/dev-profile-alerts
    - models
    # NGC packages to download per profile. Each entry groups one package_ref
    # with the artifacts to extract from it (src = path inside the downloaded
    # package, out = destination under <mdx_data_dir>/models/).
    model_artifacts:
      search:
      - package_ref: "nvidia/tao/rtdetr_2d_warehouse:deployable_rn50_v1.0.2"
        artifacts:
        - src: "rtdetr_2d_warehouse_vdeployable_rn50_v1.0.2/rtdetr_warehouse_v1.0.2.fp16.onnx"  # yamllint disable-line rule:line-length
          out: "rtdetr_warehouse_v1.0.2.fp16.onnx"
          kind: "file"
      alerts:
      - package_ref: "nvidia/tao/trafficcamnet_transformer_lite:deployable_resnet50_v2.0"
        artifacts:
        - src: "trafficcamnet_transformer_lite_vdeployable_resnet50_v2.0/resnet50_trafficcamnet_rtdetr.fp16.onnx"  # yamllint disable-line rule:line-length
          out: "rtdetr-its/model_epoch_035.fp16.onnx"
          kind: "file"
      - package_ref: "nvidia/tao/mask_grounding_dino:mask_grounding_dino_swin_tiny_commercial_deployable_v2.1_wo_mask_arm"  # yamllint disable-line rule:line-length
        artifacts:
        - src: "mask_grounding_dino_vmask_grounding_dino_swin_tiny_commercial_deployable_v2.1_wo_mask_arm/mgdino_mask_head_pruned_dynamic_batch.onnx"  # yamllint disable-line rule:line-length
          out: "gdino/mgdino_mask_head_pruned_dynamic_batch.onnx"
          kind: "file"
    model_resolution:
      hardware:
        edge_profiles:
        - DGX-SPARK
        - IGX-THOR
        - AGX-THOR
        edge_allowed_profiles:
        - base
        - alerts
        edge_device_ids:
          llm: "0"
          vlm: "0"
          rt_vlm: "0"
          rt_cv: "0"
        # Keys define the set of supported hardware profiles.
        # Values are env overrides (empty/null = supported, no overrides).
        hardware_profiles:
          H100:
          L40S:
          RTXPRO4500BW:
            alerts:
              RTVI_VLLM_GPU_MEMORY_UTILIZATION: "0.8"
              RTVI_VLM_MAX_MODEL_LEN: "18000"
            lvs:
              RTVI_VLLM_GPU_MEMORY_UTILIZATION: "0.8"
              RTVI_VLM_MAX_MODEL_LEN: "18000"
          RTXPRO6000BW:
          GB300:
            # GB300 is SBSA/arm64. RT-VLM, RT-CV, RT-Embed and video
            # summarization ship their arm64 builds in the same GHCR
            # repositories as the x86 defaults, under an -sbsa tag suffix.
            # containers.env appends the suffix to whatever VSS_CONTAINER_TAG
            # selects, which keeps a release selectable -- pinning the four
            # tags here would not, and would mix an -sbsa develop build into a
            # deployment that asked for a release.
            #
            # Inert on its own: Compose reads the derived tags from its process
            # environment, where containers.env was sourced without a suffix,
            # and that beats the generated env file this lands in. The suffix
            # has to be exported before that sourcing to take effect.
            VSS_CONTAINER_TAG_SUFFIX: "-sbsa"
            # vLLM claims the whole fraction whether it needs it or not and
            # refuses to start unless free >= fraction x total, so the 0.4 used
            # on 80-96 GiB cards would hand RT-VLM ~100 GiB of GB300's ~250 GiB
            # and leave the co-resident LLM below its own fraction. 0.3 still
            # gives RT-VLM ~75 GiB.
            RTVI_VLLM_GPU_MEMORY_UTILIZATION: "0.3"
            RTVI_VLLM_ATTENTION_BACKEND: TRITON_ATTN
            # One GPU shared by every model service. The profile .env files pin
            # multi-GPU layouts (search puts the LLM on 1, RT-CV on 0 and
            # RT-Embed on 1), which is a hard startup failure on a single-device
            # host, and leaving LLM/VLM on separate devices also loses the
            # local_shared placement that co-locating them implies. A GB300 at a
            # non-zero index needs these passed as docker_generate env_overrides.
            LLM_DEVICE_ID: "0"
            VLM_DEVICE_ID: "0"
            SHARED_LLM_VLM_DEVICE_ID: "0"
            FIXED_SHARED_DEVICE_IDS: "0"
            RT_CV_DEVICE_ID: "0"
            RT_EMBED_DEVICE_ID: "0"
            alerts:
              RTVI_VLLM_GPU_MEMORY_UTILIZATION: "0.2"
          OTHER:
          DGX-SPARK:
            # SBSA/arm64 like GB300: same suffix, same caveat about when it
            # takes effect. Covers all four suffixed images rather than the
            # RT-VLM and RT-CV tags this used to pin, since the suffix is
            # applied by containers.env per image, not per hardware profile.
            VSS_CONTAINER_TAG_SUFFIX: "-sbsa"
            base:
              VLM_NIM_KVCACHE_PERCENT: "0.2"
            # One value for every alerts mode: the 0.4 local_shared fraction
            # used elsewhere leaves too little of Spark's 128 GB unified pool
            # once the LLM and RT-CV are resident, and 0.35 is the most RT-VLM
            # can claim there. The old per-mode 0.25/0.3 split was #477
            # bring-up tuning that nothing else reproduces.
            alerts:
              RTVI_VLLM_GPU_MEMORY_UTILIZATION: "0.35"
          IGX-THOR:
            VLM_NAME_SLUG: none
            VLM_NAME: nim_nvidia_cosmos3-nano-reasoner_bf16-final
            RTVI_VLM_MODEL_PATH: ngc:nim/nvidia/cosmos3-nano-reasoner:bf16-final
            RTVI_VLM_MODEL_TO_USE: cosmos-reason3
            RTVI_VLLM_GPU_MEMORY_UTILIZATION: "0.35"
            VLM_MODEL_TYPE: rtvi
          AGX-THOR:
            VLM_NAME_SLUG: none
            VLM_NAME: nim_nvidia_cosmos3-nano-reasoner_bf16-final
            RTVI_VLM_MODEL_PATH: ngc:nim/nvidia/cosmos3-nano-reasoner:bf16-final
            RTVI_VLM_MODEL_TO_USE: cosmos-reason3
            RTVI_VLLM_GPU_MEMORY_UTILIZATION: "0.35"
            VLM_MODEL_TYPE: rtvi
    profile_mode_to_env_modes:
      alerts:  # must set modes below for profile that has modes
        verification: 2d_cv
        real-time: 2d_vlm
    include:
    - profiles
    - prereqs
    - docker_generate
    - docker_read
    - docker_list
    - docker_logs
    - docker_up
    - docker_down
    - docker_status

llms:
  nim_llm:
    _type: nim
    model_name: meta/llama-3.1-70b-instruct
    temperature: 0.0
    max_tokens: 1024

# dummy workflow required to start MCP server
workflow:
  _type: react_agent
  tool_names: [vss_orchestrator]
  llm_name: nim_llm
