# Perf overlay for dev-profile-alerts in verification mode (MODE=2d_cv).
#
# Not a standalone stack. perf/scripts/deploy.sh runs, from deploy/docker:
#
#   docker compose -f compose.yml -f <this file> \
#     --env-file containers.env \
#     --env-file developer-profiles/dev-profile-alerts/.env \
#     --env-file developer-profiles/dev-profile-alerts/generated.env \
#     --env-file $PERF_WORK_DIR/perf-runtime.env \
#     up -d
#
# It only adds what a measurement needs and the shipped profile leaves off:
#   - Alert Bridge Prometheus endpoint + a Prometheus to scrape it
#   - the promoted alert image (PERF_ALERT_IMAGE) instead of the default tag
#   - raised nofile limits for high stream counts
#   - perf copies of the verifier config and DeepStream configs, generated by
#     perf/setup/scripts/prepare_runtime.py (tracked files are never edited)
#
# Relative paths would resolve against deploy/docker (the first -f file), so
# every path here is absolute via PERF_DIR / PERF_WORK_DIR.

services:
  alert-bridge:
    image: ${PERF_ALERT_IMAGE:-${VSS_ALERT_IMAGE:-${VSS_CONTAINER_REGISTRY:-ghcr.io/nvidia-ai-blueprints/vss}/vss-alert-ms}:${VSS_CONTAINER_TAG:-${VSS_ALERT_TAG:-develop-latest}}}
    environment:
      PROMETHEUS_METRICS_ENABLED: ${PROMETHEUS_METRICS_ENABLED:-true}
      PROMETHEUS_PORT: 9081
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  perception-alerts:
    ulimits:
      nofile:
        soft: 100000
        hard: 100000
    volumes:
      # Same container target as dev-profile-alerts/compose.yml, so Compose
      # replaces that mount with the perf copy instead of adding a second one.
      - ${PERF_WORK_DIR:?PERF_WORK_DIR must be set}/deepstream-configs/:/opt/nvidia/deepstream/deepstream/sources/apps/sample_apps/metropolis_perception_app/mounted-configs/:ro

  perf-prometheus:
    image: quay.io/prometheus/prometheus:v3.11.3
    container_name: vss-perf-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=6h"
      - "--web.listen-address=:9090"
    ports:
      - ${PERF_PROMETHEUS_HOST_PORT:-9091}:9090
    volumes:
      - ${PERF_DIR:?PERF_DIR must be set}/setup/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      alert-bridge:
        condition: service_started
    restart: unless-stopped
