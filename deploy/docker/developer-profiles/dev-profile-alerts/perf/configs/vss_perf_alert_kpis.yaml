        live_streams_warehouse-ladder-1080p-10fps_30streams: 9.83
        live_streams_warehouse-ladder-1080p-10fps_50streams: 80.38
      rtxpro6000-2-cv1-vlm1-rtdetr-cr3-bf16:
        live_streams_warehouse-ladder-1080p-10fps_1streams: 0.99
        live_streams_warehouse-ladder-1080p-10fps_20streams: 2.49
        live_streams_warehouse-ladder-1080p-10fps_30streams: 4.88
        live_streams_warehouse-ladder-1080p-10fps_50streams: 13.08
      spark-1-rtdetr-cr3-bf16:
        live_streams_warehouse-ladder-1080p-10fps_1streams: 2.21
