        live_streams_warehouse-ladder-1080p-10fps_1streams: 0.51
        live_streams_warehouse-ladder-1080p-10fps_20streams: 1.44
        live_streams_warehouse-ladder-1080p-10fps_30streams: 1.95
        live_streams_warehouse-ladder-1080p-10fps_50streams: 4.62
      spark-1-rtdetr-cr3-bf16:
        live_streams_warehouse-ladder-1080p-10fps_1streams: 0.95
      spark-1-rtdetr-cr3-nvfp4:
        live_streams_warehouse-ladder-1080p-10fps_1streams: 0.82

  # -- Secondary ------------------------------------------------------------------
  - name: e2e_p99_latency
    description: "E2E P99 latency (s)"
    path: test_cases[*].metrics.latency.e2e_p99_seconds
    unit: s
    direction: lower
    aggregation: max
    optional: true
    dashboard: {chart: secondary}
    thresholds: {warning_percent: 10, critical_percent: 20}
    baselines:
      h100-2-cv1-vlm1-rtdetr-cr3-bf16:
        live_streams_warehouse-ladder-1080p-10fps_1streams: 0.99
        live_streams_warehouse-ladder-1080p-10fps_20streams: 6.37
        live_streams_warehouse-ladder-1080p-10fps_30streams: 9.96
        live_streams_warehouse-ladder-1080p-10fps_50streams: 85.41
      h100-2-cv1-vlm1-rtdetr-cr3-fp8:
        live_streams_warehouse-ladder-1080p-10fps_1streams: 0.99
