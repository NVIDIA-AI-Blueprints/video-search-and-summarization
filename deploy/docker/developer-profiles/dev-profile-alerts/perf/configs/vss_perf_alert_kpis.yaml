  - name: verified_per_min_per_stream
    description: "Verified alerts per minute per stream"
    path: test_cases[*].metrics.throughput.verified_per_min_per_stream
    unit: alerts/min
    direction: higher
    aggregation: min
    dashboard: {chart: secondary, trend: true}
    thresholds: {warning_percent: 10, critical_percent: 20}
    baselines:
      h100-2-cv1-vlm1-rtdetr-cr3-bf16:
