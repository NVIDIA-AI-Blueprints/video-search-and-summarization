    path: test_cases[*].metrics.latency.vst_p90_seconds
    unit: s
    direction: lower
    aggregation: avg
    optional: true
    dashboard: {chart: secondary}
    thresholds: {warning_percent: 10, critical_percent: 20}
    baselines:
      h100-2-cv1-vlm1-rtdetr-cr3-bf16:
        live_streams_warehouse-ladder-1080p-10fps_1streams: 0.28
        live_streams_warehouse-ladder-1080p-10fps_20streams: 0.24
        live_streams_warehouse-ladder-1080p-10fps_30streams: 0.23
        live_streams_warehouse-ladder-1080p-10fps_50streams: 0.10
      h100-2-cv1-vlm1-rtdetr-cr3-fp8:
        live_streams_warehouse-ladder-1080p-10fps_1streams: 0.25
        live_streams_warehouse-ladder-1080p-10fps_20streams: 0.24
