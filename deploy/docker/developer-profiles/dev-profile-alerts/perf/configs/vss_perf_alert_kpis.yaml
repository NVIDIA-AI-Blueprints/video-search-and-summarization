# Alert verification (dev-profile-alerts, MODE=2d_cv) KPI definition.
#
# Same format as the other VSS perf KPI files (e.g. VIOS
# services/vios/test/bdd_tests/tests/perf/vss_perf_vst_kpis.yaml). Convert
# for the dashboard with vss_perf_kpi_export.py:
#   python services/vios/test/bdd_tests/tests/perf/vss_perf_kpi_export.py \
#       <this file> -o alert-verification_kpis.json [--upload]
#
# Baseline keys: config ids from perf-configs.yaml, then test_case_id values
# written by benchmark/core/vss_perf_benchmark.py:
#   live_streams_<video>_<N>streams
#
# Initial baselines are taken from docs/performance-alert-verification.mdx
# (VSS 3.3, RT-DETR + Cosmos3 Nano Reasoner, 1080p H.264 at 10 fps). They were
# measured with the eval framework, not this harness, so replace them with the
# first CI results once a few runs have landed on the dashboard.
service: alert-verification
schema_version: "0.0.1"

# ---------------------------------------------------------------------------
# Platform configs (ids must match perf-configs.yaml)
# ---------------------------------------------------------------------------
platform_configs:
  - platform:
      gpu: {model: "H100", count: 2}
    config:
      - id: h100-2-cv1-vlm1-rtdetr-cr3-bf16
        gpu_topology: "cv1-vlm1"
        vlm: "cosmos3-nano-reasoner-bf16"
      - id: h100-2-cv1-vlm1-rtdetr-cr3-fp8
        gpu_topology: "cv1-vlm1"
        vlm: "cosmos3-nano-reasoner-fp8"

  - platform:
      gpu: {model: "RTX6000Pro", count: 2}
    config:
      - id: rtxpro6000-2-cv1-vlm1-rtdetr-cr3-bf16
        gpu_topology: "cv1-vlm1"
        vlm: "cosmos3-nano-reasoner-bf16"

  - platform:
      gpu: {model: "Spark", count: 1}
    config:
      - id: spark-1-rtdetr-cr3-bf16
        gpu_topology: "shared"
        vlm: "cosmos3-nano-reasoner-bf16"
      - id: spark-1-rtdetr-cr3-nvfp4
        gpu_topology: "shared"
        vlm: "cosmos3-nano-reasoner-nvfp4"

# ---------------------------------------------------------------------------
# KPIs
# ---------------------------------------------------------------------------
kpis:
  # -- Primary: E2E latency (incident end -> verdict) ---------------------------
  - name: e2e_p90_latency
    description: "E2E P90 latency, incident end to verdict (s)"
    path: test_cases[*].metrics.latency.e2e_p90_seconds
    unit: s
    direction: lower
    aggregation: avg
    dashboard: {chart: primary, trend: true, summary_stat: true}
    thresholds: {warning_percent: 10, critical_percent: 20}
    baselines:
      h100-2-cv1-vlm1-rtdetr-cr3-bf16:
        live_streams_warehouse-ladder-1080p-10fps_1streams: 0.90
        live_streams_warehouse-ladder-1080p-10fps_20streams: 4.66
        live_streams_warehouse-ladder-1080p-10fps_30streams: 8.62
        live_streams_warehouse-ladder-1080p-10fps_50streams: 52.56
      h100-2-cv1-vlm1-rtdetr-cr3-fp8:
        live_streams_warehouse-ladder-1080p-10fps_1streams: 0.90
        live_streams_warehouse-ladder-1080p-10fps_20streams: 4.48
        live_streams_warehouse-ladder-1080p-10fps_30streams: 8.22
        live_streams_warehouse-ladder-1080p-10fps_50streams: 52.17
      rtxpro6000-2-cv1-vlm1-rtdetr-cr3-bf16:
        live_streams_warehouse-ladder-1080p-10fps_1streams: 0.90
        live_streams_warehouse-ladder-1080p-10fps_20streams: 2.33
        live_streams_warehouse-ladder-1080p-10fps_30streams: 3.75
        live_streams_warehouse-ladder-1080p-10fps_50streams: 8.97
      spark-1-rtdetr-cr3-bf16:
        live_streams_warehouse-ladder-1080p-10fps_1streams: 0.94
      spark-1-rtdetr-cr3-nvfp4:
        live_streams_warehouse-ladder-1080p-10fps_1streams: 0.91

  - name: e2e_avg_latency
    description: "E2E average latency (s)"
    path: test_cases[*].metrics.latency.e2e_avg_seconds
    unit: s
    direction: lower
    aggregation: avg
    dashboard: {chart: primary, trend: true, summary_stat: true}
    thresholds: {warning_percent: 10, critical_percent: 20}
    baselines:
      h100-2-cv1-vlm1-rtdetr-cr3-bf16:
        live_streams_warehouse-ladder-1080p-10fps_1streams: 0.58
        live_streams_warehouse-ladder-1080p-10fps_20streams: 2.83
        live_streams_warehouse-ladder-1080p-10fps_30streams: 4.44
        live_streams_warehouse-ladder-1080p-10fps_50streams: 24.63
      h100-2-cv1-vlm1-rtdetr-cr3-fp8:
        live_streams_warehouse-ladder-1080p-10fps_1streams: 0.60
        live_streams_warehouse-ladder-1080p-10fps_20streams: 2.45
        live_streams_warehouse-ladder-1080p-10fps_30streams: 4.14
        live_streams_warehouse-ladder-1080p-10fps_50streams: 24.21
