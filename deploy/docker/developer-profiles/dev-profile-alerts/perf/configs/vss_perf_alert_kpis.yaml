    description: "VLM inference P90 latency (s)"
    path: test_cases[*].metrics.latency.vlm_p90_seconds
    unit: s
    direction: lower
    aggregation: avg
    dashboard: {chart: secondary, trend: true}
    thresholds: {warning_percent: 10, critical_percent: 20}
    baselines:
      h100-2-cv1-vlm1-rtdetr-cr3-bf16:
