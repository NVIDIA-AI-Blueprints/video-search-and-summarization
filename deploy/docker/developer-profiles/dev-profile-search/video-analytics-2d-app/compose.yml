services:

  vss-search-analytics-2d-fusion:
    extends:
      file: ${VSS_APPS_DIR}/services/analytics/behavior-analytics/compose.yml
      service: vss-behavior-analytics-base
    profiles: ["vss-search-analytics-2d-fusion"]
    volumes:
      - $VSS_APPS_DIR/developer-profiles/dev-profile-search/video-analytics-2d-app/vss-search-analytics/configs/vss-search-analytics-$STREAM_TYPE-config.json:/resources/vss-search-analytics-config.json
    container_name: vss-behavior-analytics
    networks:
      default:
        aliases:
          - vss-behavior-analytics
    command: python3 apps/search_and_alerts/main_search_and_alerts_app.py --config /resources/vss-search-analytics-config.json
    depends_on:
      broker-health-check:
        condition: service_completed_successfully

  vss-video-analytics-api-fusion:
    extends:
      file: $VSS_APPS_DIR/services/analytics/video-analytics-api/compose.yml
      service: vss-video-analytics-api
    profiles: ["vss-video-analytics-api-fusion"]
    container_name: vss-video-analytics-api
    networks:
      default:
        aliases:
          - vss-video-analytics-api
    depends_on:
      broker-health-check:
        condition: service_completed_successfully
      elasticsearch-init-container:
        condition: service_completed_successfully


  nvstreamer-2d-fusion:
    container_name: vss-vios-nvstreamer
    networks:
      default:
        aliases:
          - vss-vios-nvstreamer
    image: ${VSS_NVSTREAMER_IMAGE:-nvcr.io/nvstaging/vss-core/vss-vios-nvstreamer}:${NVSTREAMER_IMAGE_TAG}
    user: "0:0"
    #runtime: nvidia
    profiles: ["nvstreamer-2d-fusion"]
    entrypoint: ["/bin/bash", "-c", "if [ \"$$NVSTREAMER_INSTALL_ADDITIONAL_PACKAGES\" = \"true\" ]; then /home/vst/vst_release/tools/user_additional_install.sh; fi && /home/vst/vst_release/tools/configure_nvstreamer_ui.sh && exec /home/vst/vst_release/launch_vst"]
    environment:
      - NVSTREAMER_INSTALL_ADDITIONAL_PACKAGES=${NVSTREAMER_INSTALL_ADDITIONAL_PACKAGES}
      - ADAPTOR=streamer
      - HTTP_PORT=${NVSTREAMER_HTTP_PORT}
      - NVSTREAMER_UI_BASE_PATH=${NVSTREAMER_UI_BASE_PATH:-}
    ports:
      - ${NVSTREAMER_HTTP_HOST_PORT:-31000}:${NVSTREAMER_HTTP_PORT:-31000}
    deploy:
      restart_policy:
        condition: on-failure
        max_attempts: 2
      resources:
        reservations:
          devices:
          - capabilities: [gpu]
            device_ids: ["0"]
    volumes:    
      - $VSS_APPS_DIR/developer-profiles/dev-profile-search/video-analytics-2d-app/nvstreamer/configs/vst-config.json:/home/vst/vst_release/configs/vst_config.json
      - $VSS_APPS_DIR/developer-profiles/dev-profile-search/video-analytics-2d-app/nvstreamer/configs/notification-config.json:/home/vst/vst_release/configs/notification_config.json
      - $VSS_APPS_DIR/developer-profiles/dev-profile-search/video-analytics-2d-app/nvstreamer/configs/vst-storage.json:/home/vst/vst_release/configs/vst_storage.json
      - $VSS_DATA_DIR/data_log/nvstreamer/vst_data:/home/vst/vst_release/vst_data
    depends_on:
      broker-health-check:
        condition: service_completed_successfully

  perception-2d-fusion:
    extends:
      file: $VSS_APPS_DIR/services/rtvi/rtvi-cv/compose.yaml
      service: perception
    profiles: ["perception-2d-fusion"]
    container_name: vss-rtvi-cv
    volumes:
      # Config file mounts (read-only; canonical ds-start.sh stages mounted-configs -> configs)
      - $VSS_APPS_DIR/developer-profiles/dev-profile-search/video-analytics-2d-app/deepstream/configs/:/opt/nvidia/deepstream/deepstream/sources/apps/sample_apps/metropolis_perception_app/mounted-configs/:ro
      - $VSS_APPS_DIR/developer-profiles/dev-profile-search/video-analytics-2d-app/models-download.json:/opt/config/models-download.json:ro

      # Models directory — RT-DETR + vision encoder models (downloaded by ds-start phase 0)
      - $VSS_DATA_DIR/models/:/opt/storage/
    environment:
      GST_PLUGIN_PATH: /opt/nvidia/deepstream/deepstream/sources/gst-plugins/gst-nvdstextembedder
      TRANSFORMERS_OFFLINE: 0
      HF_HUB_OFFLINE: 0
      DS_MODE_FLAG: "1"
      DS_MODEL_FAMILY: rtdetr-warehouse
      DS_VISION_ENCODER: "true"
      DS_TRACKER_REID: "true"
      DS_SHOW_SENSOR_ID: "false"
      VISION_ENCODER_MODEL: ${VISION_ENCODER_MODEL:-siglip_v2}
      VISION_ENCODER_VERSION: ${VISION_ENCODER_VERSION:-v1.1}
      NGC_CLI_API_KEY: ${NGC_CLI_API_KEY}
      DS_MODEL_DOWNLOAD: auto
    depends_on:
      sensor-ms:
        condition: service_started
      broker-health-check:
        condition: service_completed_successfully


volumes:
  mdx-nvstreamer-data:        
  mdx-nvstreamer-videos:
