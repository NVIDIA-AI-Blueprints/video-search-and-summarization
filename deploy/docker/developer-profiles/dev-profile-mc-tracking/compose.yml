services:
  vss-behavior-analytics-mc-tracking:
    extends:
      file: ${VSS_APPS_DIR}/services/analytics/behavior-analytics/compose.yml
      service: vss-behavior-analytics-base
    profiles: ["vss-behavior-analytics-mc-tracking"]
    volumes:
      - $VSS_APPS_DIR/developer-profiles/dev-profile-mc-tracking/calibration/sample-data/$SAMPLE_VIDEO_DATASET/calibration.json:/resources/calibration.json
      - $VSS_APPS_DIR/developer-profiles/dev-profile-mc-tracking/vss-behavior-analytics/configs/vss-behavior-analytics-config.json:/resources/vss-behavior-analytics-config.json
    container_name: vss-behavior-analytics-mc-tracking
    networks:
      default:
        aliases:
          - vss-behavior-analytics
    command: python3 apps/analytics/main_analytics_3d_app.py --config /resources/vss-behavior-analytics-config.json --calibration /resources/calibration.json
    depends_on:
      broker-health-check:
        condition: service_completed_successfully

  vss-behavior-analytics-playback-mc-tracking:
    extends:
      file: ${VSS_APPS_DIR}/services/analytics/behavior-analytics/compose.yml
      service: vss-behavior-analytics-base
    profiles: ["vss-behavior-analytics-playback-mc-tracking"]
    volumes:
      - $VSS_APPS_DIR/developer-profiles/dev-profile-mc-tracking/vss-behavior-analytics/configs/vss-behavior-analytics-config.json:/resources/vss-behavior-analytics-config.json
      - $VSS_DATA_DIR/playback/warehouse_20x20_playback.txt:/opt/mdx/playback/warehouse_20x20_playback.txt
    container_name: vss-behavior-analytics-playback-mc-tracking
    command: python3 apps/playback/playback_frames.py --config /resources/vss-behavior-analytics-config.json --playback-filepath /opt/mdx/playback/warehouse_20x20_playback.txt

  bp-configurator-mc-tracking-init:
    extends:
      file: ${VSS_APPS_DIR}/services/configurators/vss-configurator/docker-compose.yaml
      service: bp-configurator-init-base
    profiles: ["bp-configurator-mc-tracking-init"]
    container_name: vss-configurator-mc-tracking-init

  bp-configurator-mc-tracking:
    extends:
      file: ${VSS_APPS_DIR}/services/configurators/vss-configurator/docker-compose.yaml
      service: bp-configurator-base
    container_name: vss-configurator-mc-tracking
    networks:
      default:
        aliases:
          - vss-configurator
    profiles: ["bp-configurator-mc-tracking"]
    environment:
      PROFILE_CONFIG_FILE: $VSS_APPS_DIR/developer-profiles/dev-profile-mc-tracking/blueprint-configurator/blueprint_config.yml
      DS_CONFIG_DIR: $VSS_APPS_DIR/developer-profiles/dev-profile-mc-tracking/deepstream/configs
      NVSTREAMER_CONFIG_DIR: $VSS_APPS_DIR/developer-profiles/dev-profile-mc-tracking/nvstreamer/configs
      RECOMPUTE_BEV_CENTERS_ENABLED: true
      SENSOR_FILE_PATH: ${SENSOR_FILE_PATH:-$VSS_APPS_DIR/developer-profiles/dev-profile-mc-tracking/camera_configs/camera_info.json}
      CHECK_SENSOR_IN_CALIBRATION_FILE: true
      SEND_CONFIG_TO_SDR: true
      ENABLE_CALIBRATION_PROCESS: true
    env_file:
      - ${BP_CONFIGURATOR_BASE_ENV_FILE:-$VSS_APPS_DIR/developer-profiles/dev-profile-mc-tracking/.env}
      - ${BP_CONFIGURATOR_ENV_FILE:-$VSS_APPS_DIR/developer-profiles/dev-profile-mc-tracking/overrides.env}
    volumes:
      - $VSS_APPS_DIR/developer-profiles/dev-profile-mc-tracking:$VSS_APPS_DIR/developer-profiles/dev-profile-mc-tracking:rw
      - $VSS_APPS_DIR/developer-profiles/dev-profile-mc-tracking/calibration/sample-data/$SAMPLE_VIDEO_DATASET:/opt/data
    depends_on:
      bp-configurator-mc-tracking-init:
        condition: service_completed_successfully

  kibana-init-container-mc-tracking:
    build:
      context: $VSS_APPS_DIR/developer-profiles/dev-profile-mc-tracking
      dockerfile: Dockerfiles/kibana-dashboard.Dockerfile
    profiles: ["kibana-init-container-mc-tracking"]
    container_name: vss-kibana-init-mc-tracking
    volumes:
      - $VSS_APPS_DIR/developer-profiles/dev-profile-mc-tracking/kibana-dashboard/mc-tracking-kibana-objects.ndjson:/opt/vss/kibana-objects.ndjson
    command: bash /opt/vss/init-scripts/kibana-import-dashboard.sh
    depends_on:
      kibana:
        condition: service_healthy

  vss-video-analytics-api-mc-tracking:
    extends:
      file: $VSS_APPS_DIR/services/analytics/video-analytics-api/compose.yml
      service: vss-video-analytics-api
    profiles: ["vss-video-analytics-api-mc-tracking"]
    container_name: vss-video-analytics-api-mc-tracking
    networks:
      default:
        aliases:
          - vss-video-analytics-api
    depends_on:
      broker-health-check:
        condition: service_completed_successfully
      elasticsearch-init-container:
        condition: service_completed_successfully

  import-calibration-output-container-mc-tracking:
    build:
      context: $VSS_APPS_DIR/developer-profiles/dev-profile-mc-tracking
      dockerfile: Dockerfiles/import-calibration.Dockerfile
    profiles: ["import-calibration-output-container-mc-tracking"]
    container_name: vss-import-calibration-output-mc-tracking
    volumes:
      - $VSS_APPS_DIR/developer-profiles/dev-profile-mc-tracking/calibration/sample-data/$SAMPLE_VIDEO_DATASET/calibration.json:/opt/vss/calibration.json
      - $VSS_APPS_DIR/developer-profiles/dev-profile-mc-tracking/calibration/sample-data/$SAMPLE_VIDEO_DATASET/images:/opt/vss/images/
    command: bash /opt/vss/init-scripts/calibration-import.sh
    depends_on:
      - vss-video-analytics-api-mc-tracking

  # One-shot: populates $VSS_DATA_DIR/models/reid with the SigLIP secondary
  # embedding model (NGC) and the CLIP-ReID tracker ONNX. 
  reid-embed-init-mc-tracking:
    image: ${VSS_REID_EMBED_IMAGE:-nvcr.io/nvstaging/vss-core/reid-embed}:${VSS_REID_EMBED_TAG:-3.3.0-26.08.1}
    profiles: ["reid-embed-init-mc-tracking"]
    container_name: vss-reid-embed-init-mc-tracking
    restart: "no"
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              device_ids: ["${RT_CV_DEVICE_ID:-0}"]
    working_dir: /opt/storage/reid
    volumes:
      - $VSS_DATA_DIR/models/reid:/opt/storage/reid:rw
      - $VSS_APPS_DIR/services/rtvi/reid-embed:/opt/scripts:ro
    environment:
      NGC_CLI_API_KEY: ${NGC_CLI_API_KEY}
    command:
      - bash
      - /opt/scripts/download-embedding-models.sh
      - --secondary
      - --clipreid

  # ── ReID embedding service stack ────────────────────────────────────────────────
  reid-etcd-mc-tracking:
    image: quay.io/coreos/etcd:v3.5.18
    profiles: ["reid-etcd-mc-tracking"]
    container_name: reid-etcd-mc-tracking
    networks:
      default:
        aliases:
          - reid-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://reid-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  reid-minio-mc-tracking:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    profiles: ["reid-minio-mc-tracking"]
    container_name: reid-minio-mc-tracking
    networks:
      default:
        aliases:
          - reid-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address ":${MINIO_CONSOLE_PORT:-9001}" --address ":${MINIO_PORT:-9000}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${MINIO_PORT:-9000}/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  reid-milvus-mc-tracking:
    image: milvusdb/milvus:v2.5.12
    profiles: ["reid-milvus-mc-tracking"]
    container_name: reid-milvus-mc-tracking
    networks:
      default:
        aliases:
          - reid-milvus
    depends_on:
      reid-etcd-mc-tracking:
        condition: service_healthy
      reid-minio-mc-tracking:
        condition: service_healthy
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: reid-etcd:2379
      MINIO_ADDRESS: reid-minio:${MINIO_PORT:-9000}
    command: ["milvus", "run", "standalone"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 90s

  reid-embed-mc-tracking:
    image: ${VSS_REID_EMBED_IMAGE:-nvcr.io/nvstaging/vss-core/reid-embed}:${VSS_REID_EMBED_TAG:-3.3.0-26.08.1}
    profiles: ["reid-embed-mc-tracking"]
    container_name: reid-embed-mc-tracking
    networks:
      default:
        aliases:
          - reid-embed
    # On the bridge the service is no longer on the host's loopback, so publish it
    # for host-side probes and scrapers.
    ports:
      - ${REID_SERVICE_HOST_PORT:-8088}:${REID_SERVICE_PORT:-8088}
    restart: unless-stopped
    ipc: host
    depends_on:
      reid-milvus-mc-tracking:
        condition: service_healthy
      reid-embed-init-mc-tracking:
        condition: service_completed_successfully
      broker-health-check:
        condition: service_completed_successfully
    ulimits:
      memlock: -1
      stack: 67108864
    # Passthrough mount: the same absolute path inside and out, so the model
    # paths below resolve identically on both sides.
    volumes:
      - "${MOUNT_DIR:-$VSS_DATA_DIR/models/reid}:${MOUNT_DIR:-$VSS_DATA_DIR/models/reid}:${MOUNT_OPTS:-rw}"
    environment:
      # Retained from the host-networked layout, where the image default of :8000
      # lost a SO_REUSEPORT race with NVStreamer. Nothing forces it on the bridge,
      # but keeping it means the published port and any existing probes still match.
      - REID_SERVICE_PORT=${REID_SERVICE_PORT:-8088}
      - KAFKA_CONSUMER_SERVER=${KAFKA_CONSUMER_SERVER:-kafka:29092}
      - KAFKA_CONSUMER_TOPIC=${KAFKA_CONSUMER_TOPIC:-mdx-raw}
      - KAFKA_PRODUCER_SERVER=${KAFKA_PRODUCER_SERVER:-kafka:29092}
      - KAFKA_PRODUCER_TOPIC=${KAFKA_PRODUCER_TOPIC:-mdx-compressed-embeddings}
      - MILVUS_HOST=${MILVUS_HOST:-reid-milvus}
      - ENABLE_COMPRESSION=${ENABLE_COMPRESSION:-False}
      - ENABLE_CLUSTERING=${ENABLE_CLUSTERING:-False}
      - COMPRESSION_INTERVAL_SEC=${COMPRESSION_INTERVAL_SEC:-1}
      - TRIGGER_INTERVAL_SEC=${TRIGGER_INTERVAL_SEC:-1}
      - ENABLE_SECONDARY_EMBEDDING=${ENABLE_SECONDARY_EMBEDDING:-False}
      - SECONDARY_EMBEDDING_MODEL=${SECONDARY_EMBEDDING_MODEL:-siglip2}
      - SECONDARY_EMBEDDING_ONNX_MODEL_PATH=${SECONDARY_EMBEDDING_ONNX_MODEL_PATH:-${MOUNT_DIR:-$VSS_DATA_DIR/models/reid}/siglip_v2_vdeployable_v1.0/siglip2_v1.0.onnx}
      - VIOS_SERVER=${VIOS_SERVER:-vst-ingress:${VST_PORT:-30888}}
      - PYTHONUNBUFFERED=1
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:${REID_SERVICE_PORT:-8088}/health/live"]
      interval: 60s
      timeout: 3s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Extends the generic, shared rtvi-cv-mv3dt library (services/rtvi/rtvi-cv/rtvi-cv-mv3dt/) —
  # that path is a shared capability name, not this profile's own packaging.
  vss-rtvi-cv-bev-fusion-mc-tracking:
    extends:
      file: $VSS_APPS_DIR/services/rtvi/rtvi-cv/rtvi-cv-mv3dt/compose.yaml
      service: measurement-fusion
    # Base "measurement-fusion" hardcodes container_name: vss-rtvi-cv-bev-fusion; override
    # so this profile has its own distinct container name.
    container_name: vss-rtvi-cv-bev-fusion-mc-tracking
    profiles: ["vss-rtvi-cv-bev-fusion-mc-tracking"]
    depends_on:
      broker-health-check:
        condition: service_completed_successfully

  vss-rtvi-cv-mc-tracking:
    extends:
      file: $VSS_APPS_DIR/services/rtvi/rtvi-cv/rtvi-cv-mv3dt/compose.yaml
      service: perception
    user: "0:0"
    profiles: ["vss-rtvi-cv-mc-tracking"]
    # Base "perception" hardcodes container_name: vss-rtvi-cv-mv3dt; override so this
    # profile has its own distinct container name. Note: Compose `extends` unions
    # network alias lists rather than replacing them, so this service still also
    # answers to the inherited "vss-rtvi-cv-mv3dt" alias on the Compose network —
    # harmless as long as this profile isn't started alongside another profile that
    # also uses that alias, but flagging so it isn't mistaken for a bug later.
    container_name: vss-rtvi-cv-mc-tracking
    networks:
      default:
        aliases:
          - vss-rtvi-cv-mc-tracking

    volumes:
      - $VSS_DATA_DIR/models/:/opt/storage/
      - $VSS_APPS_DIR/developer-profiles/dev-profile-mc-tracking/models-download.json:/opt/config/models-download.json:ro
      - $VSS_APPS_DIR/services/rtvi/rtvi-cv/download-models.sh:/opt/scripts/download-models.sh:ro
      - $VSS_APPS_DIR/developer-profiles/dev-profile-mc-tracking/calibration/sample-data/$SAMPLE_VIDEO_DATASET/camInfo/:/tmp/camInfo/
      - $VSS_APPS_DIR/developer-profiles/dev-profile-mc-tracking/deepstream/init-scripts/ds-start-mc-tracking.sh:/opt/nvidia/deepstream/deepstream/sources/apps/sample_apps/metropolis_perception_app/ds-start-mc-tracking.sh
      - $VSS_APPS_DIR/developer-profiles/dev-profile-mc-tracking/deepstream/configs:/opt/nvidia/deepstream/deepstream/sources/apps/sample_apps/metropolis_perception_app/configs

    environment:
      INSTANCE_ID: "0"
      DS_HTTP_PORT: "9000"
      BATCH_SIZE: "${NUM_STREAMS:-4}"
      MAX_BATCH_SIZE: "${NUM_STREAMS:-4}"
      MQTT_HOST: "${MQTT_HOST:-mosquitto}"
      MQTT_PORT: "${MQTT_PORT:-1883}"
      DEEPSTREAM_ENABLE_SENSOR_ID_EXTRACTION: "0"
      STREAM_TYPE: ${STREAM_TYPE}
      GST_ENABLE_CUSTOM_PARSER_MODIFICATIONS: 1
      OTEL_SERVICE_NAME: "rtvi-cv-mc-tracking"
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-otlp}
      NGC_CLI_API_KEY: ${NGC_CLI_API_KEY}
      MODELS_MANIFEST_PATH: /opt/config/models-download.json
      MODELS_DEST_ROOT: /opt/storage
      STORAGE_UID: ${STORAGE_UID:-1001}
      STORAGE_GID: ${STORAGE_GID:-1001}
      DS_MODEL_DOWNLOAD: auto
      DOWNLOAD_MODELS_SCRIPT: /opt/scripts/download-models.sh
    command: ["./ds-start-mc-tracking.sh"]
    depends_on:
      sensor-ms-mc-tracking:
        condition: service_started
      broker-health-check:
        condition: service_completed_successfully
      vss-rtvi-cv-bev-fusion-mc-tracking:
        condition: service_healthy
      reid-embed-mc-tracking:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
