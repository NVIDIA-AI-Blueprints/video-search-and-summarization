# ========================================================================================================
#
# This YAML file defines hardware-specific configurations for GPU profiles for the mc-tracking
# developer profile. The configurator indexes this file as [HARDWARE_PROFILE][MODE]; MODE is
# always "mc-tracking" for this profile.
#
# ========================================================================================================
# COMMONS
# ========================================================================================================
# Common variables and file operations are defined here and can be reused across hardware profiles.
# ========================================================================================================

commons:
  # Prerequisites: Count video files and set NUM_STREAMS variable.
  # This runs before variables are processed, so NUM_STREAMS can be used in variable expressions.
  # To enable file count, set enabled: true on the operation below.
  prerequisites:
    mc-tracking:
      - operation_type: "file_management"
        enabled: false
        target_directories:
          - "${VSS_DATA_DIR}/videos/${SAMPLE_VIDEO_DATASET}"
        file_management:
          action: "file_count"       # Count files matching pattern
          parameters:
            pattern: "*.mp4"          # File pattern to match
          output_variable: NUM_STREAMS # Output the number of files matching the pattern to the NUM_STREAMS variable

  variable_validation:
    mc-tracking:
      # VSS path variables must be set to real paths, not placeholders or empty
      - variable: VSS_APPS_DIR
        required: true
        disallowed_values: ["", "/path/to/deploy/docker"]
        error_message: "VSS_APPS_DIR must be set to a valid deployment path and must not be empty or the placeholder '/path/to/deploy/docker'"
      - variable: VSS_DATA_DIR
        required: true
        disallowed_values: ["", "/path/to/vss-mc-tracking-data"]
        error_message: "VSS_DATA_DIR must be set to a valid data path and must not be empty or the placeholder '/path/to/vss-mc-tracking-data'"
      - variable: HOST_IP
        required: true
        disallowed_values: ["", "<HOST_IP>"]
        error_message: "HOST_IP must be set to the host IP address and must not be empty or the placeholder '<HOST_IP>'"

      # This profile has a single BP_PROFILE value; STREAM_TYPE (not BP_PROFILE) selects
      # the message broker. Auto-calibration is a separate profile, not part of this one.
      - variable: BP_PROFILE
        allowed_values: ["bp_developer_mc-tracking"]

      # STREAM_TYPE can only be "kafka" or "redis"
      - variable: STREAM_TYPE
        allowed_values: ["kafka", "redis"]

      # This profile has no VSS Agent, LLM NIM, or VLM NIM services (MCT-FND-006).
      - variable: LLM_MODE
        required: false
        allowed_values: ["none"]

      - variable: VLM_MODE
        required: false
        allowed_values: ["none"]

      # When HARDWARE_PROFILE=DGX-SPARK, image tags must contain 'sbsa'
      - variable: PERCEPTION_TAG
        condition:
          variable: HARDWARE_PROFILE
          equals: "DGX-SPARK"
        allowed_patterns:
          - "*sbsa*"
        error_message: "When HARDWARE_PROFILE is DGX-SPARK, PERCEPTION_TAG must contain 'sbsa'"

      - variable: SAMPLE_VIDEO_DATASET
        when_equals: "warehouse-4cams-20mx20m-synthetic"
        validate_conditions:
          and:
            - variable: MODE
              equals: "mc-tracking"
            - variable: NUM_STREAMS
              equals: "4"
            - variable: BP_PROFILE
              equals: "bp_developer_mc-tracking"

  variables:
    mc-tracking:
      - trim_sample_videos: 'False if "${SENSOR_INFO_SOURCE}" == "file" else True'
      - effective_max_streams_supported: 'int("${max_streams_supported}") if "${max_streams_supported}" != "$" + "{max_streams_supported}" and "${max_streams_supported}" != "" else ${NUM_STREAMS}'
      - final_stream_count: "min(${NUM_STREAMS}, ${effective_max_streams_supported})"
      - msg-broker-conn-str: '"redis;6379;" if "${STREAM_TYPE}" == "redis" else "kafka;29092;mdx-raw"'
      - msg-broker-config: '"ds-redis-config.txt" if "${STREAM_TYPE}" == "redis" else "ds-kafka-config.txt"'
      - msg-broker-proto-lib: '"/opt/nvidia/deepstream/deepstream/lib/libnvds_redis_proto.so" if "${STREAM_TYPE}" == "redis" else "/opt/nvidia/deepstream/deepstream/lib/libnvds_kafka_proto.so"'
      # vss-behavior-analytics app.sourceType / app.sinkType (MDX uses "redisStream", not "redis")
      - warehouse_source_sink_type: '"redisStream" if "${STREAM_TYPE}" == "redis" else "kafka"'
      # vss-video-analytics-api: kafka.brokers null when using Redis streams; broker list when using Kafka
      - vss_video_analytics_kafka_brokers: 'None if "${STREAM_TYPE}" == "redis" else ["kafka:29092"]'
      - ds_config_latency: '"2000" if "${STREAM_TYPE}" == "redis" else "10000"'

  file_operations:
    mc-tracking:
      # Update DeepStream main config
      - operation_type: "text_config_update"
        target_file: "${DS_CONFIG_DIR}/ds-main-config-mc-tracking.txt"
        backup: true
        updates:
          num-source-bins: "0"
          list: ""
          sensor-id-list: ""
          sensor-name-list: ""
          config-file: "ds-pgie-config.yml"
          max-batch-size: "${final_stream_count}"
          batch-size: "${final_stream_count}"
          msg-broker-conn-str: "${msg-broker-conn-str}"
          msg-broker-config: "${msg-broker-config}"
          msg-broker-proto-lib: "${msg-broker-proto-lib}"
          latency: "${ds_config_latency}"

      # Update NVStreamer configs
      - operation_type: "json_update"
        target_file: ${VSS_APPS_DIR}/developer-profiles/dev-profile-mc-tracking/nvstreamer/configs/vst-config.json
        backup: true
        updates:
          data.nv_streamer_sync_file_count: ${final_stream_count}
          onvif.max_devices_supported: ${effective_max_streams_supported}

      # Update VST config
      - operation_type: "json_update"
        target_file: "${VSS_APPS_DIR}/developer-profiles/dev-profile-mc-tracking/vst/configs/vst_config.json"
        backup: true
        updates:
          onvif.max_devices_supported: ${effective_max_streams_supported}
          data.always_recording: true

      - operation_type: "json_update"
        target_file: "${VSS_APPS_DIR}/developer-profiles/dev-profile-mc-tracking/vst/configs/notification_config.json"
        backup: true
        updates:
          message_broker.use_message_broker_consumer: "${STREAM_TYPE}"

      # source/sink driver — kafka vs redisStream (see warehouse_source_sink_type)
      - operation_type: "json_update"
        target_file: "${VSS_APPS_DIR}/developer-profiles/dev-profile-mc-tracking/vss-behavior-analytics/configs/vss-behavior-analytics-config.json"
        backup: true
        array_kv_updates:
          - list_key: app
            match_field: name
            updates:
              - match: sourceType
                set_key: value
                set_value: "${warehouse_source_sink_type}"
              - match: sinkType
                set_key: value
                set_value: "${warehouse_source_sink_type}"

      # vss-video-analytics-api (compose mounts VSS_APPS_DIR/services/analytics/video-analytics-api/configs/...)
      - operation_type: "json_update"
        target_file: "${VSS_APPS_DIR}/services/analytics/video-analytics-api/configs/vss-video-analytics-api-config.json"
        backup: true
        updates:
          kafka.brokers: "${vss_video_analytics_kafka_brokers}"

      - operation_type: "file_management"
        enabled: "${trim_sample_videos}"
        target_directories:
          - "${VSS_DATA_DIR}/videos/${SAMPLE_VIDEO_DATASET}"
        file_management:
          action: "keep_count" # Keep only the last ${final_stream_count} videos in the directory
          parameters:
            count: ${final_stream_count}
            pattern: "*.mp4"

# ========================================================================================================
# HARDWARE PROFILES
# ========================================================================================================
# RTXPRO4500BW intentionally has no mc-tracking entry below.

H100:
  mc-tracking:
    max_streams_supported: 61

L4:
  mc-tracking:
    max_streams_supported: 7

L40S:
  mc-tracking:
    max_streams_supported: 23

RTXA6000:
  mc-tracking:
    max_streams_supported: 4

RTXA6000ADA:
  mc-tracking:
    max_streams_supported: 22

RTXPRO6000BW:
  mc-tracking:
    max_streams_supported: 39

IGX-THOR:
  mc-tracking:
    max_streams_supported: 7
    file_operations:
      # Update DeepStream main config
      - operation_type: "text_config_update"
        target_file: "${DS_CONFIG_DIR}/ds-main-config-mc-tracking.txt"
        updates:
          batched-push-timeout: "67000"
          low-latency-mode: "0"

      # Update VST config
      - operation_type: "json_update"
        target_file: "${VSS_APPS_DIR}/developer-profiles/dev-profile-mc-tracking/vst/configs/vst_config.json"
        backup: true
        updates:
          onvif.max_devices_supported: ${max_streams_supported}
          overlay.enable_overlay_skip_frame: true

      - operation_type: "json_update"
        target_file: "${VSS_APPS_DIR}/developer-profiles/dev-profile-mc-tracking/vst/configs/notification_config.json"
        backup: true
        updates:
          message_broker.use_message_broker_consumer: "${STREAM_TYPE}"

DGX-SPARK:
  mc-tracking:
    max_streams_supported: 7
    file_operations:
      # Update DeepStream main config
      - operation_type: "text_config_update"
        target_file: "${DS_CONFIG_DIR}/ds-main-config-mc-tracking.txt"
        updates:
          batched-push-timeout: "67000"

      # Update VST config
      - operation_type: "json_update"
        target_file: "${VSS_APPS_DIR}/developer-profiles/dev-profile-mc-tracking/vst/configs/vst_config.json"
        backup: true
        updates:
          onvif.max_devices_supported: ${max_streams_supported}
          overlay.enable_overlay_skip_frame: true

      - operation_type: "json_update"
        target_file: "${VSS_APPS_DIR}/developer-profiles/dev-profile-mc-tracking/vst/configs/notification_config.json"
        backup: true
        updates:
          message_broker.use_message_broker_consumer: "${STREAM_TYPE}"
