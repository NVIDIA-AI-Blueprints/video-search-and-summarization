# Apply only to this demo. Shared services inherit a loopback bind for every
# port without an explicit host address, while containers retain Compose DNS.
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
