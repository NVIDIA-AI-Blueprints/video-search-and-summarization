# =============================================================================
# VSS base profile - per-PR previews (GitHub pull-request generator)
# =============================================================================
# Owner: runtime-pic. One Application, one namespace, per open PR that carries
# the `preview` label:
#     PR #482  ->  Application vss-preview-mr482  ->  namespace vss-preview-mr482
# The chart is the one already in this repo
# (deploy/helm/developer-profiles/dev-profile-base) rendered at the PR's HEAD
# commit, with deploy/argocd/values-preview.yaml layered on top: no NIMs, no GPU,
# no VST - just UI + agent + Phoenix. See deploy/argocd/README.md.
#
# The owner/repo/domain live in the `list` generator below so a fork can retarget
# the whole pipeline by editing four lines (matrix templates the pullRequest
# generator's fields from the list generator's parameters).
#
# Prerequisites on the ArgoCD instance:
#   - Secret `github-token` in namespace argocd with key `token`
#     (a PAT/GitHub App token with `repo:status`/read access to PRs):
#       kubectl -n argocd create secret generic github-token --from-literal=token=<PAT>
#   - Preview namespaces must receive the nvcr.io pull secret `ngc-secret` and
#     `ngc-api` (values-preview.yaml sets ngc.createSecrets: false) - see README.
#   - An ingress controller matching .ingressClassName below, and wildcard DNS
#     *.<previewDomain> pointing at it.
# -----------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: vss-base-profile-preview
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: vss
    vss.nvidia.com/profile: base
    vss.nvidia.com/owner: runtime-pic
spec:
  # Classic (fasttemplate) parameter substitution: {{number}}, {{head_sha}}, ...
  goTemplate: false
  generators:
    - matrix:
        generators:
          # ---- the only lines a fork needs to change -------------------------
          - list:
              elements:
                - owner: NVIDIA-AI-Blueprints
                  repo: video-search-and-summarization
                  # Wildcard DNS suffix for preview hosts: vss-mr<number>.<previewDomain>
                  previewDomain: preview.vss.nvidia.com
                  ingressClassName: nginx
          # ---- one Application per open, `preview`-labelled PR ---------------
          - pullRequest:
              # Poll GitHub every 5 min; a closed/merged PR removes its Application
              # (and everything in its namespace) on the next pass.
              requeueAfterSeconds: 300
              github:
                owner: "{{owner}}"
                repo: "{{repo}}"
                # Opt-in: a preview still pulls ~GB of nvcr.io images, so it is not
                # started for every PR. Drop `labels` to preview all open PRs.
                labels:
                  - preview
                tokenRef:
                  secretName: github-token
                  key: token
  template:
    metadata:
      name: vss-preview-mr{{number}}
      labels:
        app.kubernetes.io/part-of: vss
        vss.nvidia.com/profile: base
        vss.nvidia.com/preview: "true"
        vss.nvidia.com/owner: runtime-pic
      annotations:
        vss.nvidia.com/pull-request: "{{number}}"
        vss.nvidia.com/branch: "{{branch}}"
        vss.nvidia.com/head-sha: "{{head_sha}}"
        # Deleting the Application (PR closed/merged) removes its workloads and PVCs.
        # The auto-created namespace itself is not owned by ArgoCD - see README.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/{{owner}}/{{repo}}
        # Exactly the code under review, not the branch tip at sync time.
        targetRevision: "{{head_sha}}"
        path: deploy/helm/developer-profiles/dev-profile-base
        helm:
          releaseName: vss
          valueFiles:
            # Relative to the chart path, resolved inside the repo checkout:
            # deploy/helm/developer-profiles/dev-profile-base -> deploy/argocd
            # (ArgoCD allows value files outside the app path as long as they stay
            # inside the repository root). values-base.yaml is deliberately NOT
            # used here - it is the GPU install overlay.
            - ../../../argocd/values-preview.yaml
          ignoreMissingValueFiles: false
          parameters:
            # Per-PR hostname: vss-mr<number>.<previewDomain>
            - name: global.externalHost
              value: vss-mr{{number}}.{{previewDomain}}
            - name: vssIngress.enabled
              value: "true"
            - name: vssIngress.host
              value: vss-mr{{number}}.{{previewDomain}}
            - name: vssIngress.ingressClassName
              value: "{{ingressClassName}}"
            # INDEX CONTRACT: values-preview.yaml owns vss-agent-ui.extraEnv[0..1].
            - name: vss-agent-ui.extraEnv[2].name
              value: NEXT_PUBLIC_APP_SUBTITLE
            - name: vss-agent-ui.extraEnv[2].value
              value: "Vision (Base) - PR #{{number}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: vss-preview-mr{{number}}
      syncPolicy:
        # Safe to automate: this overlay schedules no GPUs and no NIM CRs.
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - PruneLast=true
        retry:
          limit: 5
          backoff:
            duration: 20s
            factor: 2
            maxDuration: 5m
  syncPolicy:
    # PR closed/merged -> Application deleted -> its resources deleted.
    preserveResourcesOnDeletion: false
