name: OSRB Scan

on:
  push:
    branches:
      - "pull-request/[0-9]+"

permissions:
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: the DELTA pipeline. Diffs base-ref against head-ref and reports what
  # this pull request changes. It is the input to the private OSRB review, and
  # it is blind by construction to anything already in the tree.
  # ---------------------------------------------------------------------------
  osrb-scan:
    name: OSRB Scan (dependency inventory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Resolve base ref and PR number
        id: ctx
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: develop
        run: |
          set -euo pipefail
          pr_number="${GITHUB_REF##*/pull-request/}"
          # This workflow runs on push-to-mirror (refs/heads/pull-request/<N>),
          # so github.base_ref is empty. Query the PR API for the real target
          # branch so cherry-pick / hotfix PRs against release branches
          # (e.g. dev/3.2.0) get a sensible diff baseline. Fall back to
          # develop only if the lookup fails (e.g. PR closed mid-run).
          # `// ""` coerces a missing/null baseRefName to an empty string —
          # bare `.baseRefName` would emit the literal "null" and bypass the
          # `${target:-DEFAULT_BRANCH}` fallback below.
          target="$(gh pr view "${pr_number}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json baseRefName --jq '.baseRefName // ""' 2>/dev/null || true)"
          target="${target:-${DEFAULT_BRANCH}}"
          # Release branches (dev/*, release/*) accept only curated content
          # that already passed the OSRB Scan on its develop-targeted PR. Running
          # the diff again here just floods every cherry-pick / release-train
          # PR with noise, so short-circuit and skip the rest of the workflow.
          case "${target}" in
            dev/*|release/*)
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Skipping OSRB Scan: PR targets release branch '${target}' — diff already enforced on the develop-targeted PR."
              exit 0
              ;;
          esac
          echo "skip=false" >> "$GITHUB_OUTPUT"
          git fetch --no-tags origin "+refs/heads/${target}:refs/remotes/origin/${target}"
          merge_base=$(git merge-base HEAD "origin/${target}" || git rev-parse "origin/${target}")
          echo "base=${merge_base}" >> "$GITHUB_OUTPUT"
          echo "pr=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "Comparing HEAD against ${merge_base} (PR target: ${target}) for PR #${pr_number}"

      # `--output license-diff.csv` is deliberate: see the upload step below.
      - name: Generate OSRB dependency CSV
        id: gen
        if: steps.ctx.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python .github/osrb/osrb_scan.py \
            --base-ref "${{ steps.ctx.outputs.base }}" \
            --head-ref HEAD \
            --output license-diff.csv
          row_count=$(($(wc -l < license-diff.csv) - 1))
          echo "rows=${row_count}" >> "$GITHUB_OUTPUT"
          echo "--- csv preview (rows=${row_count}) ---"
          head -n 30 license-diff.csv || true

      - name: Render OSRB review overview
        id: overview
        if: steps.ctx.outputs.skip != 'true'
        run: |
          set -euo pipefail
          python .github/osrb/osrb_summary.py \
            --input license-diff.csv \
            --output osrb-summary.md \
            --github-output "$GITHUB_OUTPUT"

      # DO NOT RENAME the artifact or the CSV. The private GitLab OSRB
      # pipeline fetches the artifact named `license-diff` and reads
      # `license-diff.csv` out of it by those exact names, and that consumer
      # lives in a repository we cannot see or change from here. Renaming
      # either one to match the new "OSRB Scan" wording does not fail this
      # workflow — the download simply finds nothing and the OSRB review
      # proceeds against an empty dependency list. Leave both names alone.
      - name: Upload review evidence
        id: upload
        if: always() && steps.ctx.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: license-diff
          path: |
            license-diff.csv
            osrb-summary.md
          if-no-files-found: warn

      - name: Write step summary
        if: always()
        env:
          SKIP: ${{ steps.ctx.outputs.skip }}
          BASE: ${{ steps.ctx.outputs.base }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          {
            if [[ "${SKIP}" == "true" ]]; then
              echo "## OSRB Scan"
              echo
              echo "Skipped: PR targets a release branch (\`dev/*\` or \`release/*\`)."
              echo "The OSRB Scan already ran on the develop-targeted PR; running again here only adds noise."
            elif [[ ! -f license-diff.csv ]]; then
              echo "## OSRB Scan"
              echo
              echo "No CSV produced."
            else
              cat osrb-summary.md
              echo
              echo "Compared HEAD against \`${BASE}\`."
              echo "Download the complete \`license-diff.csv\` from the [license-diff artifact](${ARTIFACT_URL})."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update PR comment
        if: always() && steps.ctx.outputs.skip != 'true' && steps.gen.outputs.rows != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.ctx.outputs.pr }}
          RAW_ROWS: ${{ steps.gen.outputs.rows }}
          BASE: ${{ steps.ctx.outputs.base }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GUIDE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/develop/.github/osrb/OSRB_REVIEW.md
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          # Not renamed with the workflow: this marker is how the step finds
          # the comment it posted on earlier pushes. A new marker would leave
          # the old comment stranded and post a second one on every open PR.
          marker='<!-- license-diff-osrb -->'
          {
            echo "$marker"
            cat osrb-summary.md
            echo
            echo "Compared against \`${BASE}\`. The complete CSV retains all **${RAW_ROWS}** changes."
            echo "Review the [GitHub Actions run](${RUN_URL}) or download the [\`license-diff\` artifact](${ARTIFACT_URL})."
            echo
            echo "<details><summary>Raw CSV (inline)</summary>"
            echo
            echo '```csv'
            cat license-diff.csv
            echo '```'
            echo "</details>"
            echo
            echo "### What to do"
            echo
            echo "The **OSRB Review** check evaluates these changes against existing approval evidence and posts its verdict on this PR."
            echo "While that check is being rolled out, a red OSRB Scan is still a real signal:"
            echo "get approval from \`@NVIDIA-AI-Blueprints/VSS_OSRB_Approvers\` for the touched paths."
            echo "Do not paste private approval evidence into this public PR."
            echo
            echo "[Developer instructions](${GUIDE_URL}) · CODEOWNERS remains the final merge gate."
          } > comment.md
          existing=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$marker\"))][0].id")
          payload=$(jq -Rsn '{body: input}' < comment.md)
          if [[ -n "$existing" && "$existing" != "null" ]]; then
            echo "Updating existing comment $existing"
            echo "$payload" | gh api -X PATCH "repos/${REPO}/issues/comments/${existing}" --input - > /dev/null
          else
            echo "Creating new comment on PR #${PR}"
            echo "$payload" | gh api -X POST "repos/${REPO}/issues/${PR}/comments" --input - > /dev/null
          fi

      # Two independent reasons to fail, kept in one step so the job cannot
      # end green with either one outstanding. They are NOT the same problem:
      # review_rows is a dependency a human must approve; uncovered_rows is the
      # scanner admitting it does not understand a file in this PR, which no
      # OSRB approval can fix.
      - name: Fail when OSRB attention or scanner coverage is required
        # Folded to one line by YAML. Every continuation stays at the same
        # indent on purpose: a more-indented line in a folded scalar keeps its
        # newline instead of becoming a space.
        if: >-
          steps.ctx.outputs.skip != 'true' &&
          ((steps.overview.outputs.review_rows != '' && steps.overview.outputs.review_rows != '0')
          || (steps.overview.outputs.uncovered_rows != '' && steps.overview.outputs.uncovered_rows != '0'))
        env:
          REVIEW_ROWS: ${{ steps.overview.outputs.review_rows }}
          UNCOVERED_ROWS: ${{ steps.overview.outputs.uncovered_rows }}
        run: |
          set -uo pipefail
          status=0
          if [[ -n "${UNCOVERED_ROWS}" && "${UNCOVERED_ROWS}" != "0" ]]; then
            {
              printf '::error title=OSRB scanner coverage gap::'
              printf '%s dependency-bearing file(s) in this PR are not understood by ' "${UNCOVERED_ROWS}"
              printf 'the scanner, so their dependencies were never inventoried. This is a '
              printf 'scanner gap, not an OSRB decision: asking for OSRB approval will not '
              printf 'clear it. Teach .github/osrb/osrb_scan.py to parse the file '
              printf '(is_dependency_file / the matching parser) or, with a maintainer, '
              printf 'record why the file carries no third-party dependency. See '
              printf 'UNCOVERED_SOURCE rows in the step summary.\n'
            }
            status=1
          fi
          if [[ -n "${REVIEW_ROWS}" && "${REVIEW_ROWS}" != "0" ]]; then
            {
              printf '::error title=OSRB review required::'
              printf '%s package change(s) require OSRB attention. Get approval for the ' "${REVIEW_ROWS}"
              printf 'touched paths from @NVIDIA-AI-Blueprints/VSS_OSRB_Approvers; see '
              printf '.github/osrb/OSRB_REVIEW.md.\n'
            }
            status=1
          fi
          exit "${status}"

  # ---------------------------------------------------------------------------
  # Job 2: the STATE pipeline. Rebuilds the whole dependency inventory from the
  # tree and compares it against the OSRB-approved baseline. Deliberately not a
  # diff: a dependency that drifted out of approval three merges ago is a
  # finding here on every pull request until someone fixes it, which is exactly
  # what the delta pipeline can never say.
  #
  # It runs on release-branch pull requests too, unlike Job 1. Job 1 skips them
  # because the same diff was already reviewed on the develop-targeted pull
  # request; that argument does not transfer, because the state of a release
  # branch is its own state and nothing else has checked it.
  # ---------------------------------------------------------------------------
  dependency-inventory:
    name: OSRB Scan (approved-state comparison)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Depth 1 is enough and deliberate: this job reads one tree, never a
      # range. Job 1 needs full history because it computes a merge base.
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      # `--previous` is what makes this reproduce the committed file rather
      # than a near-copy of it. osrb_inventory.py makes no network calls, so a
      # licence it cannot read out of the tree is carried forward from the last
      # inventory; drop the flag and every such row regenerates as UNKNOWN and
      # the gate is red on every pull request forever. It cannot mask real
      # drift: carry-forward is the last resort, after the parser and after
      # every attribution file.
      - name: Regenerate the dependency inventory
        run: |
          set -euo pipefail
          python .github/osrb/osrb_inventory.py \
            --ref HEAD \
            --previous .github/osrb/inventory.csv \
            --output "${RUNNER_TEMP}/inventory.csv"
          echo "--- regenerated inventory ($(($(wc -l < "${RUNNER_TEMP}/inventory.csv") - 1)) rows) ---"
          head -n 10 "${RUNNER_TEMP}/inventory.csv"

      # The drift gate. Everything downstream compares the COMMITTED inventory
      # against the approved baseline, so a stale committed inventory would let
      # a dependency change through by simply not appearing in the file the
      # comparison reads. Fail here, before that can happen.
      - name: Fail when the committed inventory is stale
        run: |
          set -euo pipefail
          if diff -u .github/osrb/inventory.csv "${RUNNER_TEMP}/inventory.csv" > "${RUNNER_TEMP}/inventory.diff"; then
            echo "Committed inventory matches the tree."
            exit 0
          fi
          echo "--- diff: committed (-) vs regenerated (+) ---"
          cat "${RUNNER_TEMP}/inventory.diff"
          {
            printf '::error title=OSRB inventory is stale::'
            printf 'This branch changes the dependency tree but .github/osrb/inventory.csv '
            printf 'was not refreshed, so the approved-state comparison below is reading a '
            printf 'file that no longer describes this repository. Refresh it and commit the '
            printf 'result: python .github/osrb/osrb_inventory.py --ref HEAD --previous '
            printf '.github/osrb/inventory.csv --output .github/osrb/inventory.csv\n'
          }
          exit 1

      - name: Compare the inventory against the OSRB-approved baseline
        id: compare
        run: |
          set -euo pipefail
          python .github/osrb/osrb_compare.py \
            --inventory .github/osrb/inventory.csv \
            --approved .github/osrb/approved.csv \
            --conditions .github/osrb/conditions.csv \
            --output osrb-compliance.csv \
            --summary osrb-compliance.md \
            --submissions osrb-submissions \
            --github-output "$GITHUB_OUTPUT"

      # A SEPARATE artifact on purpose. The `license-diff` artifact in Job 1 is
      # fetched by name by a private GitLab pipeline this repository cannot see;
      # adding files to it, or renaming it, is how that consumer breaks quietly.
      - name: Upload compliance report
        id: compliance-upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: osrb-compliance
          path: |
            osrb-compliance.csv
            osrb-compliance.md
            osrb-submissions/
          if-no-files-found: warn

      - name: Write step summary
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.compliance-upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          {
            if [[ ! -f osrb-compliance.md ]]; then
              echo "## OSRB approved-state comparison"
              echo
              echo "No report produced — the inventory drift gate above failed first."
            else
              cat osrb-compliance.md
              echo
              echo "Full row-level detail: [\`osrb-compliance\` artifact](${ARTIFACT_URL})."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # REPORT-ONLY, deliberately, and this is not timidity.
      #
      # A ratchet was implemented here and removed, because adversarial review
      # found it unsound in four independent ways:
      #   1. `steps.ctx.outputs.base` was a CROSS-JOB reference (ctx lives in
      #      the osrb-scan job), so BASE_SHA was always "" - and
      #      `git show ":path"` with an empty rev does not fail, it reads the
      #      INDEX. Base counts became byte-identical to head counts and the
      #      gate could never fire.
      #   2. The baseline was computed against the PR's OWN approved.csv, so
      #      gutting the approved list raised both sides equally and stayed
      #      green. The trust anchor was un-gated by construction.
      #   3. Counts net out: remove one NOT_APPROVED row, add another, and a
      #      brand-new GPL-3.0 dependency merges green. Gating has to compare
      #      finding IDENTITIES, not totals.
      #   4. `owning_module()` falls back to the first path segment, and any
      #      module in neither MODULE_MAP nor UNSUBMITTED lands in the ungated
      #      MODULE_UNSUBMITTED bucket - so a dependency added under a new
      #      directory raised no gated count at all.
      #
      # Separately, the signal is not yet clean enough to gate on: 1350 of the
      # 1717 NOT_APPROVED rows are services/ui, whose entire approved baseline
      # is two PR-delta rows. That is one missing OSRB submission reported 1350
      # times, not 1350 findings.
      #
      # So this reports and never fails. The delta gate in the osrb-scan job
      # above still blocks - a dependency change a PR actually introduces is
      # caught there. Turning this into a gate needs, in order: identity-based
      # comparison against the merge base, CODEOWNERS on approved.csv and
      # module_map.py, a real verdict for unknown modules, and the services/ui
      # submission. Tracked in .github/osrb/README.md.
      - name: Report drift from the approved baseline
        if: always() && steps.compare.outcome == 'success'
        env:
          NOT_APPROVED: ${{ steps.compare.outputs.not_approved }}
          VERSION_DRIFT: ${{ steps.compare.outputs.version_drift }}
          LICENSE_DRIFT: ${{ steps.compare.outputs.license_drift }}
          USAGE_DRIFT: ${{ steps.compare.outputs.usage_drift }}
          GUIDE_URL: ${{ github.server_url }}/${{ github.repository }}/blob/develop/.github/osrb/README.md
        run: |
          set -uo pipefail
          {
            echo "### OSRB approved-baseline comparison (report-only)"
            echo
            echo "| verdict | rows |"
            echo "| --- | --- |"
            echo "| NOT_APPROVED | ${NOT_APPROVED:-0} |"
            echo "| VERSION_DRIFT | ${VERSION_DRIFT:-0} |"
            echo "| LICENSE_DRIFT | ${LICENSE_DRIFT:-0} |"
            echo "| USAGE_DRIFT | ${USAGE_DRIFT:-0} |"
            echo
            echo "This check does not fail. See ${GUIDE_URL} for what each verdict means"
            echo "and what has to be true before it can gate."
          } >> "$GITHUB_STEP_SUMMARY"
