# Publishes a release branch's docs as a stable named Fern preview, the
# release "staging" site:
#   release/X.Y.Z -> https://nvidia-preview-release-X-Y-Z.docs.buildwithfern.com/vss
#
# The branch is built as "X.Y.Z (preview)", the default version, stamped with
# the values the release will ship (vX.Y.Z / X.Y.Z / X.Y.Z-sbsa), alongside
# the release tags listed in its fern/docs.yml. Rerunning updates the same
# URL. Production is not touched (publish-fern-docs.yml).
#
# Requires the DOCS_FERN_TOKEN repo secret.

name: Preview Release Docs

on:
  push:
    branches:
      - 'release/**'
    paths:
      - 'docs/**'
      - 'fern/**'
      - 'services/analytics/video-analytics-api/src/app/specification/openapi.json'
      - '.github/scripts/build_fern_site.py'
      - '.github/scripts/resolve_fern_docs_context.sh'
      - '.github/workflows/preview-release-docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fern-release-preview-${{ github.ref }}
  # Do not cancel an in-flight Fern upload; a killed register can leave the
  # preview incomplete until the next run.
  cancel-in-progress: false

jobs:
  preview:
    name: Release preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve release version
        id: context
        env:
          REF_NAME: ${{ github.ref_name }}
        run: .github/scripts/resolve_fern_docs_context.sh

      - name: Require a release branch
        if: steps.context.outputs.release == ''
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "::error::${REF_NAME} is not a release/X.Y.Z branch; nothing to preview"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Install Fern CLI
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version fern/fern.config.json)
          if ! [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?|latest)$ ]]; then
            echo "::error::fern.config.json .version '$VERSION' is not a valid semver or 'latest'"
            exit 1
          fi
          npm install -g "fern-api@${VERSION}"

      - name: Build Fern site
        env:
          RELEASE: ${{ steps.context.outputs.release }}
        run: |
          set -euo pipefail
          python3 .github/scripts/build_fern_site.py --fetch --release "$RELEASE" \
            --output "${RUNNER_TEMP}/fern-site" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish named preview
        working-directory: ${{ runner.temp }}/fern-site
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
          RELEASE: ${{ steps.context.outputs.release }}
        run: |
          set -eo pipefail
          PREVIEW_ID="release-${RELEASE//./-}"
          ATTEMPTS=3
          URL=""
          for i in $(seq 1 "$ATTEMPTS"); do
            echo "::group::fern generate attempt $i/$ATTEMPTS"
            if fern generate --docs --instance nvidia-vss.docs.buildwithfern.com/vss --preview --id "$PREVIEW_ID" 2>&1 | tee /tmp/fern-output.log; then
              URL=$(grep -oP 'Published docs to \K.*(?= \()' /tmp/fern-output.log || true)
            fi
            echo "::endgroup::"
            if [ -n "$URL" ]; then
              break
            fi
            echo "Preview publish failed on attempt $i/$ATTEMPTS"
            if [ "$i" -lt "$ATTEMPTS" ]; then
              sleep $((i * 20))
            fi
          done
          if [ -z "$URL" ]; then
            echo "::error::Failed to publish the release preview after ${ATTEMPTS} attempts. See fern output above."
            exit 1
          fi
          echo "### Release preview: [$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"
