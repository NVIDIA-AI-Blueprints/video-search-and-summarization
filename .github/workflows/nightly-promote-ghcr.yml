name: Nightly validate and promote GHCR set

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Optional develop commit to validate (latest green when empty)"
        required: false
      promotion_tag:
        description: "Optional immutable tag assertion"
        required: false
      agent_ui_artifacts_config:
        description: "Optional agent/UI artifacts-promotion config path"
        required: false
      alert_artifacts_config:
        description: "Optional alert artifacts-promotion config path"
        required: false
      video_analytics_api_artifacts_config:
        description: "Optional video analytics API artifacts-promotion config path"
        required: false
      behavior_analytics_artifacts_config:
        description: "Optional behavior analytics artifacts-promotion config path"
        required: false
      sdr_mw_l_artifacts_config:
        description: "Optional sdr-mw-l artifacts-promotion config path"
        required: false
      vss_configurator_artifacts_config:
        description: "Optional VSS configurator artifacts-promotion config path"
        required: false
      vss_rt_config_adaptor_artifacts_config:
        description: "Optional VSS RT config adaptor artifacts-promotion config path"
        required: false
concurrency:
  group: nightly-validate-ghcr
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  packages: write

defaults:
  run:
    shell: bash

jobs:
  release:
    if: vars.VSS_NIGHTLY_PROMOTE_ENABLED == 'true'
    runs-on: [self-hosted, downstream-pipeline]
    timeout-minutes: 185
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOWNSTREAM_CI_URL: ${{ secrets.DOWNSTREAM_CI_URL }}
      DOWNSTREAM_CI_TOKEN: ${{ secrets.DOWNSTREAM_CI_TOKEN }}
      DOWNSTREAM_PROJECT_PATH: ${{ secrets.DOWNSTREAM_PROJECT_PATH }}
      DOWNSTREAM_REF: ${{ vars.DOWNSTREAM_TEST_REF || vars.DOWNSTREAM_PROMOTION_REF || 'main' }}
      DOWNSTREAM_SUBMODULE_HASH_VARIABLE: VSS_SUBMODULE_HASH
      AGENT_UI_CONFIG: ${{ inputs.agent_ui_artifacts_config || vars.VSS_AGENT_UI_ARTIFACTS_PROMOTION_CONFIG_PATH }}
      ALERT_CONFIG: ${{ inputs.alert_artifacts_config || vars.VSS_ALERT_ARTIFACTS_PROMOTION_CONFIG_PATH }}
      VIDEO_ANALYTICS_API_CONFIG: ${{ inputs.video_analytics_api_artifacts_config || vars.VSS_VIDEO_ANALYTICS_API_ARTIFACTS_PROMOTION_CONFIG_PATH }}
      BEHAVIOR_ANALYTICS_CONFIG: ${{ inputs.behavior_analytics_artifacts_config || vars.VSS_BEHAVIOR_ANALYTICS_ARTIFACTS_PROMOTION_CONFIG_PATH }}
      SDR_MW_L_CONFIG: ${{ inputs.sdr_mw_l_artifacts_config || vars.SDR_MW_L_ARTIFACTS_PROMOTION_CONFIG_PATH }}
      VSS_CONFIGURATOR_CONFIG: ${{ inputs.vss_configurator_artifacts_config || vars.VSS_CONFIGURATOR_ARTIFACTS_PROMOTION_CONFIG_PATH }}
      VSS_RT_CONFIG_ADAPTOR_CONFIG: ${{ inputs.vss_rt_config_adaptor_artifacts_config || vars.VSS_RT_CONFIG_ADAPTOR_ARTIFACTS_PROMOTION_CONFIG_PATH }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Select an accepted develop release set
        id: selected
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          REQUESTED_TAG: ${{ inputs.promotion_tag }}
        run: |
          python3 .github/scripts/prepare_nightly_promotion.py \
            --requested-sha "$REQUESTED_SHA" \
            --requested-tag "$REQUESTED_TAG"

      - name: Trigger GitLab test pipeline
        id: trigger
        run: python3 .github/scripts/trigger_downstream_pipeline.py

      - name: Poll test pipeline
        env:
          DOWNSTREAM_PIPELINE_ID: ${{ steps.trigger.outputs.pipeline_id }}
          DOWNSTREAM_PROJECT_ID: ${{ steps.trigger.outputs.project_id }}
          POLL_INTERVAL_SECONDS: "60"
          MAX_POLL_DURATION_SECONDS: "10800"
        run: python3 .github/scripts/poll-downstream-pipeline.py

      - name: Prepare promotion-only handoff
        run: |
          python3 .github/scripts/prepare_promotion_trigger.py \
            --test-pipeline-id "${{ steps.trigger.outputs.pipeline_id }}" \
            --agent-ui-config "$AGENT_UI_CONFIG" \
            --alert-config "$ALERT_CONFIG" \
            --video-analytics-api-config "$VIDEO_ANALYTICS_API_CONFIG" \
            --behavior-analytics-config "$BEHAVIOR_ANALYTICS_CONFIG" \
            --sdr-mw-l-config "$SDR_MW_L_CONFIG" \
            --vss-configurator-config "$VSS_CONFIGURATOR_CONFIG" \
            --vss-rt-config-adaptor-config "$VSS_RT_CONFIG_ADAPTOR_CONFIG"

      - name: Trigger GitLab promotion pipeline
        id: promotion-trigger
        run: python3 .github/scripts/trigger_downstream_pipeline.py

      - name: Poll promotion pipeline
        env:
          DOWNSTREAM_PIPELINE_ID: ${{ steps.promotion-trigger.outputs.pipeline_id }}
          DOWNSTREAM_PROJECT_ID: ${{ steps.promotion-trigger.outputs.project_id }}
          POLL_INTERVAL_SECONDS: "60"
          MAX_POLL_DURATION_SECONDS: "10800"
        run: python3 .github/scripts/poll-downstream-pipeline.py

      - name: Set up Buildx for validated alias
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Advance develop-validated
        run: |
          python3 .github/scripts/advance_ghcr_alias.py \
            --release-set .promotion/release-set.json \
            --alias develop-validated

      - name: Summarize validation
        run: |
          {
            echo "### GHCR nightly validation"
            echo "- source commit: \`${{ steps.selected.outputs.source_sha }}\`"
            echo "- immutable tag: \`${{ steps.selected.outputs.promotion_tag }}\`"
            echo "- release set: \`${{ steps.selected.outputs.release_set_id }}\`"
            echo "- GitLab test pipeline: \`#${{ steps.trigger.outputs.pipeline_iid }}\`"
            echo "- GitLab promotion pipeline: \`#${{ steps.promotion-trigger.outputs.pipeline_iid }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
