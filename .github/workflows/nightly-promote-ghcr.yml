name: Nightly promote accepted GHCR set

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Optional develop commit to promote (latest green when empty)"
        required: false
      promotion_tag:
        description: "Optional immutable tag assertion"
        required: false
      agent_ui_artifacts_config:
        description: "Optional agent/UI artifacts-promotion config path"
        required: false
      alert_artifacts_config:
        description: "Optional alert artifacts-promotion config path"
        required: false

concurrency:
  group: nightly-promote-ghcr
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  packages: write

defaults:
  run:
    shell: bash

jobs:
  promote:
    runs-on: [self-hosted, downstream-pipeline]
    timeout-minutes: 185
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DOWNSTREAM_CI_URL: ${{ secrets.DOWNSTREAM_CI_URL }}
      DOWNSTREAM_CI_TOKEN: ${{ secrets.DOWNSTREAM_CI_TOKEN }}
      DOWNSTREAM_PROJECT_PATH: ${{ secrets.DOWNSTREAM_PROJECT_PATH }}
      DOWNSTREAM_REF: ${{ vars.DOWNSTREAM_PROMOTION_REF || 'main' }}
      DOWNSTREAM_SUBMODULE_HASH_VARIABLE: VSS_SUBMODULE_HASH
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: develop
          fetch-depth: 0
          persist-credentials: false

      - name: Select an accepted develop release set
        id: selected
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_SHA: ${{ inputs.source_sha }}
          REQUESTED_TAG: ${{ inputs.promotion_tag }}
          AGENT_UI_CONFIG: ${{ inputs.agent_ui_artifacts_config || vars.VSS_AGENT_UI_ARTIFACTS_PROMOTION_CONFIG_PATH }}
          ALERT_CONFIG: ${{ inputs.alert_artifacts_config || vars.VSS_ALERT_ARTIFACTS_PROMOTION_CONFIG_PATH }}
        run: |
          python3 .github/scripts/prepare_nightly_promotion.py \
            --requested-sha "$REQUESTED_SHA" \
            --requested-tag "$REQUESTED_TAG" \
            --agent-ui-config "$AGENT_UI_CONFIG" \
            --alert-config "$ALERT_CONFIG"

      - name: Trigger digest-preserving GitLab promotion
        id: trigger
        run: python3 .github/scripts/trigger-downstream-pipeline.sh

      - name: Poll promotion pipeline
        env:
          DOWNSTREAM_PIPELINE_ID: ${{ steps.trigger.outputs.pipeline_id }}
          DOWNSTREAM_PROJECT_ID: ${{ steps.trigger.outputs.project_id }}
          POLL_INTERVAL_SECONDS: "60"
          MAX_POLL_DURATION_SECONDS: "10800"
        run: python3 .github/scripts/poll-downstream-pipeline.py

      - name: Set up Buildx for validated alias
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Advance develop-validated
        run: |
          python3 .github/scripts/advance_ghcr_alias.py \
            --release-set .promotion/release-set.json \
            --alias develop-validated

      - name: Summarize promotion
        run: |
          {
            echo "### GHCR → NGC promotion"
            echo "- source commit: \`${{ steps.selected.outputs.source_sha }}\`"
            echo "- immutable tag: \`${{ steps.selected.outputs.promotion_tag }}\`"
            echo "- release set: \`${{ steps.selected.outputs.release_set_id }}\`"
            echo "- GitLab pipeline: \`#${{ steps.trigger.outputs.pipeline_iid }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
