name: SonarQube Analysis

# No top-level `paths:` filter: GitHub evaluates that against the pushed
# commits, not the cumulative PR, and can skip this workflow on an
# unrelated follow-up push. The per-project gate lives in the `detect`
# job (detect_sonarqube_projects.py) and compares PR-base...HEAD.
#
# Protect develop currently requires SonarQube Scan (agent|ui|skills).
# Every catalogued scan still reports on PRs: untouched legs no-op, only a
# changed tree runs the scanner and can fail. Same pattern if more legs
# are added to the ruleset later.

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
  pull_request:
    branches:
      - main
      - develop
      - "release/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect SonarQube projects
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      any: ${{ steps.plan.outputs.any }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Plan SonarQube matrix
        id: plan
        run: |
          python3 .github/scripts/detect_sonarqube_projects.py \
            --event-name "${{ github.event_name }}" \
            --base-ref "${{ github.base_ref }}" \
            --pr-base-sha "${{ github.event.pull_request.base.sha }}" \
            --github-output "$GITHUB_OUTPUT"

  sonarqube:
    name: SonarQube Scan (${{ matrix.name }})
    needs: detect
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    if: >-
      needs.detect.outputs.any == 'true'
      && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}

    steps:
      - name: Skip scan for untouched project
        if: matrix.scan != 'true'
        run: |
          echo "No changes in ${{ matrix.name }}; reporting success without scanning."

      - name: Checkout source
        if: matrix.scan == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate SonarQube secrets
        if: matrix.scan == 'true'
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_HOST_URL" ]; then
            echo "SONAR_HOST_URL secret is required."
            exit 1
          fi
          if [ -z "$SONAR_TOKEN" ]; then
            echo "SONAR_TOKEN secret is required."
            exit 1
          fi

      - name: Write SonarQube configuration
        if: matrix.scan == 'true'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_BASE_REF: ${{ github.base_ref }}
          SONAR_PROJECT_KEY: ${{ matrix.project_key }}
          SONAR_PROJECT_NAME: ${{ matrix.project_name }}
          SONAR_SOURCES: ${{ matrix.sources }}
          SONAR_TESTS: ${{ matrix.tests }}
          SONAR_PYTHON_VERSION: ${{ matrix.python_version }}
        run: |
          exclusions="**/node_modules/**,**/.venv/**,**/__pycache__/**,**/.mypy_cache/**,**/.ruff_cache/**,**/dist/**,**/build/**,**/.next/**,**/coverage/**,**/__tests__/**,**/*.test.ts,**/*.test.tsx,**/*.test.js,**/*.test.jsx,**/*.spec.ts,**/*.spec.tsx,**/3rdparty/**"

          # Keep the agent's production and test scopes disjoint.
          if [ "$SONAR_PROJECT_NAME" = "video-search-and-summarization-agent" ]; then
            exclusions="${exclusions},services/agent/docker/**,services/agent/packages/*/tests/**"
          fi

          {
            echo "sonar.projectKey=${SONAR_PROJECT_KEY}"
            echo "sonar.projectName=${SONAR_PROJECT_NAME}"
            echo "sonar.projectVersion=1.0.0"
            echo "sonar.sourceEncoding=UTF-8"
            echo "sonar.scm.provider=git"
            echo "sonar.sources=${SONAR_SOURCES}"
            echo "sonar.exclusions=${exclusions}"
          } > sonar-project.properties

          if [ -n "$SONAR_TESTS" ]; then
            echo "sonar.tests=${SONAR_TESTS}" >> sonar-project.properties
          fi

          if [ -n "$SONAR_PYTHON_VERSION" ]; then
            echo "sonar.python.version=${SONAR_PYTHON_VERSION}" >> sonar-project.properties
          fi

          if [ "$SONAR_PROJECT_NAME" = "video-search-and-summarization-agent" ]; then
            echo "sonar.python.coverage.reportPaths=services/agent/coverage.xml,services/agent/coverage-lib.xml" >> sonar-project.properties
            # Keep in sync with [tool.coverage.run] omit in
            # services/agent/pyproject.toml. Files omitted there produce no
            # data in coverage.xml, so without a matching exclusion Sonar
            # counts every changed line in them as uncovered and fails the
            # new-code coverage gate. They are still analyzed for bugs,
            # code smells, and duplication.
            agent_coverage_exclusions=(
              "**/vss_core/knowledge/**"
              "**/agents/report_agent_old.py"
              "**/api/custom_fastapi_worker.py"
              "**/sitecustomize.py"
              "**/agents/top_agent.py"
              "**/agents/report_agent.py"
              "**/agents/multi_report_agent.py"
              "**/video_analytics/es_client.py"
              "**/tools/vst_files.py"
              "**/tools/vst_download.py"
              "**/tools/video_understanding.py"
              "**/tools/lvs_video_understanding.py"
              "**/tools/geolocation.py"
              "**/tools/s3_picture_url.py"
              "**/tools/incidents.py"
              "**/tools/template_report_gen.py"
              "**/tools/video_report_gen.py"
              "**/tools/report_gen.py"
              "**/tools/multi_incident_formatter.py"
              "**/tools/fov_counts_with_chart.py"
              "**/evaluators/report_evaluator/evaluate.py"
              "**/evaluators/customized_trajectory_evaluator/evaluate.py"
              "**/tools/evaluation_compressor.py"
              "**/tools/code_executor/docker_backend/docker_executor.py"
              "**/tools/code_executor/docker_backend/image_builder.py"
            )
            echo "sonar.coverage.exclusions=$(IFS=,; echo "${agent_coverage_exclusions[*]}")" >> sonar-project.properties
          fi

          if [ "$SONAR_PROJECT_NAME" = "metropolis-vss-alert-verification" ]; then
            echo "sonar.python.coverage.reportPaths=services/alert/coverage.xml" >> sonar-project.properties
          fi

          if [ "$SONAR_PROJECT_NAME" = "metropolis-vss-behavior-analytics" ]; then
            echo "sonar.python.coverage.reportPaths=services/analytics/behavior-analytics/coverage.xml" >> sonar-project.properties
            echo "sonar.python.xunit.reportPath=services/analytics/behavior-analytics/test/coverage/test-results.xml" >> sonar-project.properties
          fi

          if [ "$SONAR_PROJECT_NAME" = "metropolis-vss-video-analytics-api" ]; then
            echo "sonar.javascript.lcov.reportPaths=services/analytics/video-analytics-api/test/coverage/lcov.info" >> sonar-project.properties
          fi

          if [ "$SONAR_PROJECT_NAME" = "embedded-metropolis-sdr" ]; then
            echo "sonar.python.coverage.reportPaths=services/sdrc/coverage.xml" >> sonar-project.properties
            echo "sonar.python.xunit.reportPath=services/sdrc/test/coverage/test-results.xml" >> sonar-project.properties
          fi

          if [ "$SONAR_PROJECT_NAME" = "metropolis-vss-configurator" ]; then
            echo "sonar.python.coverage.reportPaths=services/configurators/vss-configurator/coverage.xml" >> sonar-project.properties
            echo "sonar.python.xunit.reportPath=services/configurators/vss-configurator/test/coverage/test-results.xml" >> sonar-project.properties
          fi

          if [ "$SONAR_PROJECT_NAME" = "metropolis-vss-rt-config-adaptor" ]; then
            echo "sonar.python.coverage.reportPaths=services/configurators/vss-rt-config-adaptor/coverage.xml" >> sonar-project.properties
            echo "sonar.python.xunit.reportPath=services/configurators/vss-rt-config-adaptor/test/coverage/test-results.xml" >> sonar-project.properties
          fi

          if [ "$SONAR_PROJECT_NAME" = "video-search-and-summarization-skills" ]; then
            # Skills helper scripts (skills/**/scripts/**) have no unit-test or
            # coverage harness in CI, so exclude them from the new-code coverage
            # gate. They are still analyzed for bugs, code smells, and duplication.
            echo "sonar.coverage.exclusions=skills/**/scripts/**" >> sonar-project.properties
            # The LVS benchmark intentionally uses plain-HTTP *local* endpoints
            # (LVS dev backend, LAN media server) that do not serve TLS, so the
            # S5332 clear-text-protocol hotspots on these two files are accepted.
            # Scoped to exactly these files so new http usage elsewhere still flags.
            {
              echo "sonar.issue.ignore.multicriteria=lvsbench1,lvsbench2"
              echo "sonar.issue.ignore.multicriteria.lvsbench1.ruleKey=python:S5332"
              echo "sonar.issue.ignore.multicriteria.lvsbench1.resourceKey=skills/benchmarking/benchmark-video-summarization/scripts/base.py"
              echo "sonar.issue.ignore.multicriteria.lvsbench2.ruleKey=shell:S5332"
              echo "sonar.issue.ignore.multicriteria.lvsbench2.resourceKey=skills/benchmarking/benchmark-video-summarization/scripts/fetch-videos.sh"
            } >> sonar-project.properties
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            {
              echo "sonar.pullrequest.key=${PR_NUMBER}"
              echo "sonar.pullrequest.branch=${PR_HEAD_REF}"
              echo "sonar.pullrequest.base=${PR_BASE_REF}"
            } >> sonar-project.properties
          elif [ -n "${GITHUB_REF_NAME:-}" ]; then
            echo "sonar.branch.name=${GITHUB_REF_NAME}" >> sonar-project.properties
          fi

          sed -E 's/(sonar.token|SONAR_TOKEN).*/[REDACTED]/g' sonar-project.properties

      - name: Install uv
        if: matrix.scan == 'true' && matrix.python_version != null
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.6.2"

      - name: Set up Python
        if: matrix.scan == 'true' && matrix.python_version != null
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python_version }}

      - name: Set up Node.js for Video Analytics API
        if: matrix.scan == 'true' && matrix.node_version != null
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node_version }}

      - name: Generate agent coverage
        if: matrix.scan == 'true' && matrix.name == 'agent'
        working-directory: services/agent
        run: |
          # The Sonar self-hosted runner cannot install system packages.
          # Coverage does not exercise PDF rendering, so skip pycairo/rlpycairo
          # instead of requiring cairo headers and pkg-config on the runner.
          uv sync --group dev --extra agent --extra cli --frozen --no-install-package pycairo --no-install-package rlpycairo
          uv run --no-sync pytest \
            --cov=packages/vss_agents/src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -m "not slow and not integration"

      - name: Generate lib coverage (NAT-free surface)
        if: matrix.scan == 'true' && matrix.name == 'agent'
        working-directory: services/agent
        run: |
          # Both packages, matching the same invocation in ci.yml. The
          # vss_cli tests already ran here, but without --cov for its source
          # tree none of its lines reached coverage-lib.xml, so Sonar counted
          # every changed vss_cli line as uncovered. That stayed invisible
          # while the package was small and surfaced as "2.9% Coverage on New
          # Code" the first time a PR added substantially to it.
          uv run --no-sync pytest packages/vss_core/tests/unit_test packages/vss_cli/tests/unit_test \
            --cov=packages/vss_core/src \
            --cov=packages/vss_cli/src \
            --cov-report=xml:coverage-lib.xml \
            --cov-report=term-missing \
            -m "not slow and not integration"

      - name: Install Alert MS test dependencies
        if: matrix.scan == 'true' && matrix.name == 'alert'
        working-directory: services/alert
        run: |
          uv venv --python "${{ matrix.python_version }}"
          uv pip install --python .venv/bin/python -r requirements.txt pytest pytest-asyncio pytest-cov

      - name: Generate Alert MS coverage
        if: matrix.scan == 'true' && matrix.name == 'alert'
        working-directory: services/alert
        run: |
          .venv/bin/pytest test/unit \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Generate Behavior Analytics coverage
        if: matrix.scan == 'true' && matrix.name == 'behavior-analytics'
        working-directory: services/analytics/behavior-analytics
        run: |
          python -m pip install --upgrade pip pipenv
          pipenv install --dev
          mkdir -p test/coverage
          pipenv run coverage run --source=src/mdx/analytics/core -m pytest tests/unit/ -v --junitxml=test/coverage/test-results.xml
          pipenv run coverage xml -o coverage.xml
          pipenv run coverage report

      - name: Generate Video Analytics API coverage
        if: matrix.scan == 'true' && matrix.name == 'video-analytics-api'
        working-directory: services/analytics/video-analytics-api
        run: |
          cd src/web-api-core && npm install && cd ../..
          cd src/app && npm install --save ../web-api-core && npm install && cd ../..
          cd test && npm install --save ../src/web-api-core && npm install --save ../src/app && npm install && npm run ci

      - name: Generate SDRC coverage
        if: matrix.scan == 'true' && matrix.name == 'sdr-mw-l'
        working-directory: services/sdrc
        run: |
          mkdir -p test/coverage
          uv run --python 3.10 --with pytest --with pytest-cov pytest tests/ -v --tb=short \
            --junitxml=test/coverage/test-results.xml \
            --cov=app \
            --cov=config \
            --cov=run_workloads \
            --cov=lib \
            --cov=envoy \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Generate VSS Configurator coverage
        if: matrix.scan == 'true' && matrix.name == 'vss-configurator'
        working-directory: services/configurators/vss-configurator
        run: |
          mkdir -p test/coverage
          uv venv --python 3.13
          uv pip install --python .venv/bin/python \
            pytest \
            pytest-cov \
            Flask==3.1.0 \
            requests==2.32.3 \
            ruamel.yaml==0.18.15
          .venv/bin/pytest tests/ -v --tb=short \
            --junitxml=test/coverage/test-results.xml \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Generate VSS RT Config Adaptor coverage
        if: matrix.scan == 'true' && matrix.name == 'vss-rt-config-adaptor'
        working-directory: services/configurators/vss-rt-config-adaptor
        run: |
          uv sync --python 3.13 --frozen --group dev
          mkdir -p test/coverage
          uv run --python 3.13 pytest tests/ -v --tb=short \
            --junitxml=test/coverage/test-results.xml \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing

      - name: Run SonarQube scanner
        if: matrix.scan == 'true'
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # This diagnostic never changes the scanner outcome. It only distinguishes
      # NVIDIA SonarQube/network outages from repository-specific findings so a
      # transient "No route to host" failure is not misrouted to code owners.
      - name: Classify SonarQube connectivity failure
        if: failure() && matrix.scan == 'true'
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: python3 .github/scripts/diagnose_sonarqube_failure.py

  # Always-run wrap-up so a PR that touches none of the scanned trees still
  # has a concluding check, and so a skipped matrix (empty / fork) is not
  # reported as a scan failure.
  sonarqube-gate:
    name: SonarQube
    needs: [detect, sonarqube]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check scan outcome
        env:
          DETECT: ${{ needs.detect.result }}
          SCAN: ${{ needs.sonarqube.result }}
        run: |
          set -euo pipefail
          if [ "$DETECT" != "success" ]; then
            echo "detect job result: $DETECT"
            exit 1
          fi
          # skipped = no matching projects, or a fork PR that cannot use secrets
          if [ "$SCAN" = "failure" ]; then
            echo "scan job result: $SCAN"
            exit 1
          fi
          echo "detect=$DETECT scan=$SCAN"
