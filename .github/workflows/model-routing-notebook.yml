# Model-routing notebook — end-to-end execution of
# deploy/docker/scripts/deploy_model_routing.ipynb via the notebook adapter:
# builds Switchyard from its pinned source ref, routes live requests across
# both targets, and validates the (undeployed) VSS repoint build. CPU-only —
# no GPU, no brev, no compose deploy.
#
# Same dispatch model as skills-eval.yml: mirror-branch push, with the diff
# gate done in-job against the cumulative head...base range (a top-level
# `paths:` filter only sees the pushed commits and silently skips on mirror
# merge commits).

name: Model Routing Notebook

on:
  push:
    branches:
      - "pull-request/[0-9]+"
  workflow_dispatch: {}

permissions:
  contents: read

# Manual dispatches must not cancel each other — same conditional-group
# shape as skills-eval.yml.
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch'
      && format('model-routing-notebook-manual-{0}', github.run_id)
      || format('model-routing-notebook-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    shell: bash

jobs:
  notebook:
    name: deploy_model_routing.ipynb end to end
    runs-on: [self-hosted, vss-skill-eval-runner]
    timeout-minutes: 45
    steps:
      - name: Checkout mirror head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate on the cumulative PR diff
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Derive the PR base from the mirror-branch number; fall back to
          # develop when the lookup fails (or on manual dispatch).
          base_branch="develop"
          pr_number="${GITHUB_REF_NAME#pull-request/}"
          if [[ "$pr_number" =~ ^[0-9]+$ ]]; then
            base_branch="$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" \
              --json baseRefName --jq .baseRefName 2>/dev/null || echo develop)"
          fi
          base="$(git merge-base "origin/$base_branch" HEAD)"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             || git diff --name-only "$base"...HEAD \
                  | grep -qE '^(deploy/docker/scripts/deploy_model_routing\.ipynb|\.github/skill-eval/model-routing/|\.github/workflows/model-routing-notebook\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No model-routing changes in the PR diff; skipping."
          fi

      - name: Reclaim stale leaked runtimes (shared coordinator disk)
        if: steps.gate.outputs.run == 'true'
        run: |
          # Every runner slot on the coordinator host shares one disk, and
          # per-job venvs leak: skills-eval jobs create theirs in runner.temp
          # with no always-cleanup, and the host has already hit ENOSPC hard
          # enough that the runner could not write its own diag log. Remove
          # leaked venvs older than 15h — past the longest job timeout on
          # this host (skills-eval legs: 840 minutes), so provably dead.
          df -h "$HOME" | tail -1
          find "$HOME"/actions-runner-*/_work/_temp -maxdepth 1 -mmin +900 \
            \( -name 'skill-eval-*' -o -name 'model-routing-*' \) \
            -exec rm -rf {} + 2>/dev/null || true
          python3 -m pip cache purge 2>/dev/null || true
          # The venv sweep alone recovered ~0.1G on a 125G disk at 100%; the
          # bulk is docker state (buildkit snapshots from interrupted builds
          # included). Prune only what is safe to lose: build cache older
          # than a day, dangling images, and containers that exited over a
          # day ago. Tagged images other jobs pinned are not touched.
          docker builder prune -af --filter until=24h 2>/dev/null || true
          docker image prune -f 2>/dev/null || true
          docker container prune -f --filter until=24h 2>/dev/null || true
          df -h "$HOME" | tail -1

      # The adapter is standard-library only: no jupyter stack, no pip
      # install, no venv. The host python3 is sufficient.
      - name: Set per-run isolation names
        if: steps.gate.outputs.run == 'true'
        run: |
          # Router port, container name, and work dir are all run-scoped:
          # concurrent PR runs share this host and must not stomp each other.
          # Published BEFORE any step that can fail, so the always-cleanup
          # step knows what to remove.
          {
            echo "ROUTER_CONTAINER=vss-model-router-ci-${{ github.run_id }}"
            echo "ROUTER_PORT=$((14000 + ${{ github.run_id }} % 1000))"
            echo "MODEL_ROUTING_WORK_DIR=/tmp/skill-eval/model-routing-${{ github.run_id }}"
          } >> "$GITHUB_ENV"

      - name: Run the notebook end to end
        if: steps.gate.outputs.run == 'true'
        run: |
          # The coordinator .env holds the existing NVIDIA inference key
          # (Anthropic-compatible name). Don't echo contents; the adapter
          # maps it and never writes it anywhere.
          set -a
          source /home/ubuntu/eval-coordinator/.env
          set +a
          python3 .github/skill-eval/model-routing/notebook_routing_adapter.py

      - name: Remove per-run state
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          [ -n "${ROUTER_CONTAINER:-}" ] && docker rm -f "$ROUTER_CONTAINER" 2>/dev/null || true
          [ -n "${MODEL_ROUTING_WORK_DIR:-}" ] && rm -rf "$MODEL_ROUTING_WORK_DIR" || true
