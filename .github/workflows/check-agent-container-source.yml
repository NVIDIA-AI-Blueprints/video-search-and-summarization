name: Check Agent Container Source

on:
  push:
    branches:
      - main
      - develop
      - "pull-request/[0-9]+"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: agent-container-source-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check vss-agent tag source
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0

      # Validate the gate helper itself — a regression here would silently
      # block every PR or skip a genuinely-drifted container, so fail loudly.
      - name: Unit-test the gate helper
        run: python3 .github/scripts/test_source_check_only_nonbuild.py

      # Resolve the PR's real target branch so the docs/tests-only gate below
      # diffs against the right base. This job runs on the pull-request/<N>
      # mirror (a push event, so github.base_ref is empty), so look the base up
      # from the PR. Without this the gate defaults to origin/develop, which
      # wrongly flags every docs-only PR that targets a divergent release branch
      # (e.g. dev/3.2.x diverges from develop, so its whole delta reads as
      # "build-relevant" and the SHA check runs and false-fails). Falls back to
      # origin/develop when the base can't be resolved.
      - name: Resolve PR base branch
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base_ref="origin/develop"
          if [[ "${GITHUB_REF_NAME}" =~ ^pull-request/([0-9]+)$ ]]; then
            pr="${BASH_REMATCH[1]}"
            target="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq '.base.ref' 2>/dev/null || true)"
            if [ -n "$target" ]; then base_ref="origin/${target}"; fi
          fi
          echo "base_ref=${base_ref}" >> "$GITHUB_OUTPUT"
          echo "Gate base branch: ${base_ref}"

      # Docs/tests-only PRs never change what enters the agent image — the
      # Dockerfile uses selective COPY — yet they change the services/agent
      # tree SHA and would trip the gate below. Detect that case and skip the
      # SHA comparison. The job still runs and reports success, so the required
      # status stays green. Durable fix: scope source_tree_sha to build inputs.
      - name: Detect docs/tests-only change
        id: filter
        continue-on-error: true  # fail safe: a helper error must not block PRs
        run: |
          # Any failure or non-"true" result falls through to the full check.
          if ! skip=$(python3 .github/scripts/source_check_only_nonbuild.py --image-name vss-agent --base-ref "${{ steps.base.outputs.base_ref }}"); then
            echo "filter helper failed; running the full source check." >&2
            skip=false
          fi
          [ "$skip" = "true" ] || skip=false
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      # Primary path reads com.nvidia.vss.source_tree_sha from the image's
      # OCI manifest annotations (stamped by ci-vss-oss at build time) via the
      # OCI Distribution HTTP API. NGC_CLI_API_KEY is needed to pull the
      # manifest from nvcr.io/nvidia; without it the registry returns 401
      # and the script falls back to git-SHA resolution.
      - name: Check vss-agent tag matches services/agent
        if: steps.filter.outputs.skip != 'true'
        env:
          NGC_CLI_API_KEY: ${{ secrets.NGC_CLI_API_KEY }}
        run: python3 .github/scripts/check_container_tag_source.py --image-name vss-agent
