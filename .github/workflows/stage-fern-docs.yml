# Publishes merged docs from develop to the develop instance, and from the
# highest stable release/X.Y.Z branch to staging. Other branches are skipped,
# including manual runs. Production remains in publish-fern-docs.yml.
# Requires the DOCS_FERN_TOKEN repo secret.

name: Stage Fern Docs

# Branch-owned docs substitutions. Each branch may set these explicitly,
# including a tag such as v3.3.0; site routing never derives or overrides them.
env:
  VSS_DOCS_GIT_REF: v3.3.0
  VSS_DOCS_IMAGE_TAG: 3.3.0
  VSS_DOCS_SBSA_IMAGE_TAG: 3.3.0-sbsa

on:
  workflow_dispatch: {}
  pull_request:
    types: [closed]
    branches:
      - develop
      - 'release/**'
    paths:
      - 'docs/**'
      - 'fern/**'
      - 'services/analytics/video-analytics-api/src/app/specification/openapi.json'
      - '.github/scripts/check_fern_substitutions.py'
      - '.github/scripts/prepare_fern_inputs.py'
      - '.github/scripts/select_fern_docs_target.py'
      - '.github/scripts/test_select_fern_docs_target.py'
      - '.github/workflows/stage-fern-docs.yml'

permissions:
  contents: read

jobs:
  route:
    name: Select docs instance
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.target.outputs.publish }}
      instance: ${{ steps.target.outputs.instance }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false

      - name: Test branch routing
        run: python3 .github/scripts/test_select_fern_docs_target.py

      - name: Select target from current remote branches
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_BRANCH: ${{ github.event.pull_request.base.ref || github.ref_name }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
            --jq '.[].name' > "${RUNNER_TEMP}/fern-branches.txt"
          python3 .github/scripts/select_fern_docs_target.py \
            --branch "$PUBLISH_BRANCH" \
            --branches-file "${RUNNER_TEMP}/fern-branches.txt" \
            --output "$GITHUB_OUTPUT"

  stage:
    name: Publish branch docs
    needs: route
    if: needs.route.outputs.publish == 'true'
    concurrency:
      # Only eligible publishers join the destination's queue, so skipped runs
      # cannot replace a pending upload.
      group: fern-stage-${{ needs.route.outputs.instance }}
      # Do not cancel an in-flight Fern upload. Killing the ledger mid-register
      # can leave the destination site incomplete until a later run succeeds.
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Install Fern CLI
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version fern/fern.config.json)
          if ! [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?|latest)$ ]]; then
            echo "::error::fern.config.json .version '$VERSION' is not a valid semver or 'latest'"
            exit 1
          fi
          npm install -g "fern-api@${VERSION}"

      - name: Prepare and check Fern inputs
        run: |
          python3 .github/scripts/prepare_fern_inputs.py --output "${RUNNER_TEMP}/fern-input"
          python3 .github/scripts/check_fern_substitutions.py --root "${RUNNER_TEMP}/fern-input"

      - name: Stage docs
        working-directory: ${{ runner.temp }}/fern-input
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
          INSTANCE: ${{ needs.route.outputs.instance }}
        run: |
          set -eo pipefail
          ATTEMPTS=3
          URL=""
          for i in $(seq 1 "$ATTEMPTS"); do
            echo "::group::fern generate attempt $i/$ATTEMPTS"
            if fern generate --docs --instance "$INSTANCE" --force 2>&1 | tee /tmp/fern-output.log; then
              URL=$(grep -oP 'Published docs to \K.*(?= \()' /tmp/fern-output.log || true)
            fi
            echo "::endgroup::"
            if [ -n "$URL" ]; then
              break
            fi
            echo "Stage failed on attempt $i/$ATTEMPTS"
            if [ "$i" -lt "$ATTEMPTS" ]; then
              sleep $((i * 20))
            fi
          done
          if [ -z "$URL" ]; then
            echo "::error::Failed to stage docs after ${ATTEMPTS} attempts. See fern output above."
            exit 1
          fi
          echo "### Staged: [$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"
