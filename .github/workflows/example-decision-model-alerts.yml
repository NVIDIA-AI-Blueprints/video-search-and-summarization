name: Decision-model alerts example

# Follow the vetted PR mirror convention used by ci.yml. No deployment secrets
# or model downloads are needed: these are CPU tests and a standalone UI build.
"on":
  push:
    branches: [main, develop, "pull-request/[0-9]+"]
    paths:
      - "deploy/docker/examples/decision-model-alerts/**"
      - "deploy/docker/test-scripts/test-decision-model-alerts-example.sh"
      - "deploy/docker/test-scripts/test_d1_bootstrap.py"
      - "deploy/docker/compose.yml"
      - "deploy/docker/containers.env"
      - "deploy/docker/services/**"
      - ".github/workflows/example-decision-model-alerts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref_name, 'pull-request/') }}

jobs:
  example:
    name: Example configuration, runtime tests and UI image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install CPU test dependencies
        run: >-
          python -m pip install
          -r deploy/docker/examples/decision-model-alerts/runtime/requirements.txt
          pytest==9.1.1
      - name: Validate RTSP and MP4 deployment configuration
        run: bash deploy/docker/test-scripts/test-decision-model-alerts-example.sh
      - name: Test runtime and bootstrap without models
        env:
          PYTHONPATH: deploy/docker/examples/decision-model-alerts/runtime
        run: >-
          python -m pytest -q
          deploy/docker/examples/decision-model-alerts/runtime/tests
          deploy/docker/test-scripts/test_d1_bootstrap.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: deploy/docker/examples/decision-model-alerts/ui/package-lock.json
      - name: Install the example UI dependencies
        working-directory: deploy/docker/examples/decision-model-alerts/ui
        run: npm ci
      - name: Test and typecheck the example UI
        working-directory: deploy/docker/examples/decision-model-alerts/ui
        run: |
          npm test -- --runInBand
          npm run typecheck
      - name: Build the standalone UI image
        run: >-
          docker build
          --tag decision-model-alerts-ui:ci
          deploy/docker/examples/decision-model-alerts/ui
