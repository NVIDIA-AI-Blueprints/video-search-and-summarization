# Publishes the Fern documentation site to production
# (nvidia-vss.docs.buildwithfern.com/vss and docs.nvidia.com/vss).
#
# Staging is a separate workflow: stage-fern-docs.yml.
# After docs.yml lists more than one instance, this job must pass --instance
# so it cannot publish to nvidia-vss-staging by accident.
#
# Runs on a published GitHub Release, or manually. On a release event GitHub
# already points the checkout at refs/tags/<tag>, so this publishes exactly the
# tagged content without naming a branch.
#
# Docs versioning (a version picker on the site, serving frozen content per
# release) is deliberately not here. It needs a release tag cut *after* the docs
# landed, plus a fern/docs.yml restructured around `products:`. Neither exists
# yet. See the follow-up issue.
#
# Requires the DOCS_FERN_TOKEN repo secret.

name: Publish Fern Docs

# The docs substitute three values into every `git checkout` and image-tag line
# (VSS_DOCS_GIT_REF, VSS_DOCS_IMAGE_TAG, VSS_DOCS_SBSA_IMAGE_TAG; see
# .github/scripts/check_fern_substitutions.py). They are derived from the ref
# that triggered the publish, never written down here: a release publishes the
# docs for its tag (`git checkout v3.3.0`, image tag `3.3.0`), and only a manual
# run with no tag publishes the develop docs (`develop`, `develop-latest`).
# Hard-coding develop here once made the 3.2.1 release docs tell readers to
# check out develop and pull develop-latest.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish the docs for this release tag (vX.Y.Z). Leave empty to publish the develop docs."
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: fern-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # A release event checks out its tag by default; a manual run naming a
          # tag publishes that tag's docs, not whatever branch the button was
          # pressed on.
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false

      # Release image tags are the bare version (`3.3.0`, `3.3.0-sbsa`), so only
      # a release tag of that shape can be published: a pre-release tag such as
      # v3.3.0rc0 names no published image and is refused rather than pointing
      # readers at a tag that does not exist.
      - name: Derive the docs substitutions from the release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="${RELEASE_TAG:-${INPUT_RELEASE_TAG:-}}"
          if [ -z "$tag" ]; then
            ref=develop
            image=develop-latest
          else
            if ! printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::'${tag}' is not a release tag (vX.Y.Z); release docs name the images published under that version"
              exit 1
            fi
            ref="$tag"
            image="${tag#v}"
          fi
          echo "docs will substitute: VSS_DOCS_GIT_REF=${ref} VSS_DOCS_IMAGE_TAG=${image} VSS_DOCS_SBSA_IMAGE_TAG=${image}-sbsa"
          {
            echo "VSS_DOCS_GIT_REF=${ref}"
            echo "VSS_DOCS_IMAGE_TAG=${image}"
            echo "VSS_DOCS_SBSA_IMAGE_TAG=${image}-sbsa"
          } >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Install Fern CLI
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version fern/fern.config.json)
          if ! [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?|latest)$ ]]; then
            echo "::error::fern.config.json .version '$VERSION' is not a valid semver or 'latest'"
            exit 1
          fi
          npm install -g "fern-api@${VERSION}"

      - name: Prepare and check Fern inputs
        run: |
          python3 .github/scripts/prepare_fern_inputs.py --output "${RUNNER_TEMP}/fern-input"
          python3 .github/scripts/check_fern_substitutions.py --root "${RUNNER_TEMP}/fern-input"

      - name: Publish docs
        working-directory: ${{ runner.temp }}/fern-input
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
        run: |
          set -eo pipefail
          ATTEMPTS=3
          URL=""
          for i in $(seq 1 "$ATTEMPTS"); do
            echo "::group::fern generate attempt $i/$ATTEMPTS"
            if fern generate --docs --instance nvidia-vss.docs.buildwithfern.com/vss 2>&1 | tee /tmp/fern-output.log; then
              URL=$(grep -oP 'Published docs to \K.*(?= \()' /tmp/fern-output.log || true)
            fi
            echo "::endgroup::"
            if [ -n "$URL" ]; then
              break
            fi
            echo "Publish failed on attempt $i/$ATTEMPTS"
            if [ "$i" -lt "$ATTEMPTS" ]; then
              sleep $((i * 20))
            fi
          done
          if [ -z "$URL" ]; then
            echo "::error::Failed to publish docs after ${ATTEMPTS} attempts. See fern output above."
            exit 1
          fi
          echo "### Published: [$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"
