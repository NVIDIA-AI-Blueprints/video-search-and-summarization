# One production site is assembled from develop and the branches listed in its
# fern/docs.yml. Every docs push to develop or release/** rebuilds it when the
# source branch is listed. Release branches carry this workflow independently;
# they never need to merge into develop. Merge the source-preparation PR first,
# then the develop PR which registers that branch. Before develop is ready,
# release pushes skip production safely but still produce a release preview.
# Requires DOCS_FERN_TOKEN.

name: Publish Fern Docs

on:
  push:
    branches:
      - develop
      - 'release/**'
    paths:
      - 'docs/**'
      - 'fern/**'
      - 'services/analytics/video-analytics-api/src/app/specification/openapi.json'
      - '.github/scripts/build_fern_site.py'
      - '.github/scripts/check_fern_site.sh'
      - '.github/scripts/publish_fern_docs.sh'
      - '.github/actions/setup-fern/**'
      - '.github/workflows/publish-fern-docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fern-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout develop
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: develop
          persist-credentials: false

      - name: Select configured source branch
        id: target
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ ! -f .github/scripts/build_fern_site.py ]; then
            echo "::notice::Develop has not adopted branch assembly yet; skipping production"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 - <<'PYTHON'
          import importlib.util
          import os
          import sys
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("build_fern_site", ".github/scripts/build_fern_site.py")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          versions = module.parse_versions(Path("fern/docs.yml").read_text())
          source = os.environ["REF_NAME"]
          publish = os.environ["EVENT_NAME"] == "workflow_dispatch" or source == "develop" or any(v.branch == source for v in versions)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"publish={str(publish).lower()}", file=output)
          if not publish:
              print(f"::notice::{source} is not listed on develop; skipping production")
          PYTHON

      - name: Set up Fern CLI
        if: steps.target.outputs.publish == 'true'
        uses: ./.github/actions/setup-fern

      - name: Build Fern site
        if: steps.target.outputs.publish == 'true'
        run: |
          set -euo pipefail
          python3 .github/scripts/build_fern_site.py --fetch \
            --output "${RUNNER_TEMP}/fern-site" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check Fern site
        if: steps.target.outputs.publish == 'true'
        working-directory: ${{ runner.temp }}/fern-site
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}   # enables the redirects check
        run: '"${GITHUB_WORKSPACE}/.github/scripts/check_fern_site.sh"'

      - name: Publish docs
        if: steps.target.outputs.publish == 'true'
        working-directory: ${{ runner.temp }}/fern-site
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
        run: |
          if ! "${GITHUB_WORKSPACE}/.github/scripts/publish_fern_docs.sh"; then
            echo "::error::Failed to publish docs. See fern output above."
            exit 1
          fi
