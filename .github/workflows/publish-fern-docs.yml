# Publishes the Fern documentation site to production, the instance and custom
# domain in fern/docs.yml. Release branches and PRs use named previews instead
# (preview-release-docs.yml, fern-docs-ci.yml).
#
# The workflow always checks out develop, but only for fern/docs.yml (which
# versions to publish) and the build scripts. build_fern_site.py turns that
# list into one Fern tree, with page content from:
#   - Dev: the develop checkout, stamped `develop` / `develop-latest`;
#   - each listed release tag vX.Y.Z: `git archive` of that tag's docs/,
#     stamped `vX.Y.Z` / `X.Y.Z` / `X.Y.Z-sbsa`. The first listed version is
#     the default and serves the unversioned URLs.
# Publishing a release does not require merging its release branch into
# develop; only the `ref: vX.Y.Z` entry has to be on develop.
#
# Triggers:
#   - push to develop touching the docs: refreshes Dev (releases are rebuilt
#     unchanged from their immutable tags);
#   - push of a release tag vX.Y.Z: publishes that release, which must already
#     be listed in fern/docs.yml on develop (the build fails otherwise);
#   - workflow_dispatch: republish.
# A tag push runs this file from the tagged commit, so release branches must
# carry this version of the workflow before they are tagged.
#
# Requires the DOCS_FERN_TOKEN repo secret.

name: Publish Fern Docs

on:
  push:
    branches: [develop]
    tags:
      # Release tags only; the resolve step re-validates with a strict regex,
      # so pre-release tags such as v3.4.0rc0 are refused.
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths:
      - 'docs/**'
      - 'fern/**'
      - 'services/analytics/video-analytics-api/src/app/specification/openapi.json'
      - '.github/scripts/build_fern_site.py'
      - '.github/scripts/check_fern_site.sh'
      - '.github/scripts/publish_fern_docs.sh'
      - '.github/actions/setup-fern/**'
      - '.github/workflows/publish-fern-docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fern-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout develop
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: develop
          persist-credentials: false

      - name: Resolve the released tag
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          RELEASE_TAG=""
          if [ "$REF_TYPE" = "tag" ]; then
            RELEASE_TAG="$REF_NAME"
            if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::'${RELEASE_TAG}' is not a release tag (vX.Y.Z); nothing to publish"
              exit 1
            fi
          fi
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Fern CLI
        uses: ./.github/actions/setup-fern

      - name: Build Fern site
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          ARGS=(--fetch --output "${RUNNER_TEMP}/fern-site")
          if [ -n "$RELEASE_TAG" ]; then ARGS+=(--require-tag "$RELEASE_TAG"); fi
          python3 .github/scripts/build_fern_site.py "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check Fern site
        working-directory: ${{ runner.temp }}/fern-site
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}   # enables the redirects check
        run: '"${GITHUB_WORKSPACE}/.github/scripts/check_fern_site.sh"'

      - name: Publish docs
        working-directory: ${{ runner.temp }}/fern-site
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
        run: |
          if ! "${GITHUB_WORKSPACE}/.github/scripts/publish_fern_docs.sh"; then
            echo "::error::Failed to publish docs. See fern output above."
            exit 1
          fi
