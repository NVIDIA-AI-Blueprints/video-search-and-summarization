# Publishes the Fern documentation site to production
# (nvidia-vss.docs.buildwithfern.com/vss and docs.nvidia.com/vss), the only
# Fern instance. Release branches and PRs use named previews instead
# (preview-release-docs.yml, fern-docs-ci.yml).
#
# The site is always built from develop: its fern/docs.yml lists the published
# versions. build_fern_site.py turns that list into one Fern tree:
#   - Dev: the develop checkout, stamped `develop` / `develop-latest`;
#   - each listed release tag vX.Y.Z: its docs from the tag, stamped
#     `vX.Y.Z` / `X.Y.Z` / `X.Y.Z-sbsa`. The first listed version is the
#     default and serves the unversioned URLs.
#
# Triggers:
#   - push to develop touching the docs: refreshes Dev (releases are rebuilt
#     unchanged from their immutable tags);
#   - push of a release tag vX.Y.Z: publishes that release, which must already
#     be listed in fern/docs.yml on develop (the build fails otherwise). The
#     content still comes from develop plus the listed tags, never from the
#     tagged commit's checkout;
#   - workflow_dispatch: republish.
# A tag push runs this file from the tagged commit, so release branches must
# carry this version of the workflow before they are tagged.
#
# Requires the DOCS_FERN_TOKEN repo secret.

name: Publish Fern Docs

on:
  push:
    branches: [develop]
    tags:
      # Release tags only; the resolve step re-validates with a strict regex,
      # so pre-release tags such as v3.4.0rc0 are refused.
      - 'v[0-9]+.[0-9]+.[0-9]+'
    paths:
      - 'docs/**'
      - 'fern/**'
      - 'services/analytics/video-analytics-api/src/app/specification/openapi.json'
      - '.github/scripts/build_fern_site.py'
      - '.github/workflows/publish-fern-docs.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fern-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout develop
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: develop
          persist-credentials: false

      - name: Resolve the released tag
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          RELEASE_TAG=""
          if [ "$REF_TYPE" = "tag" ]; then
            RELEASE_TAG="$REF_NAME"
            if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::'${RELEASE_TAG}' is not a release tag (vX.Y.Z); nothing to publish"
              exit 1
            fi
          fi
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Install Fern CLI
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version fern/fern.config.json)
          if ! [[ "$VERSION" =~ ^([0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?|latest)$ ]]; then
            echo "::error::fern.config.json .version '$VERSION' is not a valid semver or 'latest'"
            exit 1
          fi
          npm install -g "fern-api@${VERSION}"

      - name: Build Fern site
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          ARGS=(--fetch --output "${RUNNER_TEMP}/fern-site")
          if [ -n "$RELEASE_TAG" ]; then ARGS+=(--require-tag "$RELEASE_TAG"); fi
          python3 .github/scripts/build_fern_site.py "${ARGS[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish docs
        working-directory: ${{ runner.temp }}/fern-site
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
        run: |
          set -eo pipefail
          ATTEMPTS=3
          URL=""
          for i in $(seq 1 "$ATTEMPTS"); do
            echo "::group::fern generate attempt $i/$ATTEMPTS"
            if fern generate --docs --instance nvidia-vss.docs.buildwithfern.com/vss 2>&1 | tee /tmp/fern-output.log; then
              URL=$(grep -oP 'Published docs to \K.*(?= \()' /tmp/fern-output.log || true)
            fi
            echo "::endgroup::"
            if [ -n "$URL" ]; then
              break
            fi
            echo "Publish failed on attempt $i/$ATTEMPTS"
            if [ "$i" -lt "$ATTEMPTS" ]; then
              sleep $((i * 20))
            fi
          done
          if [ -z "$URL" ]; then
            echo "::error::Failed to publish docs after ${ATTEMPTS} attempts. See fern output above."
            exit 1
          fi
          echo "### Published: [$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"
