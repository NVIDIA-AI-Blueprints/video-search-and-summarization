#
# Builds the eval-harness sandbox images from vss-agent/sandboxes/ and publishes
# them to GHCR. The base is published first; the agent variants build FROM the
# freshly published base so a catalog change never depends on a locally built image.

name: Sandbox Images

on:
  push:
    branches: [main, develop]
    paths:
      - "vss-agent/sandboxes/**"
      - ".github/workflows/sandbox-images.yml"
  pull_request:
    paths:
      - "vss-agent/sandboxes/**"
      - ".github/workflows/sandbox-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sandbox-images-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  BASE_NAME: ${{ github.repository_owner }}/vss/vss-harness-base

jobs:
  base:
    name: Build & push vss-harness-base
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # PRs from forks get no package write token: build only, never push.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BASE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr

      - name: Build (and push on branch builds)
        uses: docker/build-push-action@v6
        with:
          context: vss-agent/sandboxes
          file: vss-agent/sandboxes/base.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: ref
        run: |
          echo "image=${REGISTRY}/${BASE_NAME}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

  variants:
    name: Build & push ${{ matrix.variant }}
    needs: base
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: [openclaw, openclaw-vss-cli, hermes, codex, pi]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/vss/vss-harness-${{ matrix.variant }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr

      # On PRs the base is not pushed, so build it locally into the buildx cache
      # and point the variant at that; on branch builds use the published base.
      - name: Resolve base image
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            docker buildx build --load -t vss-harness-base:pr \
              -f vss-agent/sandboxes/base.Dockerfile vss-agent/sandboxes
            echo "image=vss-harness-base:pr" >> "$GITHUB_OUTPUT"
          else
            echo "image=${{ needs.base.outputs.image }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build (and push on branch builds)
        uses: docker/build-push-action@v6
        with:
          context: vss-agent/sandboxes
          file: vss-agent/sandboxes/${{ matrix.variant }}.Dockerfile
          build-args: BASE_IMAGE=${{ steps.base.outputs.image }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
