# Fern docs CI. Runs on the copy-pr-bot mirror branches, which is how every
# other PR-time workflow in this repo is triggered (see skills-review.yml).
#
# Why push-to-pull-request/* and not pull_request:
#   - push events read the workflow file from the pushed branch, so this works
#     from develop today. No dependency on the file reaching the default branch.
#   - the mirror branch lives in this repo, so secrets are available, including
#     for PRs opened from forks. pull_request cannot do that.
#
# Both jobs build the full multi-version site with build_fern_site.py: the PR
# checkout is the Dev version (or "X.Y.Z (preview)" when the PR targets
# release/X.Y.Z), plus every release tag listed in fern/docs.yml. Every Fern
# command runs in that built tree, never in the checkout.
#
# Requires the DOCS_FERN_TOKEN repo secret.

name: Fern Docs CI

on:
  push:
    branches:
      - "pull-request/[0-9]+"   # copy-pr-bot mirror branches
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: fern-docs-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Trigger-level `paths:` filters are unreliable on push, because GitHub
  # evaluates them against the diff of the pushed commits rather than the
  # cumulative PR. Gate on an explicit diff instead, same as skills-eval.yml.
  changed-files:
    name: Detect docs changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for docs changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # Default to running. Skipping on a bad diff would hide real changes.
          DOCS=true
          if [ "$EVENT_NAME" = "push" ] && \
             [ -n "$BEFORE" ] && \
             [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && \
             git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            if git diff --name-only "$BEFORE" HEAD | grep -qE \
              -e '^(docs/|fern/)' \
              -e '^services/analytics/video-analytics-api/src/app/specification/openapi\.json$' \
              -e '^\.github/scripts/((test_)?build_fern_site\.py|test_publish_fern_docs\.py|resolve_fern_docs_context\.sh|(check_fern_site|publish_fern_docs)\.sh)$' \
              -e '^\.github/actions/setup-fern/' \
              -e '^\.github/workflows/(fern-docs-ci|preview-release-docs|publish-fern-docs)\.yml$'; then
              DOCS=true
            else
              DOCS=false
            fi
          fi
          echo "docs=$DOCS" >> "$GITHUB_OUTPUT"
          echo "docs changed: $DOCS"

  fern-check:
    name: Fern Check
    needs: changed-files
    if: needs.changed-files.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Fern CLI
        uses: ./.github/actions/setup-fern

      - name: Test the site build and publish scripts
        run: |
          python3 .github/scripts/test_build_fern_site.py
          python3 .github/scripts/test_publish_fern_docs.py

      - name: Resolve PR context
        id: pr
        env:
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/resolve_fern_docs_context.sh

      - name: Build Fern site
        env:
          RELEASE: ${{ steps.pr.outputs.release }}
        run: |
          set -euo pipefail
          ARGS=(--fetch --output "${RUNNER_TEMP}/fern-site")
          if [ -n "$RELEASE" ]; then ARGS+=(--release "$RELEASE"); fi
          python3 .github/scripts/build_fern_site.py "${ARGS[@]}"

      - name: Check Fern site
        working-directory: ${{ runner.temp }}/fern-site
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}   # enables the redirects check
        run: '"${GITHUB_WORKSPACE}/.github/scripts/check_fern_site.sh"'

  # Preview is a separate job so a Fern ledger/upload flake cannot fail the
  # required "Fern Check" status. publish_fern_docs.sh retries Fern's upload
  # flakes; a preview that still fails only warns.
  fern-preview:
    name: Fern Preview
    needs: [changed-files, fern-check]
    if: needs.changed-files.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve PR context
        id: pr
        env:
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/resolve_fern_docs_context.sh

      - name: Set up Fern CLI
        uses: ./.github/actions/setup-fern

      - name: Build Fern site
        env:
          RELEASE: ${{ steps.pr.outputs.release }}
        run: |
          set -euo pipefail
          ARGS=(--fetch --output "${RUNNER_TEMP}/fern-site")
          if [ -n "$RELEASE" ]; then ARGS+=(--release "$RELEASE"); fi
          python3 .github/scripts/build_fern_site.py "${ARGS[@]}"

      - name: Generate preview URL
        id: generate-docs
        working-directory: ${{ runner.temp }}/fern-site
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # A PR keeps one stable preview; a manual run without a PR gets an ID
          # Fern generates.
          ARGS=(--preview)
          if [ -n "$PR_NUMBER" ]; then ARGS+=("pr-${PR_NUMBER}"); fi
          if ! "${GITHUB_WORKSPACE}/.github/scripts/publish_fern_docs.sh" "${ARGS[@]}"; then
            echo "::warning::Failed to generate a preview URL. Fern Check still passed."
          fi

      - name: Build page links for changed files
        id: page-links
        if: steps.pr.outputs.number != '' && steps.generate-docs.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
          PREVIEW_URL: ${{ steps.generate-docs.outputs.url }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          CHANGED_FILES=$(gh pr view "$PR_NUMBER" --json files -q '.files[].path' \
            | grep -E '\.mdx?$' | paste -sd, - || true)

          if [ -z "$CHANGED_FILES" ] || [ -z "$PREVIEW_URL" ]; then
            echo "page_links=" >> "$GITHUB_OUTPUT"; exit 0
          fi

          BASE_URL="${PREVIEW_URL%/}"
          FILES_PARAM=$(printf '%s' "$CHANGED_FILES" \
            | python3 -c "import sys, urllib.parse; print(urllib.parse.quote(sys.stdin.read().strip(), safe=',/'))")
          RESPONSE=$(curl -sf -H "FERN_TOKEN: $FERN_TOKEN" \
            "${PREVIEW_URL}/api/fern-docs/get-slug-for-file?files=${FILES_PARAM}" 2>/dev/null) || {
            echo "page_links=" >> "$GITHUB_OUTPUT"; exit 0
          }

          PAGE_LINKS=$(echo "$RESPONSE" | jq -r --arg url "$BASE_URL" \
            '.mappings[] | select(.slug != null) | "- [\(.slug)](\($url)/\(.slug))"')

          if [ -n "$PAGE_LINKS" ]; then
            { echo "page_links<<PLEOF"; echo "$PAGE_LINKS"; echo "PLEOF"; } >> "$GITHUB_OUTPUT"
          else
            echo "page_links=" >> "$GITHUB_OUTPUT"
          fi

      - name: Post or update PR comment
        if: steps.pr.outputs.number != '' && steps.generate-docs.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_URL: ${{ steps.generate-docs.outputs.url }}
          PAGE_LINKS: ${{ steps.page-links.outputs.page_links }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          MARKER="<!-- preview-docs -->"
          {
            printf ':herb: **Preview your docs:** <%s>\n' "$PREVIEW_URL"
            if [ -n "${PAGE_LINKS:-}" ]; then
              printf '\nPages you changed:\n%s\n' "$PAGE_LINKS"
            fi
            printf '\n%s\n' "$MARKER"
          } > /tmp/comment.md

          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api "repos/${REPO}/issues/comments/${COMMENT_ID}" -X PATCH -F body=@/tmp/comment.md
          else
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" -F body=@/tmp/comment.md
          fi
