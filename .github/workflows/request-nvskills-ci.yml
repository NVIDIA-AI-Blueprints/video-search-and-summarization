# Team-side stub workflow for NVSkills CI.
#
# The dispatch + signing logic lives in NVIDIA/nvskills-ci's reusable
# workflow; this file only wires the trigger events and forwards the
# dispatch token. Mirrors NVIDIA/nvskills-ci-test/.github/workflows/
# request-nvskills-ci.yml.
#
# See: https://nvidia.atlassian.net/wiki/spaces/GAIT/pages/3483240468

name: Request NVSkills CI

on:
  issue_comment:
    types: [created]
  push:

jobs:
  request:
    if: >
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/nvskills-ci')) ||
      (github.event_name == 'push' &&
        github.actor == (vars.NVSKILLS_SIGNATURE_PUSH_ACTOR || 'nv-nvskill-ci[bot]') &&
        startsWith(github.event.head_commit.message, vars.NVSKILLS_SIGNATURE_COMMIT_TITLE || 'Attach NVSkills validation signatures'))
    permissions:
      contents: read
      pull-requests: read
    uses: NVIDIA/nvskills-ci/.github/workflows/team-request.yml@main
    secrets:
      NVSKILLS_CI_DISPATCH_TOKEN: ${{ secrets.NVSKILLS_CI_DISPATCH_TOKEN }}
