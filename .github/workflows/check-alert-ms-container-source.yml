name: Check Alert-ms Container Source

on:
  push:
    branches:
      - main
      - develop
      - "pull-request/[0-9]+"

permissions:
  contents: read

concurrency:
  group: alert-ms-container-source-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check alert-ms tag source
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0

      # Validate the gate helper itself — a regression here would silently
      # block every PR or skip a genuinely-drifted container, so fail loudly.
      - name: Unit-test the gate helper
        run: python3 .github/scripts/test_source_check_only_nonbuild.py

      # Docs/tests-only PRs never change what enters the alert image — the
      # .dockerignore drops them from the `COPY . /app` build context — yet they
      # change the services/alert tree SHA and would trip the gate below. Detect
      # that case and skip the SHA comparison. The job still runs and reports
      # success, so the required status stays green.
      - name: Detect docs/tests-only change
        id: filter
        continue-on-error: true  # fail safe: a helper error must not block PRs
        run: |
          # Any failure or non-"true" result falls through to the full check.
          if ! skip=$(python3 .github/scripts/source_check_only_nonbuild.py --image-name vss-alert-ms); then
            echo "filter helper failed; running the full source check." >&2
            skip=false
          fi
          [ "$skip" = "true" ] || skip=false
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      # Primary path reads com.nvidia.vss.source_tree_sha from the image's
      # OCI manifest annotations (stamped by ci-vss-oss at build time) via the
      # OCI Distribution HTTP API. The alert image is published as alert-ms but
      # the deploy stack still pins the released vss-alert-verification basename;
      # the gate recognizes both. NGC_CLI_API_KEY is needed to pull the manifest
      # from nvcr.io; without it the registry returns 401 and the script falls
      # back to git-SHA resolution.
      - name: Check alert-ms tag matches services/alert
        if: steps.filter.outputs.skip != 'true'
        continue-on-error: true
        env:
          NGC_CLI_API_KEY: ${{ secrets.NGC_CLI_API_KEY }}
        run: python3 .github/scripts/check_container_tag_source.py --image-name vss-alert-ms
