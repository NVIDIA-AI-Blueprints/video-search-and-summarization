#
# Immutable GHCR candidate builds (I-06 of the container release flow).
#
# Builds the changed first-party images (per deploy/docker/container-inventory.json,
# ghcr_build: true) into GHCR under IMMUTABLE tags — pr-<N>-<sha12> for
# pull-request/N branches, develop-<sha12> for develop — updates the matching
# pr-<N>-latest/develop-latest developer alias, and assembles a
# release-set manifest (deploy/docker/release-set.schema.json) recording every
# in-scope image as built or explicitly reused.
#
# Deliberate properties:
#   * Moving aliases are developer conveniences only. Release sets and nightly
#     promotion always use the immutable tag + digest.
#   * NO NGC credentials live in GitHub. The nightly GitHub controller selects
#     a green release set, then GitLab copies those same digests to NGC.
#   * The com.nvidia.vss.source_tree_sha label carries the git TREE hash of
#     the source folder (git rev-parse HEAD:<source_path>) — the exact value
#     the check-*-container-source gate compares. A post-push verification
#     reads it back through the same code path as the gate.
#   * Candidate tags are immutable: the preflight guard refuses to overwrite
#     an existing tag with different content and no-ops on idempotent re-runs.
#   * Trust boundary: this workflow runs on `push` to develop and to the
#     repo-local pull-request/N mirror branches (created by repo automation
#     after vetting), never directly on fork pull_request events, so
#     packages:write is never exposed to unreviewed fork code.

name: Build Dev Images (GHCR)

on:
  push:
    branches:
      - develop
      - "pull-request/[0-9]+"

concurrency:
  group: build-dev-images-${{ github.ref }}
  # Develop publication is a serialized post-merge operation. PR rebuilds may
  # still cancel stale in-flight work, but develop must never race/cancel.
  cancel-in-progress: ${{ github.ref_name != 'develop' }}

defaults:
  run:
    shell: bash

permissions:
  contents: read
  packages: write

jobs:
  changes:
    name: Detect changed first-party images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      count: ${{ steps.detect.outputs.count }}
      standard-matrix: ${{ steps.detect.outputs.standard_matrix }}
      standard-count: ${{ steps.detect.outputs.standard_count }}
      native-matrix: ${{ steps.detect.outputs.native_matrix }}
      native-platform-matrix: ${{ steps.detect.outputs.native_platform_matrix }}
      native-count: ${{ steps.detect.outputs.native_count }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # detect_changed_images.py owns the range semantics (event.before for
      # develop pushes, merge-base for PR branches, build-everything on
      # initial/force-push) and is unit-tested in CI. Never diff
      # origin/develop...HEAD on a develop push: that range is always empty.
      # The content-tag gap check reads GHCR, so the job needs a token. Login
      # before detection, not after: an unauthenticated probe returns "unknown",
      # which fails open and rebuilds everything.
      #
      # continue-on-error is load-bearing, not defensive tidiness. A hard-failing
      # login would stop the job before ghcr_tag_exists could degrade, so a GHCR
      # outage would block the matrix and the release set entirely -- the exact
      # opposite of the fail-open posture this check is built on. Letting it fail
      # leaves detection unauthenticated, every probe returns "unknown", and the
      # job rebuilds everything. Slower, never wrong.
      - name: Log in to GHCR for the content-tag gap check
        continue-on-error: true
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve changed images
        id: detect
        run: |
          python3 .github/scripts/detect_changed_images.py \
            --event-name "${{ github.event_name }}" \
            --ref-name "${{ github.ref_name }}" \
            --before "${{ github.event.before }}" \
            --base-branch develop > detection.json
          cat detection.json
          {
            echo "matrix=$(jq -c '.matrix' detection.json)"
            echo "count=$(jq -r '.count' detection.json)"
            echo "standard_matrix=$(jq -c '.standard_matrix' detection.json)"
            echo "standard_count=$(jq -r '.standard_count' detection.json)"
            echo "native_matrix=$(jq -c '.native_matrix' detection.json)"
            echo "native_platform_matrix=$(jq -c '.native_platform_matrix' detection.json)"
            echo "native_count=$(jq -r '.native_count' detection.json)"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }} → GHCR
    needs: changes
    if: fromJSON(needs.changes.outputs.standard-count) > 0
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.standard-matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Fetch required LFS build assets
        if: matrix.lfs_include != ''
        run: |
          git lfs install --local
          git lfs pull --include="${{ matrix.lfs_include }}" --exclude=""

      - name: Verify RT Embed LFS shared objects
        if: matrix.name == 'vss-rt-embed' || matrix.name == 'vss-rt-embed-sbsa'
        run: |
          for lfs_asset in \
            services/rtvi/rt-embed/docker/binaries/igpu/libnvbufsurface.so \
            services/rtvi/rt-embed/docker/binaries/igpu/libnvbufsurftransform.so \
            services/rtvi/rt-embed/docker/binaries/igpu/libgstnvdsseimeta.so; do
            test -s "$lfs_asset"
          done

      - name: Compute immutable candidate coordinates
        id: meta
        run: |
          python3 .github/scripts/container_build_plan.py metadata \
            --ref-name "$GITHUB_REF_NAME" \
            --commit-sha "$GITHUB_SHA" \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --image-name "${{ matrix.repository }}" \
            --tree-sha "$(git rev-parse "HEAD:${{ matrix.source_path }}")" \
            --tag-suffix="${{ matrix.tag_suffix }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immutability guard: only a clean 404 proves the tag is free; a re-run
      # on identical content skips; anything else refuses to overwrite.
      - name: Preflight — refuse to overwrite an existing candidate
        id: preflight
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/ghcr_image_guard.py preflight \
            --ref "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            --expect-tree-sha "${{ steps.meta.outputs.tree_sha }}"

      # Content-addressed reuse: if this exact source tree was already built and
      # published under the content tag (tree-<tree_sha>), re-tag that multiarch
      # manifest onto the per-commit tag instead of rebuilding identical content
      # (which otherwise recompiles under slow arm64 QEMU emulation). Fail-open:
      # a missing/mislabelled content tag or any error just builds normally.
      - name: Check for reusable image (identical content)
        id: reuse
        if: steps.preflight.outputs.skip != 'true'
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/ghcr_image_guard.py reuse \
            --ref "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.content_tag }}" \
            --expect-tree-sha "${{ steps.meta.outputs.tree_sha }}"

      - name: Re-tag existing content onto the immutable candidate tag
        if: steps.preflight.outputs.skip != 'true' && steps.reuse.outputs.reuse == 'true'
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.content_tag }}"

      - name: Set up QEMU (arm64 emulation)
        if: steps.preflight.outputs.skip != 'true' && steps.reuse.outputs.reuse != 'true'
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392  # v3.6.0

      # Multiarch images retain both emulated-platform layers in BuildKit's
      # content store. Reclaim preinstalled hosted-runner tooling first so the
      # standard build has sufficient working space.
      - name: Reclaim disk space for standard image build
        if: steps.preflight.outputs.skip != 'true' && steps.reuse.outputs.reuse != 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          sudo docker system prune --all --force --volumes
          df -h /
          docker system df

      - name: Set up Buildx
        if: steps.preflight.outputs.skip != 'true' && steps.reuse.outputs.reuse != 'true'
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1

      - name: Build and push (multiarch, immutable tag only)
        if: steps.preflight.outputs.skip != 'true' && steps.reuse.outputs.reuse != 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          build-args: ${{ matrix.build_args }}
          push: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          # Publish the content-addressed alias too so a later build of the same
          # source tree can re-tag from it instead of rebuilding.
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.content_tag }}
          labels: |
            com.nvidia.vss.image_name=${{ matrix.name }}
            com.nvidia.vss.source_path=${{ matrix.source_path }}
            com.nvidia.vss.source_tree_sha=${{ steps.meta.outputs.tree_sha }}
          annotations: |
            index:com.nvidia.vss.image_name=${{ matrix.name }}
            index:com.nvidia.vss.source_path=${{ matrix.source_path }}
            index:com.nvidia.vss.source_tree_sha=${{ steps.meta.outputs.tree_sha }}

      - name: Remove local standard build cache
        if: always() && steps.preflight.outputs.skip != 'true' && steps.reuse.outputs.reuse != 'true'
        run: |
          docker buildx prune --all --force || true
          sudo docker system prune --all --force --volumes || true
          df -h /

      # Post-push proof of the gate contract: read the labels back through the
      # SAME code path check-*-container-source uses and require the tree hash,
      # source path, and image name to match what we just built.
      - name: Verify pushed labels satisfy the container-source gate
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/ghcr_image_guard.py verify \
            --ref "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            --expect-tree-sha "${{ steps.meta.outputs.tree_sha }}" \
            --expect-source-path "${{ matrix.source_path }}" \
            --expect-image-name "${{ matrix.name }}"

      - name: Resolve manifest digest
        id: digest
        run: |
          python3 .github/scripts/container_build_plan.py verify-manifest \
            --ref "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            --platforms "${{ matrix.platforms }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Emit release-set fragment
        run: |
          mkdir -p fragments
          python3 .github/scripts/release_set.py fragment \
            --name "${{ matrix.name }}" \
            --image "${{ steps.meta.outputs.image }}" \
            --tag "${{ steps.meta.outputs.tag }}" \
            --digest "${{ steps.digest.outputs.digest }}" \
            --platforms "${{ matrix.platforms }}" \
            --strategy build \
            --source-tree-sha "${{ steps.meta.outputs.tree_sha }}" \
            --out "fragments/${{ matrix.name }}.json"

      - name: Upload fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: fragment-${{ matrix.name }}
          path: fragments/
          retention-days: 30

      - name: Summarize
        run: |
          {
            echo "### Built ${{ matrix.name }}"
            echo "- **Image:** \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`"
            echo "- **Digest:** \`${{ steps.digest.outputs.digest }}\`"
            echo "- **Platforms:** \`${{ matrix.platforms }}\`"
            echo "- **source_tree_sha:** \`${{ steps.meta.outputs.tree_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Some images compile architecture-sensitive native dependencies or inherit
  # base images that should not run through QEMU. Build each architecture on
  # its matching GitHub-hosted runner, then combine the platform images.
  build-native-platforms:
    name: Build ${{ matrix.name }} (${{ matrix.arch }}, native)
    needs: changes
    if: fromJSON(needs.changes.outputs.native-count) > 0
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.native-platform-matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Verify native runner architecture
        run: |
          uname -a
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          test "$(uname -m)" = "${{ matrix.kernel_arch }}"
          test "$RUNNER_ARCH" = "${{ matrix.runner_arch }}"

      - name: Fetch required LFS build assets
        if: matrix.lfs_include != ''
        run: |
          git lfs install --local
          git lfs pull --include="${{ matrix.lfs_include }}" --exclude=""

      - name: Verify RT Embed LFS shared objects
        if: matrix.name == 'vss-rt-embed' || matrix.name == 'vss-rt-embed-sbsa'
        run: |
          for lfs_asset in \
            services/rtvi/rt-embed/docker/binaries/igpu/libnvbufsurface.so \
            services/rtvi/rt-embed/docker/binaries/igpu/libnvbufsurftransform.so \
            services/rtvi/rt-embed/docker/binaries/igpu/libgstnvdsseimeta.so; do
            test -s "$lfs_asset"
          done

      - name: Compute immutable candidate coordinates
        id: meta
        run: |
          python3 .github/scripts/container_build_plan.py metadata \
            --ref-name "$GITHUB_REF_NAME" \
            --commit-sha "$GITHUB_SHA" \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --image-name "${{ matrix.repository }}" \
            --tree-sha "$(git rev-parse "HEAD:${{ matrix.source_path }}")" \
            --tag-suffix="${{ matrix.tag_suffix }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Compute platform staging tag
        id: platform-meta
        run: echo "tag=${{ steps.meta.outputs.tag }}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preflight — refuse to overwrite an existing candidate
        id: candidate-preflight
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/ghcr_image_guard.py preflight \
            --ref "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            --expect-tree-sha "${{ steps.meta.outputs.tree_sha }}"

      - name: Check for reusable multiarch image (identical content)
        id: reuse
        if: steps.candidate-preflight.outputs.skip != 'true'
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/ghcr_image_guard.py reuse \
            --ref "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.content_tag }}" \
            --expect-tree-sha "${{ steps.meta.outputs.tree_sha }}"

      - name: Preflight — refuse to overwrite platform staging tag
        id: platform-preflight
        if: >-
          steps.candidate-preflight.outputs.skip != 'true' &&
          steps.reuse.outputs.reuse != 'true'
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/ghcr_image_guard.py preflight \
            --ref "${{ steps.meta.outputs.image }}:${{ steps.platform-meta.outputs.tag }}" \
            --expect-tree-sha "${{ steps.meta.outputs.tree_sha }}"

        # Reclaim preinstalled hosted-runner tooling before BuildKit starts allocating
        # its content store so the native build has sufficient working space.
      - name: Reclaim disk space for native image build
        if: >-
          steps.candidate-preflight.outputs.skip != 'true' &&
          steps.reuse.outputs.reuse != 'true' &&
          steps.platform-preflight.outputs.skip != 'true'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          sudo docker system prune --all --force --volumes
          df -h /
          docker system df

      - name: Set up Buildx
        if: >-
          steps.candidate-preflight.outputs.skip != 'true' &&
          steps.reuse.outputs.reuse != 'true' &&
          steps.platform-preflight.outputs.skip != 'true'
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1

      - name: Build and push native platform staging image
        if: >-
          steps.candidate-preflight.outputs.skip != 'true' &&
          steps.reuse.outputs.reuse != 'true' &&
          steps.platform-preflight.outputs.skip != 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ matrix.build_args }}
          push: true
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}
          tags: ${{ steps.meta.outputs.image }}:${{ steps.platform-meta.outputs.tag }}
          labels: |
            com.nvidia.vss.image_name=${{ matrix.name }}
            com.nvidia.vss.source_path=${{ matrix.source_path }}
            com.nvidia.vss.source_tree_sha=${{ steps.meta.outputs.tree_sha }}

      - name: Remove local native build cache
        if: >-
          always() &&
          steps.candidate-preflight.outputs.skip != 'true' &&
          steps.reuse.outputs.reuse != 'true' &&
          steps.platform-preflight.outputs.skip != 'true'
        run: |
          docker buildx prune --all --force || true
          sudo docker system prune --all --force --volumes || true
          df -h /

      - name: Verify platform staging labels
        if: >-
          steps.candidate-preflight.outputs.skip != 'true' &&
          steps.reuse.outputs.reuse != 'true'
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/ghcr_image_guard.py verify \
            --ref "${{ steps.meta.outputs.image }}:${{ steps.platform-meta.outputs.tag }}" \
            --expect-tree-sha "${{ steps.meta.outputs.tree_sha }}" \
            --expect-source-path "${{ matrix.source_path }}" \
            --expect-image-name "${{ matrix.name }}"

      - name: Summarize
        run: |
          {
            echo "### Native platform build: ${{ matrix.name }}"
            echo "- **Runner:** \`${{ matrix.runner }}\`"
            echo "- **Platform:** \`${{ matrix.platform }}\`"
            echo "- **Staging tag:** \`${{ steps.meta.outputs.image }}:${{ steps.platform-meta.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish-native-images:
    name: Publish ${{ matrix.name }} multiarch manifest
    needs: [changes, build-native-platforms]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      fromJSON(needs.changes.outputs.native-count) > 0 &&
      (needs.build-native-platforms.result == 'success' ||
       needs.build-native-platforms.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.native-matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Compute immutable candidate coordinates
        id: meta
        run: |
          python3 .github/scripts/container_build_plan.py metadata \
            --ref-name "$GITHUB_REF_NAME" \
            --commit-sha "$GITHUB_SHA" \
            --owner "$GITHUB_REPOSITORY_OWNER" \
            --image-name "${{ matrix.repository }}" \
            --tree-sha "$(git rev-parse "HEAD:${{ matrix.source_path }}")" \
            --tag-suffix="${{ matrix.tag_suffix }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preflight — refuse to overwrite an existing candidate
        id: preflight
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/ghcr_image_guard.py preflight \
            --ref "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            --expect-tree-sha "${{ steps.meta.outputs.tree_sha }}"

      - name: Check for reusable image (identical content)
        id: reuse
        if: steps.preflight.outputs.skip != 'true'
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/ghcr_image_guard.py reuse \
            --ref "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.content_tag }}" \
            --expect-tree-sha "${{ steps.meta.outputs.tree_sha }}"

      - name: Set up Buildx
        if: steps.preflight.outputs.skip != 'true'
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1

      - name: Re-tag existing content onto the immutable candidate tag
        if: steps.preflight.outputs.skip != 'true' && steps.reuse.outputs.reuse == 'true'
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.content_tag }}"

      - name: Merge native platform images into multiarch candidate
        if: steps.preflight.outputs.skip != 'true' && steps.reuse.outputs.reuse != 'true'
        env:
          PLATFORM_LIST: ${{ matrix.platforms }}
        run: |
          platform_refs=()
          for platform in ${PLATFORM_LIST//,/ }; do
            platform_refs+=(
              "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}-${platform##*/}"
            )
          done

          docker buildx imagetools create \
            --annotation "index:com.nvidia.vss.image_name=${{ matrix.name }}" \
            --annotation "index:com.nvidia.vss.source_path=${{ matrix.source_path }}" \
            --annotation "index:com.nvidia.vss.source_tree_sha=${{ steps.meta.outputs.tree_sha }}" \
            --tag "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            --tag "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.content_tag }}" \
            "${platform_refs[@]}"

      - name: Verify pushed labels satisfy the container-source gate
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/ghcr_image_guard.py verify \
            --ref "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            --expect-tree-sha "${{ steps.meta.outputs.tree_sha }}" \
            --expect-source-path "${{ matrix.source_path }}" \
            --expect-image-name "${{ matrix.name }}"

      - name: Resolve manifest digest
        id: digest
        run: |
          python3 .github/scripts/container_build_plan.py verify-manifest \
            --ref "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            --platforms "${{ matrix.platforms }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Emit release-set fragment
        run: |
          mkdir -p fragments
          python3 .github/scripts/release_set.py fragment \
            --name "${{ matrix.name }}" \
            --image "${{ steps.meta.outputs.image }}" \
            --tag "${{ steps.meta.outputs.tag }}" \
            --digest "${{ steps.digest.outputs.digest }}" \
            --platforms "${{ matrix.platforms }}" \
            --strategy build \
            --source-tree-sha "${{ steps.meta.outputs.tree_sha }}" \
            --out "fragments/${{ matrix.name }}.json"

      - name: Upload fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: fragment-${{ matrix.name }}
          path: fragments/
          retention-days: 30

      - name: Summarize
        run: |
          {
            echo "### Published native multiarch ${{ matrix.name }}"
            echo "- **Image:** \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`"
            echo "- **Digest:** \`${{ steps.digest.outputs.digest }}\`"
            echo "- **Platforms:** \`${{ matrix.platforms }}\`"
            echo "- **source_tree_sha:** \`${{ steps.meta.outputs.tree_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Assemble ONE complete release set for this commit: freshly built images
  # from the fragments, everything else carried forward explicitly as
  # reuse-pinned entries. Runs even when nothing was built (docs-only push):
  # the resulting set is still complete and testable.
  assemble:
    name: Assemble release set
    needs: [changes, build, publish-native-images]
    if: >-
      always() && needs.changes.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.publish-native-images.result == 'success' ||
       needs.publish-native-images.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Download fragments
        if: fromJSON(needs.changes.outputs.count) > 0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: fragment-*
          path: fragments
          merge-multiple: true

      - name: Assemble and validate the release set
        run: |
          mkdir -p fragments
          python3 .github/scripts/release_set.py assemble \
            --fragments fragments \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --ref "$GITHUB_REF_NAME" \
            --workflow-run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --out release-set.json
          python3 .github/scripts/release_set.py validate --file release-set.json
          {
            echo "### Release set"
            echo '```json'
            cat release-set.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-set
          path: release-set.json
          retention-days: 90

      - name: Set up Buildx for post-merge alias publication
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to GHCR for post-merge publication
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publishes BOTH aliases for every GHCR image in the set:
      #   develop-latest      — moving developer convenience alias
      #   develop-<sha12>     — immutable per-commit tag
      # The per-commit tag is the point: with it published for every image at
      # every develop push tip, a consumer derives the whole coordinate set from
      # the commit SHA alone and never needs the release-set manifest. The
      # tree-SHA gate makes that derivation trustworthy — it refuses to publish
      # a tag for an image that was not built from this commit's source.
      #
      # Only the pushed tip is tagged, which is sufficient: the repo allows only
      # squash and rebase merges (no merge commits), so develop is linear, and
      # every consumer resolves from the tip, never from an interior commit.
      # develop publishes develop-latest + develop-<sha12>; a PR branch publishes
      # pr-<N>-latest + pr-<N>-<sha12>. Both sets must cover EVERY GHCR image,
      # not just the ones rebuilt on this ref: a consumer that derives a
      # coordinate from the ref would otherwise 404 on the untouched images,
      # which is why PR acceptance still needs a per-image manifest today.
      # pr-<N>-* tags are reaped by cleanup-pr-tags.yml when the PR closes.
      - name: Retag the candidate set for this ref
        run: |
          short="$(printf '%s' "${GITHUB_SHA}" | cut -c1-12)"
          case "${GITHUB_REF_NAME}" in
            develop)            prefix="develop" ;;
            pull-request/[0-9]*) prefix="pr-${GITHUB_REF_NAME#pull-request/}" ;;
            *) echo "::notice::no candidate set retagged for ${GITHUB_REF_NAME}"; exit 0 ;;
          esac
          python3 .github/scripts/advance_ghcr_alias.py \
            --release-set release-set.json \
            --alias "${prefix}-latest" \
            --alias "${prefix}-${short}" \
            --verify-tree-sha \
            --repo-root . \
            --commit "${GITHUB_SHA}"
