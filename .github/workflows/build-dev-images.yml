#
# Immutable GHCR candidate builds (I-06 of the container release flow).
#
# Builds the changed first-party images (per deploy/docker/container-inventory.json,
# ghcr_build: true) into GHCR under IMMUTABLE tags — pr-<N>-<sha12> for
# pull-request/N branches, develop-<sha12> for develop — and assembles a
# release-set manifest (deploy/docker/release-set.schema.json) recording every
# in-scope image as built or explicitly reused.
#
# Deliberate properties (see docs/proposals/container-dev-and-release-workflow.md):
#   * NO moving alias is written here. develop-latest/last-green advancement is
#     a separate gated step that only a verified acceptance PASS may perform.
#   * NO NGC promotion happens from GitHub. The weekly promotion is owned by
#     the GitLab ci-vss-oss flow and consumes the same digests.
#   * The com.nvidia.vss.source_tree_sha label carries the git TREE hash of
#     the source folder (git rev-parse HEAD:<source_path>) — the exact value
#     the check-*-container-source gate compares. A post-push verification
#     reads it back through the same code path as the gate.
#   * Candidate tags are immutable: the preflight guard refuses to overwrite
#     an existing tag with different content and no-ops on idempotent re-runs.
#   * Trust boundary: this workflow runs on `push` to develop and to the
#     repo-local pull-request/N mirror branches (created by repo automation
#     after vetting), never directly on fork pull_request events, so
#     packages:write is never exposed to unreviewed fork code.

name: Build Dev Images (GHCR)

on:
  push:
    branches:
      - develop
      - "pull-request/[0-9]+"

concurrency:
  group: build-dev-images-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read
  packages: write

jobs:
  changes:
    name: Detect changed first-party images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
      count: ${{ steps.detect.outputs.count }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # detect_changed_images.py owns the range semantics (event.before for
      # develop pushes, merge-base for PR branches, build-everything on
      # initial/force-push) and is unit-tested in CI. Never diff
      # origin/develop...HEAD on a develop push: that range is always empty.
      - name: Resolve changed images
        id: detect
        run: |
          python3 .github/scripts/detect_changed_images.py \
            --event-name "${{ github.event_name }}" \
            --ref-name "${{ github.ref_name }}" \
            --before "${{ github.event.before }}" \
            --base-branch develop > detection.json
          cat detection.json
          {
            echo "matrix=$(jq -c '.matrix' detection.json)"
            echo "count=$(jq -r '.count' detection.json)"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }} → GHCR
    needs: changes
    if: fromJSON(needs.changes.outputs.count) > 0
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Fetch required LFS build assets
        if: matrix.lfs_include != ''
        run: |
          git lfs install --local
          git lfs pull --include="${{ matrix.lfs_include }}" --exclude=""

      - name: Compute immutable candidate coordinates
        id: meta
        run: |
          SHORT="$(git rev-parse --short=12 HEAD)"
          case "$GITHUB_REF_NAME" in
            pull-request/*) TAG="pr-${GITHUB_REF_NAME##*/}-${SHORT}" ;;
            develop)        TAG="develop-${SHORT}" ;;
            *)              TAG="${GITHUB_REF_NAME//\//-}-${SHORT}" ;;
          esac
          # The TREE hash of the source folder — the value the container-source
          # gate compares. NOT github.sha (a commit SHA): the two never match.
          TREE_SHA="$(git rev-parse "HEAD:${{ matrix.source_path }}")"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "tag=$TAG"
            echo "tree_sha=$TREE_SHA"
            echo "image=ghcr.io/${OWNER}/${{ matrix.name }}"
          } >> "$GITHUB_OUTPUT"
          echo "Candidate: ghcr.io/${OWNER}/${{ matrix.name }}:$TAG (tree $TREE_SHA)"

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immutability guard: only a clean 404 proves the tag is free; a re-run
      # on identical content skips; anything else refuses to overwrite.
      - name: Preflight — refuse to overwrite an existing candidate
        id: preflight
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/ghcr_image_guard.py preflight \
            --ref "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            --expect-tree-sha "${{ steps.meta.outputs.tree_sha }}"

      - name: Set up QEMU (arm64 emulation)
        if: steps.preflight.outputs.skip != 'true'
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392  # v3.6.0

      - name: Set up Buildx
        if: steps.preflight.outputs.skip != 'true'
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # v3.11.1

      - name: Build and push (multiarch, immutable tag only)
        if: steps.preflight.outputs.skip != 'true'
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83  # v6.18.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            com.nvidia.vss.image_name=${{ matrix.name }}
            com.nvidia.vss.source_path=${{ matrix.source_path }}
            com.nvidia.vss.source_tree_sha=${{ steps.meta.outputs.tree_sha }}
          annotations: |
            index:com.nvidia.vss.image_name=${{ matrix.name }}
            index:com.nvidia.vss.source_path=${{ matrix.source_path }}
            index:com.nvidia.vss.source_tree_sha=${{ steps.meta.outputs.tree_sha }}

      # Post-push proof of the gate contract: read the labels back through the
      # SAME code path check-*-container-source uses and require the tree hash,
      # source path, and image name to match what we just built.
      - name: Verify pushed labels satisfy the container-source gate
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/ghcr_image_guard.py verify \
            --ref "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            --expect-tree-sha "${{ steps.meta.outputs.tree_sha }}" \
            --expect-source-path "${{ matrix.source_path }}" \
            --expect-image-name "${{ matrix.name }}"

      - name: Resolve manifest digest
        id: digest
        run: |
          DIGEST="$(docker buildx imagetools inspect \
            "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}" \
            --format '{{json .Manifest}}' | jq -r '.digest')"
          [[ "$DIGEST" == sha256:* ]] || { echo "no digest resolved"; exit 1; }
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Emit release-set fragment
        run: |
          mkdir -p fragments
          python3 .github/scripts/release_set.py fragment \
            --name "${{ matrix.name }}" \
            --image "${{ steps.meta.outputs.image }}" \
            --tag "${{ steps.meta.outputs.tag }}" \
            --digest "${{ steps.digest.outputs.digest }}" \
            --platforms "${{ matrix.platforms }}" \
            --strategy build \
            --source-tree-sha "${{ steps.meta.outputs.tree_sha }}" \
            --out "fragments/${{ matrix.name }}.json"

      - name: Upload fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: fragment-${{ matrix.name }}
          path: fragments/
          retention-days: 30

      - name: Summarize
        run: |
          {
            echo "### Built ${{ matrix.name }}"
            echo "- **Image:** \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`"
            echo "- **Digest:** \`${{ steps.digest.outputs.digest }}\`"
            echo "- **Platforms:** \`${{ matrix.platforms }}\`"
            echo "- **source_tree_sha:** \`${{ steps.meta.outputs.tree_sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Assemble ONE complete release set for this commit: freshly built images
  # from the fragments, everything else carried forward explicitly as
  # reuse-pinned entries. Runs even when nothing was built (docs-only push):
  # the resulting set is still complete and testable.
  assemble:
    name: Assemble release set
    needs: [changes, build]
    if: >-
      always() && needs.changes.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Download fragments
        if: fromJSON(needs.changes.outputs.count) > 0
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          pattern: fragment-*
          path: fragments
          merge-multiple: true

      - name: Assemble and validate the release set
        run: |
          mkdir -p fragments
          python3 .github/scripts/release_set.py assemble \
            --fragments fragments \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --ref "$GITHUB_REF_NAME" \
            --workflow-run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --out release-set.json
          python3 .github/scripts/release_set.py validate --file release-set.json
          {
            echo "### Release set"
            echo '```json'
            cat release-set.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-set
          path: release-set.json
          retention-days: 90
