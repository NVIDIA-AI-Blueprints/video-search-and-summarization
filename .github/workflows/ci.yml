name: CI

"on":
  push:
    branches:
      - main
      - develop
      - "pull-request/[0-9]+"

concurrency:
  # Preserve every delivery run on develop/main. Synthetic PR mirror branches
  # still cancel stale runs after a newer PR revision arrives.
  group: >-
    ${{ github.workflow }}-${{
      startsWith(github.ref_name, 'pull-request/') && github.ref || github.run_id
    }}
  cancel-in-progress: ${{ startsWith(github.ref_name, 'pull-request/') }}

defaults:
  run:
    shell: bash

env:
  # The source artifact intentionally excludes .git. The Python package
  # derives its version from VCS metadata, so provide a deterministic
  # CI-only version for artifact-based jobs.
  SETUPTOOLS_SCM_PRETEND_VERSION: 0.0.0+${{ github.sha }}

jobs:
  # ---------------------------------------------------------------------------
  # Job 0: Package source once for jobs that do not need git history
  # ---------------------------------------------------------------------------
  prepare-source:
    name: Prepare source artifact
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build-behavior-analytics: ${{ steps.managed-image-changes.outputs.behavior }}
      build-video-analytics-api: ${{ steps.managed-image-changes.outputs.video }}
      current-behavior-analytics-image: ${{ steps.current-images.outputs.behavior }}
      current-video-analytics-api-image: ${{ steps.current-images.outputs.video }}
      sdr-mw-l-changed: ${{ steps.managed-image-changes.outputs.sdr-mw-l }}
      vss-configurator-changed: ${{ steps.managed-image-changes.outputs.vss-configurator }}
      vss-rt-config-adaptor-changed: ${{ steps.managed-image-changes.outputs.vss-rt-config-adaptor }}
      unit-test-workflow-changed: ${{ steps.changed-paths.outputs.unit-test-workflow-changed }}
      trigger-from-src-change: ${{ steps.changed-paths.outputs.trigger-from-src-change }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # One diff resolution answering several path questions. A second step
      # would have to re-resolve the same base, which is how the two gates
      # drifted apart last time.
      - name: Detect changed paths
        id: changed-paths
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, ".github/scripts")
          from detect_changed_images import (
              changed_paths,
              paths_changed_under,
              resolve_diff_base,
          )

          # Folders that warrant a downstream acceptance run on their own.
          # Image sources are absent by design: a container source change is
          # already picked up by the per-image source_path check, and
          # containers this repo does not build cannot invalidate a deployed
          # artifact from a source edit alone.
          DOWNSTREAM_TRIGGER_PATHS = ["deploy"]

          repo = Path.cwd()
          ref_name = os.environ["REF_NAME"]
          # Direct pushes use their event range. PR mirror branches use the
          # merge-base with develop so all changes in the PR are considered.
          base_branch = ref_name if ref_name in {"main", "develop"} else "develop"
          base, reason = resolve_diff_base(
              repo,
              os.environ["EVENT_NAME"],
              ref_name,
              os.environ.get("BEFORE_SHA", ""),
              base_branch,
          )
          paths = changed_paths(repo, base) if base else None
          if base and paths is None:
              reason += "; diff failed; running downstream acceptance"

          unit_test_workflow_changed = paths is None or ".github/workflows/ci.yml" in paths
          trigger_from_src = any(
              paths_changed_under(paths, folder)
              for folder in DOWNSTREAM_TRIGGER_PATHS
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(
                  "unit-test-workflow-changed="
                  f"{str(unit_test_workflow_changed).lower()}\n"
              )
              output.write(
                  f"trigger-from-src-change={str(trigger_from_src).lower()}\n"
              )
          print(f"Unit-test workflow changed: {unit_test_workflow_changed} ({reason})")
          print(f"Downstream trigger from source: {trigger_from_src} ({reason})")
          PY

      - name: Detect managed image changes
        id: managed-image-changes
        run: |
          python3 .github/scripts/detect_changed_images.py \
            --event-name "${{ github.event_name }}" \
            --ref-name "${{ github.ref_name }}" \
            --before "${{ github.event.before }}" \
            --base-branch develop > analytics-detection.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          entries = json.load(open("analytics-detection.json"))["matrix"]["include"]
          names = {entry["name"] for entry in entries}
          inventory = json.loads(Path("deploy/docker/container-inventory.json").read_text())
          outputs = {
              entry["name"]: entry["name"]
              for entry in inventory["images"]
              if entry.get("strategy") == "build" and entry.get("ghcr_build")
          }
          outputs.update({
              # Backward-compatible aliases used by the existing analytics jobs.
              "behavior": "vss-behavior-analytics",
              "video": "vss-video-analytics-api",
          })
          for output, image in outputs.items():
              print(f"{output}={str(image in names).lower()}")
          PY

      - name: Resolve current analytics images
        id: current-images
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sys
          from pathlib import Path

          sys.path.insert(0, ".github/scripts")
          from check_container_tag_source import find_image_refs, resolve_compose_vars

          def current(compose_path: str, image_name: str) -> str:
              refs = find_image_refs(Path(compose_path), image_name)
              if len(refs) != 1:
                  raise RuntimeError(f"{image_name}: expected one Compose image, found {len(refs)}")
              resolved, missing = resolve_compose_vars(refs[0], {})
              if missing:
                  raise RuntimeError(f"{image_name}: unresolved variables: {', '.join(missing)}")
              return resolved

          print("behavior=" + current(
              "deploy/docker/services/analytics/behavior-analytics/compose.yml",
              "vss-behavior-analytics",
          ))
          print("video=" + current(
              "deploy/docker/services/analytics/video-analytics-api/compose.yml",
              "vss-video-analytics-api",
          ))
          PY

      - name: Fetch required LFS source notices
        run: |
          git lfs pull \
            --include='services/vios/LICENSE.3rdparty' \
            --exclude=''
          if head -c 64 services/vios/LICENSE.3rdparty | grep -q '^version https://git-lfs'; then
            echo "::error::git lfs pull did not materialize services/vios/LICENSE.3rdparty"
            exit 1
          fi

      - name: Package tracked source
        run: |
          # actions/checkout above runs with lfs:false, but `git archive` applies
          # checkout-side conversion (ident, then smudge/process), so it fetches
          # the repo's entire ~989 MB of LFS payload on every run. 414 MB of that
          # is services/vios. Skip those binaries via lfs.fetchexclude.
          #
          # fetchexclude is a path filter: matching files stay LFS pointers even
          # when already pulled. LICENSE.3rdparty lives under services/vios, so
          # archive would pack the pointer. Pull the notices above, then replace
          # that one tar member after archive. Scoped to this command with -c,
          # so analytics fixtures are still smudged normally.
          git -c lfs.fetchexclude='services/vios/**' \
            archive --format=tar --prefix=repo/ -o source.tar HEAD
          license_member='repo/services/vios/LICENSE.3rdparty'
          tar --delete -f source.tar "$license_member"
          mkdir -p .archive-license/repo/services/vios
          cp services/vios/LICENSE.3rdparty .archive-license/repo/services/vios/LICENSE.3rdparty
          tar --append -C .archive-license -f source.tar "$license_member"
          rm -rf .archive-license
          gzip -n source.tar
          git ls-files > tracked-files.txt
          ls -lh source.tar.gz

      # Assert the notice and exclusion did what we think. Without this a silent
      # change in git-lfs behaviour either stops saving anything, or starts
      # stripping fixtures the analytics integration jobs depend on.
      - name: Verify LFS exclusion boundaries
        run: |
          # Must be a regular file, not a symlink: git archive stores a symlink's
          # target text, so libaws-c-auth.so (mode 120000, content
          # "libaws-c-auth.so.1.0.0") would never match the pointer signature and
          # would fail this step for every run. All 126 vios LFS pointers are
          # regular files; this is the resolved target of that symlink.
          vios='repo/services/vios/prebuilts/aarch64/aws/libaws-c-auth.so.1.0.0'
          license='repo/services/vios/LICENSE.3rdparty'
          keep='repo/services/analytics/behavior-analytics/tests/integration/expected_output/smart_city/mdx-behavior-data.json'
          if ! tar -xzOf source.tar.gz "$vios" | head -c 64 | grep -q '^version https://git-lfs'; then
            echo "::error::$vios is not an LFS pointer; lfs.fetchexclude is not taking effect"
            exit 1
          fi
          if tar -xzOf source.tar.gz "$license" | head -c 64 | grep -q '^version https://git-lfs'; then
            echo "::error::$license is an LFS pointer; the required license notices are missing"
            exit 1
          fi
          if ! tar -xzOf source.tar.gz "$license" | cmp -s - services/vios/LICENSE.3rdparty; then
            echo "::error::$license does not match the materialized license notices"
            exit 1
          fi
          if tar -xzOf source.tar.gz "$keep" | head -c 64 | grep -q '^version https://git-lfs'; then
            echo "::error::$keep is a pointer; the exclusion over-matched and analytics fixtures would break"
            exit 1
          fi
          echo "vios payloads excluded, required license and analytics fixtures smudged"

      - name: Upload source artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: source-${{ github.sha }}
          path: |
            source.tar.gz
            tracked-files.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # ---------------------------------------------------------------------------
  # Job 1: Python lint (ruff check + ruff format + yamllint)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (Python)
    needs: prepare-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: source-${{ github.sha }}
          path: .source-artifact

      - name: Unpack source artifact
        working-directory: ${{ github.workspace }}
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .source-artifact -exec rm -rf {} +
          tar -xzf .source-artifact/source.tar.gz --strip-components=1
          mkdir -p .ci
          mv .source-artifact/tracked-files.txt .ci/tracked-files.txt
          rm -rf .source-artifact

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          version: "0.6.2"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config

      - name: Install dev dependencies
        run: uv sync --group dev --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      # Run from repo root so the tracked-file manifest sees YAML files
      # outside services/agent (the job's default working-directory).
      # yamllint is GPL-3.0-or-later, so we run it ephemerally via `uvx`
      # rather than declaring it as a project dep — that way it never
      # appears in services/agent/uv.lock and never lands in any
      # installed project venv. The license-check job is unaffected.
      - name: yamllint
        working-directory: ${{ github.workspace }}
        run: |
          YAML_FILES=$(grep -E '^(\.github/.*\.ya?ml|\.pre-commit-config\.yaml|services/.*\.ya?ml)$' .ci/tracked-files.txt || true)
          if [ -z "$YAML_FILES" ]; then
            echo "No YAML files to lint."
            exit 0
          fi
          uvx yamllint \
            -d "{extends: default, rules: {line-length: {max: 200}, document-start: disable, indentation: {spaces: 2, indent-sequences: consistent}}}" \
            $YAML_FILES

  codec-installer-test:
    name: Validate codec artifacts
    needs: prepare-source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: source-${{ github.sha }}
          path: .source-artifact

      - name: Unpack source artifact
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .source-artifact -exec rm -rf {} +
          tar -xzf .source-artifact/source.tar.gz --strip-components=1
          rm -rf .source-artifact

      - name: Validate codec installers
        run: |
          EMBED_INSTALLER=services/rtvi/rt-embed/src/scripts/install_codecs_nonroot.sh
          VLM_INSTALLER=services/rtvi/rt-vlm/src/scripts/install_codecs_nonroot.sh
          bash -n "$EMBED_INSTALLER"
          bash -n "$VLM_INSTALLER"
          cmp "$EMBED_INSTALLER" "$VLM_INSTALLER"
          CODEC_VALIDATE_ONLY=true bash "$EMBED_INSTALLER"
          CODEC_VALIDATE_ONLY=true CODEC_DEB_ARCH=arm64 bash "$EMBED_INSTALLER"

  # ---------------------------------------------------------------------------
  # Job 2: Python type checking (mypy)
  # ---------------------------------------------------------------------------
  typecheck:
    name: Type Check (mypy)
    needs: prepare-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: source-${{ github.sha }}
          path: .source-artifact

      - name: Unpack source artifact
        working-directory: ${{ github.workspace }}
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .source-artifact -exec rm -rf {} +
          tar -xzf .source-artifact/source.tar.gz --strip-components=1
          mkdir -p .ci
          mv .source-artifact/tracked-files.txt .ci/tracked-files.txt
          rm -rf .source-artifact

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          version: "0.6.2"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config

      - name: Install dev dependencies
        run: uv sync --group dev --extra agent --extra cli --frozen

      - name: mypy
        run: uv run mypy packages/vss_agents/src/vss_agents

  # ---------------------------------------------------------------------------
  # Job 3: Python tests (pytest + coverage)
  # ---------------------------------------------------------------------------
  test:
    name: Test (pytest)
    needs: prepare-source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: source-${{ github.sha }}
          path: .source-artifact

      - name: Unpack source artifact
        working-directory: ${{ github.workspace }}
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .source-artifact -exec rm -rf {} +
          tar -xzf .source-artifact/source.tar.gz --strip-components=1
          mkdir -p .ci
          mv .source-artifact/tracked-files.txt .ci/tracked-files.txt
          rm -rf .source-artifact

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          version: "0.6.2"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config

      - name: Install dev dependencies
        run: uv sync --group dev --extra agent --extra cli --frozen

      - name: pytest
        timeout-minutes: 10
        run: |
          uv run pytest \
            --cov=packages/vss_agents/src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -m "not slow and not integration"

      - name: Video summarization contracts
        working-directory: ${{ github.workspace }}
        run: |
          uv run --project services/agent pytest \
            .github/skill-eval/tests/test_generic_judge_trajectory_guidance.py \
            .github/skill-eval/tests/test_lvs_deployment_config.py \
            .github/skill-eval/tests/test_vss_summarize_eval_contract.py \
            .github/skill-eval/tests/test_vss_summarize_model_selection.py \
            deploy/docker/scripts/tests/test_orchestrator_mcp_helper.py \
            -q

      - name: Skill eval harness contracts
        working-directory: ${{ github.workspace }}
        env:
          SKILL_EVAL_EXPECTED_PYTHON_VERSION: "3.12"
        run: |
          uvx --python 3.12 --from "pytest==9.1.1" pytest \
            .github/skill-eval/tests/test_adapter_agent_timeout.py \
            .github/skill-eval/tests/test_leg_timing.py \
            .github/skill-eval/tests/test_leg_report.py \
            .github/skill-eval/tests/test_python_runtime_contract.py \
            .github/skill-eval/tests/test_skills_eval_agent_protocol.py \
            .github/skill-eval/envs/tests/test_cancellation_recovery.py \
            .github/skill-eval/tests/test_run_leg.py::HarborCommand \
            .github/skill-eval/tests/test_run_leg.py::PhaseBudgets \
            .github/skill-eval/tests/test_run_leg.py::HarborEnvironment \
            .github/skill-eval/tests/test_run_leg.py::RunCommand \
            .github/skill-eval/tests/test_run_leg.py::ProcessGroupShutdown \
            .github/skill-eval/tests/test_run_leg.py::RunInvocations \
            .github/skill-eval/tests/test_run_leg.py::TheHeartbeatNamesTheRightPhase \
            .github/skill-eval/tests/test_run_leg.py::InstrumentationNeverChangesTheVerdict \
            -q

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: coverage-report
          path: services/agent/coverage.xml

  # ---------------------------------------------------------------------------
  # Job 4: NAT-free base distribution (lib + vss CLI) build and tests.
  # Installs only the base `nvidia-vss` dependencies + the cli-dev tool group, so this
  # lane proves the host CLI surface never grows a NAT/torch dependency.
  # ---------------------------------------------------------------------------
  vss-cli-test:
    name: Test (vss-cli)
    needs: prepare-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: source-${{ github.sha }}
          path: .source-artifact

      - name: Unpack source artifact
        working-directory: ${{ github.workspace }}
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .source-artifact -exec rm -rf {} +
          tar -xzf .source-artifact/source.tar.gz --strip-components=1
          rm -rf .source-artifact

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          version: "0.6.2"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      - name: Build and test NAT-free base distribution
        run: |
          uv sync --frozen --no-dev --group cli-dev --extra cli
          uv run --no-sync mypy \
            packages/vss_core/src/vss_core/_foundation \
            packages/vss_core/src/vss_core/critic \
            packages/vss_core/src/vss_core/search_core \
            packages/vss_core/src/vss_core/vlm \
            packages/vss_core/src/vss_core/vios \
            packages/vss_cli/src/vss_cli
          uv run --no-sync pytest packages/vss_core/tests/unit_test packages/vss_cli/tests/unit_test -W error::RuntimeWarning -W error::ResourceWarning \
            --cov=packages/vss_core/src --cov=packages/vss_cli/src --cov-fail-under=80 --cov-report=xml:coverage-lib.xml -m "not slow and not integration"
          uv run --no-sync python ../../.github/scripts/test_license_diff_csv.py
          uv run --no-sync python ../../.github/scripts/test_license_diff_summary.py
          rm -rf dist
          uv build --package nvidia-vss-core
          uv build --package nvidia-vss-cli

      - name: Smoke-test built wheel in a clean environment
        run: |
          rm -rf .wheel-smoke
          uv venv --python 3.13 .wheel-smoke
          set -- dist/nvidia_vss_core-*.whl
          test "$#" -eq 1 && test -f "$1"
          core_whl="$1"
          set -- dist/nvidia_vss_cli-*.whl
          test "$#" -eq 1 && test -f "$1"
          cli_whl="$1"
          uv pip install --python .wheel-smoke/bin/python --no-cache "$core_whl" "$cli_whl"
          uv pip check --python .wheel-smoke/bin/python
          .wheel-smoke/bin/python - <<'PY'
          import importlib.util
          from importlib import metadata

          import vss_core
          import vss_cli
          import vss_core.critic
          import vss_core.search_core
          import vss_core.vlm
          import vss_core.vios

          installed = {dist.metadata["Name"].lower() for dist in metadata.distributions()}
          assert "nvidia-vss-core" in installed
          assert "nvidia-vss-cli" in installed
          assert installed.isdisjoint({"coverage", "mypy", "pytest", "ruff"})
          # The base (core + cli) install must never pull the NAT/torch stack
          # nor the agent distribution.
          assert installed.isdisjoint({"nvidia-nat", "nvidia-nat-core", "torch", "langchain-core", "nvidia-vss-agents"})
          assert importlib.util.find_spec("nat") is None
          assert importlib.util.find_spec("torch") is None
          assert importlib.util.find_spec("vss_agents") is None
          assert vss_core.critic is not None and vss_core.search_core is not None
          assert vss_core.vlm is not None and vss_core.vios is not None
          PY
          .wheel-smoke/bin/vss --help >/dev/null

      - name: Upload lib coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: vss-cli-coverage-report
          path: services/agent/coverage-lib.xml

  # ---------------------------------------------------------------------------
  # Job 5a: Behavior analytics unit tests
  # ---------------------------------------------------------------------------
  behavior-analytics-test:
    name: Test (behavior analytics)
    needs: prepare-source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: services/analytics/behavior-analytics
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: source-${{ github.sha }}
          path: .source-artifact

