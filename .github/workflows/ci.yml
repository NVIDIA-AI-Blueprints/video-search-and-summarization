          mkdir -p .ci
          mv .source-artifact/tracked-files.txt .ci/tracked-files.txt
          rm -rf .source-artifact

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
        with:
          version: "0.6.2"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config

      # Delegates to .github/scripts/check_python_licenses.sh which is
      # also called by .pre-commit-config.yaml so local pre-commit and
      # CI run the exact same scan. The script uses --no-default-groups
      # so only runtime deps that actually ship are scanned (dev tools
      # like yamllint are GPL but never distributed).
      - name: Check Python dependency licenses
        working-directory: ${{ github.workspace }}
        run: bash .github/scripts/check_python_licenses.sh

  # ---------------------------------------------------------------------------
  # Job 10: Dependency license check (UI)
  # ---------------------------------------------------------------------------
  license-check-ui:
    name: License Check (UI)
    needs: prepare-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/ui
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: source-${{ github.sha }}
          path: .source-artifact

      - name: Unpack source artifact
        working-directory: ${{ github.workspace }}
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .source-artifact -exec rm -rf {} +
          tar -xzf .source-artifact/source.tar.gz --strip-components=1
          mkdir -p .ci
          mv .source-artifact/tracked-files.txt .ci/tracked-files.txt
          rm -rf .source-artifact

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version-file: services/ui/.nvmrc
          cache: "npm"
          cache-dependency-path: services/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check UI dependency licenses
        run: |
          # Dump all licenses as JSON, then validate in Node.
          # OSRB-approved exceptions are filtered by package name prefix.
          npx license-checker --json --excludePrivatePackages > /tmp/licenses.json

          node -e '
            const licenses = require("/tmp/licenses.json");
            const allowed = new Set([
              "MIT","MIT-0","Apache-2.0","BSD-2-Clause","BSD-3-Clause","ISC","0BSD",
              "Unlicense","CC0-1.0","CC-BY-4.0","CC-BY-3.0","Python-2.0",
              "BlueOak-1.0.0","MPL-2.0"
            ]);
            // OSRB-approved exceptions (dynamically linked, reviewed)
            const excludePrefixes = ["@img/sharp-libvips"];
            const excludeExact = new Set(["common"]);
            const failures = [];
            for (const [pkg, info] of Object.entries(licenses)) {
              const name = pkg.replace(/@[^@]+$/, "");
              if (excludeExact.has(name) || excludePrefixes.some(p => name.startsWith(p))) continue;
              const lic = String(info.licenses || "UNKNOWN");
              // license-checker appends * when license is inferred from file (e.g. "MIT*")
              const parts = lic.replace(/[()]/g, "").split(/ OR | AND /);
              const ok = parts.some(p => allowed.has(p.trim().replace(/\*$/, "")));
              if (!ok) failures.push(pkg + ": " + lic);
            }
            if (failures.length) {
              console.error("ERROR: " + failures.length + " package(s) with disallowed licenses:\n");
              failures.forEach(f => console.error("  " + f));
              process.exit(1);
            }
            console.log("OK: " + Object.keys(licenses).length + " packages checked.");
          '

  # ---------------------------------------------------------------------------
  # Job 11: Folder structure enforcement (develop-only)
  # ---------------------------------------------------------------------------
  folder-structure:
    name: Check folder structure
    needs: prepare-source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: source-${{ github.sha }}
          path: .source-artifact

      - name: Unpack source artifact
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .source-artifact -exec rm -rf {} +
          tar -xzf .source-artifact/source.tar.gz --strip-components=1
          mkdir -p .ci
          mv .source-artifact/tracked-files.txt .ci/tracked-files.txt
          rm -rf .source-artifact

      - name: Validate folder structures
        run: python3 .github/scripts/check_folder_structure.py

  # ---------------------------------------------------------------------------
  # Job 11b: No patent-encumbered media codecs in the agent image (OSRB)
  # Defense in depth: (1) unit-test the shared scanner, (2) assert the
  # Dockerfile still strips the codecs and wires the build-time guard so the
  # protection cannot be silently removed, and (3) scan the ALREADY-PUBLISHED
  # agent image the blueprint pins (pulled from nvcr.io, resolved the same way
  # as the container-source check) for any FFmpeg/H.264/H.265 codec library.
  # No local build, so it can't flake on base-image registry rate limits; the
  # Dockerfile's build-time guard still enforces this in the publish build.
  # ---------------------------------------------------------------------------
  codec-scan:
    name: No Patented Codecs (agent image)
    needs: prepare-source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      NGC_CLI_API_KEY: ${{ secrets.NGC_CLI_API_KEY }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Unit-test the codec scanner
        run: python3 .github/scripts/test_check_no_patented_codecs.py

      # Cheap, always-runs guard so the protection can't be silently removed
      # even if the published-image pull below is skipped (e.g. missing NGC key).
      - name: Assert Dockerfile strips codecs and excludes FFmpeg source
        run: |
          DF=services/agent/docker/Dockerfile
          fail() { echo "ERROR: $1 (see $DF)"; exit 1; }
          if grep -qE '^[[:space:]]*COPY .*([3]rdparty/ffmpeg|third_party/ffmpeg|verify_ffmpeg_tarball)' "$DF"; then
            fail "FFmpeg source or its verifier must not be copied into any image stage"
          fi
          if grep -qF 'verify_ffmpeg_tarball' "$DF"; then
            fail "obsolete FFmpeg source verification step remains"
          fi
          grep -qF 'opencv_python_headless.libs' "$DF" \
            || fail "OpenCV/FFmpeg removal step missing"
          grep -qF 'libav*.so*' "$DF" \
            || fail "FFmpeg shared-library removal glob missing"
          grep -qF 'patent-encumbered codec libraries present in image' "$DF" \
            || fail "build-time codec guard missing"
          echo "OK: Dockerfile excludes FFmpeg source, removes codecs, and enforces the build-time guard."

      # The committed deploy coordinate may target GHCR or NGC.
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772  # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # NGC_CLI_API_KEY lets us pull the published agent image from nvcr.io.
      - name: Log in to NGC
        if: ${{ env.NGC_CLI_API_KEY != '' }}
        run: echo "${NGC_CLI_API_KEY}" | docker login nvcr.io -u '$oauthtoken' --password-stdin

      # Scan the ALREADY-PUBLISHED agent image the blueprint pins (resolved from
      # deploy/docker exactly like the container-source check) via `docker
      # export`, which flattens the layers so codec files deleted at build time
      # correctly do not appear. No local build -> no base-image rate-limit flakes.
      # Gated on NGC_CLI_API_KEY (same as the login above): the pinned image lives
      # in a private nvcr.io registry, so without the secret (fork PRs, dev boxes)
      # the docker pull would fail. The always-on unit test + Dockerfile assertion
      # above, plus the Dockerfile build-time guard in the gated publish build,
      # keep enforcing the policy when this scan is skipped.
      # PR mirrors publish only pr-<N>-* candidates; develop-latest is created
      # after merge, so the committed deploy coordinate is not pullable yet.
      - name: Scan the deployed agent image for patent-encumbered codecs
        if: ${{ env.NGC_CLI_API_KEY != '' && !startsWith(github.ref_name, 'pull-request/') }}
        run: python3 .github/scripts/check_no_patented_codecs.py --from-deploy vss-agent

  # ---------------------------------------------------------------------------
  # Job 11c: Container coordinates golden test (containers.env SSOT)
  # Guards the single source of truth for first-party image coordinates:
  # (1) unit-test the resolver, (2) prove every resolved compose image ref
  # matches the checked-in golden file, and (3) prove containers.env cannot
  # drift from the inline compose defaults. Pure Python, no registry access.
  # ---------------------------------------------------------------------------
  compose-golden:
    name: Container Coordinates Golden
    needs: prepare-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Unit-test static CI and deployment guards
        run: |
          python3 .github/scripts/test_agent_config_defaults.py
          python3 .github/scripts/test_compose_image_golden.py
          python3 .github/scripts/test_helm_release_channel_policy.py
          python3 .github/scripts/test_diagnose_sonarqube_failure.py

      - name: Unit-test the release-set tooling
        run: python3 .github/scripts/test_release_set.py

      - name: Unit-test the build change detection
        run: |
          python3 .github/scripts/test_detect_changed_images.py
          python3 .github/scripts/test_container_build_plan.py

      - name: Unit-test the downstream GHCR candidate reporter
        run: |
          python3 .github/scripts/test_github_build_run.py
          python3 .github/scripts/test_prepare_downstream_release_set.py
          python3 .github/scripts/test_trigger_downstream_pipeline.py
          python3 .github/scripts/test_advance_ghcr_alias.py
          python3 .github/scripts/test_cleanup_pr_tags.py

      - name: Unit-test the GHCR immutability/provenance guard
        run: python3 .github/scripts/test_ghcr_image_guard.py

      - name: Verify resolved image refs match the golden file
        run: python3 .github/scripts/compose_image_golden.py

      - name: Verify profile dependency closure over the container inventory
        run: python3 .github/scripts/release_set.py closure

  # ---------------------------------------------------------------------------
  # Job 12: Wait for this commit's separate Build Dev Images workflow
  # ---------------------------------------------------------------------------
  # GitHub Actions cannot express `needs` across workflow files. Treat the
  # successful release-set artifact as the completion signal, then pass that
  # exact artifact to the downstream trigger job.
  wait-for-build-dev-images:
    name: Wait for Build Dev Images
    needs: prepare-source
    if: needs.prepare-source.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 140
    outputs:
      run-downstream: ${{ steps.release-set.outputs.run_downstream }}
    permissions:
      actions: read
      contents: read
    steps:
      # Full history: the downstream gate diffs changed paths against the
      # previous commit. A shallow checkout makes that diff fail, which
      # fails open and runs downstream for every push -- safe, but it
      # defeats the gate.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Wait for successful GHCR release set
        id: release-set
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/prepare_downstream_release_set.py \
            --attempts 520 \
            --interval-seconds 15 \
            --repo-root . \
            --before "${{ github.event.before }}"


  # ---------------------------------------------------------------------------
  # Job 12: OSRB dispatch wiring
  # ---------------------------------------------------------------------------
  # The OSRB Review workflow itself runs on `workflow_run` from the default
  # branch, so a pull request never executes its own copy. These tests are the
  # only pre-merge signal on that wiring: they assert the workflow supplies
  # every variable the downstream helpers require, keeps the private code-ref
  # choice out of the public repo, and creates the check before anything that
  # can fail.
  osrb-dispatch:
    name: OSRB Dispatch Wiring
    needs: prepare-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false

      - name: Unit-test the OSRB dispatch boundary
        run: python3 .github/scripts/test_osrb_dispatch.py

  # ---------------------------------------------------------------------------
  # Job 13: Trigger downstream pipeline and poll it to completion
  # ---------------------------------------------------------------------------
  trigger-downstream-pipeline:
    name: Trigger Downstream Pipeline
    # Intentionally NOT depending on `test` (pytest) or `frontend-build`
    # so they run in parallel with this job - the downstream pipeline is
    # the long pole (~hours), and the upstream pytest / UI build are
    # independent of what the downstream pipeline exercises. They still
    # gate the overall workflow conclusion via GitHub's required checks.
    needs:
      - prepare-source
      - lint
      - codec-installer-test
      - typecheck
      - security
      - frontend-lint
      - copyright-headers
      - dco
      - license-check-python
      - license-check-ui
      - folder-structure
      - wait-for-build-dev-images
    if: >-
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      !contains(needs.*.result, 'skipped') &&
      needs.wait-for-build-dev-images.outputs.run-downstream == 'true'
    runs-on: [self-hosted, downstream-pipeline]
    # Holds the runner until the downstream pipeline completes. Must be
    # at least as long as MAX_POLL_DURATION_SECONDS in the poll step
    # (+ a small safety buffer).
    timeout-minutes: 310
    permissions:
      actions: read
      contents: read
      # Needed so the trigger script can resolve the PR's base branch and
      # the candidate reporter can update the validated-image PR comment.
      # The workflow runs on `pull-request/<N>` synthetic push refs created
      # by copy-pr-bot rather than on a `pull_request` event.
      pull-requests: write
      issues: write
    env:
      DOWNSTREAM_CI_URL: ${{ secrets.DOWNSTREAM_CI_URL }}
      DOWNSTREAM_CI_TOKEN: ${{ secrets.DOWNSTREAM_CI_TOKEN }}
      DOWNSTREAM_PROJECT_PATH: ${{ secrets.DOWNSTREAM_PROJECT_PATH }}
      DOWNSTREAM_REF: main
      DOWNSTREAM_SUBMODULE_HASH_VARIABLE: VSS_SUBMODULE_HASH
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: source-${{ github.sha }}
          path: .source-artifact

      - name: Unpack source artifact
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .source-artifact -exec rm -rf {} +
          tar -xzf .source-artifact/source.tar.gz --strip-components=1
          mkdir -p .ci
          mv .source-artifact/tracked-files.txt .ci/tracked-files.txt
          rm -rf .source-artifact

      - name: Prepare GHCR release-set handoff
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/prepare_downstream_release_set.py

      - name: Trigger pipeline
        id: trigger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/trigger_downstream_pipeline.py

      - name: Poll pipeline
        env:
          DOWNSTREAM_PIPELINE_ID: ${{ steps.trigger.outputs.pipeline_id }}
          DOWNSTREAM_PROJECT_ID: ${{ steps.trigger.outputs.project_id }}
          POLL_INTERVAL_SECONDS: "120"
          MAX_POLL_DURATION_SECONDS: "14400"  # 4 hours
        run: python3 .github/scripts/poll-downstream-pipeline.py
