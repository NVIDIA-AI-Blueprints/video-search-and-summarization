#
# VSS skill-eval CPU coordinator metrics.
# Secrets and host identity are supplied by the systemd EnvironmentFile.

[global_tags]
  coordinator_id = "${COORDINATOR_ID}"
  fleet = "vss-skill-eval-distributed"

[agent]
  interval = "15s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "1s"
  flush_interval = "15s"
  flush_jitter = "2s"
  precision = "1s"
  hostname = "${COORDINATOR_ID}"
  omit_hostname = false

[[inputs.cpu]]
  percpu = true
  totalcpu = true
  collect_cpu_time = false
  report_active = true

[[inputs.mem]]

[[inputs.swap]]

[[inputs.system]]

[[inputs.processes]]

[[inputs.disk]]
  mount_points = ["/"]
  ignore_fs = [
    "tmpfs",
    "devtmpfs",
    "devfs",
    "iso9660",
    "overlay",
    "aufs",
    "squashfs",
  ]

[[inputs.diskio]]
  skip_serial_number = true

[[inputs.exec]]
  commands = ["sudo -n /usr/local/libexec/vss-skill-eval/ha-health-probe.sh"]
  timeout = "15s"
  data_format = "influx"

[[outputs.influxdb_v2]]
  urls = ["${INFLUX_URL}"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
  timeout = "10s"
  content_encoding = "gzip"
