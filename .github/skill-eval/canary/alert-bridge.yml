# POC-only patch copied into _builds/<name>/patches/alert-bridge.yml.
# The build context is an absolute path derived from the deployment's
# VSS_APPS_DIR; the standard pull --ignore-buildable / up --build path then
# builds this one service locally without publishing or replacing stock tags.
services:
  alert-bridge:
    image: vss1009-alert-auth:develop-latest
    build:
      context: ${VSS_APPS_DIR}/../../services/alert
      dockerfile: Dockerfile.canary-auth
