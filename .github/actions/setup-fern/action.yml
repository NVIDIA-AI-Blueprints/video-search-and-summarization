# Install Node.js and the Fern CLI version pinned in fern/fern.config.json.
# Requires the repository to be checked out first.

name: Set up Fern CLI
description: Install Node.js and the pinned Fern CLI.

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '20'

    - name: Install Fern CLI
      shell: bash
      run: |
        set -euo pipefail
        VERSION=$(jq -r .version fern/fern.config.json)
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::fern/fern.config.json .version '$VERSION' must pin an exact X.Y.Z Fern CLI version"
          exit 1
        fi
        npm install -g "fern-api@${VERSION}"
