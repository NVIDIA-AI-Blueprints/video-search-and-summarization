# VSS NemoClaw preset — applied with `nemoclaw <sandbox> policy-add --from-file`.
# Merges into the live sandbox policy instead of replacing it, so the base
# OpenShell filesystem / landlock / process rules stay intact.

preset:
  name: vss
  description: "VSS network access (NVIDIA endpoints, OpenClaw infra, VSS backend, optional channels)"

network_policies:
  claude_code:
    name: claude_code
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: statsig.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: sentry.io
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: platform.claude.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/v1/oauth/**" }
          - allow: { method: POST, path: "/v1/oauth/**" }
    # OpenShell enforces on the kernel-trusted /proc/<pid>/exe. A global npm
    # install resolves to the package launcher rather than the bin/claude shim,
    # and the CLI may surface as the Node runtime instead.
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/bin/claude }
      - { path: /tmp/npm-global/bin/claude }
      - { path: /tmp/npm-global/lib/node_modules/@anthropic-ai/claude-code/bin/claude.exe }
      - { path: /home/linuxbrew/.linuxbrew/bin/claude }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }

  github:
    name: github
    endpoints:
      - host: github.com
        port: 443
        access: full
      - host: api.github.com
        port: 443
        access: full
    # The sandbox base image apt-installs git but not gh.
    binaries:
      - { path: /usr/bin/git }

  # Named clawhub_assets, not clawhub: presets merge into the live policy by
  # policy name and override on collision, so reusing `clawhub` would replace
  # the base policy's clawhub.ai entry (which carries allow_encoded_slash for
  # @scope%2Fname package paths) instead of adding to it.
  clawhub_assets:
    name: clawhub_assets
    endpoints:
      - host: registry.clawhub.ai
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: cdn.clawhub.ai
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
    binaries:
      - { path: /usr/local/bin/openclaw }
      - { path: /usr/local/bin/node }

  telegram:
    name: telegram
    endpoints:
      - host: api.telegram.org
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/bot*/**" }
          - allow: { method: POST, path: "/bot*/**" }
    binaries:
      - { path: /usr/local/bin/node }

  discord:
    name: discord
    endpoints:
      - host: discord.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: gateway.discord.gg
        port: 443
        access: full
      - host: cdn.discordapp.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
    binaries:
      - { path: /usr/local/bin/node }

  pypi:
    name: pypi
    endpoints:
      - host: pypi.org
        port: 443
        access: full
      - host: files.pythonhosted.org
        port: 443
        access: full
    # uv resolves and downloads in-process rather than shelling out to pip, so
    # its own path has to be listed here or every wheel fetch from
    # files.pythonhosted.org fails with `tunnel error: unsuccessful`. See
    # vss-cli-build below for why uv lands under /tmp/.local/bin.
    binaries:
      - { path: /usr/bin/python3 }
      - { path: /usr/bin/python3.13 }
      - { path: /usr/bin/pip }
      - { path: /usr/bin/pip3 }
      - { path: /usr/bin/curl }
      - { path: /usr/local/bin/node }
      - { path: /tmp/.local/bin/uv }
      - { path: /tmp/.local/bin/uvx }
      - { path: /usr/local/bin/uv }
      - { path: /root/.local/bin/uv }
      - { path: /sandbox/.local/bin/uv }

  slack:
    name: slack
    endpoints:
      - host: slack.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
    binaries:
      - { path: /usr/bin/python3 }
      - { path: /usr/bin/python3.13 }
      - { path: /usr/bin/curl }
      - { path: /usr/local/bin/node }

  vss-backend:
    name: vss-backend-readwrite
    # Keep this scoped to Docker bridge CIDRs used by supported OpenShell /
    # NemoClaw drivers. Do not use the full 172.16.0.0/12 private range.
    endpoints:
      - host: host.openshell.internal
        port: 8000
        access: full
        allowed_ips:
          - 172.17.0.0/16
          - 172.18.0.0/16
          - 172.20.0.0/16
      - host: host.openshell.internal
        port: 30888
        access: full
        allowed_ips:
          - 172.17.0.0/16
          - 172.18.0.0/16
          - 172.20.0.0/16
      - host: host.openshell.internal
        port: 5601
        access: full
        allowed_ips:
          - 172.17.0.0/16
          - 172.18.0.0/16
          - 172.20.0.0/16
      - host: host.openshell.internal
        port: 9200
        access: full
        allowed_ips:
          - 172.17.0.0/16
          - 172.18.0.0/16
          - 172.20.0.0/16
      - host: host.openshell.internal
        port: 8081
        access: full
        allowed_ips:
          - 172.17.0.0/16
          - 172.18.0.0/16
          - 172.20.0.0/16
      - host: host.openshell.internal
        port: 9080
        access: full
        allowed_ips:
          - 172.17.0.0/16
          - 172.18.0.0/16
          - 172.20.0.0/16
      - host: host.openshell.internal
        port: 9988
        access: full
        allowed_ips:
          - 172.17.0.0/16
          - 172.18.0.0/16
          - 172.20.0.0/16
      - host: host.openshell.internal
        port: 18789
        access: full
        allowed_ips:
          - 172.17.0.0/16
          - 172.18.0.0/16
          - 172.20.0.0/16
      # Agent UI (3000), Auto-Calibration UI (5000), Phoenix (6006), VST MCP (8001),
      # Auto-Calibration MS (8010), RT-Embed (8017), RT-VLM (8018), Kafka (9092),
      # VA-MCP (9901), NvStreamer UI (31000), LVS REST (38111), LVS MCP (38112).
      - host: host.openshell.internal
        port: 3000
        access: full
        allowed_ips:
          - 172.17.0.0/16
          - 172.18.0.0/16
          - 172.20.0.0/16
      - host: host.openshell.internal
        port: 5000
        access: full
        allowed_ips:
          - 172.17.0.0/16
          - 172.18.0.0/16
          - 172.20.0.0/16
      - host: host.openshell.internal
        port: 6006
        access: full
        allowed_ips:
          - 172.17.0.0/16
          - 172.18.0.0/16
          - 172.20.0.0/16
      - host: host.openshell.internal
        port: 8001
        access: full
        allowed_ips:
          - 172.17.0.0/16
          - 172.18.0.0/16
          - 172.20.0.0/16
      - host: host.openshell.internal
        port: 8010
        access: full
        allowed_ips:
          - 172.17.0.0/16
          - 172.18.0.0/16
          - 172.20.0.0/16
      - host: host.openshell.internal
        port: 8017
        access: full
        allowed_ips:
          - 172.17.0.0/16
          - 172.18.0.0/16
          - 172.20.0.0/16
      - host: host.openshell.internal
        port: 8018
        access: full
        allowed_ips:
          - 172.17.0.0/16
          - 172.18.0.0/16
          - 172.20.0.0/16
      - host: host.openshell.internal
        port: 9092
        access: full
        allowed_ips:
          - 172.17.0.0/16
          - 172.18.0.0/16
          - 172.20.0.0/16
      - host: host.openshell.internal
        port: 9901
        access: full
        allowed_ips:
          - 172.17.0.0/16
          - 172.18.0.0/16
          - 172.20.0.0/16
      - host: host.openshell.internal
        port: 31000
        access: full
        allowed_ips:
          - 172.17.0.0/16
          - 172.18.0.0/16
          - 172.20.0.0/16
      - host: host.openshell.internal
        port: 38111
        access: full
        allowed_ips:
          - 172.17.0.0/16
          - 172.18.0.0/16
          - 172.20.0.0/16
      - host: host.openshell.internal
        port: 38112
        access: full
        allowed_ips:
          - 172.17.0.0/16
          - 172.18.0.0/16
          - 172.20.0.0/16
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/local/bin/node }
      - { path: /usr/local/bin/openclaw }
      - { path: /usr/bin/python3 }
      - { path: /usr/bin/python3.13 }

  # Kubernetes developer profiles publish nothing on host.openshell.internal:
  # every HTTP surface sits behind one path-based Ingress on the node running
  # the controller, so the Ingress host has to be named here. Set it to the
  # deployment's `global.externalHost` (`vss-<profile>.<node-ip>.nip.io`) and
  # re-apply; the value below is an example, not a fixture. Port 80 is the
  # HAProxy Ingress hostPort from the profile READMEs -- use 443 instead when
  # ingress.tls is configured.
  vss-k8s-ingress:
    name: vss-k8s-ingress
    endpoints:
      - host: vss-search.140.238.93.91.nip.io
        port: 80
        access: full
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/python3 }
      - { path: /usr/bin/python3.13 }
      - { path: /usr/local/bin/node }

  # `vss search run` is not a standalone binary: the skills invoke it as
  # `uv run --project services/agent --extra cli vss`, so a sandbox that
  # operates a deployment through the host CLI must also resolve that project.
  # The `pypi` policy above carries pypi.org and files.pythonhosted.org, and it
  # now lists uv among its binaries -- that pairing is what --extra cli actually
  # runs on, since nvidia-vss-cli needs only click plus nvidia-vss-core's seven
  # PyPI dependencies. Install uv from PyPI rather than the astral.sh script,
  # which redirects to release assets this policy does not name.
  #
  # The indexes below are the remaining ones services/agent/pyproject.toml
  # declares. They matter for --extra agent (torch resolves through
  # pytorch-cpu), not for --extra cli, but uv reads every index the project
  # declares while resolving. ngc-data-platform is omitted: it is
  # NVIDIA-internal and only `nvdataset` resolves through it, which neither
  # extra pulls.
  #
  # Build the venv with `--python /usr/bin/python3.13`. OpenShell enforces on
  # the kernel-trusted /proc/<pid>/exe, and a uv-managed interpreter under
  # ~/.local/share/uv/python/ resolves to a path no policy here lists -- the
  # Elasticsearch and RT-Embed calls run under that interpreter, not under curl.
  vss-cli-build:
    name: vss-cli-build
    endpoints:
      - host: pypi.nvidia.com
        port: 443
        access: full
      - host: download.pytorch.org
        port: 443
        access: full
    # uv is a standalone binary and makes its own requests, so its path is
    # enforced, not the shell's. The sandbox user is unprivileged and the base
    # image is PEP 668 externally-managed, so the install route is
    # `pip install --user --break-system-packages uv`. The sandbox presets
    # PYTHONUSERBASE=/tmp/.local, so that lands at /tmp/.local/bin/uv -- the
    # same /tmp convention claude_code already covers for /tmp/npm-global, and
    # NOT $HOME/.local/bin as the pip docs imply. The other paths are fallbacks
    # for drivers that leave PYTHONUSERBASE unset. pip itself passes on
    # /usr/bin/pip3, and a venv's bin/python symlinks to /usr/bin/python3.13.
    binaries:
      - { path: /tmp/.local/bin/uv }
      - { path: /tmp/.local/bin/uvx }
      - { path: /usr/local/bin/uv }
      - { path: /root/.local/bin/uv }
      - { path: /sandbox/.local/bin/uv }
      - { path: /home/sandbox/.local/bin/uv }
      - { path: /usr/bin/python3 }
      - { path: /usr/bin/python3.13 }
      - { path: /usr/bin/pip }
      - { path: /usr/bin/pip3 }
      - { path: /usr/bin/curl }
