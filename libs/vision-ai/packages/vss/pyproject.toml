[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vss_vision_ai"]

[project]
name = "nvidia-vss-vision-ai"
version = "0.1.0"
description = "Vision AI tool adapter for VSS ingestion and summarization"
requires-python = ">=3.13,<3.15"
license = "Apache-2.0"
authors = [{ name = "NVIDIA Corporation" }]
maintainers = [{ name = "NVIDIA Corporation" }]
dependencies = [
    "nvidia-vision-ai>=0.1.0.dev0,<0.2",
    "vss==0.1.0",
    "vss-ingestion==0.1.0",
    "vss-summarization[openai]==0.1.0",
]

[project.entry-points."vision_ai.tools"]
vss = "vss_vision_ai:TOOL"

[tool.uv.sources]
nvidia-vision-ai = { workspace = true }
vss = { path = "../../../vss", editable = true }
vss-ingestion = { path = "../../../vss/packages/ingestion", editable = true }
vss-summarization = { path = "../../../vss/packages/summarization", editable = true }
