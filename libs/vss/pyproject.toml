[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vss"]

[tool.hatch.build.targets.sdist]
include = ["/src/vss", "/README.md"]

[project]
name = "vss"
version = "0.1.0rc1"
description = "Core video processing and storage libraries for VSS workflows"
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = "Apache-2.0"
authors = [{ name = "NVIDIA Corporation" }]
maintainers = [{ name = "NVIDIA Corporation" }]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.0",
]

[project.optional-dependencies]
telemetry = [
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
]
mcp = [
    "mcp>=1.20,<2",
    "vss-summarization[openai]==0.1.0rc1",
]
mcp-core = [
    "mcp>=1.20,<2",
]
storage = [
    "elasticsearch[async]>=8.17,<9",
]

[tool.uv]
constraint-dependencies = [
    "aiohttp>=3.14.0",
    "authlib>=1.7.2,<1.8",
    "bleach>=6.4.0",
    "cffi==2.0.0",
    "cryptography>=50.0.0",
    "langchain>=1.3.9,<1.4",
    "langchain-classic>=1.0.7",
    "langchain-community>=0.3.27",
    "langchain-core>=1.4.9,<1.5",
    "langgraph>=1.2.5,<1.3",
    "langgraph-checkpoint>=4.0.0",
    "langsmith>=0.8.0",
    "litellm>=1.84.0,<1.85",
    "lxml>=6.1.0,<6.2",
    "mako>=1.3.12",
    "mcp>=1.28.1",
    "pillow>=12.3.0",
    "pygments>=2.20.0",
    "pyjwt>=2.13.0,<2.14",
    "pyopenssl>=26.0.0",
    "pypdf>=6.7.3",
    "pytest>=9.0.3",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    "tokenizers==0.22.2",
    "torch>=2.10.0",
    "tornado>=6.5.7,<6.6",
    "transformers>=5.5.0,<6",
    "urllib3>=2.7.0",
]

[tool.uv.workspace]
members = [
    "core",
    "cli",
    "packages/ingestion",
    "packages/summarization",
]

[tool.uv.sources]
nvidia-vss-core = { workspace = true }
nvidia-vss-cli = { workspace = true }
vss = { workspace = true }
vss-ingestion = { workspace = true }
vss-summarization = { workspace = true }

[dependency-groups]
benchmarks = [
    "elasticsearch[async]>=8.17,<9",
    "nvidia-ml-py>=12,<14",
    "openai>=1.0",
    "psutil>=7.2,<8",
    "requests>=2.34.2,<3",
    "xlsxwriter>=3.2,<4",
]
dev = [
    "import-linter",
    "mcp>=1.20,<2",
    "mypy>=1.15.0",
    "pyright>=1.1.414",
    "pytest>=8.4.1",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20250915",
    "vss-summarization[openai]",
]
docs = [
    "nvidia-sphinx-theme>=0.0.9.post1,<0.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = [
    "core/tests/unit_test",
    "cli/tests/unit_test",
    "tests",
]
markers = [
    "functional: requires a live RTVI service and GPU inference",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
relative_files = true
source = [
    "core/src",
    "cli/src",
    "src/vss",
    "packages/ingestion/src/vss",
    "packages/summarization/src/vss",
]
omit = ["*/tests/*", "*/test_*.py", "*/sitecustomize.py"]

[tool.coverage.paths]
source = [
    "src/vss",
    "packages/*/src/vss",
    "*/src/vss",
    "*/packages/*/src/vss",
    "*\\src\\vss",
]

[tool.coverage.report]
show_missing = true

[tool.ruff]
target-version = "py313"
line-length = 88
src = [
    "benchmarks",
    "core/src",
    "cli/src",
    "src",
    "packages/ingestion/src",
    "packages/summarization/src",
]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["benchmarks", "vss", "vss_cli", "vss_core"]

[tool.pyright]
include = [
    "src",
    "packages/ingestion/src",
    "packages/summarization/src",
    "tests/mcp",
]
extraPaths = [
    "src",
    "packages/ingestion/src",
    "packages/summarization/src",
]
pythonVersion = "3.13"
typeCheckingMode = "standard"
