# ---------------------------------------------------------------------------
# The VSS library, NAT-free by construction.
#
# This workspace root is also the core distribution: src/nvidia_vss/. Every
# other member contributes to the same `nvidia_vss` import namespace, which is
# why src/nvidia_vss/ has no __init__.py (PEP 420). They share one lock and
# release in lockstep. The NAT agent lives in services/agent and consumes these
# as path sources, so the dependency runs one way: the agent uses the library,
# never the reverse.
# ---------------------------------------------------------------------------

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options.root = "../.."
raw-options.git_describe_command = [
  "git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*",
]
raw-options.version_scheme = "no-guess-dev"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# nvidia_vss: NAT-free libraries (media, vlm, memory, introspection, _foundation)
# plus knowledge (BackendAdapter ABC/schema/factory + lazily-loaded
# adapters). The import stays light: factory.py resolves adapters via importlib,
# so heavy backend deps only load when a backend is selected -- see the optional
# extras. A namespace package: the wheel must not ship nvidia_vss/__init__.py.
packages = ["src/nvidia_vss"]

[tool.hatch.build.targets.wheel.force-include]
# Startup hook shipped as a top-level module (loaded by CPython at interpreter start).
"src/sitecustomize.py" = "sitecustomize.py"

[project]
name = "nvidia-vss"
dynamic = ["version"]
requires-python = ">=3.13,<3.15"
description = "NVIDIA VSS core libraries (NAT-free): media, vlm, memory, introspection, knowledge interface"
license = "Apache-2.0"
keywords = ["ai", "rag", "search"]
authors = [{ name = "NVIDIA Corporation" }]
maintainers = [{ name = "NVIDIA Corporation" }]
# The base install is intentionally light (NAT-free). Keep sorted!!!
dependencies = [
  "aiohttp~=3.14",
  "elasticsearch[requests]~=8.17.0",
  "httpx~=0.28",
  "opencv-python-headless>=4.13.0.92",
  "pydantic >=2.11,<3",
  "PyYAML~=6.0",
  "tenacity~=9.0",
]

[project.optional-dependencies]
# Opt-in knowledge-retrieval backends; lazily imported by the factory.
frag_lib = ["nvidia-rag>=2.4.0"]
llama_index = [
    "chromadb>=0.5",
    "llama-index-core>=0.11",
    "llama-index-vector-stores-chroma>=0.3",
    "llama-index-embeddings-nvidia>=0.3",
]
langchain = [
    "chromadb>=0.5",
    "langchain-chroma>=0.1",
    "langchain-nvidia-ai-endpoints>=0.3",
]
arango_graph = [
    "langchain-classic>=1.0",
    "langchain-community>=0.3.27",
    "python-arango>=8.2",
]

# Security: constrain transitive dependencies to patch HIGH/CRITICAL CVEs.
# Kept identical to services/agent/pyproject.toml so the two workspaces cannot
# drift. Constraints bound versions already in the graph; they never add a
# dependency, so the entries this NAT-free workspace does not resolve are inert.
[tool.uv]
constraint-dependencies = [
    "aiohttp>=3.14.0",              # Fix CVE-2026-50269 (multipart header injection)
    "authlib>=1.7.2,<1.8",          # Fix GHSA-wvwj-cvrp-7pv5 + new BDSAs for cache-CSRF in starlette_client.OAuth and jwk-header signature bypass (both flagged on 1.6.12)
    "bleach>=6.4.0",                # Fix BDSA-2026-15483 (Unicode URI-scheme sanitization bypass)
    "cffi==2.0.0",                  # Keep permissive MIT metadata; cffi 2.1.0 reports MIT-0, which is not yet accepted by the repository license gate
    "cryptography>=50.0.0",         # Fix CVE-2026-69247 (PKCS#7 Bleichenbacher oracle)
    "langchain>=1.3.9,<1.4",        # Fix GHSA-gr75-jv2w-4656
    "langchain-classic>=1.0.7",     # Fix CVE-2026-45134 (unsafe public prompt deserialization)
    "langchain-community>=0.3.27",  # Fix CVE-2025-6984 (XXE in EverNoteLoader)
    "langchain-core>=1.4.9,<1.5",   # Required by the fixed LangChain release line
    "langgraph>=1.2.5,<1.3",        # Required by the fixed LangChain release line
    "langgraph-checkpoint>=4.0.0",  # Fix CVE-2025-64439 (RCE in JsonPlusSerializer) & CVE-2026-27794 (BaseCache pickle)
    "langsmith>=0.8.0",             # Fix CVE-2026-45134 (unsafe public prompt deserialization)
    "litellm>=1.84.0,<1.85",        # Fix /guardrails/test_custom_code RCE + privilege escalation + JWT/OIDC userinfo cache misuse (all flagged on 1.83.14)
    "lxml>=6.1.0,<6.2",             # Fix GHSA-vfmq-68hx-4jfw
    "mako>=1.3.12",                 # Fix GHSA-2h4p-vjrc-8xpq (path traversal in TemplateLookup, Windows-only)
    "mcp>=1.28.1",                  # Fix CVE-2026-59950, CVE-2026-52870, and CVE-2026-52869
    "pillow>=12.3.0",               # Fix Pillow advisories through 12.2.0
    "pygments>=2.20.0",             # Fix BDSA: ReDoS in AdlLexer (lexers/archetype.py) flagged on 2.19.x
    "pyjwt>=2.13.0,<2.14",          # Fix PyJWT advisories through 2.12.1
    "pyopenssl>=26.0.0",            # Fix CVE-2026-27459 (DTLS cookie callback buffer overflow)
    "pypdf>=6.7.3",                 # Fix CVE-2026-27888 (XFA decompression bomb) & CVE-2026-27628 (infinite loop)
    "pytest>=9.0.3",                # Fix GHSA-6w46-j5rx-g56g
    "python-multipart>=0.0.31",     # Fix multipart advisories through 0.0.28
    "starlette>=1.3.1",             # Fix Starlette advisories through 0.52.1
    "tokenizers==0.22.2",           # Keep the stable release while prereleases are globally enabled
    "torch>=2.10.0",                # Fix CVE-2026-24747 and CVE-2025-32434 (unsafe checkpoint loading)
    "tornado>=6.5.7,<6.6",          # Fix Tornado advisories through 6.5.5
    "transformers>=5.5.0,<6",       # Fix Transformers advisories through 5.4
    "urllib3>=2.7.0",               # Fix GHSA-mf9v-mfxr-j63j (decompression bomb in streaming API) & GHSA-qccp-gfcp-xxvc (cross-origin header leak on proxied redirects)
]

[tool.uv.workspace]
members = ["cli", "packages/*"]

[tool.uv.sources]
nvidia-vss = { workspace = true }
nvidia-vss-cli = { workspace = true }
nvidia-vss-search = { workspace = true }
nvidia-vss-analytics = { workspace = true }

# The library's own tooling. NAT-free on purpose: nothing here may pull the
# agent stack, which is what keeps `import nat` impossible in a cli install.
[dependency-groups]
dev = [
    # The root project is the core library, so on its own `uv run` and
    # `uv sync` would install only nvidia-vss. This keeps
    # `uv run --project libs/vss vss` -- the documented way to run the CLI
    # from a checkout -- installing the CLI and every plugin group.
    "nvidia-vss-cli[all]",
    "mypy>=1.15.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.1",
    "ruff>=0.12.0",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.ruff]
# Pinned rather than inferred from requires-python, so every member (and
# services/agent) sorts imports against the same stdlib list.
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP", "ARG", "SIM", "TCH", "Q", "RUF"]
ignore = ["E501", "W505", "SIM108", "B024"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/tests/**" = ["ARG001", "ARG002", "SIM117", "B017"]
# Memory helpers keep runtime imports lazy (TC001/TC003) to stay NAT-free.
"src/nvidia_vss/memory/**" = ["TC001", "TC003"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 120
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["nvidia_vss", "vss_cli"]
split-on-trailing-comma = false
combine-as-imports = true
force-wrap-aliases = true
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
order-by-type = true
force-single-line = true
default-section = "third-party"

[tool.mypy]
# nvidia_vss is a namespace package: mypy maps files to modules from these
# roots rather than walking up to an __init__.py that does not exist.
mypy_path = "src:cli/src:packages/search/src:packages/analytics/src"
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = [
    "tests/unit_test",
    "cli/tests/unit_test",
    "packages/search/tests/unit_test",
    "packages/analytics/tests/unit_test",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--strict-config"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src", "cli/src", "packages/search/src", "packages/analytics/src"]
omit = ["*/tests/*", "*/test_*.py", "*/sitecustomize.py"]

[tool.coverage.report]
show_missing = true
