[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options.root = "../../.."
# Keep in sync with libs/vss/pyproject.toml [tool.hatch.version].
raw-options.git_describe_command = [
  "git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*",
]
raw-options.version_scheme = "no-guess-dev"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# vss_core: NAT-free libraries (search_core, vlm, vst, memory, _foundation).
packages = ["src/vss_core"]

[tool.hatch.build.targets.wheel.force-include]
# Startup hook shipped as a top-level module (loaded by CPython at interpreter start).
"src/sitecustomize.py" = "sitecustomize.py"

[project]
name = "nvidia-vss-core"
dynamic = ["version"]
requires-python = ">=3.13,<3.15"
description = "NVIDIA VSS core libraries (NAT-free): search (incl. critic verifier), vlm, vst"
license = "Apache-2.0"
keywords = ["ai", "rag", "search"]
authors = [{ name = "NVIDIA Corporation" }]
maintainers = [{ name = "NVIDIA Corporation" }]
# The base install is intentionally light (NAT-free). Keep sorted!!!
dependencies = [
  "aiohttp~=3.14",
  "elasticsearch[requests]~=8.17.0",
  "httpx~=0.28",
  "opencv-python-headless>=4.13.0.92",
  "pydantic >=2.11,<3",
  "PyYAML~=6.0",
  "tenacity~=9.0",
]
