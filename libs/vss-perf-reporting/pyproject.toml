[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vss-perf-reporting"
version = "0.1.0"
description = "Shared result schema, writer, platform discovery, and publishing for VSS performance benchmarks"
requires-python = ">=3.10"
dependencies = [
  "minio>=7.2,<8",
  "pydantic>=2.12,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
