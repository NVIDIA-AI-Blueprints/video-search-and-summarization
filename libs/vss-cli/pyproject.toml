[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
exclude = [
    "/.license-venv",
    "/.venv",
    "/.wheel-smoke",
    "/coverage.xml",
    "/dist",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lib"]

[project]
name = "nvidia-vss-cli"
version = "0.1.0"
description = "NAT-free VSS search library and host CLI"
requires-python = ">=3.13,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-3rd-party.txt"]
authors = [{ name = "NVIDIA Corporation" }]
maintainers = [{ name = "NVIDIA Corporation" }]
dependencies = [
    "aiohttp>=3.10",
    "elasticsearch~=8.17.0",
    "httpx>=0.28",
    "opencv-python-headless>=4.13.0.92",
    "pydantic>=2.11,<3",
    "PyYAML>=6.0",
    "tenacity>=9.0",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
frag-lib = ["nvidia-rag>=2.4.0"]
langchain = [
    "chromadb>=0.5",
    "langchain-chroma>=0.1",
    "langchain-nvidia-ai-endpoints>=0.3",
]
llama-index = [
    "chromadb>=0.5",
    "llama-index-core>=0.11",
    "llama-index-vector-stores-chroma>=0.3",
    "llama-index-embeddings-nvidia>=0.3",
]

[project.scripts]
vss-cli = "lib.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.1",
    "ruff>=0.12.0",
    "types-pyyaml>=6.0.12.20260107",
]

[tool.uv]
# The supported host command is ``uv run --project libs/vss-cli vss-cli``.
# Keep that path runtime-only; CI and contributors opt into tooling explicitly
# with ``--group dev``.
default-groups = []

[tool.uv.sources]
langchain-nvidia-ai-endpoints = { index = "pypi" }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP", "ARG", "SIM", "TCH", "Q", "RUF"]
ignore = ["E501", "W505", "SIM108", "B024"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ARG001", "ARG002", "SIM117", "B017"]

[tool.coverage.run]
source = ["src/lib"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
