#
# Warehouse industry-example gates.
#
# Behavior Analytics: Yun He's playback table (topic minus raw) from
# https://nvidia.slack.com/archives/C05RW9T7X7V/p1792432872569139
# Counts are lowered for a 60 s live window. Replace when Yun publishes
# warehouse live SLOs.
#
# Video Analytics API: same HTTP estimates as the dump-backed job until an
# owner publishes live-stack SLOs.

schema_version: "0.1"
service: warehouse-bp
source:
  setup: industry_example_warehouse_2d_kafka
  behavior_analytics_owner: Yun He
  video_analytics_api_owner: unset

scenarios:
  quick_test:
    warehouse-2d-kafka:
      behavior_analytics:
        required_topics:
          - raw
          - frames
          - behavior
          - events
          - incidents
        raw:
          min_count: 100
        frames:
          min_count: 100
          max_p50_s: 0.02
          max_p99_s: 0.05
        incidents:
          min_count: 1
          max_p50_s: 0.03
          max_p99_s: 0.06
        behavior:
          min_count: 1
          max_p50_s: 0.06
          max_p99_s: 0.12
        events:
          min_count: 1
          max_p50_s: 0.06
          max_p99_s: 0.12
      video_analytics_api:
        required_endpoints:
          - livez
          - frames
          - behavior
          - events
          - incidents
        livez:
          min_count: 10
          min_ok_ratio: 1.0
          max_p50_s: 0.005
          max_p99_s: 0.02
        frames:
          min_count: 10
          min_ok_ratio: 1.0
          max_p50_s: 0.05
          max_p99_s: 0.10
        behavior:
          min_count: 10
          min_ok_ratio: 1.0
          max_p50_s: 0.04
          max_p99_s: 0.08
        events:
          min_count: 10
          min_ok_ratio: 1.0
          max_p50_s: 0.04
          max_p99_s: 0.08
        incidents:
          min_count: 10
          min_ok_ratio: 1.0
          max_p50_s: 0.04
          max_p99_s: 0.08
        default:
          min_count: 10
          min_ok_ratio: 1.0
          max_p50_s: 0.10
          max_p99_s: 0.20
