global:
  vss_backend: http://localhost:7777
  output_dir: vss-perf-results
  upload_after_teardown: true
  dataset:
    resource: nvstaging/vss-warehouse/vss-warehouse-app-data:v3.3.0-09152026
    video_path: videos/nv-warehouse-4cams/Camera_03.mp4
  minio:
    endpoint: 10.111.52.248:9000
    bucket: perf-results
    secure: false
  service: compose-base
  rt_cv_container: vss-rtvi-cv
  stage_timeouts:
    pre_flight: 30
    deploy: 45
    post_deploy: 20
    benchmark: 30
    teardown: 5
  # The benchmark samples the shared resource collector during its measurement window.
  gpu_monitoring: {enabled: true, interval_seconds: 1}
  cpu_monitoring: {enabled: true, interval_seconds: 1}
test_scenarios:
  quick_test:
    description: One real RTSP stream with RT-CV FPS and VIOS/analytics CLI latency.
    benchmark_mode: compose_base
    duration_seconds: 30
    interval_seconds: 2
    warmup_iterations: 2
    expected_streams: 1
    expected_analytics_sensors: 0
    thresholds:
      min_rt_cv_fps: 1.0
      max_cli_p95_seconds: 10.0
  sustained_test:
    description: Sustained single-stream throughput and client latency.
    benchmark_mode: compose_base
    duration_seconds: 300
    interval_seconds: 2
    warmup_iterations: 3
    expected_streams: 1
    expected_analytics_sensors: 0
    thresholds:
      min_rt_cv_fps: 1.0
      max_cli_p95_seconds: 10.0
