# The ceiling a Hermes harness sandbox with the VSS layer may be granted:
# ../hermes/boundary.yaml plus the two grants the layer adds. The rationale for
# both files is in ../hermes/boundary.yaml.

version: 1

filesystem_policy:
  read_only:  [/usr, /bin, /sbin, /lib, /lib64, /etc, /opt, /proc]
  read_write: [/sandbox, /tmp, /dev/null, /dev/urandom]

landlock: { compatibility: best_effort }

process:  { run_as_user: "998", run_as_group: "999" }   # `sandbox` in the image

network_policies:
  vss-backend-max:
    name: vss-backend-max
    endpoints:
      - { host: host.openshell.internal, port: 7777, protocol: tcp }
    binaries: [{ path: /usr/bin/python3.13 }]

  ngc-max:
    name: ngc-max
    endpoints:
      - { host: authn.nvidia.com,      port: 443, protocol: tcp }
      - { host: api.ngc.nvidia.com,    port: 443, protocol: tcp }
      - { host: xfiles.ngc.nvidia.com, port: 443, protocol: tcp }
    binaries: [{ path: /usr/local/lib/ngc-cli/ngc }]

  harness-rest-max:
    name: harness-rest-max
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: pypi.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/**" }
          - allow: { method: POST, path: "/**" }
    binaries: [{ path: /usr/bin/python3.13 }]
