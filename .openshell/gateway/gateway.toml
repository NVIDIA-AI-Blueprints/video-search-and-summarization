# OpenShell gateway configuration for the VSS harness profile.
# Mounted read-only at /etc/openshell/gateway.toml, loaded via
# OPENSHELL_GATEWAY_CONFIG. Derived from upstream deploy/docker/gateway.toml
# at v0.1.6.

[openshell]
version = 2

[openshell.gateway]
# The compose service names --bind-address/--port on the command, because the
# image CMD beats this file and `command: []` does not clear it.
bind_address        = "127.0.0.1:8080"
health_bind_address = "127.0.0.1:8081"
log_level           = "info"
compute_driver      = "docker"
disable_tls         = true

# Loopback-only listener: user calls are unauthenticated. A shared host needs
# mTLS instead. Supervisors still authenticate with the JWT keys below.
[openshell.gateway.auth]
allow_unauthenticated_users = true

# Written by the openshell-init service. Without this block every
# `sandbox create` fails with "docker sandboxes require launch-scoped
# gateway authentication".
[openshell.gateway.gateway_jwt]
signing_key_path = "/var/lib/openshell/tls/jwt/signing.pem"
public_key_path  = "/var/lib/openshell/tls/jwt/public.pem"
kid_path         = "/var/lib/openshell/tls/jwt/kid"
gateway_id       = "openshell-docker"

[openshell.drivers.docker]
default_image     = "nvcr.io/nvidia/base/ubuntu:24.04"
# Pinned to the gateway release: since 0.1.6 a new sandbox requires matching
# supervisor and sandbox-runtime binaries, so `latest` is a sandbox that
# refuses to start.
sandbox_runtime_image = "ghcr.io/nvidia/openshell/sandbox:0.1.6"
supervisor_image  = "ghcr.io/nvidia/openshell/supervisor:0.1.6"
image_pull_policy = "if_not_present"
sandbox_label     = "openshell"
app_armor_profile = "Unconfined"
