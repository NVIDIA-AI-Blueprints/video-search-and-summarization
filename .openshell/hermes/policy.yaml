# VSS Hermes harness policy — the OpenShell-native translation of
# assets/vss_nemoclaw_policy.yaml, which was authored for OpenClaw.
#
# Differences from the preset it replaces:
#   - `tls: terminate` is gone. 0.1.x rejects it; unspecified already means
#     detect and terminate when inspection is configured.
#   - `binaries` names /usr/bin/python3.13, the interpreter. Every `hermes`
#     entry point in the image is a Python script, so no process ever carries
#     one of those paths.
#   - A plain TCP grant is `protocol: tcp`, not `access: full`. `access` is an
#     L7 preset, so pairing it with the default L4 protocol makes the prover
#     report "mixes REST controls into L4 authority".
#   - L4 and REST endpoints live in separate named policies for the same
#     reason.

version: 1

filesystem_policy:
  read_only:  [/usr, /bin, /sbin, /lib, /lib64, /etc, /opt, /proc]
  read_write: [/sandbox, /tmp, /dev/null, /dev/urandom]

landlock: { compatibility: best_effort }

# 998:999 is `sandbox` in the .hermes image. Root is not an option: the
# gateway rejects run_as_user "0" outright, which is also why `nemoclaw-start`
# cannot be used as the entry command here — its runtime-config guard only
# takes the OpenShell path when /proc/1 has euid 0.
process:  { run_as_user: "998", run_as_group: "999" }

network_policies:
  vss-backend:
    name: vss-backend-readwrite
    endpoints:
      - { host: host.openshell.internal, port: 7777, protocol: tcp }
    binaries: [{ path: /usr/bin/python3.13 }]

  anthropic:
    name: anthropic
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce        # audit-mode REST is `unsupported`, not a pass
        rules:
          - allow: { method: POST, path: "/v1/**" }
    binaries: [{ path: /usr/bin/python3.13 }]

  pypi:
    name: pypi
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      - host: pypi.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
    binaries: [{ path: /usr/bin/python3.13 }]

  github:
    name: github
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/**" }
    binaries: [{ path: /usr/bin/python3.13 }]

  ngc:
    name: ngc
    endpoints:
      - { host: authn.nvidia.com,      port: 443, protocol: tcp }
      - { host: api.ngc.nvidia.com,    port: 443, protocol: tcp }
      - { host: xfiles.ngc.nvidia.com, port: 443, protocol: tcp }
    binaries: [{ path: /usr/local/lib/ngc-cli/ngc }]
