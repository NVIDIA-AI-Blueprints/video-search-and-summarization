# The ceiling VSS is willing to grant an OpenClaw harness sandbox; the
# counterpart of boundary-hermes.yaml, with the same rules. Same filesystem
# paths, process identity and exact binary paths as policy-openclaw.yaml,
# wider where it matters: every method on each host.

version: 1

filesystem_policy:
  read_only:  [/usr, /bin, /sbin, /lib, /lib64, /etc, /opt, /proc]
  read_write: [/sandbox, /tmp, /dev/null, /dev/urandom]

landlock: { compatibility: best_effort }

process:  { run_as_user: "998", run_as_group: "998" }   # `sandbox` in .openclaw

network_policies:
  vss-backend-max:
    name: vss-backend-max
    endpoints:
      - { host: host.openshell.internal, port: 7777, protocol: tcp }
    binaries:
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/python3.13 }

  harness-rest-max:
    name: harness-rest-max
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: openclaw.ai
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: clawhub.ai
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: registry.clawhub.ai
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: cdn.clawhub.ai
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: pypi.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET,  path: "/**" }
          - allow: { method: POST, path: "/**" }
    binaries:
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/python3.13 }
      - { path: /usr/bin/git }

  ngc-max:
    name: ngc-max
    endpoints:
      - { host: authn.nvidia.com,      port: 443, protocol: tcp }
      - { host: api.ngc.nvidia.com,    port: 443, protocol: tcp }
      - { host: xfiles.ngc.nvidia.com, port: 443, protocol: tcp }
    binaries: [{ path: /usr/local/lib/ngc-cli/ngc }]
