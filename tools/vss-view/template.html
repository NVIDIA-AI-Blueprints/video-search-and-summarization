<script>
"use strict";

  var FROZEN = SPEC.frozen === true;

  // ── helpers ───────────────────────────────────────────────────────
  // Resolve a dot-path ("info.reasoning") against an object. Returns undefined
  // rather than throwing so a heterogeneous nvschema doc never breaks a row.
  function dig(obj, path) {
    if (!path) return undefined;
    var cur = obj;
    var parts = String(path).split(".");
    for (var i = 0; i < parts.length; i++) {
      if (cur === null || typeof cur !== "object") return undefined;
      cur = cur[parts[i]];

    return cur;

  function str(v) {
    if (v === null || v === undefined) return "";
    if (typeof v === "object") { try { return JSON.stringify(v); } catch (e) { return ""; } }
    return String(v);

  // (javascript:, vbscript:, …) is dropped — spec data is not trusted markup.
  function safeUrl(v) {

    if (/^https?:\/\//i.test(s)) return s;

    var n = document.createElement(tag);

    if (text !== undefined && text !== null) n.textContent = str(text);

    var a = Math.abs(n);
    if (a >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, "") + "B";
    if (a >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";

    if (typeof v === "number") return new Date(v < 1e12 ? v * 1000 : v);
    var d = new Date(str(v));
    return isNaN(d.getTime()) ? null : d;

  function fmtAbs(d) {
    if (!d) return "—";
    var p = function (x) { return String(x).padStart(2, "0"); };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
           " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  }

  function fmtRel(d, now) {
    if (!d) return "";
    var s = Math.round(((now || Date.now()) - d.getTime()) / 1000);
    if (s < 0) return "in " + fmtRel(new Date(Date.now() * 2 - d.getTime()), Date.now()).replace(" ago", "");
    if (s < 10) return "just now";
    if (s < 60) return s + "s ago";
    if (s < 3600) return Math.floor(s / 60) + "m ago";
    if (s < 86400) return Math.floor(s / 3600) + "h ago";
    return Math.floor(s / 86400) + "d ago";

  // Verdict → status role. Status color NEVER carries meaning alone: every
  // badge ships an icon and the literal label too (see dataviz status rules).
  var VERDICT = {
    "confirmed":            { status: "critical", ico: "\u25C6", label: "confirmed" },
    "rejected":             { status: "good",     ico: "\u25CB", label: "rejected" },
    "not-confirmed":        { status: "warning",  ico: "\u25B3", label: "not confirmed" },
    "verification-failed":  { status: "serious",  ico: "\u2715", label: "verification failed" }
  };
  function verdictBadge(raw) {
    var key = str(raw).trim().toLowerCase();
    if (!key) return null;                       // freestyle deploys carry no verdict — valid
    var v = VERDICT[key] || { status: "neutral", ico: "\u25CB", label: key };
    var b = el("span", "badge");
    b.setAttribute("data-status", v.status);
    b.appendChild(el("span", "ico", v.ico));
    b.appendChild(el("span", null, v.label));
    return b;
  }

  // ── feeds: one poll loop per distinct endpoint, many subscribers ──
  var feeds = {};
  var paused = FROZEN;

  function feedKey(src) {
    return JSON.stringify([src.url, src.params || {}, src.items_path || ""]);
  }

  function getFeed(src) {
    var k = feedKey(src);
    if (!feeds[k]) {
      feeds[k] = {
        src: src, subs: [], raw: null, items: [],
        seen: Object.create(null), primed: false,
        error: null, timer: null, inflight: false
      };
    }
    return feeds[k];
  }

  function buildUrl(src) {
    var u = src.url;
    var p = src.params || {};
    var qs = Object.keys(p)
      .filter(function (k) { return p[k] !== null && p[k] !== undefined && p[k] !== ""; })
      .map(function (k) { return encodeURIComponent(k) + "=" + encodeURIComponent(p[k]); })
      .join("&");
    if (!qs) return u;
    return u + (u.indexOf("?") === -1 ? "?" : "&") + qs;

    if (feed.inflight || paused) return;
    feed.inflight = true;
    var ac = ("AbortController" in window) ? new AbortController() : null;
    var to = setTimeout(function () { if (ac) ac.abort(); }, 15000);
    fetch(buildUrl(feed.src), {

      cache: "no-store",
      signal: ac ? ac.signal : undefined,

      .then(function (r) {

        return r.json();

      .then(function (json) {

        feed.raw = json;
        var arr = feed.src.items_path ? dig(json, feed.src.items_path) : json;
        feed.items = Array.isArray(arr) ? arr : [];
        markFresh(feed);
        feed.subs.forEach(function (fn) { try { fn(feed); } catch (e) { console.error(e); } });
      })
      .catch(function (e) {
        feed.error = (e && e.name === "AbortError") ? "timed out" : (e && e.message) || "request failed";

        setStatus();

  // First successful response is the baseline — everything in it is "existing",
  // so the whole table doesn't flash green on load. Only later arrivals flash.
  function markFresh(feed) {
    var idPath = feed.src.id_path || "id";
    feed.items.forEach(function (it, i) {
      var id = str(dig(it, idPath)) || ("#" + i + ":" + str(dig(it, feed.src.time_path || "timestamp")));

      it.__vssNew = feed.primed && !feed.seen[id];
      feed.seen[id] = 1;

    feed.primed = true;

    Object.keys(feeds).forEach(function (k) {
      var f = feeds[k];
      if (f.timer) return;
      pollOnce(f);
      var iv = Math.max(1000, f.src.interval_ms || 5000);
      f.timer = setInterval(function () { pollOnce(f); }, iv);

    Object.keys(feeds).forEach(function (k) {
      if (feeds[k].timer) { clearInterval(feeds[k].timer); feeds[k].timer = null; }
    });
  }

  // `poll` subscribes to a shared feed and re-renders on every response.

      var items = (src && src.items) || [];
      items.forEach(function (it, i) { it.__vssId = str(dig(it, (src && src.id_path) || "id")) || ("#" + i); });
      render({ items: items, raw: (src && src.raw) || null, error: null, src: src || {} });
      return null;
    }
    var feed = getFeed(src);
    feed.subs.push(render);
    render(feed);
    return feed;
  }

  // ── blocks ────────────────────────────────────────────────────────
  var renderers = {};

  renderers.summary = function (block, host) {
    var row = el("div", "kpis");
    host.appendChild(row);
    bindSource(block.source, function (feed) {
      row.textContent = "";
      (block.items || []).forEach(function (item) {
        var tile = el("div", "kpi");
        tile.appendChild(el("div", "label", item.label));
        var v;
        if (item.value !== undefined) v = item.value;
        else if (item.value_path) v = dig(feed.raw, item.value_path);

        else v = "—";

        if (item.sub) tile.appendChild(el("div", "sub", item.sub));
        row.appendChild(tile);

      if (feed.error) {
        var e = el("div", "kpi");
        e.appendChild(el("div", "label", "Feed"));
        var w = el("div", "value", feed.error);
        w.style.fontSize = "13px";
        e.appendChild(w);
        row.appendChild(e);
      }
    });
  };

  renderers.incident_list = function (block, host) {
    var f = block.fields || {};
    var cols = block.columns || ["time", "sensor", "category", "description", "verdict", "media"];
    var LABEL = { time: "Time", sensor: "Sensor", category: "Category",

    var table = document.createElement("table");
    var thead = document.createElement("thead");
    var htr = document.createElement("tr");
    cols.forEach(function (c) { htr.appendChild(el("th", null, LABEL[c] || c)); });
    thead.appendChild(htr);
    var tbody = document.createElement("tbody");
    table.appendChild(thead);
    table.appendChild(tbody);
    card.appendChild(table);
    var note = el("div", "empty");
    card.appendChild(note);
    host.appendChild(card);

    bindSource(block.source, function (feed) {
      tbody.textContent = "";
      var items = feed.items.slice();
      if (block.newest_first !== false) {
        items.sort(function (a, b) {
          var ta = parseTime(dig(a, f.time || "timestamp"));
          var tb = parseTime(dig(b, f.time || "timestamp"));
          return (tb ? tb.getTime() : 0) - (ta ? ta.getTime() : 0);
        });
      }
      if (block.max_rows) items = items.slice(0, block.max_rows);

      if (!items.length) {
        note.textContent = feed.error
          ? "Feed error: " + feed.error
          : (block.empty_text || "No incidents in this window.");

      var names = block.sensor_names || {};

        cols.forEach(function (c) {

            var d = parseTime(dig(it, f.time || "timestamp"));
            td.appendChild(el("span", null, fmtAbs(d)));
            td.appendChild(el("span", "rel", fmtRel(d, now)));
          } else if (c === "sensor") {
            td = document.createElement("td");
            var sid = str(dig(it, f.sensor || "sensor_id"));
            td.appendChild(el("span", "chip", names[sid] || sid || "—"));
          } else if (c === "category") {
            td = document.createElement("td");
            var cat = str(dig(it, f.category || "category"));
            if (cat) td.appendChild(el("span", "chip", cat));
            else td.textContent = "—";
          } else if (c === "description") {
            td = el("td", "desc");
            var head = str(dig(it, f.description || "description"));
            td.appendChild(el("span", "headline", head || "—"));
            var why = str(dig(it, f.reasoning || "info.reasoning"));
            if (why) td.appendChild(el("span", "reason", why));
          } else if (c === "verdict") {
            td = document.createElement("td");
            var badge = verdictBadge(dig(it, f.verdict || "info.verdict"));
            if (badge) td.appendChild(badge);
            else td.appendChild(el("span", "chip", "no verdict"));
          } else if (c === "media") {
            td = document.createElement("td");
            var thumb = safeUrl(dig(it, f.thumbnail || "info.imagePath"));
            var clip = safeUrl(dig(it, f.clip || "info.videoPath"));

                          a0.rel = "noopener noreferrer"; a0.appendChild(img); td.appendChild(a0); }

            } else if (clip) {
              var a = el("a", "link", "open clip");
              a.href = clip; a.target = "_blank"; a.rel = "noopener noreferrer";
              td.appendChild(a);
            } else {
              td.textContent = "—";
            }
          } else {
            td = document.createElement("td");
            td.textContent = str(dig(it, f[c] || c)) || "—";
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
    });
  };

  renderers.media_grid = function (block, host) {
    var f = block.fields || {};
    var grid = el("div", "grid");
    var note = el("div", "empty");
    host.appendChild(grid);
    host.appendChild(note);

    bindSource(block.source, function (feed) {
      grid.textContent = "";
      var items = feed.items.slice();
      if (block.max_items) items = items.slice(0, block.max_items);
      note.style.display = items.length ? "none" : "";
      if (!items.length) {
        note.textContent = feed.error ? "Feed error: " + feed.error
                                      : (block.empty_text || "No results.");
        return;
      }
      var now = Date.now();
      var names = block.sensor_names || {};
      items.forEach(function (it) {
        var tile = el("div", "tile");
        var thumb = safeUrl(dig(it, f.thumbnail || "thumbnail"));
        var clip = safeUrl(dig(it, f.clip || "clip"));
        if (thumb) {
          var img = el("img", "media");
          img.src = thumb; img.alt = ""; img.loading = "lazy"; img.referrerPolicy = "no-referrer";
          if (clip) { var aw = el("a"); aw.href = clip; aw.target = "_blank";
                      aw.rel = "noopener noreferrer"; aw.appendChild(img); tile.appendChild(aw); }
          else tile.appendChild(img);
        }
        var body = el("div", "body");
        body.appendChild(el("div", "headline", str(dig(it, f.title || "title")) || "Result"));

        var meta = el("div", "meta");
        var sid = str(dig(it, f.sensor || "sensor_id"));
        if (sid) meta.appendChild(el("span", null, names[sid] || sid));
        var d = parseTime(dig(it, f.time || "timestamp"));
        if (d) meta.appendChild(el("span", null, fmtAbs(d) + " · " + fmtRel(d, now)));
        var score = dig(it, f.score || "score");
        if (typeof score === "number") meta.appendChild(el("span", null, "score " + score.toFixed(3)));
        if (meta.childNodes.length) body.appendChild(meta);

        var snip = str(dig(it, f.snippet || "description"));
        if (snip) body.appendChild(el("div", "snippet", snip));
        if (clip) {
          var a = el("a", "link", "open clip");
          a.href = clip; a.target = "_blank"; a.rel = "noopener noreferrer";
          var wrap = el("div"); wrap.style.marginTop = "8px";
          wrap.appendChild(a); body.appendChild(wrap);
        }
        tile.appendChild(body);
        grid.appendChild(tile);
      });
    });
  };

  // Counts per time bucket — a trend over time, single series.
  // One series ⇒ no legend (the title names it); sequential blue; thin marks,
  // 4px rounded data-ends anchored to the baseline, 2px gap between columns.
  renderers.timeline = function (block, host) {
    var f = block.fields || {};
    var card = el("div", "card chart");
    var tip = el("div", "tooltip");
    card.appendChild(tip);
    var holder = el("div");
    card.appendChild(holder);
    host.appendChild(card);

    bindSource(block.source, function (feed) {
      holder.textContent = "";
      var bucketMs = Math.max(1, (block.bucket_minutes || 5)) * 60000;
      var times = feed.items
        .map(function (it) { return parseTime(dig(it, f.time || "timestamp")); })
        .filter(Boolean)
        .map(function (d) { return d.getTime(); });

      if (!times.length) {
        holder.appendChild(el("div", "empty", block.empty_text || "Nothing to plot yet."));
        return;
      }

      var maxT = Math.max.apply(null, times);
      var minT = Math.min.apply(null, times);
      var nB = Math.min(block.max_buckets || 48, Math.max(1, Math.ceil((maxT - minT) / bucketMs) + 1));
      var end = Math.floor(maxT / bucketMs) * bucketMs;
      var start = end - (nB - 1) * bucketMs;
      var counts = new Array(nB).fill(0);
      times.forEach(function (t) {
        var i = Math.floor((t - start) / bucketMs);
        if (i >= 0 && i < nB) counts[i]++;
      });

      var W = 900, H = 168, padL = 34, padR = 8, padT = 10, padB = 22;
      var plotW = W - padL - padR, plotH = H - padT - padB;
      var maxC = Math.max.apply(null, counts) || 1;
      var niceMax = maxC <= 4 ? maxC : Math.ceil(maxC / 4) * 4;
      var slot = plotW / nB;
      var GAP = 2;                                  // 2px surface gap between bars
      // Thin marks: cap the width so a short series doesn't become a row of
      // heavy blocks. Narrower than the slot, centred in it.
      var barW = Math.max(1, Math.min(slot - GAP, block.max_bar_width || 26));

      var NS = "http://www.w3.org/2000/svg";
      var svg = document.createElementNS(NS, "svg");
      svg.setAttribute("viewBox", "0 0 " + W + " " + H);
      svg.setAttribute("role", "img");
      svg.setAttribute("aria-label",
        block.title || ("Counts per " + (block.bucket_minutes || 5) + " minutes"));

      // Recessive hairline gridlines + y ticks
      var g = document.createElementNS(NS, "g");
      g.setAttribute("class", "grid");
      var ticks = 4;
      for (var i = 0; i <= ticks; i++) {
        var yv = Math.round(niceMax * i / ticks);
        var y = padT + plotH - (yv / niceMax) * plotH;
        var ln = document.createElementNS(NS, "line");
        ln.setAttribute("x1", padL); ln.setAttribute("x2", W - padR);
        ln.setAttribute("y1", y); ln.setAttribute("y2", y);
        g.appendChild(ln);
        var tx = document.createElementNS(NS, "text");
        tx.setAttribute("x", padL - 7); tx.setAttribute("y", y + 3);
        tx.setAttribute("text-anchor", "end");
        tx.textContent = yv;
        g.appendChild(tx);
      }
      svg.appendChild(g);

      // Round only the data-end; the base stays square on the baseline.
      function columnPath(x, y, w, h, r) {
        r = Math.min(r, w / 2, h);
        return "M" + x + "," + (y + h) +
               "L" + x + "," + (y + r) +
               "Q" + x + "," + y + " " + (x + r) + "," + y +
               "L" + (x + w - r) + "," + y +
               "Q" + (x + w) + "," + y + " " + (x + w) + "," + (y + r) +
               "L" + (x + w) + "," + (y + h) + "Z";
      }

      var bars = document.createElementNS(NS, "g");
      counts.forEach(function (c, i) {
        var x = padL + i * slot + (slot - barW) / 2;
        var h = (c / niceMax) * plotH;
        var y = padT + plotH - h;
        // Hit target spans the whole slot — bigger than the mark, per the
        // interaction spec, so a 2px-tall column is still hoverable.
        var hit = document.createElementNS(NS, "rect");
        hit.setAttribute("class", "hit");
        hit.setAttribute("x", padL + i * slot); hit.setAttribute("y", padT);
        hit.setAttribute("width", slot); hit.setAttribute("height", plotH);
        var bucketStart = new Date(start + i * bucketMs);
        (function (c2, bs, cx) {
          hit.addEventListener("mouseenter", function () {
            tip.textContent = "";
            tip.appendChild(el("span", "tv", c2 + (c2 === 1 ? " incident" : " incidents")));
            tip.appendChild(el("span", null, " · " + fmtAbs(bs)));
            tip.setAttribute("data-show", "1");
            var box = card.getBoundingClientRect();
            var px = (cx / W) * box.width;
            tip.style.left = Math.min(Math.max(px - 60, 4), box.width - 190) + "px";
            tip.style.top = "6px";
          });
          hit.addEventListener("mouseleave", function () { tip.setAttribute("data-show", "0"); });
        })(c, bucketStart, x + barW / 2);
        bars.appendChild(hit);

        if (c > 0) {
          var r = document.createElementNS(NS, "path");
          r.setAttribute("class", "bar");
          r.setAttribute("d", columnPath(x, y, barW, Math.max(2, h), 4));
          bars.appendChild(r);
        }
      });
      svg.appendChild(bars);

      var ax = document.createElementNS(NS, "g");
      ax.setAttribute("class", "axis");
      var base = document.createElementNS(NS, "line");
      base.setAttribute("x1", padL); base.setAttribute("x2", W - padR);
      base.setAttribute("y1", padT + plotH); base.setAttribute("y2", padT + plotH);
      ax.appendChild(base);
      [0, Math.floor(nB / 2), nB - 1].filter(function (v, i, a) { return a.indexOf(v) === i; })
        .forEach(function (i) {
          var d = new Date(start + i * bucketMs);
          var tx = document.createElementNS(NS, "text");
          tx.setAttribute("x", padL + i * slot + barW / 2);
          tx.setAttribute("y", H - 6);
          tx.setAttribute("text-anchor", i === 0 ? "start" : (i === nB - 1 ? "end" : "middle"));
          tx.textContent = String(d.getHours()).padStart(2, "0") + ":" +
                           String(d.getMinutes()).padStart(2, "0");
          ax.appendChild(tx);
        });
      svg.appendChild(ax);
      holder.appendChild(svg);

      // Table view — identity is never color-alone, and this is the a11y fallback.
      var sr = el("div", "sr");
      sr.appendChild(el("span", null, counts.map(function (c, i) {
        return fmtAbs(new Date(start + i * bucketMs)) + ": " + c;
      }).join("; ")));
      holder.appendChild(sr);
    });
  };

  // ── status + controls ─────────────────────────────────────────────
  var statusEl, pauseBtn;

  function setStatus() {
    if (!statusEl) return;
    var keys = Object.keys(feeds);
    var label, state;
    if (FROZEN)      { state = "frozen";  label = "Snapshot — " + (SPEC.generated_at || "static"); }
    else if (!keys.length) { state = "frozen"; label = "Static view"; }
    else if (paused) { state = "paused";  label = "Paused"; }
    else {
      var errs = keys.filter(function (k) { return feeds[k].error; });
      if (errs.length === keys.length) { state = "error"; label = "Disconnected — " + feeds[errs[0]].error; }
      else if (errs.length)            { state = "error"; label = errs.length + " of " + keys.length + " feeds failing"; }
      else {
        var iv = Math.min.apply(null, keys.map(function (k) { return feeds[k].src.interval_ms || 5000; }));
        state = "live"; label = "Live · every " + (iv / 1000) + "s";
      }
    }
    statusEl.setAttribute("data-state", state);
    statusEl.querySelector(".txt").textContent = label;
  }

  // Freeze rewrites this document's own spec to inline data and hands back a
  // standalone file — the renderer travels with it, so the snapshot still works
  // after the deployment is gone.
  function freeze() {
    var frozenSpec = JSON.parse(JSON.stringify(SPEC));
    frozenSpec.frozen = true;
    frozenSpec.generated_at = new Date().toISOString();
    (frozenSpec.blocks || []).forEach(function (b, i) {
      var live = (SPEC.blocks || [])[i];
      if (!live || !live.source || live.source.mode !== "poll") return;
      var feed = feeds[feedKey(live.source)];
      b.source = {
        mode: "inline",
        items: feed ? JSON.parse(JSON.stringify(feed.items)) : [],
        raw: feed && feed.raw ? JSON.parse(JSON.stringify(feed.raw)) : null
      };
    });

    var doc = document.documentElement.cloneNode(true);
    var holder = doc.querySelector("#vss-view-spec");
    holder.textContent = JSON.stringify(frozenSpec)
      .replace(/</g, "\\u003c").replace(/>/g, "\\u003e").replace(/&/g, "\\u0026");
    var blob = new Blob(["<!DOCTYPE html>\n", doc.outerHTML], { type: "text/html" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (SPEC.slug || "vss-view") + "-snapshot.html";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  }

  function buildControls() {
    var host = document.getElementById("v-controls");
    statusEl = el("span", "status");
    statusEl.appendChild(el("span", "dot"));
    statusEl.appendChild(el("span", "txt", "…"));
    host.appendChild(statusEl);

    var hasLive = false;
    (SPEC.blocks || []).forEach(function (b) {
      if (b.source && b.source.mode === "poll") hasLive = true;
    });

    if (hasLive && !FROZEN) {
      pauseBtn = el("button", null, "Pause");
      pauseBtn.addEventListener("click", function () {
        paused = !paused;
        pauseBtn.textContent = paused ? "Resume" : "Pause";
        if (paused) stopFeeds(); else startFeeds();
        setStatus();
      });
      host.appendChild(pauseBtn);

      var snap = el("button", null, "Save snapshot");
      snap.title = "Download a standalone copy with the current rows baked in";
      snap.addEventListener("click", freeze);
      host.appendChild(snap);
    }

    var themeBtn = el("button", null, "Theme");
    themeBtn.addEventListener("click", function () {
      var cur = document.documentElement.getAttribute("data-theme");
      document.documentElement.setAttribute("data-theme", cur === "dark" ? "light" : "dark");
    });
    host.appendChild(themeBtn);
  }

  // ── boot ──────────────────────────────────────────────────────────
  document.getElementById("v-title").textContent = SPEC.title || "VSS view";
  var sub = document.getElementById("v-subtitle");
  if (SPEC.subtitle) sub.textContent = SPEC.subtitle; else sub.style.display = "none";
  document.title = SPEC.title || "VSS view";

  // Boot must be idempotent: a saved snapshot is a clone of an already-rendered
  // document, so these hosts arrive populated and would otherwise double up.
  var main = document.getElementById("v-blocks");
  main.textContent = "";
  document.getElementById("v-controls").textContent = "";
  document.getElementById("v-footer").textContent = "";

  (SPEC.blocks || []).forEach(function (block) {
    var fn = renderers[block.type];
    var sec = document.createElement("section");
    if (block.title) sec.appendChild(el("h2", "block-title", block.title));
    if (!fn) {
      sec.appendChild(el("div", "empty", "Unsupported block type: " + str(block.type)));
    } else {
      try { fn(block, sec); }
      catch (e) {
        console.error(e);
        sec.appendChild(el("div", "empty", "Block failed to render: " + (e && e.message)));
      }
    }
    main.appendChild(sec);
  });

  buildControls();

  var foot = document.getElementById("v-footer");
  foot.appendChild(el("span", null, "Generated " + (SPEC.generated_at || "—")));
  if (SPEC.source_note) foot.appendChild(el("span", null, SPEC.source_note));
  foot.appendChild(el("span", null, "View only — this page never writes to VSS."));

  if (!FROZEN) startFeeds();
  setStatus();
  setInterval(setStatus, 1000);
})();
</script>
</body>
</html>
