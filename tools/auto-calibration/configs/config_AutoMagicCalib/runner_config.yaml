# FL Model Runner -- Runtime Configuration
# Per-model runtime parameters and consolidation policy.

focal_length_search_range: 10    # +/- range around focal for AMC config export

models:
  geocalib:
    adaptive_geocalib:
      enabled: true
      min_iterations: 20
      max_iterations: 50
      iteration_increment: 5
      cv_threshold: 0.8          # stop when CV < this %
      early_stop_cv: 0.5         # immediate stop when CV < this %

  moge: {}

  vggt: {}

consolidation:
  enabled: true                 # also controls which models run (see below)
  policy: median_of_models       # single_source | median_of_models | weighted_by_confidence | trimmed_mean
  policy_params:
    model_id: geocalib           # used only by single_source policy (geocalib, moge, vggt)
  # Model selection (when no --models CLI flag):
  #   enabled: false                      → GeoCalib only
  #   enabled: true, single_source        → GeoCalib + policy_params.model_id
  #   enabled: true, <multi-model policy> → all enabled models from manifest
