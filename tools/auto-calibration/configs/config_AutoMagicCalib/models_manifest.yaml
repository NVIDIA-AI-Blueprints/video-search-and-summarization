# FL Model Runner -- Model Manifest
# Each entry describes a model, its adapter class, repo location, and weights.

models:
  geocalib:
    enabled: true
    required_for_pose: true      # always runs -- provides roll/pitch/distortion for AMC
    adapter_class: core.model_runner.adapters.geocalib_adapter.GeoCalibAdapter
    repo:
      url: https://github.com/cvg/GeoCalib.git
      clone_to: submodules/GeoCalib
      subdirectory: ""           # geocalib package is at repo root
    weights:
      local_dir: models/geocalib
      files:
        - name: geocalib-pinhole.tar
          url: https://github.com/cvg/GeoCalib/releases/download/v1.0/geocalib-pinhole.tar
        - name: geocalib-distorted.tar
          url: https://github.com/cvg/GeoCalib/releases/download/v1.0/geocalib-distorted.tar
    timeout_s: 120
    max_retries: 1

  moge:
    enabled: true
    required_for_pose: false
    adapter_class: core.model_runner.adapters.moge_adapter.MoGeAdapter
    pretrained_name: Ruicheng/moge-2-vitl   # HuggingFace hub name (fallback)
    repo:
      url: https://github.com/microsoft/MoGe.git
      clone_to: submodules/MoGe
      subdirectory: ""
    weights:
      local_dir: models/moge          # used as HF cache_dir; HF manages files internally
      files: []
    timeout_s: 60
    max_retries: 0

  vggt:
    enabled: true
    required_for_pose: false
    adapter_class: core.model_runner.adapters.vggt_adapter.VGGTAdapter
    repo:
      url: https://github.com/facebookresearch/vggt.git
      clone_to: submodules/vggt
      subdirectory: ""
    weights:
      local_dir: models/vggt
      files:
        - name: model.pt
          url: https://huggingface.co/facebook/VGGT-1B-Commercial/resolve/main/vggt_1B_commercial.pt
    timeout_s: 60
    max_retries: 0
