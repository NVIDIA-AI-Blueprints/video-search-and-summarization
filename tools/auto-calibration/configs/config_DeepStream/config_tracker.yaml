  processNoiseVar4Loc: 6497.75224242603
  processNoiseVar4Vel: 8035.858212054732
  measurementNoiseVar4Detector: 100.0000
  measurementNoiseVar4Tracker: 883.5847350922555
ObjectModelProjection:
