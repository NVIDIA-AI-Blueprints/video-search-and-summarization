  terminatedTrackFilename: "trajDump_Stream_" # file name: "terminatedTrackFilename"0.txt, "terminatedTrackFilename"1_2.txt, ...


TrajectoryManagement:
  useUniqueID: 0
  enableReAssoc: 1
  minMatchingScore4Overall: 0.9349462651721144
  minTrackletMatchingScore: 0.2940
  minMatchingScore4ReidSimilarity: 0
