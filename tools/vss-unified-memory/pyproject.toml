[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vss-unified-memory"
version = "0.1.0"
description = "Storage-independent domain and Elasticsearch persistence for VSS workflow memory"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "elasticsearch>=8.17,<9",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.7,<3",
  "tokenizers>=0.21,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vss_unified_memory"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
markers = [
  "integration: requires a reachable Elasticsearch instance",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "N", "SIM", "UP", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["vss_unified_memory"]
