# Redirect rules, referenced from fern/docs.yml with `redirects: ./redirects.yml`.
# See docs/README.md, "Redirects", before editing.
#
# - The first matching rule wins, so specific rules go before generic ones. A
#   catch-all must also start with a parameter (`/:v(latest)/:path*`): a
#   literal-prefixed `/latest/:path*` was matched ahead of earlier rules.
# - `source` is matched WITHOUT the site base path (/vss); `destination` MUST include it.
# - A source must never be a page that the default version serves: the redirect
#   would hide that page.
# - Use one path segment per capture, and never `[^/]+` or `(.*)`: Fern does not
#   match or substitute them. A source with no :param is matched literally.
# - A pattern source must not start with the text of the base path: Fern never
#   matches `/vss-agent/:page(x).html`. Capture that segment instead
#   (`/:dir(vss-agent)/...`).
# - Point every rule at a real page in one hop; do not chain redirects.
# - Legacy /vss/latest/... rules take effect only once the docs.nvidia.com edge
#   stops redirecting /vss/latest/* to the home page (see docs/README.md).
# - `fern docs dev` cannot test redirects. Check the first hop on a preview:
#   curl -s -o /dev/null -D - <url>   (no -L; a rule that fires returns 308)
