  - source: "/system-components/middleware/video-io-storage-vios/vst-api-reference/vst-proxy-stream-management-api/vst-proxy-stream-management-api-reference/vst-proxy-stream-management-api-reference"
    destination: "/vss/system-components/middleware/video-io-storage-vios/vst-api-reference/vst-proxy-stream-management-api/vst-proxy-stream-management-api-reference"
