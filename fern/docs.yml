redirects:
  # Sphinx .html URLs and the old convert-to-fern nightly slug land on the Fern site.
  - source: "/index.html"
    destination: "/vss"
  - source: "/index"
    destination: "/vss"
  - source: "/:path*/index.html"
    destination: "/vss/:path*"
  - source: "/:path*.html"
    destination: "/vss/:path*"
  - source: "/nightly"
    destination: "/vss"
  - source: "/nightly/:path*"
    destination: "/vss/:path*"
