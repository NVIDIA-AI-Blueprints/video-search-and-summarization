instances:
  - url: nvidia-vss.docs.buildwithfern.com/vss
    custom-domain: docs.nvidia.com/vss
    multi-source: true
  - url: nvidia-vss-staging.docs.buildwithfern.com/vss

title: NVIDIA Blueprint for Video Search and Summarization

global-theme: nvidia

layout:
  api-reference-expand-properties: true

settings:
  substitute-env-vars: true

logo:
  href: /vss
  right-text: VSS

navbar-links:
  - type: github
    value: https://github.com/NVIDIA-AI-Blueprints/video-search-and-summarization

versions:
  - display-name: "3.3.0"
    path: versions/3.3.0.yml
    slug: ""
  - display-name: "Archives"
    path: versions/archives.yml
    slug: "archives"

redirects:
  # Sphinx .html URLs and the old convert-to-fern nightly slug land on the Fern site.
  - source: "/index.html"
    destination: "/vss"
  - source: "/index"
    destination: "/vss"
  - source: "/:path*/index.html"
    destination: "/vss/:path*"
  - source: "/:path*.html"
    destination: "/vss/:path*"
  - source: "/nightly"
    destination: "/vss"
  - source: "/nightly/:path*"
    destination: "/vss/:path*"

  # Duplicate Fern slugs from the first conversion preview.
  - source: "/vision-agent/agent-workflows/industry-specific-examples/industry-specific-examples/:path*"
    destination: "/vss/vision-agent/agent-workflows/industry-specific-examples/:path*"
  - source: "/system-components/middleware/api-gateway-mcp/video-analytics-api/video-analytics-api-reference/video-analytics-api-reference"
    destination: "/vss/system-components/middleware/api-gateway-mcp/video-analytics-api/video-analytics-api-reference"
  - source: "/system-components/vision-microservices/object-detection-and-tracking/api-reference/api-reference"
    destination: "/vss/system-components/vision-microservices/object-detection-and-tracking/api-reference"
  - source: "/system-components/vision-microservices/real-time-vlm/api-reference/api-reference"
    destination: "/vss/system-components/vision-microservices/real-time-vlm/api-reference"
  - source: "/system-components/vision-microservices/video-embedding-generation/api-reference/api-reference"
    destination: "/vss/system-components/vision-microservices/video-embedding-generation/api-reference"
  - source: "/system-components/vision-microservices/video-summarization/api-reference/api-reference"
    destination: "/vss/system-components/vision-microservices/video-summarization/api-reference"
  - source: "/vision-agent/vss-agents/agent-overview/api-reference/api-reference"
    destination: "/vss/vision-agent/vss-agents/agent-overview/api-reference"
  - source: "/system-components/analytics-microservices/alerts-microservice/api-reference/alert-verification-api"
    destination: "/vss/system-components/analytics-microservices/alerts-microservice/alert-verification-api"
  - source: "/system-components/middleware/video-io-storage-vios/vst-api-reference/vst-sensor-management-api/vst-sensor-management-api-reference/vst-sensor-management-api-reference"
    destination: "/vss/system-components/middleware/video-io-storage-vios/vst-api-reference/vst-sensor-management-api/vst-sensor-management-api-reference"
  - source: "/system-components/middleware/video-io-storage-vios/vst-api-reference/vst-live-stream-management-api/vst-live-stream-management-api-reference/vst-live-stream-management-api-reference"
