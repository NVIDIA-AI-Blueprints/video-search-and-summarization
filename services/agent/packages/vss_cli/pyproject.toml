[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options.root = "../../../.."
# Keep in sync with services/agent/pyproject.toml [tool.hatch.version].
raw-options.git_describe_command = [
  "git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*",
]
raw-options.version_scheme = "no-guess-dev"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/vss_cli"]

[project]
name = "nvidia-vss-cli"
dynamic = ["version"]
requires-python = ">=3.13,<3.15"
description = "NVIDIA VSS command-line interface (NAT-free)"
license = "Apache-2.0"
authors = [{ name = "NVIDIA Corporation" }]
maintainers = [{ name = "NVIDIA Corporation" }]
# cli only touches vss_core (search_core, _foundation) -- no agent/NAT deps.
# click is the one third-party addition: it supplies the lazy command-group
# resolution (Group.list_commands / Group.get_command) that entry-point plugin
# discovery needs, and as of 8.5 it has no runtime dependencies of its own.
dependencies = [
  "nvidia-vss-core",
  "click>=8.1",
]

[project.scripts]
vss = "vss_cli:main"

# First-party groups register through the same contract third parties use.
[project.entry-points."vss.commands"]
configure = "vss_cli.configure:CONFIGURE"
search = "vss_cli.search_group:SEARCH"
summarize = "vss_cli.summarize_group:SUMMARIZE"
vios = "vss_cli.vios_group:VIOS"

# Values here are read as raw strings for `vss --help` and are never imported.
[project.entry-points."vss.command_summaries"]
configure = "Resolve and record a VSS deployment"
search = "Search indexed video"
summarize = "Summarize video and persist to memory"
vios = "Sensors, timelines, clips and snapshots (no jobs)"

[tool.uv.sources]
nvidia-vss-core = { workspace = true }
