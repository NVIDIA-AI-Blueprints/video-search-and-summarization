[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options.root = "../.."
# Derive the version from release tags only. The repo also carries nightly-*,
# dev-*, and develop-<sha> tags; a SHA-shaped one is not PEP 440-parseable and
# fails the build for every package in the workspace.
raw-options.git_describe_command = [
  "git", "describe", "--dirty", "--tags", "--long", "--match", "v[0-9]*",
]
# Report distance from the last release instead of guessing the next one.
raw-options.version_scheme = "no-guess-dev"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
# Meta distribution: aggregates the split wheels, ships NO code of its own.
bypass-selection = true

# ---------------------------------------------------------------------------
# uv workspace root. Each distribution lives under packages/<name>/.
# A single root uv.lock resolves the whole workspace (packages release in lockstep).
# ---------------------------------------------------------------------------
[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
nvidia-vss-core = { workspace = true }
nvidia-vss-agents = { workspace = true }
nvidia-vss-cli = { workspace = true }
# nvidia index currently only has langchain-nvidia-ai-endpoints up to 1.0.3; source = pypi so uv gets versions >1.0.3 from PyPI
langchain-nvidia-ai-endpoints = { index = "pypi" }
torch = [
    { index = "pytorch-cpu", marker = "platform_machine == 'x86_64' or platform_machine == 'aarch64'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "platform_machine == 'x86_64' or platform_machine == 'aarch64'" },
]
nvdataset = { index = "ngc-data-platform" }

[tool.uv]
prerelease = "allow"
managed = true
index-strategy = "unsafe-best-match"
# Security: constrain transitive dependencies to patch HIGH/CRITICAL CVEs.
constraint-dependencies = [
    "aiohttp>=3.14.0",              # Fix CVE-2026-50269 (multipart header injection)
    "authlib>=1.7.2,<1.8",          # Fix GHSA-wvwj-cvrp-7pv5 + new BDSAs for cache-CSRF in starlette_client.OAuth and jwk-header signature bypass (both flagged on 1.6.12)
    "bleach>=6.4.0",                # Fix BDSA-2026-15483 (Unicode URI-scheme sanitization bypass)
    "cffi==2.0.0",                  # Keep permissive MIT metadata; cffi 2.1.0 reports MIT-0, which is not yet accepted by the repository license gate
    "cryptography>=50.0.0",         # Fix CVE-2026-69247 (PKCS#7 Bleichenbacher oracle)
    "langchain>=1.3.9,<1.4",        # Fix GHSA-gr75-jv2w-4656
    "langchain-classic>=1.0.7",     # Fix CVE-2026-45134 (unsafe public prompt deserialization)
    "langchain-community>=0.3.27",  # Fix CVE-2025-6984 (XXE in EverNoteLoader)
    "langchain-core>=1.4.9,<1.5",   # Required by the fixed LangChain release line
    "langgraph>=1.2.5,<1.3",        # Required by the fixed LangChain release line
    "langgraph-checkpoint>=4.0.0",  # Fix CVE-2025-64439 (RCE in JsonPlusSerializer) & CVE-2026-27794 (BaseCache pickle)
    "langsmith>=0.8.0",             # Fix CVE-2026-45134 (unsafe public prompt deserialization)
    "litellm>=1.84.0,<1.85",        # Fix /guardrails/test_custom_code RCE + privilege escalation + JWT/OIDC userinfo cache misuse (all flagged on 1.83.14)
    "lxml>=6.1.0,<6.2",             # Fix GHSA-vfmq-68hx-4jfw
    "mako>=1.3.12",                 # Fix GHSA-2h4p-vjrc-8xpq (path traversal in TemplateLookup, Windows-only)
    "mcp>=1.28.1",                  # Fix CVE-2026-59950, CVE-2026-52870, and CVE-2026-52869
    "pillow>=12.3.0",               # Fix Pillow advisories through 12.2.0
    "pygments>=2.20.0",             # Fix BDSA: ReDoS in AdlLexer (lexers/archetype.py) flagged on 2.19.x
    "pyjwt>=2.13.0,<2.14",          # Fix PyJWT advisories through 2.12.1
    "pyopenssl>=26.0.0",            # Fix CVE-2026-27459 (DTLS cookie callback buffer overflow)
    "pypdf>=6.15.0",                # Fix GHSA-fp3f-mc75-235c + GHSA-fwg2-594c-jp42 and prior pypdf CVEs
    "pytest>=9.0.3",                # Fix GHSA-6w46-j5rx-g56g
    "python-multipart>=0.0.31",     # Fix multipart advisories through 0.0.28
    "starlette>=1.3.1",             # Fix Starlette advisories through 0.52.1
    "tokenizers==0.22.2",           # Keep the stable release while prereleases are globally enabled
    "torch>=2.10.0",                # Fix CVE-2026-24747 and CVE-2025-32434 (unsafe checkpoint loading)
    "tornado>=6.5.7,<6.6",          # Fix Tornado advisories through 6.5.5
    "transformers>=5.5.0,<6",       # Fix Transformers advisories through 5.4
    "urllib3>=2.7.0",               # Fix GHSA-mf9v-mfxr-j63j (decompression bomb in streaming API) & GHSA-qccp-gfcp-xxvc (cross-origin header leak on proxied redirects)
]

# Override nvidia-nat-core's fastapi~=0.119.0 pin to allow starlette>=0.49.1
override-dependencies = [
    "cryptography>=50.0.0",
    "fastapi>=0.139.2",
    "huggingface-hub>=1.5.0",
    "langgraph>=1.2.5,<1.3",
    "oci; python_version < '0'",    # NAT's optional OCI provider is unused; omit its LGPL crc32c dependency
    "pytest>=9.0.3",
    "starlette>=1.3.1",
]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com/nvidia-nat/"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "ngc-data-platform"
url = "https://artifactory.pdx.nvidia.com/artifactory/api/pypi/sw-ngc-data-platform-pypi-local/simple"
explicit = true

[project]
name = "nvidia-vss"
dynamic = ["version"]
requires-python = ">=3.13,<3.15"
description = "NVIDIA Video Search & Summarization (meta package)"
license = "Apache-2.0"
keywords = ["ai", "rag", "agents"]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
]
authors = [{ name = "NVIDIA Corporation" }]
maintainers = [{ name = "NVIDIA Corporation" }]
# Installation profiles:
#   nvidia-vss          -> core libraries only (NAT-free)
#   nvidia-vss[cli]     -> + the `vss` console script
#   nvidia-vss[agent]   -> + the NAT-based agent application
#   nvidia-vss[all]     -> agent + cli
# Extra name stays `agent` (singular) so existing `nvidia-vss[agent]` /
# `uv sync --extra agent` callers keep working; it resolves the nvidia-vss-agents dist.
# TODO(Q6 - lockstep pins): siblings are unpinned below. Before publishing,
# pin them to `== {version}` (NAT uses setuptools_dynamic_dependencies; on
# hatchling this needs a custom [tool.hatch.metadata.hooks.custom] hook).
# For dev/CI the [tool.uv.sources] workspace entries resolve siblings locally.
dependencies = ["nvidia-vss-core"]

[project.optional-dependencies]
cli = ["nvidia-vss-cli"]
# `agent` bundles the cli distribution too: the full unit-test suite spans all
# three packages (pytest testpaths), and the generic downstream test job only
# installs `--extra agent`. Keeping cli here means `uv sync --extra agent`
# resolves every package the suite imports. Do NOT drop nvidia-vss-cli.
agent = ["nvidia-vss-agents", "nvidia-vss-cli"]
arango_graph = [
    "langchain-classic>=1.0",
    "langchain-community>=0.3.27",
    "python-arango>=8.2",
]
all = ["nvidia-vss-agents", "nvidia-vss-cli"]

[dependency-groups]
# NAT-free tooling for the core/cli CI lane and host-side development.
cli-dev = [
    "mypy>=1.15.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.1",
    "ruff>=0.12.0",
    "types-pyyaml>=6.0.12.20250915",
]
dev = [
    { include-group = "cli-dev" },
    "ipdb>=0.13.13",
    "ipykernel>=6.29.5",
    "ipython>=9.0.2",
    "pre-commit>=4.2.0",
    "nvidia-nat[test]==1.8.0",
    "types-requests>=2.32.4.20260107",
    "types-markdown>=3.10.0.20251106",
    "types-python-dateutil>=2.9.0.20260124",
    "detect-secrets>=1.5.0",
]
# Eval tooling is a dependency-group (dev-only), NOT a project extra, so its
# heavy deps (spacy/weave/presidio closure) never enter the shipped runtime
# closure the OSRB license-diff inventories. Matches develop's structure.
eval = [
    "nvidia-nat[langchain,weave]==1.8.0",
    "nvdataset>=0.77",
    "spacy>=3.7,<4.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP", "ARG", "SIM", "TCH", "Q", "RUF"]
ignore = ["E501", "W505", "SIM108", "B024"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Tests at any depth (packages/<dist>/tests/**); mock args + nested `with`.
"**/tests/**" = ["ARG001", "ARG002", "SIM117", "B017"]
# Memory helpers keep runtime imports lazy (TC001/TC003) to stay NAT-free.
"packages/vss_core/src/vss_core/memory/**" = ["TC001", "TC003"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 120
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.pycodestyle]
max-doc-length = 120

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["vss_core", "vss_cli", "vss_agents"]
known-third-party = ["langchain", "llama_index", "crewai", "semantic_kernel", "mem0ai", "zep_cloud"]
split-on-trailing-comma = false
combine-as-imports = true
force-wrap-aliases = true
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
order-by-type = true
force-single-line = true
default-section = "third-party"

[tool.coverage.run]
source = ["packages/vss_core/src", "packages/vss_cli/src", "packages/vss_agents/src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/sitecustomize.py",
    "*/api/custom_fastapi_worker.py",
    "*/agents/report_agent_old.py",
    "*/agents/top_agent.py",
    "*/agents/report_agent.py",
    "*/agents/multi_report_agent.py",
    "*/video_analytics/es_client.py",
    "*/tools/vst_files.py",
    "*/tools/vst_download.py",
    "*/tools/video_understanding.py",
    "*/tools/lvs_video_understanding.py",
    "*/tools/geolocation.py",
    "*/tools/s3_picture_url.py",
    "*/tools/incidents.py",
    "*/tools/template_report_gen.py",
    "*/tools/video_report_gen.py",
    "*/tools/report_gen.py",
    "*/tools/multi_incident_formatter.py",
    "*/tools/fov_counts_with_chart.py",
    "*/evaluators/report_evaluator/evaluate.py",
    "*/evaluators/customized_trajectory_evaluator/evaluate.py",
    "*/tools/evaluation_compressor.py",
    "*/tools/code_executor/docker_backend/docker_executor.py",
    "*/tools/code_executor/docker_backend/image_builder.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = [
    "packages/vss_core/tests/unit_test",
    "packages/vss_cli/tests/unit_test",
    "packages/vss_agents/tests/unit_test",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers", "--strict-config"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
pretty = true
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true
mypy_path = "packages/vss_core/src:packages/vss_cli/src:packages/vss_agents/src:packages/vss_agents/stubs"

[[tool.mypy.overrides]]
module = "docker.*"
follow_imports = "skip"
