[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build]
exclude = [
    "/.venv",
    "/.wheel-smoke",
    "/coverage.xml",
    "/dist",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lib"]
exclude = ["src/lib/knowledge/**"]

[project]
name = "nvidia-vss-cli"
version = "0.1.0"
description = "NAT-free VSS search, critic, VLM, and VST libraries with a host CLI"
requires-python = ">=3.13,<3.15"
license = "Apache-2.0"
authors = [{ name = "NVIDIA Corporation" }]
maintainers = [{ name = "NVIDIA Corporation" }]
dependencies = [
    "aiohttp~=3.13",
    "elasticsearch~=8.17",
    "httpx~=0.28",
    "opencv-python-headless~=4.13",
    "pydantic~=2.12",
    "PyYAML~=6.0",
    "tenacity~=9.0",
    "typing-extensions~=4.15",
]

[project.scripts]
vss-cli = "lib.cli:main"

[dependency-groups]
dev = [
    "mypy~=1.19",
    "pytest~=8.4",
    "pytest-asyncio~=0.24",
    "pytest-cov~=6.3",
    "ruff~=0.15",
    "types-pyyaml~=6.0",
]

[tool.uv]
# The supported host command is ``uv run --project services/agent/vss-cli vss-cli``.
# Keep that path runtime-only; CI and contributors opt into tooling explicitly
# with ``--group dev``.
default-groups = []
# Keep this standalone lockfile aligned with the versions already reviewed in
# the repository's develop lockfiles.  The CLI is new; resolving broad ranges
# at a later date must not turn its introduction into unrelated package bumps.
constraint-dependencies = [
    "aiohappyeyeballs==2.6.1",
    "aiohttp==3.13.4",
    "anyio==4.12.1",
    "certifi==2026.1.4",
    "coverage==7.13.4",
    "elastic-transport==8.17.1",
    "elasticsearch==8.17.2",
    "httpx==0.28.1",
    "librt==0.8.1",
    "mypy==1.19.1",
    "numpy==2.4.2",
    "opencv-python-headless==4.13.0.92",
    "pathspec==1.0.4",
    "propcache==0.4.1",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "pytest==8.4.2",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.3.0",
    "ruff==0.15.2",
    "types-pyyaml==6.0.12.20250915",
    "typing-extensions==4.15.0",
    "yarl==1.22.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP", "ARG", "SIM", "TCH", "Q", "RUF"]
ignore = ["E501", "W505", "SIM108", "B024"]

[tool.ruff.lint.isort]
combine-as-imports = true
default-section = "third-party"
force-single-line = true
force-sort-within-sections = true
force-wrap-aliases = true
known-first-party = ["lib"]
order-by-type = true
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ARG001", "ARG002", "SIM117", "B017"]

[tool.coverage.run]
source = ["src/lib"]
omit = ["src/lib/knowledge/**"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
exclude = ["src/lib/knowledge", "../src/lib/knowledge"]
