# This file is a template, and might need editing before it works on your project.
# see https://docs.gitlab.com/ce/ci/yaml/README.html for all available options

before_script:
  - echo "Before script section"
  - export TOP=${CI_PROJECT_DIR}
  - export PROJECT="${PROJECT}"
  - export RELEASE="${RELEASE}"

image: gitlab-master.nvidia.com:5005/l4tmm/vms_shim/vms_shim_devel:latest

variables:
  GIT_CLONE_PATH: $CI_BUILDS_DIR/$CI_CONCURRENT_ID/$CI_PROJECT_PATH

after_script:
  - echo "After script section"

stages:
  - coverity
  - deploy
  - push_helm_chart

coverity_scan_x86:
  stage: coverity
  image: gitlab-master.nvidia.com:5005/l4tmm/vms_shim/vms_shim_devel_coverity:x86_22.04_base_image
  script:
    - "${TOP}/cicd_files/coverity_script.sh"
  needs: []
  artifacts:
    paths:
    - out/coverity_reports
    expire_in: 1 week
  only:
    variables:
      - "$COVERITY"

coverity_scan_aarch64:
  stage: coverity
  image: gitlab-master.nvidia.com:5005/l4tmm/vms_shim/vms_shim_devel_coverity:jetson_cross_compiler_rel-36
  script:
    - "${TOP}/cicd_files/coverity_script.sh"
  needs: []
  artifacts:
    paths:
    - out/coverity_reports
    expire_in: 1 week
  only:
    variables:
      - "$COVERITY"

deploy_project:
  stage: deploy
  script:
    - export IMAGE_TAG="${IMAGE_TAG}"
    - export PUSH_TO_NGC="${PUSH_TO_NGC}"
    - "${TOP}/cicd_files/deploy_script.sh"
  tags:
    - dev-sanity-host
  only:
    variables:
      - "$DEPLOY"

push_helm_chart_project:
  stage: push_helm_chart
  script:
    - export HELM_CHART="${HELM_CHART}"
    - export PUSH_TO_NGC="${PUSH_TO_NGC}"
    - "${TOP}/cicd_files/push_helm_chart.sh"
  tags:
    - dev-sanity-host
  only:
    variables:
      - "$HELM_CHART"
