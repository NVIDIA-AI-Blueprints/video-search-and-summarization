# Structural complexity (1,095 HIGH issues)
#
# Not defects: these flag deeply nested or long functions in the media and
# protocol paths. Fixing them means restructuring working code, which needs
# per-site judgement and test coverage that does not exist yet -- a bulk
# automated refactor here would be riskier than the complexity it removes.
#
# Excluded rather than fixed as a deliberate standing decision. Revisit if the
# affected paths gain test coverage.
# ---------------------------------------------------------------------------

