# ---------------------------------------------------------------------------
# void pointers in C callback and override signatures
#
# void* parameters in callbacks and virtual overrides are dictated by
# third-party C APIs such as libcurl, live555, civetweb, librdkafka and
# WebRTC, and libcurl's CURL and CURLM handles are themselves typedefs of
# void. These cannot be changed without breaking those APIs.
# ---------------------------------------------------------------------------

# S5008: "void *" should not be used in typedefs, member variables, function parameters or return type
sonar.issue.ignore.multicriteria.voidptr_1.ruleKey=cpp:S5008
sonar.issue.ignore.multicriteria.voidptr_1.resourceKey=**/*

# ---------------------------------------------------------------------------
# Constant macros in vendored NVIDIA SDK headers
#
# v4l2_nv_extensions.h and the nvmultimedia headers are NVIDIA Jetson
# multimedia and DeepStream SDK headers kept as shipped. The nvmultimedia
# headers are also consumed from C, and their macros size structs that must
# match the prebuilt NVIDIA libraries, so they cannot become constexpr.
# ---------------------------------------------------------------------------

# S5028: Macros should not be used to define constants (7 issues)
