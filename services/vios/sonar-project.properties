# ---------------------------------------------------------------------------
# std::free as a unique_ptr deleter
#
# The DeepStream schema library, backtrace_symbols and __cxa_demangle return
# malloc-allocated buffers, owned here by unique_ptr<T, decltype(&std::free)>.
# Wrapping std::free in a lambda only moves the same call, and S1231 then flags
# that free instead.
# ---------------------------------------------------------------------------

