# ---------------------------------------------------------------------------
# TLS / crypto (38 issues) -- TEMPORARY, PENDING A PRODUCT DECISION
#
# These are real VULNERABILITY findings, not style. They are suppressed only
# because fixing them changes runtime behaviour and would break deployments
# that rely on it:
#
#   S4423  weak TLS protocol      older cameras negotiate TLS 1.0/1.1
#   S4830  certificate validation self-signed certs in the field
#   S5527  hostname verification  IP-addressed cameras have no matching CN/SAN
#   S5542  weak cipher mode
#
# The intended fix is a config flag defaulting to current behaviour, so
# deployments can opt in to strict TLS. REMOVE THIS BLOCK once that lands --
# leaving it is how a security finding quietly becomes permanent.
# ---------------------------------------------------------------------------

# S4423: Weak SSL/TLS protocols should not be used (20 issues)
sonar.issue.ignore.multicriteria.tls_1.ruleKey=cpp:S4423
