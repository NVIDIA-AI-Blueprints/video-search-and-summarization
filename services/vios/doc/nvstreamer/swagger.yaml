components:
  schemas:
    Ice_servers:
      required:
      - urls
      type: object
      properties:
        urls:
          type: array
          items:
            type: string
            example: stun:stun.l.google.com:19302
    Position:
      required:
      - depth
      - direction
      - field_of_view
      - gps
      type: object
      properties:
        depth:
          type: string
        direction:
          type: string
        field_of_view:
          type: string
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        geo_location:
          $ref: '#/components/schemas/GeoLocation'
        origin:
          $ref: '#/components/schemas/Origin'
    Coordinates:
      type: object
      properties:
        latitude:
          type: string
        longitude:
          type: string
    GeoLocation:
      type: object
      properties:
        latitude:
          type: string
        longitude:
          type: string
    Origin:
      type: object
      properties:
        x:
          type: string
        y:
          type: string
    Streams:
      type: object
      properties:
        additionalProperties:
          type: object
          properties:
            additionalProperties:
              required:
              - height
              - kind
              - state
              - width
              type: object
              properties:
                height:
                  type: integer
                kind:
                  type: string
                  enum:
                  - video
                  - audio
                state:
                  type: integer
                width:
                  type: integer
    Device_settings:
      required:
      - Device ID
      - Encoding
      - Encoding Profile
      - Resolution
      - frameRate
      type: object
      properties:
        Device ID:
          type: string
          example: 1c74d195-3fcd-48fa-b8a8-e64fe8ae2b1c
        Encoding:
          type: string
          example: H264
        Encoding Profile:
          type: string
          example: Baseline
        Resolution:
          required:
          - height
          - width
          type: object
          properties:
            height:
              type: string
              example: "1080"
            width:
              type: string
              example: "1920"
        frameRate:
          type: string
          example: "30"
    Stream_stats:
      type: object
      properties:
        additionalProperties:
          type: object
          properties:
            additionalProperties:
              required:
              - Current Frame Rate
              - Decode
              - Encode
              type: object
              properties:
                Current Frame Rate:
                  type: string
                  example: "31"
                Decode:
                  required:
                  - '# Frames Decoded'
                  - Average Decoding Latency / frame [ms]
                  - Max Decoding Latency / frame [ms]
                  - Min Decoding Latency / frame [ms]
                  - Total Decoding Time [sec]
                  type: object
                  properties:
                    '# Frames Decoded':
                      type: integer
                      example: 9
                    Average Decoding Latency / frame [ms]:
                      type: number
                      example: 4.390408039093018
                    Max Decoding Latency / frame [ms]:
                      type: number
                      example: 0.0
                    Min Decoding Latency / frame [ms]:
                      type: number
                      example: 2.0
                    Total Decoding Time [sec]:
                      type: number
                      example: 56.84700012207031
                Encode:
                  required:
                  - '# Frames Encoded'
                  - Average Encoding Time / frame [ms]
                  - Total Encoding Time [s]
                  type: object
                  properties:
                    '# Frames Encoded':
                      type: integer
                      example: 9
                    Average Encoding Time / frame [ms]:
                      type: number
                      example: 4.390408039093018
                    Total Encoding Time [s]:
                      type: number
                      example: 56.84700012207031
    Options:
      required:
      - overlay
      - quality
      - rtptransport
      - streamId
      - timeout
      type: object
      properties:
        rtptransport:
          type: string
          enum:
          - udp
          - tcp
        timeout:
          type: integer
          example: 60
        streamId:
          type: string
          example: 0b6b62ea-b49a-49dc-906a-0010be31b7d7
        quality:
          type: string
          enum:
          - low
          - medium
          - high
          - auto
        overlay:
          required:
          - color
          - enabled
          - thickness
          type: object
          properties:
            enabled:
              type: boolean
              example: true
            objectId:
              type: array
              items:
                type: number
            color:
              type: string
              example: red
            thickness:
              type: number
              example: 6.0
            debug:
              type: boolean
              example: false
    Error:
      required:
      - error_code
      - error_message
      type: object
      properties:
        error_code:
          type: string
          example: VMSInternalError
        error_message:
          type: string
          example: VMS internal processing error
