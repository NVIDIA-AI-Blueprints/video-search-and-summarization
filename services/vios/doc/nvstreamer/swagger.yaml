  /stream/status:
    get:
      tags:
      - Stream
      summary: Get stream error status and playback status like PLAYING, PAUSED, NOT
        PLAYING
      operationId: api_stream_status
      parameters:
      - name: peerid
        in: query
        required: true
        schema:
          type: string
      responses:
        200:
          description: json object
          content:
            application/json:
              schema:
                type: object
        default:
          description: error
          content:
            application/json:
              schema:
