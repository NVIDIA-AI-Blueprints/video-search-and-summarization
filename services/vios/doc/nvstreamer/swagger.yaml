openapi: 3.0.1
info:
  title: NvStreamer
  license:
    name: Apache-2.0
    url: http://www.apache.org/licenses/LICENSE-2.0
  version: 0.2.18
servers:
- url: https://localhost/api
- url: http://localhost/api
paths:
  /getIceCandidate:
    get:
      tags:
      - Misc
      summary: Get list of ICE Candidates
      operationId: api_getIceCandidate
      parameters:
      - name: peerid
        in: query
        required: true
        schema:
          type: string
      responses:
        200:
          description: json object array
          content:
            application/json:
              schema:
                type: array
                items:
                  required:
                  - candidate
                  - sdpMLineIndex
                  - sdpMid
                  type: object
                  properties:
                    candidate:
                      type: string
                      example: candidate:878186389 1 udp 2122260223 192.168.55.1 43519
                        typ host generation 0 ufrag IUnY network-id 2 network-cost
                        50
                    sdpMLineIndex:
                      type: integer
                      example: 0
                    sdpMid:
                      type: string
                      example: "0"
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /getIceServers:
    get:
      tags:
      - Misc
      summary: Get URL or URLs of the servers to be used for ICE negotiations. These
        are typically STUN and/or TURN servers
      operationId: api_getIceServers
      parameters:
      - name: peerId
        in: query
        required: true
        schema:
          type: string
      responses:
        200:
          description: json object
          content:
            application/json:
              schema:
                required:
                - iceServers
                type: object
                properties:
                  iceServers:
                    type: array
                    items:
                      $ref: '#/components/schemas/Ice_servers'
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /addIceCandidate:
    post:
      tags:
      - Misc
      summary: Add new remote candidate to the RTCPeerConnection's remote description
      operationId: api_addIceCandidate
      requestBody:
        content:
          application/json:
            schema:
              required:
              - candidate
              - peerid
              type: object
              properties:
                peerid:
                  type: string
                  example: "0.8595207664173294"
                candidate:
                  required:
                  - candidate
                  - sdpMLineIndex
                  - sdpMid
                  type: object
                  properties:
                    candidate:
                      type: string
                      example: candidate:878186389 1 udp 2122260223 192.168.55.1 43519
                        typ host generation 0 ufrag IUnY network-id 2 network-cost
                        50
                    sdpMLineIndex:
                      type: integer
                      example: 0
                    sdpMid:
                      type: string
                      example: "0"
        required: true
      responses:
        200:
          description: boolean value
          content:
            application/json:
              schema:
                type: boolean
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codegen-request-body-name: body
  /stream/stop:
    post:
      tags:
      - Stream
      summary: Stop webrtc/hls streaming
      description: The protocol and peerid field is required in case of HLS streaming.
        In case of WebRTC streaming only peerid is required.
      operationId: api_stop
      requestBody:
        content:
          application/json:
            schema:
              required:
              - peerid
              type: object
              properties:
                peerid:
                  type: string
                  example: "0.8595207664173294"
                protocol:
                  type: string
                  example: hls
        required: true
      responses:
        200:
          description: boolean value
          content:
            application/json:
              schema:
                type: boolean
        default:
          description: error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-codegen-request-body-name: body
