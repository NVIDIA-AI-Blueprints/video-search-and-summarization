specVersion: 2.5.0
version: 0.2.38
name: nvstreamer

description: Developer app for nvstreamer service

dependencies:
- ucf.svc.nvstreamer:0.0.20

components:
- name: nvstreamer
  type: ucf.svc.nvstreamer
  parameters:
    #image: nvcr.io/rxczgrvsg8nx/vst-1-0/vst
    #tag: v1.1.24_x86_64
    imagePullSecrets:
    - name: ngc-docker-reg-secret
    - name: imagepullsecret
    - name: registypullsecret

#    applicationSpecs:
#      nvstreamer:
#        containers:
#          nvstreamer-container:
#            readinessProbe:
#              httpGet:
#                port: http
#              initialDelaySeconds: 150
#            livenessProbe:
#              httpGet:
#                port: http
#              initialDelaySeconds: 150

    configs:
      vst_config.json:
        data:
          gpu_indices: []
          nv_streamer_loop_playback: true
          nv_streamer_seekable: false
          nv_streamer_max_upload_file_size_MB: 10000
          nv_streamer_rtsp_server_output_buffer_size_kb: 1000
          nv_streamer_media_container_supported:
            - mp4
            - mkv
          nv_streamer_metadata_container_supported:
            - json
          supported_video_codecs:
            - h264
            - h265
          supported_audio_codecs:
            - pcmu
            - pcma
            - mpeg4-generic
          use_software_path: false
          enable_rtsp_server_sei_metadata: false
          webrtc_out_enable_insert_sps_pps: true
          webrtc_out_set_idr_interval: 30
          enable_dec_low_latency_mode: true
          use_webrtc_hw_dec: false
        network:
          stunurl_list:
            - stun.l.google.com:19302
          static_turnurl_list: []
          use_coturn_auth_secret: false
          coturn_turnurl_list_with_secret:
          use_twilio_stun_turn: false
          twilio_account_sid: ""
          twilio_auth_token: ""
          use_reverse_proxy: false
          reverse_proxy_server_address: REVERSE_PROXY_SERVER_ADDRESS:100
          rx_socket_buffer_size: 1000000
          tx_socket_buffer_size: 1000000
        notifications:
          enable_notification: false
          # supported - redis, kafka
          use_message_broker: "kafka"
          # Redis stream name
          message_broker_topic: mdx_notification
          message_broker_payload_key: "sensor"
          redis_server_env_var: REDIS_SVC_SERVICE_HOST:9092
          kafka_server_address: 10.0.0.1:9092
        debug:
          enable_latency_logging: false

