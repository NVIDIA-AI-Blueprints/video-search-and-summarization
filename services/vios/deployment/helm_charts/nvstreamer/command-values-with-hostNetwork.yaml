nvstreamer:
  imagePullSecrets:
  - name: ngc-docker-reg-secret
  - name: imagepullsecret
  applicationSpecs:
    nvstreamer:
      services:
        svc:
          externalTrafficPolicy: Cluster
          ports:
          - name: http-in
            port: 31000
            protocol: TCP
          - name: rtsp
            port: 31554
            protocol: TCP
      extraPodSpecs:
        hostNetwork: true

  configs:
    vst_config.json:
      data:
        gpu_indices: []
        nv_streamer_loop_playback: true
        nv_streamer_max_upload_file_size_MB: 10000
        use_software_path: false
        use_webrtc_inbuilt_encoder: false
        nv_streamer_sync_playback: false
        enable_rtsp_server_sei_metadata: true
      network:
        server_domain_name:
        stunurl_list:
          - stun.l.google.com:19302
        static_turnurl_list: []
        use_coturn_auth_secret: false
        coturn_turnurl_list_with_secret:
        use_twilio_stun_turn: false
        twilio_account_sid: ""
        twilio_auth_token: ""
        rtsp_server_instances_count: 1
      notifications:
        enable_notification: false
        # supported - redis, kafka
        use_message_broker: "kafka"
        # Redis stream name
        message_broker_topic: mdx_notification
        message_broker_payload_key: "sensor"
        redis_server_env_var: REDIS_SVC_SERVICE_HOST:9092
        kafka_server_address: 10.0.0.1:9092
      overlay:
        video_metadata_server: "10.24.217.28:9200/mdx-raw*"
        video_metadata_query_batch_size_num_frames: 300
        use_video_metadata_protobuf: true
