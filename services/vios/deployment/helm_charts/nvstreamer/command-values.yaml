#### Override values to nvstreamer app chart ####


# The default value for rtspServerInstances is 1, which supports 20-30 streams.
# To support 100+ streams, increase this value to around 10.
httpPort: &httpPort 31000
rtspServerPort: &rtspServerPort 31554
rtspServerInstances: &rtspServerInstances 10

nvstreamer:
  imagePullSecrets:
  - name: ngc-docker-reg-secret
  - name: ngc-api-key-secret
  applicationSpecs:
    nvstreamer:
      services:
        svc:
          externalTrafficPolicy: Cluster
          ports:
          - name: http-in
            port: *httpPort
            nodePort: *httpPort
            protocol: TCP
          - name: rtsp
            port: *rtspServerPort
            nodePort: *rtspServerPort
            protocol: TCP
            range: *rtspServerInstances

  configs:
    vst_config.json:
      data:
        nv_streamer_loop_playback: true
        nv_streamer_max_upload_file_size_MB: 10000
        use_software_path: false
        nv_streamer_sync_playback: false
        enable_rtsp_server_sei_metadata: false
        enable_mega_simulation: false
        mega_simulation_delay_min_ms: 0
        mega_simulation_delay_max_ms: 5000
        mega_simulation_base_time: "2024-09-27T10:00:00.123456Z"
      network:
        http_port: *httpPort
        rtsp_server_port: *rtspServerPort
        rtsp_server_instances_count: *rtspServerInstances
        server_domain_name:
        stunurl_list:
          - stun.l.google.com:19302
        static_turnurl_list: []
        use_coturn_auth_secret: false
        coturn_turnurl_list_with_secret:
        use_twilio_stun_turn: false
        twilio_account_sid: ""
        twilio_auth_token: ""
        use_reverse_proxy: false
        reverse_proxy_server_address: REVERSE_PROXY_SERVER_ADDRESS:100
