#
# VIOS standalone ingress — direct mode (no SDR/Envoy in the data path).
# Routes /vst/api/v1/* directly to streamprocessing-ms-1 on :30001. sensor-MS
# posts /api/v1/proxy/stream/add directly to the pod via HTTP. Single-pod only.
#
# Sibling: nginx-vst-sdrc.conf (the variant that proxies via sdr-controller's
# embedded Envoy on :10000). Selected by NGINX_MODE in compose.env:
#   NGINX_MODE=vst       -> this file (direct mode)
#   NGINX_MODE=vst-sdrc  -> nginx-vst-sdrc.conf (SDR/scaling mode)

worker_processes auto;

error_log  stderr info;
pid        /tmp/nginx/nginx.pid;

events {
    worker_connections 1024;
}

http {
    client_body_temp_path /tmp/nginx/client-body;
    proxy_temp_path       /tmp/nginx/proxy;
    fastcgi_temp_path     /tmp/nginx/fastcgi;
    uwsgi_temp_path       /tmp/nginx/uwsgi;
    scgi_temp_path        /tmp/nginx/scgi;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    log_format detailed '$remote_addr [$time_local] "$request" '
                       '$status $body_bytes_sent '
                       'rt:$request_time ut:$upstream_response_time '
                       'up:$upstream_addr';

    access_log /dev/stdout detailed;

    log_format proxy_debug '$remote_addr [$time_local] "$request" '
                          '$status rt:$request_time ut:$upstream_response_time '
                          'up:$upstream_addr us:$upstream_status';

    client_max_body_size 25G;

    # WebSocket proxy settings
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 30888;

        set $cache_control_cacheable "public, max-age=3600";

        location /health {
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # Redirect /vst -> /vst/ for proper relative asset resolution
        location = /vst {
            return 301 /vst/;
        }

        # Serve hashed JS/CSS/other static assets under /vst/assets/
        location /vst/assets/ {
            alias /vst-ui/assets/;
        }

        # Serve favicons under /vst/favicon/
        location /vst/favicon/ {
            alias /vst-ui/favicon/;
        }

        # Live MPEG-DASH media. Single-pod routing is required for pod-local segments.
        location /vst/dash/ {
            rewrite ^/vst/dash/(.*) /dash/$1 break;
            proxy_pass http://127.0.0.1:30001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

        location /vst/ {
            alias /vst-ui/;
            index index.html;
            try_files $uri $uri/ /vst/index.html;
        }

        # Route sensor APIs to sensor-ms on :30000 (unchanged from SDRC mode).
        location /vst/api/v1/sensor/ {
            access_log /dev/stdout proxy_debug;
            rewrite ^/vst/api/v1/sensor/(.*) /api/v1/sensor/$1 break;
            proxy_pass http://127.0.0.1:30000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
        }

        # Historical snapshot — cacheable, route to the pod directly.
        location ~ ^/vst/api/v1/replay/stream/[^/]+/picture$ {
            rewrite ^/vst/api/v1/replay/(.*) /api/v1/replay/$1 break;
            proxy_pass http://127.0.0.1:30001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;

            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            add_header Cache-Control "public, max-age=3600";
        }

        # All other v1 APIs (live, replay, recording, storage, clips, WebRTC,
        # WebSocket) go straight to streamprocessing-ms-1 — no header routing,
        # no Envoy. Single-pod only.
        location /vst/api/v1/ {
            rewrite ^/vst/api/v1/(.*) /api/v1/$1 break;
            proxy_pass http://127.0.0.1:30001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;

            # WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_read_timeout 3600s;  # 1 hour
            proxy_send_timeout 3600s;  # 1 hour

            # Disable buffering so large bodies (file uploads, video downloads) stream
            proxy_buffering off;
            proxy_request_buffering off;

            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
        }

        # Direct storage file serve, to the pod.
        location /vst/storage/ {
            rewrite ^/vst/storage/(.*) /storage/$1 break;
            proxy_pass http://127.0.0.1:30001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;

            proxy_read_timeout 3600s;  # 1 hour
            proxy_send_timeout 3600s;  # 1 hour

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            proxy_hide_header Pragma;
            add_header Cache-Control "public, max-age=3600";
        }
    }
}
