specVersion: 2.5.0

version: 0.0.1

name: vst-sensor-test-app

description: Developer tests for vms service

dependencies:
- ucf.svc.core.redis-timeseries:0.0.20
- ucf.svc.vst-sensor:1.0.0

components:
- name: redis-timeseries
  type: ucf.svc.core.redis-timeseries
  parameters:
    imagePullSecrets:
    - name: ngc-docker-reg-secret

- name: vst-sensor
  type: ucf.svc.vst-sensor
  parameters:
    imagePullSecrets:
    - name: ngc-docker-reg-secret
    configs:
      vst_config.json:
        data:
          gpu_indices: [0]
        notifications:
          enable_notification: true
          # supported - redis, kafka
          use_message_broker: "redis"
          # Redis stream name
          message_broker_topic: vst_events
          message_broker_payload_key: "sensor.id"
          redis_server_env_var: REDIS_TIMESERIES_REDIS_TIMESERIES_SVC_SERVICE_HOST:6379
          kafka_server_address: 10.0.0.1:9092
      rtsp_streams.json:
        streams:
        - enabled: false
          stream_in: rtsp://admin:nvidia123@10.110.22.252:554/cam/realmonitor?channel=1\u0026subtype=0
          name: Kiosk

connections:
