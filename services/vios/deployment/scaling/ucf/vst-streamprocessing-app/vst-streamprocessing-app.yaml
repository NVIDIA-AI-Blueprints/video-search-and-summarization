specVersion: 2.5.0

version: 1.0.0

name: vst-streamprocessing-app

description: VST streamprocessing scaling app (sensor, streamprocessing, postgres, ingress with nginx-streamprocessing config)

dependencies:
- ucf.svc.vst-ingress-mgr:1.0.6
- ucf.svc.vst-sensor:1.0.3
- ucf.svc.vst-streamprocessing:1.0.0
- ucf.svc.vst-streamprocessing-sdr:1.0.0
- ucf.svc.vst-postgres:1.0.0

components:
- name: vst-ingress
  type: ucf.svc.vst-ingress-mgr
  parameters:
    imagePullSecrets:
    - name: ngc-docker-reg-secret

# VST sensor management service #
- name: vst-sensor
  type: ucf.svc.vst-sensor
  parameters:
    imagePullSecrets:
    - name: ngc-docker-reg-secret
  applicationSpecs:
    sensor:
      volumes: []
      containers:
        sensor-container:
          volumeMounts: []
          securityContext:
            runAsUser: 0
            runAsGroup: 0

# VST streamprocessing service #
- name: vst-streamprocessing
  type: ucf.svc.vst-streamprocessing
  parameters:
    imagePullSecrets:
    - name: ngc-docker-reg-secret
  applicationSpecs:
    deployment:
      containers:
        streamprocessing:
          securityContext:
            runAsUser: 0
            runAsGroup: 0

# SDR-envoy for VST streamprocessing service #
- name: vst-streamprocessing-sdr
  type: ucf.svc.vst-streamprocessing-sdr
  parameters:
    imagePullSecrets:
    - name: ngc-docker-reg-secret

# VST database service #
- name: vst-postgres
  type: ucf.svc.vst-postgres
  parameters:
    imagePullSecrets:
    - name: ngc-docker-reg-secret
