specVersion: 2.5.0

version: 1.0.0

name: streamprocessing-test-app

description: Developer tests for streamprocessing service

dependencies:
- ucf.svc.vst-postgres:1.0.0
- ucf.svc.vst-streamprocessing:1.0.0
- ucf.svc.vst-sensor:1.0.3
- ucf.svc.vst-streamprocessing-sdr:1.0.0
- ucf.svc.vst-ingress-mgr:1.0.6

components:
- name: postgres
  type: ucf.svc.vst-postgres
  parameters:
    imagePullSecrets:
    - name: ngc-docker-reg-secret

- name: vst-sensor
  type: ucf.svc.vst-sensor
  parameters:
    imagePullSecrets:
    - name: ngc-docker-reg-secret

- name: vst-streamprocessing
  type: ucf.svc.vst-streamprocessing
  parameters:
    imagePullSecrets:
    - name: ngc-docker-reg-secret

- name: sdr-streamprocessing
  type: ucf.svc.vst-streamprocessing-sdr
  parameters:
    imagePullSecrets:
    - name: ngc-docker-reg-secret

- name: vst-ingress-mgr
  type: ucf.svc.vst-ingress-mgr
  parameters:
    imagePullSecrets:
    - name: ngc-docker-reg-secret

connections:
