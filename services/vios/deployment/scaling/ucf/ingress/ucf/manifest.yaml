type: msapplication
specVersion: 2.5.0
name: ucf.svc.vst-ingress-mgr
chartName: vst-ingress
description: vst-ingress service
version: 1.0.6
displayName: "Vst-ingress Service"
category:
  functional: "Media Service"
  industry: "IVA"
tags: []
keywords: []
eula: ""
nSpectId: NSPECT-1H82-JYCQ

ingress-endpoints:
  - name: app
    description: vst app ingress endpoint
    scheme: http
    data-flow: in-out
  - name: health
    description: vst app health endpoint
    scheme: http
    data-flow: in-out

tests:
  - name: dev
    app: tests/dev/app.yaml
    params: tests/dev/params1.yaml
    ciTrigger: true
    timeout: 5
    duration: 2
    installPreReqs: true
    namespace: default
    gpuNodeLabels: ""
    watchAllPods: true
    watchPods:
      - vst-ingress-mgr
    testerPods:
      - name: vst-ingress-mgr
        startSignature: "TBD"
        endSignature: "TBD"
        errorSignatures:
          - "TBD"

params:
  image: nvcr.io/rxczgrvsg8nx/vst-dev/vst-ingress
  #> type: string
  #> description: Nginx docker container image

  tag: 2.1.0-26.05.2
  #> type: string
  #> description: Tag for nginx docker container

---

spec:
  - name: deployment
    type: ucf.k8s.app.deployment
    parameters:
      apptype: stateless

  - name: check-sensor-up
    type: ucf.k8s.initcontainer
    parameters:
      image: docker.io/curlimages/curl:8.17.0
      imagePullPolicy: IfNotPresent
      command: [sh, -c]
      args: ["until curl --connect-timeout 2 sensor-sensor-svc:30000/api/v1/sensor/version | grep version; do echo \"Waiting for vst/sensor\"; sleep 0.5; done"]

  - name: vst-ingress-mgr
    type: ucf.k8s.container
    parameters:
      image:
        repository: $params.image
        tag: $params.tag
        pullPolicy: IfNotPresent
      command: ["sh", "-c"]
      args:
        - cat /opt/configs/nginx.conf && exec nginx -c /opt/configs/nginx.conf -g 'daemon off;'
      ports:
      - containerPort: 8000
        name: ingress-http

      livenessProbe:
        httpGet:
          port: 8000
          path: /health

      readinessProbe:
        httpGet:
          port: 8000
          path: /health

  - name: restartPolicy
    type: ucf.k8s.restartPolicy
    parameters:
      policy: Always

  # - name: podSecurityContext
  #   type: ucf.k8s.podSecurityContext
  #   parameters:
  #     runAsGroup: 1000
  #     runAsUser: 1000

  - name: svc
    type: ucf.k8s.service
    parameters:
      ports:
        - port: 8000
          targetPort: ingress-http
          nodePort: 30888
          protocol: TCP
          name: ingress-http
      type: NodePort
