########## SDR configs #################

# SDR-envoy for VST rtsp server service #
vst-rtspserver-sdr:
  wdmMaxReplica: 2
  wdmMaxStreamsPerReplica: 4

# SDR-envoy for VST rtsp server service #
vst-recorder-sdr:
  wdmMaxReplica: 2
  wdmMaxStreamsPerReplica: 4

# SDR-envoy for VST livestream service #
vst-livestream-sdr:
  wdmMaxReplica: 2
  wdmMaxStreamsPerReplica: 4

# SDR-envoy for VST replaystream service #
vst-replaystream-sdr:
  wdmMaxReplica: 2
  wdmMaxStreamsPerReplica: 4
