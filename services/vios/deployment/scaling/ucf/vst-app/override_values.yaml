################ Override values to vst scaling-app chart ################

# Scaling params
maxStreamsSupported: &maxStreamsSupported 500

rtspServerReplicaCount: &rtspServerReplicaCount "5"
maxStreamsPerRtspServerPod: &maxStreamsPerRtspServerPod "100"

recorderReplicaCount: &recorderReplicaCount "5"
maxStreamsPerRecorderPod: &maxStreamsPerRecorderPod "100"

livestreamReplicaCount: &livestreamReplicaCount "1"
maxStreamsPerLivestreamPod: &maxStreamsPerLivestreamPod "500"

replaystreamReplicaCount: &replaystreamReplicaCount "1"
maxStreamsPerReplaystreamPod: &maxStreamsPerReplaystreamPod "500"

# Message broker details
messageBroker: &messageBroker "redis"  # redis or kafka

#messageBrokerAddress: &messageBrokerAddress "redis-timeseries-redis-timeseries-svc"
messageBrokerAddress: &messageBrokerAddress "mdx-redis-master"                     # MDX/ITS specific
messageBrokerPort: &messageBrokerPort "6379"
messageBrokerTopic: &messageBrokerTopic "mdx-notification"
messageBrokerKey: &messageBrokerKey "sensor"
#messageBrokerFullEndpoint: &messageBrokerFullEndpoint "redis-timeseries-redis-timeseries-svc:6379"
messageBrokerFullEndpoint: &messageBrokerFullEndpoint "mdx-redis-master:6379"      # MDX/ITS specific

#Update this to the correct turn server address for live and recorded webrtc playback
turnServerAddress: &turnServerAddress ""


#Update this to enable/disable MEGA simulation
enableMegaSimulation: &enableMegaSimulation false

## Additional comments
# For some of the use-cases like audio, software encoding, downloading etc. additional packages (includes GPL libraries) are needed.
# In that case 'user_additional_install.sh' script needs to be run. Uncomment the script from all the places below in that case.


############### Microservices configuration #####################
# VST sensor managemanet service
sensor:
  applicationSpecs:
    sensor:
      containers:
        sensor-container:
          command:
            - "/bin/bash"
            - "-c"
            - |
              /home/vst/vst_release/tools/user_additional_install.sh
              exec /home/vst/vst_release/launch_vst --vstConfigFile /opt/configs/vst_config.json --adaptorConfigFile /opt/configs/adaptor_config.json --rtspStreamsFile /opt/configs/rtsp_streams.json
          args: []
      initContainers:
      - name: check-redis-up
        args:
        - until curl --connect-timeout 1 $REDIS_SERVER_ADDRESS:$REDIS_SERVER_PORT 2>&1 | grep 'Empty reply from server' >/dev/null; do echo "Waiting for redis $REDIS_SERVER_ADDRESS:6379"; sleep 0.5; done
        command: [sh, -c]
        env:
          - name: REDIS_SERVER_ADDRESS
            value: *messageBrokerAddress
          - name: REDIS_SERVER_PORT
            value: *messageBrokerPort
        image: docker.io/curlimages/curl:8.17.0
        imagePullPolicy: IfNotPresent
      - name: check-rtspserver-up
        args:
        - until curl --connect-timeout 2 --silent --head rtspserver-deployment-$(($NUM_RTSP_SERVER_POD - 1)).rtspserver-deployment-svc.default:31000/healthz >/dev/null; do echo "Waiting for rtspserver"; sleep 0.2; done
        command: [sh, -c]
        env:
          - name: NUM_RTSP_SERVER_POD
            value: *rtspServerReplicaCount
        image: docker.io/curlimages/curl:8.17.0
        imagePullPolicy: IfNotPresent
      - name: check-recorder-up
        args:
        - until curl --connect-timeout 2 --silent --head recorder-deployment-$(($NUM_RECORDER_POD - 1)).recorder-deployment-svc.default:32000/healthz>/dev/null; do echo "Waiting for recorder"; sleep 0.2; done
        command: [sh, -c]
        env:
          - name: NUM_RECORDER_POD
            value: *recorderReplicaCount
        image: docker.io/curlimages/curl:8.17.0
        imagePullPolicy: IfNotPresent

  configs:
    vst_config.json:
      network:
        http_port: 30000
      onvif:
        max_devices_supported: *maxStreamsSupported
      notifications:
        enable_notification: true
        # supported - redis, kafka
        use_message_broker: *messageBroker
        redis_server_env_var: *messageBrokerFullEndpoint
        # Redis stream name
        message_broker_topic: *messageBrokerTopic
        message_broker_payload_key: *messageBrokerKey
      data:
        max_network_db_connections: 2
        enable_mega_simulation: *enableMegaSimulation
    rtsp_streams.json:
      # Add streams from Nvstreamer here #
      Nvstreamer:
      - enabled: true
        ## Change namespace if other than default. Also we can use ingress endpoint "10.0.0.1:30889/nvstreamer/"
        endpoint: "nvstreamer-instance-deployment-0.nvstreamer-instance-deployment-svc.default:31000"
        api: "/api/v1/sensor/streams"
        max_stream_count: 100
      - enabled: true
        ## Change namespace if other than default. Also we can use ingress endpoint "10.0.0.1:30889/nvstreamer-1/"
        endpoint: "nvstreamer-instance-deployment-1.nvstreamer-instance-deployment-svc.default:31000"
        api: "/api/v1/sensor/streams"
        max_stream_count: 100
      - enabled: true
        endpoint: "nvstreamer-instance-deployment-2.nvstreamer-instance-deployment-svc.default:31000"
        api: "/api/v1/sensor/streams"
        max_stream_count: 100
      - enabled: true
        endpoint: "nvstreamer-instance-deployment-3.nvstreamer-instance-deployment-svc.default:31000"
        api: "/api/v1/sensor/streams"
        max_stream_count: 100
      - enabled: true
        endpoint: "nvstreamer-instance-deployment-4.nvstreamer-instance-deployment-svc.default:31000"
        api: "/api/v1/sensor/streams"
        max_stream_count: 100

      streams:
      - enabled: false
        stream_in: rtsp://nvstreamer-nvstreamer-svc:31556/nvstream/opt/vmounts/streamer-videos/Warehouse_Synthetic_Cam001.mp4
        name: Warehouse_Synthetic_Cam001
      - enabled: false
        stream_in: rtsp://nvstreamer-nvstreamer-svc:31560/nvstream/opt/vmounts/streamer-videos/Warehouse_Synthetic_Cam002.mp4
        name: Warehouse_Synthetic_Cam002

# VST rtsp server service #
rtspServerHttpPort: &rtspServerHttpPort "31000"
rtspserver:
  replicas: *rtspServerReplicaCount
  applicationSpecs:
    deployment:
      containers:
        rtspserver:
          command:
            - "/bin/bash"
            - "-c"
            - |
              /home/vst/vst_release/tools/user_additional_install.sh
              exec /home/vst/vst_release/launch_vst --vstConfigFile /opt/configs/vst_config.json
          args: []
      initContainers:
      - name: check-db-up
        args:
        - "until curl --connect-timeout 1 vst-postgres-deployment-svc:5432 2>&1 | grep -q 'Empty reply from server'; do echo \"Waiting for postgres\"; sleep 0.5; done"
        command: [sh, -c]
        image: docker.io/curlimages/curl:8.17.0
        imagePullPolicy: IfNotPresent
      - name: check-sdr-up
        args:
        - until curl --connect-timeout 2 --silent --head sdr-envoy-rtspserver-sdr-envoy-rtspserver-agent-xds-service:4000/healthz>/dev/null; do echo "Waiting for sdr"; sleep 0.2; done
        command: [sh, -c]
        image: docker.io/curlimages/curl:8.17.0
        imagePullPolicy: IfNotPresent

  configs:
    vst_config.json:
      network:
        http_port: *rtspServerHttpPort
        rtsp_server_port: 31554
        rtsp_server_instances_count: 10
        rtsp_preferred_network_iface:
        rtcp_rtp_port_multiplex: true
        rtsp_streaming_over_tcp: false
        rx_socket_buffer_size: 1000000
        tx_socket_buffer_size: 1000000
      notifications:
        enable_notification: true
        # supported - redis, kafka
        use_message_broker: *messageBroker
        redis_server_env_var: *messageBrokerFullEndpoint
        # Redis stream name
        message_broker_topic: *messageBrokerTopic
        message_broker_payload_key: *messageBrokerKey
      data:
        enable_rtsp_server_sei_metadata: false
        max_network_db_connections: 2
        enable_mega_simulation: *enableMegaSimulation
        mega_simulation_delay_min_ms: 0
        mega_simulation_delay_max_ms: 5000
        mega_simulation_base_time: "2024-09-27T10:00:00.123456Z"
      overlay:
        video_metadata_server: "mdx-elasticsearch-cluster-master-headless:9200/mdx-raw*"
        use_video_metadata_protobuf: true

# VST recorder service #
recorderHttpPort: &recorderHttpPort "32000"
recorder:
  replicas: *recorderReplicaCount
  applicationSpecs:
    deployment:
      containers:
        recorder:
          command:
            - "/bin/bash"
            - "-c"
            - |
              /home/vst/vst_release/tools/user_additional_install.sh
              exec /home/vst/vst_release/launch_vst --vstConfigFile /opt/configs/vst_config.json
          args: []
      initContainers:
      - name: check-db-up
        args:
        - "until curl --connect-timeout 1 vst-postgres-deployment-svc:5432 2>&1 | grep -q 'Empty reply from server'; do echo \"Waiting for postgres\"; sleep 0.5; done"
        command: [sh, -c]
        image: docker.io/curlimages/curl:8.17.0
        imagePullPolicy: IfNotPresent
      - name: check-sdr-up
        args:
        - until curl --connect-timeout 2 --silent --head sdr-envoy-recorder-sdr-envoy-recorder-agent-xds-service:4000/healthz>/dev/null; do echo "Waiting for sdr"; sleep 0.2; done
        command: [sh, -c]
        image: docker.io/curlimages/curl:8.17.0
        imagePullPolicy: IfNotPresent

  configs:
    vst_config.json:
      network:
        http_port: *recorderHttpPort
        server_domain_name:
      data:
        always_recording: true
        event_recording: false
        event_record_length_secs: 10
        record_buffer_length_secs: 2
        recorder_enable_frame_drop: true
        recorder_max_frame_queue_size_bytes: 16000000
        max_network_db_connections: 10
        enable_mega_simulation: *enableMegaSimulation
      notifications:
        enable_notification: true
        # supported - redis, kafka
        use_message_broker: *messageBroker
        redis_server_env_var: *messageBrokerFullEndpoint
        # Redis stream name
        message_broker_topic: *messageBrokerTopic
        message_broker_payload_key: *messageBrokerKey

# VST storage service #
