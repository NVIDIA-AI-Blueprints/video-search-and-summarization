        max_network_db_connections: 5
        enable_mega_simulation: *enableMegaSimulation
      overlay:
        video_metadata_server:
        use_video_metadata_protobuf: false
        enable_gem_drawing: true
        overlay_text_font_type: "DejaVuSansMono.ttf"

