          args: []
  configs:
    vst_storage.json:
      total_video_storage_size_MB: 1000000
    vst_config.json:
      network:
        http_port: 33000
        server_domain_name:
      data:
        storage_threshold_percentage: 95
        storage_monitoring_frequency_secs: 2
        max_video_download_size_MB: 1000
