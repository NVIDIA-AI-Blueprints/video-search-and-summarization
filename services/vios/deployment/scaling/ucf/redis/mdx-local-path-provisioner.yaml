local-path-provisioner:
  enabled: true
  fullnameOverride: "mdx-local-path-provisioner"
  configmap:
    # specify the config map name
    name: mdx-local-path-config

  defaultPathForNonListedNodes: /opt/hdd/mdx-local-path
  nodePathMap:
  - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
    paths:
    - /opt/hdd/mdx-local-path
  storageClass:
    name: mdx-local-path
    reclaimPolicy: Retain
    defaultClass: true

