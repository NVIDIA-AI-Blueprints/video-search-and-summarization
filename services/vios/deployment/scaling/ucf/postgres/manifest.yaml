type: msapplication
specVersion: 2.5.0
name:  ucf.svc.vst-postgres
chartName: vst-postgres
description: vst postgres service
version: 1.0.0
displayName: "VST Postgres Service"
category:
  functional: "Database"
  industry: "IVA"
tags: []
keywords: []
eula: ""
nSpectId: NSPECT-1H82-JYCQ

ingress-endpoints:
  - name: postgres-api
    description: postgres http api
    scheme: http
    data-flow: in-out

tests:
  - name: dev-params1
    app: tests/dev/app.yaml
    params: tests/dev/params1.yaml
    ciTrigger: true
    timeout: 25
    duration: 10
    installPreReqs: true  # Wether to install foundational services
    namespace: default  # Kubernetes namespace
    gpuNodeLabels: ""
    watchAllPods: false # OR set to false and set list of pods to watch below
    watchPods:
    - vst-postgres-test
    testerPods:  # At least one tester pod is required
    - name: vst-postgres-test  # Name of the test pod
      startSignature: "Starting the api-test"  # Signature to look for in the logs indicating start of tests. Regex is accepted
      endSignature: "Done with the api-test"  # Signature to look for in the logs indicating end of tests. Regex is accepted
      errorSignatures:  # Signatures that indicate test failures.  Regex is accepted
      - "test case failed"

params:
  postgres_user: "vst"
  #> description: VST postgres db user name.
  #> type: string

  postgres_passwd: "nvidia123"
  #> description: VST postgres db password.
  #> type: string

  postgres_db_name: "nvcentralizedb"
  #> description: VST postgres db name.
  #> type: string

  postgres_db_port: 5432
  #> description: VST postgres db port.
  #> type: integer

---

spec:
  - name: deployment
    type: ucf.k8s.app.deployment
    parameters:
      apptype: statefull
      statefulSetServiceName: service
      extraSpecs:
        podManagementPolicy: Parallel

  # - name: set-postgres-permissions
  #   type: ucf.k8s.initcontainer
  #   image: busybox
  #   command: ['sh', '-c', 'chown -R 999:999 /var/lib/postgresql/data && chmod 700 /var/lib/postgresql/data']
  #   securityContext:
  #     runAsUser: 0
  #   volumeMounts:
  #     - name: data-storage
  #       mountPath: /var/lib/postgresql/data
  #       subPath: postgresql/db

  - name: postgres
    type: ucf.k8s.container
    parameters:
      image:
        repository: postgres
        tag: 17.9-alpine
        pullPolicy: IfNotPresent
      #command:
      #- "postgres"
      #- "-c"
      #- "config_file=/opt/configs/postgresql.conf"
      env:
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: postgres-cm
              key: CENTRALIZE_DB_USERNAME
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: postgres-cm
              key: CENTRALIZE_DB_NAME
        - name: POSTGRES_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: postgres-cm
              key: CENTRALIZE_DB_PASSWORD
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
      volumeMounts:
        - name: data-storage
          mountPath: /var/lib/postgresql/data
          subPath: postgresql/db
        - name: data-storage
          mountPath: /var/log/postgresql
          subPath: postgresql/log
      ports:
        - containerPort: $params.postgres_db_port
          protocol: TCP
          name: postgres-api
      readinessProbe:
        failureThreshold: 30
        exec:
          command:
          - pg_isready
          - -h
          - localhost
          - -U
          - $(POSTGRES_USER)
          - -d
          - $(POSTGRES_DB)
        initialDelaySeconds: 5
        periodSeconds: 5
        successThreshold: 1
        timeoutSeconds: 2
      livenessProbe:
        failureThreshold: 30
        exec:
          command:
          - pg_isready
          - -h
          - localhost
          - -U
          - $(POSTGRES_USER)
        initialDelaySeconds: 30
        periodSeconds: 20
        successThreshold: 1
        timeoutSeconds: 2

  - name: restartPolicy
    type: ucf.k8s.restartPolicy
    parameters:
      policy: Always

  - name: podSecurityContext
    type: ucf.k8s.podSecurityContext
    parameters:
      runAsGroup: 1000
      runAsUser: 1000

  - name: svc
    type: ucf.k8s.service
    parameters:
      ports:
      - port: $params.postgres_db_port
        protocol: TCP
        name: postgres-api

  - name: data-storage
    type: ucf.k8s.volume
    parameters:
      persistentVolumeClaim:
        claimName: vst-postgres-vst-db

  - name: vst-db
    type: ucf.k8s.pvc
    parameters:
      annotations:
        helm.sh/resource-policy: "keep"
      spec:
        storageClassName: mdx-local-path
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi

  - name: postgres-cm
    type: ucf.k8s.configmap
    parameters:
      data:
        CENTRALIZE_DB_NAME: "nvcentralizedb"
        CENTRALIZE_DB_USERNAME: "vst"
        CENTRALIZE_DB_PASSWORD: "nvidia123"
        CENTRALIZE_DB_HOSTADDR: "vst-postgres-deployment-svc"
        CENTRALIZE_DB_PORT: "5432"
      name: "postgres-cm"