---

kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    k8s-app: sdr-streamprocessing
  name: sdr-streamprocessing-role
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["watch", "list"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    k8s-app: sdr-streamprocessing
  name: sdr-streamprocessing-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sdr-streamprocessing-role
subjects:
  - kind: ServiceAccount
    name: sdr-streamprocessing-service-account
