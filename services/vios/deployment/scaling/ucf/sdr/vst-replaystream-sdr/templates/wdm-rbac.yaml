---

kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    k8s-app: sdr-envoy-replaystream
  name: sdr-envoy-replaystream-role
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "update", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["proxy"]
  - apiGroups: [""]
    resources: ["services/proxy"]
    verbs: ["get"]

---

kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    k8s-app: sdr-envoy-replaystream
  name: sdr-envoy-replaystream-cluster-role
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    k8s-app: sdr-envoy-replaystream
  name: sdr-envoy-replaystream-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sdr-envoy-replaystream-role
subjects:
  - kind: ServiceAccount
    name: sdr-envoy-replaystream-service-account

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sdr-envoy-replaystream-cluster-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sdr-envoy-replaystream-cluster-role
subjects:
  - kind: ServiceAccount
    name: sdr-envoy-replaystream-service-account
    namespace: {{ .Release.Namespace }}
