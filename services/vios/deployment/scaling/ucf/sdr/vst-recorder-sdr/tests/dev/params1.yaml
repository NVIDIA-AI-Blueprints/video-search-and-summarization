sdr-envoy-recorder:
  stringToEcho: someOtherString
  wdm_wl_redis_server: redis-timeseries-redis-timeseries-svc
  wdm_wl_redis_port: "6379"
  wdm_msg_key: "vst_events"
  xds_cluster_address: "testapp-wdm-agent-deployment-agent-xds-service"
  xds_cluster_port: "4000"
  wl_object_name: "testapp"
  wdm_wl_config_port: "5000"
  envoy_route_url_prefix_rewrite: "/hello"
# consumer group id need to be unique
  wl_consumer_grp_id: "consumer_group_id"
# controlBusTopic: "mdx-notification"
  wl_threshold: "2"
# Optional parameter adjust as needed  - recomendation keeps it default
  wl_router: "sdr-envoy-recorder-service"
  envoy_listener_port: 8000
  wl_router_config_map: "testapp-envoy-cfg"
