specVersion: 2.5.0

version: 0.0.1

name: vst-recorder-test-app

description: Developer tests for recorder service

dependencies:
- ucf.svc.vst-recorder:1.0.0
- ucf.svc.vst-streamer:0.0.1
- ucf.svc.vms-test:0.0.6

components:
- name: vst-recorder
  type: ucf.svc.vst-recorder
  parameters:
    imagePullSecrets:
    - name: ngc-docker-reg-secret
    configs:
      vst_config.json:
        network:
          http_port: 32000
          server_domain_name:
        data:
          gpu_indices: [0]
          always_recording: false
          event_recording: false
          event_record_length_secs: 10
          record_buffer_length_secs: 2
          recorder_enable_frame_drop: true
          recorder_max_frame_queue_size_bytes: 16000000

- name: vms-test
  type: ucf.svc.vms-test
  parameters:
    imagePullSecrets:
    - name: ngc-docker-reg-secret

- name: vst-streamer
  type: ucf.svc.vst-streamer
  parameters:
    imagePullSecrets:
    - name: ngc-docker-reg-secret
    timeToSleep: 1000000

connections:
  vms-test/vms-web-server: vst-recorder/http-api
