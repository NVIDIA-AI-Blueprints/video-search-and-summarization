################ Override values to Nvstreamer ingress manager ################

numberOfStreamerInstances: &numberOfStreamerInstances "5"

nvstreamer-ingress:
  applicationSpecs:
    deployment:
      containers:
        nvstreamer-ingress-mgr:
          env:
          - name: NUMBER_OF_NVSTREAMER_INSTANCES
            value: *numberOfStreamerInstances
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
      initContainers:
      - name: check-nvstreamer-up
        args:
        - until curl --connect-timeout 2 --silent --head nvstreamer-instance-deployment-svc:31000/healthz>/dev/null; do echo "Waiting for nvstreamer"; sleep 0.2; done
        command: [sh, -c]
        image: docker.io/curlimages/curl:8.17.0
        imagePullPolicy: IfNotPresent
