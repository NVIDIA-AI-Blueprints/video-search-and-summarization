#### Override values to nvstreamer app chart ####


httpPort: &httpPort 31000
rtspServerPort: &rtspServerPort 31554

# Number of Nvstreamer instances. Each instace supports approx 100 streams.
nvstreamerReplicaCount: &nvstreamerReplicaCount "1"

# Number of streams supported by each nvstreamer instance
maxStreamsSupported: &maxStreamsSupported 100

# Install additional packages
# Without additional packages, audio, file upload, sw encoding-decoding, etc will not work.
installAdditionalPackages: &installAdditionalPackages "true"

## nvstreamer instace ##
nvstreamer-instance:
  replicas: *nvstreamerReplicaCount
  imagePullSecrets:
  - name: ngc-docker-reg-secret
  - name: ngc-api-key-secret
  applicationSpecs:
    deployment:
      containers:
        nvstreamer-container:
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SERVICE_NAME
              value: "nvstreamer-instance-deployment-svc"
            - name: POD_METADATA_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAME
              value: "$(POD_METADATA_NAME).$(SERVICE_NAME).$(POD_NAMESPACE)"
            - name: INSTALL_ADDITIONAL_PACKAGES
              value: *installAdditionalPackages
          command:
            - "/bin/bash"
            - "-c"
            - |
              if [ "$INSTALL_ADDITIONAL_PACKAGES" = "true" ]; then
                /home/vst/vst_release/tools/user_additional_install.sh
              fi
              exec /home/vst/vst_release/launch_vst --vstConfigFile /opt/configs/vst_config.json --adaptorConfigFile /opt/configs/adaptor_config.json
          args: []

  configs:
    vst_config.json:
      data:
        nv_streamer_loop_playback: true
        nv_streamer_max_upload_file_size_MB: 10000
        use_software_path: false
        nv_streamer_sync_playback: false
        enable_rtsp_server_sei_metadata: false
        enable_mega_simulation: false
        mega_simulation_delay_min_ms: 0
        mega_simulation_delay_max_ms: 5000
        mega_simulation_base_time: "2024-09-27T10:00:00.123456Z"
        nv_streamer_sync_file_count: 0
      network:
        http_port: *httpPort
        rtsp_server_port: *rtspServerPort
        rtsp_server_instances_count: 10
        stunurl_list:
          - stun.l.google.com:19302
        static_turnurl_list:
        use_coturn_auth_secret: false
        coturn_turnurl_list_with_secret:
        use_twilio_stun_turn: false
        twilio_account_sid: ""
        twilio_auth_token: ""
        use_reverse_proxy: false
        reverse_proxy_server_address: REVERSE_PROXY_SERVER_ADDRESS:100
      onvif:
        max_devices_supported: *maxStreamsSupported

## nvstreamer ingress service ##
nvstreamer-ingress:
  applicationSpecs:
    deployment:
      containers:
        nvstreamer-ingress-mgr:
          env:
          - name: NUMBER_OF_NVSTREAMER_INSTANCES
            value: *nvstreamerReplicaCount
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
      initContainers:
      - name: check-nvstreamer-up
        args:
        - until curl --connect-timeout 2 --silent --head nvstreamer-instance-deployment-$(($NUM_NVSTREAMER_POD - 1)).nvstreamer-instance-deployment-svc.default:31000/healthz>/dev/null; do echo "Waiting for nvstreamer"; sleep 0.2; done
        command: [sh, -c]
        env:
          - name: NUM_NVSTREAMER_POD
            value: *nvstreamerReplicaCount
        image: docker.io/curlimages/curl:8.17.0
        imagePullPolicy: IfNotPresent
