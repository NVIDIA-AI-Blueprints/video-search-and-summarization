  sdr-http-recorder:
    image: ${SDR_IMAGE}
    <<: *host_service
    logging:
      driver: "json-file"
      options:
        max-size: "8192m"
        max-file: "3"
    container_name: sdr-http-recorder
    volumes:
      - ./sdr-config:/wdm-configs
      - /var/run/docker.sock:/var/run/docker.sock
      - ${VST_DATA_PATH}/sdr/recorder/log:/log
    environment:
      PORT: 4002
      CONTAINER_NAME: sdr-http-recorder
      WDM_CLUSTER_CONFIG_FILE: /wdm-configs/docker_cluster_config.json
      WDM_MSG_KEY: ${REDIS_MSG_KEY}
      WDM_WL_REDIS_SERVER: ${REDIS_HOSTADDR}
      WDM_WL_REDIS_PORT: ${REDIS_PORT}
      WDM_WL_REDIS_MSG_FIELD: sensor.id
      WDM_WL_ADD_URL: /api/v1/record/stream/add
      WDM_WL_DELETE_URL: /api/v1/record/
      WDM_WL_HEALTH_CHECK_URL: /api/v1/record/configuration
      WDM_WL_CHANGE_ID_ADD: camera_streaming
      WDM_WL_CHANGE_ID_DEL: camera_remove
      WDM_PRELOAD_WORKLOAD: ./tests/event_pre-roll.json
      WDM_CLEAR_DATA_WL: true
      WDM_KFK_ENABLE: false
      WDM_MSG_TOPIC: vst_events
      WDM_KFK_BOOTSTRAP_URL: ${KAFKA_BOOTSTRAP_URL}
      WDM_DS_SWAP_ID_NAME: false
      WDM_WL_THRESHOLD: 100
      WDM_ADD_REMOVE_RETRY_ATTEMPTS: 50
      WDM_CLUSTER_TYPE: docker
      WDM_POD_WATCH_DOCKER_DELAY: 0.5
      WDM_RESTART_DS_ON_ADD_FAIL: false
      WDM_DISABLE_WERKZEUG_LOGGING: true
      WDM_WL_OBJECT_NAME: recorder-ms
      WDM_CONSUMER_GRP_ID: sdr-recorder-cg
      WDM_CLUSTER_CONTAINER_NAMES: '["recorder-ms"]'
      VST_STREAMS_ENDPOINT: http://localhost:30000/api/v1/live/streams
      VST_STATUS_ENDPOINT: http://localhost:30000/api/v1/sensor/status
      OTEL_SDK_DISABLED: true
      WDM_INITIALIZE_FROM_VST: false
      ENVOY_REQUEST_TIMEOUT: 30
      WDM_TARGET_PORT_MAPPING: "{\"recorder-ms-1\": ${RECORDER_HTTP_PORT_1}, \"recorder-ms-2\": ${RECORDER_HTTP_PORT_2}, \"recorder-ms-3\": ${RECORDER_HTTP_PORT_3}, \"recorder-ms-4\": ${RECORDER_HTTP_PORT_4}, \"recorder-ms-5\": ${RECORDER_HTTP_PORT_5}}"
      OTEL_SERVICE_NAME: SDR_AGENT
      WDM_REDIS_CACHE_OBJECT: "recorder-data"
      WDM_WL_NAME_IGNORE_REGEX: ""
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 300M
      restart_policy:
        condition: always
    healthcheck:
      test:
        - CMD-SHELL
        - >
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/$${PORT}; printf "GET /healthz HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3; read -r status <&3; [[ "$${status}" == HTTP/*" 200 "* ]]'
      interval: 15s
      timeout: 3s
      retries: 60
      start_period: 5s
    depends_on:
      <<: *depends_on_redis_recorders

  envoy-http-recorder:
    image: ${ENVOY_PROXY_IMAGE}
    <<: *host_service
    command: /usr/local/bin/envoy -c /etc/envoy/envoy.yaml --concurrency 16 --base-id ${RECORDER_BASE_ID}
    container_name: envoy-http-recorder
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
    restart: unless-stopped
    environment:
      WDM_WL_REDIS_SERVER: ${REDIS_HOSTADDR}
      CONTAINER_NAME: envoy-http-recorder
      WDM_WL_REDIS_PORT: ${REDIS_PORT}
      WDM_KFK_BOOTSTRAP_URL: ${KAFKA_BOOTSTRAP_URL}
      WDM_WL_OBJECT_NAME: recorder-ms
      ENVOYROUTEHEADER: "streamid"
      NOHEADERTARGETCONTAINER: "recorder-01"
    depends_on:
      <<: *depends_on_redis_recorders