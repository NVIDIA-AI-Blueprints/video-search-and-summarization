  sdr-http-replaystream:
    image: ${SDR_IMAGE}
    <<: *host_service
    logging:
      driver: "json-file"
      options:
        max-size: "8192m"
        max-file: "3"
    container_name: sdr-http-replaystream
    volumes:
      - ./sdr-config:/wdm-configs
      - /var/run/docker.sock:/var/run/docker.sock
      - ${VST_DATA_PATH}/sdr/replaystream/log:/log
    environment:
      PORT: 4004
      WDM_CLUSTER_CONFIG_FILE: /wdm-configs/docker_cluster_config.json
      CONTAINER_NAME: sdr-http-replaystream
      WDM_MSG_KEY: ${REDIS_MSG_KEY}
      WDM_WL_REDIS_SERVER: ${REDIS_HOSTADDR}
      WDM_WL_REDIS_PORT: ${REDIS_PORT}
      WDM_WL_REDIS_MSG_FIELD: sensor.id
      WDM_WL_ADD_URL: /api/v1/replay/stream/add
      WDM_WL_DELETE_URL: /api/v1/replay/stream/
      WDM_WL_HEALTH_CHECK_URL: /api/v1/replay/configuration
      WDM_WL_CHANGE_ID_ADD: camera_streaming
      WDM_WL_CHANGE_ID_DEL: camera_remove
      WDM_PRELOAD_WORKLOAD: ./tests/event_pre-roll.json
      WDM_CLEAR_DATA_WL: true
      WDM_KFK_ENABLE: false
      WDM_MSG_TOPIC: vst_events
      WDM_KFK_BOOTSTRAP_URL: ${KAFKA_BOOTSTRAP_URL}
      WDM_DS_SWAP_ID_NAME: false
      WDM_WL_THRESHOLD: 500
      WDM_ADD_REMOVE_RETRY_ATTEMPTS: 50
      WDM_CLUSTER_TYPE: docker
      WDM_POD_WATCH_DOCKER_DELAY: 0.5
      WDM_RESTART_DS_ON_ADD_FAIL: false
      WDM_DISABLE_WERKZEUG_LOGGING: true
      WDM_WL_OBJECT_NAME: replaystream-ms
      WDM_CONSUMER_GRP_ID: sdr-replaystream-cg
      WDM_CLUSTER_CONTAINER_NAMES: '["replaystream-ms"]'
      VST_STREAMS_ENDPOINT: http://localhost:30000/api/v1/live/streams
      VST_STATUS_ENDPOINT: http://localhost:30000/api/v1/sensor/status
      OTEL_SDK_DISABLED: true
      WDM_INITIALIZE_FROM_VST: false
      ENVOY_REQUEST_TIMEOUT: 30
      WDM_TARGET_PORT_MAPPING: "{\"replaystream-ms-1\": ${REPLAYSTREAM_HTTP_PORT_1}}" # Comment this to scale up to 2 `replaystream-ms` instances
      # WDM_TARGET_PORT_MAPPING: "{\"replaystream-ms-1\": ${REPLAYSTREAM_HTTP_PORT_1}, \"replaystream-ms-2\": ${REPLAYSTREAM_HTTP_PORT_2}}" # Uncomment this to scale up to 2 `replaystream-ms` instances
      OTEL_SERVICE_NAME: SDR_AGENT
      WDM_REDIS_CACHE_OBJECT: "replaystream-data"
      WDM_WL_NAME_IGNORE_REGEX: ""
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 300M
      restart_policy:
        condition: always
    healthcheck:
      test:
        - CMD-SHELL
        - >
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/$${PORT}; printf "GET /healthz HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3; read -r status <&3; [[ "$${status}" == HTTP/*" 200 "* ]]'
      interval: 15s
      timeout: 3s
      retries: 60
      start_period: 30s
    depends_on:
      <<: *depends_on_redis_replaystream_1
      # replaystream-ms-2: # Uncomment this to scale up to 2 `replaystream-ms` instances.
      #   condition: service_healthy

  envoy-http-replaystream:
    image: ${ENVOY_PROXY_IMAGE}
    <<: *host_service
    command: /usr/local/bin/envoy -c /etc/envoy/envoy.yaml --concurrency 16 --base-id ${REPLAYSTREAM_BASE_ID}
    container_name: envoy-http-replaystream
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
    restart: unless-stopped
    environment:
      WDM_WL_REDIS_SERVER: ${REDIS_HOSTADDR}
      WDM_WL_REDIS_PORT: ${REDIS_PORT}
      CONTAINER_NAME: envoy-http-replaystream
      WDM_KFK_BOOTSTRAP_URL: ${KAFKA_BOOTSTRAP_URL}
      WDM_WL_OBJECT_NAME: replaystream-ms
      ENVOYROUTEHEADER: "streamid"
      NOHEADERTARGETCONTAINER: "replaystream-01"
    depends_on:
      <<: *depends_on_redis_replaystream_1
      # replaystream-ms-2: # Uncomment this to scale up to 2 `replaystream-ms` instances.
      #   condition: service_healthy
