type: msapplication
specVersion: 2.5.0
name:  ucf.svc.nvstreamer
chartName: nvstreamer
description: media streaming service
version: 0.0.20
displayName: "Media streaming server"
category:
  functional: "Media Service"
  industry: "IVA"
tags: []
keywords: []
eula: ""
nSpectId: NSPECT-1H82-JYCQ


ingress-endpoints:
  - name: http-in
    description: Nvstreamer http api
    scheme: http
    data-flow: in-out

#egress-endpoints:
#- name: "redis"
#  description: Redis message broker
#  protocol: TCP
#  scheme: asyncio
#  mandatory: True
#  data-flow: out

tests:
  - name: dev-params1
    app: tests/dev/app.yaml
    params: tests/dev/params1.yaml
    ciTrigger: true
    timeout: 25
    duration: 10
    installPreReqs: true  # Wether to install foundational services
    namespace: default  # Kubernetes namespace
    gpuNodeLabels: ""
    watchAllPods: false # OR set to false and set list of pods to watch below
    watchPods:
    - vms-test
    testerPods:  # At least one tester pod is required
    - name: vms-test  # Name of the test pod
      startSignature: "Starting the api-test"  # Signature to look for in the logs indicating start of tests. Regex is accepted
      endSignature: "Done with the api-test"  # Signature to look for in the logs indicating end of tests. Regex is accepted
      errorSignatures:  # Signatures that indicate test failures.  Regex is accepted
      - "test case failed"

params:
  rtspPortRange: 30
  #> description: rtsp in udp port range
  #> type: integer
  #> minimum: 2

  image: nvcr.io/rxczgrvsg8nx/vst-dev/nvstreamer
  #> type: string
  #> description: VST docker container path on ngc

  tag: 1.3.0-25.01.3.1-x86_64
  #> type: string
  #> description: Tag for VST docker container

---

spec:
  - name: nvstreamer
    type: ucf.k8s.app.deployment
    parameters:
      apptype: stateless

#  - name: check-redis-up
#    type: ucf.k8s.initcontainer
#    parameters:
#      image: curlimages/curl:7.83.1
#      imagePullPolicy: IfNotPresent
#      command: [sh, -c]
#      args: [until curl --connect-timeout 1 $egress.redis.address:$egress.redis.port 2>&1 | grep 'Empty reply from server' >/dev/null; do echo "Waiting for redis"; done]

  - name: nvstreamer-container
    type: ucf.k8s.container
    parameters:
      image:
          repository: $params.image
          tag: $params.tag
          pullPolicy: IfNotPresent
      args: [--vstConfigFile, /opt/configs/vst_config.json, --adaptorConfigFile, /opt/configs/adaptor_config.json]
      volumeMounts:
        - name: data-storage
          mountPath: /opt/vmounts/streamer-database
          subPath: streamer_database
        - name: data-storage
          mountPath: /opt/vmounts/streamer-videos
          subPath: streamer_videos
      ports:
      - containerPort: 31000
        protocol: TCP
        name: http-in
      livenessProbe:
        failureThreshold: 3
        httpGet:
          path: /api/version
          port: http-in
          scheme: HTTP
        initialDelaySeconds: 30
        periodSeconds: 20
        successThreshold: 1
        timeoutSeconds: 2
      readinessProbe:
        failureThreshold: 3
        httpGet:
          path: /api/version
          port: http-in
          scheme: HTTP
        initialDelaySeconds: 10
        periodSeconds: 15
        successThreshold: 1
        timeoutSeconds: 2

  - name: restartPolicy
    type: ucf.k8s.restartPolicy
    parameters:
      policy: Always # Always / OnFailure / Never

  - name: podSecurityContext
    type: ucf.k8s.podSecurityContext
    parameters:
      runAsGroup: 1000
      runAsUser: 1000

  - name: svc
    type: ucf.k8s.service
    parameters:
      ports:
      - port: 31000
        protocol: TCP
        name: http-in
        nodePort: 31000
      - port: 31554
        protocol: TCP
        name: rtsp
        nodePort: 31554
      type: NodePort
      externalTrafficPolicy: Local

  - name: data-storage
    type: ucf.k8s.volume
    parameters:
      persistentVolumeClaim:
        claimName: nvstreamer-local-storage

  - name: local-storage
    type: ucf.k8s.pvc
    parameters:
      annotations:
        helm.sh/resource-policy: "keep"
      spec:
        storageClassName: mdx-local-path
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1000Gi

