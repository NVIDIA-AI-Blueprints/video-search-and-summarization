type: msapplication
specVersion: 2.5.0
name:  ucf.svc.vms
chartName: vms
description: vms media service
version: 1.2.52
displayName: "Audio-Video stream provider"
category:
  functional: "Media Service"
  industry: "IVA"
tags: []
keywords: []
eula: ""
nSpectId: NSPECT-1H82-JYCQ

ingress-endpoints:
  - name: vms
    description: vms http api
    scheme: http
    data-flow: in-out

  - name: vms-grpc
    description: vms GRPC API
    scheme: grpc
    protocol: TCP
    data-flow: in-out

egress-endpoints:
  - name: redis
    description: Redis message broker
    protocol: TCP
    scheme: asyncio
    mandatory: False

tests:
  - name: dev-params1
    app: tests/dev/app.yaml
    params: tests/dev/params1.yaml
    ciTrigger: true
    timeout: 10
    duration: 10
    installPreReqs: true  # Wether to install foundational services
    namespace: default  # Kubernetes namespace
    gpuNodeLabels: ""
    watchAllPods: false # OR set to false and set list of pods to watch below
    watchPods:
    - vms-test
    testerPods:  # At least one tester pod is required
    - name: vms-test  # Name of the test pod
      startSignature: "Starting the api-test"  # Signature to look for in the logs indicating start of tests. Regex is accepted
      endSignature: "Done with the api-test"  # Signature to look for in the logs indicating end of tests. Regex is accepted
      errorSignatures:  # Signatures that indicate test failures.  Regex is accepted
      - "test case failed"

params:
  rtspPortRange: 30
  #> description: rtsp in udp port range
  #> type: integer
  #> minimum: 2

  image: nvcr.io/nvstaging/ace-dev/vst
  #> type: string
  #> description: VST docker container path on ngc.

  tag: 1.3.0-25.01.4-x86_64
  #> type: string
  #> description: Tag for VST docker container


---

spec:
  - name: vms
    type: ucf.k8s.app.deployment
    parameters:
      apptype: stateless

  - name: check-redis-up
    type: ucf.k8s.initcontainer
    parameters:
      image: docker.io/curlimages/curl:8.17.0
      imagePullPolicy: IfNotPresent
      command: [sh, -c]
      args: ["until ! [[ \"$egress.redis.port\" =~ ^[1-9] ]] || curl --connect-timeout 1 $egress.redis.address:$egress.redis.port 2>&1 | grep 'Empty reply from server' >/dev/null; do echo \"Waiting for redis\"; done"]

  - name: vms-container
    type: ucf.k8s.container
    parameters:
      image:
        repository: $params.image
        tag: $params.tag
        pullPolicy: IfNotPresent
      args: [--vstConfigFile, /opt/configs/vst_config.json, --adaptorConfigFile, /opt/configs/adaptor_config.json, --rtspStreamsFile, /opt/configs/rtsp_streams.json]
      #args: ['--vstConfigFile /opt/configs/vms_config.json --adaptorConfigFile /opt/configs/adaptor_config.json --rtspStreamsFile /opt/configs/rtsp_streams.json 2>&1 | tee -a /opt/vmounts/vst-data/vms.log']
      volumeMounts:
        - name: data-storage
          mountPath: /opt/vmounts/vst-data
          subPath: vms_data
        - name: data-storage
          mountPath: /opt/vmounts/video-data
          subPath: vms_video
      ports:
        - containerPort: 30000
          name: http
        - containerPort: 50051
          name: vms-grpc
      env:
      - name: REDIS_SVC_SERVICE_HOST
        value: $egress.redis.address
      - name: REDIS_SVC_SERVICE_PORT
        value: $egress.redis.port
      livenessProbe:
        failureThreshold: 3
        httpGet:
          path: /api/version
          port: http
          scheme: HTTP
        initialDelaySeconds: 30
        periodSeconds: 20
        successThreshold: 1
        timeoutSeconds: 2
      readinessProbe:
        failureThreshold: 3
        httpGet:
          path: /api/version
          port: http
          scheme: HTTP
        initialDelaySeconds: 10
        periodSeconds: 15
        successThreshold: 1
        timeoutSeconds: 2

  - name: podSecurityContext
    type: ucf.k8s.podSecurityContext
    parameters:
      runAsGroup: 1000
      runAsUser: 1000

  - name: svc
    type: ucf.k8s.service
    parameters:
      ports:
      - port: 30000
        protocol: TCP
        name: vms
        nodePort: 30000
      - port: 30554
        protocol: TCP
        name: rtsp
        nodePort: 30554
      - port: 50051
        protocol: TCP
        name: vms-grpc
      - port: 30001
        protocol: UDP
        range: $params.rtspPortRange
        name: rtsp-in
        nodePort: 30001
      type: NodePort
      externalTrafficPolicy: Local

  - name: vms-ingress
    type: ucf.appspec.ingress
    parameters:
      enabled: false
      className: "nginx"
      annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /$1
        nginx.ingress.kubernetes.io/proxy-body-size: "0"
      rules:
      - http:
          paths:
            - path: /vms/(.*)
              pathType: Prefix
              backend:
                service:
                  name: vms-vms-svc
                  port:
                   number: 30000

  - name: data-storage
    type: ucf.k8s.volume
    parameters:
      persistentVolumeClaim:
        claimName: vms-local-storage

  - name: local-storage
    type: ucf.k8s.pvc
    parameters:
      annotations:
        helm.sh/resource-policy: "keep"
      spec:
        storageClassName: mdx-local-path
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 100Gi
