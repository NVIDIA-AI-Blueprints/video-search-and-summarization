type: msapplication
specVersion: 2.5.0
name: ucf.svc.vms-test
chartName: vms-test
description: vst test microservice
version: 0.0.6
tags: []
keywords: []

publish: false

egress-endpoints:
  - name: vms-web-server
    description: http endpoinf of vms service
    protocol: TCP # Or UDP
    scheme: http # Or grpc / rtsp / asyncio / none
    mandatory: True # Or False
    data-flow: in-out # Or in or out

ingress-endpoints:
  - name: http-api
    description: Short description of http-api ingress endpoint
    scheme: http
    data-flow : in-out

---
spec:
  - name: deployment
    type: ucf.k8s.app.deployment
    parameters:
      apptype: stateless

  - name: vms-endpoint-check
    type: ucf.k8s.initcontainer
    parameters:
      image: curlimages/curl:7.83.1
      env:
      - name: VMS_ADDRESS
        value: $egress.vms-web-server.address
      - name: VMS_PORT
        value: $egress.vms-web-server.port
      imagePullPolicy: IfNotPresent
      command: [sh, -c ]
      args: [until curl --connect-timeout 5 http://$(VMS_ADDRESS):$(VMS_PORT)/api/v1/sensor/list | grep name; do echo "Waiting for VMS to start"; sleep 0.1; done]

  - name: "vms-test-container"
    type: ucf.k8s.container
    parameters:
      image:
        repository: nvcr.io/rxczgrvsg8nx/vst-1-0/vst
        tag: "vst_tokkio_test_v0.0.4"
      env:
      - name: VMS_ADDRESS
        value: $egress.vms-web-server.address
      - name: VMS_PORT
        value: $egress.vms-web-server.port
      ports:
      - containerPort: 5081
        protocol: TCP
        name: vms-web-server

#  - name: securityContext
#    type: ucf.k8s.podSecurityContext
#    parameters:
#      runAsUser: 1000

  - name: restartPolicy
    type: ucf.k8s.restartPolicy
    parameters:
      policy: Always # Always / OnFailure / Never

  - name: vms-test-service
    type: ucf.k8s.service
    parameters:
      ports:
      - port: 5081
        protocol: TCP
        name: vms-web-server
      type: ClusterIP

  - name: vms-test-custom-data
    type: ucf.metadata.custom
    parameters:
      param1: value1
      param2: value2
