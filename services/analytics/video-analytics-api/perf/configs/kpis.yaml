#
# Video Analytics API query KPI thresholds.
# required_endpoints: spec_gets expands to every OpenAPI GET this dump-backed
# job can call (required query params subset of warehouse_2d constants).
# Skipped: all POST/PUT/PATCH/DELETE, path-parameter routes, and GETs that
# need IDs we do not have (segmentInfo, view, endFrameId, behaviorTimeInterval).
#
# Original five gates are a best estimate from Jenkins benchmark-perf-test/69.
# New endpoints use default 0.10 / 0.20 s until an owner publishes SLOs.

schema_version: "0.1"
service: video-analytics-api
source:
  setup: warehouse_2d_es_dump
  estimate: jenkins-benchmark-perf-test-69
  spec: src/app/specification/openapi.json

scenarios:
  quick_test:
    warehouse-es-dump:
      required_endpoints:
        - spec_gets
      default:
        min_count: 10
        min_ok_ratio: 1.0
        max_p50_s: 0.10
        max_p99_s: 0.20
      livez:
        min_count: 10
        min_ok_ratio: 1.0
        max_p50_s: 0.005
        max_p99_s: 0.02
      frames:
        min_count: 10
        min_ok_ratio: 1.0
        max_p50_s: 0.05
        max_p99_s: 0.10
      behavior:
        min_count: 10
        min_ok_ratio: 1.0
        max_p50_s: 0.04
        max_p99_s: 0.08
      events:
        min_count: 10
        min_ok_ratio: 1.0
        max_p50_s: 0.04
        max_p99_s: 0.08
      incidents:
        min_count: 10
        min_ok_ratio: 1.0
        max_p50_s: 0.04
        max_p99_s: 0.08
