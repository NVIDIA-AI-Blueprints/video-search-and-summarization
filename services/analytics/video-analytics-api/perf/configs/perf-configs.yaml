perf_configs:
  - id: warehouse-es-dump
    nodeLabel: RTXPRO6000BW-SE
    imageArch: amd64
    enabled: true
    hardwareProfile: query
    profile: warehouse_2d
    broker: none
    # Jenkins runServicePerfSequence exports COMPOSE_FILE from this path. Empty
    # makes `set -u` fail at `if [ -n "${COMPOSE_FILE}" ]` (Jenkins #60).
    composePath: services/analytics/video-analytics-api/test/integration-test/docker_compose/infra/video-analytics-api-infra.yml
    # Additional repository paths required by the integration-based benchmark.
    # The common pipeline adds these to its sparse checkout when supported.
    checkoutPaths:
      - services/analytics/video-analytics-api/test/integration-test/
      - deploy/docker/services/
      - compose/docker/services/
    lfsPaths:
      - services/analytics/video-analytics-api/test/integration-test/elasticsearch_data_dump/mdx-frames.json
      - services/analytics/video-analytics-api/test/integration-test/elasticsearch_data_dump/mdx-raw.json
      - services/analytics/video-analytics-api/test/integration-test/elasticsearch_data_dump/mdx-behavior.json
      - services/analytics/video-analytics-api/test/integration-test/elasticsearch_data_dump/mdx-events.json
      - services/analytics/video-analytics-api/test/integration-test/elasticsearch_data_dump/mdx-incidents.json
    # Jenkins withEnv omits empty values; the benchmark wrapper then dies on
    # `set -u` at `if [ -n "${VLM_GPUS}" ]` and the rest of that chain.
    vlmGpus: "unused"
    llmGpus: "unused"
    vlmModel: "unused"
    llmModel: "unused"
    vision_input_tokens: "unused"
