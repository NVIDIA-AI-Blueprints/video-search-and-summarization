perf_configs:
  - &va_query
    id: warehouse-es-dump
    nodeLabel: RTXPRO6000BW-SE
    imageArch: amd64
    enabled: true
    hardwareProfile: query
    profile: warehouse_2d
    broker: none
    composePath: test/integration-test/docker_compose/infra/video-analytics-api-infra.yml
    checkoutPaths:
      - libs/vss-perf-tools/
      - services/analytics/video-analytics-api/src/app/specification/openapi.json
      - services/analytics/video-analytics-api/test/integration-test/
      - deploy/docker/services/
      - libs/vss-perf-reporting/
    lfsPaths:
      - services/analytics/video-analytics-api/test/integration-test/elasticsearch_data_dump/mdx-frames.json
      - services/analytics/video-analytics-api/test/integration-test/elasticsearch_data_dump/mdx-raw.json
      - services/analytics/video-analytics-api/test/integration-test/elasticsearch_data_dump/mdx-behavior.json
      - services/analytics/video-analytics-api/test/integration-test/elasticsearch_data_dump/mdx-events.json
      - services/analytics/video-analytics-api/test/integration-test/elasticsearch_data_dump/mdx-incidents.json
      - services/analytics/video-analytics-api/test/integration-test/elasticsearch_data_dump/mdx-space-utilization.json
      - services/analytics/video-analytics-api/test/integration-test/elasticsearch_data_dump/mdx-vlm-incidents.json
      - services/analytics/video-analytics-api/test/integration-test/elasticsearch_data_dump/warehouse-verification-incidents.json

  # Candidate platforms: keep disabled until native image/setup and smoke validation pass.
  # These rows inherit the same workload, supporting files and fixtures as the baseline.
  - <<: *va_query
    id: warehouse-es-dump-h100
    nodeLabel: H100-SXM
    imageArch: amd64
    enabled: false

  - <<: *va_query
    id: warehouse-es-dump-rtxpro4500bw
    nodeLabel: RTXPRO4500BW
    imageArch: amd64
    enabled: false

  - <<: *va_query
    id: warehouse-es-dump-dgx-spark
    nodeLabel: DGX-SPARK
    imageArch: arm64-igpu
    enabled: false

  - <<: *va_query
    id: warehouse-es-dump-igx-thor
    nodeLabel: IGX-THOR
    # Owner-selected image variant; native worker validation is still pending.
    imageArch: arm64-igpu
    enabled: false

  - <<: *va_query
    id: warehouse-es-dump-gb300
    nodeLabel: GB300
    imageArch: arm64-igpu
    enabled: false
