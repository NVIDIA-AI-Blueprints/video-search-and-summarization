commons:
  variables:
    3d:
      - num_cameras: "8"
      - batch_size: "4"
    2d:
      - num_cameras: "4"

L4:
  3d:
    max_streams_supported: 8
    variables:
      - stream_density: "min(num_cameras, max_streams_supported)"
      - use_high_quality: "true if batch_size >= 4 else false"
    operations:
      - file_operation:
          type: modify_yaml
          file_path: /tmp/test_config.yaml
          key: pipeline.batch_size
          value: "${batch_size}"

  2d:
    max_streams_supported: 4

H100:
  3d:
    max_streams_supported: 64
    variables:
      - batch_size: "16"

default:
  3d:
    max_streams_supported: 4
    variables: []
