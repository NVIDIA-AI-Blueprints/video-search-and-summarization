perf_configs:
  - &ba_playback
    id: warehouse_2d-kafka-playback
    nodeLabel: RTXPRO6000BW-SE
    imageArch: amd64
    enabled: true
    hardwareProfile: playback
    profile: warehouse_2d
    broker: kafka
    # Jenkins runServicePerfSequence exports COMPOSE_FILE from this path. Empty
    # makes `set -u` fail at `if [ -n "${COMPOSE_FILE}" ]` (Jenkins #60).
    composePath: tests/integration/docker_compose/infra/compose.yml
    # Additional repository paths required by the unchanged integration-based
    # benchmark. The common pipeline adds these to its sparse checkout.
    checkoutPaths:
      - libs/vss-perf-tools/
      - libs/vss-perf-reporting/
      - services/analytics/behavior-analytics/tests/integration/
      - deploy/docker/services/
    # Hydrate only the playback fixture needed by this config; all other LFS
    # objects remain skipped on the benchmark worker.
    lfsPaths:
      - services/analytics/behavior-analytics/tests/integration/docker_compose/apps_data/playback/warehouse_2d_playback_data.txt
    # Jenkins withEnv omits empty values; the benchmark wrapper then dies on
    # `set -u` at `if [ -n "${VLM_GPUS}" ]` and the rest of that chain.
    vlmGpus: "unused"
    llmGpus: "unused"
    vlmModel: "unused"
    llmModel: "unused"
    vision_input_tokens: "unused"

  # Candidate platforms: keep disabled until native image/setup and smoke validation pass.
  # These rows inherit the same workload, supporting files and fixtures as the baseline.
  - <<: *ba_playback
    id: warehouse_2d-kafka-playback-h100
    nodeLabel: H100-SXM
    imageArch: amd64
    enabled: false

  - <<: *ba_playback
    id: warehouse_2d-kafka-playback-rtxpro4500bw
    nodeLabel: RTXPRO4500BW
    imageArch: amd64
    enabled: false

  - <<: *ba_playback
    id: warehouse_2d-kafka-playback-dgx-spark
    nodeLabel: DGX-SPARK
    imageArch: arm64-igpu
    enabled: false

  - <<: *ba_playback
    id: warehouse_2d-kafka-playback-igx-thor
    nodeLabel: IGX-THOR
    # Owner-selected image variant; native worker validation is still pending.
    imageArch: arm64-igpu
    enabled: false

  - <<: *ba_playback
    id: warehouse_2d-kafka-playback-gb300
    nodeLabel: GB300
    imageArch: arm64-igpu
    enabled: false
