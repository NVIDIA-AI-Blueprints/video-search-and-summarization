# Approximate playback KPIs from Jenkins benchmark-perf-test #65
# (vss-behavior-analytics:nightly-20261017, warehouse_2d Kafka playback,
# last latency-monitor dump). Headroom is ~5-10x the measured corrected
# latency so the first gate catches collapse, not tight SLOs.
# Yun / Ganapathy should replace these values. FR-10 later replaces this
# file with dynamic per-release baselines.
#
# Latency limits are seconds. BA topics use topic-minus-raw (corrected).

schema_version: "0.1"
service: behavior-analytics
source:
