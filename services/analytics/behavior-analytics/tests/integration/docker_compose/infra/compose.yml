# The ELK, Kafka and Redis services are the deployment's own definitions, not
# copies of them. Everything this suite needs from them -- images, listeners,
# volumes, health checks -- is selected through COMPOSE_PROFILES and the env
# layer that generate_env.sh writes. The deployment file also defines HAProxy
# and the SDR controller; neither is in COMPOSE_PROFILES, so neither starts.
include:
  - path: ${INFRA_DIR}/compose.yml

# The MQTT broker is the deployment's own mosquitto service, selected through
# COMPOSE_PROFILES like every other included service. Only the bridge below is
# test-only: nothing in the deployment forwards MQTT into Kafka, because
# behaviour analytics is exercised over MQTT solely in this suite.
services:

  mqtt-kafka-bridge:
    build:
      context: $MDX_SAMPLE_APPS_DIR/infra
      dockerfile: Dockerfiles/Dockerfile.mqttbridge
    profiles: ["mqtt"]
    restart: always
    container_name: mdx-mqtt-bridge
    depends_on:
      - logstash
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPICS: "mdx-raw,mdx-bev,mdx-behavior,mdx-frames,mdx-events,mdx-space-utilization,mdx-incidents"
