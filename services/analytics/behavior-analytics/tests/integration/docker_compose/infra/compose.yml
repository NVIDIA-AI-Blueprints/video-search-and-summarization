# The ELK, Kafka and Redis services are the deployment's own definitions, not
# copies of them. Everything this suite needs from them -- images, listeners,
# volumes, health checks -- is selected through COMPOSE_PROFILES and the env
# layer that generate_env.sh writes. The deployment file also defines HAProxy
# and the SDR controller; neither is in COMPOSE_PROFILES, so neither starts.
include:
  - path: ${INFRA_DIR}/compose.yml

# Only the MQTT transport is test-only: the deployment has no equivalent,
# because behaviour analytics is exercised over MQTT solely in this suite.
services:

  emqx:
    image: emqx:latest
    profiles: ["mqtt"]
    restart: always
    container_name: mdx-mqtt-emqx
    volumes:
      - mdx-emqx-data:/opt/emqx/data
      - mdx-emqx-log:/opt/emqx/log

  mqtt-kafka-bridge:
    build:
      context: $MDX_SAMPLE_APPS_DIR/infra
      dockerfile: Dockerfiles/Dockerfile.mqttbridge
    profiles: ["mqtt"]
    restart: always
    container_name: mdx-mqtt-bridge
    depends_on:
      - logstash
    environment:
      MQTT_HOST: emqx
      MQTT_PORT: 1883
      KAFKA_BROKERS: kafka:29092
      KAFKA_TOPICS: "mdx-raw,mdx-bev,mdx-behavior,mdx-frames,mdx-events,mdx-space-utilization,mdx-incidents"

volumes:
  mdx-emqx-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: $MDX_DATA_DIR/data_log/emqx/data
  mdx-emqx-log:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: $MDX_DATA_DIR/data_log/emqx/log
