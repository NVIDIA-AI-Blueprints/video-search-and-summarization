# Merge with the shared infra file inside include: Compose cannot override
# imported services in the including file. These test builds need ordinary
# outbound access, so Bake must not request the network.host entitlement.
services:
  elasticsearch:
    build:
      network: default
  elasticsearch-init-container:
    build:
      network: default
  broker-health-check:
    build:
      network: default
