# The Hermes harness policy with the VSS layer: ../../../.hermes/policy.yaml plus the
# two grants the layer needs. A sandbox created with ../../../.hermes/policy.yaml
# instead reaches no VSS deployment at all.
#
# The notes on both files are in ../../../.hermes/policy.yaml. The sections before
# `network_policies` are identical to it by requirement, not by convention: the
# prover compares them to the ceiling verbatim.
#
# A plain TCP grant is `protocol: tcp` and nothing else — no `access:` or
# `rules:` — in a named policy of its own, apart from the REST endpoints.

version: 1

filesystem_policy:
  read_only: [/usr, /bin, /sbin, /lib, /lib64, /etc, /opt, /proc]
  read_write: [/sandbox, /tmp, /dev/null, /dev/urandom]

landlock: {compatibility: best_effort}

process: {run_as_user: "998", run_as_group: "999"}

network_policies:
  # Added by the VSS layer: the deployment, as the sandbox addresses it.
  vss-backend:
    name: vss-backend-readwrite
    endpoints:
      - {host: host.openshell.internal, port: 7777, protocol: tcp}
    binaries: [{path: /usr/bin/python3.13}]

  # Added by the VSS layer. The image ships no NGC CLI, so this never matches
  # today; it is here for the one operation skill that shells out to `ngc`.
  ngc:
    name: ngc
    endpoints:
      - {host: authn.nvidia.com, port: 443, protocol: tcp}
      - {host: api.ngc.nvidia.com, port: 443, protocol: tcp}
      - {host: xfiles.ngc.nvidia.com, port: 443, protocol: tcp}
    binaries: [{path: /usr/local/lib/ngc-cli/ngc}]

  pypi:
    name: pypi
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce        # audit-mode REST is `unsupported`, not a pass
        rules:
          - allow: {method: GET, path: "/**"}
      - host: files.pythonhosted.org
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/**"}
      - host: pypi.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/**"}
    binaries: [{path: /usr/bin/python3.13}]

  github:
    name: github
    endpoints:
      - host: api.github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/**"}
      - host: github.com
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: {method: GET, path: "/**"}
    binaries: [{path: /usr/bin/python3.13}]
