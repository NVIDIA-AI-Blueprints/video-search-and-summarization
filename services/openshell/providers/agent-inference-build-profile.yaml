# build.nvidia.com, with an nvapi- key.

id: agent-inference-build
display_name: Agent inference (build.nvidia.com)
category: inference
inference_capable: true
credentials:
  - name: api_key
    env_vars: [HARNESS_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
endpoints:
  - host: integrate.api.nvidia.com
    port: 443
    protocol: rest
    enforcement: enforce
    rules:
      - allow: {method: GET, path: "/v1/models"}   # Hermes probes this each turn
      - allow: {method: POST, path: "/v1/**"}
binaries:
  - {path: /usr/bin/python3.13}
