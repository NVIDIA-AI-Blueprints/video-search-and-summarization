apiVersion: v1
kind: Pod
metadata:
spec:
  serviceAccountName: met-vss-sa
  imagePullSecrets:
  - name: svc-a3i-blsm-infra-ngc-creds
  containers:
  - name: ubuntu-22-04
    image: nvcr.io/metropolis/a3ieng/ubuntu:jammy-20240911.1
    imagePullPolicy: "Always"
    command:
    - sleep
    args:
    - infinity
  - name: flake8
    image: python:3-alpine
    command:
    - sleep
    args:
    - '1000000'
  - name: jenkins-shared-lib-base
    image: nvcr.io/metropolis/a3ieng/msv:0.0.4
    imagePullPolicy: "Always"
    command:
    - sleep
    args:
    - 1d
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: amd64
