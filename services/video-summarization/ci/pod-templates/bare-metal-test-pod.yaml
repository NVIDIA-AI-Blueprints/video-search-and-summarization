apiVersion: v1
kind: Pod
metadata:
spec:
  serviceAccountName: met-vss-sa
  imagePullSecrets:
  - name: svc-a3i-blsm-infra-ngc-creds
  containers:
  - name: ubuntu-22-04
    image: nvcr.io/metropolis/a3ieng/ubuntu:jammy-20240911.1
    imagePullPolicy: "Always"
    env:
    - name: LC_ALL
      value: "C.UTF-8"
    command:
    - sleep
    args:
    - infinity
  - name: ubuntu-22-04-for-bm
    image: nvcr.io/metropolis/a3ieng/ubuntu:jammy-20240911.1
    imagePullPolicy: "Always"
    env:
    - name: LC_ALL
      value: "C.UTF-8"
    command:
    - sleep
    args:
    - infinity
  - name: ubuntu-24-04-for-bm
    image: nvcr.io/metropolis/a3ieng/ubuntu-24-04:noble-20241118.1
    imagePullPolicy: "Always"
    env:
    - name: LC_ALL
      value: "C.UTF-8"
    command:
    - sleep
    args:
    - infinity
  - name: jenkins-shared-lib-base
    image: nvcr.io/metropolis/a3ieng/msv:0.0.4
    imagePullPolicy: "Always"
    command:
    - sleep
    args:
    - 1d
  # Override the jnlp container to set GIT_LFS_SKIP_SMUDGE=1.
  # Due to JENKINS-30600, the Jenkins git-client plugin runs git via RemoteLauncher
  # (JNLP remoting) inside the jnlp container, ignoring the defaultContainer/
  # ContainerExecDecorator.  withEnv() in the pipeline does not reliably propagate
  # to the git subprocess in that path, so the env var must be set at the container
  # level.  GIT_LFS_SKIP_SMUDGE prevents git-lfs filter-process from downloading
  # LFS objects during checkout, avoiding the 10-minute SCM timeout.
  - name: jnlp
    env:
    - name: GIT_LFS_SKIP_SMUDGE
      value: "1"
  nodeSelector:
    kubernetes.io/os: linux
