apiVersion: v1
kind: Pod
metadata:
spec:
  serviceAccountName: met-vss-sa
  imagePullSecrets:
  - name: svc-a3i-blsm-infra-ngc-creds
  containers:
  - name: docker
    image: docker:23.0.6
    command:
    - sleep
    args:
    - 99d
    env:
      - name: DOCKER_HOST
        value: tcp://localhost:2375
  - name: docker-daemon
    image: docker:23.0.6-dind
    securityContext:
      privileged: true
    env:
      - name: DOCKER_TLS_CERTDIR
        value: ""
  nodeSelector:
    kubernetes.io/os: linux
    kubernetes.io/arch: arm64
