name: otel-stack

services:
  # OpenTelemetry Collector - receives traces and forwards to backends
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./configmaps/otel-collector-config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus metrics (collector)
    networks:
      - app-network
    restart: unless-stopped

  # Jaeger - distributed tracing UI
  jaeger:
    image: jaegertracing/all-in-one:1.54
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Jaeger collector HTTP
    networks:
      - app-network
    restart: unless-stopped

  # Arize Phoenix - LLM observability UI
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"    # Phoenix UI + OTLP HTTP
      - "4320:4317"    # Phoenix OTLP gRPC (remapped to avoid host conflict with collector)
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
    volumes:
      - phoenix_data:/mnt/data
    networks:
      - app-network
    restart: unless-stopped

volumes:
  phoenix_data:
    driver: local

networks:
  app-network:
    external: true
    name: compose-files_app-network  # Match your existing network
