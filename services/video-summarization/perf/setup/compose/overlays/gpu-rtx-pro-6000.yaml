# NVIDIA RTX PRO 6000 Blackwell Workstation — compute 12.0 → NVFP4.
#
# CR3 Nano is the default. Set CR3_VARIANT=super for CR3 Super at the same
# precision; an explicit MODEL_PATH (shell or .env) overrides both.
# ─────────────────────────────────────────────────────────────────────────────
services:
  rtvi-vlm:
    environment:
      MODEL_PATH: ${MODEL_PATH:-ngc:nim/nvidia/cosmos3-${CR3_VARIANT:-nano}-reasoner:modelopt-nvfp4-full-quantize-final_format_fix}
