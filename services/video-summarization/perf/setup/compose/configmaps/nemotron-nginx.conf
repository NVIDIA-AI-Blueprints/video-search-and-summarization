worker_processes auto;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    client_max_body_size 0;  # No limit on request body size

    # Large payload optimizations - avoid disk buffering
    client_body_buffer_size 64m;          # Buffer up to 64MB in memory (default 8k/16k!)
    client_body_in_single_buffer on;      # Keep body in one contiguous buffer
    client_body_timeout 300s;

    # TCP optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Keepalive to clients
    keepalive_timeout 300s;
    keepalive_requests 10000;

    # Disable gzip - base64 doesn't compress
    gzip off;

    upstream nemotron_backend {
        least_conn;
        server nemotron-3-nano-1:9233;
        server nemotron-3-nano-2:9233;

        # Keepalive connection pool to upstream
        keepalive 256;
        keepalive_requests 10000;
        keepalive_timeout 300s;
    }

    server {
        listen 9233;

        location / {
            proxy_pass http://nemotron_backend;
            proxy_http_version 1.1;

            # Required for upstream keepalive
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Stream request body directly to upstream - don't buffer large payloads
            proxy_request_buffering off;

            # Timeouts for long-running inference requests
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # For streaming responses
            proxy_buffering off;
            chunked_transfer_encoding on;
        }
    }
}
