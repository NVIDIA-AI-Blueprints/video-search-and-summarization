global:
  scrape_interval: 15s # Set the scrape interval to every 1 second. Default is every 1 minute.
  evaluation_interval: 1s # Evaluate rules every 1 second. The default is every 1 minute.
  # scrape_timeout is set to the global default (10s).


# A scrape configuration containing exactly one endpoint to scrape:
scrape_configs:
  - job_name: "nemotron-3-nano"
    scrape_interval: 5s
    metrics_path: "/v1/metrics"
    static_configs:
      - targets: ["nemotron-3-nano:9233"]

  - job_name: "dcgm-exporter"
    scrape_interval: 1s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["dcgm-exporter:9400"]

  - job_name: "via-server"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["lvs:38111"]

  - job_name: "node-exporter"
    scrape_interval: 15s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["node-exporter:9100"]
