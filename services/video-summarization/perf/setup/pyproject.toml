[project]
name = "vss-lvs-perf-environment"
version = "0.1.0"
description = "Host-side Python environment for LVS performance benchmarks"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.5.0",
  "minio>=7.2.0",
  "numpy>=1.21.0",
  "openpyxl>=3.0.0",
  "pandas>=1.5.0",
  "psutil>=5.9.0",
  "pydantic>=2.12.0",
  "pynvml>=11.5.0",
  "python-dotenv>=0.19.0",
  "PyYAML>=6.0",
  "requests>=2.28.0",
  "sseclient-py>=1.7.0",
  "urllib3==2.7.0",
]

[tool.uv]
package = false
