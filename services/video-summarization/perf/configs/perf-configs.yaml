# ci/perf-configs.yaml — EngSQA 3.2.0 GA platform profiles (hand-maintained).
#
# Each entry is one platform×topology row for CI or Perf-LAB/SQA benchmarking.
# Configs sharing a nodeLabel are batched on one Jenkins bare-metal node.
#
# Fields:
#   id          - Canonical config_id in benchmark JSON (PERF_CONFIG_IDS / CONFIG_ID).
#   composePath - Docker compose file, relative to the repo root.
#   nodeLabel   - Jenkins lockable-resource label.
#   imageArch   - LVS image architecture tag (amd64, arm64-sbsa, arm64-igpu).
#   enabled     - false skips the row in CI when PERF_CONFIG_IDS=all.
#   vlmModel, llmModel, vlmGpus, llmGpus, vision_input_tokens - JSON metadata.
#
# Perf-LAB/SQA: metadata resolves from composePath + nvidia-smi GPU family (id prefix).
# CI: sets CONFIG_ID from the id field.
#
# To run a subset: PERF_CONFIG_IDS=<comma-separated ids>
# To run all enabled: PERF_CONFIG_IDS=all (default)

perf_configs:

  # --- H100 ---
  - id: "h100-2-1x1-cr3-nano-rtvi-nemo3nano-9k"
    composePath: "compose/x86-rtvi-cr-nemo3-nano_2gpu.yaml"
    nodeLabel: "H100-SXM"
    imageArch: "amd64"
    enabled: true
    checkoutPaths:
      - libs/vss-perf-reporting/
    description: "H100 1x1: CR3 Nano VLM (GPU 0) + Nemotron-3-Nano LLM (GPU 1)"
    vlmModel: "cosmos-reason3-nano"
    llmModel: "nemotron-3-nano"
    vlmGpus: "0"
    llmGpus: "1"
    vision_input_tokens: "9k"

