# Single GPU topology - graph rag override yaml
# gpu ids - model
# 0     - LLM (LLama-8b) with nim low memory mode
# 0     - VLM (Cosmos reason FP8) with batch size 32
# 0     - Embedding with nim low memory mode
# 0     - Reranker with nim low memory mode

nim-llm:
  image:
    repository: nvcr.io/nim/meta/llama-3.1-8b-instruct
    tag: 1.12.0
  llmModel: meta/llama-3.1-8b-instruct
  model:
    name: meta/llama-3.1-8b-instruct
  env:
  - name: NVIDIA_VISIBLE_DEVICES
    value: "0"
  - name: NIM_LOW_MEMORY_MODE
    value: "1"
  - name: NIM_RELAX_MEM_CONSTRAINTS
    value: "1"
  resources:
    limits:
      nvidia.com/gpu: 0    # no limit

vss:
  applicationSpecs:
    vss-deployment:
      securityContext:
        fsGroup: 0
        runAsGroup: 0
        runAsUser: 0
      containers:
        vss:
          env:
          - name: LLM_MODEL
            value: meta/llama-3.1-8b-instruct
          - name: VLM_MODEL_TO_USE
            value: cosmos-reason1 # Or "openai-compat" or "custom" or "nvila"
          - name: MODEL_PATH
            value: "ngc:nim/nvidia/cosmos-reason1-7b:1.1-fp8-dynamic"
          - name: NVIDIA_VISIBLE_DEVICES
            value: "0"
          - name: VSS_SKIP_INPUT_MEDIA_VERIFICATION
            value: "1"
          - name: DISABLE_GUARDRAILS
            value: "true"
          - name: VLM_BATCH_SIZE
            value: "32"
          - name: VSS_EXTRA_ARGS
            value: "--max-live-streams 500"
          - name: ENABLE_VIA_HEALTH_EVAL
            value: "false"
          - name: VSS_LOG_LEVEL
            value: debug
          - name: CA_RAG_EMBEDDINGS_DIMENSION
            value: "500"

  extraPodVolumes:
  - name: videos
    hostPath:
      path: /colossus/ab/videos/warehouse
  - name: via-pod-logs-bkp
    hostPath:
      path: /colossus/ab/via-pod-logs-single_gpu_vrag_cr1.1_fp8
  extraPodVolumeMounts:
  - name: videos
    mountPath: /opt/nvidia/via/streams/perf
  - name: via-pod-logs-bkp
    mountPath: /tmp/via-logs

  llmModel: meta/llama-3.1-8b-instruct
  llmModelChat: meta/llama-3.1-8b-instruct
  configs:
    ca_rag_config.yaml:
      chat:
        llm:
          model: meta/llama-3.1-8b-instruct
      notification:
        llm:
          model: meta/llama-3.1-8b-instruct
      summarization:
        llm:
          model: meta/llama-3.1-8b-instruct
    guardrails_config.yaml:
      models:
      - engine: nim
        model: meta/llama-3.1-8b-instruct
        parameters:
          base_url: http://llm-nim-svc:8000/v1
        type: main
      - engine: nim
        model: nvidia/llama-3.2-nv-embedqa-1b-v2
        parameters:
          base_url: http://nemo-embedding-embedding-deployment-embedding-service:8000/v1
        type: embeddings

  resources:
    limits:
      nvidia.com/gpu: 0    # no limit

nemo-embedding:
  applicationSpecs:
    embedding-deployment:
      containers:
        embedding-container:
          env:
          - name: NGC_API_KEY
            valueFrom:
              secretKeyRef:
                key: NGC_API_KEY
                name: ngc-api-key-secret
          - name: NVIDIA_VISIBLE_DEVICES
            value: '0'
          - name: NIM_MODEL_PROFILE
            value: "f7391ddbcb95b2406853526b8e489fedf20083a2420563ca3e65358ff417b10f" # model profile: fp16-onnx-onnx
          - name: NIM_TRT_ENGINE_HOST_CODE_ALLOWED
            value: '1'
  resources:
    limits:
      nvidia.com/gpu: 0    # no limit

nemo-rerank:
  applicationSpecs:
    ranking-deployment:
      containers:
        ranking-container:
          env:
          - name: NGC_API_KEY
            valueFrom:
              secretKeyRef:
                key: NGC_API_KEY
                name: ngc-api-key-secret
          - name: NVIDIA_VISIBLE_DEVICES
            value: '0'
          - name: NIM_MODEL_PROFILE
            value: "f7391ddbcb95b2406853526b8e489fedf20083a2420563ca3e65358ff417b10f" # model profile: fp16-onnx-onnx
  resources:
    limits:
      nvidia.com/gpu: 0    # no limit

global:
  ngcImagePullSecretName: ngc-docker-reg-secret
