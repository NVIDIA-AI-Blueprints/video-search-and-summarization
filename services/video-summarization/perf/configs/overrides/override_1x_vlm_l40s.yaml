nim-llm:
  enabled: false

nemo-rerank:
  enabled: false

nemo-embedding:
  enabled: false

vss:
  applicationSpecs:
    vss-deployment:
      initContainers: []
      securityContext:
        fsGroup: 0
        runAsGroup: 0
        runAsUser: 0
      containers:
        vss:
          env:
          - name: VLM_MODEL_TO_USE
            value: cosmos-reason1 # Or "openai-compat" or "custom" or "nvila"
          - name: MODEL_PATH
            value: "git:https://huggingface.co/nvidia/Cosmos-Reason1-7B"
          - name: NVIDIA_VISIBLE_DEVICES
            value: "0"
          - name: VSS_SKIP_INPUT_MEDIA_VERIFICATION
            value: "1"
          - name: DISABLE_GUARDRAILS
            value: "true"
          - name: VLM_BATCH_SIZE
            value: "128"
          - name: VSS_EXTRA_ARGS
            value: "--max-live-streams 500"
          - name: ENABLE_VIA_HEALTH_EVAL
            value: "false"
          - name: VSS_LOG_LEVEL
            value: debug
          - name: DISABLE_CA_RAG
            value: "true"
  resources:
    limits:
      nvidia.com/gpu: 0

  extraPodVolumes:
  - name: videos
    hostPath:
      path: /colossus/ab/videos/warehouse
  - name: via-pod-logs-bkp
    hostPath:
      path: /colossus/perf_2.4GA/8x_RTX_PRO #update this path to store via-server logs on host
  extraPodVolumeMounts:
  - name: videos
    mountPath: /opt/nvidia/via/streams/perf
  - name: via-pod-logs-bkp
    mountPath: /tmp/via-logs
