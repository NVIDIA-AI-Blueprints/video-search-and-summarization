# LVS KPI Definition - Long Video Summarization
# Reference: baselines keys = platform_configs config id; numbers from LVS EA1 release.
#
# Test case shapes (from benchmark JSON):
#   Single-file: test_case_id e.g. single_file_120min_10sec
#     metrics.latency: e2e_seconds, vlm_pipeline_seconds, ca_rag_seconds, decode_seconds, vlm_seconds
#     metrics.gpu: vlm_gpu_usage_mean, vlm_gpu_memory_mean, llm_gpu_usage_mean, llm_gpu_memory_mean
#   File-burst: test_case_id e.g. burst_target_60s_5min
#     metrics.optimal_target_concurrency: concurrency_level, avg_latency_seconds, p90_latency_seconds, throughput_files_per_second
#     metrics.gpu: same as single-file
service: LVS
schema_version: "0.0.1"

# -----------------------------------------------------------------------------
# Platform configs (evaluator baseline lookup)
# -----------------------------------------------------------------------------
platform_configs:
  - platform:
      gpu: { model: "H100", count: 4 }
    config:
