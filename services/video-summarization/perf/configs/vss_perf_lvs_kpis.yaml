# -----------------------------------------------------------------------------
# KPIs: path, thresholds, dashboard. Baselines keyed by platform_config id.
# Single-file test cases (e.g. single_file_120min_10sec): latency.* and gpu.* only.
# File-burst test cases (e.g. burst_target_60s_5min): optimal_target_concurrency.* and gpu.* only.
# Path lookup per test case: e2e_latency etc. apply to single_file; burst_* apply to file_burst.
# -----------------------------------------------------------------------------
kpis:
  # Single-file: latency and GPU
  - name: decode_seconds
    description: "Decode (s)"
    path: test_cases[*].metrics.latency.decode_seconds
    unit: s
    optional: true
    dashboard: { chart: primary, stacked: true }
    # sol: { default: null }
  - name: vlm_seconds
    description: "VLM (s)"
    path: test_cases[*].metrics.latency.vlm_seconds
    unit: s
    optional: true
    dashboard: { chart: primary, stacked: true }
    # sol: { default: null }
  - name: ca_rag_seconds
    description: "CA-RAG (s)"
    path: test_cases[*].metrics.latency.ca_rag_seconds
    unit: s
    optional: true
    dashboard: { chart: primary, stacked: true }
    # sol: { default: null }
  - name: e2e_latency
    description: "E2E Latency (s)"
    path: test_cases[*].metrics.latency.e2e_seconds
    unit: seconds
    direction: lower
    aggregation: avg
    dashboard: { chart: primary, trend: true, summary_stat: true }
    thresholds: { warning_percent: 10, critical_percent: 20 }
    # EA1 numbers; keys = test_case_id (single_file_<name>_10sec)
