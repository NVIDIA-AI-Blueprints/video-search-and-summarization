# Performance Test Configuration for single-GPU edge boards (Jetson Thor / Orin,
# DGX Spark)
# Same as config.yaml, except single_file_test runs only the 1/10/30/60min videos,
# file_burst_test drops the 10min video, and the VLM and LLM share GPU 0. These
# are the durations SQA runs on Thor and Spark. compose/run_benchmark.sh uses this
# config by default for thor-*, orin-nx-* and spark-* compose files.
# file_burst_test also uses wider target-latency tolerances (10 s at 1min, 30 s at
# 5min): these boards run only a few files at once, so one more file moves the
# average latency far more than on a datacenter GPU.

# Global test settings
global:
  # VSS backend URL for the API (can be overridden by VIA_BACKEND env var)
  vss_backend: "http://localhost:38111"

  # Output directory for test results
  output_dir: "vss-perf-report"

  # GPU configuration
  vlm_gpus: [0]  # GPU indices used for VLM
  llm_gpus: [0]  # GPU indices used for LLM

  # GPU monitoring settings
  gpu_monitoring:
    enabled: true  # Enable GPU monitoring during tests
    interval_seconds: 1  # Monitoring interval in seconds (default: 2)

  # CPU/RAM monitoring settings
  cpu_monitoring:
    enabled: true
    interval_seconds: 1

  # /summarize API parameters
  summarize_api_params:
    max_tokens: 100
    # num_frames_per_chunk: 40
    events:
      - "worker dropping boxes"
      - "PPE violation"
      - "forklift safety violation"
      - "worker in restricted area"
      - "equipment malfunction"
      - "safety protocol violation"
      - "boxes falling"
      - "worker falling"
      - "unauthorized personnel"
      - "forklift stuck or blocked"
      - "improper lifting technique"
      - "spill or debris on floor"
      - "emergency exit blocked"
      - "workers congregating"
      - "workers using phone"
      - "unsecured load"
      - "speed violation"
      - "collision or near miss"
      - "improper storage"
      - "fire hazard"
    scenario: "warehouse safety monitoring"


# Test scenarios - each scenario defines a set of tests to run
test_scenarios:
  # Quick test scenario - for development/debugging
  quick_test:
    description: "Quick test with short videos"
    benchmark_mode: "single_file"
    iterations: 1
    videos:
      - url: "http://media-server/10min.mp4"
        chunk_sizes: [10]
        # Example: Override API params for specific video
        # summarize_api_params:
        #   temperature: 0.5

  # Mode 1: Single File Summarization
  single_file_test:
    description: "Single file processing and summarization"
    benchmark_mode: "single_file"
    iterations: 3
    videos:
      - url: "http://media-server/1min.mp4"
        chunk_sizes: [10]
      - url: "http://media-server/10min.mp4"
        chunk_sizes: [10]
      - url: "http://media-server/30min.mp4"
        chunk_sizes: [10]
      - url: "http://media-server/60min.mp4"
        chunk_sizes: [10]

  # Mode 2: File Burst Test (Concurrency video files)
  file_burst_test:
    description: "Test different concurrency levels and measure latency statistics"
    benchmark_mode: "file_burst"
    videos:
      - url: "http://media-server/1min.mp4"
        chunk_sizes: [10]
        concurrency_levels: [1, 2, 4]
        target_latency_seconds: 60.0
        target_latency_tolerance: 10.0
      - url: "http://media-server/5min.mp4"
        chunk_sizes: [10]
        concurrency_levels: [2, 4, 8]
        target_latency_seconds: 300.0
        target_latency_tolerance: 30.0
