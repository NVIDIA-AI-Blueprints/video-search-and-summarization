# Serve media from /usr/share/nginx/html.
# Paths like video-1.mp4, video-2.mp4, ... rewrite to video.mp4 (same file, different URL).
# Use so clients can request distinct URLs (e.g. http://media-server/1min-1.mp4, 1min-2.mp4)
# and avoid any URL-based dedup without changing via-engine/via-ctx-rag.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    location / {
        # e.g. /1min-3.mp4 -> /1min.mp4, /10min-99.mkv -> /10min.mkv
        rewrite ^/(.+)-[0-9]+\.(mp4|mkv)$ /$1.$2 last;
        try_files $uri $uri/ =404;
    }
}
