#
# Usage:
#   export NGC_API_KEY=...
#   docker compose -f compose/x86-rtvi-cr-nim-nemo3-nano_8gpu.yaml up -d
################################################################################

name: x86-rtvi-cr-nim-nemo3-nano-8gpu

include:
  - media-server.yaml

services:
  # ── GPU pre-check ──
  gpu-precheck:
    extends:
      file: gpu-precheck.yaml
      service: gpu-precheck
    environment:
      GPU_IDS_TO_CHECK: "${RTVI_GPU_0:-0},${RTVI_GPU_1:-1},${RTVI_GPU_2:-2},${RTVI_GPU_3:-3},${VLM_NIM_GPU_0:-0},${VLM_NIM_GPU_1:-1},${VLM_NIM_GPU_2:-2},${VLM_NIM_GPU_3:-3},${LLM_GPU_0:-4},${LLM_GPU_1:-5},${LLM_GPU_2:-6},${LLM_GPU_3:-7}"

  # ── Health check sidecars ──────────────────────────────────
  wait-for-rtvi:
    image: curlimages/curl:latest
    command:
      - sh
      - -c
      - >-
        until curl -f http://rtvi-vlm:8000/v1/health/ready; do
          echo 'Waiting for rtvi-vlm...'; sleep 2;
        done; echo 'rtvi-vlm is ready!'
    networks: [app-network]
    restart: "no"

  wait-for-cosmos-nim:
    image: curlimages/curl:latest
    command:
      - sh
      - -c
      - >-
        until curl -f http://cosmos-reason2-8b:9234/v1/health/ready; do
          echo 'Waiting for cosmos-reason2-8b NIM...'; sleep 2;
        done; echo 'cosmos-reason2-8b NIM is ready!'
    networks: [app-network]
    restart: "no"

  wait-for-llm:
    image: curlimages/curl:latest
    command:
      - sh
      - -c
      - >-
        until curl -f http://nemotron-3-nano:9233/v1/health/ready; do
          echo 'Waiting for nemotron-3-nano...'; sleep 2;
        done; echo 'nemotron-3-nano is ready!'
    networks: [app-network]
    restart: "no"

  wait-for-elasticsearch:
    image: curlimages/curl:latest
    command:
      - sh
      - -c
      - >-
        until nc -z elasticsearch 9300; do
          echo 'Waiting for elasticsearch...'; sleep 2;
        done; echo 'elasticsearch is ready!'
    networks: [app-network]
    restart: "no"

  # ── LVS (VIA Engine) ──────────────────────────────────────
  lvs:
    image: ${LVS_IMAGE:-nvcr.io/nvidia/vss-core/vss-video-summarization:3.2.1}
    environment:
      NGC_API_KEY: ${NGC_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}

      BACKEND_PORT: "38111"
      LVS_MCP_PORT: "38112"
      VIA_DEV_API: "true"

      RTVI_VLM_URL: http://rtvi-vlm:8000

      CA_RAG_CONFIG: /opt/nvidia/via/config/default_config.yaml
      DISABLE_CA_RAG: ${DISABLE_CA_RAG:-false}
      FORCE_CA_RAG_RESET: ${FORCE_CA_RAG_RESET:-}

      LVS_LLM_ENABLE: "true"
      LVS_LLM_BASE_URL: http://nemotron-3-nano:9233/v1
      LVS_LLM_MODEL_NAME: nvidia/nemotron-3-nano
      LVS_EMB_ENABLE: "false"

      LVS_DATABASE_BACKEND: elasticsearch_db
      ES_HOST: elasticsearch
      ES_PORT: "9200"
      ES_TRANSPORT_PORT: "9300"

      ENABLE_AUDIO: ${ENABLE_AUDIO:-false}

      VIA_ENABLE_OTEL: ${VIA_ENABLE_OTEL:-false}
      VIA_OTEL_ENDPOINT: ${VIA_OTEL_ENDPOINT:-http://otel-collector:4318}
      VIA_OTEL_EXPORTER: ${VIA_OTEL_EXPORTER:-console}
      VIA_CTX_RAG_ENABLE_OTEL: ${VIA_CTX_RAG_ENABLE_OTEL:-false}
      VIA_CTX_RAG_EXPORTER: ${VIA_OTEL_EXPORTER:-console}
      VIA_CTX_RAG_OTEL_ENDPOINT: ${VIA_OTEL_ENDPOINT:-http://otel-collector:4318}

      VSS_LOG_LEVEL: ${VSS_LOG_LEVEL:-INFO}
    ports:
      - ${LVS_BACKEND_PORT:-38111}:38111
      - "38112"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ${VIA_LOG_DIR:-/dummy}${VIA_LOG_DIR:+:/tmp/via-logs}
      - ${VIA_SRC_DIR:-/dummy}${VIA_SRC_DIR:+:/opt/nvidia/via:ro}
      - ${EXAMPLE_STREAMS_DIR:-/dummy}${EXAMPLE_STREAMS_DIR:+:/opt/nvidia/via/streams:ro}
      - ./configmaps/config.yaml:/opt/nvidia/via/config/default_config.yaml:ro
      - via-hf-cache:/tmp/huggingface
    depends_on:
      rtvi-vlm:
        condition: service_healthy
      cosmos-reason2-8b:
        condition: service_healthy
      nemotron-3-nano:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      wait-for-rtvi:
        condition: service_completed_successfully
      wait-for-cosmos-nim:
        condition: service_completed_successfully
      wait-for-llm:
        condition: service_completed_successfully
      wait-for-elasticsearch:
        condition: service_completed_successfully
      media-server:
        condition: service_started
        required: false  # gated by `media` profile
    networks: [app-network]
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:38111/v1/ready"]
      interval: 10s
      timeout: 1s
      retries: 100

  # ── RTVI-VLM (proxy mode, shares GPUs 0..3 with cosmos) ─
  rtvi-vlm:
    image: ${RTVI_VLM_IMAGE:-nvcr.io/nvidia/vss-core/vss-rt-vlm:3.2.1}
    user: "1001:1001"
    environment:
      NGC_API_KEY: ${NGC_API_KEY:-}
      BACKEND_PORT: "8000"
      VLM_BATCH_SIZE: "${VLM_BATCH_SIZE:-}"
      VLM_MODEL_TO_USE: openai-compat
      MODEL_PATH: openai-compat
      VIA_VLM_ENDPOINT: http://cosmos-reason2-8b:9234/v1
      VIA_VLM_OPENAI_MODEL_DEPLOYMENT_NAME: ${VIA_VLM_OPENAI_MODEL_DEPLOYMENT_NAME:-nvidia/cosmos-reason2-8b}
      VIA_VLM_API_KEY: ${VIA_VLM_API_KEY:-${NGC_API_KEY:-}}
      ASSET_DOWNLOAD_AUTH_TOKENS: ${ASSET_DOWNLOAD_AUTH_TOKENS:-}
      ASSET_DOWNLOAD_MAX_FILE_SIZE_GB: "${ASSET_DOWNLOAD_MAX_FILE_SIZE_GB:-24}"
      ASSET_TMPFS_SIZE: "${ASSET_TMPFS_SIZE:-24g}"
      MAX_ASSET_STORAGE_SIZE_GB: "${MAX_ASSET_STORAGE_SIZE_GB:-24}"
      RTVI_VIDEO_METADATA_ABSOLUTE_TIMESTAMPS: true
    ports:
      - "${RTVI_PORT:-8000}:8000"
    depends_on:
      gpu-precheck:
        condition: service_completed_successfully
    networks: [app-network]
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              driver: nvidia
              device_ids:
                - "${RTVI_GPU_0:-0}"
                - "${RTVI_GPU_1:-1}"
                - "${RTVI_GPU_2:-2}"
                - "${RTVI_GPU_3:-3}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health/ready"]
      interval: 10s
      timeout: 10s
      retries: 100
      start_period: 60s
    ulimits:
      memlock: { soft: -1, hard: -1 }
      stack: 67108864
      nofile: { soft: 65535, hard: 65535 }
    runtime: nvidia
    shm_size: 16g
    ipc: host

  # ── Cosmos-Reason2-8B NIM (VLM inference, shares GPUs 0..3, TP=4) ─
  cosmos-reason2-8b:
    image: ${VLM_NIM_IMAGE:-nvcr.io/nim/nvidia/cosmos-reason2-8b:1.6.0}
    environment:
      NGC_API_KEY: ${NGC_API_KEY}
      NIM_SERVER_PORT: "9234"
      NIM_DISABLE_MM_PREPROCESSOR_CACHE: 1
      NIM_ENABLE_KV_CACHE_REUSE: 0
      NIM_MEDIA_IO_KWARGS: '{"video":{"num_frames": -1}}'
    ports:
      - "9234"
    volumes:
      - rtvi-hf-cache:/tmp/huggingface
    depends_on:
      gpu-precheck:
        condition: service_completed_successfully
    networks: [app-network]
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              driver: nvidia
              device_ids:
                - "${VLM_NIM_GPU_0:-0}"
                - "${VLM_NIM_GPU_1:-1}"
                - "${VLM_NIM_GPU_2:-2}"
                - "${VLM_NIM_GPU_3:-3}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9234/v1/health/live"]
      interval: 10s
      timeout: 10s
      retries: 100
      start_period: 60s
    runtime: nvidia
    shm_size: 16g

  # ── LLM NIM (GPU 4,5,6,7) ─────────────────────────────────
  nemotron-3-nano:
    image: ${LLM_NIM_IMAGE:-nvcr.io/nim/nvidia/nemotron-3-nano:2.0.3}
    environment:
      NGC_API_KEY: ${NGC_API_KEY}
      NIM_SERVER_PORT: "9233"
    ports:
      - "9233"
    volumes:
      - ${LOCAL_NIM_CACHE:-/tmp/nim-cache}:/opt/nim/.cache
    depends_on:
      gpu-precheck:
        condition: service_completed_successfully
      cosmos-reason2-8b:
        condition: service_healthy
    networks: [app-network]
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              driver: nvidia
              device_ids:
                - "${LLM_GPU_0:-4}"
                - "${LLM_GPU_1:-5}"
                - "${LLM_GPU_2:-6}"
                - "${LLM_GPU_3:-7}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9233/v1/health/live"]
      interval: 10s
      timeout: 10s
      retries: 100
      start_period: 15s
    runtime: nvidia

  # ── Elasticsearch ──────────────────────────────────────────
  elasticsearch:
    image: elasticsearch:9.1.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      cluster.max_shards_per_node: ${ES_MAX_SHARDS_PER_NODE:-2000}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms4g -Xmx4g}
    ports:
      - "9200"
      - "9300"
    networks: [app-network]
    restart: "no"
    deploy:
      resources:
        limits:
          memory: ${ES_MEM_LIMIT:-6g}

volumes:
  via-hf-cache:
  rtvi-hf-cache:
  gpu-precheck-state:

networks:
  app-network:
    driver: bridge
