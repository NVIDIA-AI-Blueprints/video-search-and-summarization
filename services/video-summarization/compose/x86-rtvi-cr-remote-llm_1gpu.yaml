#   NGC_API_KEY=...
#   REMOTE_LLM_BASE_URL=http://<llm-host>:<port>/v1
#   REMOTE_LLM_MODEL_NAME=nvidia/nvidia-nemotron-nano-9b-v2   # whatever the remote serves
#   ASSET_DOWNLOAD_AUTH_TOKENS="<asset-host>=Bearer <token>"
#
# Usage:
#   export NGC_API_KEY=...
#   export REMOTE_LLM_BASE_URL=http://10.0.0.5:9233/v1
#   export REMOTE_LLM_MODEL_NAME=nvidia/nvidia-nemotron-nano-9b-v2
#   export ASSET_DOWNLOAD_AUTH_TOKENS="<asset-host>=Bearer <token>"
#   docker compose -f compose/x86-rtvi-cr-remote-llm_1gpu.yaml up -d
#   ./run_benchmark.sh -f x86-rtvi-cr-remote-llm_1gpu.yaml -s single_file_test
################################################################################

name: x86-rtvi-cr-remote-llm-1gpu

include:
  - media-server.yaml

services:
  # ── GPU pre-check ──
  gpu-precheck:
    extends:
      file: gpu-precheck.yaml
      service: gpu-precheck
    environment:
      GPU_IDS_TO_CHECK: "${RTVI_GPU_0:-0}"

  # ── Health check sidecars ──────────────────────────────────
  wait-for-rtvi:
    image: curlimages/curl:latest
    command:
      - sh
      - -c
      - >-
        until curl -f http://rtvi-vlm:8000/v1/health/ready; do
          echo 'Waiting for rtvi-vlm...'; sleep 2;
        done; echo 'rtvi-vlm is ready!'
    networks: [app-network]
    restart: "no"

  # Verifies the remote LLM endpoint is reachable + ready before LVS starts.
  # Uses ${REMOTE_LLM_BASE_URL}/health/ready (OpenAI-compatible NIM/vLLM convention).
  wait-for-llm:
    image: curlimages/curl:latest
    environment:
      REMOTE_LLM_BASE_URL: ${REMOTE_LLM_BASE_URL:?set REMOTE_LLM_BASE_URL to remote LLM /v1 endpoint}
    command:
      - sh
      - -c
      - >-
        until curl -fs "$$REMOTE_LLM_BASE_URL/health/ready" >/dev/null 2>&1
              || curl -fs "$$REMOTE_LLM_BASE_URL/models" >/dev/null 2>&1; do
          echo "Waiting for remote LLM at $$REMOTE_LLM_BASE_URL ..."; sleep 5;
        done; echo "remote LLM is ready!"
    networks: [app-network]
    restart: "no"

  wait-for-elasticsearch:
    image: curlimages/curl:latest
    command:
      - sh
      - -c
      - >-
        until nc -z elasticsearch 9300; do
          echo 'Waiting for elasticsearch...'; sleep 2;
        done; echo 'elasticsearch is ready!'
    networks: [app-network]
    restart: "no"

  # ── LVS (VIA Engine) ──────────────────────────────────────
  lvs:
    image: ${LVS_IMAGE:-nvcr.io/nvidia/vss-core/vss-video-summarization:3.2.1}
    environment:
      # API keys
      NGC_API_KEY: ${NGC_API_KEY:-}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}

      # Server
      BACKEND_PORT: "38111"
      LVS_MCP_PORT: "38112"
      VIA_DEV_API: "true"

      # RTVI-VLM backend
      RTVI_VLM_URL: http://rtvi-vlm:8000

      # CA-RAG config
      CA_RAG_CONFIG: /opt/nvidia/via/config/default_config.yaml
      DISABLE_CA_RAG: ${DISABLE_CA_RAG:-false}
      FORCE_CA_RAG_RESET: ${FORCE_CA_RAG_RESET:-}

      # LLM — REMOTE endpoint (not managed by this compose stack)
      LVS_LLM_ENABLE: "true"
      LVS_LLM_BASE_URL: ${REMOTE_LLM_BASE_URL:?set REMOTE_LLM_BASE_URL to remote LLM /v1 endpoint}
      LVS_LLM_MODEL_NAME: ${REMOTE_LLM_MODEL_NAME:-nvidia/nvidia-nemotron-nano-9b-v2}
      LVS_LLM_API_KEY: ${REMOTE_LLM_API_KEY:-}
      LVS_EMB_ENABLE: "false"

      # Database
      LVS_DATABASE_BACKEND: elasticsearch_db
      ES_HOST: elasticsearch
      ES_PORT: "9200"
      ES_TRANSPORT_PORT: "9300"

      # Audio
      ENABLE_AUDIO: ${ENABLE_AUDIO:-false}

      # OTEL (optional)
      VIA_ENABLE_OTEL: ${VIA_ENABLE_OTEL:-false}
      VIA_OTEL_ENDPOINT: ${VIA_OTEL_ENDPOINT:-http://otel-collector:4318}
      VIA_OTEL_EXPORTER: ${VIA_OTEL_EXPORTER:-console}
      VIA_CTX_RAG_ENABLE_OTEL: ${VIA_CTX_RAG_ENABLE_OTEL:-false}
      VIA_CTX_RAG_EXPORTER: ${VIA_OTEL_EXPORTER:-console}
      VIA_CTX_RAG_OTEL_ENDPOINT: ${VIA_OTEL_ENDPOINT:-http://otel-collector:4318}

      # Logging
      VSS_LOG_LEVEL: ${VSS_LOG_LEVEL:-INFO}

    ports:
      - ${LVS_BACKEND_PORT:-38111}:38111
      - "38112"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ${VIA_LOG_DIR:-/dummy}${VIA_LOG_DIR:+:/tmp/via-logs}
      - ${VIA_SRC_DIR:-/dummy}${VIA_SRC_DIR:+:/opt/nvidia/via:ro}
      - ${EXAMPLE_STREAMS_DIR:-/dummy}${EXAMPLE_STREAMS_DIR:+:/opt/nvidia/via/streams:ro}
      - ./configmaps/config.yaml:/opt/nvidia/via/config/default_config.yaml:ro
      - via-hf-cache:/tmp/huggingface
    depends_on:
      rtvi-vlm:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      wait-for-rtvi:
        condition: service_completed_successfully
      wait-for-llm:
        condition: service_completed_successfully
      wait-for-elasticsearch:
        condition: service_completed_successfully
      media-server:
        condition: service_started
        required: false  # gated by `media` profile
    networks: [app-network]
    restart: "no"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:38111/v1/ready"]
      interval: 10s
      timeout: 1s
      retries: 100

  # ── RTVI-VLM (Cosmos3-Nano-Reasoner, owns GPU 0) ──────────────
  # No local LLM contending for GPU memory → bump VLLM_GPU_MEMORY_UTILIZATION
  # to ~0.75 so KV cache has room on a 24 GB RTX 4500 Ada.
  rtvi-vlm:
    image: ${RTVI_VLM_IMAGE:-nvcr.io/nvidia/vss-core/vss-rt-vlm:3.2.1}
    user: "1001:1001"
    environment:
      NGC_API_KEY: ${NGC_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      BACKEND_PORT: "8000"
      VLM_BATCH_SIZE: "${VLM_BATCH_SIZE:-32}"
      VLM_MODEL_TO_USE: ${VLM_MODEL_TO_USE:-cosmos-reason3}
      VLLM_GPU_MEMORY_UTILIZATION: ${VLLM_GPU_MEMORY_UTILIZATION:-0.75}
      VLLM_DISABLE_MM_PREPROCESSOR_CACHE: "${VLLM_DISABLE_MM_PREPROCESSOR_CACHE:-true}"
      VLLM_ENABLE_PREFIX_CACHING: "${VLLM_ENABLE_PREFIX_CACHING:-false}"
      MODEL_PATH: ${MODEL_PATH:-ngc:nim/nvidia/cosmos3-nano-reasoner:modelopt-fp8-final_format_fix}
      ASSET_DOWNLOAD_AUTH_TOKENS: ${ASSET_DOWNLOAD_AUTH_TOKENS:-}
      ASSET_DOWNLOAD_MAX_FILE_SIZE_GB: "${ASSET_DOWNLOAD_MAX_FILE_SIZE_GB:-24}"
      ASSET_TMPFS_SIZE: "${ASSET_TMPFS_SIZE:-24g}"
      MAX_ASSET_STORAGE_SIZE_GB: "${MAX_ASSET_STORAGE_SIZE_GB:-24}"
      RTVI_VIDEO_METADATA_ABSOLUTE_TIMESTAMPS: true
    ports:
      - "${RTVI_PORT:-8000}:8000"
    volumes:
      - rtvi-hf-cache:/tmp/huggingface
    depends_on:
      gpu-precheck:
        condition: service_completed_successfully
    networks: [app-network]
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
              driver: nvidia
              device_ids: ["${RTVI_GPU_0:-0}"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health/ready"]
      interval: 10s
      timeout: 10s
      retries: 100
      start_period: 60s
    ulimits:
      memlock: { soft: -1, hard: -1 }
      stack: 67108864
      nofile: { soft: 65535, hard: 65535 }
    runtime: nvidia
    shm_size: 16g
    ipc: host

  # ── Elasticsearch ──────────────────────────────────────────
  elasticsearch:
    image: elasticsearch:9.1.2
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      cluster.max_shards_per_node: ${ES_MAX_SHARDS_PER_NODE:-2000}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS:--Xms4g -Xmx4g}
    ports:
      - "9200"
      - "9300"
    networks: [app-network]
    restart: "no"
    deploy:
      resources:
        limits:
          memory: ${ES_MEM_LIMIT:-6g}

volumes:
  via-hf-cache:
  rtvi-hf-cache:
  gpu-precheck-state:

networks:
  app-network:
    driver: bridge
