services:
  sys-cache-cleaner:
    image: busybox:1.37
    privileged: true
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        set -e
        echo "disable vm/nr_hugepages"
        echo 0 > /proc/sys/vm/nr_hugepages
        echo "Starting cache cleaner - running every 3s"
        trap 'echo "stopping cache cleaner"; exit 0' TERM INT
        while true; do
          sync && echo 3 > /proc/sys/vm/drop_caches
          sleep 3
        done
