# Server URL, token, project key, and project name are injected by CI
# (Jenkins withSonarQubeEnv + SONAR_PROJECT_KEY / SONAR_PROJECT_NAME).
# Branch name is passed via command line: -Dsonar.branch.name=${BRANCH_NAME}

# Source configuration
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.10

# Coverage configuration
sonar.python.coverage.reportPaths=coverage_reports/coverage.xml
# Exclude paths with no unit-test coverage harness from the coverage gate
sonar.coverage.exclusions=tests/**,docker/**,src/via_client_cli.py

# Additional exclusions (excluded from all analysis)
sonar.exclusions=**/__pycache__/**,**/*.pyc
