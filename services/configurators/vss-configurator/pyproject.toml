[project]
name = "vss-configurator"
version = "0.1.0"
description = "Unified configuration management service for VSS Blueprints"
requires-python = ">=3.13"
dependencies = [
    "Flask==3.1.0",
    "kafka-python==2.3.0",
    "gunicorn==23.0.0",
    "requests==2.32.3",
    "redis==5.0.1",
    "ruamel.yaml==0.18.15",
    "spatialai-data-utils==2.0.2",
]

[tool.uv]
managed = true

[tool.uv.sources]
spatialai-data-utils = { path = "../../../libs/analytics/spatialai-data-utils/release" }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]
