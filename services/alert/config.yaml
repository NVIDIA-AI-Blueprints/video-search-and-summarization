# ============================================================================
# SIMPLIFIED ALERT AGENT CONFIGURATION
# ============================================================================
# This configuration supports the simplified alert processing flow:
# JSON Input → Entity Building → VSS Video Analysis → Enhanced JSON Output

# Base directory for media used during alert review (optional)
# If set, components can resolve relative media paths against this base dir
ALERT_REVIEW_MEDIA_BASE_DIR: ""

# --- VST: where the clip for an incident comes from -------------------------
vst_config:
  # Base URL for general VST APIs already used elsewhere in the codebase
  base_url: "http://localhost:30888"
  sensor_list_endpoint: "/vst/api/v1/sensor/streams"
  segment_anchor: "end"          # clip window anchor: start | end | middle
  segment_duration_seconds: 10   # clip window length
  add_overlay: false             # burn detection boxes into the clip
  storage:                       # VST storage API; may sit behind its own ingress
    base_url: "http://localhost:30888"
    # Endpoint to fetch media file path by VST id
    media_file_path_by_id_endpoint: "/api/v1/storage/file/path"

# General Kafka Configuration - Message Processing
kafka:
  bootstrap_servers: "localhost:9092"
  group_id: 'kafka-incidents-dumper'   # legacy kafka.anomalyTopic path only; ignored once event_bridge.kafka_source.topics is set
  max_poll_records: 10                 # records per poll
  auto_offset_reset: 'latest'
  enable_auto_commit: false
  poll_timeout: 100                            # Kafka consumer poll wait timeout in milliseconds
  message_type: "Incident"  # Protobuf message type: "Behavior" or "Incident"
  max_poll_interval_ms: 60000      # 60 seconds
  session_timeout_ms: 10000        # 10 seconds
  heartbeat_interval_ms: 3000      # 3 seconds
  # Commit offsets once per poll batch (highest offset per partition) instead
  # of once per message, removing one commit call per message from the
  # GIL-bound consume thread. This does NOT make the pipeline at-least-once:
  # the batch is flushed before any message is dispatched, so in-flight work
  # is lost on a crash either way. It opens a redelivery window of one poll
  # batch, entered only when a crash lands inside the poll loop. Enable only
  # where duplicates within that window are tolerated.
  batch_commit: false

# --- VLM: the model that verifies each incident ----------------------------
# Global defaults; any alert type can override any of them via vlm_params.
vlm:
  base_url: "http://localhost:30082/v1"
  model: "nvidia/cosmos3-nano-reasoner"
  max_tokens: 4096
  request_timeout: 5

  # VLM Media Source: how to send video to VLM endpoint
  # false (default) - Pass video URL to VLM (VLM fetches from URL)
  # true - Download video locally, base64-encode, upload to VLM
  vlm_media_source_using_base64: false

  # How the answer is parsed: auto | cosmos-reason | json | other | <custom>
  #   auto           from the model name: cosmos-reason1/2 or cosmos3 ->
  #                  cosmos-reason, anything else -> other
  #   cosmos-reason  any Cosmos Reason model, tagged or bare verdicts
  #                  (aliases: cr1, cr2, cr3)
  #   json           field names in json_parser below; the prompt must ask for JSON
  #   <custom>       a name registered by custom_parser_module
  response_format: "auto"
  # Module calling register_parser("name", fn), auto-imported at startup; fn
  # takes (text, json_config) and returns a VLMResponse.
  # custom_parser_module: "custom_parsers.my_parser"

  # Parser class — parse(raw_response) -> dict — replacing verification parsing
  # outright. Its JSON lands in info["vlm_response"] with info["verdict"] = ""
  # instead of the usual info["reasoning"], and setting this key is the only way
  # to get that field. MUST be thread-safe: one instance serves every worker.
  # Beats custom_parser_module on the VLM path (setting both logs a startup
  # WARN), which then only applies to direct model_validate_text calls.
  # response_parser: "my_package.parsers.FireClassifier"

  # For response_format: "json". All optional, defaults shown; dot-notation for
  # nested fields, verdict_mapping for non-string verdicts.
  # json_parser:
  #   verdict_field: "prediction_answer"
  #   reasoning_fields:                 # first match wins
  #     - "reasoning"
  #     - "thinking"
  #     - "explanation"
  #     - "video_description"
  #   verdict_mapping:                                  # optional; map non-string values to YES/NO
  #     "true": "YES"
  #     "false": "NO"

  # true: omit the media parameters below so the VLM uses its own defaults
  # (e.g. 4 FPS and larger pixel limits on CR2).
  use_vlm_media_defaults: false
  temperature: 0.6                    # CR2: 0.6 with reasoning tags, 0.7 without
  # false: omit mm_processor_kwargs.size and let the model choose — useful when
  # the bounds below hurt accuracy, but per-frame token cost rises sharply and
  # long HD clips can breach the NIM's 1B-pixel cap (HTTP 400).
  do_resize: true
  min_pixels: 1568                    # keep these within the VLM's context window
  max_pixels: 345600
  num_frames: 5
  enable_sampling: false
  sampling_fps: 4
  # warmup:                   # override for slow GPUs or large models
  #   poll_timeout: 300       # wait for NIM readiness
  #   poll_interval: 10       # between readiness polls
  #   inference_timeout: 120  # first, cold inference
  #   num_requests: 3         # warmup inferences to send

# --- Redis: connection, for Redis Streams deployments ----------------------
# The analogue of kafka.bootstrap_servers, read only when a redisStream source
# or sink is selected; event_bridge and vlm_enhanced_sink may override any field
# here. Alert MS never deploys Redis — point this at an existing instance.
# redis:
#   host: "redis"
#   port: 6379
#   db: 0
#   password: ""            # omit when auth is disabled
#   maxlen: 10000           # approximate MAXLEN cap on publish
#   # What one unanswered command costs, and the unit of every worst case below:
#   # a publish spends it per attempt, shutdown spends it per stream it releases,
#   # and a readiness probe on the rebalance path spends it inside the consumer
#   # group's session window. 5s is the default; raising it above publish_budget
#   # means the budget no longer bounds a publish, and startup says so. Must stay
#   # above redis_source.consumer_config.block_time.
#   socket_timeout: 5
#   socket_connect_timeout: 5
#   # A redisStream sink is the payload's only destination, so a failed XADD is
#   # retried before the payload is dropped; drops count in
#   # alert_bridge_redis_publish_failures_total{outcome="dropped"}.
#   publish_retries: 2           # 0 disables retrying
#   publish_retry_backoff: 0.1   # seconds x attempt number
#   # Wall-clock ceiling on one publish, retries included, because a retry count
#   # alone does not bound time: each attempt can spend the whole socket timeout.
#   # Checked between attempts, so it only bounds a publish while socket_timeout
#   # is at or below it -- a warning says so at startup when it is not. 0 removes
#   # the ceiling. Also bounds the XACK retry on the read path.
#   publish_budget: 15

# Event Bridge Configuration.
# sourceType: kafka (default) | redisStream
# sinkType:   kafka (default) | redisStream | console
# The two are independent: either can use Redis Streams while the other stays
# on Kafka. This sink carries validation-error responses; VLM-enhanced results
# are published by vlm_enhanced_sink further down.
event_bridge:
  sourceType: "kafka"        # kafka | redisStream
  sinkType: "kafka"          # kafka | redisStream | console

  kafka_source:
    group_id: 'alert-bridge-vlm-group'
    topics:
      incident: 'mdx-incidents'
      alert: 'mdx-alerts'

  # MDX envelope (key/value/headers) with protobuf or JSON in `value`, as
  # vss-behavior-analytics publishes in redisStream mode.
  # redis_source:
  #   streams:
  #     incident: 'mdx-incidents'
  #     alert: 'mdx-alerts'
  #     # heartbeat: 'mdx-heartbeats'
  #   # ONE replica per consumer group, or shard by sensorId. Dedup and the
  #   # filters are in-process and assume one sensor always lands on the same
  #   # instance; XREADGROUP hands an entry to whichever consumer asks first, so
  #   # two replicas on one group split a sensor's cohort and duplicates reach
  #   # the VLM silently. To scale out, give each replica its own group over
  #   # disjoint streams, or enable
  #   # alert_agent.event_filters.protect_confirmed_verdicts.
  #   consumer_group: 'alert-bridge-vlm-group'
  #   consumer_config:
  #     count: 10             # max entries per XREADGROUP
  #     block_time: 100       # XREADGROUP BLOCK, ms
  #     start_id: '$'         # '$' = new entries only
  #     error_backoff: 1.0    # wait before retrying an unreachable broker

  # redis_sink:
  #   streams:
  #     enhanced_anomaly: 'alert-bridge-enhanced-alerts'
  #     incidents: 'alert-bridge-incidents'

  # sinkType: console logs payloads in full; `redact` masks dotted paths first.
  # console_sink:
  #   pretty: true
  #   max_chars: 0            # 0 disables truncation
  #   redact:
  #     - info.reasoning
  #     - info.videoSource

# --- Prompts: the rules that apply across all alert types ------------------
# The prompts themselves belong to each alert type: seeded from
# alert_type_config.json, editable at /api/v1/verification/config.
prompt:
  prefer_payload_prompt: false      # prefer a prompt from the payload; inert, nothing reads it
  override_prompts_on_start: true   # re-seed stored prompts from the file; false keeps API edits
  # Used when an alert type has no system prompt of its own; a stored one wins.
  # Set "" to send no system message. A key left empty (nothing after the colon)
  # fails startup rather than being guessed at; remove it to keep this default.
  default_system_prompt: "You are a helpful assistant."

# Alert Type Configuration
alert_type_config_file: "alert_type_config.json"

# --- Alert agent: concurrency, dedup, pipeline -----------------------------
alert_agent:
  # Independent pipeline processes, and the only way past ~1 core since the GIL
  # is per-process. Above 1 requires pipeline_mode: event_loop and must not
  # exceed the partitions of ANY ONE source topic — with N replicas,
  # replicas x processes <= partitions, per topic — or startup fails. Dedup
  # needs no coordination: mdx-incidents is partitioned by sensorId, so a whole
  # cohort lands on one process.
  processes: 1
  # One budget for all of startup: topic metadata, prompt seeding, VLM warmup,
  # every pipeline joining its group. Raise it when topics are created by a Job
  # racing this deployment, or when many processes build their stores at once.
  startup_timeout_seconds: 60
  num_workers: 10                # worker threads per process; the throughput knob in sync mode
  max_allowed_stream_size: 2     # reject clip windows longer than this, minutes
  default_stream_interval: 1     # clip window when the payload gives no duration, minutes
  vst_pass_through_mode: false   # use local media files instead of a VST lookup

  # In-process filtering and dedup; no external store.
  event_filters:
    dedup_ttl_seconds: 300
    # Categories whose dedup key keeps the incident end timestamp. Others omit it.
    end_time_in_dedup_key_categories: []
    # Don't re-verify an incident whose verdict is already confirmed (ES-backed).
    protect_confirmed_verdicts:
      enabled: false
      ttl_seconds: 600                          # lifetime of a confirmed marker
      es_retry_backoff_seconds: 30              # cooldown after an ES client build failure; fails open and keeps retrying
      retention_interval_seconds: 3600          # delete-by-query pass over expired markers
      retention_requests_per_second: 50         # throttle for that pass
    # Block an incident unless its end time moved by at least threshold_seconds.
    end_time_delta_filter:
      enabled: false
      threshold_seconds: 5
      ttl_seconds: 3600

  metrics:
    # Needs PROMETHEUS_METRICS_ENABLED=true. true mints ~12 extra series per
    # histogram per sensor, so only with a bounded fleet (~10k series/target).
    # Applies to Kafka metrics; on-demand HTTP metrics stay aggregate-only.
    per_sensor_labels: false
  # sync | thread_bridge | event_loop; an invalid value fails startup, and
  # async_io.pipeline_mode is accepted too. event_loop runs each message as a
  # coroutine with async clients, keeping consumption decoupled from VLM
  # latency. One throughput knob per mode:
  #   sync           num_workers
  #   thread_bridge  async_dispatch_workers
  #   event_loop     async_io.max_vlm_concurrent
  # pipeline_mode: event_loop
  async_io:
    external_timeout_seconds: 30   # per async VST/Elastic/dedup operation
    # Keep at or below the VLM backend's benchmarked concurrency ceiling (README,
    # "VLM concurrency ceiling benchmark"); past it latency balloons instead of
    # throughput rising.
    # max_vlm_concurrent: 8
    #
    # Derived unless set, and still honoured when present:
    #   async_dispatch_workers       = num_workers
    #   async_dispatch_max_in_flight = 2 x async_dispatch_workers
    #   async_io.max_vst_concurrent  = async_dispatch_workers
    #   async_io.sink_warn_in_flight = async_dispatch_max_in_flight

  # Rewrite internal media IPs to externally reachable ones for the VLM and UI.
  url_transform:
    enabled: true                                # Enable URL transformation (default: true)

  media_download:
    enabled: false               # process direct media URLs from the payload
    max_media_count: 5           # media URLs per request
    timeout_seconds: 30          # download timeout per file
    max_size_mb: 50              # size limit per file
    allow_private_urls: true     # development only — SSRF risk
    use_verdict: false           # true parses a structured verdict; false stores the raw response


  # Enrichment Processing Configuration
  enrichment:
    enabled: false                               # Master switch for enrichment processing

  # POST /api/v1/realtime/always-on. false returns 503 ALWAYS_ON_DISABLED, so
  # the feature rolls back without a code change. true validates the rules YAML
  # at ALWAYS_ON_RULES_CONFIG during boot, so a bad file fails startup instead
  # of surfacing on the first camera event.
  always_on: false

# RTVI VLM Configuration - Real-time VLM alert management
# Alert Bridge calls this service to start/stop real-time RTSP analysis
rtvi_vlm:
  base_url: "http://localhost:8018/v1"       # env: RTVI_VLM_BASE_URL
  timeout: 10                                # HTTP request timeout
  default_model: "nim_nvidia_cosmos3-nano-reasoner_bf16-final"  # must match a model RTVI VLM has loaded (GET /v1/models)
  captions_ack_timeout: 2.0                  # wait for the generate_captions HTTP ack
  # After that ack, create polls GET /streams/get-stream-info until the stream
  # id shows up or max_wait elapses — skipped when the rule reuses a registered
  # stream. Worst-case create latency is captions_ack_timeout + max_wait.
  stream_readiness_poll_interval: 0.2
  stream_readiness_max_wait: 2.0
  # stream_readiness_timeout is deprecated: warned about, then ignored.
  rules_collection: "alert-realtime-rules"   # ES collection for durable rules
  pending_ttl_seconds: 300                   # stale pending rules are cleaned at startup
  health_check_interval_seconds: 30          # RTVI /ready poll; reconciles on recovery
  # Rollback switch for realtime-rule persistence and replay: false stops
  # POST/DELETE /api/v1/realtime writing to ES and makes replay return 501.
  # Narrower than persistence.enabled, which disables every collection.
  enable_realtime_persistence: true

  # Groups repeated positives from one camera and alert type into a single
  # event. Requested per call with ?consolidate=true on
  # GET /api/v1/realtime/incidents; these keys only tune the grouping.
  consolidation:
    max_inter_alert_gap_seconds: 60    # a positive arriving later starts a new event
    max_event_duration_seconds: 300    # cap per event (null = unbounded)
    representative: "latest"           # which chunk supplies the fields: latest | longest_reasoning

# --- Webhook: fire-and-forget POST on verified incidents -------------------
# No retry, no queue, no dead-letter.
webhook:
  openclaw:
    enabled: false
    url: "http://localhost:9090/webhook/alert-notify-slack"
    topic: "mdx-vlm-incidents"             # Kafka topic consumed and forwarded
    group_id: "openclaw-webhook-group"     # its own consumer group
    timeout_seconds: 5                     # HTTP POST timeout
    max_pending: 100                       # queued deliveries before dropping

# --- HTTP API: CORS for /api/v1/... ---------------------------------------
# Wide open below, which suits local and in-cluster use; narrow allow_origins
# before exposing the API further.
cors:
  enabled: true
  allow_origins: ['*']
  allow_methods: ['*']
  allow_headers: ['*']
  allow_credentials: false

# --- Elasticsearch: verified results, configs, realtime rules -------------
# One cluster for all three, so enabled: false takes out the sinks, the config
# store and the ES-backed filters together.
elastic:
  enabled: true
  hosts:
    - http://localhost:9200

# Durable storage for what the API writes: alert configs, prompts, realtime rules.
persistence:
  enabled: true
  backend: "elasticsearch"               # only elasticsearch for now
  index_prefix: "ab-"                    # indices are ab-{collection}
  # DEV/LOCAL ONLY. With persistence.enabled false a non-dev deployment fails
  # readiness; set this to opt into the non-durable in-process store instead.
  dev_allow_in_memory: false
  # elasticsearch:                       # optional; defaults to elastic.hosts
  #   hosts:
  #     - http://localhost:9200

# --- Sinks: where verified results go -------------------------------------
# `type` picks the transport for both kinds — elastic (default) | kafka |
# redisStream | console — and is read at the top level only; nested under
# `incident:` or `alert:` it is ignored with a warning. Those blocks carry
# routing (index, stream, topic) alone.
#
# The commented blocks below are this same sink on the other transports. Swap
# one in for the active block rather than adding it alongside.
vlm_enhanced_sink:
  incident:
    elastic:
      index: "mdx-vlm-incidents"
  alert:
    elastic:
      index: "mdx-vlm-alerts"

# Redis Streams: the same protobuf in the MDX envelope, so the Logstash
# redis_stream input decodes it exactly as it does the Kafka topics. Set
# payload_format: json to publish JSON instead.
# vlm_enhanced_sink:
#   type: "redisStream"
#   redisStream:
#     host: "redis"           # optional; defaults to the top-level redis block
#     port: 6379
#   incident:
#     redisStream:
#       stream: "mdx-vlm-incidents"
#       message_type: "incident"
#       key_field: "sensorId"
#   alert:
#     redisStream:
#       stream: "mdx-vlm-alerts"
#       message_type: "alert"
#       key_field: "sensor.id"

# Console: no broker or Elasticsearch needed, for local development. Logs the
# whole document — VLM reasoning, clip URL, GPS fix — so list dotted paths in
# `redact` where the log is collected somewhere that should not hold them.
# vlm_enhanced_sink:
#   type: "console"
#   console:
#     pretty: true
#     max_chars: 0
#     redact:
#       - info.reasoning
#       - info.videoSource
#       - info.location

# Kafka: key_field is the partition key, so keep it per-sensor to preserve
# per-sensor ordering.
# vlm_enhanced_sink:
#   type: "kafka"
#   incident:
#     kafka:
#       topic: "mdx-vlm-incidents"
#       message_type: "incident"
#       key_field: "id"
#   alert:
#     kafka:
#       topic: "mdx-vlm-alerts"
#       message_type: "alert"
#       key_field: "id"

# Superseded shape: an incident-only sink. Use the `incident:` block above.
# vlm_enhanced_incident_sink:
#   type: "kafka"
#   kafka:
#     topic: "mdx-vlm-incidents"
#     message_type: "incident"
#     key_field: "id"

# --- Logging ---------------------------------------------------------------
logging:
  level: "DEBUG"                                # Log level: DEBUG, INFO, WARNING, ERROR, CRITICAL (applies to all components)
  format: "%(asctime)s - %(threadName)s - %(name)s - %(levelname)s - %(message)s"
  third_party_level: "WARNING"   # urllib3/httpcore/httpx/elasticsearch, etc.
  truncate_base64: true          # shorten base64 data URLs in logs (env: LOG_TRUNCATE_BASE64)
