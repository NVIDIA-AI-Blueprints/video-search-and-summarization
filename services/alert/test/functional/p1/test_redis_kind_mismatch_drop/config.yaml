# A payload that names the wrong kind for the stream it arrived on.
#
# The stream decides an entry's kind, and the pipeline stamps that answer over
# the payload's `notification_type` — so an entry published to the wrong stream
# is not mis-decoded, it is relabelled: verified as the kind the stream says and
# published to that kind's destination, with nothing raised anywhere. This run
# proves the source rejects the contradiction instead, and that rejecting it does
# not disturb the well-formed alert published alongside it.
#
# The consumer group and the streams are this test's own, so a drop counted here
# cannot have come from an entry another test left behind.
#
# Kafka is left out of the event bridge entirely, so nothing here can pass by
# falling back to the default transport.

ALERT_REVIEW_MEDIA_BASE_DIR: ""

vst_config:
  base_url: "http://127.0.0.1:30888"
  sensor_list_endpoint: "/vst/api/v1/live/streams"
  segment_anchor: "end"
  segment_duration_seconds: 10
  add_overlay: false
  storage:
    base_url: "http://127.0.0.1:30888"
    media_file_path_by_id_endpoint: "/api/v1/storage/file/path"

redis:
  host: "127.0.0.1"
  port: 6379
  db: 0
  # Left unset deliberately: trimming is opt-in, and this test asserts the
  # input stream still holds its entry after consumption.

vlm:
  base_url: "http://127.0.0.1:18081/v1"
  model: "nvidia/cosmos-reason2-8b"
  max_tokens: 256
  min_pixels: 1568
  max_pixels: 345600
  num_frames: 18
  enable_sampling: false
  sampling_fps: 4

event_bridge:
  sourceType: "redisStream"
  sinkType: "redisStream"

  redis_source:
    streams:
      incident: "mdx-incidents-km"
      alert: "mdx-alerts-km"
    consumer_group: "alert-bridge-vlm-group-p1-kind-mismatch"
    consumer_config:
      count: 10
      block_time: 100
      start_id: "0-0"

  redis_sink:
    streams:
      enhanced_anomaly: "alert-bridge-enhanced-alerts-km"
      incidents: "alert-bridge-incidents-km"

prompt:
  prefer_payload_prompt: true
  override_prompts_on_start: true

alert_type_config_file: "alert_type_config.json"

alert_agent:
  num_workers: 1
  max_allowed_stream_size: 2
  default_stream_interval: 1
  vst_pass_through_mode: false
  chunk_size: 1
  event_filters:
    dedup_ttl_seconds: 3
    end_time_in_dedup_key_categories: []
    protect_confirmed_verdicts:
      enabled: false
      ttl_seconds: 600

elastic:
  enabled: true
  hosts:
    - http://127.0.0.1:9200
  index_name: "mdx-vlm-incidents"

vlm_enhanced_sink:
  type: "redisStream"
  incident:
    redisStream:
      stream: "mdx-vlm-incidents-km"
      message_type: "incident"
      key_field: "sensorId"
  alert:
    redisStream:
      stream: "mdx-vlm-alerts-km"
      message_type: "alert"
      key_field: "sensor.id"

logging:
  level: "DEBUG"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  third_party_level: "WARNING"
