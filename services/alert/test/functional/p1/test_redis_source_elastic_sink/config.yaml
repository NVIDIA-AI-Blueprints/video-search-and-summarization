# Redis Streams source with the default Elasticsearch terminal sink.
#
# The other redisStream tests all end in a Redis stream, which leaves the most
# likely real deployment untested: an existing Elasticsearch-based install that
# only swaps its input transport. It is also the combination where a coupling
# bug would hide, because both directions still "work" if the source and sink
# selections leak into each other -- the documents just come out of the wrong
# place.
#
# sinkType is left at its kafka default on purpose. That is what an operator
# who sets only sourceType gets, so the startup warning about split transports
# is exercised by the configuration a real upgrade produces.

ALERT_REVIEW_MEDIA_BASE_DIR: ""

vst_config:
  base_url: "http://127.0.0.1:30888"
  sensor_list_endpoint: "/vst/api/v1/live/streams"
  segment_anchor: "end"
  segment_duration_seconds: 10
  add_overlay: false
  storage:
    base_url: "http://127.0.0.1:30888"
    media_file_path_by_id_endpoint: "/api/v1/storage/file/path"

kafka:
  bootstrap_servers: "127.0.0.1:9092"
  group_id: "alert-bridge-p1-redis-elastic"
  poll_timeout: 5
  message_type: "Incident"

redis:
  host: "127.0.0.1"
  port: 6379
  db: 0

vlm:
  base_url: "http://127.0.0.1:18081/v1"
  model: "nvidia/cosmos-reason2-8b"
  max_tokens: 256
  min_pixels: 1568
  max_pixels: 345600
  num_frames: 18
  enable_sampling: false
  sampling_fps: 4

event_bridge:
  sourceType: "redisStream"
  # sinkType intentionally unset — it defaults to kafka, which is the split
  # this deployment shape produces and which startup is expected to name.

  redis_source:
    streams:
      incident: "mdx-incidents"
      alert: "mdx-alerts"
    consumer_group: "alert-bridge-vlm-group-p1-redis-elastic"
    consumer_config:
      count: 10
      block_time: 100
      start_id: "0-0"

  kafka_sink:
    topics:
      enhanced_anomaly: "alert-bridge-enhanced-alerts"
      incidents: "alert-bridge-incidents"

prompt:
  prefer_payload_prompt: true
  override_prompts_on_start: true

alert_type_config_file: "alert_type_config.json"

alert_agent:
  num_workers: 1
  max_allowed_stream_size: 2
  default_stream_interval: 1
  vst_pass_through_mode: false
  chunk_size: 1
  event_filters:
    dedup_ttl_seconds: 3
    end_time_in_dedup_key_categories: []
    protect_confirmed_verdicts:
      enabled: false
      ttl_seconds: 600

elastic:
  enabled: true
  hosts:
    - http://127.0.0.1:9200
  index_name: "mdx-vlm-incidents"

# The default terminal sink. Named explicitly rather than left to the default
# so the test reads as the deliberate pairing it is.
#
# The per-kind index blocks are required, not decoration: VLMEnhancedElasticSink
# reads an index per kind and has no fallback, so `type` on its own raised
# "Missing required configuration: vlm_enhanced_sink.incident.elastic.index"
# inside the pipeline child and this test never had an Alert Bridge to poll.
# This is the shape the shipped Compose and Helm configs render.
vlm_enhanced_sink:
  type: "elastic"
  incident:
    elastic:
      index: "mdx-vlm-incidents"
  alert:
    elastic:
      index: "mdx-vlm-alerts"

logging:
  level: "DEBUG"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  third_party_level: "WARNING"
