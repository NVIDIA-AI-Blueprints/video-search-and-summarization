#
# Config for test_multi_consumer_dedup: two Alert MS instances in ONE consumer
# group consume a MULTI-PARTITION incident topic. Validates the post-Redis
# assumption that in-process dedup stays correct across a multi-container fleet
# because the producer keys records by sensorId (the partition-key contract).
#
# Differences from shared/config_base.yaml:
#   - kafka_source.topics.incident -> mdx-incidents-mc (2 partitions, created in
#     run_p1.sh Phase 1)
#   - kafka_source.group_id       -> dedicated group so both instances co-consume
#   - event_filters.dedup_ttl_seconds -> 60 (long enough that duplicates sent
#     within the test window are caught in-process; base is 3s)

ALERT_REVIEW_MEDIA_BASE_DIR: ""

vst_config:
  base_url: "http://127.0.0.1:30888"
  sensor_list_endpoint: "/vst/api/v1/live/streams"
  segment_anchor: "end"
  segment_duration_seconds: 10
  add_overlay: false
  storage:
    base_url: "http://127.0.0.1:30888"
    media_file_path_by_id_endpoint: "/api/v1/storage/file/path"

kafka:
  bootstrap_servers: "127.0.0.1:9092"
  group_id: "kafka-p1-functional"
  anomalyTopic: "mdx-incidents-mc"
  enhanced_anomaly_topic: "alert-bridge-enhanced-alerts"
  incidents_topic: "alert-bridge-incidents"
  max_poll_records: 1
  auto_offset_reset: "latest"
  enable_auto_commit: false
  max_poll_interval_ms: 300000
  poll_timeout: 500
  message_type: "Incident"
  session_timeout_ms: 10000
  heartbeat_interval_ms: 3000

vlm:
  base_url: "http://127.0.0.1:18081/v1"
  model: "nvidia/cosmos-reason2-8b"
  max_tokens: 256
  min_pixels: 1568
  max_pixels: 345600
  num_frames: 18
  enable_sampling: false
  sampling_fps: 4

event_bridge:
  sourceType: "kafka"
  sinkType: "kafka"

  kafka_source:
    group_id: "alert-bridge-mc-group"
    topics:
      incident: "mdx-incidents-mc"
      alert: "mdx-alerts"

  kafka_sink:
    topics:
      enhanced_anomaly: "alert-bridge-enhanced-alerts"
      incidents: "alert-bridge-incidents"

prompt:
  prefer_payload_prompt: true
  override_prompts_on_start: true

alert_type_config_file: "alert_type_config.json"

alert_agent:
  num_workers: 1
  max_allowed_stream_size: 2
  default_stream_interval: 1
  vst_pass_through_mode: false
  event_filters:
    dedup_ttl_seconds: 60
    end_time_in_dedup_key_categories: []
    protect_confirmed_verdicts:
      enabled: false
      ttl_seconds: 600

elastic:
  enabled: true
  hosts:
    - http://127.0.0.1:9200
  index_name: "mdx-vlm-incidents"

vlm_enhanced_sink:
  incident:
    type: "elastic"
    elastic:
      index: "mdx-vlm-incidents"
  alert:
    type: "elastic"
    elastic:
      index: "mdx-vlm-alerts"

logging:
  level: "DEBUG"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  third_party_level: "WARNING"
