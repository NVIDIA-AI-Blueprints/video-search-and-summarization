# Alert Request Defaults
#
# Default values applied to fields an alert request entity omits: VLM sampling
# parameters and optional top-level request fields.
#
# Scope: this feeds the request-entity validator, which the verification
# pipeline does not call -- editing it does not change how a deployment
# verifies. Live verification reads the vlm section of config.yaml and the
# per-alert-type config served from Elasticsearch
# (PUT /api/v1/verification/config/{alert_type}). See
# src/schemas/config/README.md.

# Schema version and metadata
schema:
  version: "2.0.0"
  last_updated: "2026-09-07"
  description: "Request defaults for Alert Bridge VLM verification"

# VLM (Vision-Language Model) Parameter Defaults
vlm_params:
  prompt: null
  system_prompt: null
  response_format:
    type: "text"
  max_tokens: 512
  temperature: 0.2
  top_p: 1.0
  top_k: 100
  seed: 10

# Top-level request field defaults (optional fields only).
# Only confidence, meta_labels and cv_metadata_path are read; stream_name is
# carried for compatibility with older files and has no default applied.
request_defaults:
  confidence: 0.92
  meta_labels: []
  stream_name: null
  cv_metadata_path: null

# Validation configuration. Loaded but not consumed by the current runtime --
# required-field enforcement lives in the Pydantic request models. Retained so
# an existing file keeps loading.
validation:
  continue_on_validation_error: true
  max_validation_errors_per_batch: 10
  log_validation_stats: true
  log_applied_defaults: false

# Constraint definitions (used for validation)
constraints: {}

# Field validation rules. Inert for the same reason as the validation block
# above; the authoritative list is in src/schemas/request_entity/models/.
field_validation:
  required_fields:
    - id
    - version
    - "@timestamp"
    - sensor_id
    - video_path
    - alert
    - event
  required_nested_fields:
    alert:
      - severity
      - status
      - type
      - description
    event:
      - type
      - description
