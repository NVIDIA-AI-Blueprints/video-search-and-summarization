# =============================================================================
# latency-eval-profile.yaml
#
# Blueprint-configurator YAML equivalent of latency-eval-updates.sh
# (commit 7044ea70: "Update variables for latency focused tests")
#
# Usage:
#   PROFILE_CONFIG_FILE=/path/to/latency-eval-profile.yaml
#   HARDWARE_PROFILE=default
#   DEPLOYMENT_MODES_ENABLED=false
#   ENABLE_PROFILE_CONFIGURATOR=true
#
# The BLUEPRINTS_DIR variable should point to the met-blueprints repo root, e.g.:
#   BLUEPRINTS_DIR=/workspace/met-blueprints
# =============================================================================

commons:

  variables:
    - vst_max_devices_supported: "max(16, ${NUM_SENSORS})"

  file_operations:

    # ------------------------------------------------------------------
    # 1/10 deployments/dev-profile.sh
    #       RTVI_VLM_INPUT_WIDTH: 860 -> 600
    #       RTVI_VLM_INPUT_HEIGHT: 467 -> 330
    #       Override hardcoded RTVI VLM model variant
    # ------------------------------------------------------------------
    - operation_type: text_replace
      target_file: "${BLUEPRINTS_DIR}/deploy/docker/scripts/dev-profile.sh"
      backup: false
      operations:
        - action: replace
          pattern: 'set_env_var "RTVI_VLM_INPUT_WIDTH" "860"'
          replacement: 'set_env_var "RTVI_VLM_INPUT_WIDTH" "600"'
        - action: replace
          pattern: 'set_env_var "RTVI_VLM_INPUT_HEIGHT" "467"'
          replacement: 'set_env_var "RTVI_VLM_INPUT_HEIGHT" "330"'
        - action: replace
          pattern: 'set_env_var "RTVI_VLM_MODEL_PATH" "ngc:nim/nvidia/cosmos-reason2-8b:hf-1208"'
          replacement: 'set_env_var "RTVI_VLM_MODEL_PATH" "ngc:nim/nvidia/cosmos-reason2-8b:0303-fp8-dynamic-kv8"'
        - action: replace
          pattern: 'set_env_var "VLM_NAME" "nim_nvidia_cosmos-reason2-8b_hf-1208"'
          replacement: 'set_env_var "VLM_NAME" "nim_nvidia_cosmos-reason2-8b_0303-fp8-dynamic-kv8"'

    # ------------------------------------------------------------------
    # 2/10 EDGE-LOCAL-VLM-config.yml
    #       poll_timeout: 5 -> 2, max_pixels: 8388608 -> 1960000
    #       num_workers: 10 -> 30, include_latency_info: false -> true
    # ------------------------------------------------------------------
    - operation_type: yaml_update
      target_file: "${BLUEPRINTS_DIR}/deploy/docker/developer-profiles/dev-profile-alerts/vlm-as-verifier/configs/EDGE-LOCAL-VLM-config.yml"
      backup: false
      boolean_style: yaml
      list_style: keep
      updates:
        kafka.poll_timeout: 2
        vlm.max_pixels: 1960000
        vlm.request_timeout: 600
        alert_agent.num_workers: ${ALERT_BRIDGE_NUM_WORKERS}
        alert_agent.include_latency_info: true
        alert_agent.metrics.per_sensor_labels: true

    # ------------------------------------------------------------------
    # 3/10 config.yml
    # ------------------------------------------------------------------
    - operation_type: yaml_update
      target_file: "${BLUEPRINTS_DIR}/deploy/docker/developer-profiles/dev-profile-alerts/vlm-as-verifier/configs/config.yml"
      backup: false
      boolean_style: yaml
      list_style: keep
      updates:
        kafka.poll_timeout: 2
        vlm.max_pixels: 1960000
        vlm.request_timeout: 600
        alert_agent.num_workers: ${ALERT_BRIDGE_NUM_WORKERS}
        alert_agent.include_latency_info: true
        alert_agent.metrics.per_sensor_labels: true

    # ------------------------------------------------------------------
    # 4/10 vst_config.json
    #       Disable sensor NTP timestamps and scale ONVIF sensor capacity
    # ------------------------------------------------------------------
    - operation_type: json_update
      target_file: "${BLUEPRINTS_DIR}/deploy/docker/services/vios/configs/vst_config.json"
      backup: false
      updates:
        network.use_sensor_ntp_time: false
        onvif.max_devices_supported: ${vst_max_devices_supported}

    # ------------------------------------------------------------------
    # 5/10 rtvi-cv/compose.yaml
    #       Reduce SDR add-call delay and raise perception nofile limit
    # ------------------------------------------------------------------
    - operation_type: text_replace
      target_file: "${BLUEPRINTS_DIR}/deploy/docker/services/rtvi/rtvi-cv/compose.yaml"
      backup: false
      operations:
        - action: replace
          pattern: "WDM_ADD_CALL_DELAY: 10"
          replacement: "WDM_ADD_CALL_DELAY: 1"
        - action: insert_after
          pattern: "container_name: vss-rtvi-cv"
          lines:
            - "    ulimits:"
            - "      nofile:"
            - "        soft: 100000"
            - "        hard: 100000"

    # ------------------------------------------------------------------
    # 6/10 rtvi-vlm-docker-compose.yml
    #        Comment out existing env vars, then insert hardcoded replacements
    # ------------------------------------------------------------------
    - operation_type: text_replace
      target_file: "${BLUEPRINTS_DIR}/deploy/docker/services/rtvi/rtvi-vlm/rtvi-vlm-docker-compose.yml"
      backup: false
      operations:
        - action: comment_line
          pattern: 'VLM_BATCH_SIZE: "${RTVI_VLM_BATCH_SIZE:-}"'
          marker: "# "
        - action: comment_line
          pattern: 'VLLM_NUM_SCHEDULER_STEPS: "${RTVI_VLLM_NUM_SCHEDULER_STEPS:-8}"'
          marker: "# "
        - action: comment_line
          pattern: 'VLLM_ENABLE_PREFIX_CACHING: "${RTVI_VLLM_ENABLE_PREFIX_CACHING:-false}"'
          marker: "# "
        - action: comment_line
          pattern: 'VLLM_DISABLE_MM_PREPROCESSOR_CACHE: "${RTVI_VLLM_DISABLE_MM_PREPROCESSOR_CACHE:-true}"'
          marker: "# "
        - action: comment_line
          pattern: 'VLLM_MM_PROCESSOR_CACHE_GB: "\${RTVI_VLLM_MM_PROCESSOR_CACHE_GB:-[01]}"'
          regex: true
          marker: "# "
        - action: comment_line
          pattern: 'VSS_SKIP_INPUT_MEDIA_VERIFICATION: "${VSS_SKIP_INPUT_MEDIA_VERIFICATION:-}"'
          marker: "# "
        - action: comment_line
          pattern: 'RTVI_ADD_TIMESTAMP_TO_VLM_PROMPT: "${RTVI_ADD_TIMESTAMP_TO_VLM_PROMPT:-}"'
          marker: "# "
        - action: insert_after
          pattern: "RTVI_ADD_TIMESTAMP_TO_VLM_PROMPT"
          lines:
            - ""
            - "      VLLM_ENABLE_PREFIX_CACHING: false"
            - "      VLLM_DISABLE_MM_PREPROCESSOR_CACHE: true"
            - "      VLLM_MM_PROCESSOR_CACHE_GB: 0"
            - "      RTVI_ADD_TIMESTAMP_TO_VLM_PROMPT: false"
            - "      VLM_BATCH_SIZE: 32 # required for concurrent requests"
            - "      VSS_SKIP_INPUT_MEDIA_VERIFICATION: 1"
            - "      VLLM_NUM_SCHEDULER_STEPS: 8"
            - "      VLLM_WORKER_MULTIPROC_METHOD: spawn"

    # ------------------------------------------------------------------
    # 7/10 dev-profile-alerts/.env
    #        Use latency eval RTVI VLM model variant
    # ------------------------------------------------------------------
    - operation_type: text_replace
      target_file: "${BLUEPRINTS_DIR}/deploy/docker/developer-profiles/dev-profile-alerts/.env"
      backup: false
      operations:
        - action: replace
          pattern: "VLM_NAME=nim_nvidia_cosmos-reason2-8b_hf-1208"
          replacement: 'VLM_NAME="nim_nvidia_cosmos-reason2-8b_0303-fp8-dynamic-kv8"'
        - action: replace
          pattern: "RTVI_VLM_MODEL_PATH='ngc:nim/nvidia/cosmos-reason2-8b:hf-1208'"
          replacement: 'RTVI_VLM_MODEL_PATH="ngc:nim/nvidia/cosmos-reason2-8b:0303-fp8-dynamic-kv8"'

    # ------------------------------------------------------------------
    # 8/10 dev-profile-alerts/compose.yml
    #        Add ulimits for perception-alerts (commit a039a11c)
    # ------------------------------------------------------------------
    - operation_type: text_replace
      target_file: "${BLUEPRINTS_DIR}/deploy/docker/developer-profiles/dev-profile-alerts/compose.yml"
      backup: false
      operations:
        - action: insert_after
          pattern: "container_name: perception-alerts"
          lines:
            - "    ulimits:"
            - "      nofile:"
            - "        soft: 100000"
            - "        hard: 100000"

    # ------------------------------------------------------------------
    # 9/10 run_config-api-rtdetr-protobuf.txt
    #        Enable low-latency mode and set RTP protocol for RTSP sources
    # ------------------------------------------------------------------
    - operation_type: text_replace
      target_file: "${BLUEPRINTS_DIR}/deploy/docker/developer-profiles/dev-profile-alerts/deepstream/configs/run_config-api-rtdetr-protobuf.txt"
      backup: false
      operations:
        - action: insert_after
          pattern: "sei-uuid=NVDS_CUSTOMMETA"
          lines:
            - "low-latency-mode=1"
        - action: insert_after
          pattern: "rtsp-reconnect-interval-sec=60"
          lines:
            - "set-rtp-protocol=7"

    # ------------------------------------------------------------------
    # 10/10 services/alert/compose.yml
    #        Enable Alert Agent Prometheus endpoint for latency runs
    # ------------------------------------------------------------------
    - operation_type: text_replace
      target_file: "${BLUEPRINTS_DIR}/deploy/docker/services/alert/compose.yml"
      backup: false
      operations:
        - action: insert_after
          pattern: '      - ${ALERT_BRIDGE_HOST_PORT:-9080}:${ALERT_BRIDGE_PORT:-9080}'
          lines:
            - '      - ${ALERT_BRIDGE_PROMETHEUS_HOST_PORT:-9081}:9081'
        - action: insert_after
          pattern: "      VLM_NAME: ${VLM_NAME}"
          lines:
            - "      PROMETHEUS_METRICS_ENABLED: true"
            - "      PROMETHEUS_PORT: 9081"
