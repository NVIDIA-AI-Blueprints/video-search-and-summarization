# Trigger config for EVAL_TYPE=latency
# Loaded when run_eval.sh is run with --eval-type latency (or EVAL_TYPE=latency).
# Uses on_startup trigger: wait wait_period, then run AB evaluation once.

version: 1

evaluators:
  - name: "on_startup_ab_eval"
    description: "Run AB evaluation on service startup after a delay (For latency evaluation)"
    enabled: true
    triggers:
      - name: "startup_trigger"
        type: "on_startup"
        config:
          wait_period: "${LATENCY_DURATION}"  # ES time notation: 5m, 10m, 1h, 2d
          nvstreamer_config:
            vst_url: "${VST_BASE_URL}"
            nvstreamer_url: "${NVSTREAMER_BASE_URL}"
            data_fetch_retry_interval: 30
            data_fetch_retry_limit: 120
    actions:
      - name: "run_ab_evaluation"
        type: call_alert_bridge_evaluator
        ab_evaluator_config:
          evaluator_url: "${ALERT_BRIDGE_EVALUATOR_URL}"
          eval_endpoint: "/eval/v2/batch"
          job_id: "${JOB_ID}"
          category: "${ALERT_CATEGORY}"
          timeout: 60
          wait_for_results: true
    monitor:
      enabled: true
      api_config:
        endpoint: "http://localhost:${ALERT_BRIDGE_EVALUATOR_PORT}/eval/${JOB_ID}"
        method: "GET"
        poll_interval: 5
        max_poll_attempts: 30
        timeout: 10
      success_conditions:
        - type: "http_status_code"
          operator: "equals"
          value: 200
        - type: "http_body_field"
          field: "status"
          operator: "equals"
          value: "completed"
      failure_conditions:
        - type: "http_body_field"
          field: "status"
          operator: "equals_one_of"
          value: ["error", "failed"]
      running_conditions:
        - type: "http_status_code"
          operator: "equals"
          value: 200
        - type: "http_body_field"
          field: "status"
          operator: "equals_one_of"
          value: ["running", "pending"]
