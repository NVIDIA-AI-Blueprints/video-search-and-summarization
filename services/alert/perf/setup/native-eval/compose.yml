# Must match COMPOSE_PROJECT in eval/scripts/_lib/_config.py and CI
# --project vss filters (collect_logs / check_containers / compose_progress).
# Without this, compose defaults to the directory name ("eval") and those
# filters find nothing — collect_logs then exits 1 and aborts the job before
# integration/UI tests.
name: vss

services:
  init-config-manager:
    profiles: ["latency-init"]
    image: nvcr.io/nv-metropolis-dev/metropolis-analytic/vss-configurator:nightly-20260906
    container_name: init-config-manager
    network_mode: "host"
    user: "${DOCKER_UID}:${DOCKER_GID}"
    environment:
      ENABLE_PROFILE_CONFIGURATOR: true
      ENABLE_SENSOR_CONFIGURATOR: false
      DEPLOYMENT_MODES_ENABLED: false
      PROFILE_CONFIG_FILE: $CI_VSS_OSS_DIR/eval/configs/bp_config_latency.yaml
      HARDWARE_PROFILE: ${HARDWARE_PROFILE:-RTXPRO6000BW}
      CI_VSS_OSS_DIR: $CI_VSS_OSS_DIR
    volumes:
      - ${CI_VSS_OSS_DIR}:${CI_VSS_OSS_DIR}:rw
  bp-configurator-init:
    container_name: bp-configurator-init
    image: curlimages/curl:latest
    network_mode: "host"
    environment:
      ENABLE_NVSTREAMER_VIDEO_UPLOAD: ${ENABLE_NVSTREAMER_VIDEO_UPLOAD:-false}
      ENABLE_VMS_VIDEO_UPLOAD: ${ENABLE_VMS_VIDEO_UPLOAD:-false}
      ALERTS_MODE: ${ALERTS_MODE:-}
      NVSTREAMER_STREAMS_URL: ${NVSTREAMER_STREAMS_URL:-http://localhost:31000/api/v1/sensor/streams}
      VMS_SENSOR_STATUS_URL: ${VMS_SENSOR_STATUS_URL:-http://localhost:30888/vst/api/v1/sensor/status}
      RTVI_CV_READY_URL: ${RTVI_CV_READY_URL:-http://localhost:9010/api/v1/live}
      INIT_WAIT_TIMEOUT_SEC: ${INIT_WAIT_TIMEOUT_SEC:-3600}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        timeout_sec=$${INIT_WAIT_TIMEOUT_SEC:-3600}
        poll=5
        start=$$(date +%s)
        iter=0
        if [ "$${ENABLE_NVSTREAMER_VIDEO_UPLOAD}" = "true" ]; then
          echo "Waiting for nvstreamer ($${NVSTREAMER_STREAMS_URL}) to be ready (timeout=$${timeout_sec}s)..."
        fi
        if [ "$${ENABLE_VMS_VIDEO_UPLOAD}" = "true" ]; then
          echo "Waiting for vst ($${VMS_SENSOR_STATUS_URL}) to be ready (timeout=$${timeout_sec}s)..."
        fi
        alerts_mode_lc="$$(printf '%s' "$${ALERTS_MODE:-}" | tr '[:upper:]' '[:lower:]')"
        if [ "$$alerts_mode_lc" = "verification" ]; then
          echo "Waiting for rtvi-cv ($${RTVI_CV_READY_URL}) to report liveness (timeout=$${timeout_sec}s)..."
        fi
        ready=0
        while [ $$ready -eq 0 ]; do
          iter=$$((iter + 1))
          elapsed=$$(($$(date +%s) - start))
          if [ $$elapsed -ge $$timeout_sec ]; then
            echo "[bp-configurator-init] TIMEOUT after $${timeout_sec}s — last probe: nvst=$${nvst_ok:-?} vst=$${vst_ok:-?} rtvi_cv=$${rtvi_cv_ok:-?}"
            exit 1
          fi
          if [ $$((iter % 12)) -eq 0 ]; then
            echo "[bp-configurator-init] +$${elapsed}s still waiting (nvst/vst/rtvi-cv readiness)..."
          fi
          nvst_ok="200"
          vst_ok="200"
          rtvi_cv_ok="200"
          if [ "$${ENABLE_NVSTREAMER_VIDEO_UPLOAD}" = "true" ]; then
            nvst_ok="$$(curl -s -o /dev/null -w '%{http_code}' "$${NVSTREAMER_STREAMS_URL}")"
          fi
          if [ "$${ENABLE_VMS_VIDEO_UPLOAD}" = "true" ]; then
            vst_ok="$$(curl -s -o /dev/null -w '%{http_code}' "$${VMS_SENSOR_STATUS_URL}")"
          fi
          if [ "$$alerts_mode_lc" = "verification" ]; then
            rtvi_cv_response="$$(curl -s "$${RTVI_CV_READY_URL}" || true)"
            if printf '%s' "$$rtvi_cv_response" | grep -q '"ds-liveness"[[:space:]]*:[[:space:]]*"YES"' && printf '%s' "$$rtvi_cv_response" | grep -q '"status"[[:space:]]*:[[:space:]]*"HTTP/1.1 200 OK"'; then
              rtvi_cv_ok="200"
            else
              rtvi_cv_ok="000"
            fi
          fi
          if [ "$$nvst_ok" = "200" ] && [ "$$vst_ok" = "200" ] && [ "$$rtvi_cv_ok" = "200" ]; then
            ready=1
          else
            sleep $$poll
          fi
        done
        echo "[bp-configurator-init] Services are ready after $$(($$(date +%s) - start))s"

    restart: "no"
  bp-configurator:
    image: nvcr.io/nv-metropolis-dev/metropolis-analytic/vss-configurator:nightly-20260906
    container_name: bp-configurator
    network_mode: "host"
    user: "${DOCKER_UID}:${DOCKER_GID}"
    environment:
      SENSOR_INFO_SOURCE: ${SENSOR_INFO_SOURCE:-nvstreamer}
      ENABLE_PROFILE_CONFIGURATOR: false
      ENABLE_SENSOR_CONFIGURATOR: ${ENABLE_SENSOR_CONFIGURATOR}
      ENABLE_REDIS_DUPLICATOR_THREAD: false
      ENABLE_CALIBRATION_PROCESS: false
      SEND_CONFIG_TO_SDR: ${SEND_CONFIG_TO_SDR} # true for alerts profile, false for search/base (set by run_eval.sh from BLUEPRINT)
      CALL_SENSOR_ADD_API: ${CALL_SENSOR_ADD_API}
      ENABLE_NVSTREAMER_VIDEO_UPLOAD: ${ENABLE_NVSTREAMER_VIDEO_UPLOAD}
      VIDEO_UPLOAD_DELAY: ${VIDEO_UPLOAD_DELAY:-1} # 1 second delay between subsequent video uploads to nvstreamer
      ENABLE_VMS_VIDEO_UPLOAD: ${ENABLE_VMS_VIDEO_UPLOAD}
      DEPLOYMENT_MODES_ENABLED: false
      VIDEO_SOURCE_DIR: /opt/data/videos
      NVSTREAMER_UPLOAD_BASE_URL: ${NVSTREAMER_UPLOAD_BASE_URL:-http://localhost:31000}
      VMS_UPLOAD_BASE_URL: ${VMS_UPLOAD_BASE_URL:-http://localhost:30888}
      PROFILE_CONFIG_FILE: $CI_VSS_OSS_DIR/eval/configs/bp_config.yml
      HARDWARE_PROFILE: ${HARDWARE_PROFILE:-RTXPRO6000BW}
      LOG_LEVEL: DEBUG
      NVSTREAMER_STREAMS_ENDPOINT: ${NVSTREAMER_STREAMS_ENDPOINT:-http://localhost:31000/api/v1/sensor/streams}
      NVSTREAMER_SENSOR_STATUS_ENDPOINT: ${NVSTREAMER_SENSOR_STATUS_ENDPOINT:-http://localhost:31000/api/v1/sensor/status}
      VST_CAMERA_ADD_ENDPOINT: ${VST_CAMERA_ADD_ENDPOINT:-http://localhost:30888/vst/api/v1/sensor/add}
      PORT: ${BLUEPRINT_CONFIGURATOR_PORT:-5001}
      WDM_KFK_MSG_KEY: vst.event
      WDM_KFK_BOOTSTRAP_URL: localhost:9092
      WDM_KFK_TOPIC: mdx-notification
      WDM_WL_ID_FIELD: camera_id
      WDM_WL_EVENT_FIELD: event
      CI_VSS_OSS_DIR: ${CI_VSS_OSS_DIR}
    volumes:
      # - $MDX_SAMPLE_APPS_DIR:$MDX_SAMPLE_APPS_DIR:rw
      - $EVAL_VIDEOS_PATH:/opt/data/videos # TODO: Update this once the video source is moved to the correct location
      - ${CI_VSS_OSS_DIR}:${CI_VSS_OSS_DIR}:rw

    depends_on:
      bp-configurator-init:
        condition: service_completed_successfully

  # Init container: Ensures reports directory has correct permissions (alerts profile only)
  alert-bridge-evaluator-init:
    profiles: ["alerts"]
    image: busybox:latest
    container_name: alert-bridge-evaluator-init
    # Container runs as nonroot user 65532:65532 (from distroless image)
    command: ["sh", "-c", "mkdir -p /app/reports && chown 65532:${DOCKER_GID:-65532} /app/reports && chmod 2775 /app/reports"]
    volumes:
      - ${EVAL_RESULT_DIR_PATH:-./eval_results}:/app/reports
    restart: "no"

  alert-bridge-evaluator:
    profiles: ["alerts"]
    image: nvcr.io/nv-metropolis-dev/metropolis-analytic/alert-bridge-evaluator:2026.09.22
    # image: ab_eval:test2
    container_name: vss-alert-bridge-evaluator
    # ports:
    #   - "${PORT:-5001}:5001"
    environment:
      - GT_FILE_PATH=/app/gt.json
      - REPORTS_DIR=/app/reports
      - REPORTS_DIRECTORY=/app/reports
      - PORT=${ALERT_BRIDGE_EVALUATOR_PORT:-5002}
      - DEBUG=true
      - HARDWARE_PROFILE=${HARDWARE_PROFILE:-RTXPRO6000BW}
      - PLATFORM=${HARDWARE_PROFILE:-RTXPRO6000BW}
      - MODEL=${MODEL_NAME_2D:-GDINO}
      - SETUP_INDEXED_AT=${SETUP_INDEXED_AT:-true}
      - LATENCY_DURATION=${LATENCY_DURATION:-10m}
      - EVAL_MODE=${EVAL_TYPE:-latency}
      - EVAL_WORKFLOW=${ALERTS_MODE:-verification}
      - ALERT_CATEGORY=${ALERT_CATEGORY:-FOV Count Violation}
      - ALERT_BRIDGE_INCIDENT_CATEGORY=${ALERT_CATEGORY:-FOV Count Violation}
      - SYNTHETIC_ALERTS_INJECTION=${SYNTHETIC_ALERTS_INJECTION:-false}
      - SYNTHETIC_ALERTS_PER_MINUTE=${SYNTHETIC_ALERTS_PER_MINUTE:-}
      - SYNTHETIC_ALERT_EVENT_DURATION_MS=${SYNTHETIC_ALERT_EVENT_DURATION_MS:-30000}
      - ALERT_BRIDGE_SYNTHETIC_SUBMISSION_MODE=${ALERT_BRIDGE_SYNTHETIC_SUBMISSION_MODE:-message_bus}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-localhost:9092}
      - KAFKA_INCIDENT_TOPIC=${KAFKA_INCIDENT_TOPIC:-mdx-incidents}
      - KAFKA_ALERT_TOPIC=${KAFKA_ALERT_TOPIC:-mdx-alerts}
      - KAFKA_VLM_TOPIC=${KAFKA_VLM_TOPIC:-mdx-vlm-incidents}
      - AUTO_SEED_AB=${AUTO_SEED_AB:-false}
      - MEDIA_BASE_URL=${MEDIA_BASE_URL:-http://127.0.0.1:30888/vst/sim/media}
      - VST_BASE_URL=${ALERT_BRIDGE_EVALUATOR_VST_BASE_URL:-}
      - VST_MEDIA_EXPIRY_MINUTES=${VST_MEDIA_EXPIRY_MINUTES:-60}
      - VST_MEDIA_WINDOW_SECONDS=${VST_MEDIA_WINDOW_SECONDS:-30}
      - VST_MEDIA_DISABLE_AUDIO=${VST_MEDIA_DISABLE_AUDIO:-false}
      - VST_MEDIA_TIMEOUT=${VST_MEDIA_TIMEOUT:-30}
      - VST_SENSOR_READY_TIMEOUT_SECONDS=${VST_SENSOR_READY_TIMEOUT_SECONDS:-900}
      - VST_SENSOR_READY_POLL_SECONDS=${VST_SENSOR_READY_POLL_SECONDS:-5}
      - VST_REQUIRE_TIMELINES=${VST_REQUIRE_TIMELINES:-true}
      - DATA_SOURCE=${ALERT_BRIDGE_EVALUATOR_DATA_SOURCE:-prometheus}
      - ALERT_BRIDGE_EVALUATOR_METRIC_PROFILE=${ALERT_BRIDGE_EVALUATOR_METRIC_PROFILE:-realtime}
      - PROMETHEUS_HOST=${ALERT_BRIDGE_EVALUATOR_PROMETHEUS_HOST:-localhost}
      - PROMETHEUS_PORT=${ALERT_BRIDGE_EVALUATOR_PROMETHEUS_PORT:-9090}
      - PROMETHEUS_TIMEOUT=${ALERT_BRIDGE_EVALUATOR_PROMETHEUS_TIMEOUT:-30}
      - PROMETHEUS_SUMMARY_BUFFER_SECONDS=${ALERT_BRIDGE_EVALUATOR_PROMETHEUS_SUMMARY_BUFFER_SECONDS:-0}
      - SYNTHETIC_E2E_MIN_COVERAGE_RATIO=${SYNTHETIC_E2E_MIN_COVERAGE_RATIO:-0.99}
      - CONFIG_FILE=/app/configs/ab_evaluator_config.yml
      - ALERT_BRIDGE_BASE_URL=${ALERT_BRIDGE_BASE_URL:-http://localhost:9080}
      - ELASTICSEARCH_BASE_URL=${ELASTICSEARCH_BASE_URL:-http://localhost:9200}
      - REDIS_HOST=${REDIS_HOST:-localhost}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - LOG_LEVEL=DEBUG
    volumes:
      - ${EVAL_GROUND_TRUTH_PATH:-/dev/null}:/app/gt.json:ro
      - ${EVAL_RESULT_DIR_PATH:-./eval_results}:/app/reports
      - $CI_VSS_OSS_DIR/eval/configs:/app/configs
      # - ${GT_PATH:-./gt.json}:/app/gt.json:ro
    network_mode: host
    depends_on:
      alert-bridge-evaluator-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health' % os.environ.get('PORT', '5002'), timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Local Prometheus for Alert Agent metrics.
  # Started only when run_eval enables profile: alerts-verification-latency-prometheus.
  prometheus:
    profiles: ["alerts-verification-latency-prometheus"]
    image: quay.io/prometheus/prometheus:v3.11.3
    container_name: prometheus
    network_mode: "host"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=2h"
      - "--web.listen-address=:${ALERT_BRIDGE_EVALUATOR_PROMETHEUS_PORT:-9090}"
    volumes:
      - ./configs/prometheus_alert_agent.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped
    environment:
      - PROMETHEUS_PORT=${ALERT_BRIDGE_EVALUATOR_PROMETHEUS_PORT:-9090}

  # Init container: Waits for required upload inputs before starting eval-orchestrator
  eval-orchestrator-init:
    container_name: eval-orchestrator-init
    image: curlimages/curl:latest
    network_mode: "host"
    environment:
      EVAL_TYPE: ${EVAL_TYPE}
      BLUEPRINT: ${BLUEPRINT}
      ALERTS_MODE: ${ALERTS_MODE:-}
      INIT_WAIT_TIMEOUT_SEC: ${INIT_WAIT_TIMEOUT_SEC:-3600}
      BLUEPRINT_CONFIGURATOR_PORT: ${BLUEPRINT_CONFIGURATOR_PORT:-5001}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        timeout_sec=$${INIT_WAIT_TIMEOUT_SEC:-3600}
        poll=5
        start=$$(date +%s)
        iter=0
        cfg_port=$${BLUEPRINT_CONFIGURATOR_PORT:-5001}
        status_url="http://localhost:$${cfg_port}/video-upload-status"
        echo "[eval-orchestrator-init] Waiting for video upload (timeout=$${timeout_sec}s, url=$${status_url})..."
        while true; do
          iter=$$((iter + 1))
          elapsed=$$(($$(date +%s) - start))
          if [ $$elapsed -ge $$timeout_sec ]; then
            echo "[eval-orchestrator-init] TIMEOUT after $${timeout_sec}s waiting for bp-configurator video-upload-status ready=true"
            curl -sf "$${status_url}" 2>/dev/null || echo "(video-upload-status unreachable)"
            exit 1
          fi
          if curl -sf "$${status_url}" 2>/dev/null | grep -q '"ready"[[:space:]]*:[[:space:]]*true'; then
            echo "[eval-orchestrator-init] Video upload ready after $${elapsed}s"
            break
          fi
          if [ $$((iter % 12)) -eq 0 ]; then
            echo "[eval-orchestrator-init] +$${elapsed}s video upload not ready yet (bp-configurator /video-upload-status)..."
            curl -sf "$${status_url}" 2>/dev/null | head -c 400 || echo "(no response)"
            echo
          fi
          sleep $$poll
        done

        if [ "$${EVAL_TYPE}" = "latency" ] || { [ "$${BLUEPRINT}" = "alerts" ] && [ "$${ALERTS_MODE}" = "verification" ]; }; then
          echo "[eval-orchestrator-init] Waiting for timelines (timeout=$${timeout_sec}s)..."
          iter=0
          while true; do
            iter=$$((iter + 1))
            elapsed=$$(($$(date +%s) - start))
            if [ $$elapsed -ge $$timeout_sec ]; then
              echo "[eval-orchestrator-init] TIMEOUT after $${timeout_sec}s waiting for VST timelines"
              exit 1
            fi
            response=$$(curl -sf http://localhost:30888/vst/api/v1/storage/timelines 2>/dev/null)
            if [ "$$response" != "null" ] && [ -n "$$response" ]; then
              echo "[eval-orchestrator-init] Timelines available after $${elapsed}s"
              break
            fi
            if [ $$((iter % 12)) -eq 0 ]; then
              echo "[eval-orchestrator-init] +$${elapsed}s timelines not available yet..."
            fi
            sleep $$poll
          done
        fi
    restart: "no"
    depends_on:
      bp-configurator:
        condition: service_started

  eval-orchestrator:
    profiles: ["alerts"]
    container_name: eval-orchestrator
    image: nvcr.io/nvstaging/vss-core/vss-surf-trigger-eval-svc:3.2-2026.05.06
    network_mode: "host"
    environment:
      AGENT_NAME: vss-agent
      EVALUATION_SERVICE_URL: ${EVALUATION_SERVICE_URL:-http://localhost:5002}
      TRIGGER_CONFIG_FILE: /vss-agent/configs/${EVAL_TRIGGER_CONFIG:-trigger_eval_config_${EVAL_TYPE:-latency}.yml}
      JOB_ID: ${JOB_ID:-alert-bridge-eval-job-1}
      CONFIG_SOURCE: local
      ALERT_BRIDGE_EVALUATOR_PORT: ${ALERT_BRIDGE_EVALUATOR_PORT:-5002}
      ALERT_CATEGORY: ${ALERT_CATEGORY:-FOV Count Violation}
      ALERT_BRIDGE_EVALUATOR_URL: http://localhost:${ALERT_BRIDGE_EVALUATOR_PORT:-5002}
      VST_BASE_URL: ${VST_BASE_URL:-http://localhost:30888}
      NVSTREAMER_BASE_URL: ${NVSTREAMER_BASE_URL:-http://localhost:31000}
      EVAL_RESULT_DIR_PATH: /vss-agent/results  # Container path (volume-mounted)
      LATENCY_DURATION: ${LATENCY_DURATION:-10m}
      NAT_EVAL_CONFIG_FILE: /vss-agent/deployments/developer-profiles/dev-profile-base/vss-agent/configs/config.yml
      DEBUG_MODE: true
    volumes:
      - $CI_VSS_OSS_DIR/eval/configs:/vss-agent/configs
      - ${EVAL_RESULT_DIR_PATH:-./eval_results}:/vss-agent/results  # Host path mapped to container
    depends_on:
      eval-orchestrator-init:
        condition: service_completed_successfully
