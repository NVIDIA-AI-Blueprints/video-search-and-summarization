# SPDX-License-Identifier: Apache-2.0
perf_configs:
  - id: alerts-verification-compose
    enabled: true
    # Expanded from explicit Jenkins NODE_LABELS; this package owns no node pool.
    nodeLabel: from_params
    imageArch: amd64
    # Preserve native dev-profile GPU placement unless explicit vlmGpus/llmGpus
    # overrides are added here. Each native model accepts a single device ID.
    checkoutPaths:
      - libs/vss-perf-reporting/
      - deploy/docker/
