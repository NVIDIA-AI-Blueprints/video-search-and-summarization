[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vss-share"
version = "0.1.0"
description = "VSS share service - publishes agent-computed result sets at shareable, expiring URLs"
requires-python = ">=3.13,<3.15"
license = "Apache-2.0"
authors = [{ name = "NVIDIA Corporation" }]
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn[standard]>=0.40.0",
    "redis>=6.4.0",
    "httpx~=0.28",
    "pydantic>=2.11,<3",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
    "ruff>=0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["vss_share"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP", "ARG", "SIM", "TCH", "Q", "RUF"]
ignore = ["E501", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["ARG001", "ARG002", "S101"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
force-single-line = true
known-first-party = ["vss_share"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-v", "--strict-markers"]
