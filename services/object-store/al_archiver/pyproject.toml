[project]
name = "deft-aoi-al-archiver"
version = "0.1.0"
description = "AL Archiver — forwards AOI inference results from Kafka to the Object Store-ELK BE"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiokafka>=0.14.0",
    "deft-aoi-client",
    "fastapi[standard]>=0.136.3",
    "httpx>=0.28.0",
    "pydantic-settings>=2.0.0",
]

[tool.uv.sources]
deft-aoi-client = { path = "../client" }

# The pyproject sits inside the package directory, so the layout has to be
# spelled out: without it the build backend sees api/, core/ and shared/ as
# three unrelated top-level packages and refuses to build. Mirrors client/,
# which has the same shape. Needed since the backend took a dependency on this
# package to run the Smart City consumer in-process.
[tool.setuptools]
package-dir = {"al_archiver" = "."}
packages = ["al_archiver", "al_archiver.api", "al_archiver.core", "al_archiver.shared"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
