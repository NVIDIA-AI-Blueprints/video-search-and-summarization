[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[project]
name = "deft-service-blueprint-provider"
version = "0.1.2"
description = "Blueprint Builder deployment definitions for DEFT Service."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "blueprint-builder>=0.2.3,<0.3",
]

[project.entry-points."blueprint_builder.microservices.v1"]
deft-service = "deft_service_deployment.microservice_provider:MICROSERVICES"

[project.entry-points."blueprint_builder.blueprints.v1"]
deft-service = "deft_service_deployment.blueprint_provider:BLUEPRINTS"

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.uv.build-backend]
module-name = "deft_service_deployment"
