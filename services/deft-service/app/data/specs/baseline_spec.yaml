encryption_key: tlt_encode
task: classify
results_dir: ''
train:
  classify:
    loss: ce
  num_gpus: 1
  num_epochs: 1
  checkpoint_interval: 1
  validation_interval: 1
  pretrained_model_path: ''
model:
  backbone:
    type: c_radio_v2_vit_base_patch16_224
    pretrained_backbone_path: /data/pretrained_models/C-RADIOv2_B.pth
    freeze_backbone: false
  classify:
    train_margin_euclid: 2.0
    eval_margin: 0.332784
    embedding_vectors: 5
    embed_dec: 30
    difference_module: learnable
    learnable_difference_modules: 4
  decode_head:
    in_channels:
    - 768
    - 768
    - 768
    - 768
    in_index:
    - 0
    - 1
    - 2
    - 3
    align_corners: false
    decoder_params:
      embed_dim: 256
    use_summary_token: true
    feature_strides:
    - 4
    - 8
    - 16
    - 32
dataset:
  classify:
    infer_dataset:
      csv_path: ''
      images_dir: ''
    image_ext: .jpg
    batch_size: 1
    workers: 1
    fpratio_sampling: 0.2
    num_input: 1
    input_map:
      SolderLight: 0
    concat_type: linear
    grid_map:
      x: 2
      y: 2
    image_width: 224
    image_height: 224
    augmentation_config:
      rgb_input_mean:
      - 0.485
      - 0.456
      - 0.406
      rgb_input_std:
      - 0.229
      - 0.224
      - 0.225
      random_flip:
        vflip_probability: 0.5
        hflip_probability: 0.5
        enable: true
      random_rotate:
        rotate_probability: 0.5
        angle_list:
        - 90
        - 180
        - 270
        enable: true
      random_color:
        brightness: 0.3
        contrast: 0.3
        saturation: 0.3
        hue: 0.3
        enable: true
      with_scale_random_crop:
        enable: true
      with_random_crop: true
      with_random_blur: true
      augment: false
    num_classes: 2
inference:
  checkpoint: /model/best.pth
  batch_size: 1
  results_dir: ''
# Export section added for `visual_changenet export` (PyTorch -> ONNX).
# Container paths are bind-mounted by tao_export/export_onnx.sh:
#   models/model.pth -> /model/model.pth   (weight from the models/ folder)
#   backbone .pth    -> /data/pretrained_models/C-RADIOv2_B.pth
#   <out dir>        -> /results
export:
  results_dir: /results
  gpu_id: 0
  checkpoint: /model/model.pth
  onnx_file: /results/changenet_classify.onnx
  input_width: 224
  input_height: 224
  input_channel: 3
  batch_size: -1
