[project]
name = "aoi-model-manager"
version = "0.1.0"
description = "Standalone AOI Model Manager implementing the DFW Model Promotion API"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.12",
    "uvicorn>=0.34.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.9.1",
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.1.1",
    "httpx>=0.28.1",
    "responses>=0.25.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".git", ".venv", "__pycache__", "build", "dist"]
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "N", "W", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true

# Docstring coverage. Run as: uvx interrogate
#
# Scoped to src/ because that is where a docstring earns its keep: it documents a
# contract a caller cannot see from the signature. Test functions are excluded
# deliberately rather than for convenience -- a test's name already states the
# behaviour it pins, and this suite reserves test docstrings for the cases where
# the *reason* the behaviour matters is not obvious from the name. Requiring one
# on every test would replace that signal with a few hundred restatements of the
# function name, which is worse documentation than none.
#
# Dunder methods are excluded for the same reason: their contracts come from the
# language, not from this codebase.
[tool.interrogate]
fail-under = 80
ignore-init-method = true
ignore-magic = true
ignore-module = false
ignore-private = false
exclude = ["tests", ".venv", "build", "dist"]
verbose = 1
