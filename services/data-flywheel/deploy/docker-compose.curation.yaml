# ============================================================================
# PAS Curation Service — self-contained local stack.
#
# Runs the Curation Service (pas-curation), its evaluate worker
# (pas-curation-worker), the sweep's scheduler (pas-curation-beat) and its own Redis
# and Elasticsearch. It does NOT depend on deploy/docker-compose.yaml and can be
# brought up on its own (from the repo root):
#
#   PAS_LABELLING_URL=http://pas-api:8000 PAS_API_TOKEN=... \
#     docker compose -f deploy/docker-compose.curation.yaml up -d --build --wait
#   PAS_LABELLING_CLIENT=mock docker compose -f deploy/docker-compose.curation.yaml up -d --build --wait   # no labeller
#   docker compose -f deploy/docker-compose.curation.yaml down      # add -v to drop data
#
# The reference encoder (GPU) is opt-in: add `-f deploy/docker-compose.ref-encoder.yaml`.
#
# Networking: unlike the other DFW compose files this does NOT use
# `network_mode: host`. Everything sits on a dedicated bridge network named
# `pas`, so the service's DNS name matches the C5 contract
# (http://pas-curation:8080) and nothing collides with the host-networked DFW
# stack (which already binds 6379 / 9200 on the host).
#
# Redis and Elasticsearch are published on LOOPBACK-ONLY, OFFSET ports
# (127.0.0.1:16379 and 127.0.0.1:19200) so the integration tests running on the
# host can reach them without clashing with the DFW stack's Redis / ES.
# ============================================================================
# A fixed project name. Without it Compose names the project after the directory
# ("deploy"), which every compose file in deploy/ shares: `down` or `--remove-orphans`
# from this file would then stop the DFW stack's containers, or another checkout's.
name: pas-curation

services:
  redis:
    image: redis:7.4.7-alpine            # same pin as deploy/docker-compose.yaml
    # Redis holds job handles, REJECT verdicts and a cache of admitted verdicts (whose
    # system of record is Elasticsearch, so those are recoverable). REJECTs and jobs
    # are not, so it must survive a crash (AOF, not the default hourly RDB snapshot) and
    # never evict under memory pressure (noeviction: fail writes loudly instead). The
    # maxmemory cap makes a full Redis refuse writes (503, the archiver retries) rather than
    # grow until the container dies; queued evaluate jobs hold their crop bytes here.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - pas-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      pas:
        # Addressed by this unique alias, not the service name: the API also joins the
        # AL archiver's network, which has its own `redis` / `elasticsearch`.
        aliases: [pas-curation-redis]

  # Single-node discovery skips the ES production bootstrap checks. If ES still
  # refuses to start on a host with a low vm.max_map_count, run:
  #   sudo sysctl -w vm.max_map_count=262144
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.7   # same pin as deploy/docker-compose.yaml
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - "127.0.0.1:19200:9200"
    volumes:
      - pas-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    networks:
      pas:
        # Addressed by this unique alias, not the service name: the API also joins the
        # AL archiver's network, which has its own `redis` / `elasticsearch`.
        aliases: [pas-curation-es]

  pas-curation:
    image: nvcr.io/nvstaging/blueprint/dfw-curation-service:${TAG:-26.08}
    build:
      context: ../curation-service       # data-flywheel-blueprint/curation-service
      dockerfile: Dockerfile
    ports:
      # Loopback by default: the service has no auth. Set PAS_CURATION_BIND=0.0.0.0 to let
      # an archiver on another host reach it.
      - "${PAS_CURATION_BIND:-127.0.0.1}:8080:8080"
    environment:
      CURATION_SERVICE_REDIS_URL: redis://pas-curation-redis:6379/0
      CURATION_SERVICE_BROKER_URL: redis://pas-curation-redis:6379/1
      CURATION_SERVICE_ES_URL: http://pas-curation-es:9200
      # VSS's Elasticsearch (BA's mdx-behavior-* index), never the one above. Unset, screen
      # answers 503; evaluate and commit still work.
      CURATION_SERVICE_BEHAVIOUR_ES_URL: ${CURATION_SERVICE_BEHAVIOUR_ES_URL:-}
      # `mock` when no object store serves the presigned links (curation-service/README.md).
      CURATION_SERVICE_CROP_SOURCE: ${CURATION_SERVICE_CROP_SOURCE:-http}
      CURATION_SERVICE_CROP_HOSTS: ${CURATION_SERVICE_CROP_HOSTS:-seaweedfs-s3}
      # The C2 labelling service (the PAS API), e.g. http://pas-api:8000. Without a URL the
      # containers refuse to start unless PAS_LABELLING_CLIENT=mock. The API only reads the
      # spend ceiling (evaluate answers 429 at it); the worker makes the calls, so both
      # need the same values.
      CURATION_SERVICE_LABELLING_CLIENT: ${PAS_LABELLING_CLIENT:-http}
      CURATION_SERVICE_LABELLING_URL: ${PAS_LABELLING_URL:-}
      CURATION_SERVICE_LABELLING_TOKEN: ${PAS_API_TOKEN:-}
      CURATION_SERVICE_LABELLING_SPEND_CEILING: ${PAS_LABELLING_SPEND_CEILING:-}
      CURATION_SERVICE_LABELLING_SPEND_WINDOW: ${PAS_LABELLING_SPEND_WINDOW:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/v1/ready')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # Deliberately NO `restart:` policy on the API. A crash-looping API would hide
    # a broken deploy behind "restarting"; a dead container fails `up --wait`
    # loudly instead. The archiver treats an unreachable service as "hold the
    # offset", so a stopped API loses no data. The worker is the opposite case
    # (see pas-curation-worker).
    networks:
      - pas

  # Runs the evaluate jobs pas-curation enqueues (src/worker.py). No --purge: it would
  # drop queued jobs on every start.
  pas-curation-worker:
    image: nvcr.io/nvstaging/blueprint/dfw-curation-service:${TAG:-26.08}
    build:
      context: ../curation-service
      dockerfile: Dockerfile
    command: ["/app/.venv/bin/celery", "-A", "src.worker", "worker", "--concurrency", "4", "--loglevel", "${LOG_LEVEL:-INFO}", "-n", "curation@%h"]
    environment:
      CURATION_SERVICE_REDIS_URL: redis://pas-curation-redis:6379/0
      CURATION_SERVICE_BROKER_URL: redis://pas-curation-redis:6379/1
      CURATION_SERVICE_ES_URL: http://pas-curation-es:9200
      CURATION_SERVICE_LABELLING_CLIENT: ${PAS_LABELLING_CLIENT:-http}
      CURATION_SERVICE_LABELLING_URL: ${PAS_LABELLING_URL:-}
      CURATION_SERVICE_LABELLING_TOKEN: ${PAS_API_TOKEN:-}
      CURATION_SERVICE_LABELLING_SPEND_CEILING: ${PAS_LABELLING_SPEND_CEILING:-}
      CURATION_SERVICE_LABELLING_SPEND_WINDOW: ${PAS_LABELLING_SPEND_WINDOW:-}
      # The sweep task (beat enqueues it, this worker runs it) reads the AL catalog.
      # CATALOG_ES_URL empty means the gate's ES_URL.
      CURATION_SERVICE_CATALOG_INDEX: ${CURATION_SERVICE_CATALOG_INDEX:-pas_records}
      CURATION_SERVICE_CATALOG_ES_URL: ${CURATION_SERVICE_CATALOG_ES_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    # Overrides the image's HEALTHCHECK (/v1/ready on :8080, which a worker never serves).
    healthcheck:
      test: ["CMD-SHELL", "/app/.venv/bin/celery -A src.worker inspect ping -d curation@$$HOSTNAME -t 5"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 15s
    # A docker stop is a warm shutdown: a running job gets this long to finish. One cut
    # off past it is recovered by the archiver's retry, like any lost job.
    stop_grace_period: 60s
    # Unlike pas-curation, the worker restarts. The API keeps answering 202 while
    # the worker is down, so nothing upstream notices a dead consumer; e.g. Redis
    # at maxmemory (noeviction) can surface an unrecoverable broker error that
    # exits it. A queue consumer must come back on its own.
    restart: on-failure
    networks:
      - pas

  # Enqueues the sweep of never-committed docs (src/sweep.py) every
  # CURATION_SERVICE_SWEEP_INTERVAL_S; pas-curation-worker runs it. Exactly ONE beat
  # (never scale it): a second would enqueue every sweep twice.
  pas-curation-beat:
    image: nvcr.io/nvstaging/blueprint/dfw-curation-service:${TAG:-26.08}
    build:
      context: ../curation-service
      dockerfile: Dockerfile
    # The schedule file goes on a tmpfs owned by the image's non-root appuser (uid 10001):
    # a fresh named volume would be root-owned. Losing it on restart only resets "last run".
    command: ["/app/.venv/bin/celery", "-A", "src.worker", "beat", "--loglevel", "${LOG_LEVEL:-INFO}", "--schedule", "/beat/celerybeat-schedule"]
    tmpfs:
      - /beat:uid=10001,gid=10001,mode=0700
    environment:
      CURATION_SERVICE_REDIS_URL: redis://pas-curation-redis:6379/0
      CURATION_SERVICE_BROKER_URL: redis://pas-curation-redis:6379/1
      CURATION_SERVICE_ES_URL: http://pas-curation-es:9200
      CURATION_SERVICE_CATALOG_INDEX: ${CURATION_SERVICE_CATALOG_INDEX:-pas_records}
      CURATION_SERVICE_CATALOG_ES_URL: ${CURATION_SERVICE_CATALOG_ES_URL:-}
      CURATION_SERVICE_SWEEP_INTERVAL_S: ${CURATION_SERVICE_SWEEP_INTERVAL_S:-3600}
      CURATION_SERVICE_SWEEP_SCHEDULE_ENABLED: ${CURATION_SERVICE_SWEEP_SCHEDULE_ENABLED:-true}
      # Beat never labels, but every process checks the labelling settings on import.
      CURATION_SERVICE_LABELLING_CLIENT: ${PAS_LABELLING_CLIENT:-http}
      CURATION_SERVICE_LABELLING_URL: ${PAS_LABELLING_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    # Overrides the image's HEALTHCHECK (:8080, which beat never serves). Beat has no
    # inspect ping: healthy once PID 1 is celery beat and it has written its schedule
    # (the dbm backend picks the suffix: celerybeat-schedule.db in this image).
    healthcheck:
      test: ["CMD-SHELL", "tr '\\0' ' ' < /proc/1/cmdline | grep -q 'celery -A src.worker beat' && ls /beat/celerybeat-schedule* >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    # Restarts on failure, like the worker: a dead scheduler would stop the sweep silently
    # while everything else stays healthy.
    restart: on-failure
    networks:
      - pas

networks:
  pas:
    name: pas

volumes:
  pas-redis-data: {}
  pas-es-data: {}

