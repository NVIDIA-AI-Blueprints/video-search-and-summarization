      #   dpo:
      #     ref_policy_kl_penalty: 0.1
      #     preference_loss_weight: 1.0
      #     preference_average_log_probs: false
      #     sft_loss_weight: 0.0
      #     sft_average_log_probs: false

    embedding_job_config:
      nims:
        - model_name: "nvidia/llama-3.2-nv-embedqa-1b-v2"
          model_type: "embedding"
          context_length: 32768
          gpus: 1
          pvc_size: 25Gi
          tag: "1.9.0"
          customization_enabled: true
          customizer_configs:
            gpus: 1
            max_seq_length: 8192
            target: "nvidia/llama-3.2-nv-embedqa-1b@v2"
            # Optional parameters for creating a new target
            # target:
            #   name: "nvidia/llama-3.2-nv-embedqa-1b-v2@v2"
            #   target_type: "nemo"
            #   description: "Customization target for Nvidia Llama 3.2 NV EmbedQA 1B"
            #   base_model: "nvidia/llama-3.2-nv-embedqa-1b-v2"
            #   model_uri: "ngc://nvidia/nemo/llama-3_2-1b-embedding-base:0.0.1"
            #   model_path: "llama32_1b-embedding"
            #   num_parameters: 1000000000
            #   precision: "bf16-mixed"
            # pod_spec:  # Optional: Kubernetes pod specification for customization jobs
            #   tolerations:  # Tolerations for GPU nodes
            #     - key: nvidia.com/gpu
            #       operator: Equal
            #       value: "true"
            #       effect: NoSchedule
            #     - key: astra.nvidia.com/reserved
            #       operator: Equal
            #       value: nemo
            #       effect: NoSchedule
            #   node_selectors:  # Target specific GPU types
            #     nvidia.com/gpu.product: "NVIDIA-A100-80GB"
            #   annotations:  # Pod annotations
            #     sidecar.istio.io/inject: "false"

      evaluation_config:
        # Embedding-specific evaluation metrics
        embedding_eval_metrics:
          metrics:
            - "recall_5"
            - "map"
            - "P_5"
            - "P_10"
        # Custom evaluation datasets (optional)
        # custom_evaluations:
        #   - name: "custom-eval-dataset"
        #     workload_id: "val-set-1"
        #     client_id: "mozillacorebugs"

      # Data split config for embeddings:
      data_split_config:
        val_ratio: 0.09
        eval_size: 100
        min_total_records: 50
        random_seed: 42
        # from_date: "2021-01-01"
        # to_date: "2021-10-31"

      # Training config for SFT embeddings finetuning:
      # training_config:
      #   training_type: "sft"
      #   finetuning_type: "all_weights"
      #   epochs: 1
      #   batch_size: 64
      #   learning_rate: 0.000005
      #   micro_batch_size: 1
      #   tensor_parallel_size: 1
      #   pipeline_parallel_size: 1
      #   use_sequence_parallel: false
      #   training_precision: "bf16-mixed"


      # Training config for embeddings:
      training_config:
        training_type: "sft"
        finetuning_type: "lora_merged"
        epochs: 1
        batch_size: 64
        learning_rate: 0.000025
        min_learning_rate: 0.0000005
        dataset_parameters:
          in_batch_negatives: true
          num_hard_negatives: 1
        micro_batch_size: 1
        weight_decay: 0.01
        warmup_steps: 100
        tensor_parallel_size: 1
        pipeline_parallel_size: 1
        data_parallel_size: 1
        use_sequence_parallel: false
        training_precision: "bf16-mixed"
        lora:
          adapter_dim: 32
          alpha: 64
          adapter_dropout: 0.01

# Ingestion Plugins configuration
# The ingestion plugins service handles data ingestion from external sources
# (e.g., NVBugs database) into Elasticsearch before flywheel jobs run.
ingestionPlugins:
  enabled: true
  image:
    repository: nvcr.io/nvstaging/blueprint/dfw-ingestion-plugins
    tag: "26.08"
  imagePullSecrets:
    - name: nvcrimagepullsecret
  deployments:
    # API gateway - FastAPI service that accepts ingestion requests
    api:
      enabled: true
      fullnameOverride: "df-ingestion-api"
      service:
        type: ClusterIP
        port: 8001
      env:
        ELASTICSEARCH_URL: "http://df-elasticsearch-service:9200"
        REDIS_URL: "redis://df-redis-service:6379/0"
        MONGODB_URL: "mongodb://df-mongodb-service:27017"
        MONGODB_DB: "ingestion_plugins"
      resources:
        requests:
          memory: "512Mi"
          cpu: "500m"
          ephemeral-storage: "2Gi"
        limits:
          memory: "1Gi"
          cpu: "1"
          ephemeral-storage: "5Gi"
      command:
        - "uv"
        - "run"
        - "uvicorn"
        - "main:app"
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "8001"
    # Celery worker - executes plugin ingestion tasks
    worker:
      enabled: true
      fullnameOverride: "df-ingestion-worker"
      env:
        ELASTICSEARCH_URL: "http://df-elasticsearch-service:9200"
        REDIS_URL: "redis://df-redis-service:6379/0"
        MONGODB_URL: "mongodb://df-mongodb-service:27017"
        MONGODB_DB: "ingestion_plugins"
        ES_COLLECTION_NAME: "flywheel"
        LOG_LEVEL: "INFO"
      resources:
        requests:
          memory: "1Gi"
          cpu: "1"
          ephemeral-storage: "2Gi"
        limits:
          memory: "2Gi"
          cpu: "2"
          ephemeral-storage: "5Gi"
      command:
        - "uv"
        - "run"
        - "celery"
        - "-A"
        - "src.celery_app:celery_app"
        - "worker"
        - "--loglevel=info"
        - "--concurrency=4"
        - "--queues=ingestion_plugins"
        - "-n"
        - "plugin_worker@%h"

# Nemo Microservices configuration
nemo-microservices-helm-chart:
  enabled: true

  existingSecret: ngc-api
  existingImagePullSecret: nvcrimagepullsecret

  # kube-rbac-proxy sidecar: gcr.io/kubebuilder/ images were deprecated/removed; use Brancz image.
  # v0.18.1 addresses CVE-2023-45288 (HTTP/2 DoS, fixed in v0.16.0) and
  # CVE-2024-28180 (go-jose decompression bomb, fixed in v0.18.1).
  nemo-operator:
    controllerManager:
      kubeRbacProxy:
        image:
          repository: quay.io/brancz/kube-rbac-proxy
          tag: v0.18.1

  data-store:
    external:
      rootUrl: http://data-store.test
      domain: data-store.test
    persistence:
      size: 50Gi  # Increased from 2Gi to support large model fine-tuning uploads (2-8GB models)

  guardrails:
    env:
      FETCH_NIM_APP_MODELS: "True"

  ingress:
    enabled: true

  customizer:
    enabled: true
    modelsStorage:
      storageClassName: standard
    customizationTargets:
      overrideExistingTargets: true
      targets:
        meta/llama-3.2-1b-instruct@2.0:
          enabled: true
        meta/llama-3.2-3b-instruct@2.0:
          enabled: true
        meta/llama-3.1-8b-instruct@2.0:
          enabled: true
        nvidia/llama-3.2-nv-embedqa-1b@v2:
          enabled: true
    customizerConfig:
      training:
        pvc:
          storageClass: "standard"
          size: "100Gi"
          volumeAccessMode: "ReadWriteMany"
    # Environment variables for the customizer service
    # MAX_PENDING_JOB_MINUTES: Set to a high value to prevent premature job cancellation
    # during multi-stage customization pipelines where elapsed time is calculated from
    # the initial job creation (not per-stage)
    #
    # IMPORTANT: Adjust this value based on your dataset size and expected training time.
    env:
      MAX_PENDING_JOB_MINUTES: "180"  # 3 hours - adjust based on your dataset and training time
    opentelemetry-collector:
      enabled: false

  deployment-management:
    deployments:
      defaultStorageClass: standard
