apiVersion: v2
name: nvidia-blueprint-data-flywheel
description: A Helm chart for Data Flywheel Blueprint
dependencies:
# NMP 26.03 renamed the chart from `nemo-microservices-helm-chart` to `nemo-platform`.
# DFW values still nest under `nemo-microservices-helm-chart` for backward compatibility,
# so we alias the new chart to that key.
- name: nemo-platform
  alias: nemo-microservices-helm-chart
  condition: nemo-microservices-helm-chart.enabled
  # NMP 26.03 is only EA; nightly chart is hosted under nvidian/nemo-llm on NGC.
  # Stage the tgz locally if you can't reach NGC at deploy time:
  #   ngc registry chart pull --org nvidian 'nvidian/nemo-llm/nemo-platform:2.1.0-nightly-20260422'
  #   mv nemo-platform-2.1.0-nightly-20260422.tgz deploy/helm/data-flywheel/charts/
  repository: https://helm.ngc.nvidia.com/nvidian/nemo-llm
  version: '2.1.0-nightly-20260422'
type: application
version: "26.3.0"
appVersion: "26.3.0"
