---
{{- if .Values.foundationalFlywheelServer.deployments.celeryWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.foundationalFlywheelServer.deployments.celeryWorker.fullnameOverride }}-deployment
  labels:
    app: {{ .Values.foundationalFlywheelServer.deployments.celeryWorker.fullnameOverride }}-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.foundationalFlywheelServer.deployments.celeryWorker.fullnameOverride }}-deployment
  template:
    metadata:
      labels:
        app: {{ .Values.foundationalFlywheelServer.deployments.celeryWorker.fullnameOverride }}-deployment
    spec:
      {{- with .Values.foundationalFlywheelServer.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.crane.enabled }}
      serviceAccountName: {{ .Values.crane.serviceAccount }}
      automountServiceAccountToken: true
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      containers:
        - name: celery-worker
          image: "{{ .Values.foundationalFlywheelServer.image.repository }}:{{ .Values.foundationalFlywheelServer.image.tag }}"
          imagePullPolicy: Always
          resources:
            {{- toYaml .Values.foundationalFlywheelServer.deployments.celeryWorker.resources | nindent 12 }}
          ports:
            - containerPort: 8000
          env:
            - name: ELASTICSEARCH_URL
              value: {{ .Values.foundationalFlywheelServer.deployments.celeryWorker.env.ELASTICSEARCH_URL | quote }}
            - name: REDIS_URL
              value: {{ .Values.foundationalFlywheelServer.deployments.celeryWorker.env.REDIS_URL | quote }}
            - name: MONGODB_URL
              value: {{ .Values.foundationalFlywheelServer.deployments.celeryWorker.env.MONGODB_URL | quote }}
            - name: MONGODB_DB
              value: {{ .Values.foundationalFlywheelServer.deployments.celeryWorker.env.MONGODB_DB | quote }}
            - name: COMPOSE_PROFILES
              value: {{ .Values.profile.mlflow.COMPOSE_PROFILES | quote }}
            - name: ES_COLLECTION_NAME
              value: {{ .Values.foundationalFlywheelServer.deployments.celeryWorker.env.ES_COLLECTION_NAME | quote }}
            - name: PLUGIN_SERVICE_URL
              value: {{ .Values.foundationalFlywheelServer.deployments.celeryWorker.env.PLUGIN_SERVICE_URL | quote }}
            - name: NVIDIA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nvidiaApiSecret.name | default "nvidia-api" }}
                  key: {{ .Values.nvidiaApiSecret.key | default "NVIDIA_API_KEY" }}
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.hfSecret.name | default "hf-secret" }}
                  key: {{ .Values.hfSecret.key | default "HF_TOKEN" }}
            - name: LLM_JUDGE_API_KEY
              valueFrom:
                secretKeyRef:
                  {{ if .Values.secrets.llmJudgeApiKey }}
                  name: {{ .Values.llmJudgeSecret.name | default "llm-judge-api" }}
                  key: {{ .Values.llmJudgeSecret.key | default "LLM_JUDGE_API_KEY" }}
                  {{ else }}
                  name: {{ .Values.nvidiaApiSecret.name | default "nvidia-api" }}
                  key: {{ .Values.nvidiaApiSecret.key | default "NVIDIA_API_KEY" }}
                  {{ end }}
            - name: EMB_API_KEY
              valueFrom:
                secretKeyRef:
                  {{ if .Values.secrets.embApiKey }}
                  name: {{ .Values.embSecret.name | default "emb-api" }}
                  key: {{ .Values.embSecret.key | default "EMB_API_KEY" }}
                  {{ else }}
                  name: {{ .Values.nvidiaApiSecret.name | default "nvidia-api" }}
                  key: {{ .Values.nvidiaApiSecret.key | default "NVIDIA_API_KEY" }}
                  {{ end }}
            {{- if .Values.crane.enabled }}
            {{- if .Values.crane.registrySecret }}
            - name: CUSTOM_NIM_CRANE_REGISTRY_SECRET
              value: {{ .Values.crane.registrySecret | quote }}
            {{- end }}
            - name: NGC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ngcApiSecret.name | default "ngc-api" }}
                  key: {{ .Values.ngcApiSecret.key | default "NGC_API_KEY" }}
            {{- if .Values.crane.jfrog }}
            {{- if .Values.crane.jfrog.username }}
            - name: CUSTOM_NIM_JFROG_USERNAME
              value: {{ .Values.crane.jfrog.username | quote }}
            {{- end }}
            {{- if .Values.crane.jfrog.secretRef }}
            - name: CUSTOM_NIM_JFROG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.crane.jfrog.secretRef.name }}
                  key: {{ .Values.crane.jfrog.secretRef.key | default "JFROG_API_KEY" }}
            {{- end }}
            {{- end }}
            {{- end }}
          command:
            {{- toYaml .Values.foundationalFlywheelServer.deployments.celeryWorker.command | nindent 12 }}
          volumeMounts:
            - name: config-volume
              mountPath: /legal/source/config/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- if .Values.crane.enabled }}
            - name: crane-build-context
              mountPath: {{ .Values.crane.buildContextDir | default "/crane-workspace" }}
            {{- end }}
      volumes:
        - name: config-volume
          configMap:
            name: df-config
        {{- if .Values.crane.enabled }}
        - name: crane-build-context
          persistentVolumeClaim:
            claimName: {{ .Values.crane.pvc.name }}
        {{- end }}
{{- end }}
