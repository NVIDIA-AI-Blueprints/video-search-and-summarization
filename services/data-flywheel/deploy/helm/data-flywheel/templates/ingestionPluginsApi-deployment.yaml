---
{{- if and .Values.ingestionPlugins.enabled .Values.ingestionPlugins.deployments.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.ingestionPlugins.deployments.api.fullnameOverride }}-deployment
  labels:
    app: {{ .Values.ingestionPlugins.deployments.api.fullnameOverride }}-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.ingestionPlugins.deployments.api.fullnameOverride }}-deployment
  template:
    metadata:
      labels:
        app: {{ .Values.ingestionPlugins.deployments.api.fullnameOverride }}-deployment
    spec:
      {{- with .Values.ingestionPlugins.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      containers:
        - name: ingestion-api
          image: "{{ .Values.ingestionPlugins.image.repository }}:{{ .Values.ingestionPlugins.image.tag }}"
          imagePullPolicy: Always
          resources:
            {{- toYaml .Values.ingestionPlugins.deployments.api.resources | nindent 12 }}
          ports:
            - containerPort: {{ .Values.ingestionPlugins.deployments.api.service.port }}
          env:
            - name: ELASTICSEARCH_URL
              value: {{ .Values.ingestionPlugins.deployments.api.env.ELASTICSEARCH_URL | quote }}
            - name: REDIS_URL
              value: {{ .Values.ingestionPlugins.deployments.api.env.REDIS_URL | quote }}
            - name: MONGODB_URL
              value: {{ .Values.ingestionPlugins.deployments.api.env.MONGODB_URL | quote }}
            - name: MONGODB_DB
              value: {{ .Values.ingestionPlugins.deployments.api.env.MONGODB_DB | quote }}
          command:
            {{- toYaml .Values.ingestionPlugins.deployments.api.command | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.ingestionPlugins.deployments.api.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.ingestionPlugins.deployments.api.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
{{- end }}
