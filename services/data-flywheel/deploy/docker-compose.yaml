x-deft-config-environment: &deft-config-environment
  DFW_MLFLOW_URL: "${DFW_MLFLOW_URL:-}"
  DFW_MLFLOW_ARTIFACT_LOCATION: "${DFW_MLFLOW_ARTIFACT_LOCATION:-}"
  DFW_DEFT_BASE_URL: "${DFW_DEFT_BASE_URL:-}"
  DFW_STORAGE_BACKEND_URL: "${DFW_STORAGE_BACKEND_URL:-}"
  DFW_OBJECT_STORE_URI: "${DFW_OBJECT_STORE_URI:-}"
  # One storage backend per deployment, shared by every use case it runs
  # (deft_config.use_case_endpoints ships empty entries), so there is no second
  # host, bucket or bearer to forward here.
  DFW_MODEL_MANAGER_URL: "${DFW_MODEL_MANAGER_URL:-}"
  DFW_MODEL_NAME: "${DFW_MODEL_NAME:-}"
  DFW_ITS_MODEL_NAME: "${DFW_ITS_MODEL_NAME:-}"
  DFW_KPI_SET_URI: "${DFW_KPI_SET_URI:-}"
  DFW_ITS_KPI_SET_URI: "${DFW_ITS_KPI_SET_URI:-}"
  DFW_BASELINE_MODEL_CHECKPOINT: "${DFW_BASELINE_MODEL_CHECKPOINT:-}"
  DFW_TRAINING_NO_PROGRESS_TIMEOUT_S: "${DFW_TRAINING_NO_PROGRESS_TIMEOUT_S:-10800}"
  DFW_HITL_CANARY: "${DFW_HITL_CANARY:-}"
  DFW_HITL_FULL: "${DFW_HITL_FULL:-}"
  DFW_STAGE_SHADOW: "${DFW_STAGE_SHADOW:-}"
  DFW_STAGE_CANARY: "${DFW_STAGE_CANARY:-}"
  # Required by config.deft.yaml, but not by the default NMP backend. Keep
  # Compose interpolation backend-neutral and let DEFT config rendering enforce it.
  AOI_SELECTION_TAG: "${AOI_SELECTION_TAG:-}"

services:

  api:
    image: nvcr.io/nvstaging/blueprint/foundational-flywheel-server-${BACKEND:-nmp}:${TAG:-26.08}
    build:
      context: ..
      dockerfile: ./deploy/Dockerfile
      target: prod
      args:
        BACKEND: ${BACKEND:-nmp}
    ports:
      - "8000:8000"
    environment:
      <<: *deft-config-environment
      ELASTICSEARCH_URL: http://localhost:9200
      ES_COLLECTION_NAME: ${ES_COLLECTION_NAME:-flywheel}
      REDIS_URL: redis://localhost:6379/0
      MONGODB_URL: mongodb://localhost:27017
      MONGODB_DB: flywheel
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      LLM_JUDGE_API_KEY: ${LLM_JUDGE_API_KEY:-${NVIDIA_API_KEY}}
      EMB_API_KEY: ${EMB_API_KEY:-${NVIDIA_API_KEY}}
      HF_TOKEN: ${HF_TOKEN}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES}
      # DEFT backend config/auth overrides. Empty defaults keep NMP behavior unchanged.
      DFW_CONFIG_PATH: ${DFW_CONFIG_PATH:-}
      DEFT_API_KEY: ${DEFT_API_KEY:-}
      STORAGE_BACKEND_API_KEY: ${STORAGE_BACKEND_API_KEY:-}
    command: ["uv", "run", "uvicorn", "src.app:app", "--host", "0.0.0.0", "--port", "8000"]
    network_mode: host
    restart: always
    depends_on:
      redis:
        condition: service_started
      mongodb:
        condition: service_started

  celery_worker:
    image: nvcr.io/nvstaging/blueprint/foundational-flywheel-server-${BACKEND:-nmp}:${TAG:-26.08}
    build:
      context: ..
      dockerfile: ./deploy/Dockerfile
      target: prod
      args:
        BACKEND: ${BACKEND:-nmp}
    environment:
      <<: *deft-config-environment
      ELASTICSEARCH_URL: http://localhost:9200
      ES_COLLECTION_NAME: ${ES_COLLECTION_NAME:-flywheel}
      REDIS_URL: redis://localhost:6379/0
      MONGODB_URL: mongodb://localhost:27017
      MONGODB_DB: flywheel
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      LLM_JUDGE_API_KEY: ${LLM_JUDGE_API_KEY:-${NVIDIA_API_KEY}}
      EMB_API_KEY: ${EMB_API_KEY:-${NVIDIA_API_KEY}}
      HF_TOKEN: ${HF_TOKEN}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES}
      PLUGIN_SERVICE_URL: http://localhost:8001
      NGC_API_KEY: ${NGC_API_KEY}
      # DEFT backend config/auth overrides. Empty defaults keep NMP behavior unchanged.
      DFW_CONFIG_PATH: ${DFW_CONFIG_PATH:-}
      DEFT_API_KEY: ${DEFT_API_KEY:-}
      STORAGE_BACKEND_API_KEY: ${STORAGE_BACKEND_API_KEY:-}
    network_mode: host
    volumes:
      # Image WORKDIR is /legal/source (see deploy/Dockerfile); mount src there for hot-reload.
      - ../src:/legal/source/src
    command: ["uv", "run", "celery", "-A", "src.tasks.cli:celery_app", "worker", "--loglevel=info", "--concurrency=50", "--queues=celery", "-n", "main_worker@%h", "--purge"]
    restart: always
    depends_on:
      redis:
        condition: service_started
      mongodb:
        condition: service_started


  celery_parent_worker:
    image: nvcr.io/nvstaging/blueprint/foundational-flywheel-server-${BACKEND:-nmp}:${TAG:-26.08}
    build:
      context: ..
      dockerfile: ./deploy/Dockerfile
      target: prod
      args:
        BACKEND: ${BACKEND:-nmp}
    environment:
      <<: *deft-config-environment
      ELASTICSEARCH_URL: http://localhost:9200
      ES_COLLECTION_NAME: ${ES_COLLECTION_NAME:-flywheel}
      REDIS_URL: redis://localhost:6379/0
      MONGODB_URL: mongodb://localhost:27017
      MONGODB_DB: flywheel
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      LLM_JUDGE_API_KEY: ${LLM_JUDGE_API_KEY:-${NVIDIA_API_KEY}}
      EMB_API_KEY: ${EMB_API_KEY:-${NVIDIA_API_KEY}}
      HF_TOKEN: ${HF_TOKEN}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES}
      # DEFT backend config/auth overrides. Empty defaults keep NMP behavior unchanged.
      DFW_CONFIG_PATH: ${DFW_CONFIG_PATH:-}
      DEFT_API_KEY: ${DEFT_API_KEY:-}
      STORAGE_BACKEND_API_KEY: ${STORAGE_BACKEND_API_KEY:-}
    network_mode: host
    volumes:
      # Image WORKDIR is /legal/source (see deploy/Dockerfile); mount src there for hot-reload.
      - ../src:/legal/source/src
    command: ["uv", "run", "celery", "-A", "src.tasks.cli:celery_app", "worker", "--loglevel=info", "--concurrency=1", "--queues=parent_queue", "-n", "parent_worker@%h", "--purge"]

    restart: always
    depends_on:
      redis:
        condition: service_started
      mongodb:
        condition: service_started

  celery_beat:
    image: nvcr.io/nvstaging/blueprint/foundational-flywheel-server-${BACKEND:-nmp}:${TAG:-26.08}
    build:
      context: ..
      dockerfile: ./deploy/Dockerfile
      target: prod
      args:
        BACKEND: ${BACKEND:-nmp}
    environment:
      <<: *deft-config-environment
      ELASTICSEARCH_URL: http://localhost:9200
      ES_COLLECTION_NAME: ${ES_COLLECTION_NAME:-flywheel}
      REDIS_URL: redis://localhost:6379/0
      MONGODB_URL: mongodb://localhost:27017
      MONGODB_DB: flywheel
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      LLM_JUDGE_API_KEY: ${LLM_JUDGE_API_KEY:-${NVIDIA_API_KEY}}
      EMB_API_KEY: ${EMB_API_KEY:-${NVIDIA_API_KEY}}
      HF_TOKEN: ${HF_TOKEN}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES}
      # DEFT backend config/auth overrides. Empty defaults keep NMP behavior unchanged.
      DFW_CONFIG_PATH: ${DFW_CONFIG_PATH:-}
      DEFT_API_KEY: ${DEFT_API_KEY:-}
      STORAGE_BACKEND_API_KEY: ${STORAGE_BACKEND_API_KEY:-}
    network_mode: host
    volumes:
      - celery-beat-data:/app/celerybeat-schedule  # Persist beat schedule
    command: ["uv", "run", "celery", "-A", "src.celery_app", "beat", "--loglevel=info"]
    restart: always
    depends_on:
      redis:
        condition: service_started
      mongodb:
        condition: service_started

  # Ingestion Plugins Service - FastAPI API Gateway
  ingestion-plugins-api:
    image: nvcr.io/nvstaging/blueprint/dfw-ingestion-plugins:${TAG:-26.08}
    build:
      context: ..
      dockerfile: ingestion-plugins/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - ELASTICSEARCH_URL=http://localhost:9200
      - REDIS_URL=redis://localhost:6379/0
      - MONGODB_URL=mongodb://localhost:27017
      - MONGODB_DB=ingestion_plugins
    network_mode: host
    restart: always
    depends_on:
      redis:
        condition: service_started
      mongodb:
        condition: service_started
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  # Ingestion Plugins Worker - Celery worker for plugin execution
  ingestion-plugins-worker:
    image: nvcr.io/nvstaging/blueprint/dfw-ingestion-plugins:${TAG:-26.08}
    build:
      context: ..
      dockerfile: ingestion-plugins/Dockerfile
    environment:
      - REDIS_URL=redis://localhost:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ELASTICSEARCH_URL=http://localhost:9200
      - ES_COLLECTION_NAME=${ES_COLLECTION_NAME:-flywheel}
      - MONGODB_URL=mongodb://localhost:27017
      - MONGODB_DB=ingestion_plugins
      - NVBUGS_DBSERVER=${NVBUGS_DBSERVER}
      - NVBUGS_DBUSER=${NVBUGS_DBUSER}
      - NVBUGS_DBPWD=${NVBUGS_DBPWD}
      - NVBUGS_DBNAME=${NVBUGS_DBNAME}
    network_mode: host
    command: ["uv", "run", "celery", "-A", "src.celery_app:celery_app", "worker", "--loglevel=info", "--concurrency=4", "--queues=ingestion_plugins", "-n", "plugin_worker@%h"]
    restart: always
    depends_on:
      redis:
        condition: service_started
      mongodb:
        condition: service_started
    # Worker does not run HTTP server; check that this container's Celery worker responds to ping
    healthcheck:
      test: ["CMD-SHELL", "uv run celery -A src.celery_app:celery_app inspect ping -d plugin_worker@$$HOSTNAME -t 5 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # Datastores
  # - Redis is the Celery broker and result backend
  # - MongoDB is the database for the API
  # - Elasticsearch is the database for the logging proxy
  redis:
    image: redis:7.4.7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: always

  mongodb:
    image: mongo:7.0.25
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    environment:
      - MONGO_LOG_LEVEL=error
    command: >
      mongod --quiet
      --setParameter diagnosticDataCollectionEnabled=false
      --setParameter logComponentVerbosity='{ "network": { "verbosity": 0 }, "command": { "verbosity": 0 }, "control": { "verbosity": 0 } }'
    restart: always
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5

  # Elasticsearch is the NMP data pool — only started for the nmp backend.
  # DEFT sources its data pool from the AOI Storage Backend / object store, so a
  # deft deployment does not run this service (run via `COMPOSE_PROFILES=nmp`).
  elasticsearch:
    profiles: ["nmp"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.7
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.routing.allocation.disk.watermark.low=99%
      - cluster.routing.allocation.disk.watermark.high=99%
      - cluster.routing.allocation.disk.watermark.flood_stage=99%
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - logger.org.elasticsearch=ERROR
      - logger.org.elasticsearch.cluster=ERROR
      - logger.org.elasticsearch.discovery=ERROR
      - logger.org.elasticsearch.gateway=ERROR
      - logger.org.elasticsearch.indices=ERROR
      - logger.org.elasticsearch.node=ERROR
      - logger.org.elasticsearch.transport=ERROR
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    restart: always
    ulimits:
      memlock:
        soft: -1
        hard: -1

  # MLflow: opt-in for NMP (`mlflow` profile) but part of every DEFT deployment
  # (`deft` profile) — the AOI loop's registry (candidate registration, alias
  # trail, baseline resolution, HITL approvals) runs through it.
  mlflow:
    profiles: ["mlflow", "deft"]
    image: ghcr.io/mlflow/mlflow:v3.6.0
    command: mlflow server --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlruns  # Persistent storage for artifacts
    restart: always

volumes:
  elasticsearch-data:
  redis-data:
  mongodb-data:
  mlflow-data:
  celery-beat-data:
