# NMP Demo Values Configuration for Data Flywheel Blueprint (NMP 26.03)
# This file contains optional overrides for the upstream `nemo-platform` Helm chart.
#
# ⚠️ NMP 26.03 migration notes:
# 1. The `customizer.customizationTargets` block (used in NMP <= 25.12 to pre-populate
#    Customizer "targets") was removed in 26.03. Targets are now Model Entities and
#    are created on demand by DFW (see `src/lib/nemo/customizer.py::create_target`).
#    DFW will create the entity for any base model used by a customization job, so no
#    pre-provisioning is required here.
#
# 2. The legacy `nemo-operator` subchart was replaced by `k8s-nim-operator` (managed
#    by the upstream `nemo-platform` chart). The kube-rbac-proxy image override is no
#    longer needed; the upstream chart pins a CVE-patched image directly.
#
# 3. `MAX_PENDING_JOB_MINUTES` is no longer a customizer env var in 26.03. Job pending
#    timeout is configured via the platform-level Job Controller (`core.controller`).
#    For long multi-stage runs, use `core.controller.env` to set the equivalent value.
#
# Usage:
#   helm install nemo-platform <chart> -f nmp-demo-values.yaml
#   OR
#   helm upgrade nemo-platform <chart> -f nmp-demo-values.yaml

# Multi-node networking is opt-in in 26.03; enable for cloud-specific NCCL configs.
multinodeNetworking:
  aws:
    enabled: false
  azure:
    enabled: false
  gcp:
    enabled: false
  oci:
    enabled: false

# Use the in-chart PostgreSQL by default (single-node demo).
postgresql:
  enabled: true

# Job controller — extend pending timeout for long multi-stage customization jobs.
# Adjust based on dataset size and expected training time.
core:
  controller:
    env:
      # Maximum time (minutes) a job may stay in pending before the controller
      # considers it stuck and cancels it. Default is 30; raise for large datasets.
      MAX_PENDING_JOB_MINUTES: "180"

# k8s-nim-operator — required for NIM deployments. Disable if you have an existing
# NIM Operator installation in the cluster.
k8s-nim-operator:
  enabled: true

# Ingress — DFW resolves nemo.test/nim.test/data-store.test via /etc/hosts to the
# minikube IP. In NMP 26.03 the platform is consolidated, so a single host name is
# enough; we keep three entries pointing at the same backend so existing DFW config
# (nemo_base_url / nim_base_url / datastore_base_url) keeps working.
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
  hosts:
    - name: "nemo.test"
      paths:
        - path: /
          pathType: Prefix
          service: '{{ include "nemo-platform.ingressBackendService" . }}'
          port: '{{ include "nemo-platform.ingressBackendPort" . }}'
    - name: "nim.test"
      paths:
        - path: /
          pathType: Prefix
          service: '{{ include "nemo-platform.ingressBackendService" . }}'
          port: '{{ include "nemo-platform.ingressBackendPort" . }}'
    - name: "data-store.test"
      paths:
        - path: /
          pathType: Prefix
          service: '{{ include "nemo-platform.ingressBackendService" . }}'
          port: '{{ include "nemo-platform.ingressBackendPort" . }}'
