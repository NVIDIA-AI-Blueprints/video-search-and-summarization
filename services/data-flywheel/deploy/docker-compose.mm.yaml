# ============================================================================
# AOI overlay — OUR services (DFW team owns DFW + Model Manager).
#
# The base compose (deploy/docker-compose.yaml, BACKEND=deft) brings up DFW
# (api + celery + beat) + infra (Mongo, Redis, MLflow). This overlay adds the
# Model Manager. The rest of the AOI loop is other teams' services, wired in as
# their own overlays:
#   - DEFT training service   → TAO/DEFT team (deft-service repo). For local
#     testing use deploy/docker-compose.deft-temp.yaml as a stand-in.
#   - Storage Backend, AL-Archiver, Inference MS, AOI Client → platform team.
#
#   BACKEND=deft COMPOSE_PROFILES=deft docker compose \
#     -f deploy/docker-compose.yaml \
#     -f deploy/docker-compose.mm.yaml \
#     [-f deploy/docker-compose.deft-temp.yaml] \
#     [-f <platform-team-overlay>.yaml] up --build -d
#
# network_mode: host matches the base — DFW reaches the Model Manager at
# localhost:8090 (per model_manager.base_url). Relative build contexts resolve
# against the FIRST -f file's directory (deploy/).
# ============================================================================
services:
  # --- Model Manager (Infer Model Manager) ---------------------------------
  model-manager:
    image: nvcr.io/nvstaging/blueprint/dfw-model-manager:${TAG:-26.08}
    build:
      context: ../model-manager          # data-flywheel-blueprint/model-manager
      dockerfile: Dockerfile
    environment:
      - MODEL_MANAGER_CLIENT=aoi          # serving adapter (see adapters/registry)
      - MODEL_MANAGER_MODEL_REPO_PATH=/models
      # >>> PLATFORM-TEAM services — point at the real Inference MS + AOI Client
      # their overlay exposes. Defaults are placeholders (pull→serve won't
      # complete without them).
      - MODEL_MANAGER_AOI_INFERENCE_URL=${AOI_INFERENCE_URL:-http://localhost:8081}
      - MODEL_MANAGER_AOI_CLIENT_URL=${AOI_CLIENT_URL:-http://localhost:8082}
      # Object-store READ creds to pull checkpoints (see object-store-data-movement.md).
      # Optional pre-load engine build. EMPTY (the default) means this
      # deployment has no builder and the step is skipped entirely -- AOI builds
      # inside its own load and needs none.
      - MODEL_MANAGER_BUILDER_URL=${MODEL_MANAGER_BUILDER_URL:-}
      # Name the attached streams on every routing write. Inert while CLIENT=aoi
      # above -- the AOI adapter has its own routing client -- and listed here so
      # an overlay that flips CLIENT to `unified` against RTVI-CV can find it.
      # RTVI-CV does not re-bind an already-attached stream on a default-only
      # write and exits when the promotion rebinds it against the outgoing
      # engine; AOI Inference REJECTS the field, so it stays false there.
      #
      # `:-false`, NOT the `:-` idiom used above. This is a bool: builder_url is
      # `str | None` and reads an empty string as OFF, but an empty string is a
      # pydantic ValidationError for a bool, and settings are constructed at
      # import -- so `${VAR:-}` here is a container crashloop, not a default.
      - MODEL_MANAGER_UNIFIED_STREAM_ROUTES=${MODEL_MANAGER_UNIFIED_STREAM_ROUTES:-false}
      - MODEL_MANAGER_OBJECT_STORE_ENDPOINT_URL=${OBJECT_STORE_ENDPOINT_URL:-}
      - MODEL_MANAGER_OBJECT_STORE_ACCESS_KEY_ID=${OBJECT_STORE_ACCESS_KEY_ID:-}
      - MODEL_MANAGER_OBJECT_STORE_SECRET_ACCESS_KEY=${OBJECT_STORE_SECRET_ACCESS_KEY:-}
    # Shared model repo is written by MM (this uid) AND the Inference MS exporter
    # (a DIFFERENT uid) — the load does an in-place .pth -> onnx -> plan export in
    # the same version dir. Put both services in a common supplementary group so
    # neither hits PermissionError; the volume itself must be group-owned + carry a
    # default ACL (see deploy note below). No same-uid change / no code change.
    group_add: ["${AOI_MODEL_REPO_GID:-2000}"]
    volumes:
      # Shared PVC = the Triton model repo. The Inference MS must mount the SAME
      # volume (canonical layout {repo}/{model}/{version}/) so a pull here is
      # load-by-{name,version} there. It is `external` so both compose PROJECTS
      # reference one volume (a non-external volume is project-name-prefixed, so
      # the two stacks would NOT actually share it).
      - aoi-model-repo:/models
    network_mode: host                    # serves :8090 per model_manager.base_url
    restart: unless-stopped

volumes:
  # HOST-ROOT PREREQUISITE (not optional): a fresh `docker volume create` is root:root 0755,
  # so `group_add` alone gives group membership but no write bit → first write is EACCES.
  # Provision once on the docker host BEFORE bringing the loop up — setgid on DIRS ONLY (so
  # the shared group is inherited) and a DEFAULT ACL (so new files are group-writable
  # regardless of umask). The plain `-m` pass also fixes anything written before the ACL:
  #   docker volume create aoi-model-repo
  #   R=$(docker volume inspect -f '{{.Mountpoint}}' aoi-model-repo)
  #   GID=${AOI_MODEL_REPO_GID:-2000}                    # MUST equal group_add above, the chgrp
  #                                                       # here, AND the Inference MS overlay's group
  #   sudo chgrp -R "$GID" "$R"
  #   sudo find "$R" -type d -exec chmod 2775 {} +       # group rwx + setgid on dirs only
  #   sudo find "$R" -type f -exec chmod 0664 {} +       # group rw, no setgid/exec on files
  #   sudo setfacl -R -m g:$GID:rwx -d -m g:$GID:rwx "$R"   # existing (-m) + default (-d)
  #   getfacl "$R"    # sanity: mask::rwx (a later `chmod g-w` on a file silently drops group write)
  # Caveat: a Docker `local` volume is PER-HOST — works only if MM + the Inference MS run on
  # the SAME host. Cross-host needs NFS RWX (matching numeric GID everywhere) or, in k8s,
  # securityContext.fsGroup/supplementalGroups. A future unified AOI compose folds this
  # volume + GID + provisioning into one project (no external volume, no cross-overlay GID
  # duplication). The Inference MS overlay mounts this same volume at its triton_model_repo.
  aoi-model-repo:
    external: true
    name: aoi-model-repo        # explicit unprefixed cross-team name (both stacks reference this)
