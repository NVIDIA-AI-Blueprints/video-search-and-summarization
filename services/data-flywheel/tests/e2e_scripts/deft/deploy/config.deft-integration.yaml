# ============================================================================
# DEFT INTEGRATION config — DFW against the REAL microservices.
#
# Copy of the production config shape (config/config.deft.yaml) with the
# integration-run switch points marked. DFW + Model Manager come up locally
# (this repo owns both); DEFT service and Storage Backend are EXTERNAL —
# fill in the URLs their teams provide.
#
# Credentials ride env vars in the DFW containers (see the matching overlay
# docker-compose.deft-integration.yaml): DEFT_API_KEY, STORAGE_BACKEND_API_KEY.
# ============================================================================
backend:
  kind: deft

logging_config:
  level: "INFO"

mlflow_config:
  enabled: true
  tracking_uri: "http://localhost:5000"   # local MLflow from the deft profile
  experiment_name_prefix: "data-flywheel-aoi-integration"
  artifact_location: "./mlruns"

deft_config:
  # >>> SWITCH POINT: real DEFT service base URL (serves /v1/* directly).
  # Local simulate-mode fallback: http://localhost:9100
  deft_base_url: "http://localhost:9100"
  # >>> SWITCH POINT: real AOI Storage Backend (/v1/snapshot, /v1/kpi, /v1/results).
  storage_backend_url: "http://localhost:9000/storage"
  # >>> SWITCH POINT: the shared object store bucket/prefix.
  object_store_uri: "s3://aoi-artifacts"
  api_key_env: "DEFT_API_KEY"
  storage_api_key_env: "STORAGE_BACKEND_API_KEY"

model_manager:
  # Model Manager runs from this repo (model-manager/) on the host.
  base_url: "http://localhost:8090"
  timeout: 30.0

aoi_job_config:
  use_case: "aoi"
  model_name: "changenet-aoi"
  selection:
    mode: "query"
    filters:
      created_after: "1970-01-01T00:00:00Z"
  eval:
    # REAL DEFT metric vocabulary: FAR_pct is a PERCENT (the mocks' `far` is a
    # fraction — do not mix them). Confirm thresholds with the DEFT team.
    kpi_target:
      - {metric: "FAR_pct", op: "<=", threshold: 1.0}
  deft:
    config:
      model:
        # >>> SWITCH POINT: first-rollout baseline checkpoint in the REAL
        # object store (later runs resolve the baseline from MLflow).
        # A TRAILING SLASH means a multi-file model directory.
        checkpoint: "s3://aoi-models/baseline/1.0.0/model.onnx"
      pipeline:
        kpi_target: "FAR_pct <= 1.0"
      training:
        epochs: 3
  # Start integration runs fully automated; flip HITL gates on once the loop
  # is proven. NOTE: the chain's wait_for_promotion stage serializes whole
  # flywheel runs — a pending approval holds the run AND every queued run
  # behind it until approved or cancelled.
  promotion_policy:
    hitl:
      pull: false
      deploy: false
      canary: false
      full: false
    canary_steps:
      steps: [5, 25]
    # Online eval-harness verdict thresholds — confirm with the AOI team what
    # the real online sample stream can sustain before tightening.
    eval_harness:
      thresholds:
        recall: 0.99
        precision: 0.90
        agreement: 0.95
        false_accept_rate: 0.001
      min_sample_size: 100
    # Bounds ONE Model Manager swap (pull/stage/activate readiness), not the
    # whole rollout. A REAL Model Manager pulls real weights — give it 5 min
    # (the e2e mock uses 2s x 30; a real pull can easily exceed that 60s).
    poll_interval_s: 5.0
    poll_max_attempts: 60
    auto_rollback_on_regression: true
