# ============================================================================
# DEFT deployment-TEST configuration (tests/e2e_scripts/deploy/ overlay —
# deploy/ holds only production files). Also the template for a REAL deft
# deployment config: replace the four mock URLs with the real service URLs.
#
# Same shape as config/config.deft.yaml, but every externally-delivered service
# points at the AOI-loop mock microservices (tests/mock_services, one process on
# host port 9000 with per-service path prefixes) and MLflow points at the real
# compose `mlflow` service. All compose services run with network_mode: host,
# so `localhost` reaches both the mocks and the sibling containers.
# ============================================================================

backend:
  kind: deft

logging_config:
  level: "INFO"

# Real MLflow (started by the `deft` compose profile) — registration + alias
# trail are real. Pinned on: the AOI loop requires the registry.
mlflow_config:
  enabled: true
  tracking_uri: "http://localhost:5000"
  experiment_name_prefix: "data-flywheel-aoi-e2e"
  artifact_location: "./mlruns"

# DEFT: the REAL deft-service (simulate mode) on :9100; Storage Backend /
# Model Manager / online-eval sets remain the mock services on :9000.
# Start it from the deft-service repo:
#   DEFT_EXECUTION_MODE=simulate uvicorn app.main:app --port 9100
# Auth is required (trusted mode: any bearer token is the identity) — the
# compose overlay sets DEFT_API_KEY=dfw-e2e on every DFW service.
# To fall back to the mock DEFT: deft_base_url: "http://localhost:9000/deft".
deft_config:
  deft_base_url: "http://localhost:9100"
  storage_backend_url: "http://localhost:9000/storage"
  object_store_uri: "s3://aoi-artifacts"
  # No aoi_results_url: online samples flow through the Storage Backend
  # eval-set design (POST /v1/results -> poll /v1/eval/{id} -> manifests),
  # which the mock implements — the e2e stack exercises the real contract.
  api_key_env: "DEFT_API_KEY"
  storage_api_key_env: "STORAGE_BACKEND_API_KEY"
  # Both use cases share the mock store, but they must SAY so: a non-empty map
  # makes `for_use_case` fail closed on anything undeclared, and an empty entry
  # is the declaration that it inherits everything above.
  use_case_endpoints:
    aoi: {}
    its: {}

model_manager:
  base_url: "http://localhost:9000/mm"
  timeout: 30.0

aoi_job_config:
  use_case: "aoi"
  model_name: "changenet-aoi"
  selection:
    mode: "query"
    filters:
      created_after: "1970-01-01T00:00:00Z"
  eval:
    # DFW's deterministic offline-gate criteria, matched to the metrics the
    # REAL deft-service reports (simulate mode emits FAR_pct in PERCENT and
    # mAP50; final synthetic values ~0.5% / 0.9). NOTE the naming/unit gap
    # vs the old mock ("far" as a fraction): the gate checks whatever DEFT
    # actually returns, so kpi_target must speak the service's vocabulary.
    # (ResultsResponse.metrics carries ONLY FAR_pct today — mAP50 exists just
    # per-iteration — so the gate can only verify FAR_pct. Flagged to the
    # DEFT team: richer results.metrics would allow stricter DFW gates.)
    kpi_target:
      - {metric: "FAR_pct", op: "<=", threshold: 1.0}
  deft:
    config:
      model:
        # First-rollout baseline checkpoint (later runs resolve from MLflow).
        checkpoint: "s3://aoi-models/baseline/1.0.0/model.onnx"
      pipeline:
        kpi_target: "FAR < 0.1% at recall=100%"
      training:
        epochs: 3
  # Fully automated rollout so the deployment test needs no human in the loop;
  # short canary ladder + fast swap polling to keep wall-clock reasonable
  # (advancement still waits on the online-eval beat, every 60s).
  promotion_policy:
    hitl:
      pull: false
      deploy: false
      canary: false
      full: false
    canary_steps:
      steps: [5, 25]
    eval_harness:
      thresholds:
        recall: 0.99
        precision: 0.90
        agreement: 0.95
        false_accept_rate: 0.001
      min_sample_size: 100
    poll_interval_s: 2.0
    poll_max_attempts: 30
    auto_rollback_on_regression: true

its_job_config:
  use_case: "its"
  model_name: "gdino-its"
  model_format: "onnx"
  selection:
    mode: "query"
    filters:
      created_after: "1970-01-01T00:00:00Z"
  kpi:
    pull_from_storage: true
  deft:
    profile: smart-city-object-detection
  eval:
    # DELIBERATE DIVERGENCE from the shipped its_job_config, which gates on
    # `macro_ap >= 0.55`. Simulate mode can never satisfy that: the
    # `its_active_learning` workflow has no `evaluate` stage, so deft-service
    # never populates per_iteration_metrics and ResultsResponse.metrics carries
    # FAR_pct alone — a fixed 5.0 from the fallback. Gating on the metric DEFT
    # actually reports is what lets this scenario reach promotion at all; the
    # shipped block is driven instead by the `shipped_gate` scenario, which
    # asserts it fails closed with reason=metric-not-reported.
    # Threshold is 10.0, not the AOI block's 1.0: 1.0 could never pass either.
    kpi_target:
      - {metric: "FAR_pct", op: "<=", threshold: 10.0}
  promotion_policy:
    # Mirrors the shipped policy: shadow then full, no canary, online eval off.
    # `full: true` is the point — the run must park at pending_approval so the
    # scenario can drive the public approve endpoint.
    hitl:
      pull: false
      deploy: false
      canary: true
      full: true
    deployment_stages:
      shadow: true
      canary: false
    eval_harness:
      enabled: false
    poll_interval_s: 2.0
    poll_max_attempts: 30
