# ============================================================================
# DEFT INTEGRATION overlay — the real DFW stack against REAL microservices.
#
# Same mechanics as the e2e overlay (docker-compose.deft-e2e.yaml), but mounts
# config.deft-integration.yaml (real service URLs) and forwards the real
# credentials from the host environment. From the repo root:
#
#   export DEFT_API_KEY=...                # real DEFT service bearer
#   export STORAGE_BACKEND_API_KEY=...     # real Storage Backend bearer
#   BACKEND=deft COMPOSE_PROFILES=deft docker compose \
#       -f deploy/docker-compose.yaml \
#       -f tests/e2e_scripts/deft/deploy/docker-compose.deft-integration.yaml \
#       up --build -d
#
# NOTE: relative host paths resolve against the FIRST -f file's directory
# (deploy/), hence the ../tests/... prefixes.
# ============================================================================

services:
  api:
    environment:
      - DFW_CONFIG_PATH=/legal/source/config/config.deft-integration.yaml
      - DEFT_API_KEY=${DEFT_API_KEY:?export DEFT_API_KEY (real DEFT service bearer) before compose up/down}
      - STORAGE_BACKEND_API_KEY=${STORAGE_BACKEND_API_KEY:?export STORAGE_BACKEND_API_KEY (real Storage Backend bearer) before compose up/down}
    volumes:
      - ../tests/e2e_scripts/deft/deploy/config.deft-integration.yaml:/legal/source/config/config.deft-integration.yaml:ro
      - ../src:/legal/source/src

  celery_worker:
    environment:
      - DFW_CONFIG_PATH=/legal/source/config/config.deft-integration.yaml
      - DEFT_API_KEY=${DEFT_API_KEY:?export DEFT_API_KEY (real DEFT service bearer) before compose up/down}
      - STORAGE_BACKEND_API_KEY=${STORAGE_BACKEND_API_KEY:?export STORAGE_BACKEND_API_KEY (real Storage Backend bearer) before compose up/down}
    volumes:
      - ../tests/e2e_scripts/deft/deploy/config.deft-integration.yaml:/legal/source/config/config.deft-integration.yaml:ro
      - ../src:/legal/source/src

  celery_parent_worker:
    environment:
      - DFW_CONFIG_PATH=/legal/source/config/config.deft-integration.yaml
      - DEFT_API_KEY=${DEFT_API_KEY:?export DEFT_API_KEY (real DEFT service bearer) before compose up/down}
      - STORAGE_BACKEND_API_KEY=${STORAGE_BACKEND_API_KEY:?export STORAGE_BACKEND_API_KEY (real Storage Backend bearer) before compose up/down}
    volumes:
      - ../tests/e2e_scripts/deft/deploy/config.deft-integration.yaml:/legal/source/config/config.deft-integration.yaml:ro
      - ../src:/legal/source/src

  celery_beat:
    environment:
      - DFW_CONFIG_PATH=/legal/source/config/config.deft-integration.yaml
      - DEFT_API_KEY=${DEFT_API_KEY:?export DEFT_API_KEY (real DEFT service bearer) before compose up/down}
      - STORAGE_BACKEND_API_KEY=${STORAGE_BACKEND_API_KEY:?export STORAGE_BACKEND_API_KEY (real Storage Backend bearer) before compose up/down}
    volumes:
      - ../tests/e2e_scripts/deft/deploy/config.deft-integration.yaml:/legal/source/config/config.deft-integration.yaml:ro
      - ../src:/legal/source/src

  # NMP-only ingestion services: not part of a deft deployment.
  ingestion-plugins-api:
    profiles: ["ingestion"]
  ingestion-plugins-worker:
    profiles: ["ingestion"]
