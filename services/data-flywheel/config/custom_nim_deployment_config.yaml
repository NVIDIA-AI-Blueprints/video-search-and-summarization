# Custom NIM Build & Push Configuration
# This file contains default configuration for building customized NIM Docker images
# and pushing them to a container registry (NGC or JFrog).
#
# Uses crane (Google's go-containerregistry) to append model layers and push
# via pure HTTP registry API calls — truly rootless, no Docker daemon required.
#
# Usage:
#   - Copy this file and customize for your environment
#   - Override values via platform_config in the API request
#   - Override Docker credentials via environment variables:
#       CUSTOM_NIM_DOCKER_USERNAME, CUSTOM_NIM_DOCKER_PASSWORD
#   - Data store token uses the standard HF_TOKEN env var

# Crane Configuration
# Uses crane to append model layers and push via pure HTTP registry API calls.
# No Docker daemon, no user namespaces, no root required.
crane:
  # Crane container image (debug variant includes a BusyBox shell)
  image: "gcr.io/go-containerregistry/crane:debug"
  # Kubernetes namespace for Crane Jobs (empty = auto-detect from in-cluster)
  namespace: ""
  # ServiceAccount with RBAC to create Jobs/Secrets in the namespace
  service_account: "dfw-crane-builder"
  # PVC shared between the celery worker pod and the Crane pod
  pvc_name: "crane-build-context"
  # Mount path of the PVC inside the celery worker pod
  build_context_dir: "/crane-workspace"
  # Existing K8s secret (type: kubernetes.io/dockerconfigjson) with all registry creds.
  # If empty, a temporary secret is created from docker_credentials above.
  registry_secret: ""
  # activeDeadlineSeconds on the Crane Job (1 hour)
  job_timeout_seconds: 3600
  # Auto-cleanup finished Jobs after this many seconds (5 min)
  job_ttl_seconds_after_finished: 300
  # How often to poll the Job status (seconds)
  poll_interval_seconds: 10

# Registry Configuration - where the customized NIM image is pushed
registry:
  # Registry type: "ngc" or "jfrog" (informational, may drive future registry-specific logic)
  type: "ngc"
  # Target registry hostname
  target_registry: "nvcr.io"
  # Repository path on the registry
  target_repo: "nvstaging/blueprint"
  # Image name within the target repo
  target_image_name: "dfw-llama-3.2-nv-embedqa-1b-customized"
  # Image tag for the customized build
  target_tag: "0.0.1"

  # --- JFrog / Artifactory alternative ---
  # Uncomment the lines below (and comment out the NGC values above) to push to JFrog instead.
  # Also provide JFrog credentials in the jfrog_credentials section below.
  # type: "jfrog"
  # target_registry: "artifactory.nvidia.com"
  # target_repo: "sw-blueprint-dfw-docker-local"
  # target_image_name: "dfw-llama-3.2-nv-embedqa-1b-customized"
  # target_tag: "0.0.1"

# NGC / Docker Credentials — used to pull the base NIM image from nvcr.io
# and to push when the target is NGC.  Defaults to $oauthtoken / NGC_API_KEY.
# Resolution: CUSTOM_NIM_DOCKER_USERNAME env → yaml → "$oauthtoken"
#             CUSTOM_NIM_DOCKER_PASSWORD env → yaml → NGC_API_KEY env
docker_credentials:
  username: ""
  password: ""

# JFrog Artifactory Credentials — only needed when pushing to JFrog (registry_type: "jfrog").
# The base NIM image is always pulled from nvcr.io using NGC credentials above.
# Resolution: CUSTOM_NIM_JFROG_USERNAME env → yaml → "" (not used)
#             CUSTOM_NIM_JFROG_PASSWORD env → yaml → "" (not used)
jfrog_credentials:
  username: ""
  password: ""

# Base NIM Image - the source NIM image to customize
base_image:
  # Full image reference including tag. Pulled before building the customized image.
  image: "nvcr.io/nim/nvidia/llama-3.2-nv-embedqa-1b-v2:1.9.0"

# DataStore Configuration - where model weights are downloaded from
datastore:
  # DataStore base URL (no path). The adapter appends /v1/hf internally for
  # HuggingFace-compatible downloads — same pattern as the DataRobot adapter.
  endpoint: "http://data-store.test"
  # Authentication token for the data store (uses HF_TOKEN env var)
  token: "dummy"

# NIM Runtime Configuration - baked into the image as environment variables
nim_runtime:
  # The model name NIM will serve (used for the /v1/models endpoint)
  model_name: "nvidia/llama-3.2-nv-embedqa-1b-v2"

# Build Options
build_options:
  # Remove local model-store directory after a successful build
  cleanup_after_build: true
  # Skip the weight download step (use if model-store is pre-populated)
  skip_download: false
  # Max download retry attempts
  download_max_retries: 3
  # Delay between download retries in seconds
  download_retry_delay: 10

# Timeout Configuration (in seconds)
timeouts:
  # Timeout for the model download step (1 hour default for large models).
  # The crane Job itself has its own activeDeadlineSeconds (see crane.job_timeout_seconds).
  download: 3600
