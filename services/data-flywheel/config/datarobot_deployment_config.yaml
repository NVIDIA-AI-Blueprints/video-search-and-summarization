# DataRobot Model Deployment Configuration
# This file contains default configuration for deploying models to DataRobot via Kubernetes
#
# Usage:
#   - Copy this file and customize for your deployment
#   - Override values via platform_config in the API request
#   - Required fields: deployment.id (must be provided per deployment)

# DataStore Configuration - where models are downloaded from
datastore:
  # DataStore base URL (no path). DataRobot adapter appends /v1/hf for HF-compatible download.
  endpoint: "https://dataflywheel-data-store.prd.astra.nvidia.com"
  # Kubernetes secret name containing HF_TOKEN for DataStore authentication
  token_secret: "datastore-hf-token"
  # Model puller image - Python image with pip for installing huggingface_hub
  puller_image: "urm.nvidia.com/nvidia-nvcr-docker-remote/nvidia/pytorch:24.01-py3"

# Kubernetes Deployment Configuration
deployment:
  # Kubernetes namespace where NIM/LRS is deployed
  namespace: "dr-app"
  # DataRobot Deployment ID (user-facing, visible in DataRobot UI) - REQUIRED per deployment
  # The adapter resolves the internal LRS name automatically via k8s label lookup.
  # id: "69326f63a1d39690a7ed0d4e"  # Example - must be provided in API request

# Storage Configuration
storage:
  # Kubernetes storage class for PVC
  class: "nfs41pnfs-sc"
  # PVC size (should be larger than model size)
  size: "100Gi"

# Image Pull Configuration
image_pull:
  # Kubernetes secret for pulling images (ngc-docker-pullsecret has urm.nvidia.com access)
  secret: "ngc-docker-pullsecret"

# DataRobot API Configuration
datarobot_api:
  # DataRobot API base URL for inference endpoints
  url: "https://datarobot.prd.astra.nvidia.com"

# Security Context Configuration (for ASTRA/OpenShift)
# Note: dr-app namespace uses UID range [1000990000, 1000999999]
security_context:
  run_as_user: 1000990000
  run_as_group: 1000990000
  fs_group: 1000990000

# Timeout Configuration (in seconds)
timeouts:
  # Timeout for PVC to bind (5 minutes default, increase for slow storage)
  pvc_bind: 300
  # Timeout for model download job (1 hour default for large models)
  download: 3600
  # Timeout for deployment rollout per attempt (5 minutes default).
  # Successful NIM startups complete in ~60-90s; Triton stub failures
  # surface within ~30-60s and never recover, so 300s gives ample
  # headroom without wasting time on stuck pods.
  rollout: 300
  # Max pod restart retries during rollout. If a pod fails to become healthy
  # (e.g. Triton stub process startup failure), the stuck pod is deleted and
  # Kubernetes recreates it from the same deployment spec.
  rollout_max_pod_retries: 3
  # Seconds to wait for a new pod to schedule after deleting a stuck one
  pod_reschedule_wait: 30

# Model Type Configuration
# Determines the inference endpoint path
# Options: embedding, chat, reranking, vision
model:
  type: "embedding"
