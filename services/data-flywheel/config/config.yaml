# ============================================================================
# SYSTEM CONFIGURATION (Never changes - managed by system)
# ============================================================================

# Execution backend selection. `kind` chooses the backend provider
# (currently "nmp"; "deft" reserved for a future implementation).
# The BACKEND environment variable overrides this at runtime.
backend:
  kind: nmp

nmp_config:
  nemo_base_url: "http://nemo.test"
  nim_base_url: "http://nim.test"
  datastore_base_url: "http://data-store.test"
  # All resources created in NeMo Microservices Platform (NMP) will be namespaced to this value
  nmp_namespace: "dfwbp"

# Logging configuration
logging_config:
  level: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR, CRITICAL

# MLflow configuration
# Note: MLflow is controlled by COMPOSE_PROFILES environment variable
# Set COMPOSE_PROFILES=mlflow to enable both the MLflow service and configuration
mlflow_config:
  # enabled: automatically set based on COMPOSE_PROFILES environment variable
  tracking_uri: "http://0.0.0.0:5000"
  experiment_name_prefix: "data-flywheel"
  artifact_location: "./mlruns"

llm_judge_config:
  # deployment_type: "remote"
  # url: "https://integrate.api.nvidia.com/v1/chat/completions"
  # model_name: "meta/llama-3.3-70b-instruct"

  # To spin up a dedicated NIM in your cluster, comment the above uncomment and fill these:
  deployment_type: "local"
  model_name: "meta/llama-3.3-70b-instruct"
  context_length: 32768
  gpus: 4
  pvc_size: 25Gi
  tag: "1.8.5"

# ============================================================================
# JOB-LEVEL CONFIGURATION (Can be changed by the user using the Configuration APIs)
# ============================================================================

llm_job_config:
  nims:
    - model_name: "meta/llama-3.2-1b-instruct"
      model_type: "llm"
      context_length: 8192
      gpus: 1
      pvc_size: 25Gi
      tag: "1.8.3"
      customization_enabled: true
      customizer_configs:
        gpus: 1
        max_seq_length: 8192
        # NMP 26.03: a bare string target resolves to the storage-less system/
        # entity, so the customizer pod loads an empty /var/run/scratch/job/model
        # and training crashes ("Repo id must be in the form ..."). Provide a
        # CustomizerTarget with model_uri so create_target provisions an
        # HF-backed weights fileset (via the dfwbp/hf-token secret) at
        # dfwbp/meta-llama-3-2-1b-instruct — the same name the base NIM serves,
        # so the trained LoRA adapter attaches to the running NIM.
        target:
          name: "meta/llama-3.2-1b-instruct@2.0"
          base_model: "meta/llama-3.2-1b-instruct"
          model_uri: "hf://meta-llama/Llama-3.2-1B-Instruct"
          precision: "bf16"
          description: "Meta Llama 3.2 1B Instruct base for LoRA customization"
        # pod_spec:  # Optional: Kubernetes pod specification for customization jobs
        #   tolerations:  # Tolerations for GPU nodes
        #     - key: nvidia.com/gpu
        #       operator: Equal
        #       value: "true"
        #       effect: NoSchedule
        #     - key: astra.nvidia.com/reserved
        #       operator: Equal
        #       value: nemo
        #       effect: NoSchedule
        #   node_selectors:  # Target specific GPU types
        #     nvidia.com/gpu.product: "NVIDIA-A100-80GB"
        #   annotations:  # Pod annotations
        #     sidecar.istio.io/inject: "false"

    # - model_name: "meta/llama-3.2-3b-instruct"
    #   model_type: "llm"
    #   context_length: 32768
    #   gpus: 1
    #   pvc_size: 25Gi
    #   tag: "1.8.3"
    #   customization_enabled: true
    #   customizer_configs:
    #     gpus: 1
    #     max_seq_length: 8192
    #     target:
    #       name: "meta/llama-3.2-3b-instruct@2.0"
    #       target_type: "nemo"
    #       description: "Customization target for Meta Llama 3.2 3B"
    #       base_model: "meta/llama-3.2-3b-instruct"
    #       model_uri: "ngc://nvidia/nemo/llama-3_2-3b-instruct:2.0"
    #       hf_endpoint: ""
    #       tokenizer: {}
    #       num_parameters: 3000000000
    #       precision: "bf16-mixed"
    #     pod_spec:  # Optional: Kubernetes pod specification for customization jobs
    #       tolerations:  # Tolerations for GPU nodes
    #         - key: nvidia.com/gpu
    #           operator: Equal
    #           value: "true"
    #           effect: NoSchedule
    #         - key: astra.nvidia.com/reserved
    #           operator: Equal
    #           value: nemo
    #           effect: NoSchedule
    #       node_selectors:  # Target specific GPU types
    #         nvidia.com/gpu.product: "NVIDIA-A100-80GB"
    #       annotations:  # Pod annotations
    #         sidecar.istio.io/inject: "false"

    # - model_name: "meta/llama-3.1-8b-instruct"
    #   model_type: "llm"
    #   context_length: 32768
    #   gpus: 1
    #   pvc_size: 25Gi
    #   tag: "1.8.3"
    #   customization_enabled: true
    #   customizer_configs:
    #     gpus: 1
    #     max_seq_length: 8192
    #     target:
    #       name: "meta/llama-3.1-8b-instruct@2.0"
    #       target_type: "nemo"
    #       description: "Customization target for Meta Llama 3.1 8B"
    #       base_model: "meta/llama-3.1-8b-instruct"
    #       model_path: "llama-3_1-8b-instruct_2_0"
    #       model_uri: "ngc://nvidia/nemo/llama-3_1-8b-instruct-nemo:2.0"
    #       hf_endpoint: ""
    #       tokenizer: {}
    #       num_parameters: 8000000000
    #       precision: "bf16-mixed"
    #     pod_spec:  # Optional: Kubernetes pod specification for customization jobs
    #       tolerations:  # Tolerations for GPU nodes
    #         - key: nvidia.com/gpu
    #           operator: Equal
    #           value: "true"
    #           effect: NoSchedule
    #         - key: astra.nvidia.com/reserved
    #           operator: Equal
    #           value: nemo
