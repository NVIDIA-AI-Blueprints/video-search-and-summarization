[project]
name = "fbp"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.3",  # Security fix for GHSA-6mq8-rvhq-8wgg
    "elasticsearch==8.17.2",
    "fastapi>=0.115.12",
    "httpx>=0.28.1",
    "uvicorn>=0.34.0",
    "celery[redis]>=5.5.1",
    "openai>=1.12.0",
    "huggingface-hub>=0.20.3",
    "requests>=2.31.0",
    "pymongo>=4.12.0",
    "pydantic-settings>=2.9.1",
    "tiktoken>=0.9.0",
    "h11==0.16.0",
    "scikit-learn>=1.7.0",
    "mlflow==3.6.0",
    "pandas>=2.2.3",
    "starlette>=0.49.1",
    "fonttools==4.61.0",  # Security fix for RCE vulnerability (BDSA)
    "urllib3>=2.6.3",  # Security fix for GHSA-38jv-5279-wg99
    "kubernetes>=31.0.0",  # For DataRobot deployment adapter (K8s API client)
    "cryptography>=46.0.5",  # Security fix for GHSA-r6ph-v2qm-q3c2
    "protobuf>=6.33.5",  # Security fix for GHSA-7gcm-g887-7qv7
    "pyasn1>=0.6.2",  # Security fix for GHSA-63vm-454h-vhhq
    "pillow>=12.1.1",  # Security fix for GHSA-cfh3-3jmp-rvhc (transitive via mlflow→matplotlib)
]

[project.optional-dependencies]
# Build-time backend selection (see drafts/p2-backend-packaging-plan.md).
# Only the selected backend's deps are installed: `uv sync --extra nmp` (default
# backend) or `uv sync --extra deft`. A DEFT image therefore ships no nemo-platform.
nmp = ["nemo-platform==2.1.0.dev1+nightly20260422"]
deft = []  # placeholder — DEFT client deps added when the DEFT backend lands (P3)

[tool.uv.sources]
# NMP 26.03 EA — pinned to the nightly that still ships the customizer SDK
# (removed from main on 2026-05-07). Switch back to a public PyPI release
# once a GA build that re-exposes customization is published.
nemo-platform = { index = "nv-shared-pypi" }

[[tool.uv.index]]
name = "nv-shared-pypi"
url = "https://urm.nvidia.com/artifactory/api/pypi/nv-shared-pypi/simple"
explicit = true

[dependency-groups]
dev = [
    "ipython>=8.35.0",
    "jupyter>=1.1.1",
    "pandas>=2.2.3",
    "papermill>=2.6.0",
    "pytest>=8.3.5",
    "requests>=2.32.3",
    "pre-commit>=3.6.0",
    "ruff>=0.3.0",
    "licensecheck>=2025.1.0",
    "watchfiles>=1.0.5",
    "flower>=2.0.1",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.0",
    "watchdog>=6.0.0",
    "watchfiles>=1.0.5",
    "tabulate>=0.9.0",
    "matplotlib==3.10.3",
]

[tool.ruff]
# Target Python version
target-version = "py312"

# Line length
line-length = 100

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "third_party",
    "docs",
    "drafts"
]

# Auto-fix behavior
fix = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint]
# Enable specific rules
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "RUF"  # ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501"  # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# FastAPI uses Depends() and Query() in function argument defaults by convention
"src/api/**/endpoints.py" = ["B008"]

[tool.coverage.run]
omit = [
    # Pipeline files - orchestration code
    "src/tasks/pipelines/*",
    # API endpoints - better tested with integration tests
    "src/api/endpoints.py",
    # Entry point - no business logic
    "src/app.py",
]

[tool.coverage.report]
# Show missing lines in the report
show_missing = true
