[pytest]
# MV3DT BEV fusion test suite.
#   unit        - pure-Python tests for fusion logic; no docker, no GPU
#   integration - exercise the built vss-rt-cv-mv3dt-bev-fusion image + a broker; needs docker
#   e2e         - full warehouse compose deploy on the sample dataset; needs GPU + NGC assets
#   slow        - long-running tests (e2e / large fixtures)
markers =
    unit: pure-Python tests, no docker or GPU required
    integration: bring up the fusion image + Kafka/Redis via docker compose
    e2e: full warehouse pipeline on the sample dataset (GPU)
    slow: long-running tests

addopts = -ra
testpaths = unit integration e2e
# Keep the cache out of the repo so root-owned container runs don't clash with host runs.
cache_dir = /tmp/mv3dt_pytest_cache
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(message)s
