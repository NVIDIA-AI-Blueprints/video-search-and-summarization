# RTVI VLM BCD 3.2 benchmark configuration.
#
# Source requirements: BCD_VSS_3-2, "RTVI Benchmarking" / "RTVI VLM".
# The BCD 3.2 VLM profile uses:
#   - OSL: 1 and 100
#   - Chunk size: 10 seconds
#   - Model input resolution: 640x640
#   - Frame counts per chunk: 10, 20, 40, corresponding to ~2K, ~4K, ~8K vision tokens
#   - BCD 3 non-streaming video content: 10 s clip, 10 FPS, H.264, 1080p
#   - Non-streaming video request concurrency: [1, 16, 32, 64, 128]
#     Use --concurrency-levels 1 8 16 for AGX Thor and DGX Spark edge runs.
#
# setup downloads the BCD 10 FPS Artifactory clips to:
#   /opt/nvidia/rtvi/streams/perf/FPS10_Res1080p_Dur10sec_1.mp4
#   /opt/nvidia/rtvi/streams/perf/warehouse_gopro_10m_10fps.mp4
#   /opt/nvidia/rtvi/streams/perf/warehouse_gopro_60m_10fps.mp4
# BCD_10S_VIDEO_SOURCE_PATH can still override the canonical 10 s clip locally.

global:
  rtvi_backend: "http://localhost:8010/v1"
  output_dir: "rtvi-vlm-bcd-3-2-report-thor"

  vlm_gpus: [0]  # from NVIDIA_VISIBLE_DEVICES=0
  blocking_stream_delete: true
  stream_delete_timeout_seconds: 300

  gpu_monitoring:
    enabled: true
    interval_seconds: 1
    prometheus:
      enabled: true
      dcgm_exporter_url: "http://localhost:9400/metrics"
      node_exporter_enabled: true
      node_exporter_url: "http://localhost:9100/metrics"
      scrape_interval_seconds: 1

  generate_captions_params:
    temperature: 0.5
    max_tokens: 100
    enable_audio: false
    vlm_input_width: 640
    vlm_input_height: 640
    use_fps_for_chunking: false
    num_frames_per_second_or_fixed_frames_chunk: 40

  prompt: "Describe the key events in this video with timestamps."
  # BCD non-streaming request throughput measures generation, not the /files upload/delete path.
  # File-burst scenarios pre-upload a pool equal to the tested concurrency by default.
  reuse_uploaded_files: true

test_scenarios:
  # BCD 1: maximum live streams per GPU. The threshold is the BCD real-time
  # condition: VLM inference per chunk must stay below the 10 second chunk size,
  # with no chunk-ID gaps (`require_no_dropped_chunks` defaults to true).
  max_live_streams_test_1_token_2k:
    description: "BCD 3.2 max live streams, 640x640, 10 frames (~2K), OSL=1"
    benchmark_mode: "max_live_streams"
    generate_captions_params:
      vlm_input_width: 640
      vlm_input_height: 640
    videos:
      - name: "warehouse_cam_2k_single_token"
        rtsp_url: "rtsp://10.24.218.87:30562/live/warehouse_gopro_60m_10fps"
        unique_rtsp_url_per_stream: false
        chunk_sizes: [10]
        latency_threshold_seconds: 10
        initial_stream_count: 3
        chunk_overlap_duration: 0
        stability_check_interval: 60
        add_stream_count: 2
        binary_search_refinement: true
        required_stable_windows: 5
        required_unstable_windows: 2
        enable_latency_growth_instability_check: false
        generate_captions_params:
          temperature: 0.5
          max_tokens: 1
          use_fps_for_chunking: false
          num_frames_per_second_or_fixed_frames_chunk: 10
        prompt: "You are a warehouse monitoring system. Look for anomalies. Detect for a box being dropped, or for any property being damaged, or for anyone entering a restricted area. Answer Yes or No only."

  max_live_streams_test_100_token_2k:
    description: "BCD 3.2 max live streams, 640x640, 10 frames (~2K), OSL=100"
