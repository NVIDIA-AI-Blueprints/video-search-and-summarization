# RTVI Sample Performance Test Configuration
# This file demonstrates all benchmark modes using videos available in the RTVI container

# Global test settings
global:
  # RTVI backend URL for the API (can be overridden by RTVI_BACKEND env var)
  rtvi_backend: "http://localhost:8000/v1"

  # Output directory for test results
  output_dir: "rtvi-sample-perf-report"

  # GPU configuration
  vlm_gpus: [0]  # Adjust based on your system

  # GPU monitoring settings
  gpu_monitoring:
    enabled: true
    interval_seconds: 1

  # /generate_captions API parameters
  generate_captions_params:
    temperature: 0.7
    max_tokens: 150
    enable_audio: false

  # Default prompts
  prompt: "Describe the key events in this video with timestamps."

# Test scenarios
test_scenarios:

  # Mode 1: Single File Mode - Testing each video type
  single_file_test:
    description: "Demo single file processing with RTVI sample videos"
    benchmark_mode: "single_file"
    iterations: 2
    videos:
      # Traffic monitoring video
      - filepath: "/opt/nvidia/rtvi/streams/its.mp4"
        chunk_sizes: [10, 15]
        prompt: "You are an advanced intelligent traffic monitoring system. You must monitor and take note of all traffic related events like collision, unsafe maneuver, traffic violation, normal traffic flow, obstructed traffic flow etc. with relevant details. Note down all vehicles details in video like vehicle type. Make sure to capture details of emergency responder vehicles like police, ambulance, fire-truck, etc. Don't add vehicle license plate details. Don't add any details which are not present in the video frames. Start each event description with a start and end time stamp of the event."

      # Bridge inspection video
      - filepath: "/opt/nvidia/rtvi/streams/bridge.mp4"
        chunk_sizes: [10]
        prompt: "You are a bridge inspection system. Describe the condition of the bridge in the provided video. Start each event description with a start and end time stamp of the event"

      # Warehouse monitoring video
      - filepath: "/opt/nvidia/rtvi/streams/warehouse.mp4"
        chunk_sizes: [10]
        prompt: "You are a warehouse monitoring system. Describe the events in this warehouse and look for any anomalies. Start each sentence with start and end timestamp of the event."

      # Conference/presentation video
      - filepath: "/opt/nvidia/rtvi/streams/Jensen_AI_Summit_India_2024_clip.mp4"
        chunk_sizes: [20]
        prompt: "Write a concise and clear dense caption for the provided NVIDIA AI Summit video, focusing on the technologies and products."

  # Mode 2: File Burst Mode - Testing concurrent processing
  file_burst_test:
    description: "Demo concurrent file processing with varying loads"
    benchmark_mode: "file_burst"
    videos:
      # Short video for higher concurrency testing
      - filepath: "/opt/nvidia/rtvi/streams/its.mp4"
        chunk_sizes: [10]
        concurrency_levels: [1, 2, 4, 8]
        # target_latency_seconds: 60.0
        # target_latency_tolerance: 5.0
        prompts: "You are an advanced intelligent traffic monitoring system. You must monitor and take note of all traffic related events like collision, unsafe maneuver, traffic violation, normal traffic flow, obstructed traffic flow etc. with relevant details. Note down all vehicles details in video like vehicle type. Make sure to capture details of emergency responder vehicles like police, ambulance, fire-truck, etc. Don't add vehicle license plate details. Don't add any details which are not present in the video frames. Start each event description with a start and end time stamp of the event."

      # Medium video for moderate concurrency
      - filepath: "/opt/nvidia/rtvi/streams/bridge.mp4"
        chunk_sizes: [10]
        concurrency_levels: [1, 2, 4]
        prompts: "You are a bridge inspection system. Describe the condition of the bridge in the provided video. Start each event description with a start and end time stamp of the event"

      # Longer video for lower concurrency
      - filepath: "/opt/nvidia/rtvi/streams/warehouse.mp4"
        chunk_sizes: [10]
        concurrency_levels: [1, 2]
        prompt: "You are a warehouse monitoring system. Describe the events in this warehouse and look for any anomalies. Start each sentence with start and end timestamp of the event."

      # Conference video for diverse content testing
      - filepath: "/opt/nvidia/rtvi/streams/Jensen_AI_Summit_India_2024_clip.mp4"
        chunk_sizes: [10]
        concurrency_levels: [1, 2, 3]
        prompt: "Write a concise and clear dense caption for the provided NVIDIA AI Summit video, focusing on the technologies and products."

  # Mode 3: Max Live Streams Mode - Testing stream capacity
  # Note: These use hypothetical RTSP URLs for demonstration
  # In production, replace with actual RTSP stream URLs and corresponding captions
  max_live_streams_test:
    description: "Demo maximum concurrent live streams capacity"
    benchmark_mode: "max_live_streams"
    generate_captions_params:
      vlm_input_width: 448   # 4K VLM input width
      vlm_input_height: 448  # 4K VLM input height
    videos:
      # Traffic monitoring stream
      - name: "traffic_cam_1"
        rtsp_url: "rtsp://localhost:8554/traffic/cam1"  # Replace with actual RTSP URL
        chunk_sizes: [10]
        latency_threshold_seconds: 12
        initial_stream_count: 3
        chunk_overlap_duration: 2
        stability_check_interval: 60  # Seconds between stability checks (default: 60)
        required_stable_windows: 3  # Consecutive stable windows needed before adding streams (default: 3)
        required_unstable_windows: 2  # Consecutive unstable windows needed to declare degradation (default: 2)
        generate_captions_params:
          temperature: 0.5
          max_tokens: 100
          #prompt: "You are an advanced intelligent traffic monitoring system. You must monitor and take note of all traffic related events like collision, unsafe maneuver, traffic violation, normal traffic flow, obstructed traffic flow etc. with relevant details. Note down all vehicles details in video like vehicle type. Make sure to capture details of emergency responder vehicles like police, ambulance, fire-truck, etc. Don't add vehicle license plate details. Don't add any details which are not present in the video frames. Start each event description with a start and end time stamp of the event."
        prompt: "You are an advanced intelligent traffic monitoring system. You must monitor and take note of all traffic related events like collision, unsafe maneuver, traffic violation, normal traffic flow, obstructed traffic flow etc. with relevant details. Note down all vehicles details in video like vehicle type. Make sure to capture details of emergency responder vehicles like police, ambulance, fire-truck, etc. Don't add vehicle license plate details. Don't add any details which are not present in the video frames. Start each event description with a Yes for anomaly or No if there is no event, followed by description."

      # Traffic monitoring stream
      - name: "traffic_cam_1_single_token"
        rtsp_url: "rtsp://localhost:8554/traffic/cam1"  # Replace with actual RTSP URL
        chunk_sizes: [10]
        latency_threshold_seconds: 12
        initial_stream_count: 3
        chunk_overlap_duration: 2
        stability_check_interval: 60  # Seconds between stability checks (default: 60)
        required_stable_windows: 3  # Consecutive stable windows needed before adding streams (default: 3)
        required_unstable_windows: 2  # Consecutive unstable windows needed to declare degradation (default: 2)
        generate_captions_params:
          temperature: 0.5
          max_tokens: 1
        prompt: "You are an advanced intelligent traffic monitoring system. You must monitor and take note of all traffic related events like collision, unsafe maneuver, traffic violation, normal traffic flow, obstructed traffic flow etc. with relevant details. Note down all vehicles details in video like vehicle type. Make sure to capture details of emergency responder vehicles like police, ambulance, fire-truck, etc. Don't add vehicle license plate details. Don't add any details which are not present in the video frames. Just answer Yes for anomaly or No if there is none"


      # Warehouse monitoring stream
      - name: "warehouse_cam_1"
        rtsp_url: "rtsp://10.78.14.129:8554/warehouse/cam1"  # Replace with actual RTSP URL
        chunk_sizes: [15]
        latency_threshold_seconds: 20
        initial_stream_count: 2
        prompt: "You are a warehouse monitoring system. Describe the events in this warehouse and look for any anomalies. Start each sentence with start and end timestamp of the event."

  # Mode 4: VLM Captions Burst Test
  concurrency_test:
    description: "Test VLM caption generation performance with concurrent requests"
    benchmark_mode: "concurrency"
    videos:
      - rtsp_url: "rtsp://localhost:8554/traffic/cam1"  # Replace with actual RTSP URL
        chunk_sizes: [10]
        concurrency_levels: [1, 2, 4]
        # Example: Override VLM captions API params
        generate_captions_params:
          temperature: 0.5
          max_tokens: 100
        system_prompt: "You are a warehouse safety monitoring assistant that provides detailed video captions."
        prompt: "Write a concise and clear dense caption for the provided warehouse video, focusing on irregular or hazardous events such as boxes falling, workers not wearing PPE, workers falling, workers taking photographs, workers chitchatting, forklift stuck, etc. Start and end each sentence with a time stamp."
        target_latency_seconds: 60.0
        target_latency_tolerance: 5.0
