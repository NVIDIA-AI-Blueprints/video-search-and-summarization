# Default API Parameters for RTVI Performance Benchmarks
# All parameter names match the OpenAPI specification

# /generate_captions API defaults (for backend_type: "rtvi_vlm")
# Users can optionally add: enable_audio
# vlm_input_width, vlm_input_height, chunk_duration, chunk_overlap_duration, num_frames_per_second_or_fixed_frames_chunk
generate_captions_params:
  temperature: 0.7
  max_tokens: 85

# /generate_video_embeddings API defaults (for backend_type: "rtvi_embed")
# chunk_duration defaults to 10. Users can optionally add: chunk_overlap_duration, enable_metadata
generate_video_embeddings_params:
  chunk_duration: 10
