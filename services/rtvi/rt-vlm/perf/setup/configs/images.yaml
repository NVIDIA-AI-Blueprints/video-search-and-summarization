# Support images only; ARTIFACT_REF controls the tested service.
# Values preserve current defaults and do not attest OSRB approval.
schema_version: 1
images:
  dcgm-exporter:
    ref: nvcr.io/nvidia/k8s/dcgm-exporter:4.2.0-4.1.0-ubuntu22.04
  node-exporter:
    ref: prom/node-exporter:latest
  prometheus:
    ref: prom/prometheus:latest
  vss-vios-streamprocessing:
    ref: nvcr.io/nvidia/vss-core/vss-vios-streamprocessing:3.2.0
  vss-vios-sensor:
    ref: nvcr.io/nvidia/vss-core/vss-vios-sensor:3.2.0
  vss-vios-ingress:
    ref: nvcr.io/nvidia/vss-core/vss-vios-ingress:3.2.0
  vss-vios-nvstreamer:
    ref: nvcr.io/nvidia/vss-core/vss-vios-nvstreamer:3.2.0
  postgres:
    ref: postgres:17.10-alpine
  redis:
    ref: redis:8.10.0-alpine
scopes:
  compose:
    compose.perf.yaml:
      services:
        dcgm-exporter: dcgm-exporter
        node-exporter: node-exporter
        prometheus: prometheus
  vios:
    docker-compose.yaml:
      services:
        centralizedb: postgres
        redis: redis
environment:
  VST_STREAMPROCESSING_IMAGE: vss-vios-streamprocessing
  VST_SENSOR_IMAGE: vss-vios-sensor
  VST_INGRESS_IMAGE: vss-vios-ingress
  VST_NVSTREAMER_IMAGE: vss-vios-nvstreamer
  POSTGRES_IMAGE: postgres
  REDIS_IMAGE: redis
