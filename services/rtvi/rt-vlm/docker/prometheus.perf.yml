# Prometheus scrape config for perf benchmarking.
# Differs from prometheus.yml: no otel-collector target (otel-collector is not
# started in compose.perf.yaml), which avoids scrape errors at startup.

global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  # Scrape GPU metrics from DCGM Exporter
  - job_name: "dcgm-exporter"
    scrape_interval: 1s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["dcgm-exporter:9400"]

  # Scrape CPU and system metrics from Node Exporter
  # Longer interval: filesystem collector can be slow on machines with NFS/network mounts
  - job_name: "node-exporter"
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["node-exporter:9100"]

  # Scrape metrics from Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
