# Docker-only dependencies for the NGC PyTorch base image
# (nvcr.io/nvidia/pytorch:25.11-py3).
#
# The base already ships CUDA-aligned numpy, scipy, matplotlib, scikit-learn,
# pandas, requests, protobuf, grpcio, torch, torchvision, tensorrt, Pillow,
# and pydantic. Those, and the packages that belong to that same base stack,
# are listed under tool.uv.exclude-dependencies so a lock/install does not
# replace them. pydantic, pillow, and protobuf stay direct dependencies at the
# versions this tree runs, so the OSRB inventory has one pin for each.
# Excluding them keeps the NGC and Dockerfile copies in place.
# typing-extensions is installed: anyio 4.15.1 imports typing_extensions.sentinel,
# which needs typing_extensions>=4.16.0, newer than the copy in the base image.
#
# Transitive pins that are open in the parent metadata are forced in
# tool.uv.override-dependencies. starlette is pinned for the nSpect fixes
# GHSA-82w8-qh3p-5jfq, GHSA-wqp7-x3pw-xc5r, and GHSA-7f5h-v6xp-fcq8.
#
# uv.lock is the lockfile. To add or bump a package, from this directory:
#   uv lock --upgrade-package <name>
#   uv export --frozen --no-dev --no-hashes --no-emit-project --no-header -o requirements.txt
# Keep the SPDX header at the top of requirements.txt when regenerating it.

[project]
name = "reid-service"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.32.1",
    "pydantic==2.4.2",
    "pillow==12.3.0",
    "protobuf==6.33.5",
    "pymilvus==3.0.1",
    "kafka-python==2.3.2",
    "redis==8.1.0",
    "faiss-cpu==1.13.2",
    "pycuda==2026.1",
]

[tool.uv]
package = false
managed = true
exclude-dependencies = [
    # CUDA / NGC PyTorch stack. Reinstalling these breaks the base image.
    "torch",
    "torchvision",
    "torchaudio",
    "tensorrt",
    "triton",
    "numpy",
    "scipy",
    "matplotlib",
    "scikit-learn",
    "pandas",
    "pillow",
    "protobuf",
    "grpcio",
    "requests",
    # Installed with the packages above; leave the base copies in place.
    "pydantic",
    "pydantic-core",
    "annotated-types",
    "packaging",
    "idna",
    "six",
    "python-dateutil",
]
override-dependencies = [
    "starlette==1.3.1",
    "anyio==4.15.1",
    "annotated-doc==0.0.5",
    "typing-inspection==0.4.4",
    "cachetools==7.1.6",
    "mako==1.3.12",
    "orjson==3.11.9",
    "python-dotenv==1.2.2",
    "pytools==2026.1.1",
    "siphash24==1.8",
]
