[pytest]
# RTVI-CV-MV3DT config-init test suite.
#   unit        - pure-Python tests (linear algebra, config generators); no docker
#   integration - exercise the built vss-rt-cv-mv3dt-config-init image; needs docker
markers =
    unit: pure-Python tests, no docker required
    integration: run the config-init image against sample calibration data
    slow: long-running tests

addopts = -ra
testpaths = unit integration
# Keep the cache out of the repo so root-owned container runs don't clash with host runs.
cache_dir = /tmp/mv3dt_config_init_pytest_cache
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(message)s
