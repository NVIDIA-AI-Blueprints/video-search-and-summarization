# Mosquitto broker config for the MV3DT testbed (used by pipeline0/1 run.sh and
# pipeline2 brokers-compose.yml; the port is supplied with `-p`).
#
# allow_anonymous: no auth, same as the image's bundled /mosquitto-no-auth.conf.
# set_tcp_nodelay: disable Nagle's algorithm on the broker's TCP sockets. Without it,
#   the small MV3DT /trck/* messages get coalesced by Nagle and per-message latency
#   spikes badly — this is the key setting that keeps cross-camera MQTT latency low.
allow_anonymous true
set_tcp_nodelay true
