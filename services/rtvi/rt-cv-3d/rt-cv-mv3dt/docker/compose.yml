# RT-CV-3D (MV3DT) minimal standalone stack.
#
#   perception     VSS-RT-CV: RT-DETR + MV3DT tracker, Kafka sink → mdx-raw (REST :9000)
#   bev-fusion     VSS-RT-CV-BEV-Fusion: consumes mdx-raw → publishes fused mdx-bev
#   mosquitto      optional MQTT broker for MV3DT /trck/* — COMPOSE_PROFILES+=mosquitto
#                  (omit if you have your own broker; set MQTT_HOST/MQTT_PORT instead)
#   kafka          optional single-node KRaft broker + topic init — COMPOSE_PROFILES+=kafka
#                  (omit if you have your own broker; set KAFKA_BOOTSTRAP instead)
#   reid-*         optional ReID service + Milvus dependencies — COMPOSE_PROFILES+=reid
#                  (the service consumes mdx-raw and the tracker queries it on :8088)
#
# No streaming front-end is included: bring your own synchronized RTSP streams and
# register them at runtime with scripts/add-streams.sh (see README).
#
# Configuration comes from .env in this directory. Stage the per-run config dir
# first, then launch from this directory (see README §3):
#   ../scripts/stage-configs.sh
#   COMPOSE_PROFILES=mosquitto,kafka docker compose up -d

services:
  perception:
    image: ${PERCEPTION_IMAGE:-ghcr.io/nvidia-ai-blueprints/vss/vss-rt-cv}:${PERCEPTION_TAG:-develop-latest}
    container_name: vss-rtvi-cv-mv3dt
    network_mode: host
    runtime: nvidia
    shm_size: "6gb"
    environment:
      STREAM_TYPE: kafka
      DS_HTTP_PORT: "${DS_HTTP_PORT:-9000}"
      MQTT_HOST: ${MQTT_HOST:-localhost}
      MQTT_PORT: ${MQTT_PORT:-1883}
      # Not used to configure Kafka, which is staged into the main config. Passed
      # so the container can tell a stale staged endpoint from a current one.
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-localhost:9092}
      RAW_TOPIC: ${RAW_TOPIC:-mdx-raw}
      REID_ENABLED: "${REID_ENABLED:-0}"
      REID_SERVICE_HOST: ${REID_SERVICE_HOST:-127.0.0.1}
      REID_SERVICE_PORT: "${REID_SERVICE_PORT:-8088}"
      REID_RESET_BEFORE_RUN: "${REID_RESET_BEFORE_RUN:-1}"
      REID_READY_TIMEOUT_SEC: "${REID_READY_TIMEOUT_SEC:-300}"
      REID_DIMENSION: "${REID_DIMENSION:-1280}"
      REID_EXTRACTION_INTERVAL: "${REID_EXTRACTION_INTERVAL:-8}"
      REID_INPUT_TOPIC: ${REID_INPUT_TOPIC:-mdx-raw}
      DEEPSTREAM_ENABLE_SENSOR_ID_EXTRACTION: "0"
      GST_ENABLE_CUSTOM_PARSER_MODIFICATIONS: 1
      OTEL_SDK_DISABLED: "true"
      DISPLAY: ${DISPLAY:-:0}
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      NVIDIA_VISIBLE_DEVICES: ${GPU_DEVICE:-0}
    volumes:
      - ${MODELS_DIR:?set MODELS_DIR in docker/.env}/mtmc:/opt/storage
      - ${MODELS_DIR}/mv3dt/BodyPose3DNet:/opt/storage/BodyPose3DNet
      - ${MODELS_DIR}/reid:/opt/storage/reid:ro
      - ../generated/configs:/opt/nvidia/deepstream/deepstream/sources/apps/sample_apps/metropolis_perception_app/configs:ro
      - ../generated/camInfo:/tmp/camInfo:ro
      - ./init-scripts/ds-start-mv3dt.sh:/opt/nvidia/deepstream/deepstream/sources/apps/sample_apps/metropolis_perception_app/ds-start-mv3dt.sh:ro
      # X11 socket for the optional on-screen display (OSD=1 staging); harmless headless.
      - /tmp/.X11-unix:/tmp/.X11-unix
      # Local video files for INPUT_MODE=file (read-only). Harmless '.' default when
      # unused (stream mode); set VIDEO_DIR in .env to your <sensor_id>.mp4 directory.
      - ${VIDEO_DIR:-.}:/videos:ro
      # Saved perception videos for SAVE_VIDEO=1 (grid-view + per-camera mp4s).
      - ../video-output:/video-output
    command: ["./ds-start-mv3dt.sh"]
    # Wait for the bundled brokers when their profiles are enabled (the MV3DT
    # tracker fails at startup if MQTT is unreachable; the kafka sink needs the
    # broker). `required: false` skips the dependency when the profile is off
    # (own-broker deployments).
    depends_on:
      mosquitto:
        condition: service_healthy
        required: false
      kafka:
        condition: service_healthy
        required: false
      reid-embed:
        condition: service_healthy
        required: false
    # Uncomment for OSD on x86 if the log shows "Failed to query drm device" or
    # "failed to create dri[N] screen". Kept commented for hosts with no DRM
    # node, headless included.
    # devices:
    #   - /dev/dri

  bev-fusion:
    image: ${BEV_FUSION_IMAGE:-ghcr.io/nvidia-ai-blueprints/vss/vss-rt-cv-mv3dt-bev-fusion}:${BEV_FUSION_TAG:-develop-latest}
    container_name: vss-rtvi-cv-bev-fusion
    network_mode: host
    restart: always
    environment:
      BROKER_TYPE: kafka
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP:-localhost:9092}
      RAW_TOPIC: ${RAW_TOPIC:-mdx-raw}
      FUSED_TOPIC: ${FUSED_TOPIC:-mdx-bev}
      SENSOR_TIMEOUT_MS: "100"
      MAX_EXPECTED_SENSORS: ${NUM_CAMS:?set NUM_CAMS in docker/.env}
      BUFFER_DURATION_S: "2.0"
      FUSION_METHOD: ${FUSION_METHOD:-rays}
      VISIBILITY_MIN: ${VISIBILITY_MIN:-0.3}
      MAX_DIST: ${MAX_DIST:-25}
      TEMPORAL_FILTER: ${TEMPORAL_FILTER:-1}
      PIXEL_SIGMA: ${PIXEL_SIGMA:-3.0}
      ACCEL_SIGMA: ${ACCEL_SIGMA:-3.0}
      # "auto" measures it from overlapping views; "off" or metres to pin it.
      FOOT_OFFSET: ${FOOT_OFFSET:-auto}
      # Views of one id further apart than this are different people. 0 disables.
      CONFLICT_RADIUS: ${CONFLICT_RADIUS:-2.0}
      # Buckets of publish delay to let a backward pass run. 0 is causal.
      SMOOTH_LAG: ${SMOOTH_LAG:-0}
      CALIBRATION_PATH: /calibration/calibration.json
    volumes:
      # Camera geometry. closest refuses to start without it and rays
      # fuses worse; the baselines ignore it. Staging writes this file, so it
      # tracks the dataset the deployment was staged for.
      - ../generated/calibration.json:/calibration/calibration.json:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import os,sys; sys.exit(0 if os.path.isfile('/tmp/fusion_ready') else 1)"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 10s
    depends_on:
      kafka:
        condition: service_healthy
        required: false

  # ── Optional brokers (enable via COMPOSE_PROFILES; skip if you run your own) ──

  mosquitto:
    image: ${MOSQUITTO_IMAGE:-eclipse-mosquitto:2}
    container_name: vss-mosquitto-mv3dt
    profiles: ["mosquitto"]
    network_mode: host
    restart: unless-stopped
    volumes:
      # set_tcp_nodelay in this conf is the key setting that keeps the small
      # MV3DT /trck/* messages low-latency (defeats Nagle coalescing).
      - ../configs/mosquitto.conf:/mosquitto.conf:ro
    command: ["mosquitto", "-c", "/mosquitto.conf", "-p", "${MQTT_PORT:-1883}"]
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-p", "${MQTT_PORT:-1883}", "-t", "health", "-m", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 3s

  kafka:
    image: ${KAFKA_IMAGE:-confluentinc/cp-kafka:8.2.0}
    container_name: kafka
    profiles: ["kafka"]
    network_mode: host
    restart: unless-stopped
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@localhost:${KAFKA_CONTROLLER_PORT:-9093}"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:${KAFKA_PORT:-9092},CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT:-9093}"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:${KAFKA_PORT:-9092}"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_MESSAGE_MAX_BYTES: 10485760
      KAFKA_HEAP_OPTS: "-Xmx4G -Xms4G"
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:${KAFKA_PORT:-9092}", "--list"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s

  # Pre-create the topics perception + bev-fusion use (auto-create is also on, but
  # creating them up front avoids first-message races).
  kafka-topic-init:
    image: ${KAFKA_IMAGE:-confluentinc/cp-kafka:8.2.0}
    container_name: kafka-topic-init
    profiles: ["kafka"]
    network_mode: host
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        topics="${RAW_TOPIC:-mdx-raw} ${FUSED_TOPIC:-mdx-bev}"
        case "${REID_ENABLE_COMPRESSION:-False}" in
          [Tt][Rr][Uu][Ee]|1|[Yy][Ee][Ss]) topics="$$topics ${REID_OUTPUT_TOPIC:-mdx-compressed-embeddings}" ;;
        esac
        for t in $$topics; do
          kafka-topics --bootstrap-server localhost:${KAFKA_PORT:-9092} --create --if-not-exists \
            --topic "$$t" --partitions 1 --replication-factor 1
        done
        echo "topics:" && kafka-topics --bootstrap-server localhost:${KAFKA_PORT:-9092} --list
    restart: "no"

  # ── Optional ReID service (enable with COMPOSE_PROFILES+=reid) ─────────────

  # Milvus metadata store. This and MinIO remain private to reid-network.
  reid-etcd:
    image: ${REID_ETCD_IMAGE:-quay.io/coreos/etcd:v3.5.18}
    container_name: vss-reid-etcd-rtcv
    profiles: ["reid"]
    restart: unless-stopped
    networks: [reid-network]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >-
      etcd --advertise-client-urls=http://reid-etcd:2379
      --listen-client-urls=http://0.0.0.0:2379 --data-dir=/etcd
    volumes:
      - reid-etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  reid-minio:
    image: ${REID_MINIO_IMAGE:-minio/minio:RELEASE.2023-03-20T20-16-18Z}
    container_name: vss-reid-minio-rtcv
    profiles: ["reid"]
    restart: unless-stopped
    networks: [reid-network]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: ["minio", "server", "/minio_data", "--console-address", ":9001", "--address", ":9000"]
    volumes:
      - reid-minio-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  reid-milvus:
    image: ${REID_MILVUS_IMAGE:-milvusdb/milvus:v2.5.12}
    container_name: vss-reid-milvus-rtcv
    profiles: ["reid"]
    restart: unless-stopped
    networks: [reid-network]
    depends_on:
      reid-etcd:
        condition: service_healthy
      reid-minio:
        condition: service_healthy
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: reid-etcd:2379
      MINIO_ADDRESS: reid-minio:9000
    command: ["milvus", "run", "standalone"]
    volumes:
      - reid-milvus-data:/var/lib/milvus
    # reid-embed uses host networking so it can consume the bundled Kafka
    # broker's localhost advertisement. Publish only Milvus' gRPC endpoint.
    ports:
      - "127.0.0.1:${REID_MILVUS_PORT:-19530}:19530"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 90s

  reid-embed:
    image: ${REID_EMBED_IMAGE:-nvcr.io/nvstaging/vss-core/reid-embed}:${REID_EMBED_TAG:-3.3.0-26.08.2}
    container_name: vss-reid-embed-rtcv
    profiles: ["reid"]
    network_mode: host
    runtime: nvidia
    ipc: host
    restart: unless-stopped
    depends_on:
      reid-milvus:
        condition: service_healthy
      kafka:
        condition: service_healthy
        required: false
      kafka-topic-init:
        condition: service_completed_successfully
        required: false
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      - ${MODELS_DIR:?set MODELS_DIR in docker/.env}/reid:/opt/storage/reid:ro
    environment:
      REID_SERVICE_HOST: ${REID_SERVICE_HOST:-127.0.0.1}
      REID_SERVICE_PORT: "${REID_SERVICE_PORT:-8088}"
      MESSAGE_BROKER: kafka
      KAFKA_CONSUMER_SERVER: ${KAFKA_BOOTSTRAP:-localhost:9092}
      KAFKA_CONSUMER_TOPIC: ${REID_INPUT_TOPIC:-mdx-raw}
      KAFKA_PRODUCER_SERVER: ${KAFKA_BOOTSTRAP:-localhost:9092}
      KAFKA_PRODUCER_TOPIC: ${REID_OUTPUT_TOPIC:-mdx-compressed-embeddings}
      MILVUS_HOST: 127.0.0.1
      MILVUS_PORT: "${REID_MILVUS_PORT:-19530}"
      DIMENSION: "${REID_DIMENSION:-1280}"
      DEEPSTREAM_SCHEMA: protobuf
      ENABLE_COMPRESSION: "${REID_ENABLE_COMPRESSION:-False}"
      ENABLE_SECONDARY_EMBEDDING: "${REID_ENABLE_SECONDARY_EMBEDDING:-False}"
      CLEAN_RESTART: "${REID_CLEAN_RESTART:-False}"
      PYTHONUNBUFFERED: "1"
      NVIDIA_VISIBLE_DEVICES: ${GPU_DEVICE:-0}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${REID_SERVICE_PORT:-8088}/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  reid-etcd-data:
  reid-minio-data:
  reid-milvus-data:

networks:
  reid-network:
