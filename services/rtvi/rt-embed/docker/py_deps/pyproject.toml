requires-python = "==3.12.*"


[tool.pdm]
distribution = false
include-system-site-packages = true
ignore_packages = ["torch", "torchvision", "tensorrt", "triton"]

[project.optional-dependencies]
amd64 = [
]
arm64 = [
]

[[tool.pdm.source]]
name = "pypi"
url = "https://pypi.org/simple/"
verify_ssl = true

[[tool.pdm.source]]
name = "nvidia"
url = "https://pypi.nvidia.com"
verify_ssl = true
# nvidia-ml-py is published on the primary PyPI index, so do not route all
# nvidia-* names through this index.
include_packages = ["tensorrt*", "cudf-*", "cuml-*"]

[tool.pdm.resolution]
excludes = ["torch", "torchvision", "ffmpeg", "intel-openmp", "flash_attn", "tensorrt", "triton"]

[tool.pdm.resolution.overrides]
langchain-core = "==0.3.81"
langchain = "==0.3.27"
langchain-nvidia-ai-endpoints = "==0.3.14"
langchain-openai = "==0.3.29"
langchain_milvus = "==0.2.1"
langchain-huggingface = "==0.3.1"
langchain-experimental = "==0.3.4"
langchain-community = "==0.3.27"
protobuf = "==6.33.6"
transformers = "==4.57.5"
grpcio = "==1.78.0"
grpcio-reflection = "==1.78.0"
numpy = "==2.1.0"
