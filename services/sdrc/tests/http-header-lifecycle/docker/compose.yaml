#
# Minimal SDRC + RTVI-CV test application for the HTTP-header lifecycle flow.
#
# Run from this directory:
#   VSS_APPS_DIR=/path/to/video-search-and-summarization/deploy/docker \
#   VSS_DATA_DIR=/path/to/vss-warehouse-app-data \
#   HOST_IP=127.0.0.1 \
#   HARDWARE_PROFILE=dGPU \
#   docker compose up
#
# The SDRC workload config is local to ./configs/config.yml. Runtime files are
# written only to this directory's ./.generated path so warehouse blueprint
# trees are not mutated.

name: sdrc-http-header-lifecycle

services:
  redis:
    image: redis:8.6.2-alpine
    container_name: sdrc-http-header-redis
    ports:
      - ${REDIS_HOST_PORT:-6379}:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  sdr-controller:
    image: ${SDR_MW_L_IMAGE:-sdr-mw-l:local}
    container_name: sdr-controller
    ports:
      # SDRC router API for workload-scoped lifecycle calls.
      - ${SDRC_CONTROLLER_HOST_PORT:-5003}:5003
      # RTVI-CV workload listener generated from WDM_MS_LISTENER_PORT=10001.
      # Example: /api/v1/stream/add on this listener.
      - ${SDRC_RTVI_CV_PROXY_HOST_PORT:-10001}:10001
      # Direct SDRC listener and Envoy admin.
      - ${SDRC_DIRECT_HOST_PORT:-8011}:8011
      - ${SDRC_ENVOY_ADMIN_HOST_PORT:-9902}:9902
    restart: unless-stopped
    environment:
      WDM_WORKLOADS_CONFIG: /configs/config.yml
      WDM_WL_REDIS_SERVER: redis
      WDM_WL_REDIS_PORT: 6379
      WDM_CONTROLLER_HOST: sdr-controller
      WDM_CONTROLLER_PORT: 5003
      WDM_SDRC_DIRECT_LISTENER_PORT: 8011
      ENVOY_ADMIN_PORT: 9902
      PORT: 5003
      ROUTER_PORT: 5003
      WDM_CLUSTER_TYPE: docker
      OTEL_SDK_DISABLED: "true"
    volumes:
      - ./.generated/log:/logs
      - ./configs:/configs:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      redis:
        condition: service_healthy
      perception:
        condition: service_started

  perception:
    extends:
      file: ${VSS_APPS_DIR:?Set VSS_APPS_DIR to the deploy/docker directory}/services/rtvi/rtvi-cv/compose.yaml
      service: perception
    container_name: vss-rtvi-cv
    volumes:
      - ${VSS_APPS_DIR:?Set VSS_APPS_DIR to the deploy/docker directory}/industry-profiles/warehouse-operations/warehouse-2d-app/deepstream/configs:/opt/nvidia/deepstream/deepstream/sources/apps/sample_apps/metropolis_perception_app/configs/:ro
      - ${VSS_DATA_DIR:?Set VSS_DATA_DIR to the warehouse app data root}/models/mtmc:/opt/storage/
    environment:
      GST_PLUGIN_PATH: /opt/nvidia/deepstream/deepstream/sources/gst-plugins/gst-nvdstextembedder
      TRANSFORMERS_OFFLINE: 0
      HF_HUB_OFFLINE: 0
      DS_MODEL_FAMILY: rtdetr-warehouse
      DS_MODE_FLAG: "1"
      DS_TRACKER_REID: "false"
      DS_SHOW_SENSOR_ID: "false"
      STREAM_TYPE: redis
      HARDWARE_PROFILE: ${HARDWARE_PROFILE:-dGPU}
      OTEL_SDK_DISABLED: "true"
