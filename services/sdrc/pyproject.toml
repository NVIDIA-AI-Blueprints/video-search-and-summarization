[project]
name = "sdrc"
version = "3.0.0"
description = "SDRC - Stream Distribution and Routing Controller"
requires-python = ">=3.10,<3.11"
dependencies = [
    "kubernetes==31.0.0",
    "werkzeug==3.1.8",
    "Flask==3.1.3",
    "simple-settings==1.2.0",
    "flask-kafka==0.0.3",
    "kafka-python==2.3.0",
    "ruamel.yaml==0.18.6",
    "redis==4.4.4",
    "python-redis-lock==4.0.0",
    "envoy-data-plane==0.8.1",
    "stringcase==1.2.0",
    "prometheus_client==0.20.0",
    "docker==7.1.0",
    "requests==2.32.3",
    "websockets>=12.0,<13.0",
    "dotmap==1.3.30",
    "kopf==1.37.1",
    "Jinja2==3.1.4",
    "opentelemetry-api==1.27.0",
    "opentelemetry-sdk==1.27.0",
    "opentelemetry-exporter-otlp-proto-grpc==1.27.0",
    "opentelemetry-exporter-otlp==1.27.0",
    "protobuf==3.20.0",
    "dnspython==2.7.0",
    "flask-swagger-ui==5.21.0",
    "backports.tarfile",
]

[dependency-groups]
dev = [
    "pyinstaller==6.11.1",
    "pyinstaller-hooks-contrib==2024.10",
]

[tool.uv]
managed = true
constraint-dependencies = [
    "setuptools>=78.1.1,<81",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["*.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
