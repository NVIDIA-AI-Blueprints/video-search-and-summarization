<!-- Same as flask_swagger_ui index but asset + spec URLs are relative so Swagger works behind a path prefix (e.g. /sdrc/<wl>/api/docs/). -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <base href="{{ swagger_ui_base }}">
  <title>{{ app_name }}</title>
  <link rel="stylesheet" type="text/css" href="index.css">
  <link rel="stylesheet" type="text/css" href="swagger-ui.css">
  <link rel="icon" type="image/png" href="favicon-32x32.png" sizes="32x32" />
  <link rel="icon" type="image/png" href="favicon-16x16.png" sizes="16x16" />
</head>

<body>
  <div id="swagger-ui"></div>

  <script src="swagger-ui-bundle.js"></script>
  <script src="swagger-ui-standalone-preset.js"></script>
  <script>
    var config = {
      presets: [
        SwaggerUIBundle.presets.apis,
        SwaggerUIStandalonePreset
      ],
      plugins: [
        SwaggerUIBundle.plugins.DownloadUrl
      ]
    };
    var user_config = {{ config_json | safe }};
    for (var attrname in user_config) { config[attrname] = user_config[attrname]; }

    window.onload = function () {
      const ui = SwaggerUIBundle(config)
      {% if oauth_config_json %}
      var oauth_user_config = {{ oauth_config_json | safe }};
      ui.initOAuth(oauth_user_config);
      {% endif %}
      window.ui = ui
    }
  </script>
</body>

</html>
