[project]
name = "eval-set-worker"
version = "0.1.0"
description = "Eval-set slice consumer + summary consumer (track 11)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiokafka>=0.14.0",
    "boto3>=1.43.27",
    "deft-common",
    "elasticsearch[async]>=9.0.0",
    "pydantic-settings>=2.0.0",
]

[tool.uv.sources]
deft-common = { path = "../deft_common" }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
