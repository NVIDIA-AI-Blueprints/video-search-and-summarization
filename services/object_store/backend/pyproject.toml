[project]
name = "deft-aoi-object-store"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiokafka>=0.14.0",
    "boto3>=1.43.27",
    "deft-aoi-al-archiver",
    "deft-common",
    "elasticsearch[async]>=9.0.0",
    "fastapi[standard]>=0.136.3",
    "pydantic-settings>=2.0.0",
    "requests>=2.34.2",
]

[tool.uv.sources]
deft-aoi-al-archiver = { path = "../al_archiver" }
deft-common = { path = "../deft_common" }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
